name: linuxserver-melonds
services:
  app:
    image: linuxserver/melonds:1.1.20260907
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/melonds/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: melonDS aims at providing fast and accurate Nintendo DS emulation.
    zh_CN: melonDS 致力于提供快速且准确的 Nintendo DS 模拟体验。
  tagline:
    en_US: Aims at providing fast and accurate Nintendo DS emulation.
    zh_CN: 快速、准确的 Nintendo DS 模拟器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/melonds-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/melonds-logo.png
  title:
    en_US: Melonds (LinuxServer.io)
    zh_CN: Melonds（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservermelonds
  port_map: '3000'
  version: 1.1.20260907
