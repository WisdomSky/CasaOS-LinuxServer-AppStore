name: linuxserver-shotcut
services:
  app:
    image: linuxserver/shotcut:26.8.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Shotcut is a free, open source, cross-platform video editor.
    zh_CN: Shotcut 是一款免费、开源、跨平台的视频编辑器。
  tagline:
    en_US: A free, open source, cross-platform video editor.
    zh_CN: 免费、开源、跨平台的视频编辑器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shotcut-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shotcut-logo.png
  title:
    en_US: Shotcut (LinuxServer.io)
    zh_CN: Shotcut（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservershotcut
  port_map: '3000'
  version: 26.8.1
