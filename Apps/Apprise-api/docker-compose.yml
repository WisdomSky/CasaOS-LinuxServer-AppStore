name: linuxserver-apprise-api
services:
  app:
    image: linuxserver/apprise-api:1.5.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: APPRISE_ATTACH_SIZE
          description:
            en_US: Max attachment size in Mb. 0 disables attachments. Must have /attachments mounted to set to a positive value. [OPTIONAL]
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Apprise-api Takes advantage of Apprise through your network with a user-friendly API. * Send notifications to more than 100 services. * An incredibly lightweight gateway to Apprise. * A production ready micro-service at your disposal. * A Simple Website to verify and test your configuration with. Apprise API was designed to easily fit into existing (and new) eco-systems that are looking for a simple notification solution.
    ca_ES: Apprise-api Aprofita Apprise a través de la vostra xarxa amb una API fàcil d'utilitzar. * Envieu notificacions a més de 100 serveis. * Una porta d'entrada increïblement lleugera a Apprise. * Un microservei llest per a la producció a la vostra disposició. * Un lloc web senzill per verificar i provar la vostra configuració. L'API d'Appprise es va dissenyar per adaptar-se fàcilment als ecosistemes existents (i nous) que busquen una solució de notificació senzilla.
    cs_CZ: Apprise-api Využívá výhody Apprise prostřednictvím vaší sítě s uživatelsky přívětivým API. * Odesílání oznámení do více než 100 služeb. * Neuvěřitelně lehká brána do Apprise. * Mikroslužba připravená k provozu k dispozici. * Jednoduchý web pro ověření a testování vaší konfigurace. Apprise API bylo navrženo tak, aby se snadno začlenilo do stávajících (i nových) ekosystémů, které hledají jednoduché řešení pro oznámení.
    da_DK: Apprise-api Udnytter Apprise via dit netværk med en brugervenlig API. * Send notifikationer til mere end 100 tjenester. * En utrolig let gateway til Apprise. * En produktionsklar mikrotjeneste til din rådighed. * En simpel hjemmeside til at verificere og teste din konfiguration med. Apprise API er designet til nemt at passe ind i eksisterende (og nye) økosystemer, der leder efter en simpel notifikationsløsning.
    de_DE: Die Apprise-API ermöglicht die Nutzung von Apprise über Ihr Netzwerk mit einer benutzerfreundlichen API. * Senden Sie Benachrichtigungen an über 100 Dienste. * Ein extrem schlankes Gateway zu Apprise. * Ein produktionsreifer Microservice steht Ihnen zur Verfügung. * Eine einfache Website zum Überprüfen und Testen Ihrer Konfiguration. Die Apprise-API wurde entwickelt, um sich nahtlos in bestehende (und neue) Ökosysteme zu integrieren, die eine einfache Benachrichtigungslösung suchen.
    el_GR: Apprise-api Αξιοποιεί το Apprise μέσω του δικτύου σας με ένα φιλικό προς το χρήστη API. * Στείλτε ειδοποιήσεις σε περισσότερες από 100 υπηρεσίες. * Μια απίστευτα ελαφριά πύλη για το Apprise. * Μια μικρο-υπηρεσία έτοιμη για παραγωγή στη διάθεσή σας. * Ένας απλός ιστότοπος για επαλήθευση και δοκιμή της διαμόρφωσής σας. Το Apprise API σχεδιάστηκε για να ταιριάζει εύκολα σε υπάρχοντα (και νέα) οικοσυστήματα που αναζητούν μια απλή λύση ειδοποιήσεων.
    en_GB: Apprise-api Takes advantage of Apprise through your network with a user-friendly Api. * Send notifications to more than 100 services. * An incredibly lightweight gateway to Apprise. * A production ready micro-service at your disposal. * A Simple Website to verify and test your configuration with. Apprise Api was designed to easily fit into existing (and new) eco-systems that are looking for a simple notification solution.
    es_ES: Apprise-api aprovecha Apprise a través de tu red con una API fácil de usar. * Envía notificaciones a más de 100 servicios. * Una puerta de enlace increíblemente ligera a Apprise. * Un microservicio listo para producción a tu disposición. * Un sitio web sencillo para verificar y probar tu configuración. La API de Apprise fue diseñada para integrarse fácilmente en ecosistemas existentes (y nuevos) que buscan una solución de notificación simple.
    fr_FR: Apprise-api vous permet d'exploiter Apprise au sein de votre réseau grâce à une API conviviale. * Envoyez des notifications à plus de 100 services. * Une passerelle ultra-légère vers Apprise. * Un microservice prêt à l'emploi. * Un site web simple pour vérifier et tester votre configuration. L'API Apprise a été conçue pour s'intégrer facilement aux écosystèmes existants (et nouveaux) à la recherche d'une solution de notification simple.
    ga_IE: Baineann Apprise-api leas as Apprise trí do líonra le API atá furasta le húsáid. * Seol fógraí chuig níos mó ná 100 seirbhís. * Geata thar a bheith éadrom chuig Apprise. * Micreasheirbhís réidh le haghaidh táirgeachta ar fáil duit. * Suíomh Gréasáin Simplí chun do chumraíocht a fhíorú agus a thástáil leis. Dearadh Apprise API chun go n-oirfeadh sé go héasca d'éiceachórais atá ann cheana féin (agus nua) atá ag lorg réiteach fógra simplí.
    hr_HR: Apprise-api koristi Apprise putem vaše mreže s jednostavnim API-jem. * Šalje obavijesti na više od 100 servisa. * Nevjerojatno lagan pristupnik Appriseu. * Mikro-usluga spremna za produkciju na raspolaganju. * Jednostavna web stranica za provjeru i testiranje vaše konfiguracije. Apprise API dizajniran je kako bi se lako uklopio u postojeće (i nove) ekosustave koji traže jednostavno rješenje za obavještavanje.
    hu_HU: Apprise-api Az Apprise előnyeit használja ki a hálózatán keresztül egy felhasználóbarát API-val. * Értesítéseket küldhet több mint 100 szolgáltatásnak. * Hihetetlenül könnyű átjáró az Apprise-hoz. * Egy éles üzemre kész mikroszolgáltatás áll rendelkezésére. * Egy egyszerű weboldal a konfiguráció ellenőrzéséhez és teszteléséhez. Az Apprise API-t úgy tervezték, hogy könnyen illeszkedjen a meglévő (és új) ökoszisztémákba, amelyek egyszerű értesítési megoldást keresnek.
    it_IT: Apprise-api sfrutta Apprise attraverso la tua rete con un'API intuitiva. * Invia notifiche a oltre 100 servizi. * Un gateway incredibilmente leggero per Apprise. * Un microservizio pronto per la produzione a tua disposizione. * Un semplice sito web per verificare e testare la tua configurazione. L'API di Apprise è stata progettata per integrarsi facilmente negli ecosistemi esistenti (e nuovi) che cercano una soluzione di notifica semplice.
    ja_JP: Apprise-api は、使いやすい API を使用して、ネットワーク経由で Apprise を活用できます。* 100 を超えるサービスに通知を送信できます。* Apprise への非常に軽量なゲートウェイです。* 本番環境ですぐに使用できるマイクロサービスが利用可能です。* 設定を確認およびテストするためのシンプルな Web サイトがあります。Apprise API は、シンプルな通知ソリューションを探している既存 (および新規) のエコシステムに簡単に適合するように設計されています。
    ko_KR: Apprise-api는 사용자 친화적인 API를 통해 네트워크를 활용하여 Apprise를 사용할 수 있도록 지원합니다. * 100개 이상의 서비스로 알림을 전송할 수 있습니다. * Apprise에 대한 매우 가벼운 게이트웨이입니다. * 바로 사용 가능한 마이크로서비스를 제공합니다. * 설정을 확인하고 테스트할 수 있는 간편한 웹사이트를 제공합니다. Apprise API는 간단한 알림 솔루션을 찾는 기존(및 신규) 생태계에 쉽게 통합될 수 있도록 설계되었습니다.
    ml_IN: ഉപയോക്തൃ-സൗഹൃദ API ഉപയോഗിച്ച് നിങ്ങളുടെ നെറ്റ്‌വർക്കിലൂടെ Apprise-api പ്രയോജനപ്പെടുത്തുന്നു. * 100-ലധികം സേവനങ്ങളിലേക്ക് അറിയിപ്പുകൾ അയയ്ക്കുക. * Apprise-ലേക്കുള്ള അവിശ്വസനീയമാംവിധം ഭാരം കുറഞ്ഞ ഗേറ്റ്‌വേ. * നിങ്ങളുടെ കൈവശമുള്ള ഒരു പ്രൊഡക്ഷൻ റെഡി മൈക്രോ-സർവീസ്. * നിങ്ങളുടെ കോൺഫിഗറേഷൻ പരിശോധിക്കുന്നതിനും പരിശോധിക്കുന്നതിനുമുള്ള ഒരു ലളിതമായ വെബ്‌സൈറ്റ്. ലളിതമായ ഒരു അറിയിപ്പ് പരിഹാരം തേടുന്ന നിലവിലുള്ള (പുതിയ) ഇക്കോ-സിസ്റ്റമുകളിലേക്ക് എളുപ്പത്തിൽ യോജിക്കുന്ന തരത്തിലാണ് Apprise API രൂപകൽപ്പന ചെയ്തിരിക്കുന്നത്.
    nb_NO: Apprise-api Utnytter Apprise gjennom nettverket ditt med et brukervennlig API. * Send varsler til mer enn 100 tjenester. * En utrolig lett gateway til Apprise. * En produksjonsklar mikrotjeneste til din disposisjon. * Et enkelt nettsted for å verifisere og teste konfigurasjonen din med. Apprise API ble designet for å enkelt passe inn i eksisterende (og nye) økosystemer som ser etter en enkel varslingsløsning.
    nl_NL: Apprise-API maakt optimaal gebruik van Apprise via uw netwerk met een gebruiksvriendelijke API. * Verstuur notificaties naar meer dan 100 services. * Een ongelooflijk lichtgewicht gateway naar Apprise. * Een productiegereed microservice tot uw beschikking. * Een eenvoudige website om uw configuratie te verifiëren en te testen. De Apprise API is ontworpen om gemakkelijk te integreren in bestaande (en nieuwe) ecosystemen die op zoek zijn naar een eenvoudige notificatieoplossing.
    pl_PL: Apprise-api wykorzystuje Apprise w Twojej sieci dzięki przyjaznemu dla użytkownika interfejsowi API. * Wysyłaj powiadomienia do ponad 100 usług. * Niezwykle lekka brama do Apprise. * Mikrousługa gotowa do produkcji do Twojej dyspozycji. * Prosta strona internetowa do weryfikacji i testowania konfiguracji. Interfejs API Apprise został zaprojektowany tak, aby łatwo wpasować się w istniejące (i nowe) ekosystemy, które poszukują prostego rozwiązania do obsługi powiadomień.
    pt_BR: A API do Apprise aproveita os recursos do Apprise em sua rede com uma API fácil de usar. * Envie notificações para mais de 100 serviços. * Um gateway incrivelmente leve para o Apprise. * Um microsserviço pronto para produção à sua disposição. * Um site simples para verificar e testar sua configuração. A API do Apprise foi projetada para se integrar facilmente a ecossistemas existentes (e novos) que buscam uma solução de notificação simples.
    ro_RO: Apprise-api Profită de Apprise prin rețeaua dvs. cu o API ușor de utilizat. * Trimiteți notificări către peste 100 de servicii. * O poartă de acces incredibil de ușoară către Apprise. * Un microserviciu gata de producție la dispoziția dvs. * Un site web simplu pentru a verifica și testa configurația. API-ul Apprise a fost conceput pentru a se integra cu ușurință în ecosistemele existente (și noi) care caută o soluție simplă de notificare.
    ru_RU: Apprise-api использует возможности Apprise через вашу сеть с помощью удобного API. * Отправляйте уведомления более чем в 100 сервисов. * Невероятно легкий шлюз к Apprise. * Готовый к использованию микросервис в вашем распоряжении. * Простой веб-сайт для проверки и тестирования вашей конфигурации. Apprise API разработан для легкой интеграции в существующие (и новые) экосистемы, которые ищут простое решение для уведомлений.
    sk_SK: Apprise-api Využíva výhody Apprise prostredníctvom vašej siete s užívateľsky prívetivým API. * Posielajte notifikácie do viac ako 100 služieb. * Neuveriteľne ľahká brána do Apprise. * Mikroslužba pripravená na produkčné použitie k dispozícii. * Jednoduchá webová stránka na overenie a testovanie vašej konfigurácie. Apprise API bolo navrhnuté tak, aby sa ľahko začlenilo do existujúcich (a nových) ekosystémov, ktoré hľadajú jednoduché riešenie notifikácií.
    sv_SE: Apprise-api Drar nytta av Apprise genom ditt nätverk med ett användarvänligt API. * Skicka aviseringar till fler än 100 tjänster. * En otroligt lätt gateway till Apprise. * En produktionsklar mikrotjänst till ditt förfogande. * En enkel webbplats för att verifiera och testa din konfiguration med. Apprise API designades för att enkelt passa in i befintliga (och nya) ekosystem som letar efter en enkel aviseringslösning.
    tr_TR: Apprise-api, kullanıcı dostu bir API ile ağınız üzerinden Apprise'ın avantajlarından yararlanmanızı sağlar. * 100'den fazla servise bildirim gönderin. * Apprise'a inanılmaz derecede hafif bir ağ geçidi. * Kullanıma hazır, üretime uygun bir mikro servis. * Yapılandırmanızı doğrulamak ve test etmek için basit bir web sitesi. Apprise API, basit bir bildirim çözümü arayan mevcut (ve yeni) ekosistemlere kolayca entegre olacak şekilde tasarlanmıştır.
    zh_CN: Apprise-api 提供易于使用的 API，让你通过网络使用 Apprise。它可向超过 100 种服务发送通知，是一个轻量、可用于生产环境的 Apprise 网关微服务，并提供用于验证和测试配置的简单网页。Apprise API 旨在轻松融入需要简单通知方案的现有或新建系统。
    zh_TW: Apprise-api 提供易於使用的 API，讓你透過網路使用 Apprise。它可向超過 100 種服務傳送通知，是一個輕量、可用於生產環境的 Apprise 閘道器微服務，並提供用於驗證和測試配置的簡單網頁。Apprise API 旨在輕鬆融入需要簡單通知方案的現有或新建系統。
