    ko_KR: 사용자 친화적인 API를 통해 네트워크에서 Apprise를 활용하세요. * 100개 이상의 서비스로 알림을 전송할 수 있습니다. * Apprise에 대한 매우 가벼운 게이트웨이입니다. * 바로 사용 가능한 마이크로서비스를 제공합니다. * 설정을 확인하고 테스트할 수 있는 간편한 웹사이트를 제공합니다. Apprise API는 간단한 알림 솔루션을 찾는 기존(및 신규) 생태계에 쉽게 통합될 수 있도록 설계되었습니다.
    ml_IN: ഉപയോക്തൃ-സൗഹൃദ API ഉപയോഗിച്ച് നിങ്ങളുടെ നെറ്റ്‌വർക്കിലൂടെ അപ്രൈസിന്റെ പ്രയോജനം നേടുന്നു. * 100-ലധികം സേവനങ്ങളിലേക്ക് അറിയിപ്പുകൾ അയയ്ക്കുക. * അപ്രൈസിലേക്കുള്ള അവിശ്വസനീയമാംവിധം ഭാരം കുറഞ്ഞ ഗേറ്റ്‌വേ. * നിങ്ങളുടെ കൈവശമുള്ള ഒരു പ്രൊഡക്ഷൻ റെഡി മൈക്രോ-സർവീസ്. * നിങ്ങളുടെ കോൺഫിഗറേഷൻ പരിശോധിക്കുന്നതിനും പരിശോധിക്കുന്നതിനുമുള്ള ഒരു ലളിതമായ വെബ്‌സൈറ്റ്. ലളിതമായ ഒരു അറിയിപ്പ് പരിഹാരം തേടുന്ന നിലവിലുള്ള (പുതിയ) ഇക്കോ-സിസ്റ്റമുകളിലേക്ക് എളുപ്പത്തിൽ യോജിക്കുന്ന തരത്തിലാണ് അപ്രൈസ് API രൂപകൽപ്പന ചെയ്തിരിക്കുന്നത്.
    nb_NO: Drar nytte av Apprise gjennom nettverket ditt med et brukervennlig API. * Send varsler til mer enn 100 tjenester. * En utrolig lett gateway til Apprise. * En produksjonsklar mikrotjeneste til din disposisjon. * Et enkelt nettsted for å verifisere og teste konfigurasjonen din med. Apprise API ble designet for å enkelt passe inn i eksisterende (og nye) økosystemer som ser etter en enkel varslingsløsning.
    nl_NL: Profiteer optimaal van Apprise via uw netwerk met een gebruiksvriendelijke API. * Verstuur notificaties naar meer dan 100 services. * Een ongelooflijk lichte gateway naar Apprise. * Een productiegereed microservice tot uw beschikking. * Een eenvoudige website om uw configuratie te verifiëren en te testen. De Apprise API is ontworpen om gemakkelijk te integreren in bestaande (en nieuwe) ecosystemen die op zoek zijn naar een eenvoudige notificatieoplossing.
    pl_PL: Korzystaj z Apprise w swojej sieci za pomocą przyjaznego dla użytkownika API. * Wysyłaj powiadomienia do ponad 100 usług. * Niezwykle lekka brama do Apprise. * Mikrousługa gotowa do produkcji do Twojej dyspozycji. * Prosta strona internetowa do weryfikacji i testowania konfiguracji. API Apprise zostało zaprojektowane tak, aby łatwo wpasować się w istniejące (i nowe) ekosystemy, które poszukują prostego rozwiązania do obsługi powiadomień.
    pt_BR: Aproveite o Apprise em sua rede com uma API fácil de usar. * Envie notificações para mais de 100 serviços. * Um gateway incrivelmente leve para o Apprise. * Um microsserviço pronto para produção à sua disposição. * Um site simples para verificar e testar sua configuração. A API do Apprise foi projetada para se integrar facilmente a ecossistemas existentes (e novos) que buscam uma solução de notificação simples.
    ro_RO: Profită de Apprise prin rețeaua ta cu o API ușor de utilizat. * Trimite notificări către peste 100 de servicii. * O poartă de acces incredibil de ușoară către Apprise. * Un microserviciu gata de producție la dispoziția ta. * Un site web simplu pentru a verifica și testa configurația ta. API-ul Apprise a fost conceput pentru a se integra cu ușurință în ecosistemele existente (și noi) care caută o soluție simplă de notificare.
    ru_RU: Используйте преимущества Apprise через вашу сеть с помощью удобного API. * Отправляйте уведомления более чем в 100 сервисов. * Невероятно легкий шлюз к Apprise. * Готовый к использованию микросервис в вашем распоряжении. * Простой веб-сайт для проверки и тестирования вашей конфигурации. API Apprise разработан таким образом, чтобы легко интегрироваться в существующие (и новые) экосистемы, которые ищут простое решение для уведомлений.
    sk_SK: Využíva výhody Apprise prostredníctvom vašej siete s užívateľsky prívetivým API. * Posielajte notifikácie do viac ako 100 služieb. * Neuveriteľne ľahká brána do Apprise. * Mikroslužba pripravená na produkciu k dispozícii. * Jednoduchá webová stránka na overenie a testovanie vašej konfigurácie. Apprise API bolo navrhnuté tak, aby sa ľahko začlenilo do existujúcich (a nových) ekosystémov, ktoré hľadajú jednoduché riešenie notifikácií.
    sv_SE: Drar nytta av Apprise via ditt nätverk med ett användarvänligt API. * Skicka aviseringar till fler än 100 tjänster. * En otroligt lätt gateway till Apprise. * En produktionsklar mikrotjänst till ditt förfogande. * En enkel webbplats att verifiera och testa din konfiguration med. Apprise API har utformats för att enkelt passa in i befintliga (och nya) ekosystem som letar efter en enkel aviseringslösning.
    tr_TR: Kullanıcı dostu bir API ile ağınız üzerinden Apprise'ın avantajlarından yararlanın. * 100'den fazla servise bildirim gönderin. * Apprise'a inanılmaz derecede hafif bir ağ geçidi. * Kullanıma hazır, üretime uygun bir mikro servis. * Yapılandırmanızı doğrulamak ve test etmek için basit bir web sitesi. Apprise API, basit bir bildirim çözümü arayan mevcut (ve yeni) ekosistemlere kolayca entegre olacak şekilde tasarlanmıştır.
    zh_CN: 通过简单的 API 向百余种服务发送通知。
    zh_TW: 透過簡單的 API 向百餘種服務傳送通知。
