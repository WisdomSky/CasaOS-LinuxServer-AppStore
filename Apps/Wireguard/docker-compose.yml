name: linuxserver-wireguard
services:
  app:
    image: linuxserver/wireguard:1.0.20260223
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SERVERURL: ''
      SERVERPORT: ''
      PEERS: ''
      PEERDNS: ''
      INTERNAL_SUBNET: ''
      ALLOWEDIPS: ''
      PERSISTENTKEEPALIVE_PEERS: ''
      LOG_CONFS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: SERVERURL
          description:
            en_US: External IP or domain name for docker host. Used in server mode. If set to auto, the container will try to determine and set the external IP automatically [OPTIONAL]
        - container: SERVERPORT
          description:
            en_US: External port for docker host. Used in server mode. [OPTIONAL]
        - container: PEERS
          description:
            en_US: 'Number of peers to create confs for. Required for server mode. Can also be a list of names: myPC,myPhone,myTablet (alphanumeric only) [OPTIONAL]'
        - container: PEERDNS
          description:
            en_US: DNS server set in peer/client configs (can be set as 8.8.8.8). Used in server mode. Defaults to auto, which uses wireguard docker host's DNS via included CoreDNS forward. [OPTIONAL]
        - container: INTERNAL_SUBNET
          description:
            en_US: Internal subnet for the wireguard and server and peers (only change if it clashes). Used in server mode. [OPTIONAL]
        - container: ALLOWEDIPS
          description:
            en_US: 'The IPs/Ranges that the peers will be able to reach using the VPN connection. If not specified the default value is: ''0.0.0.0/0, ::0/0'' This will cause ALL traffic to route through the VPN, if you want split tunneling, set this to only the IPs you would like to use the tunnel AND the ip of the server''s WG ip, such as 10.13.13.1. [OPTIONAL]'
        - container: PERSISTENTKEEPALIVE_PEERS
          description:
            en_US: Set to all or a list of comma separated peers (ie. 1,4,laptop) for the wireguard server to send keepalive packets to listed peers every 25 seconds. Useful if server is accessed via domain name and has dynamic IP. Used only in server mode. [OPTIONAL]
        - container: LOG_CONFS
          description:
            en_US: Generated QR codes will be displayed in the docker log. Set to false to skip log output. [OPTIONAL]
    ports:
      - target: 51820
        published: 51820
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/wireguard/config
        target: /config
      - type: bind
        source: /lib/modules
        target: /lib/modules
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: WireGuard® is an extremely simple yet fast and modern VPN that utilizes state-of-the-art cryptography. It aims to be faster, simpler, leaner, and more useful than IPsec, while avoiding the massive headache. It intends to be considerably more performant than OpenVPN. WireGuard is designed as a general purpose VPN for running on embedded interfaces and super computers alike, fit for many different circumstances. Initially released for the Linux kernel, it is now cross-platform (Windows, macOS, BSD, iOS, Android) and widely deployable. It is currently under heavy development, but already it might be regarded as the most secure, easiest to use, and simplest VPN solution in the industry.
    ca_ES: WireGuard® és una VPN extremadament senzilla però ràpida i moderna que utilitza criptografia d'última generació. Pretén ser més ràpida, senzilla, més àgil i més útil que IPsec, evitant alhora aquest enorme maldecap. Pretén ser considerablement més eficient que OpenVPN. WireGuard està dissenyada com una VPN d'ús general per executar-se en interfícies integrades i superordinadors, adequada per a moltes circumstàncies diferents. Inicialment llançada per al nucli de Linux, ara és multiplataforma (Windows, macOS, BSD, iOS, Android) i àmpliament desplegable. Actualment està en un desenvolupament intensiu, però ja es podria considerar la solució VPN més segura, fàcil d'utilitzar i senzilla de la indústria.
    cs_CZ: WireGuard® je extrémně jednoduchá, ale rychlá a moderní VPN, která využívá nejmodernější kryptografii. Jejím cílem je být rychlejší, jednodušší, štíhlejší a užitečnější než IPsec a zároveň se vyhnout masivním problémům. Má být podstatně výkonnější než OpenVPN. WireGuard je navržen jako univerzální VPN pro běh na vestavěných rozhraních a superpočítačích, vhodná pro mnoho různých situací. Původně vydaná pro linuxové jádro, nyní je multiplatformní (Windows, macOS, BSD, iOS, Android) a široce použitelná. V současné době je ve fázi intenzivního vývoje, ale již nyní by mohla být považována za nejbezpečnější, nejsnadněji použitelné a nejjednodušší VPN řešení v oboru.
    da_DK: WireGuard® er en ekstremt simpel, men hurtig og moderne VPN, der bruger den nyeste kryptografi. Den sigter mod at være hurtigere, enklere, mere effektiv og mere brugbar end IPsec, samtidig med at den undgår den massive hovedpine. Den har til hensigt at være betydeligt mere effektiv end OpenVPN. WireGuard er designet som en generel VPN til at køre på både indlejrede grænseflader og supercomputere, og er egnet til mange forskellige omstændigheder. Den blev oprindeligt udgivet til Linux-kernen, men er nu cross-platform (Windows, macOS, BSD, iOS, Android) og bredt implementerbar. Den er i øjeblikket under kraftig udvikling, men kan allerede betragtes som den sikreste, nemmeste at bruge og enkleste VPN-løsning i branchen.
    de_DE: WireGuard® ist ein extrem einfaches, aber dennoch schnelles und modernes VPN, das modernste Kryptografie nutzt. Es ist schneller, einfacher, schlanker und nützlicher als IPsec und vermeidet dessen Komplexität. Es soll deutlich leistungsfähiger als OpenVPN sein. WireGuard ist als universelles VPN konzipiert und eignet sich sowohl für eingebettete Systeme als auch für Hochleistungsrechner – für viele verschiedene Anwendungsfälle. Ursprünglich für den Linux-Kernel entwickelt, ist es mittlerweile plattformübergreifend (Windows, macOS, BSD, iOS, Android) und weit verbreitet einsetzbar. Es befindet sich derzeit in intensiver Entwicklung, gilt aber bereits jetzt als eine der sichersten, benutzerfreundlichsten und einfachsten VPN-Lösungen der Branche.
    el_GR: Το WireGuard® είναι ένα εξαιρετικά απλό αλλά γρήγορο και σύγχρονο VPN που χρησιμοποιεί κρυπτογραφία τελευταίας τεχνολογίας. Στόχος του είναι να είναι ταχύτερο, απλούστερο, πιο λιτό και πιο χρήσιμο από το IPsec, αποφεύγοντας παράλληλα τον τεράστιο πονοκέφαλο. Στόχος του είναι να είναι σημαντικά πιο αποδοτικό από το OpenVPN. Το WireGuard έχει σχεδιαστεί ως ένα VPN γενικής χρήσης για λειτουργία σε ενσωματωμένες διεπαφές και υπερυπολογιστές, κατάλληλο για πολλές διαφορετικές περιστάσεις. Αρχικά κυκλοφόρησε για τον πυρήνα του Linux, τώρα είναι cross-platform (Windows, macOS, BSD, iOS, Android) και ευρέως αναπτυξιακό. Αυτή τη στιγμή βρίσκεται υπό έντονη ανάπτυξη, αλλά ήδη μπορεί να θεωρηθεί ως η πιο ασφαλής, ευκολότερη στη χρήση και απλούστερη λύση VPN στον κλάδο.
    en_GB: Wireguard® is an extremely simple yet fast and modern Vpn that utilizes state-of-the-art cryptography. It aims to be faster, simpler, leaner, and more useful than Ipsec, while avoiding the massive headache. It intends to be considerably more performant than Openvpn. Wireguard is designed as a general purpose Vpn for running on embedded interfaces and super computers alike, fit for many different circumstances. Initially released for the Linux kernel, it is now cross-platform (Windows, macOS, Bsd, iOS, Android) and widely deployable. It is currently under heavy development, but already it might be regarded as the most secure, easiest to use, and simplest Vpn solution in the industry.
    es_ES: WireGuard® es una VPN extremadamente sencilla, rápida y moderna que utiliza criptografía de última generación. Su objetivo es ser más rápida, simple, eficiente y útil que IPsec, evitando al mismo tiempo sus grandes complicaciones. Busca ofrecer un rendimiento considerablemente superior al de OpenVPN. WireGuard está diseñada como una VPN de propósito general para ejecutarse tanto en interfaces integradas como en supercomputadoras, adaptándose a diversas situaciones. Inicialmente lanzada para el kernel de Linux, ahora es multiplataforma (Windows, macOS, BSD, iOS, Android) y de amplia implementación. Actualmente se encuentra en pleno desarrollo, pero ya podría considerarse la solución VPN más segura, fácil de usar y sencilla del sector.
    fr_FR: WireGuard® est un VPN extrêmement simple, rapide et moderne qui utilise un chiffrement de pointe. Il vise à être plus rapide, plus simple, plus léger et plus utile qu'IPsec, tout en évitant les problèmes de configuration complexes. Il ambitionne d'être nettement plus performant qu'OpenVPN. Conçu comme un VPN polyvalent, WireGuard peut fonctionner aussi bien sur des interfaces embarquées que sur des supercalculateurs, et s'adapte à de nombreuses situations. Initialement développé pour le noyau Linux, il est désormais multiplateforme (Windows, macOS, BSD, iOS, Android) et largement déployable. Actuellement en plein développement, il peut déjà être considéré comme la solution VPN la plus sécurisée, la plus simple d'utilisation et la plus intuitive du marché.
    ga_IE: Is VPN thar a bheith simplí ach gasta agus nua-aimseartha é WireGuard® a úsáideann cripteagrafaíocht den scoth. Tá sé mar aidhm aige a bheith níos tapúla, níos simplí, níos caolchúisí agus níos úsáidí ná IPsec, agus an tinneas cinn ollmhór á sheachaint ag an am céanna. Tá sé beartaithe aige a bheith i bhfad níos feidhmiúla ná OpenVPN. Tá WireGuard deartha mar VPN ilchuspóireach le rith ar chomhéadain leabaithe agus ar shár-ríomhairí araon, atá oiriúnach do go leor cúinsí éagsúla. Scaoileadh é ar dtús don eithne Linux, ach tá sé anois tras-ardán (Windows, macOS, BSD, iOS, Android) agus is féidir é a imscaradh go forleathan. Tá forbairt throm air faoi láthair, ach d'fhéadfaí a mheas cheana féin gurb é an réiteach VPN is sláine, is éasca le húsáid agus is simplí sa tionscal é.
    hr_HR: WireGuard® je iznimno jednostavan, ali brz i moderan VPN koji koristi najsuvremeniju kriptografiju. Cilj mu je biti brži, jednostavniji, vitkiji i korisniji od IPseca, a istovremeno izbjegavati velike probleme. Namjerava biti znatno učinkovitiji od OpenVPN-a. WireGuard je dizajniran kao VPN opće namjene za pokretanje na ugrađenim sučeljima i superračunalima, pogodan za mnoge različite okolnosti. Izvorno objavljen za Linux kernel, sada je višeplatformski (Windows, macOS, BSD, iOS, Android) i široko primjenjiv. Trenutno je u intenzivnom razvoju, ali već se može smatrati najsigurnijim, najlakšim za korištenje i najjednostavnijim VPN rješenjem u industriji.
    hu_HU: A WireGuard® egy rendkívül egyszerű, mégis gyors és modern VPN, amely a legmodernebb titkosítást használja. Célja, hogy gyorsabb, egyszerűbb, karcsúbb és hasznosabb legyen, mint az IPsec, miközben elkerüli a hatalmas fejfájást. Jelentősen nagyobb teljesítményű, mint az OpenVPN. A WireGuardot általános célú VPN-ként tervezték, amely beágyazott interfészeken és szuperszámítógépeken egyaránt fut, sokféle körülményhez illeszkedve. Eredetileg Linux kernelre adták ki, de most már több platformon is elérhető (Windows, macOS, BSD, iOS, Android) és széles körben telepíthető. Jelenleg intenzív fejlesztés alatt áll, de már most is az iparág legbiztonságosabb, legkönnyebben használható és legegyszerűbb VPN-megoldásának tekinthető.
    it_IT: WireGuard® è una VPN estremamente semplice, veloce e moderna che utilizza una crittografia all'avanguardia. Il suo obiettivo è essere più veloce, semplice, snella e utile di IPsec, evitando al contempo i suoi notevoli problemi. Si propone di offrire prestazioni nettamente superiori a OpenVPN. WireGuard è progettato come VPN generica, adatta sia a interfacce embedded che a supercomputer, e si presta a diverse situazioni. Inizialmente rilasciato per il kernel Linux, è ora multipiattaforma (Windows, macOS, BSD, iOS, Android) e ampiamente implementabile. È attualmente in fase di intenso sviluppo, ma potrebbe già essere considerata la soluzione VPN più sicura, facile da usare e semplice del settore.
    ja_JP: WireGuard®は、最先端の暗号化技術を採用した、極めてシンプルでありながら高速でモダンなVPNです。IPsecよりも高速、シンプル、軽量、そして使いやすく、同時にIPsecにつきものの煩雑な設定を回避することを目指しています。OpenVPNよりもはるかに高いパフォーマンスを実現することを目標としています。WireGuardは、組み込みインターフェースからスーパーコンピュータまで、あらゆる環境で動作する汎用VPNとして設計されており、様々な状況に対応可能です。当初はLinuxカーネル向けにリリースされましたが、現在はクロスプラットフォーム（Windows、macOS、BSD、iOS、Android）に対応し、幅広いプラットフォームで展開されています。現在も活発な開発が続けられていますが、既に業界で最も安全で使いやすく、シンプルなVPNソリューションと言えるでしょう。
    ko_KR: WireGuard®는 최첨단 암호화 기술을 활용하는 매우 간단하면서도 빠르고 현대적인 VPN입니다. IPsec보다 빠르고, 간편하며, 효율적이고, 유용하면서도 복잡한 설정 과정을 없애는 것을 목표로 합니다. 또한 OpenVPN보다 훨씬 뛰어난 성능을 제공합니다. WireGuard는 임베디드 인터페이스부터 슈퍼컴퓨터까지 다양한 환경에서 실행될 수 있도록 설계된 범용 VPN으로, 여러 환경에 적합합니다. 처음에는 Linux 커널용으로 출시되었지만, 현재는 크로스 플랫폼(Windows, macOS, BSD, iOS, Android)으로 널리 배포되고 있습니다. 현재 활발한 개발이 진행 중이지만, 이미 업계에서 가장 안전하고 사용하기 쉽고 간편한 VPN 솔루션으로 평가받고 있습니다.
    ml_IN: WireGuard® വളരെ ലളിതവും എന്നാൽ വേഗതയേറിയതും ആധുനികവുമായ ഒരു VPN ആണ്, അത് അത്യാധുനിക ക്രിപ്‌റ്റോഗ്രഫി ഉപയോഗിക്കുന്നു. IPsec-നേക്കാൾ വേഗതയേറിയതും, ലളിതവും, കൂടുതൽ ഉപയോഗപ്രദവുമാകാനും, വലിയ തലവേദന ഒഴിവാക്കാനുമാണ് ഇത് ലക്ഷ്യമിടുന്നത്. OpenVPN-നേക്കാൾ ഗണ്യമായി കൂടുതൽ പ്രകടനം കാഴ്ചവയ്ക്കാനുമാണ് ഇത് ഉദ്ദേശിക്കുന്നത്. എംബഡഡ് ഇന്റർഫേസുകളിലും സൂപ്പർ കമ്പ്യൂട്ടറുകളിലും ഒരുപോലെ പ്രവർത്തിക്കുന്നതിനുള്ള ഒരു പൊതു ആവശ്യത്തിനുള്ള VPN ആയിട്ടാണ് WireGuard രൂപകൽപ്പന ചെയ്തിരിക്കുന്നത്, വ്യത്യസ്ത സാഹചര്യങ്ങൾക്ക് അനുയോജ്യമാണ്. തുടക്കത്തിൽ Linux കേർണലിനായി പുറത്തിറക്കിയ ഇത് ഇപ്പോൾ ക്രോസ്-പ്ലാറ്റ്‌ഫോമാണ് (Windows, macOS, BSD, iOS, Android) കൂടാതെ വ്യാപകമായി വിന്യസിക്കാവുന്നതുമാണ്. ഇത് നിലവിൽ വലിയ വികസനത്തിലാണ്, പക്ഷേ ഇതിനകം തന്നെ ഇത് വ്യവസായത്തിലെ ഏറ്റവും സുരക്ഷിതവും ഉപയോഗിക്കാൻ എളുപ്പമുള്ളതും ലളിതവുമായ VPN പരിഹാരമായി കണക്കാക്കാം.
    nb_NO: WireGuard® er et ekstremt enkelt, men likevel raskt og moderne VPN som bruker toppmoderne kryptografi. Målet er å være raskere, enklere, mer effektiv og mer nyttig enn IPsec, samtidig som det unngår den enorme hodepinen. Målet er å være betydelig mer effektivt enn OpenVPN. WireGuard er designet som et generelt VPN for kjøring på innebygde grensesnitt og superdatamaskiner, egnet for mange forskjellige omstendigheter. Opprinnelig utgitt for Linux-kjernen, er det nå plattformuavhengig (Windows, macOS, BSD, iOS, Android) og bredt distribuerbart. Det er for tiden under tung utvikling, men kan allerede betraktes som den sikreste, enkleste å bruke og enkleste VPN-løsningen i bransjen.
    nl_NL: WireGuard® is een extreem eenvoudige, snelle en moderne VPN die gebruikmaakt van de nieuwste cryptografie. Het streeft ernaar sneller, eenvoudiger, efficiënter en nuttiger te zijn dan IPsec, zonder de enorme problemen die daarmee gepaard gaan. Het is de bedoeling dat WireGuard aanzienlijk betere prestaties levert dan OpenVPN. WireGuard is ontworpen als een universele VPN die zowel op embedded interfaces als op supercomputers kan draaien en geschikt is voor uiteenlopende situaties. Oorspronkelijk uitgebracht voor de Linux-kernel, is het nu platformonafhankelijk (Windows, macOS, BSD, iOS, Android) en breed inzetbaar. Het is momenteel nog in ontwikkeling, maar kan nu al worden beschouwd als de veiligste, gebruiksvriendelijkste en eenvoudigste VPN-oplossing in de branche.
    pl_PL: WireGuard® to niezwykle prosta, a jednocześnie szybka i nowoczesna sieć VPN, wykorzystująca najnowocześniejszą kryptografię. Ma być szybsza, prostsza, bardziej zwarta i użyteczna niż IPsec, a jednocześnie eliminować ogromny problem. Ma być znacznie wydajniejsza niż OpenVPN. WireGuard został zaprojektowany jako uniwersalna sieć VPN do działania zarówno na interfejsach wbudowanych, jak i superkomputerach, sprawdzając się w wielu różnych sytuacjach. Początkowo wydany dla jądra Linux, jest obecnie wieloplatformowy (Windows, macOS, BSD, iOS, Android) i szeroko wdrażalny. Jest obecnie intensywnie rozwijany, ale już teraz można go uznać za najbezpieczniejsze, najłatwiejsze w obsłudze i najprostsze rozwiązanie VPN w branży.
    pt_BR: O WireGuard® é uma VPN extremamente simples, rápida e moderna que utiliza criptografia de ponta. Seu objetivo é ser mais rápido, simples, leve e útil que o IPsec, evitando as grandes dores de cabeça que ele apresenta. Pretende ser consideravelmente mais eficiente que o OpenVPN. O WireGuard foi projetado como uma VPN de uso geral para funcionar tanto em interfaces embarcadas quanto em supercomputadores, adaptando-se a diversas situações. Inicialmente lançado para o kernel Linux, agora é multiplataforma (Windows, macOS, BSD, iOS, Android) e amplamente implementável. Atualmente em intenso desenvolvimento, já pode ser considerado a solução VPN mais segura, fácil de usar e simples do mercado.
    ro_RO: WireGuard® este o rețea VPN extrem de simplă, dar rapidă și modernă, care utilizează criptografie de ultimă generație. Își propune să fie mai rapidă, mai simplă, mai flexibilă și mai utilă decât IPsec, evitând în același timp această bătaie de cap uriașă. Se dorește a fi considerabil mai performantă decât OpenVPN. WireGuard este concepută ca o rețea VPN de uz general pentru a rula pe interfețe integrate și supercomputere deopotrivă, potrivită pentru multe circumstanțe diferite. Lansată inițial pentru kernelul Linux, acum este multiplatformă (Windows, macOS, BSD, iOS, Android) și poate fi implementată pe scară largă. În prezent, este în plină dezvoltare, dar ar putea fi deja considerată cea mai sigură, mai ușor de utilizat și mai simplă soluție VPN din industrie.
    ru_RU: WireGuard® — это чрезвычайно простой, но быстрый и современный VPN, использующий передовые криптографические технологии. Он стремится быть быстрее, проще, экономичнее и полезнее, чем IPsec, избегая при этом множества проблем. Он должен быть значительно производительнее, чем OpenVPN. WireGuard разработан как универсальный VPN для работы как на встроенных системах, так и на суперкомпьютерах, подходящий для самых разных условий. Первоначально выпущенный для ядра Linux, теперь он является кроссплатформенным (Windows, macOS, BSD, iOS, Android) и широко распространен. В настоящее время он находится в активной разработке, но уже сейчас его можно считать самым безопасным, простым в использовании и удобным VPN-решением в отрасли.
    sk_SK: WireGuard® je extrémne jednoduchá, no zároveň rýchla a moderná VPN, ktorá využíva najmodernejšiu kryptografiu. Jej cieľom je byť rýchlejšia, jednoduchšia, štíhlejšia a užitočnejšia ako IPsec a zároveň sa vyhnúť masívnym problémom. Zámerom je byť podstatne výkonnejšia ako OpenVPN. WireGuard je navrhnutá ako univerzálna VPN pre prevádzku na vstavaných rozhraniach a superpočítačoch, vhodná pre mnoho rôznych situácií. Pôvodne vydaná pre jadro Linuxu, teraz je multiplatformová (Windows, macOS, BSD, iOS, Android) a široko nasaditeľná. Momentálne je vo fáze intenzívneho vývoja, ale už teraz by sa dala považovať za najbezpečnejšie, najjednoduchšie použiteľné a najjednoduchšie VPN riešenie v tomto odvetví.
    sv_SE: WireGuard® är ett extremt enkelt men ändå snabbt och modernt VPN som använder den senaste kryptografin. Det strävar efter att vara snabbare, enklare, effektivare och mer användbart än IPsec, samtidigt som det undviker den enorma huvudvärken. Det är avsett att vara betydligt mer prestandarikt än OpenVPN. WireGuard är utformat som ett allmänt VPN för att köras på både inbyggda gränssnitt och superdatorer, lämpligt för många olika omständigheter. Ursprungligen släppt för Linuxkärnan, är det nu plattformsoberoende (Windows, macOS, BSD, iOS, Android) och kan distribueras i stor utsträckning. Det är för närvarande under intensiv utveckling, men redan nu kan det betraktas som den säkraste, enklaste och enklaste VPN-lösningen i branschen.
    tr_TR: WireGuard®, son teknoloji şifreleme kullanan, son derece basit, hızlı ve modern bir VPN'dir. IPsec'ten daha hızlı, daha basit, daha yalın ve daha kullanışlı olmayı hedeflerken, büyük sorunlardan da kaçınmayı amaçlamaktadır. OpenVPN'den önemli ölçüde daha yüksek performans sunmayı hedeflemektedir. WireGuard, gömülü arayüzlerde ve süper bilgisayarlarda çalışmak üzere tasarlanmış, birçok farklı duruma uygun genel amaçlı bir VPN'dir. Başlangıçta Linux çekirdeği için piyasaya sürülen WireGuard, artık platformlar arası (Windows, macOS, BSD, iOS, Android) ve yaygın olarak kullanılabilir durumdadır. Şu anda yoğun geliştirme aşamasında olmasına rağmen, sektördeki en güvenli, kullanımı en kolay ve en basit VPN çözümü olarak kabul edilebilir.
    zh_CN: WireGuard® 是一个简单、快速、现代的 VPN，采用先进密码学技术。它旨在比 IPsec 更快速、简单、精简且实用，同时避免复杂配置，并力求在性能上超越 OpenVPN。WireGuard 是通用 VPN，既可运行在嵌入式设备上，也适用于超级计算机等多种环境。它最初面向 Linux 内核，如今已支持 Windows、macOS、BSD、iOS 和 Android 等平台，可广泛部署。项目仍在积极开发中，目标是提供安全、简单且易于使用的 VPN 方案。
    zh_TW: WireGuard® 是一個簡單、快速、現代的 VPN，採用先進密碼學技術。它旨在比 IPsec 更快速、簡單、精簡且實用，同時避免複雜配置，併力求在效能上超越 OpenVPN。WireGuard 是通用 VPN，既可執行在嵌入式裝置上，也適用於超級計算機等多種環境。它最初面向 Linux 核心，如今已支援 Windows、macOS、BSD、iOS 和 Android 等平臺，可廣泛部署。專案仍在積極開發中，目標是提供安全、簡單且易於使用的 VPN 方案。
  tagline:
    en_US: An extremely simple yet fast and modern VPN that utilizes state-of-the-art cryptography. It aims to be faster, simpler, leaner, and more useful than IPsec, while avoiding the massive headache. It intends to be considerably more performant than OpenVPN. WireGuard is designed as a general purpose VPN for running on embedded interfaces and super computers alike, fit for many different circumstances. Initially released for the Linux kernel, it is now cross-platform (Windows, macOS, BSD, iOS, Android) and widely deployable. It is currently under heavy development, but already it might be regarded as the most secure, easiest to use, and simplest VPN solution in the industry.
    ca_ES: Una VPN extremadament senzilla però ràpida i moderna que utilitza criptografia d'última generació. Pretén ser més ràpida, senzilla, més àgil i més útil que IPsec, evitant alhora aquest enorme maldecap. Pretén ser considerablement més eficient que OpenVPN. WireGuard està dissenyada com una VPN d'ús general per executar-se en interfícies integrades i superordinadors, adequada per a moltes circumstàncies diferents. Inicialment llançada per al nucli de Linux, ara és multiplataforma (Windows, macOS, BSD, iOS, Android) i àmpliament desplegable. Actualment està en un desenvolupament intensiu, però ja es podria considerar la solució VPN més segura, fàcil d'utilitzar i senzilla de la indústria.
    cs_CZ: Extrémně jednoduchá, ale rychlá a moderní VPN, která využívá nejmodernější kryptografii. Jejím cílem je být rychlejší, jednodušší, štíhlejší a užitečnější než IPsec a zároveň se vyhnout masivním problémům. Má být podstatně výkonnější než OpenVPN. WireGuard je navržen jako univerzální VPN pro běh na vestavěných rozhraních a superpočítačích, vhodná pro mnoho různých situací. Původně vydána pro linuxové jádro, nyní je multiplatformní (Windows, macOS, BSD, iOS, Android) a široce použitelná. V současné době je ve fázi intenzivního vývoje, ale již nyní by mohla být považována za nejbezpečnější, nejsnadněji použitelné a nejjednodušší VPN řešení v oboru.
    da_DK: En ekstremt simpel, men hurtig og moderne VPN, der bruger den nyeste kryptografi. Den sigter mod at være hurtigere, enklere, mere effektiv og mere nyttig end IPsec, samtidig med at den undgår den massive hovedpine. Den har til hensigt at være betydeligt mere ydende end OpenVPN. WireGuard er designet som en generel VPN til at køre på både indlejrede grænseflader og supercomputere, og er egnet til mange forskellige omstændigheder. Den blev oprindeligt udgivet til Linux-kernen, men er nu cross-platform (Windows, macOS, BSD, iOS, Android) og bredt implementerbar. Den er i øjeblikket under kraftig udvikling, men kan allerede betragtes som den sikreste, nemmeste at bruge og enkleste VPN-løsning i branchen.
    de_DE: WireGuard ist ein extrem einfaches, aber dennoch schnelles und modernes VPN, das modernste Kryptografie nutzt. Es ist schneller, einfacher, schlanker und nützlicher als IPsec und vermeidet dessen Komplexität. Es soll deutlich leistungsfähiger als OpenVPN sein. WireGuard ist als universelles VPN für den Einsatz auf eingebetteten Systemen und Hochleistungsrechnern gleichermaßen konzipiert und eignet sich für viele verschiedene Anwendungsfälle. Ursprünglich für den Linux-Kernel entwickelt, ist es mittlerweile plattformübergreifend (Windows, macOS, BSD, iOS, Android) und weit verbreitet einsetzbar. Es befindet sich derzeit in intensiver Entwicklung, gilt aber bereits jetzt als eine der sichersten, benutzerfreundlichsten und einfachsten VPN-Lösungen der Branche.
    el_GR: Ένα εξαιρετικά απλό αλλά γρήγορο και σύγχρονο VPN που χρησιμοποιεί κρυπτογραφία τελευταίας τεχνολογίας. Στόχος του είναι να είναι ταχύτερο, απλούστερο, πιο λιτό και πιο χρήσιμο από το IPsec, αποφεύγοντας παράλληλα τον τεράστιο πονοκέφαλο. Στόχος του είναι να είναι σημαντικά πιο αποδοτικό από το OpenVPN. Το WireGuard έχει σχεδιαστεί ως ένα VPN γενικής χρήσης για λειτουργία σε ενσωματωμένες διεπαφές και υπερυπολογιστές, κατάλληλο για πολλές διαφορετικές περιστάσεις. Αρχικά κυκλοφόρησε για τον πυρήνα του Linux, τώρα είναι cross-platform (Windows, macOS, BSD, iOS, Android) και ευρέως αναπτυξιακό. Αυτή τη στιγμή βρίσκεται υπό έντονη ανάπτυξη, αλλά ήδη μπορεί να θεωρηθεί ως η πιο ασφαλής, ευκολότερη στη χρήση και απλούστερη λύση VPN στον κλάδο.
    en_GB: An extremely simple yet fast and modern Vpn that utilizes state-of-the-art cryptography. It aims to be faster, simpler, leaner, and more useful than Ipsec, while avoiding the massive headache. It intends to be considerably more performant than Openvpn. Wireguard is designed as a general purpose Vpn for running on embedded interfaces and super computers alike, fit for many different circumstances. Initially released for the Linux kernel, it is now cross-platform (Windows, macOS, Bsd, iOS, Android) and widely deployable. It is currently under heavy development, but already it might be regarded as the most secure, easiest to use, and simplest Vpn solution in the industry.
    es_ES: Una VPN extremadamente sencilla, rápida y moderna que utiliza criptografía de última generación. Su objetivo es ser más rápida, simple, eficiente y útil que IPsec, evitando al mismo tiempo sus grandes complicaciones. Busca ofrecer un rendimiento considerablemente superior al de OpenVPN. WireGuard está diseñada como una VPN de propósito general para ejecutarse tanto en interfaces integradas como en supercomputadoras, adaptándose a diversas situaciones. Inicialmente lanzada para el kernel de Linux, ahora es multiplataforma (Windows, macOS, BSD, iOS, Android) y de amplia implementación. Actualmente se encuentra en pleno desarrollo, pero ya podría considerarse la solución VPN más segura, fácil de usar y sencilla del sector.
    fr_FR: Un VPN extrêmement simple, rapide et moderne, utilisant un chiffrement de pointe. Il vise à être plus rapide, plus simple, plus léger et plus utile qu'IPsec, tout en évitant les problèmes de configuration complexes. Il ambitionne d'être nettement plus performant qu'OpenVPN. Conçu comme un VPN polyvalent, il fonctionne aussi bien sur des interfaces embarquées que sur des supercalculateurs et s'adapte à de nombreuses situations. Initialement développé pour le noyau Linux, il est désormais multiplateforme (Windows, macOS, BSD, iOS, Android) et largement déployable. Actuellement en plein développement, il pourrait d'ores et déjà être considéré comme la solution VPN la plus sécurisée, la plus simple d'utilisation et la plus intuitive du marché.
    ga_IE: VPN thar a bheith simplí ach gasta agus nua-aimseartha a úsáideann cripteagrafaíocht den scoth. Tá sé mar aidhm aige a bheith níos tapúla, níos simplí, níos caolchúisí agus níos úsáidí ná IPsec, agus an tinneas cinn ollmhór á sheachaint ag an am céanna. Tá sé beartaithe aige a bheith i bhfad níos feidhmiúla ná OpenVPN. Tá WireGuard deartha mar VPN ilchuspóireach le rith ar chomhéadain leabaithe agus ar shár-ríomhairí araon, oiriúnach do go leor cúinsí éagsúla. Scaoileadh é ar dtús don eithne Linux, ach tá sé tras-ardán anois (Windows, macOS, BSD, iOS, Android) agus is féidir é a imscaradh go forleathan. Tá forbairt throm air faoi láthair, ach d'fhéadfaí a mheas cheana féin gurb é an réiteach VPN is sláine, is éasca le húsáid agus is simplí sa tionscal é.
    hr_HR: Iznimno jednostavan, ali brz i moderan VPN koji koristi najsuvremeniju kriptografiju. Cilj mu je biti brži, jednostavniji, vitkiji i korisniji od IPseca, a istovremeno izbjegavati ogromne probleme. Namjerava biti znatno učinkovitiji od OpenVPN-a. WireGuard je dizajniran kao VPN opće namjene za pokretanje na ugrađenim sučeljima i superračunalima, pogodan za mnoge različite okolnosti. Izvorno objavljen za Linux kernel, sada je višeplatformski (Windows, macOS, BSD, iOS, Android) i široko primjenjiv. Trenutno je u intenzivnom razvoju, ali već se može smatrati najsigurnijim, najlakšim za korištenje i najjednostavnijim VPN rješenjem u industriji.
    hu_HU: Egy rendkívül egyszerű, mégis gyors és modern VPN, amely a legmodernebb titkosítást használja. Célja, hogy gyorsabb, egyszerűbb, karcsúbb és hasznosabb legyen, mint az IPsec, miközben elkerüli a hatalmas fejfájást. Jelentősen nagyobb teljesítményű, mint az OpenVPN. A WireGuard általános célú VPN-ként készült, beágyazott interfészeken és szuperszámítógépeken egyaránt futtatható, sokféle körülményhez igazodva. Eredetileg Linux kernelre jelent meg, most már többplatformos (Windows, macOS, BSD, iOS, Android) és széles körben telepíthető. Jelenleg intenzív fejlesztés alatt áll, de már most is az iparág legbiztonságosabb, legkönnyebben használható és legegyszerűbb VPN-megoldásának tekinthető.
    it_IT: Una VPN estremamente semplice, veloce e moderna che utilizza una crittografia all'avanguardia. Il suo obiettivo è essere più veloce, semplice, snella e utile di IPsec, evitando al contempo i suoi notevoli problemi. Si propone di offrire prestazioni nettamente superiori a OpenVPN. WireGuard è progettata come VPN generica, adatta sia a interfacce embedded che a supercomputer, e si presta a diverse situazioni. Inizialmente rilasciata per il kernel Linux, è ora multipiattaforma (Windows, macOS, BSD, iOS, Android) e ampiamente implementabile. È attualmente in fase di intenso sviluppo, ma potrebbe già essere considerata la soluzione VPN più sicura, facile da usare e semplice del settore.
    ja_JP: 極めてシンプルでありながら高速で最新のVPNであり、最先端の暗号化技術を採用しています。IPsecよりも高速、シンプル、軽量、そして使いやすく、同時に大きな問題を回避することを目指しています。OpenVPNよりもはるかに高いパフォーマンスを実現することを目標としています。WireGuardは、組み込みインターフェースからスーパーコンピュータまで、さまざまな状況に対応できる汎用VPNとして設計されています。当初はLinuxカーネル向けにリリースされましたが、現在はクロスプラットフォーム（Windows、macOS、BSD、iOS、Android）で広く展開されています。現在も活発に開発が進められていますが、既に業界で最も安全で使いやすく、シンプルなVPNソリューションと見なされるかもしれません。
    ko_KR: 최첨단 암호화 기술을 활용하는 매우 간단하면서도 빠르고 현대적인 VPN입니다. IPsec보다 빠르고, 간편하며, 효율적이고, 유용하면서도 복잡한 설정 과정을 없애는 것을 목표로 합니다. 또한 OpenVPN보다 훨씬 뛰어난 성능을 제공합니다. WireGuard는 임베디드 인터페이스부터 슈퍼컴퓨터까지 다양한 환경에서 실행될 수 있도록 설계된 범용 VPN으로, 여러 환경에 적합합니다. 처음에는 Linux 커널용으로 출시되었지만, 현재는 크로스 플랫폼(Windows, macOS, BSD, iOS, Android)으로 널리 배포되고 있습니다. 현재 활발한 개발이 진행 중이지만, 이미 업계에서 가장 안전하고 사용하기 쉽고 간편한 VPN 솔루션으로 평가받고 있습니다.
    ml_IN: അത്യാധുനിക ക്രിപ്‌റ്റോഗ്രഫി ഉപയോഗിക്കുന്ന വളരെ ലളിതവും എന്നാൽ വേഗതയേറിയതും ആധുനികവുമായ ഒരു VPN. IPsec-നേക്കാൾ വേഗതയേറിയതും, ലളിതവും, കൂടുതൽ ഉപയോഗപ്രദവുമാക്കുക എന്നതാണ് ഇതിന്റെ ലക്ഷ്യം, അതേസമയം വലിയ തലവേദന ഒഴിവാക്കുകയും ചെയ്യുന്നു. OpenVPN-നേക്കാൾ ഗണ്യമായി കൂടുതൽ പ്രകടനം കാഴ്ചവയ്ക്കുക എന്നതാണ് ഇതിന്റെ ലക്ഷ്യം. എംബഡഡ് ഇന്റർഫേസുകളിലും സൂപ്പർ കമ്പ്യൂട്ടറുകളിലും ഒരുപോലെ പ്രവർത്തിക്കുന്നതിനുള്ള ഒരു പൊതു ആവശ്യത്തിനുള്ള VPN ആയിട്ടാണ് WireGuard രൂപകൽപ്പന ചെയ്തിരിക്കുന്നത്, വ്യത്യസ്ത സാഹചര്യങ്ങൾക്ക് അനുയോജ്യമാണ്. തുടക്കത്തിൽ Linux കേർണലിനായി പുറത്തിറക്കിയ ഇത് ഇപ്പോൾ ക്രോസ്-പ്ലാറ്റ്‌ഫോമാണ് (Windows, macOS, BSD, iOS, Android) കൂടാതെ വ്യാപകമായി വിന്യസിക്കാവുന്നതുമാണ്. ഇത് നിലവിൽ വലിയ വികസനത്തിലാണ്, പക്ഷേ ഇതിനകം തന്നെ ഇത് വ്യവസായത്തിലെ ഏറ്റവും സുരക്ഷിതവും ഉപയോഗിക്കാൻ എളുപ്പമുള്ളതും ലളിതവുമായ VPN പരിഹാരമായി കണക്കാക്കാം.
    nb_NO: En ekstremt enkel, men likevel rask og moderne VPN som bruker toppmoderne kryptografi. Den har som mål å være raskere, enklere, mer effektiv og mer nyttig enn IPsec, samtidig som den unngår den enorme hodepinen. Den har til hensikt å være betydelig mer effektiv enn OpenVPN. WireGuard er designet som en generell VPN for kjøring på innebygde grensesnitt og superdatamaskiner, egnet for mange forskjellige omstendigheter. Opprinnelig utgitt for Linux-kjernen, er den nå plattformuavhengig (Windows, macOS, BSD, iOS, Android) og bredt distribuerbar. Den er for tiden under tung utvikling, men kan allerede betraktes som den sikreste, enkleste å bruke og enkleste VPN-løsningen i bransjen.
    nl_NL: WireGuard is een extreem eenvoudige, snelle en moderne VPN die gebruikmaakt van de nieuwste cryptografie. Het doel is om sneller, eenvoudiger, efficiënter en nuttiger te zijn dan IPsec, zonder de enorme problemen die daarmee gepaard gaan. Het is de bedoeling dat WireGuard aanzienlijk betere prestaties levert dan OpenVPN. WireGuard is ontworpen als een universele VPN voor gebruik op embedded interfaces en supercomputers, geschikt voor uiteenlopende situaties. Oorspronkelijk uitgebracht voor de Linux-kernel, is het nu platformonafhankelijk (Windows, macOS, BSD, iOS, Android) en breed inzetbaar. Het is momenteel nog in ontwikkeling, maar kan nu al worden beschouwd als de veiligste, gebruiksvriendelijkste en eenvoudigste VPN-oplossing in de branche.
    pl_PL: Niezwykle prosta, a jednocześnie szybka i nowoczesna sieć VPN wykorzystująca najnowocześniejszą kryptografię. Ma być szybsza, prostsza, bardziej zwarta i użyteczna niż IPsec, a jednocześnie unikać ogromnego problemu. Ma być znacznie wydajniejsza niż OpenVPN. WireGuard został zaprojektowany jako uniwersalna sieć VPN do działania zarówno na interfejsach wbudowanych, jak i superkomputerach, sprawdzając się w wielu różnych sytuacjach. Początkowo wydany dla jądra Linux, jest obecnie wieloplatformowy (Windows, macOS, BSD, iOS, Android) i szeroko wdrażalny. Jest obecnie intensywnie rozwijany, ale już teraz można go uznać za najbezpieczniejsze, najłatwiejsze w obsłudze i najprostsze rozwiązanie VPN w branży.
    pt_BR: Uma VPN extremamente simples, rápida e moderna que utiliza criptografia de ponta. Seu objetivo é ser mais rápida, simples, leve e útil que o IPsec, evitando as grandes dores de cabeça que ele acarreta. Pretende ser consideravelmente mais eficiente que o OpenVPN. O WireGuard foi projetado como uma VPN de uso geral para funcionar tanto em interfaces embarcadas quanto em supercomputadores, adaptando-se a diversas situações. Inicialmente lançado para o kernel Linux, agora é multiplataforma (Windows, macOS, BSD, iOS, Android) e amplamente implementável. Atualmente em intenso desenvolvimento, já pode ser considerado a solução VPN mais segura, fácil de usar e simples do mercado.
    ro_RO: Un VPN extrem de simplu, dar rapid și modern, care utilizează criptografie de ultimă generație. Își propune să fie mai rapid, mai simplu, mai flexibil și mai util decât IPsec, evitând în același timp această bătaie de cap uriașă. Intenționează să fie considerabil mai performant decât OpenVPN. WireGuard este conceput ca un VPN de uz general pentru a rula pe interfețe integrate și supercomputere deopotrivă, potrivit pentru multe circumstanțe diferite. Lansat inițial pentru kernelul Linux, este acum multiplatformă (Windows, macOS, BSD, iOS, Android) și implementabil pe scară largă. În prezent, este în plină dezvoltare, dar ar putea fi deja considerat cea mai sigură, mai ușor de utilizat și mai simplă soluție VPN din industrie.
    ru_RU: Чрезвычайно простой, но быстрый и современный VPN, использующий передовые криптографические технологии. Он стремится быть быстрее, проще, экономичнее и полезнее, чем IPsec, избегая при этом множества проблем. Он должен быть значительно производительнее, чем OpenVPN. WireGuard разработан как универсальный VPN для работы как на встроенных системах, так и на суперкомпьютерах, подходящий для самых разных условий. Первоначально выпущенный для ядра Linux, теперь он является кроссплатформенным (Windows, macOS, BSD, iOS, Android) и широко распространен. В настоящее время он находится в активной разработке, но уже сейчас его можно считать самым безопасным, простым в использовании и удобным VPN-решением в отрасли.
    sk_SK: Extrémne jednoduchá, no zároveň rýchla a moderná VPN, ktorá využíva najmodernejšiu kryptografiu. Jej cieľom je byť rýchlejšia, jednoduchšia, štíhlejšia a užitočnejšia ako IPsec a zároveň sa vyhnúť masívnym problémom. Má byť podstatne výkonnejšia ako OpenVPN. WireGuard je navrhnutý ako univerzálna VPN pre spustenie na vstavaných rozhraniach a superpočítačoch, vhodný pre mnoho rôznych situácií. Pôvodne vydaný pre jadro Linuxu, teraz je multiplatformový (Windows, macOS, BSD, iOS, Android) a široko nasaditeľný. Momentálne je vo fáze intenzívneho vývoja, ale už teraz by sa mohol považovať za najbezpečnejšie, najjednoduchšie použiteľné a najjednoduchšie VPN riešenie v tomto odvetví.
    sv_SE: En extremt enkel men ändå snabb och modern VPN som använder den senaste kryptografin. Den strävar efter att vara snabbare, enklare, effektivare och mer användbar än IPsec, samtidigt som den undviker den enorma huvudvärken. Den är avsedd att vara betydligt mer prestandaeffektiv än OpenVPN. WireGuard är utformad som en allmän VPN för att köras på både inbyggda gränssnitt och superdatorer, lämplig för många olika omständigheter. Ursprungligen släppt för Linuxkärnan, är den nu plattformsoberoende (Windows, macOS, BSD, iOS, Android) och kan distribueras i stor utsträckning. Den är för närvarande under intensiv utveckling, men kan redan betraktas som den säkraste, enklaste och enklaste VPN-lösningen i branschen.
    tr_TR: Son teknoloji şifreleme kullanan, son derece basit, hızlı ve modern bir VPN. IPsec'ten daha hızlı, daha basit, daha yalın ve daha kullanışlı olmayı hedeflerken, büyük sorunlardan da kaçınmayı amaçlıyor. OpenVPN'den önemli ölçüde daha yüksek performans sunmayı hedefliyor. WireGuard, gömülü arayüzlerde ve süper bilgisayarlarda çalışmak üzere tasarlanmış, birçok farklı duruma uygun genel amaçlı bir VPN'dir. Başlangıçta Linux çekirdeği için piyasaya sürülen WireGuard, artık platformlar arası (Windows, macOS, BSD, iOS, Android) ve yaygın olarak kullanılabilir durumda. Şu anda yoğun geliştirme aşamasında olmasına rağmen, sektördeki en güvenli, kullanımı en kolay ve en basit VPN çözümü olarak kabul edilebilir.
    zh_CN: 采用现代密码学的轻量高速 VPN。
    zh_TW: 採用現代密碼學的輕量高速 VPN。
