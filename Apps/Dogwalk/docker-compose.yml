name: linuxserver-dogwalk
services:
  app:
    image: linuxserver/dogwalk:version-b93769c4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dogwalk/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: DOGWALK is Blender Studio's long awaited second game project, focused on creating a bite-sized interactive storytelling playground. Play as a big adorable dog and explore the winter woods with a little kid.
    ca_ES: DOGWALK és el segon projecte de joc tan esperat de Blender Studio, centrat en la creació d'un parc infantil interactiu amb històries de la mida d'un mos. Juga com un gos gran i adorable i explora els boscos d'hivern amb un nen petit.
    cs_CZ: DOGWALK je dlouho očekávaný druhý herní projekt studia Blender Studio, zaměřený na vytvoření interaktivního hřiště s vyprávěním příběhů. Hrajte za velkého rozkošného psa a prozkoumejte zimní les s malým dítětem.
    da_DK: DOGWALK er Blender Studios længe ventede andet spilprojekt, der fokuserer på at skabe en lille, interaktiv historiefortællingslegeplads. Spil som en stor, nuttet hund, og udforsk vinterskoven med et lille barn.
    de_DE: DOGWALK ist Blender Studios lang erwartetes zweites Spielprojekt, das sich auf die Entwicklung eines interaktiven, kurzweiligen Geschichtenspielplatzes konzentriert. Schlüpfe in die Rolle eines großen, liebenswerten Hundes und erkunde mit einem kleinen Kind den winterlichen Wald.
    el_GR: Το DOGWALK είναι το πολυαναμενόμενο δεύτερο project παιχνιδιού του Blender Studio, που επικεντρώνεται στη δημιουργία μιας μικρής διαδραστικής παιδικής χαράς αφήγησης. Παίξτε ως ένα μεγάλο αξιολάτρευτο σκυλί και εξερευνήστε το χειμωνιάτικο δάσος με ένα μικρό παιδί.
    en_GB: Dogwalk is Blender Studio's long awaited second game project, focused on creating a bite-sized interactive storytelling playground. Play as a big adorable dog and explore the winter woods with a little kid.
    es_ES: DOGWALK es el segundo proyecto de Blender Studio, largamente esperado, centrado en crear un espacio interactivo y narrativo para niños. Juega como un perro grande y adorable y explora el bosque invernal con un niño pequeño.
    fr_FR: DOGWALK est le deuxième projet de jeu très attendu de Blender Studio, axé sur la création d'un terrain de jeu interactif et narratif concis. Incarnez un adorable gros chien et explorez les bois enneigés avec un jeune enfant.
    ga_IE: Is é DOGWALK an dara tionscadal cluiche atá á fhanacht le fada ó Blender Studio, atá dírithe ar chlós súgartha scéalaíochta idirghníomhach beag bídeach a chruthú. Imir mar mhadra mór gleoite agus déan iniúchadh ar na coillte geimhridh le páiste beag.
    hr_HR: DOGWALK je dugo očekivani drugi projekt Blender Studija, usmjeren na stvaranje interaktivnog igrališta za pripovijedanje u malom zalogaju. Igrajte se kao veliki preslatki pas i istražite zimsku šumu s malim djetetom.
    hu_HU: A DOGWALK a Blender Studio régóta várt második játékprojektje, melynek középpontjában egy interaktív, történetmesélő játszótér létrehozása áll. Játssz egy nagy, imádnivaló kutya bőrében, és fedezd fel a téli erdőt egy kisgyerekkel.
    it_IT: DOGWALK è il secondo progetto videoludico di Blender Studio, atteso da tempo e incentrato sulla creazione di un'esperienza interattiva e coinvolgente, pensata per raccontare storie in modo semplice e immediato. Gioca nei panni di un adorabile cagnolino ed esplora il bosco invernale insieme a un bambino.
    ja_JP: DOGWALKは、Blender Studioが満を持して開発した2作目のゲームプロジェクトで、手軽に楽しめるインタラクティブなストーリーテリング体験を提供することに重点を置いています。プレイヤーは愛らしい大きな犬になりきり、小さな子供と一緒に冬の森を探検します。
    ko_KR: DOGWALK는 블렌더 스튜디오에서 오랫동안 기다려온 두 번째 게임 프로젝트로, 짧고 강렬한 인터랙티브 스토리텔링 놀이터를 만드는 데 중점을 두었습니다. 귀엽고 깜찍한 강아지가 되어 어린아이와 함께 겨울 숲을 탐험해 보세요.
    ml_IN: ഡോഗ്‌വാക്ക് എന്നത് ബ്ലെൻഡർ സ്റ്റുഡിയോയുടെ ഏറെക്കാലമായി കാത്തിരുന്ന രണ്ടാമത്തെ ഗെയിം പ്രോജക്റ്റാണ്, ഇത് ഒരു ചെറിയ സംവേദനാത്മക കഥപറച്ചിൽ കളിസ്ഥലം സൃഷ്ടിക്കുന്നതിൽ ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നു. ഒരു വലിയ ഓമനത്തമുള്ള നായയായി കളിക്കുക, ഒരു കൊച്ചുകുട്ടിയുമായി ശൈത്യകാല വനങ്ങൾ പര്യവേക്ഷണം ചെയ്യുക.
    nb_NO: DOGWALK er Blender Studios lenge etterlengtede andre spillprosjekt, med fokus på å lage en liten, interaktiv historiefortellingslekeplass. Spill som en stor, søt hund og utforsk vinterskogen med et lite barn.
    nl_NL: DOGWALK is het langverwachte tweede gameproject van Blender Studio, gericht op het creëren van een interactieve, compacte game met een focus op verhalen vertellen. Speel als een grote, schattige hond en verken samen met een klein kind het winterse bos.
    pl_PL: DOGWALK to długo oczekiwany drugi projekt gry Blender Studio, skupiający się na stworzeniu niewielkiego, interaktywnego placu zabaw do opowiadania historii. Wciel się w dużego, uroczego psa i eksploruj zimowy las z małym dzieckiem.
    pt_BR: DOGWALK é o segundo projeto de jogo tão aguardado da Blender Studio, focado na criação de um playground interativo de narrativa em tamanho reduzido. Jogue como um cachorro grande e adorável e explore a floresta de inverno com uma criança pequena.
    ro_RO: DOGWALK este mult așteptatul al doilea proiect de joc al Blender Studio, axat pe crearea unui loc de joacă interactiv cu povești, de dimensiuni reduse. Joacă rolul unui câine mare și adorabil și explorează pădurea de iarnă cu un copil mic.
    ru_RU: DOGWALK — долгожданный второй игровой проект Blender Studio, посвященный созданию интерактивной игровой площадки для рассказывания историй в формате коротких роликов. Играйте за большого очаровательного пса и исследуйте зимний лес вместе с маленьким ребенком.
    sk_SK: DOGWALK je dlho očakávaný druhý herný projekt od štúdia Blender Studio, zameraný na vytvorenie interaktívneho ihriska na rozprávanie príbehov. Hrajte sa ako veľký rozkošný pes a preskúmajte zimný les s malým dieťaťom.
    sv_SE: DOGWALK är Blender Studios länge efterlängtade andra spelprojekt, med fokus på att skapa en liten, interaktiv berättarlekplats. Spela som en stor, bedårande hund och utforska vinterskogen med ett litet barn.
    tr_TR: DOGWALK, Blender Studio'nun uzun zamandır beklenen ikinci oyun projesi olup, kısa süreli etkileşimli bir hikaye anlatım oyun alanı yaratmaya odaklanmıştır. Sevimli büyük bir köpek olarak oynayın ve küçük bir çocukla kış ormanını keşfedin.
    zh_CN: DOGWALK 是 Blender Studio 备受期待的第二个游戏项目，专注于打造小巧的互动叙事体验。你将扮演一只可爱的大狗，与一名小孩一起探索冬日森林。
    zh_TW: DOGWALK 是 Blender Studio 備受期待的第二個遊戲專案，專注於打造小巧的互動敘事體驗。你將扮演一隻可愛的大狗，與一名小孩一起探索冬日森林。
