  tagline:
    en_US: A modern, cross-platform, distributed IRC client, meaning that one (or multiple) client(s) can attach to and detach from a central core. This container handles the IRC connection (quasselcore) and requires a desktop client (quasselclient) to be used and configured. It is designed to be always on and will keep your identity present in IRC even when your clients cannot be online. Backlog (history) is downloaded by your client upon reconnection allowing infinite scrollback through time.
    zh_CN: 保持在线并保存聊天记录的 IRC 核心服务。
    ca_ES: Un client IRC modern, multiplataforma i distribuït, és a dir, que un (o diversos) clients es poden connectar i desconnectar d'un nucli central. Aquest contenidor gestiona la connexió IRC (quasselcore) i requereix que s'utilitzi i es configure un client d'escriptori (quasselclient). Està dissenyat per estar sempre actiu i mantindrà la vostra identitat present a l'IRC fins i tot quan els vostres clients no puguin estar en línia. El vostre client descarrega l'historial de tasques enrere en reconnexió, permetent un desplaçament infinit en el temps.
    cs_CZ: Moderní, multiplatformní, distribuovaný IRC klient, což znamená, že jeden (nebo více) klientů se může připojit k centrálnímu jádru a odpojit od něj. Tento kontejner zajišťuje IRC připojení (quasselcore) a k použití a konfiguraci vyžaduje desktopového klienta (quasselclient). Je navržen tak, aby byl neustále zapnutý a uchovával vaši identitu v IRC, i když vaši klienti nemohou být online. Backlog (historie) si klient stáhne při opětovném připojení, což umožňuje nekonečné posouvání zpět v čase.
    da_DK: En moderne, distribueret IRC-klient på tværs af platforme, hvilket betyder, at én (eller flere) klient(er) kan oprette forbindelse til og fra en central kerne. Denne container håndterer IRC-forbindelsen (quasselcore) og kræver, at en desktopklient (quasselclient) bruges og konfigureres. Den er designet til altid at være tændt og vil holde din identitet til stede i IRC, selv når dine klienter ikke kan være online. Backlog (historik) downloades af din klient ved genoprettelse af forbindelse, hvilket tillader uendelig scrollback gennem tiden.
    de_DE: Ein moderner, plattformübergreifender, verteilter IRC-Client, bei dem sich ein oder mehrere Clients mit einem zentralen Kern verbinden und wieder trennen können. Dieser Container (quasselcore) verwaltet die IRC-Verbindung und erfordert einen Desktop-Client (quasselclient), der entsprechend konfiguriert werden muss. Er ist so konzipiert, dass er permanent aktiv ist und Ihre IRC-Identität auch dann aufrechterhält, wenn Ihre Clients offline sind. Der Verlauf (Backlog) wird bei der Wiederverbindung von Ihrem Client heruntergeladen, sodass Sie unbegrenzt durch die Zeit scrollen können.
    el_GR: Ένας σύγχρονος, διαπλατφορμικός, κατανεμημένος πελάτης IRC, που σημαίνει ότι ένας (ή περισσότεροι) πελάτες μπορούν να συνδεθούν και να αποσυνδεθούν από έναν κεντρικό πυρήνα. Αυτό το κοντέινερ χειρίζεται τη σύνδεση IRC (quasselcore) και απαιτεί τη χρήση και τη διαμόρφωση ενός υπολογιστή-πελάτη (quasselclient). Έχει σχεδιαστεί για να είναι πάντα ενεργοποιημένο και θα διατηρεί την ταυτότητά σας παρούσα στο IRC ακόμα και όταν οι πελάτες σας δεν μπορούν να είναι συνδεδεμένοι. Το ιστορικό (backlog) λαμβάνεται από τον πελάτη σας κατά την επανασύνδεση, επιτρέποντας απεριόριστη κύλιση προς τα πίσω στο χρόνο.
    en_GB: A modern, cross-platform, distributed Irc client, meaning that one (or multiple) client(s) can attach to and detach from a central core. This container handles the Irc connection (quasselcore) and requires a desktop client (quasselclient) to be used and configured. It is designed to be always on and will keep your identity present in Irc even when your clients cannot be online. Backlog (history) is downloaded by your client upon reconnection allowing infinite scrollback through time.
    es_ES: Un cliente IRC moderno, multiplataforma y distribuido, que permite que uno o varios clientes se conecten y desconecten de un núcleo central. Este contenedor gestiona la conexión IRC (quasselcore) y requiere un cliente de escritorio (quasselclient) para su uso y configuración. Está diseñado para estar siempre activo y mantendrá tu identidad presente en IRC incluso cuando tus clientes no estén en línea. El historial se descarga al reconectarse, permitiendo un desplazamiento infinito hacia atrás en el tiempo.
    fr_FR: Un client IRC moderne, multiplateforme et distribué, permettant à un ou plusieurs clients de se connecter et de se déconnecter d'un serveur central. Ce conteneur gère la connexion IRC (quasselcore) et nécessite l'utilisation et la configuration d'un client de bureau (quasselclient). Conçu pour être toujours actif, il maintient votre identité sur IRC même lorsque vos clients sont hors ligne. L'historique des conversations est téléchargé par votre client lors de la reconnexion, permettant ainsi un défilement infini dans le temps.
    ga_IE: Cliant IRC nua-aimseartha, tras-ardáin, dáilte, rud a chiallaíonn gur féidir le cliant amháin (nó ilchliant) ceangal le croí lárnach agus dícheangal uaidh. Láimhseálann an coimeádán seo an nasc IRC (quasselcore) agus teastaíonn cliant deisce (quasselclient) le húsáid agus le cumrú. Tá sé deartha le bheith ar siúl i gcónaí agus coinneoidh sé do chéannacht i láthair in IRC fiú nuair nach féidir le do chliaint a bheith ar líne. Íoslódálann do chliant an cúlchiste (stair) nuair a athnasctar é, rud a ligeann do scrolláil siar gan teorainn tríd an am.
    hr_HR: Moderni, višeplatformski, distribuirani IRC klijent, što znači da se jedan (ili više) klijenata može spojiti i odspojiti s centralne jezgre. Ovaj kontejner obrađuje IRC vezu (quasselcore) i zahtijeva korištenje i konfiguriranje desktop klijenta (quasselclient). Dizajniran je da bude uvijek uključen i održavat će vaš identitet prisutnim u IRC-u čak i kada vaši klijenti ne mogu biti online. Backlog (povijest) preuzima vaš klijent nakon ponovnog povezivanja, što omogućuje beskonačno pomicanje unatrag kroz vrijeme.
    hu_HU: Egy modern, többplatformos, elosztott IRC kliens, ami azt jelenti, hogy egy (vagy több) kliens csatlakozhat és leválasztható egy központi magról. Ez a konténer kezeli az IRC-kapcsolatot (quasselcore), és egy asztali kliens (quasselclient) használatát és konfigurálását igényli. Úgy tervezték, hogy mindig bekapcsolva legyen, és akkor is jelen legyen az identitásod az IRC-ben, ha az ügyfeleid nem lehetnek online. A várakozó fájlokat (előzményeket) az ügyfél letölti az újracsatlakozáskor, lehetővé téve a végtelen visszagörgetést az időben.
    it_IT: Un client IRC moderno, multipiattaforma e distribuito, il che significa che uno (o più) client possono connettersi e disconnettersi da un nucleo centrale. Questo container gestisce la connessione IRC (quasselcore) e richiede l'utilizzo e la configurazione di un client desktop (quasselclient). È progettato per essere sempre attivo e manterrà la tua identità presente su IRC anche quando i tuoi client non sono online. La cronologia (backlog) viene scaricata dal tuo client al momento della riconnessione, consentendo uno scorrimento infinito nel tempo.
    ja_JP: 最新のクロスプラットフォーム対応分散型IRCクライアントです。つまり、1つ（または複数）のクライアントが中央コアに接続したり切断したりできます。このコンテナはIRC接続（quasselcore）を処理し、デスクトップクライアント（quasselclient）の使用と設定が必要です。常時稼働するように設計されており、クライアントがオフラインの場合でもIRC上でのユーザーのIDを維持します。クライアントが再接続するとバックログ（履歴）がダウンロードされるため、時間を遡って無制限にスクロールできます。
    ko_KR: 최신 크로스 플랫폼 분산형 IRC 클라이언트인 quasselcore는 하나 이상의 클라이언트가 중앙 코어에 연결하거나 분리할 수 있도록 설계되었습니다. 이 컨테이너는 IRC 연결을 관리하며, 데스크톱 클라이언트(quasselclient)를 사용하고 구성해야 합니다. quasselcore는 항상 켜져 있도록 설계되어 클라이언트가 온라인 상태가 아니더라도 IRC에서 사용자의 ID를 유지할 수 있습니다. 클라이언트가 다시 연결되면 이전 대화 기록(백로그)이 다운로드되어 무한히 과거로 스크롤하여 확인할 수 있습니다.
    ml_IN: ഒരു ആധുനിക, ക്രോസ്-പ്ലാറ്റ്‌ഫോം, വിതരണം ചെയ്ത IRC ക്ലയന്റ്, അതായത് ഒരു (അല്ലെങ്കിൽ ഒന്നിലധികം) ക്ലയന്റുകൾക്ക് ഒരു സെൻട്രൽ കോറിലേക്ക് അറ്റാച്ചുചെയ്യാനും അതിൽ നിന്ന് വേർപെടുത്താനും കഴിയും. ഈ കണ്ടെയ്‌നർ IRC കണക്ഷൻ (ക്വാസ്സൽകോർ) കൈകാര്യം ചെയ്യുന്നു, കൂടാതെ ഒരു ഡെസ്‌ക്‌ടോപ്പ് ക്ലയന്റ് (ക്വാസ്സൽക്ലയന്റ്) ഉപയോഗിക്കാനും കോൺഫിഗർ ചെയ്യാനും ആവശ്യപ്പെടുന്നു. ഇത് എല്ലായ്പ്പോഴും ഓണായിരിക്കാൻ രൂപകൽപ്പന ചെയ്‌തിരിക്കുന്നു, നിങ്ങളുടെ ക്ലയന്റുകൾക്ക് ഓൺലൈനിൽ ആകാൻ കഴിയാത്തപ്പോഴും IRC-യിൽ നിങ്ങളുടെ ഐഡന്റിറ്റി നിലനിർത്തും. വീണ്ടും കണക്റ്റുചെയ്യുമ്പോൾ ബാക്ക്‌ലോഗ് (ചരിത്രം) നിങ്ങളുടെ ക്ലയന്റ് ഡൗൺലോഡ് ചെയ്യുന്നു, ഇത് കാലക്രമേണ അനന്തമായ സ്ക്രോൾബാക്ക് അനുവദിക്കുന്നു.
    nb_NO: En moderne, distribuert IRC-klient på tvers av plattformer, som betyr at én (eller flere) klient(er) kan koble seg til og koble seg fra en sentral kjerne. Denne containeren håndterer IRC-tilkoblingen (quasselcore) og krever at en skrivebordsklient (quasselclient) brukes og konfigureres. Den er designet for å alltid være på og vil holde identiteten din tilstede i IRC selv når klientene dine ikke kan være online. Backlog (historikk) lastes ned av klienten din ved tilkobling igjen, noe som tillater uendelig tilbakeskrolling gjennom tid.
    nl_NL: Een moderne, platformonafhankelijke, gedistribueerde IRC-client, wat betekent dat één (of meerdere) clients verbinding kunnen maken met en zich kunnen loskoppelen van een centrale kern. Deze container beheert de IRC-verbinding (quasselcore) en vereist een desktopclient (quasselclient) die moet worden gebruikt en geconfigureerd. Het is ontworpen om altijd actief te zijn en zorgt ervoor dat uw identiteit in IRC behouden blijft, zelfs wanneer uw clients niet online zijn. De geschiedenis wordt door uw client gedownload bij herverbinding, waardoor u oneindig terug in de tijd kunt scrollen.
    pl_PL: Nowoczesny, wieloplatformowy, rozproszony klient IRC, co oznacza, że jeden (lub wielu) klientów może podłączać się i odłączać od centralnego rdzenia. Ten kontener obsługuje połączenie IRC (quasselcore) i wymaga do korzystania i konfiguracji klienta stacjonarnego (quasselclient). Został zaprojektowany tak, aby działał zawsze i utrzymywał Twoją tożsamość w IRC, nawet gdy Twoi klienci nie są online. Backlog (historia) jest pobierany przez klienta po ponownym połączeniu, umożliwiając nieskończone przewijanie w czasie.
    pt_BR: Um cliente IRC moderno, multiplataforma e distribuído, o que significa que um (ou vários) cliente(s) pode(m) conectar-se e desconectar-se de um núcleo central. Este contêiner gerencia a conexão IRC (quasselcore) e requer um cliente desktop (quasselclient) para ser usado e configurado. Ele foi projetado para estar sempre ativo e manterá sua identidade visível no IRC mesmo quando seus clientes estiverem offline. O histórico (backlog) é baixado pelo seu cliente ao se reconectar, permitindo rolagem infinita através do tempo.
    ro_RO: Un client IRC modern, multiplatformă, distribuit, ceea ce înseamnă că unul (sau mai mulți) clienți se pot conecta și detașa de un nucleu central. Acest container gestionează conexiunea IRC (quasselcore) și necesită utilizarea și configurarea unui client desktop (quasselclient). Este conceput să fie mereu activ și vă va păstra identitatea prezentă în IRC chiar și atunci când clienții dvs. nu pot fi online. Istoricul mesajelor restante este descărcat de clientul dvs. la reconectare, permițând derulare înapoi în timp la nesfârșit.
    ru_RU: Современный, кроссплатформенный, распределенный IRC-клиент, позволяющий одному (или нескольким) клиентам подключаться к центральному ядру и отключаться от него. Этот контейнер обрабатывает IRC-соединение (quasselcore) и требует использования и настройки настольного клиента (quasselclient). Он разработан для постоянной работы и будет поддерживать вашу идентификацию в IRC, даже когда ваши клиенты не могут быть онлайн. История перезвонов (backlog) загружается вашим клиентом при повторном подключении, обеспечивая бесконечную прокрутку назад во времени.
    sk_SK: Moderný, multiplatformový, distribuovaný IRC klient, čo znamená, že jeden (alebo viacerí) klienti sa môžu pripojiť k centrálnemu jadru a odpojiť od neho. Tento kontajner spracováva IRC pripojenie (quasselcore) a na použitie a konfiguráciu vyžaduje desktopového klienta (quasselclient). Je navrhnutý tak, aby bol vždy zapnutý a udržiaval vašu identitu prítomnú v IRC, aj keď vaši klienti nemôžu byť online. Backlog (históriu) si klient stiahne po opätovnom pripojení, čo umožňuje nekonečné posúvanie späť v čase.
    sv_SE: En modern, plattformsoberoende, distribuerad IRC-klient, vilket innebär att en (eller flera) klienter kan ansluta till och koppla från en central kärna. Denna container hanterar IRC-anslutningen (quasselcore) och kräver att en skrivbordsklient (quasselclient) används och konfigureras. Den är utformad för att alltid vara påslagen och kommer att hålla din identitet närvarande i IRC även när dina klienter inte kan vara online. Backloggen (historik) laddas ner av din klient vid återanslutning, vilket möjliggör oändlig bakåtskrollning genom tiden.
    tr_TR: Modern, platformlar arası, dağıtık bir IRC istemcisi; yani bir (veya birden fazla) istemci merkezi bir çekirdeğe bağlanabilir ve ondan ayrılabilir. Bu konteyner IRC bağlantısını (quasselcore) yönetir ve bir masaüstü istemcisinin (quasselclient) kullanılmasını ve yapılandırılmasını gerektirir. Her zaman açık olacak şekilde tasarlanmıştır ve istemcileriniz çevrimiçi olmasa bile kimliğinizin IRC'de görünmesini sağlar. Geriye dönük kayıtlar (geçmiş), bağlantı yeniden kurulduğunda istemciniz tarafından indirilir ve zaman içinde sonsuz geriye kaydırma olanağı sağlar.
    zh_TW: 保持線上並儲存聊天記錄的 IRC 核心服務。
