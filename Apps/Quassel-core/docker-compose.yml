name: linuxserver-quassel-core
services:
  app:
    image: linuxserver/quassel-core:0.14.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: RUN_OPTS
          description:
            en_US: Custom CLI options for Quassel
    ports:
      - target: 4242
        published: 4242
        protocol: tcp
      - target: 113
        published: 10113
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/quassel-core/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Visit homepage: https://hub.docker.com/r/linuxserver/quassel-core/'
    zh_CN: |-
      Quassel 是现代、跨平台、分布式 IRC 客户端，允许一个或多个客户端连接到中央核心或与之断开。此容器运行负责 IRC 连接的 quasselcore，需要搭配桌面客户端 quasselclient 使用和配置。它设计为持续在线，即使客户端离线，也会保持你的 IRC 身份在线。客户端重新连接时会下载历史记录，便于持续回溯聊天内容。

      访问项目主页：https://hub.docker.com/r/linuxserver/quassel-core/
