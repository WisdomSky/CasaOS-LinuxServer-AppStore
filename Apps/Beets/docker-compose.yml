name: linuxserver-beets
services:
  app:
    image: linuxserver/beets:2.14.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8337
        published: 8337
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/beets/config
        target: /config
      - type: bind
        source: /DATA/AppData/beets/music
        target: /music
      - type: bind
        source: /DATA/AppData/beets/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Beets is a music library manager and not, for the most part, a music player. It does include a simple player plugin and an experimental Web-based player, but it generally leaves actual sound-reproduction to specialized tools.
    ca_ES: Beets és un gestor de biblioteques musicals i no, en general, un reproductor de música. Inclou un simple complement de reproductor i un reproductor experimental basat en web, però generalment deixa la reproducció real del so a eines especialitzades.
    cs_CZ: Beets je správce hudební knihovny a z větší části ne hudební přehrávač. Obsahuje jednoduchý plugin pro přehrávač a experimentální webový přehrávač, ale samotnou reprodukci zvuku obecně ponechává specializovaným nástrojům.
    da_DK: Beets er en musikbiblioteksadministrator og for det meste ikke en musikafspiller. Den inkluderer et simpelt afspiller-plugin og en eksperimentel webbaseret afspiller, men den overlader generelt den faktiske lydgengivelse til specialiserede værktøjer.
    de_DE: Beets ist ein Musikbibliothek-Manager und in erster Linie kein Musikplayer. Es enthält zwar ein einfaches Player-Plugin und einen experimentellen webbasierten Player, überlässt die eigentliche Klangwiedergabe aber in der Regel spezialisierten Tools.
    el_GR: Το Beets είναι ένας διαχειριστής μουσικής βιβλιοθήκης και, ως επί το πλείστον, δεν είναι πρόγραμμα αναπαραγωγής μουσικής. Περιλαμβάνει ένα απλό πρόσθετο αναπαραγωγής και ένα πειραματικό πρόγραμμα αναπαραγωγής μέσω διαδικτύου, αλλά γενικά αφήνει την πραγματική αναπαραγωγή ήχου σε εξειδικευμένα εργαλεία.
    en_GB: Beets is a music library manager and not, for the most part, a music player. It does include a simple player plugin and an experimental Web-based player, but it generally leaves actual sound-reproduction to specialized tools.
    es_ES: Beets es un gestor de bibliotecas musicales y, principalmente, no un reproductor de música. Incluye un sencillo complemento de reproducción y un reproductor web experimental, pero en general deja la reproducción de sonido a herramientas especializadas.
    fr_FR: Beets est un gestionnaire de bibliothèque musicale et non, à proprement parler, un lecteur de musique. Il inclut bien un plugin de lecture simple et un lecteur web expérimental, mais laisse généralement la reproduction sonore proprement dite à des outils spécialisés.
    ga_IE: Is bainisteoir leabharlainne ceoil é Beets agus ní seinnteoir ceoil é den chuid is mó. Tá breiseán simplí seinnteora agus seinnteoir gréasánbhunaithe turgnamhach ann, ach is gnách go bhfágtar atáirgeadh fuaime iarbhír faoi uirlisí speisialaithe.
    hr_HR: Beets je upravitelj glazbene biblioteke i uglavnom nije glazbeni player. Uključuje jednostavan dodatak za player i eksperimentalni web-bazirani player, ali općenito prepušta stvarnu reprodukciju zvuka specijaliziranim alatima.
    hu_HU: A Beets egy zenekönyvtár-kezelő, és többnyire nem zenelejátszó. Tartalmaz egy egyszerű lejátszóbővítményt és egy kísérleti, webalapú lejátszót, de a tényleges hangvisszaadást általában speciális eszközökre bízza.
    it_IT: Beets è un gestore di librerie musicali e non, per la maggior parte, un lettore musicale. Include un semplice plugin per la riproduzione e un lettore sperimentale basato sul Web, ma in genere lascia la riproduzione audio vera e propria a strumenti specializzati.
    ja_JP: Beetsは音楽ライブラリ管理ソフトであり、基本的には音楽プレーヤーではありません。シンプルなプレーヤープラグインと実験的なWebベースのプレーヤーは含まれていますが、実際の音声再生は基本的に専用ツールに任せています。
    ko_KR: Beets는 음악 라이브러리 관리자이지, 대부분 음악 플레이어는 아닙니다. 간단한 플레이어 플러그인과 실험적인 웹 기반 플레이어를 포함하고 있기는 하지만, 실제 소리 재생은 대부분 전문 도구에 맡깁니다.
    ml_IN: ബീറ്റ്‌സ് ഒരു മ്യൂസിക് ലൈബ്രറി മാനേജരാണ്, മിക്കവാറും ഒരു മ്യൂസിക് പ്ലെയറല്ല. ഇതിൽ ഒരു ലളിതമായ പ്ലെയർ പ്ലഗിൻ, ഒരു പരീക്ഷണാത്മക വെബ് അധിഷ്ഠിത പ്ലെയർ എന്നിവ ഉൾപ്പെടുന്നു, പക്ഷേ ഇത് സാധാരണയായി യഥാർത്ഥ ശബ്‌ദ പുനരുൽപാദനത്തെ പ്രത്യേക ഉപകരണങ്ങൾക്ക് വിടുന്നു.
    nb_NO: Beets er en musikkbibliotekbehandler og for det meste ikke en musikkspiller. Den inkluderer en enkel avspillerplugin og en eksperimentell nettbasert spiller, men den overlater vanligvis den faktiske lydgjengivelsen til spesialiserte verktøy.
    nl_NL: Beets is een muziekbibliotheekbeheerder en grotendeels geen muziekspeler. Het bevat wel een eenvoudige afspeelplug-in en een experimentele webgebaseerde speler, maar de daadwerkelijke geluidsweergave wordt over het algemeen overgelaten aan gespecialiseerde tools.
    pl_PL: Beets to menedżer biblioteki muzycznej, a nie, w przeważającej mierze, odtwarzacz muzyki. Zawiera prostą wtyczkę do odtwarzacza i eksperymentalny odtwarzacz internetowy, ale generalnie pozostawia faktyczne odtwarzanie dźwięku wyspecjalizowanym narzędziom.
    pt_BR: O Beets é um gerenciador de biblioteca musical e não, em sua maior parte, um reprodutor de música. Ele inclui um plugin de reprodução simples e um reprodutor experimental baseado na Web, mas geralmente deixa a reprodução de som propriamente dita para ferramentas especializadas.
    ro_RO: Beets este un manager de bibliotecă muzicală și nu, în mare parte, un player muzical. Include un plugin simplu pentru player și un player web experimental, dar, în general, lasă reproducerea sunetului în seama instrumentelor specializate.
    ru_RU: Beets — это менеджер музыкальной библиотеки, а не, по большей части, музыкальный плеер. Он включает в себя простой плагин плеера и экспериментальный веб-плеер, но в целом фактическое воспроизведение звука осуществляется специализированными инструментами.
    sk_SK: Beets je správca hudobných knižníc a z väčšej časti nie je hudobný prehrávač. Obsahuje jednoduchý doplnok prehrávača a experimentálny webový prehrávač, ale samotnú reprodukciu zvuku vo všeobecnosti ponecháva na špecializované nástroje.
    sv_SE: Beets är en musikbibliotekshanterare och till största delen inte en musikspelare. Den innehåller ett enkelt spelarplugin och en experimentell webbaserad spelare, men den överlåter i allmänhet den faktiska ljudåtergivningen till specialiserade verktyg.
    tr_TR: Beets, çoğunlukla bir müzik çalar değil, bir müzik kütüphanesi yöneticisidir. Basit bir oynatıcı eklentisi ve deneysel bir web tabanlı oynatıcı içerir, ancak genel olarak gerçek ses üretimini uzmanlaşmış araçlara bırakır.
    zh_CN: Beets 主要是一款音乐库管理器，而不是音乐播放器。它包含一个简单的播放器插件和一个实验性的网页播放器，但通常将实际音频播放交给专门的工具。
    zh_TW: Beets 主要是一款音樂庫管理器，而不是音樂播放器。它包含一個簡單的播放器外掛和一個實驗性的網頁播放器，但通常將實際音訊播放交給專門的工具。
