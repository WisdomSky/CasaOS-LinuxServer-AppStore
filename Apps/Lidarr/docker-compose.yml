name: linuxserver-lidarr
services:
  app:
    image: linuxserver/lidarr:3.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8686
        published: 8686
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lidarr/config
        target: /config
      - type: bind
        source: /DATA/AppData/lidarr/music
        target: /music
      - type: bind
        source: /DATA/AppData/lidarr/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Lidarr is a music collection manager for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new tracks from your favorite artists and will grab, sort and rename them. It can also be configured to automatically upgrade the quality of files already downloaded when a better quality format becomes available.
    ca_ES: Lidarr és un gestor de col·leccions de música per a usuaris d'Usenet i BitTorrent. Pot monitoritzar múltiples canals RSS per a noves pistes dels vostres artistes preferits i les captura, ordena i canvia de nom. També es pot configurar per millorar automàticament la qualitat dels fitxers ja descarregats quan estigui disponible un format de millor qualitat.
    cs_CZ: Lidarr je správce hudebních sbírek pro uživatele Usenetu a BitTorrentu. Dokáže sledovat více RSS kanálů a vyhledávat nové skladby od vašich oblíbených interpretů, načítat je, třídit a přejmenovávat. Lze jej také nakonfigurovat tak, aby automaticky zvyšoval kvalitu již stažených souborů, jakmile bude k dispozici formát lepší kvality.
    da_DK: Lidarr er en musiksamlingsadministrator til Usenet- og BitTorrent-brugere. Den kan overvåge flere RSS-feeds for nye numre fra dine yndlingskunstnere og vil hente, sortere og omdøbe dem. Den kan også konfigureres til automatisk at opgradere kvaliteten af filer, der allerede er downloadet, når et bedre kvalitetsformat bliver tilgængeligt.
    de_DE: Lidarr ist ein Musik-Sammlungsmanager für Usenet- und BitTorrent-Nutzer. Er überwacht mehrere RSS-Feeds nach neuen Titeln Ihrer Lieblingskünstler und lädt diese herunter, sortiert und benennt sie um. Zudem kann er so konfiguriert werden, dass die Qualität bereits heruntergeladener Dateien automatisch verbessert wird, sobald ein besseres Format verfügbar ist.
    el_GR: Το Lidarr είναι ένας διαχειριστής μουσικών συλλογών για χρήστες Usenet και BitTorrent. Μπορεί να παρακολουθεί πολλαπλές ροές RSS για νέα κομμάτια από τους αγαπημένους σας καλλιτέχνες και να τα καταγράφει, να τα ταξινομεί και να τα μετονομάζει. Μπορεί επίσης να ρυθμιστεί ώστε να αναβαθμίζει αυτόματα την ποιότητα των αρχείων που έχουν ήδη ληφθεί όταν γίνει διαθέσιμη μια καλύτερη μορφή ποιότητας.
    en_GB: Lidarr is a music collection manager for Usenet and Bittorrent users. It can monitor multiple Rss feeds for new tracks from your favourite artists and will grab, sort and rename them. It can also be configured to automatically upgrade the quality of files already downloaded when a better quality format becomes available.
    es_ES: Lidarr es un gestor de colecciones de música para usuarios de Usenet y BitTorrent. Puede monitorizar múltiples fuentes RSS en busca de nuevas canciones de tus artistas favoritos, descargarlas, organizarlas y renombrarlas. También se puede configurar para mejorar automáticamente la calidad de los archivos ya descargados cuando haya un formato de mayor calidad disponible.
    fr_FR: Lidarr est un gestionnaire de bibliothèque musicale pour les utilisateurs d'Usenet et de BitTorrent. Il surveille plusieurs flux RSS pour détecter les nouveaux morceaux de vos artistes préférés, les télécharger, les trier et les renommer. Il peut également être configuré pour mettre à jour automatiquement la qualité des fichiers téléchargés lorsqu'un format de meilleure qualité est disponible.
    ga_IE: Is bainisteoir bailiúcháin ceoil é Lidarr d’úsáideoirí Usenet agus BitTorrent. Is féidir leis monatóireacht a dhéanamh ar roinnt fothaí RSS le haghaidh rianta nua ó d’ealaíontóirí is fearr leat agus déanfaidh sé iad a bhailiú, a shórtáil agus a athainmniú. Is féidir é a chumrú freisin chun cáilíocht na gcomhad atá íoslódáilte cheana féin a uasghrádú go huathoibríoch nuair a bhíonn formáid de chaighdeán níos fearr ar fáil.
    hr_HR: Lidarr je upravitelj glazbenih kolekcija za korisnike Useneta i BitTorrenta. Može pratiti više RSS feedova za nove pjesme vaših omiljenih izvođača te ih dohvatiti, sortirati i preimenovati. Također se može konfigurirati za automatsko poboljšanje kvalitete već preuzetih datoteka kada postane dostupan format bolje kvalitete.
    hu_HU: A Lidarr egy zenegyűjtemény-kezelő Usenet és BitTorrent felhasználók számára. Több RSS-hírcsatornát is képes figyelni kedvenc előadóink új dalaiért, és lekéri, rendezi és átnevezi azokat. Úgy is beállítható, hogy automatikusan frissítse a már letöltött fájlok minőségét, amikor jobb minőségű formátum válik elérhetővé.
    it_IT: Lidarr è un gestore di raccolte musicali per utenti Usenet e BitTorrent. Può monitorare più feed RSS per individuare nuovi brani dei tuoi artisti preferiti e li scarica, ordina e rinomina. Può anche essere configurato per aggiornare automaticamente la qualità dei file già scaricati quando è disponibile un formato di qualità superiore.
    ja_JP: Lidarrは、UsenetおよびBitTorrentユーザー向けの音楽コレクションマネージャーです。複数のRSSフィードを監視し、お気に入りのアーティストの新曲を自動的に取得、整理、名前変更します。また、より高音質のフォーマットが利用可能になった際に、既にダウンロード済みのファイルの音質を自動的にアップグレードするように設定することも可能です。
    ko_KR: Lidarr는 Usenet 및 BitTorrent 사용자를 위한 음악 컬렉션 관리 프로그램입니다. 여러 RSS 피드를 모니터링하여 좋아하는 아티스트의 새 트랙을 찾고, 다운로드, 정렬 및 파일 이름 변경을 자동으로 수행합니다. 또한, 더 나은 음질의 파일이 출시되면 이미 다운로드한 파일의 음질을 자동으로 업그레이드하도록 설정할 수도 있습니다.
    ml_IN: യൂസ്‌നെറ്റ്, ബിറ്റ്‌ടോറന്റ് ഉപയോക്താക്കൾക്കുള്ള ഒരു സംഗീത ശേഖരണ മാനേജരാണ് ലിഡാർ. നിങ്ങളുടെ പ്രിയപ്പെട്ട കലാകാരന്മാരുടെ പുതിയ ട്രാക്കുകൾക്കായി ഒന്നിലധികം RSS ഫീഡുകൾ നിരീക്ഷിക്കാനും അവ പിടിച്ചെടുക്കാനും തരംതിരിക്കാനും പേരുമാറ്റാനും ഇതിന് കഴിയും. മികച്ച നിലവാരമുള്ള ഫോർമാറ്റ് ലഭ്യമാകുമ്പോൾ ഇതിനകം ഡൗൺലോഡ് ചെയ്‌ത ഫയലുകളുടെ ഗുണനിലവാരം യാന്ത്രികമായി അപ്‌ഗ്രേഡ് ചെയ്യുന്നതിനും ഇത് കോൺഫിഗർ ചെയ്യാവുന്നതാണ്.
    nb_NO: Lidarr er en musikksamlingsadministrator for Usenet- og BitTorrent-brukere. Den kan overvåke flere RSS-feeder for nye spor fra favorittartistene dine og vil hente, sortere og gi dem nytt navn. Den kan også konfigureres til å automatisk oppgradere kvaliteten på filer som allerede er nedlastet når et bedre kvalitetsformat blir tilgjengelig.
    nl_NL: Lidarr is een muziekcollectiebeheerder voor Usenet- en BitTorrent-gebruikers. Het kan meerdere RSS-feeds monitoren op nieuwe nummers van je favoriete artiesten en deze downloaden, sorteren en hernoemen. Het kan ook zo worden geconfigureerd dat de kwaliteit van reeds gedownloade bestanden automatisch wordt verbeterd wanneer een betere kwaliteit beschikbaar komt.
    pl_PL: Lidarr to menedżer kolekcji muzyki dla użytkowników Usenetu i BitTorrenta. Może monitorować wiele kanałów RSS w poszukiwaniu nowych utworów Twoich ulubionych artystów, a następnie je wyszukiwać, sortować i zmieniać nazwy. Można go również skonfigurować tak, aby automatycznie podnosił jakość pobranych plików, gdy tylko pojawi się lepszy format.
    pt_BR: O Lidarr é um gerenciador de coleções de música para usuários de Usenet e BitTorrent. Ele monitora múltiplos feeds RSS em busca de novas faixas de seus artistas favoritos, baixando, organizando e renomeando os arquivos. Também pode ser configurado para atualizar automaticamente a qualidade dos arquivos já baixados quando um formato de melhor qualidade estiver disponível.
    ro_RO: Lidarr este un manager de colecții de muzică pentru utilizatorii Usenet și BitTorrent. Poate monitoriza mai multe fluxuri RSS pentru melodii noi de la artiștii preferați și le va prelua, sorta și redenumi. De asemenea, poate fi configurat să îmbunătățească automat calitatea fișierelor deja descărcate atunci când devine disponibil un format de calitate mai bună.
    ru_RU: Lidarr — это менеджер музыкальных коллекций для пользователей Usenet и BitTorrent. Он может отслеживать несколько RSS-каналов на предмет новых треков от ваших любимых исполнителей, а также получать, сортировать и переименовывать их. Его также можно настроить на автоматическое повышение качества уже загруженных файлов при появлении более качественного формата.
    sk_SK: Lidarr je správca hudobných zbierok pre používateľov sietí Usenet a BitTorrent. Dokáže monitorovať viacero RSS kanálov a vyhľadávať nové skladby od vašich obľúbených interpretov a dokáže ich načítať, zoradiť a premenovať. Dá sa tiež nakonfigurovať tak, aby automaticky zvyšoval kvalitu už stiahnutých súborov, keď bude k dispozícii formát lepšej kvality.
    sv_SE: Lidarr är en musiksamlingshanterare för Usenet- och BitTorrent-användare. Den kan övervaka flera RSS-flöden för nya låtar från dina favoritartister och hämta, sortera och byta namn på dem. Den kan också konfigureras för att automatiskt uppgradera kvaliteten på filer som redan laddats ner när ett format med bättre kvalitet blir tillgängligt.
    tr_TR: Lidarr, Usenet ve BitTorrent kullanıcıları için bir müzik koleksiyonu yöneticisidir. En sevdiğiniz sanatçıların yeni parçaları için birden fazla RSS akışını izleyebilir, bunları indirir, sıralar ve yeniden adlandırır. Ayrıca, daha iyi kalitede bir format mevcut olduğunda, zaten indirilmiş dosyaların kalitesini otomatik olarak yükseltecek şekilde de yapılandırılabilir.
    zh_CN: Lidarr 是面向 Usenet 和 BitTorrent 用户的音乐收藏管理器。它可监控多个 RSS 订阅源，发现喜欢的艺人的新曲目，并自动获取、整理和重命名。还可配置为在更高品质版本出现时，自动升级已下载的文件。
    zh_TW: Lidarr 是面向 Usenet 和 BitTorrent 使用者的音樂收藏管理器。它可監控多個 RSS 訂閱源，發現喜歡的藝人的新曲目，並自動獲取、整理和重新命名。還可配置為在更高品質版本出現時，自動升級已下載的檔案。
