    ru_RU: Менеджер музыкальных коллекций для пользователей Usenet и BitTorrent. Он может отслеживать несколько RSS-каналов на предмет новых треков от ваших любимых исполнителей, а также получать, сортировать и переименовывать их. Его также можно настроить на автоматическое повышение качества уже загруженных файлов при появлении более качественного формата.
    sk_SK: Správca hudobných zbierok pre používateľov sietí Usenet a BitTorrent. Dokáže monitorovať viacero RSS kanálov a vyhľadávať nové skladby od vašich obľúbených interpretov a ich následne získavať, triediť a premenovávať. Dá sa tiež nakonfigurovať tak, aby automaticky zvyšoval kvalitu už stiahnutých súborov, keď bude k dispozícii formát lepšej kvality.
    sv_SE: En musiksamlingshanterare för Usenet- och BitTorrent-användare. Den kan övervaka flera RSS-flöden för nya låtar från dina favoritartister och hämta, sortera och byta namn på dem. Den kan också konfigureras för att automatiskt uppgradera kvaliteten på filer som redan laddats ner när ett format med bättre kvalitet blir tillgängligt.
    tr_TR: Usenet ve BitTorrent kullanıcıları için bir müzik koleksiyonu yöneticisi. En sevdiğiniz sanatçıların yeni parçaları için birden fazla RSS akışını izleyebilir, bunları indirir, sıralar ve yeniden adlandırır. Ayrıca, daha iyi kalitede bir format mevcut olduğunda, zaten indirilmiş dosyaların kalitesini otomatik olarak yükseltecek şekilde de yapılandırılabilir.
    zh_CN: 为 Usenet 和 BitTorrent 用户管理音乐收藏。
    zh_TW: 為 Usenet 和 BitTorrent 使用者管理音樂收藏。
