name: linuxserver-sonarr
services:
  app:
    image: linuxserver/sonarr:4.0.20
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8989
        published: 8989
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sonarr/config
        target: /config
      - type: bind
        source: /DATA/AppData/sonarr/tv
        target: /tv
      - type: bind
        source: /DATA/AppData/sonarr/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Sonarr (formerly NZBdrone) is a PVR for usenet and bittorrent users. It can monitor multiple RSS feeds for new episodes of your favorite shows and will grab, sort and rename them. It can also be configured to automatically upgrade the quality of files already downloaded when a better quality format becomes available.
    ca_ES: Sonarr (anteriorment NZBdrone) és un PVR per a usuaris d'usenet i bittorrent. Pot monitoritzar múltiples canals RSS per a nous episodis dels vostres programes preferits i els captura, ordena i canvia de nom. També es pot configurar per millorar automàticament la qualitat dels fitxers ja descarregats quan estigui disponible un format de millor qualitat.
    cs_CZ: Sonarr (dříve NZBdrone) je PVR pro uživatele sítí Usenet a BitTorrent. Dokáže sledovat více RSS kanálů a vyhledávat nové epizody vašich oblíbených pořadů, načítat je, třídit a přejmenovávat. Lze jej také nakonfigurovat tak, aby automaticky zvyšoval kvalitu již stažených souborů, jakmile bude k dispozici formát lepší kvality.
    da_DK: Sonarr (tidligere NZBdrone) er en PVR til usenet- og bittorrent-brugere. Den kan overvåge flere RSS-feeds for nye episoder af dine yndlingsprogrammer og vil hente, sortere og omdøbe dem. Den kan også konfigureres til automatisk at opgradere kvaliteten af filer, der allerede er downloadet, når et bedre kvalitetsformat bliver tilgængeligt.
    de_DE: Sonarr (ehemals NZBdrone) ist ein PVR für Usenet- und BitTorrent-Nutzer. Es überwacht mehrere RSS-Feeds auf neue Folgen Ihrer Lieblingsserien und lädt diese herunter, sortiert und benennt sie um. Außerdem kann es so konfiguriert werden, dass die Qualität bereits heruntergeladener Dateien automatisch verbessert wird, sobald ein besseres Format verfügbar ist.
    el_GR: Το Sonarr (πρώην NZBdrone) είναι ένα πρόγραμμα PVR για χρήστες usenet και bittorrent. Μπορεί να παρακολουθεί πολλαπλές ροές RSS για νέα επεισόδια των αγαπημένων σας εκπομπών και να τις καταγράφει, να τις ταξινομεί και να τις μετονομάζει. Μπορεί επίσης να ρυθμιστεί ώστε να αναβαθμίζει αυτόματα την ποιότητα των αρχείων που έχουν ήδη ληφθεί όταν γίνει διαθέσιμη μια καλύτερη μορφή ποιότητας.
    en_GB: Sonarr (formerly Nzbdrone) is a Pvr for usenet and bittorrent users. It can monitor multiple Rss feeds for new episodes of your favourite shows and will grab, sort and rename them. It can also be configured to automatically upgrade the quality of files already downloaded when a better quality format becomes available.
    es_ES: Sonarr (antes NZBdrone) es un grabador de vídeo digital (PVR) para usuarios de Usenet y BitTorrent. Puede monitorizar múltiples fuentes RSS para encontrar nuevos episodios de tus series favoritas, descargarlos, ordenarlos y renombrarlos. También se puede configurar para mejorar automáticamente la calidad de los archivos ya descargados cuando haya un formato de mayor calidad disponible.
    fr_FR: Sonarr (anciennement NZBdrone) est un enregistreur numérique personnel (PVR) pour les utilisateurs d'Usenet et de BitTorrent. Il permet de surveiller plusieurs flux RSS pour les nouveaux épisodes de vos séries préférées et de les télécharger, les trier et les renommer. Il peut également être configuré pour mettre à jour automatiquement la qualité des fichiers déjà téléchargés lorsqu'un format de meilleure qualité est disponible.
    ga_IE: Is PVR é Sonarr (NZBdrone roimhe seo) d’úsáideoirí usenet agus bittorrent. Is féidir leis monatóireacht a dhéanamh ar ilfhothaí RSS le haghaidh eipeasóidí nua de do chláir is fearr leat agus déanfaidh sé iad a ghabháil, a shórtáil agus a athainmniú. Is féidir é a chumrú freisin chun cáilíocht na gcomhad atá íoslódáilte cheana féin a uasghrádú go huathoibríoch nuair a bhíonn formáid de chaighdeán níos fearr ar fáil.
    hr_HR: Sonarr (prije NZBdrone) je PVR za korisnike Useneta i BitTorrenta. Može pratiti više RSS feedova za nove epizode vaših omiljenih emisija te ih hvatati, sortirati i preimenovati. Također se može konfigurirati da automatski nadograđuje kvalitetu već preuzetih datoteka kada postane dostupan format bolje kvalitete.
    hu_HU: A Sonarr (korábban NZBdrone) egy PVR Usenet és BitTorrent felhasználók számára. Több RSS-hírcsatornát is képes figyelni kedvenc műsoraid új epizódjaiért, és azokat lekéri, rendezi és átnevezi. Úgy is beállítható, hogy automatikusan frissítse a már letöltött fájlok minőségét, amikor jobb minőségű formátum válik elérhetővé.
    it_IT: Sonarr (precedentemente NZBdrone) è un PVR per utenti Usenet e BitTorrent. Può monitorare più feed RSS per i nuovi episodi dei tuoi programmi preferiti e li scarica, ordina e rinomina automaticamente. Può anche essere configurato per migliorare automaticamente la qualità dei file già scaricati quando è disponibile un formato di qualità superiore.
    ja_JP: Sonarr（旧NZBdrone）は、UsenetおよびBitTorrentユーザー向けのPVR（パーソナルビデオレコーダー）です。複数のRSSフィードを監視して、お気に入りの番組の新しいエピソードを取得し、整理して名前を変更できます。また、より高画質のフォーマットが利用可能になった際に、既にダウンロード済みのファイルの画質を自動的に向上させるように設定することも可能です。
    ko_KR: 'Sonarr(이전 이름: NZBdrone)는 유즈넷 및 비트토렌트 사용자를 위한 PVR(개인용 비디오 레코더)입니다. 여러 RSS 피드를 모니터링하여 좋아하는 프로그램의 새 에피소드를 찾고, 다운로드, 정렬 및 파일 이름 변경을 자동으로 수행합니다. 또한, 더 나은 화질의 파일이 출시되면 이미 다운로드한 파일의 화질을 자동으로 업그레이드하도록 설정할 수도 있습니다.'
    ml_IN: സോണാർ (മുമ്പ് NZBdrone) യൂസ്‌നെറ്റ്, ബിറ്റോറന്റ് ഉപയോക്താക്കൾക്കുള്ള ഒരു PVR ആണ്. നിങ്ങളുടെ പ്രിയപ്പെട്ട ഷോകളുടെ പുതിയ എപ്പിസോഡുകൾക്കായി ഒന്നിലധികം RSS ഫീഡുകൾ നിരീക്ഷിക്കാനും അവ പിടിച്ചെടുക്കാനും തരംതിരിക്കാനും പേരുമാറ്റാനും ഇതിന് കഴിയും. മികച്ച നിലവാരമുള്ള ഫോർമാറ്റ് ലഭ്യമാകുമ്പോൾ ഇതിനകം ഡൗൺലോഡ് ചെയ്‌ത ഫയലുകളുടെ ഗുണനിലവാരം യാന്ത്രികമായി അപ്‌ഗ്രേഡ് ചെയ്യുന്നതിനും ഇത് കോൺഫിഗർ ചെയ്യാവുന്നതാണ്.
    nb_NO: Sonarr (tidligere NZBdrone) er en PVR for usenet- og bittorrent-brukere. Den kan overvåke flere RSS-feeder for nye episoder av favorittprogrammene dine, og den vil hente, sortere og gi dem nytt navn. Den kan også konfigureres til å automatisk oppgradere kvaliteten på filer som allerede er nedlastet når et bedre kvalitetsformat blir tilgjengelig.
    nl_NL: Sonarr (voorheen NZBdrone) is een PVR voor Usenet- en BitTorrent-gebruikers. Het kan meerdere RSS-feeds monitoren op nieuwe afleveringen van je favoriete series en deze downloaden, sorteren en hernoemen. Het kan ook zo worden geconfigureerd dat de kwaliteit van reeds gedownloade bestanden automatisch wordt verbeterd wanneer een betere kwaliteit beschikbaar komt.
    pl_PL: Sonarr (dawniej NZBdrone) to nagrywarka PVR dla użytkowników Usenetu i BitTorrenta. Może monitorować wiele kanałów RSS w poszukiwaniu nowych odcinków ulubionych programów, a następnie je pobierać, sortować i zmieniać nazwy. Można go również skonfigurować tak, aby automatycznie podnosił jakość pobranych plików, gdy pojawi się lepszy format.
    pt_BR: O Sonarr (anteriormente NZBdrone) é um gravador de vídeo pessoal (PVR) para usuários de Usenet e BitTorrent. Ele monitora múltiplos feeds RSS em busca de novos episódios de seus programas favoritos, baixando, organizando e renomeando os arquivos. Também pode ser configurado para atualizar automaticamente a qualidade dos arquivos já baixados quando um formato de melhor qualidade estiver disponível.
    ro_RO: Sonarr (fostul NZBdrone) este un PVR pentru utilizatorii Usenet și BitTorrent. Poate monitoriza mai multe fluxuri RSS pentru episoade noi din emisiunile tale preferate și le va prelua, sorta și redenumi. De asemenea, poate fi configurat să îmbunătățească automat calitatea fișierelor deja descărcate atunci când devine disponibil un format de calitate mai bună.
    ru_RU: Sonarr (ранее NZBdrone) — это PVR для пользователей Usenet и BitTorrent. Он может отслеживать несколько RSS-каналов на предмет новых эпизодов ваших любимых сериалов, а также загружать, сортировать и переименовывать их. Его также можно настроить на автоматическое повышение качества уже загруженных файлов при появлении более качественного формата.
    sk_SK: Sonarr (predtým NZBdrone) je PVR pre používateľov sietí Usenet a BitTorrent. Dokáže monitorovať viacero RSS kanálov, aby našiel nové epizódy vašich obľúbených relácií, a dokáže ich zachytiť, zoradiť a premenovať. Dá sa tiež nakonfigurovať tak, aby automaticky zvyšoval kvalitu už stiahnutých súborov, keď bude k dispozícii formát lepšej kvality.
    sv_SE: Sonarr (tidigare NZBdrone) är en PVR för usenet- och bittorrent-användare. Den kan övervaka flera RSS-flöden för nya avsnitt av dina favoritprogram och hämta, sortera och byta namn på dem. Den kan också konfigureras för att automatiskt uppgradera kvaliteten på filer som redan laddats ner när ett format med bättre kvalitet blir tillgängligt.
    tr_TR: Sonarr (eski adıyla NZBdrone), Usenet ve BitTorrent kullanıcıları için bir PVR'dır. En sevdiğiniz dizilerin yeni bölümlerini birden fazla RSS kaynağından takip edebilir, bunları indirip sıralayabilir ve yeniden adlandırabilir. Ayrıca, daha yüksek kaliteli bir format mevcut olduğunda, zaten indirilmiş dosyaların kalitesini otomatik olarak yükseltecek şekilde de yapılandırılabilir.
    zh_CN: Sonarr（原名 NZBdrone）是面向 Usenet 和 BitTorrent 用户的 PVR。它可监控多个 RSS 订阅源，发现喜欢的剧集的新一集，并自动获取、整理和重命名。还可配置为在更高品质版本出现时，自动升级已下载的文件。
    zh_TW: Sonarr（原名 NZBdrone）是面向 Usenet 和 BitTorrent 使用者的 PVR。它可監控多個 RSS 訂閱源，發現喜歡的劇集的新一集，並自動獲取、整理和重新命名。還可配置為在更高品質版本出現時，自動升級已下載的檔案。
