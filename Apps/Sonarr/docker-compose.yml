    ro_RO: (fostul NZBdrone) este un PVR pentru utilizatorii de Usenet și BitTorrent. Poate monitoriza mai multe fluxuri RSS pentru episoade noi din emisiunile dvs. preferate și le va prelua, sorta și redenumi. De asemenea, poate fi configurat să îmbunătățească automat calitatea fișierelor deja descărcate atunci când devine disponibil un format de calitate mai bună.
    ru_RU: (ранее NZBdrone) — это PVR для пользователей Usenet и BitTorrent. Он может отслеживать несколько RSS-каналов на предмет новых эпизодов ваших любимых сериалов, а также загружать, сортировать и переименовывать их. Его также можно настроить на автоматическое повышение качества уже загруженных файлов при появлении более качественного формата.
    sk_SK: (predtým NZBdrone) je PVR pre používateľov sietí Usenet a BitTorrent. Dokáže monitorovať viacero RSS kanálov, aby našiel nové epizódy vašich obľúbených relácií, a následne ich načíta, zoradí a premenuje. Dá sa tiež nakonfigurovať tak, aby automaticky zvyšoval kvalitu už stiahnutých súborov, keď bude k dispozícii formát lepšej kvality.
    sv_SE: (tidigare NZBdrone) är en PVR för usenet- och bittorrent-användare. Den kan övervaka flera RSS-flöden för nya avsnitt av dina favoritprogram och hämta, sortera och byta namn på dem. Den kan också konfigureras för att automatiskt uppgradera kvaliteten på filer som redan laddats ner när ett format med bättre kvalitet blir tillgängligt.
    tr_TR: (Eski adıyla NZBdrone) Usenet ve BitTorrent kullanıcıları için bir PVR'dır. En sevdiğiniz dizilerin yeni bölümleri için birden fazla RSS akışını izleyebilir, bunları indirir, sıralar ve yeniden adlandırır. Ayrıca, daha iyi kalitede bir format mevcut olduğunda, zaten indirilmiş dosyaların kalitesini otomatik olarak yükseltecek şekilde de yapılandırılabilir.
    zh_CN: 自动获取、整理和升级电视剧集。
    zh_TW: 自動獲取、整理和升級電視劇集。
