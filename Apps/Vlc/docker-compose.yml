name: linuxserver-vlc
services:
  app:
    image: linuxserver/vlc:3.0.23
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: VLC_CLI
          description:
            en_US: Specify one or multiple VLC CLI flags, this string will be passed to the application in full. [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: VLC Media Player is a free and open source cross-platform multimedia player and framework that delivers dependable performance across multiple devices.
    ca_ES: VLC Media Player és un reproductor i framework multiplataforma gratuït i de codi obert que ofereix un rendiment fiable en diversos dispositius.
    cs_CZ: VLC Media Player je bezplatný a open source multiplatformní multimediální přehrávač a framework, který poskytuje spolehlivý výkon na více zařízeních.
    da_DK: VLC Media Player er en gratis og open source-multimedieafspiller og et framework til flere platforme, der leverer pålidelig ydeevne på tværs af flere enheder.
    de_DE: Der VLC Media Player ist ein kostenloser und quelloffener, plattformübergreifender Multimedia-Player und ein Framework, das auf verschiedenen Geräten zuverlässige Leistung bietet.
    el_GR: Το VLC Media Player είναι ένα δωρεάν και ανοιχτού κώδικα πρόγραμμα αναπαραγωγής πολυμέσων και framework για όλες τις πλατφόρμες που προσφέρει αξιόπιστη απόδοση σε πολλαπλές συσκευές.
