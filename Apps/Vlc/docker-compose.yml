    nb_NO: VLC Media Player er en gratis og åpen kildekode-multimediaspiller og et rammeverk for flere plattformer som leverer pålitelig ytelse på tvers av flere enheter.
    nl_NL: VLC Media Player is een gratis en open source, platformonafhankelijke multimediaspeler en framework dat betrouwbare prestaties levert op diverse apparaten.
    pl_PL: VLC Media Player to darmowy i otwarty odtwarzacz multimedialny o charakterze międzyplatformowym, który gwarantuje niezawodną wydajność na wielu urządzeniach.
    pt_BR: O VLC Media Player é um reprodutor e framework multimídia multiplataforma gratuito e de código aberto que oferece desempenho confiável em diversos dispositivos.
    ro_RO: VLC Media Player este un player multimedia și framework gratuit și open source, multiplatformă, care oferă performanțe fiabile pe mai multe dispozitive.
    ru_RU: VLC Media Player — это бесплатный мультимедийный проигрыватель и платформа с открытым исходным кодом, работающая на разных платформах и обеспечивающая надежную работу.
    sk_SK: VLC Media Player je bezplatný a open source multiplatformový multimediálny prehrávač a framework, ktorý poskytuje spoľahlivý výkon na viacerých zariadeniach.
    sv_SE: VLC Media Player är en gratis och öppen källkodsbaserad multimediaspelare och ett ramverk för flera plattformar som levererar pålitlig prestanda över flera enheter.
    tr_TR: VLC Media Player, birden fazla cihazda güvenilir performans sağlayan, ücretsiz ve açık kaynaklı, platformlar arası bir multimedya oynatıcı ve çerçevesidir.
    zh_CN: VLC Media Player 是免费、开源、跨平台的多媒体播放器和框架，可在多种设备上提供可靠的播放表现。
