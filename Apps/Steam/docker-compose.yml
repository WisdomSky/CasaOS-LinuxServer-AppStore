name: linuxserver-steam
services:
  app:
    image: linuxserver/steam:version-0779c5e2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/steam/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Steam is the ultimate destination for playing, discussing, and creating games.
    zh_CN: Steam 是一个用于游玩、讨论和创作游戏的平台。
  tagline:
    en_US: The ultimate destination for playing, discussing, and creating games.
    zh_CN: 用于游玩、讨论和创作游戏的平台。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/steam-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/steam-logo.png
  title:
    en_US: Steam (LinuxServer.io)
    zh_CN: Steam（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserversteam
  port_map: '3000'
  version: version-0779c5e2
