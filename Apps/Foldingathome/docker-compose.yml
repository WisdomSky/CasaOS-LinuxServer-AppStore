    hr_HR: Projekt distribuiranog računalstva za simulaciju dinamike proteina, uključujući proces savijanja proteina i kretanje proteina uključenih u razne bolesti. Okuplja građane znanstvenike koji se dobrovoljno javljaju za provođenje simulacija dinamike proteina na svojim osobnim računalima. Uvidi iz ovih podataka pomažu znanstvenicima da bolje razumiju biologiju i pružaju nove mogućnosti za razvoj terapije.
    hu_HU: Egy elosztott számítási projekt fehérjedinamika szimulálására, beleértve a fehérjehajtogatás folyamatát és a különféle betegségekkel összefüggő fehérjék mozgását. Összehozza azokat a civil tudósokat, akik önkéntesként fehérjedinamikai szimulációkat futtatnak személyi számítógépeiken. Az ezekből az adatokból származó információk segítik a tudósokat a biológia jobb megértésében, és új lehetőségeket kínálnak a terápiák fejlesztésére.
    it_IT: Un progetto di calcolo distribuito per la simulazione delle dinamiche proteiche, tra cui il processo di ripiegamento delle proteine e i movimenti delle proteine implicate in diverse patologie. Il progetto riunisce cittadini scienziati che si offrono volontari per eseguire simulazioni delle dinamiche proteiche sui propri computer personali. Le informazioni ricavate da questi dati aiutano gli scienziati a comprendere meglio la biologia e offrono nuove opportunità per lo sviluppo di terapie.
    ja_JP: タンパク質の折りたたみ過程や、様々な疾患に関与するタンパク質の動きなど、タンパク質の動態をシミュレーションするための分散コンピューティングプロジェクト。このプロジェクトでは、ボランティアとして個人のコンピュータ上でタンパク質動態のシミュレーションを実行する市民科学者たちが集結しています。このデータから得られる知見は、科学者が生物学をより深く理解するのに役立ち、新たな治療法開発の機会を提供しています。
    ko_KR: 단백질 접힘 과정과 다양한 질병과 관련된 단백질의 움직임을 포함한 단백질 역학을 시뮬레이션하는 분산 컴퓨팅 프로젝트입니다. 이 프로젝트는 자발적으로 개인용 컴퓨터에서 단백질 역학 시뮬레이션을 실행하는 시민 과학자들을 한데 모읍니다. 이 데이터에서 얻은 통찰력은 과학자들이 생물학을 더 잘 이해하고 새로운 치료법 개발을 위한 기회를 제공하는 데 도움이 되고 있습니다.
    ml_IN: പ്രോട്ടീൻ ഡൈനാമിക്സ് സിമുലേറ്റ് ചെയ്യുന്നതിനുള്ള ഒരു ഡിസ്ട്രിബ്യൂട്ടഡ് കമ്പ്യൂട്ടിംഗ് പ്രോജക്റ്റ്, ഇതിൽ പ്രോട്ടീൻ മടക്കൽ പ്രക്രിയയും വിവിധ രോഗങ്ങളിൽ ഉൾപ്പെട്ടിരിക്കുന്ന പ്രോട്ടീനുകളുടെ ചലനങ്ങളും ഉൾപ്പെടുന്നു. തങ്ങളുടെ പേഴ്സണൽ കമ്പ്യൂട്ടറുകളിൽ പ്രോട്ടീൻ ഡൈനാമിക്സിന്റെ സിമുലേഷനുകൾ പ്രവർത്തിപ്പിക്കാൻ സന്നദ്ധത പ്രകടിപ്പിക്കുന്ന പൗര ശാസ്ത്രജ്ഞരെ ഇത് ഒരുമിച്ച് കൊണ്ടുവരുന്നു. ഈ ഡാറ്റയിൽ നിന്നുള്ള ഉൾക്കാഴ്ചകൾ ശാസ്ത്രജ്ഞർക്ക് ജീവശാസ്ത്രത്തെ നന്നായി മനസ്സിലാക്കാൻ സഹായിക്കുകയും ചികിത്സാ രീതികൾ വികസിപ്പിക്കുന്നതിനുള്ള പുതിയ അവസരങ്ങൾ നൽകുകയും ചെയ്യുന്നു.
    nb_NO: Et distribuert databehandlingsprosjekt for simulering av proteindynamikk, inkludert prosessen med proteinfolding og bevegelsene til proteiner involvert i en rekke sykdommer. Det samler forskere som frivillig kjører simuleringer av proteindynamikk på sine personlige datamaskiner. Innsikt fra disse dataene hjelper forskere med å bedre forstå biologi og gir nye muligheter for å utvikle behandlinger.
    nl_NL: Een gedistribueerd computerproject voor het simuleren van eiwitdynamiek, waaronder het proces van eiwitvouwing en de bewegingen van eiwitten die betrokken zijn bij diverse ziekten. Het brengt burgerwetenschappers samen die vrijwillig simulaties van eiwitdynamiek uitvoeren op hun persoonlijke computers. De inzichten uit deze gegevens helpen wetenschappers om de biologie beter te begrijpen en bieden nieuwe mogelijkheden voor de ontwikkeling van therapieën.
    pl_PL: Projekt obliczeń rozproszonych, symulujący dynamikę białek, w tym proces ich fałdowania i ruchy białek zaangażowanych w różnorodne choroby. Zrzesza on naukowców-obywateli, którzy zgłoszą się na ochotnika do przeprowadzania symulacji dynamiki białek na swoich komputerach. Wiedza uzyskana z tych danych pomaga naukowcom lepiej zrozumieć biologię i stwarza nowe możliwości rozwoju terapii.
    pt_BR: Um projeto de computação distribuída para simulação da dinâmica de proteínas, incluindo o processo de dobramento proteico e os movimentos de proteínas envolvidas em diversas doenças. Ele reúne cientistas cidadãos que se voluntariam para executar simulações da dinâmica de proteínas em seus computadores pessoais. Os insights obtidos a partir desses dados estão ajudando os cientistas a compreender melhor a biologia e proporcionando novas oportunidades para o desenvolvimento de terapias.
    ro_RO: Un proiect de calcul distribuit pentru simularea dinamicii proteinelor, inclusiv procesul de pliere a proteinelor și mișcările proteinelor implicate într-o varietate de boli. Acesta reunește oameni de știință cetățeni care se oferă voluntari să ruleze simulări ale dinamicii proteinelor pe computerele lor personale. Informațiile obținute din aceste date îi ajută pe oamenii de știință să înțeleagă mai bine biologia și oferă noi oportunități pentru dezvoltarea de terapii.
    ru_RU: Проект распределенных вычислений для моделирования динамики белков, включая процесс сворачивания белков и движения белков, участвующих в развитии различных заболеваний. Он объединяет ученых-любителей, которые добровольно запускают моделирование динамики белков на своих персональных компьютерах. Полученные данные помогают ученым лучше понимать биологию и открывают новые возможности для разработки терапевтических средств.
    sk_SK: Projekt distribuovaných výpočtov na simuláciu dynamiky bielkovín vrátane procesu skladania bielkovín a pohybov bielkovín zapojených do rôznych ochorení. Spája občianskych vedcov, ktorí sa dobrovoľne prihlásia na simulácie dynamiky bielkovín na svojich osobných počítačoch. Poznatky z týchto údajov pomáhajú vedcom lepšie pochopiť biológiu a poskytujú nové príležitosti pre vývoj liečebných postupov.
    sv_SE: Ett distribuerat databehandlingsprojekt för att simulera proteindynamik, inklusive processen för proteinveckning och proteiners rörelser som är inblandade i en mängd olika sjukdomar. Det sammanför medborgarforskare som frivilligt kör simuleringar av proteindynamik på sina persondatorer. Insikter från dessa data hjälper forskare att bättre förstå biologi och ger nya möjligheter att utveckla behandlingar.
    tr_TR: Protein katlanma süreci ve çeşitli hastalıklarda rol oynayan proteinlerin hareketleri de dahil olmak üzere protein dinamiklerini simüle etmek için geliştirilmiş dağıtık hesaplama projesi. Bu proje, kişisel bilgisayarlarında protein dinamikleri simülasyonları çalıştırmak için gönüllü olan vatandaş bilim insanlarını bir araya getiriyor. Bu verilerden elde edilen bilgiler, bilim insanlarının biyolojiyi daha iyi anlamalarına ve yeni tedavi yöntemleri geliştirme fırsatları yaratmalarına yardımcı oluyor.
    zh_CN: 贡献计算资源，帮助研究蛋白质与疾病。
    zh_TW: 貢獻計算資源，幫助研究蛋白質與疾病。
