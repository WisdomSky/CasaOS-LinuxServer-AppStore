name: linuxserver-flycast
services:
  app:
    image: linuxserver/flycast:2.7.20260913
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Flycast is a multi-platform Sega Dreamcast, Naomi, Naomi 2, and Atomiswave emulator derived from reicast.
    zh_CN: Flycast 是源自 reicast 的多平台模拟器，支持 Sega Dreamcast、Naomi、Naomi 2 和 Atomiswave。
  tagline:
    en_US: A multi-platform Sega Dreamcast, Naomi, Naomi 2, and Atomiswave emulator derived from reicast.
    zh_CN: 模拟 Dreamcast、Naomi 和 Atomiswave 等平台。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/flycast-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/flycast-logo.png
  title:
    en_US: Flycast (LinuxServer.io)
    zh_CN: Flycast（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverflycast
  port_map: '3000'
  version: 2.7.20260913
