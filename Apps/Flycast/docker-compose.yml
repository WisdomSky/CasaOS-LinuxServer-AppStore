name: linuxserver-flycast
services:
  app:
    image: linuxserver/flycast:2.7.20260913
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Flycast is a multi-platform Sega Dreamcast, Naomi, Naomi 2, and Atomiswave emulator derived from reicast.
    ca_ES: Flycast és un emulador multiplataforma per a Sega Dreamcast, Naomi, Naomi 2 i Atomiswave derivat de Reicast.
    cs_CZ: Flycast je multiplatformní emulátor her pro Sega Dreamcast, Naomi, Naomi 2 a Atomiswave, odvozený od reicastu.
