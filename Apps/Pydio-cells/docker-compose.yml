name: linuxserver-pydio-cells
services:
  app:
    image: linuxserver/pydio-cells:5.0.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EXTERNALURL: ''
      SERVER_IP: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: EXTERNALURL
          description:
            en_US: The external url you would like to use to access Pydio Cells (Can be https://domain.url or https://IP:PORT).
        - container: SERVER_IP
          description:
            en_US: Enter the LAN IP of the docker server. Required for local access by IP, added to self signed cert as SAN (not required if accessing only through reverse proxy). [OPTIONAL]
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Pydio-cells is the nextgen file sharing platform for organizations. It is a full rewrite of the Pydio project using the Go language following a micro-service architecture.
    ca_ES: Pydio-cells és la plataforma de compartició de fitxers de nova generació per a organitzacions. És una reescriptura completa del projecte Pydio utilitzant el llenguatge Go seguint una arquitectura de microserveis.
    cs_CZ: Pydio-cells je platforma pro sdílení souborů nové generace pro organizace. Jedná se o kompletní přepracování projektu Pydio s využitím jazyka Go, které vychází z architektury mikroslužeb.
    da_DK: Pydio-cells er næste generations fildelingsplatform for organisationer. Det er en fuldstændig omskrivning af Pydio-projektet ved hjælp af Go-sproget efter en mikroservicearkitektur.
    de_DE: Pydio-cells ist die Dateiaustauschplattform der nächsten Generation für Unternehmen. Es handelt sich um eine vollständige Neuentwicklung des Pydio-Projekts in der Programmiersprache Go, basierend auf einer Microservice-Architektur.
    el_GR: Το Pydio-cells είναι η πλατφόρμα κοινής χρήσης αρχείων επόμενης γενιάς για οργανισμούς. Είναι μια πλήρης επανεγγραφή του έργου Pydio χρησιμοποιώντας τη γλώσσα Go ακολουθώντας μια αρχιτεκτονική μικρο-υπηρεσιών.
    en_GB: Pydio-cells is the nextgen file sharing platform for organisations. It is a full rewrite of the Pydio project using the Go language following a micro-service architecture.
    es_ES: Pydio-cells es la plataforma de intercambio de archivos de última generación para organizaciones. Se trata de una reescritura completa del proyecto Pydio, desarrollada en el lenguaje Go y basada en una arquitectura de microservicios.
    fr_FR: Pydio-cells est la plateforme de partage de fichiers nouvelle génération pour les organisations. Il s'agit d'une réécriture complète du projet Pydio, réalisée en Go et basée sur une architecture de microservices.
    ga_IE: Is é Pydio-cells an t-ardán comhroinnte comhad den chéad ghlúin eile d'eagraíochtaí. Is athscríobh iomlán é ar thionscadal Pydio ag baint úsáide as an teanga Go de réir ailtireacht micrisheirbhíse.
    hr_HR: Pydio-cells je platforma za dijeljenje datoteka sljedeće generacije za organizacije. To je potpuno prepisana verzija Pydio projekta korištenjem Go jezika prateći mikroservisnu arhitekturu.
    hu_HU: A Pydio-cells a következő generációs fájlmegosztó platform szervezetek számára. Ez a Pydio projekt teljes átdolgozása Go nyelven, mikroszolgáltatás-architektúrát követve.
    it_IT: Pydio-cells è la piattaforma di condivisione file di nuova generazione per le organizzazioni. Si tratta di una riscrittura completa del progetto Pydio, realizzata in linguaggio Go e basata su un'architettura a microservizi.
    ja_JP: Pydio-cellsは、組織向けの次世代ファイル共有プラットフォームです。マイクロサービスアーキテクチャを採用し、Go言語を用いてPydioプロジェクトを完全に書き直したものです。
    ko_KR: Pydio-cells는 조직을 위한 차세대 파일 공유 플랫폼입니다. 마이크로서비스 아키텍처를 기반으로 Go 언어를 사용하여 Pydio 프로젝트를 완전히 재작성한 것입니다.
    ml_IN: സ്ഥാപനങ്ങൾക്കായുള്ള അടുത്ത തലമുറ ഫയൽ പങ്കിടൽ പ്ലാറ്റ്‌ഫോമാണ് പൈഡിയോ-സെല്ലുകൾ. മൈക്രോ-സർവീസ് ആർക്കിടെക്ചറിനെ പിന്തുടർന്ന് ഗോ ഭാഷ ഉപയോഗിച്ചുള്ള പൈഡിയോ പ്രോജക്റ്റിന്റെ പൂർണ്ണമായ പുനരാലേഖനമാണിത്.
    nb_NO: Pydio-cells er neste generasjons fildelingsplattform for organisasjoner. Det er en fullstendig omskriving av Pydio-prosjektet ved hjelp av Go-språket etter en mikrotjenestearkitektur.
    nl_NL: Pydio-cells is het platform voor bestandsdeling van de volgende generatie voor organisaties. Het is een volledig herschreven versie van het Pydio-project, geschreven in Go en gebaseerd op een microservice-architectuur.
    pl_PL: Pydio-cells to platforma do udostępniania plików nowej generacji dla organizacji. Jest to całkowicie przepisana wersja projektu Pydio z wykorzystaniem języka Go i architektury mikrousług.
    pt_BR: Pydio-cells é a plataforma de compartilhamento de arquivos de última geração para organizações. Trata-se de uma reescrita completa do projeto Pydio, utilizando a linguagem Go e seguindo uma arquitetura de microsserviços.
    ro_RO: Pydio-cells este platforma de partajare a fișierelor de generație următoare pentru organizații. Este o rescriere completă a proiectului Pydio folosind limbajul Go, urmând o arhitectură de microservicii.
    ru_RU: Pydio-cells — это платформа нового поколения для обмена файлами в организациях. Это полностью переписанный проект Pydio на языке Go с использованием микросервисной архитектуры.
    sk_SK: Pydio-cells je platforma na zdieľanie súborov novej generácie pre organizácie. Ide o kompletné prepísanie projektu Pydio pomocou jazyka Go, ktoré vychádza z architektúry mikroservisov.
    sv_SE: Pydio-cells är nästa generations fildelningsplattform för organisationer. Det är en fullständig omskrivning av Pydio-projektet med hjälp av Go-språket enligt en mikrotjänstarkitektur.
    tr_TR: Pydio-cells, kuruluşlar için yeni nesil dosya paylaşım platformudur. Mikro hizmet mimarisine sahip, Go dili kullanılarak Pydio projesinin tamamen yeniden yazılmış bir versiyonudur.
    zh_CN: Pydio Cells 是面向组织的新一代文件共享平台。它使用 Go 语言和微服务架构，对 Pydio 项目进行了完整重写。
    zh_TW: Pydio Cells 是面向組織的新一代檔案共享平臺。它使用 Go 語言和微服務架構，對 Pydio 專案進行了完整重寫。
