    pl_PL: 'Zaprojektowany z myślą o łatwości i wydajności. Transmission oferuje funkcje, których oczekujesz od klienta BitTorrent: szyfrowanie, interfejs webowy, wymianę peerów, łącza magnet, przekierowywanie portów DHT, µTP, UPnP i NAT-PMP, obsługę webseed, katalogi obserwowanych plików, edycję trackerów, globalne i indywidualne limity prędkości dla torrentów i wiele innych.'
    pt_BR: 'Projetado para uso fácil e poderoso, o Transmission possui os recursos que você espera de um cliente BitTorrent: criptografia, interface web, troca de pares, links magnéticos, encaminhamento de portas DHT, µTP, UPnP e NAT-PMP, suporte a webseed, diretórios de monitoramento, edição de trackers, limites de velocidade globais e por torrent, e muito mais.'
    ro_RO: 'Conceput pentru o utilizare ușoară și puternică. Transmission are funcțiile pe care le doriți de la un client BitTorrent: criptare, interfață web, schimb de date peer-exchange, legături magnet, DHT, µTP, redirecționare de port UPnP și NAT-PMP, suport webseed, directoare de supraveghere, editare tracker, limite de viteză globale și per torrent și multe altele.'
    ru_RU: 'Разработан для простого и эффективного использования. Transmission обладает всеми функциями, которые вы ожидаете от BitTorrent-клиента: шифрование, веб-интерфейс, обмен пирами, magnet-ссылки, DHT, µTP, UPnP и переадресация портов NAT-PMP, поддержка веб-сидов, каталоги наблюдения, редактирование трекеров, глобальные и индивидуальные ограничения скорости для каждого торрента и многое другое.'
    sk_SK: 'Navrhnuté pre jednoduché a výkonné používanie. Transmission má funkcie, ktoré od BitTorrent klienta očakávate: šifrovanie, webové rozhranie, výmenu peerov, magnetické odkazy, presmerovanie portov DHT, µTP, UPnP a NAT-PMP, podporu webseed, sledovacie adresáre, úpravu sledovača, globálne a pre každý torrent rýchlostné limity a ďalšie.'
    sv_SE: 'Utformad för enkel och kraftfull användning. Transmission har de funktioner du önskar av en BitTorrent-klient: kryptering, ett webbgränssnitt, peer-utbyte, magnetlänkar, DHT, µTP, UPnP och NAT-PMP portvidarebefordran, stöd för webbseed, bevakningskataloger, redigering av spårare, globala och per-torrent hastighetsgränser och mer.'
    tr_TR: 'Kolay ve güçlü kullanım için tasarlanmıştır. Transmission, bir BitTorrent istemcisinden istediğiniz özelliklere sahiptir: şifreleme, web arayüzü, eşler arası değişim, magnet bağlantıları, DHT, µTP, UPnP ve NAT-PMP port yönlendirme, webseed desteği, izleme dizinleri, izleyici düzenleme, genel ve torrent başına hız sınırları ve daha fazlası.'
