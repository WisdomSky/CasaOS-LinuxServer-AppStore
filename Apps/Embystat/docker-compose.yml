name: linuxserver-embystat
services:
  app:
    image: linuxserver/embystat:0.2.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
      volumes:
        - container: /config
          description:
            en_US: Appdata
      ports:
        - container: '6555'
          description:
            en_US: Webui Port
    ports:
      - target: 6555
        published: 6555
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/embystat/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Visit homepage: https://hub.docker.com/r/linuxserver/embystat/'
    zh_CN: |-
      EmbyStat 是一个个人网页服务器，可从本地 Emby 服务器计算各种统计信息。将其安装在服务器上，即可生成丰富的统计数据。

      访问项目主页：https://hub.docker.com/r/linuxserver/embystat/
  tagline:
    en_US: A personal web server that can calculate all kinds of statistics from your (local) Emby server. Just install this on your server and let him calculate all kinds of fun stuff.
    zh_CN: 分析本地 Emby 服务器的媒体统计信息。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/embystat-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/embystat-logo.png
  title:
    en_US: Embystat
    zh_CN: Embystat
  category: Others
  project_url: https://github.com/mregni/EmbyStat
  port_map: '6555'
  id: wisdomsky.linuxserver.linuxserverembystat
  version: 0.2.0
  website: https://github.com/mregni/EmbyStat
