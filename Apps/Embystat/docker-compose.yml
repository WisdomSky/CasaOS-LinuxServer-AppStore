  tagline:
    en_US: A personal web server that can calculate all kinds of statistics from your (local) Emby server. Just install this on your server and let him calculate all kinds of fun stuff.
    zh_CN: 分析本地 Emby 服务器的媒体统计信息。
    ca_ES: Un servidor web personal que pot calcular tot tipus d'estadístiques des del vostre servidor Emby (local). Només cal que l'instal·leu al vostre servidor i deixeu que ell calculi tot tipus de coses divertides.
    cs_CZ: Osobní webový server, který dokáže vypočítat nejrůznější statistiky z vašeho (lokálního) Emby serveru. Stačí si ho nainstalovat na server a nechat ho vypočítávat nejrůznější zábavné věci.
    da_DK: En personlig webserver, der kan beregne alle mulige slags statistikker fra din (lokale) Emby-server. Bare installer den på din server, og lad ham beregne alle mulige sjove ting.
    de_DE: Ein persönlicher Webserver, der alle möglichen Statistiken von Ihrem (lokalen) Emby-Server berechnen kann. Installieren Sie ihn einfach auf Ihrem Server und lassen Sie ihn allerlei interessante Daten ermitteln.
    el_GR: Ένας προσωπικός διακομιστής ιστού που μπορεί να υπολογίσει κάθε είδους στατιστικά στοιχεία από τον (τοπικό) διακομιστή Emby. Απλώς εγκαταστήστε τον στον διακομιστή σας και αφήστε τον να υπολογίσει κάθε είδους διασκεδαστικά πράγματα.
    en_GB: A personal web server that can calculate all kinds of statistics from your (local) Emby server. Just install this on your server and let him calculate all kinds of fun stuff.
    es_ES: Un servidor web personal que puede calcular todo tipo de estadísticas desde tu servidor Emby (local). Simplemente instálalo en tu servidor y deja que calcule todo tipo de datos interesantes.
    fr_FR: Un serveur web personnel capable de calculer toutes sortes de statistiques à partir de votre serveur Emby (local). Installez-le simplement sur votre serveur et laissez-le effectuer toutes sortes de calculs intéressants.
    ga_IE: Freastalaí gréasáin pearsanta ar féidir leis gach saghas staitisticí a ríomh ó do fhreastalaí Emby (áitiúil). Suiteáil é seo ar do fhreastalaí agus lig dó gach saghas rudaí spraíúla a ríomh.
    hr_HR: Osobni web poslužitelj koji može izračunati sve vrste statistike s vašeg (lokalnog) Emby poslužitelja. Samo ga instalirajte na svoj poslužitelj i pustite ga da izračuna sve vrste zabavnih stvari.
    hu_HU: Egy személyes webszerver, ami mindenféle statisztikát ki tud számolni a (helyi) Emby szerveredről. Csak telepítsd a szerveredre, és máris mindenféle érdekességet kiszámol.
    it_IT: Un server web personale in grado di calcolare ogni tipo di statistica dal tuo server Emby (locale). Basta installarlo sul tuo server e lasciare che calcoli un sacco di cose interessanti.
    ja_JP: あなたの（ローカル）Embyサーバーからあらゆる種類の統計情報を計算できる個人用ウェブサーバーです。サーバーにインストールするだけで、様々な楽しい計算結果が得られます。
    ko_KR: (로컬) Emby 서버에서 다양한 통계를 계산할 수 있는 개인 웹 서버입니다. 서버에 설치하기만 하면 온갖 재미있는 계산 결과를 얻을 수 있습니다.
    ml_IN: നിങ്ങളുടെ (ലോക്കൽ) എംബി സെർവറിൽ നിന്ന് എല്ലാത്തരം സ്ഥിതിവിവരക്കണക്കുകളും കണക്കാക്കാൻ കഴിയുന്ന ഒരു സ്വകാര്യ വെബ് സെർവർ. ഇത് നിങ്ങളുടെ സെർവറിൽ ഇൻസ്റ്റാൾ ചെയ്യുക, അയാൾക്ക് എല്ലാത്തരം രസകരമായ കാര്യങ്ങളും കണക്കാക്കാൻ അനുവദിക്കുക.
    nb_NO: En personlig webserver som kan beregne all slags statistikk fra din (lokale) Emby-server. Bare installer dette på serveren din, og la ham beregne alle slags morsomme ting.
    nl_NL: Een persoonlijke webserver die allerlei statistieken kan berekenen op basis van je (lokale) Emby-server. Installeer hem gewoon op je server en laat hem allerlei leuke dingen berekenen.
    pl_PL: Osobisty serwer WWW, który może obliczać wszelkiego rodzaju statystyki z Twojego (lokalnego) serwera Emby. Wystarczy go zainstalować na serwerze i pozwolić mu obliczać wszelkiego rodzaju ciekawe rzeczy.
    pt_BR: Um servidor web pessoal capaz de calcular todos os tipos de estatísticas do seu servidor Emby (local). Basta instalá-lo no seu servidor e deixar que ele calcule todo tipo de informação interessante.
    ro_RO: Un server web personal care poate calcula tot felul de statistici de pe serverul tău Emby (local). Instalează-l pe serverul tău și lasă-l pe el să calculeze tot felul de lucruri distractive.
    ru_RU: Персональный веб-сервер, способный вычислять всевозможную статистику с вашего (локального) сервера Emby. Просто установите его на свой сервер и позвольте ему вычислять всевозможные интересные вещи.
    sk_SK: Osobný webový server, ktorý dokáže vypočítať všetky druhy štatistík z vášho (lokálneho) Emby servera. Stačí si ho nainštalovať na server a nechať ho vypočítavať všetky možné zábavné veci.
    sv_SE: En personlig webbserver som kan beräkna alla möjliga sorters statistik från din (lokala) Emby-server. Installera bara detta på din server och låt honom beräkna alla möjliga roliga saker.
    tr_TR: (Yerel) Emby sunucunuzdan her türlü istatistiği hesaplayabilen kişisel bir web sunucusu. Bunu sunucunuza kurun ve bırakın o her türlü eğlenceli şeyi hesaplasın.
