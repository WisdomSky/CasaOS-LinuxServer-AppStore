name: linuxserver-kimai
services:
  app:
    image: linuxserver/kimai:2.67.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: APP_SECRET
          description:
            en_US: Random string used for session encryption. Generate using e.g. openssl rand -hex 32.
        - container: DATABASE_URL
          description:
            en_US: Configure your database connection, see Application Setup instructions.
        - container: TRUSTED_HOSTS
          description:
            en_US: Domain or IP you will be using to access Kimai. Can be a regex like localhost|127.0.0.1|kimai.example.com
        - container: TRUSTED_PROXIES
          description:
            en_US: If behind a reverse proxy set this to its IP or network CIDR so that Kimai trusts its headers. [OPTIONAL]
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Kimai is a professional grade time-tracking application, free and open-source. It handles use-cases of freelancers as well as companies with dozens or hundreds of users. Kimai was build to track your project times and ships with many advanced features, including but not limited to: JSON API, invoicing, data exports, multi-timer and punch-in punch-out mode, tagging, multi-user - multi-timezones - multi-language (over 30 translations existing!), authentication via SAML/LDAP/Database, two-factor authentication (2FA) with TOTP, customizable role and team permissions, responsive design, user/customer/project specific rates, advanced search & filtering, money and time budgets, advanced reporting, support for plugins and so much more.'
    ca_ES: 'Kimai és una aplicació de seguiment de temps de nivell professional, gratuïta i de codi obert. Gestiona casos d''ús tant de professionals autònoms com d''empreses amb desenes o centenars d''usuaris. Kimai es va crear per fer un seguiment dels temps dels vostres projectes i inclou moltes funcions avançades, com ara: API JSON, facturació, exportació de dades, mode multitemporitzador i punch-in punch-out, etiquetatge, multiusuari - multizones horàries - multiidioma (més de 30 traduccions existents!), autenticació mitjançant SAML/LDAP/base de dades, autenticació de dos factors (2FA) amb TOTP, permisos personalitzables de rol i equip, disseny responsiu, tarifes específiques per usuari/client/projecte, cerca i filtratge avançats, pressupostos de diners i temps, informes avançats, compatibilitat amb complements i molt més.'
    cs_CZ: 'Kimai je profesionální aplikace pro sledování času, bezplatná a s otevřeným zdrojovým kódem. Zvládá případy použití jak freelancerů, tak firem s desítkami nebo stovkami uživatelů. Kimai byla vytvořena pro sledování doby vašich projektů a dodává se s mnoha pokročilými funkcemi, včetně, ale nejen: JSON API, fakturace, exportu dat, režimu multi-timer a punch-in/punch-out, označování, více uživatelů - více časových pásem - více jazyků (existuje přes 30 překladů!), ověřování přes SAML/LDAP/Databázi, dvoufaktorové ověřování (2FA) s TOTP, přizpůsobitelná oprávnění rolí a týmů, responzivní design, sazby specifické pro uživatele/zákazníky/projekty, pokročilé vyhledávání a filtrování, rozpočty na peníze a čas, pokročilé reportování, podpora pluginů a mnoho dalšího.'
    da_DK: 'Kimai er en professionel tidsregistreringsapplikation, der er gratis og open source. Den håndterer use cases fra freelancere såvel som virksomheder med snesevis eller hundredvis af brugere. Kimai blev bygget til at spore dine projekttider og leveres med mange avancerede funktioner, herunder, men ikke begrænset til: JSON API, fakturering, dataeksport, multi-timer og punch-in punch-out tilstand, tagging, multi-bruger - multi-tidszoner - multi-sprog (over 30 oversættelser findes!), godkendelse via SAML/LDAP/database, tofaktorgodkendelse (2FA) med TOTP, brugerdefinerede rolle- og teamtilladelser, responsivt design, bruger-/kunde-/projektspecifikke priser, avanceret søgning og filtrering, penge- og tidsbudgetter, avanceret rapportering, understøttelse af plugins og meget mere.'
    de_DE: 'Kimai ist eine professionelle, kostenlose Open-Source-Zeiterfassungs-App. Sie eignet sich sowohl für Freelancer als auch für Unternehmen mit Dutzenden oder Hunderten von Nutzern. Kimai wurde speziell für die Zeiterfassung Ihrer Projekte entwickelt und bietet zahlreiche fortschrittliche Funktionen, darunter: JSON-API, Rechnungsstellung, Datenexport, Multitimer- und Punch-in/Pull-out-Modus, Tagging, Unterstützung für mehrere Benutzer, Zeitzonen und Sprachen (über 30 Übersetzungen verfügbar!), Authentifizierung via SAML/LDAP/Datenbank, Zwei-Faktor-Authentifizierung (2FA) mit TOTP, anpassbare Rollen- und Teamberechtigungen, responsives Design, benutzer-/kunden-/projektspezifische Tarife, erweiterte Such- und Filterfunktionen, Budgetierung von Geld und Zeit, detaillierte Berichtsfunktionen, Plugin-Unterstützung und vieles mehr.'
    el_GR: 'Το Kimai είναι μια επαγγελματική εφαρμογή παρακολούθησης χρόνου, δωρεάν και ανοιχτού κώδικα. Χειρίζεται περιπτώσεις χρήσης από ελεύθερους επαγγελματίες καθώς και από εταιρείες με δεκάδες ή εκατοντάδες χρήστες. Το Kimai δημιουργήθηκε για να παρακολουθεί τους χρόνους των έργων σας και διαθέτει πολλές προηγμένες λειτουργίες, όπως ενδεικτικά: JSON API, τιμολόγηση, εξαγωγές δεδομένων, λειτουργία πολλαπλών χρονοδιακόπτων και punch-in punch-out, ετικέτες, πολλαπλοί χρήστες - πολλαπλές ζώνες ώρας - πολλαπλές γλώσσες (υπάρχουν πάνω από 30 μεταφράσεις!), έλεγχος ταυτότητας μέσω SAML/LDAP/βάσης δεδομένων, έλεγχος ταυτότητας δύο παραγόντων (2FA) με TOTP, προσαρμόσιμα δικαιώματα ρόλων και ομάδων, σχεδιασμός με δυνατότητα προσαρμογής, τιμές ανά χρήστη/πελάτη/έργο, προηγμένη αναζήτηση και φιλτράρισμα, προϋπολογισμούς χρημάτων και χρόνου, προηγμένες αναφορές, υποστήριξη για πρόσθετα και πολλά άλλα.'
    en_GB: 'Kimai is a professional grade time-tracking application, free and open-source. It handles use-cases of freelancers as well as companies with dozens or hundreds of users. Kimai was build to track your project times and ships with many advanced features, including but not limited to: Json Api, invoicing, data exports, multi-timer and punch-in punch-out mode, tagging, multi-user - multi-timezones - multi-language (over 30 translations existing!), authentication via Saml/Ldap/Database, two-factor authentication (2FA) with Totp, customisable role and team permissions, responsive design, user/customer/project specific rates, advanced search & filtering, money and time budgets, advanced reporting, support for plugins and so much more.'
    es_ES: 'Kimai es una aplicación profesional de seguimiento del tiempo, gratuita y de código abierto. Se adapta a las necesidades tanto de autónomos como de empresas con decenas o cientos de usuarios. Kimai fue diseñada para controlar el tiempo de tus proyectos e incluye numerosas funciones avanzadas, entre las que se incluyen: API JSON, facturación, exportación de datos, modo multitemporizador y de entrada/salida, etiquetado, soporte para múltiples usuarios, zonas horarias e idiomas (¡más de 30 traducciones!), autenticación mediante SAML/LDAP/base de datos, autenticación de dos factores (2FA) con TOTP, permisos de rol y equipo personalizables, diseño adaptable, tarifas específicas para usuarios, clientes y proyectos, búsqueda y filtrado avanzados, presupuestos de tiempo y dinero, informes avanzados, compatibilidad con plugins y mucho más.'
    fr_FR: "Kimai est une application professionnelle de suivi du temps, gratuite et open source. Elle convient aussi bien aux indépendants qu'aux entreprises comptant des dizaines, voire des centaines d'utilisateurs. Conçue pour le suivi du temps consacré à vos projets, Kimai intègre de nombreuses fonctionnalités avancées, notamment\_: API JSON, facturation, exportation de données, gestion de plusieurs utilisateurs et modes de pointage, système d'étiquetage, multi-utilisateurs, multi-fuseaux horaires et multilingue (plus de 30 traductions disponibles\_!), authentification via SAML/LDAP/base de données, authentification à deux facteurs (2FA) avec TOTP, permissions personnalisables pour les rôles et les équipes, design adaptatif, tarifs spécifiques aux utilisateurs, clients et projets, recherche et filtrage avancés, gestion des budgets (temps et argent), rapports détaillés, compatibilité avec les plugins, et bien plus encore."
    ga_IE: 'Is feidhmchlár gairmiúil rianaithe ama é Kimai, atá saor in aisce agus foinse oscailte. Déileálann sé le cásanna úsáide saorálaithe chomh maith le cuideachtaí a bhfuil mórán nó na céadta úsáideoirí acu. Tógadh Kimai chun amanna do thionscadail a rianú agus tagann sé le go leor gnéithe ardleibhéil, lena n-áirítear, ach gan a bheith teoranta dóibh: API JSON, sonrascadh, easpórtálacha sonraí, mód il-amaire agus mód punch-in/amach, clibeáil, ilúsáideoir - ilchriosanna ama - ilteangach (breis is 30 aistriúchán ann!), fíordheimhniú trí SAML/LDAP/Bunachar Sonraí, fíordheimhniú dhá fhachtóir (2FA) le TOTP, ceadanna róil agus foirne saincheaptha, dearadh sofhreagrach, rátaí sonracha d''úsáideoirí/do chustaiméirí/tionscadail, cuardach agus scagadh ardleibhéil, buiséid airgid agus ama, tuairisciú ardleibhéil, tacaíocht do bhreiseáin agus i bhfad níos mó.'
    hr_HR: 'Kimai je profesionalna aplikacija za praćenje vremena, besplatna i otvorenog koda. Pokriva slučajeve korištenja freelancera, kao i tvrtki s desecima ili stotinama korisnika. Kimai je izgrađen za praćenje vremena vaših projekata i dolazi s mnogim naprednim značajkama, uključujući, ali ne ograničavajući se na: JSON API, fakturiranje, izvoz podataka, viševremenski i punch-in punch-out način rada, označavanje, više korisnika - više vremenskih zona - više jezika (postoji preko 30 prijevoda!), autentifikaciju putem SAML/LDAP/baze podataka, dvofaktorsku autentifikaciju (2FA) s TOTP-om, prilagodljive dozvole uloga i tima, responzivni dizajn, cijene specifične za korisnika/kupca/projekt, napredno pretraživanje i filtriranje, proračune za novac i vrijeme, napredno izvještavanje, podršku za dodatke i još mnogo toga.'
    hu_HU: 'A Kimai egy professzionális szintű időkövető alkalmazás, ingyenes és nyílt forráskódú. Szabadúszók, valamint több tucat vagy akár több száz felhasználóval rendelkező vállalatok igényeit is kezeli. A Kimai-t a projektek idejének nyomon követésére fejlesztették ki, és számos fejlett funkcióval rendelkezik, beleértve, de nem kizárólagosan: JSON API, számlázás, adatexportálás, többszörös időzítő és punch-in punch-out mód, címkézés, több felhasználó - több időzóna - több nyelv (több mint 30 fordítás létezik!), hitelesítés SAML/LDAP/adatbázison keresztül, kétfaktoros hitelesítés (2FA) TOTP-vel, testreszabható szerepkör- és csapatengedélyek, reszponzív design, felhasználó-/ügyfél-/projektspecifikus díjszabások, fejlett keresés és szűrés, pénzügyi és időkeretek, fejlett jelentéskészítés, bővítmények támogatása és még sok más.'
    it_IT: 'Kimai è un''applicazione professionale per il monitoraggio del tempo, gratuita e open-source. È adatta sia ai freelance che alle aziende con decine o centinaia di utenti. Kimai è stata progettata per tenere traccia del tempo impiegato nei progetti e offre numerose funzionalità avanzate, tra cui: API JSON, fatturazione, esportazione dati, modalità multi-timer e punch-in/punch-out, tagging, supporto multiutente, multi-fuso orario e multilingue (oltre 30 traduzioni disponibili!), autenticazione tramite SAML/LDAP/Database, autenticazione a due fattori (2FA) con TOTP, permessi personalizzabili per ruoli e team, design responsive, tariffe specifiche per utenti/clienti/progetti, ricerca e filtri avanzati, budget di tempo e denaro, reportistica avanzata, supporto per plugin e molto altro ancora.'
    ja_JP: Kimaiは、無料のオープンソースのプロ仕様のタイムトラッキングアプリケーションです。フリーランサーから数十人、数百人のユーザーを抱える企業まで、幅広いユースケースに対応します。Kimaiはプロジェクト時間の追跡を目的として開発され、JSON API、請求書作成、データエクスポート、マルチタイマーと打刻モード、タグ付け、マルチユーザー、マルチタイムゾーン、多言語対応（30以上の翻訳が利用可能）、SAML/LDAP/データベースによる認証、TOTPによる二要素認証（2FA）、カスタマイズ可能な役割とチーム権限、レスポンシブデザイン、ユーザー/顧客/プロジェクトごとの料金設定、高度な検索とフィルタリング、予算と時間管理、高度なレポート機能、プラグインのサポートなど、数多くの高度な機能を備えています。
    ko_KR: Kimai는 전문가 수준의 시간 관리 애플리케이션으로, 무료 오픈 소스입니다. 프리랜서는 물론 수십 명에서 수백 명의 사용자를 보유한 기업까지 다양한 규모의 기업 환경에 적합합니다. Kimai는 프로젝트 시간 관리를 위해 개발되었으며, JSON API, 송장 발행, 데이터 내보내기, 다중 타이머 및 출퇴근 기록 모드, 태그 기능, 다중 사용자/다중 시간대/다중 언어 지원(30개 이상의 언어 번역 지원!), SAML/LDAP/데이터베이스 인증, TOTP를 이용한 2단계 인증(2FA), 사용자 지정 가능한 역할 및 팀 권한, 반응형 디자인, 사용자/고객/프로젝트별 요금 설정, 고급 검색 및 필터링, 예산 및 비용 관리, 고급 보고서 기능, 플러그인 지원 등 다양한 고급 기능을 제공합니다.
    ml_IN: കിമൈ ഒരു പ്രൊഫഷണൽ ഗ്രേഡ് ടൈം-ട്രാക്കിംഗ് ആപ്ലിക്കേഷനാണ്, സൗജന്യവും ഓപ്പൺ സോഴ്‌സും. ഇത് ഫ്രീലാൻസർമാർക്കും ഡസൻ കണക്കിന് അല്ലെങ്കിൽ നൂറുകണക്കിന് ഉപയോക്താക്കളുള്ള കമ്പനികൾക്കും ഉപയോഗ സാഹചര്യങ്ങൾ കൈകാര്യം ചെയ്യുന്നു. JSON API, ഇൻവോയ്‌സിംഗ്, ഡാറ്റ എക്‌സ്‌പോർട്ടുകൾ, മൾട്ടി-ടൈമർ, പഞ്ച്-ഇൻ പഞ്ച്-ഔട്ട് മോഡ്, ടാഗിംഗ്, മൾട്ടി-യൂസർ - മൾട്ടി-ടൈംസോണുകൾ - മൾട്ടി-ലാംഗ്വേജ് (30-ലധികം വിവർത്തനങ്ങൾ നിലവിലുണ്ട്!), SAML/LDAP/ഡാറ്റാബേസ് വഴിയുള്ള പ്രാമാണീകരണം, TOTP ഉപയോഗിച്ചുള്ള ടു-ഫാക്ടർ പ്രാമാണീകരണം (2FA), ഇഷ്ടാനുസൃതമാക്കാവുന്ന റോൾ, ടീം അനുമതികൾ, പ്രതികരണശേഷിയുള്ള ഡിസൈൻ, ഉപയോക്താവ്/ഉപഭോക്താവ്/പ്രോജക്റ്റ് നിർദ്ദിഷ്ട നിരക്കുകൾ, വിപുലമായ തിരയൽ & ഫിൽട്ടറിംഗ്, പണവും സമയ ബജറ്റുകളും, വിപുലമായ റിപ്പോർട്ടിംഗ്, പ്ലഗിനുകൾക്കുള്ള പിന്തുണ തുടങ്ങി നിരവധി നൂതന സവിശേഷതകൾ ഉപയോഗിച്ച് നിങ്ങളുടെ പ്രോജക്റ്റ് സമയങ്ങൾ ട്രാക്ക് ചെയ്യുന്നതിനാണ് കിമൈ നിർമ്മിച്ചിരിക്കുന്നത്.
    nb_NO: 'Kimai er et profesjonelt tidssporingsprogram, gratis og med åpen kildekode. Det håndterer bruksområder for frilansere så vel som selskaper med dusinvis eller hundrevis av brukere. Kimai ble bygget for å spore prosjekttiden din og leveres med mange avanserte funksjoner, inkludert, men ikke begrenset til: JSON API, fakturering, dataeksport, flertimers- og punch-in punch-out-modus, tagging, flerbruker - flere tidssoner - flerspråk (over 30 oversettelser finnes!), autentisering via SAML/LDAP/database, tofaktorautentisering (2FA) med TOTP, tilpassbare rolle- og teamtillatelser, responsivt design, bruker-/kunde-/prosjektspesifikke priser, avansert søk og filtrering, penge- og tidsbudsjetter, avansert rapportering, støtte for plugins og mye mer.'
    nl_NL: 'Kimai is een professionele, gratis en open-source applicatie voor tijdregistratie. Het is geschikt voor zowel freelancers als bedrijven met tientallen of honderden gebruikers. Kimai is ontwikkeld om de tijd die je aan projecten besteedt te registreren en biedt tal van geavanceerde functies, waaronder: JSON API, facturering, data-export, meerdere timers en in- en uitklokmodus, tagging, ondersteuning voor meerdere gebruikers, meerdere tijdzones en meerdere talen (meer dan 30 vertalingen beschikbaar!), authenticatie via SAML/LDAP/database, tweefactorauthenticatie (2FA) met TOTP, aanpasbare rol- en teamrechten, responsief ontwerp, gebruikers-/klant-/projectspecifieke tarieven, geavanceerd zoeken en filteren, budgetten voor geld en tijd, geavanceerde rapportage, ondersteuning voor plug-ins en nog veel meer.'
    pl_PL: 'Kimai to profesjonalna aplikacja do śledzenia czasu pracy, darmowa i open source. Obsługuje zarówno freelancerów, jak i firmy zatrudniające dziesiątki, a nawet setki użytkowników. Kimai został stworzony z myślą o śledzeniu czasu pracy w projektach i oferuje wiele zaawansowanych funkcji, takich jak: API JSON, fakturowanie, eksport danych, tryby wielu timerów i odbitek, tagowanie, obsługa wielu użytkowników, wielu stref czasowych i wielu języków (ponad 30 tłumaczeń!), uwierzytelnianie przez SAML/LDAP/bazę danych, uwierzytelnianie dwuskładnikowe (2FA) z TOTP, konfigurowalne uprawnienia ról i zespołów, responsywny design, stawki dla poszczególnych użytkowników/klientów/projektów, zaawansowane wyszukiwanie i filtrowanie, budżety pieniężne i czasowe, zaawansowane raportowanie, obsługa wtyczek i wiele innych.'
    pt_BR: 'Kimai é um aplicativo profissional de controle de tempo, gratuito e de código aberto. Ele atende às necessidades de freelancers e também de empresas com dezenas ou centenas de usuários. O Kimai foi desenvolvido para controlar o tempo gasto em seus projetos e oferece diversos recursos avançados, incluindo, entre outros: API JSON, faturamento, exportação de dados, múltiplos cronômetros e modo de registro de entrada e saída, marcação, suporte a múltiplos usuários, múltiplos fusos horários e múltiplos idiomas (mais de 30 traduções disponíveis!), autenticação via SAML/LDAP/Banco de Dados, autenticação de dois fatores (2FA) com TOTP, permissões personalizáveis para funções e equipes, design responsivo, tarifas específicas para usuários/clientes/projetos, busca e filtragem avançadas, orçamentos de tempo e dinheiro, relatórios avançados, suporte a plugins e muito mais.'
    ro_RO: 'Kimai este o aplicație profesională de urmărire a timpului, gratuită și open-source. Se adresează atât freelancerilor, cât și companiilor cu zeci sau sute de utilizatori. Kimai a fost creată pentru a urmări timpii proiectelor și este dotată cu multe funcții avansate, inclusiv, dar fără a se limita la: API JSON, facturare, export de date, mod multi-timer și punch-in punch-out, etichetare, multi-utilizator - multi-fusuri orare - multi-lingvistică (există peste 30 de traduceri!), autentificare prin SAML/LDAP/Database, autentificare cu doi factori (2FA) cu TOTP, permisiuni personalizabile pentru roluri și echipe, design responsiv, tarife specifice utilizatorului/clientului/proiectului, căutare și filtrare avansate, bugete de timp și bani, raportare avansată, suport pentru plugin-uri și multe altele.'
    ru_RU: 'Kimai — это профессиональное приложение для учета рабочего времени, бесплатное и с открытым исходным кодом. Оно подходит как для фрилансеров, так и для компаний с десятками или сотнями пользователей. Kimai создано для отслеживания времени выполнения проектов и включает в себя множество расширенных функций, в том числе: JSON API, выставление счетов, экспорт данных, многоканальный режим работы и режим регистрации начала и окончания рабочего дня, тегирование, многопользовательский режим, поддержка нескольких часовых поясов, многоязычность (более 30 существующих переводов!), аутентификация через SAML/LDAP/базу данных, двухфакторная аутентификация (2FA) с TOTP, настраиваемые права доступа для ролей и команд, адаптивный дизайн, тарифы для отдельных пользователей/клиентов/проектов, расширенный поиск и фильтрация, бюджеты времени и денежных средств, расширенная отчетность, поддержка плагинов и многое другое.'
    sk_SK: 'Kimai je profesionálna aplikácia na sledovanie času, bezplatná a s otvoreným zdrojovým kódom. Zvláda prípady použitia freelancerov, ako aj spoločností s desiatkami alebo stovkami používateľov. Kimai bola vytvorená na sledovanie času vašich projektov a dodáva sa s mnohými pokročilými funkciami, vrátane, ale nie výlučne: JSON API, fakturácia, export údajov, režim viacerých časovačov a punch-in/punch-out, označovanie, viacero používateľov - viacero časových pásiem - viac jazykov (existuje viac ako 30 prekladov!), autentifikácia cez SAML/LDAP/databázu, dvojfaktorová autentifikácia (2FA) s TOTP, prispôsobiteľné oprávnenia rolí a tímov, responzívny dizajn, sadzby špecifické pre používateľa/zákazníka/projekt, pokročilé vyhľadávanie a filtrovanie, rozpočty peňazí a času, pokročilé reportovanie, podpora pluginov a mnoho ďalšieho.'
    sv_SE: 'Kimai är en professionell tidsspårningsapplikation, gratis och med öppen källkod. Den hanterar användningsområden för frilansare såväl som företag med dussintals eller hundratals användare. Kimai byggdes för att spåra dina projekttider och levereras med många avancerade funktioner, inklusive men inte begränsat till: JSON API, fakturering, dataexport, multi-timer och punch-in punch-out-läge, taggning, flera användare - flera tidszoner - flera språk (över 30 översättningar finns!), autentisering via SAML/LDAP/databas, tvåfaktorsautentisering (2FA) med TOTP, anpassningsbara roll- och teambehörigheter, responsiv design, användar-/kund-/projektspecifika priser, avancerad sökning och filtrering, budgetar för pengar och tid, avancerad rapportering, stöd för plugins och mycket mer.'
    tr_TR: 'Kimai, ücretsiz ve açık kaynaklı, profesyonel düzeyde bir zaman takip uygulamasıdır. Hem serbest çalışanların hem de onlarca veya yüzlerce kullanıcısı olan şirketlerin kullanım durumlarını ele alır. Kimai, proje sürelerinizi takip etmek için geliştirilmiştir ve aşağıdakiler de dahil olmak üzere birçok gelişmiş özellik sunar: JSON API, faturalama, veri dışa aktarma, çoklu zamanlayıcı ve giriş-çıkış modu, etiketleme, çoklu kullanıcı - çoklu saat dilimi - çoklu dil (30''dan fazla çeviri mevcut!), SAML/LDAP/Veritabanı üzerinden kimlik doğrulama, TOTP ile iki faktörlü kimlik doğrulama (2FA), özelleştirilebilir rol ve ekip izinleri, duyarlı tasarım, kullanıcı/müşteri/proje özelinde ücretlendirme, gelişmiş arama ve filtreleme, para ve zaman bütçeleri, gelişmiş raporlama, eklenti desteği ve çok daha fazlası.'
    zh_CN: Kimai 是免费、开源的专业工时追踪应用，适用于自由职业者以及拥有数十或数百名用户的企业。它用于记录项目工时，提供 JSON API、开票、数据导出、多计时器、上下班打卡、标签、多用户、多时区和多语言（已有 30 多种翻译）。它支持通过 SAML、LDAP 或数据库进行身份验证，基于 TOTP 的双重验证，可自定义的角色和团队权限，响应式界面，以及按用户、客户或项目设置费率。此外还提供高级搜索与筛选、资金和时间预算、高级报表及插件支持等功能。
    zh_TW: Kimai 是免費、開源的專業工時追蹤應用，適用於自由職業者以及擁有數十或數百名使用者的企業。它用於記錄專案工時，提供 JSON API、開票、資料匯出、多計時器、上下班打卡、標籤、多使用者、多時區和多語言（已有 30 多種翻譯）。它支援透過 SAML、LDAP 或資料庫進行身份驗證，基於 TOTP 的雙重驗證，可自定義的角色和團隊許可權，響應式介面，以及按使用者、客戶或專案設定費率。此外還提供高階搜尋與篩選、資金和時間預算、高階報表及外掛支援等功能。
  tagline:
    en_US: 'A professional grade time-tracking application, free and open-source. It handles use-cases of freelancers as well as companies with dozens or hundreds of users. Kimai was build to track your project times and ships with many advanced features, including but not limited to: JSON API, invoicing, data exports, multi-timer and punch-in punch-out mode, tagging, multi-user - multi-timezones - multi-language (over 30 translations existing. ), authentication via SAML/LDAP/Database, two-factor authentication (2FA) with TOTP, customizable role and team permissions, responsive design, user/customer/project specific rates, advanced search & filtering, money and time budgets, advanced reporting, support for plugins and so much more.'
    ca_ES: 'Una aplicació de seguiment de temps de nivell professional, gratuïta i de codi obert. Gestiona casos d''ús tant de professionals autònoms com d''empreses amb desenes o centenars d''usuaris. Kimai es va crear per fer un seguiment dels temps dels vostres projectes i inclou moltes funcions avançades, com ara: API JSON, facturació, exportació de dades, mode multitemporitzador i punch-in punch-out, etiquetatge, multiusuari, multizones horàries, multiidioma (hi ha més de 30 traduccions), autenticació mitjançant SAML/LDAP/base de dades, autenticació de dos factors (2FA) amb TOTP, permisos personalitzables de rol i equip, disseny responsiu, tarifes específiques per usuari/client/projecte, cerca i filtratge avançats, pressupostos de temps i diners, informes avançats, compatibilitat amb complements i molt més.'
    cs_CZ: 'Profesionální aplikace pro sledování času, bezplatná a s otevřeným zdrojovým kódem. Zvládá použití freelancery i společnostmi s desítkami nebo stovkami uživatelů. Kimai byla vytvořena pro sledování času vašich projektů a dodává se s mnoha pokročilými funkcemi, včetně, ale nejen: JSON API, fakturace, exportu dat, režimu multi-timer a punch-in/punch-out, označování, více uživatelů - více časových pásem - více jazyků (existuje přes 30 překladů), ověřování přes SAML/LDAP/Databázi, dvoufaktorové ověřování (2FA) s TOTP, přizpůsobitelná oprávnění rolí a týmů, responzivní design, sazby specifické pro uživatele/zákazníky/projekty, pokročilé vyhledávání a filtrování, rozpočty na peníze a čas, pokročilé reportování, podpora pluginů a mnoho dalšího.'
    da_DK: 'En professionel tidsregistreringsapplikation, gratis og open source. Den håndterer use cases fra freelancere såvel som virksomheder med snesevis eller hundredvis af brugere. Kimai blev bygget til at spore dine projekttider og leveres med mange avancerede funktioner, herunder, men ikke begrænset til: JSON API, fakturering, dataeksport, multi-timer og punch-in punch-out tilstand, tagging, multi-bruger - multi-tidszoner - multi-sprog (over 30 oversættelser findes), godkendelse via SAML/LDAP/database, tofaktorgodkendelse (2FA) med TOTP, brugerdefinerede rolle- og teamtilladelser, responsivt design, bruger-/kunde-/projektspecifikke priser, avanceret søgning og filtrering, penge- og tidsbudgetter, avanceret rapportering, understøttelse af plugins og meget mere.'
    de_DE: 'Kimai ist eine professionelle, kostenlose Open-Source-Zeiterfassungs-App. Sie eignet sich sowohl für Freelancer als auch für Unternehmen mit Dutzenden oder Hunderten von Nutzern. Kimai wurde speziell für die Zeiterfassung Ihrer Projekte entwickelt und bietet zahlreiche fortschrittliche Funktionen, darunter: JSON-API, Rechnungsstellung, Datenexport, Multitimer- und Punch-in/Pull-out-Modus, Tagging, Unterstützung für mehrere Benutzer, Zeitzonen und Sprachen (über 30 Übersetzungen verfügbar), Authentifizierung via SAML/LDAP/Datenbank, Zwei-Faktor-Authentifizierung (2FA) mit TOTP, anpassbare Rollen- und Teamberechtigungen, responsives Design, benutzer-/kunden-/projektspezifische Tarife, erweiterte Such- und Filterfunktionen, Budgetierung von Geld und Zeit, detaillierte Berichtsfunktionen, Plugin-Unterstützung und vieles mehr.'
    el_GR: 'Μια επαγγελματική εφαρμογή παρακολούθησης χρόνου, δωρεάν και ανοιχτού κώδικα. Χειρίζεται περιπτώσεις χρήσης από ελεύθερους επαγγελματίες καθώς και από εταιρείες με δεκάδες ή εκατοντάδες χρήστες. Το Kimai δημιουργήθηκε για να παρακολουθεί τους χρόνους των έργων σας και διαθέτει πολλές προηγμένες λειτουργίες, όπως ενδεικτικά: JSON API, τιμολόγηση, εξαγωγές δεδομένων, λειτουργία πολλαπλών χρονοδιακόπτων και punch-in punch-out, ετικέτες, πολλαπλοί χρήστες - πολλαπλές ζώνες ώρας - πολλαπλές γλώσσες (υπάρχουν πάνω από 30 μεταφράσεις), έλεγχος ταυτότητας μέσω SAML/LDAP/βάσης δεδομένων, έλεγχος ταυτότητας δύο παραγόντων (2FA) με TOTP, προσαρμόσιμα δικαιώματα ρόλων και ομάδων, σχεδιασμός με δυνατότητα προσαρμογής, τιμές ανά χρήστη/πελάτη/έργο, προηγμένη αναζήτηση και φιλτράρισμα, προϋπολογισμούς χρημάτων και χρόνου, προηγμένες αναφορές, υποστήριξη για πρόσθετα και πολλά άλλα.'
    en_GB: 'A professional grade time-tracking application, free and open-source. It handles use-cases of freelancers as well as companies with dozens or hundreds of users. Kimai was build to track your project times and ships with many advanced features, including but not limited to: Json Api, invoicing, data exports, multi-timer and punch-in punch-out mode, tagging, multi-user - multi-timezones - multi-language (over 30 translations existing. ), authentication via Saml/Ldap/Database, two-factor authentication (2FA) with Totp, customisable role and team permissions, responsive design, user/customer/project specific rates, advanced search & filtering, money and time budgets, advanced reporting, support for plugins and so much more.'
    es_ES: 'Kimai es una aplicación profesional de seguimiento de tiempo, gratuita y de código abierto. Se adapta a las necesidades tanto de autónomos como de empresas con decenas o cientos de usuarios. Diseñada para el seguimiento del tiempo de tus proyectos, incluye numerosas funciones avanzadas, como: API JSON, facturación, exportación de datos, modo multitemporizador y de entrada/salida, etiquetado, soporte para múltiples usuarios, zonas horarias e idiomas (más de 30 traducciones), autenticación mediante SAML/LDAP/base de datos, autenticación de dos factores (2FA) con TOTP, permisos personalizables para roles y equipos, diseño adaptable, tarifas específicas para usuarios, clientes y proyectos, búsqueda y filtrado avanzados, presupuestos de tiempo y dinero, informes avanzados, compatibilidad con plugins y mucho más.'
    fr_FR: "Kimai est une application de suivi du temps professionnelle, gratuite et open source. Elle convient aussi bien aux freelances qu'aux entreprises comptant des dizaines, voire des centaines d'utilisateurs. Conçue pour le suivi du temps de travail sur vos projets, Kimai intègre de nombreuses fonctionnalités avancées, notamment\_: API JSON, facturation, exportation de données, gestion de plusieurs utilisateurs et modes de pointage (entrée/sortie), système de tags, multi-utilisateurs, multi-fuseaux horaires et multilingue (plus de 30 traductions disponibles), authentification via SAML/LDAP/base de données, authentification à deux facteurs (2FA) avec TOTP, permissions personnalisables pour les rôles et les équipes, design adaptatif, tarifs spécifiques aux utilisateurs, clients et projets, recherche et filtrage avancés, gestion des budgets (temps et argent), rapports détaillés, compatibilité avec les plugins, et bien plus encore."
    ga_IE: 'Feidhmchlár gairmiúil rianaithe ama, saor in aisce agus foinse oscailte. Láimhseálann sé cásanna úsáide saorálaithe chomh maith le cuideachtaí a bhfuil mórán nó na céadta úsáideoirí acu. Tógadh Kimai chun amanna do thionscadail a rianú agus tagann sé le go leor gnéithe ardleibhéil, lena n-áirítear, ach gan a bheith teoranta dóibh: API JSON, sonrascadh, easpórtálacha sonraí, mód il-amaire agus mód punch-in punch-out, clibeáil, ilúsáideoir - ilchriosanna ama - ilteangach (breis is 30 aistriúchán ann.), fíordheimhniú trí SAML/LDAP/Bunachar Sonraí, fíordheimhniú dhá fhachtóir (2FA) le TOTP, ceadanna róil agus foirne saincheaptha, dearadh sofhreagrach, rátaí sonracha úsáideora/custaiméara/tionscadail, cuardach & scagadh ardleibhéil, buiséid airgid agus ama, tuairisciú ardleibhéil, tacaíocht do bhreiseáin agus i bhfad níos mó.'
    hr_HR: 'Profesionalna aplikacija za praćenje vremena, besplatna i otvorenog koda. Pokriva slučajeve korištenja freelancera, kao i tvrtki s desecima ili stotinama korisnika. Kimai je izgrađen za praćenje vremena vaših projekata i dolazi s mnogim naprednim značajkama, uključujući, ali ne ograničavajući se na: JSON API, fakturiranje, izvoz podataka, način rada s više timera i punch-in/punch-out, označavanje, više korisnika - više vremenskih zona - više jezika (postoji preko 30 prijevoda), autentifikaciju putem SAML/LDAP/baze podataka, dvofaktorsku autentifikaciju (2FA) s TOTP-om, prilagodljive dozvole uloga i tima, responzivni dizajn, cijene specifične za korisnika/kupca/projekt, napredno pretraživanje i filtriranje, proračune za novac i vrijeme, napredno izvještavanje, podršku za dodatke i još mnogo toga.'
    hu_HU: 'Professzionális szintű időkövető alkalmazás, ingyenes és nyílt forráskódú. Szabadúszók, valamint több tucat vagy akár több száz felhasználóval rendelkező vállalatok igényeit is kezeli. A Kimai-t a projektek idejének nyomon követésére fejlesztették ki, és számos fejlett funkcióval rendelkezik, beleértve, de nem kizárólagosan: JSON API, számlázás, adatexportálás, többszörös időzítő és punch-in punch-out mód, címkézés, több felhasználó - több időzóna - többnyelvű (több mint 30 fordítás létezik), hitelesítés SAML/LDAP/adatbázison keresztül, kétfaktoros hitelesítés (2FA) TOTP-vel, testreszabható szerepkör- és csapatengedélyek, reszponzív design, felhasználó-/ügyfél-/projektspecifikus díjszabások, fejlett keresés és szűrés, pénzügyi és időkeretek, fejlett jelentéskészítés, bővítmények támogatása és még sok más.'
    it_IT: 'Kimai è un''applicazione professionale per il monitoraggio del tempo, gratuita e open-source. È adatta sia ai freelance che alle aziende con decine o centinaia di utenti. Progettata per tracciare il tempo dedicato ai progetti, Kimai offre numerose funzionalità avanzate, tra cui: API JSON, fatturazione, esportazione dati, modalità multi-timer e punch-in/punch-out, tagging, supporto multiutente, multi-fuso orario e multilingue (oltre 30 traduzioni disponibili), autenticazione tramite SAML/LDAP/Database, autenticazione a due fattori (2FA) con TOTP, permessi personalizzabili per ruoli e team, design responsive, tariffe specifiche per utenti/clienti/progetti, ricerca e filtri avanzati, budget di tempo e denaro, reportistica avanzata, supporto per plugin e molto altro ancora.'
    ja_JP: プロフェッショナルグレードのタイムトラッキングアプリケーションで、無料かつオープンソースです。フリーランサーだけでなく、数十人から数百人のユーザーを抱える企業まで、あらゆるユースケースに対応します。Kimaiはプロジェクトの時間を追跡するために構築されており、JSON API、請求書作成、データエクスポート、マルチタイマーと打刻モード、タグ付け、マルチユーザー、マルチタイムゾーン、多言語（30以上の翻訳が利用可能）、SAML/LDAP/データベースによる認証、TOTPによる二要素認証（2FA）、カスタマイズ可能な役割とチーム権限、レスポンシブデザイン、ユーザー/顧客/プロジェクト固有の料金設定、高度な検索とフィルタリング、予算と時間の予算管理、高度なレポート機能、プラグインのサポートなど、多くの高度な機能を備えています。
    ko_KR: 전문가 수준의 시간 관리 애플리케이션인 Kimai는 무료 오픈 소스 소프트웨어입니다. 프리랜서는 물론 수십 명에서 수백 명의 사용자를 보유한 기업까지 다양한 규모의 기업 환경에 적합합니다. Kimai는 프로젝트 시간 관리를 위해 개발되었으며, JSON API, 송장 발행, 데이터 내보내기, 다중 타이머 및 출퇴근 기록 모드, 태그 기능, 다중 사용자/다중 시간대/다중 언어 지원(30개 이상의 언어 번역 지원), SAML/LDAP/데이터베이스 인증, TOTP를 이용한 2단계 인증(2FA), 사용자 지정 가능한 역할 및 팀 권한, 반응형 디자인, 사용자/고객/프로젝트별 요금 설정, 고급 검색 및 필터링, 예산 및 비용 관리, 고급 보고서 작성, 플러그인 지원 등 다양한 고급 기능을 제공합니다.
    ml_IN: ഒരു പ്രൊഫഷണൽ ഗ്രേഡ് ടൈം-ട്രാക്കിംഗ് ആപ്ലിക്കേഷൻ, സൗജന്യവും ഓപ്പൺ സോഴ്‌സും. ഡസൻ കണക്കിന് അല്ലെങ്കിൽ നൂറുകണക്കിന് ഉപയോക്താക്കളുള്ള കമ്പനികളുടെയും ഫ്രീലാൻസറുടെയും ഉപയോഗ കേസുകൾ ഇത് കൈകാര്യം ചെയ്യുന്നു. JSON API, ഇൻവോയ്‌സിംഗ്, ഡാറ്റ എക്‌സ്‌പോർട്ടുകൾ, മൾട്ടി-ടൈമർ, പഞ്ച്-ഇൻ പഞ്ച്-ഔട്ട് മോഡ്, ടാഗിംഗ്, മൾട്ടി-യൂസർ - മൾട്ടി-ടൈംസോണുകൾ - മൾട്ടി-ലാംഗ്വേജ് (30-ലധികം വിവർത്തനങ്ങൾ നിലവിലുണ്ട്.), SAML/LDAP/ഡാറ്റാബേസ് വഴിയുള്ള പ്രാമാണീകരണം, TOTP ഉപയോഗിച്ചുള്ള ടു-ഫാക്ടർ പ്രാമാണീകരണം (2FA), ഇഷ്ടാനുസൃതമാക്കാവുന്ന റോൾ, ടീം അനുമതികൾ, പ്രതികരണശേഷിയുള്ള ഡിസൈൻ, ഉപയോക്താവ്/ഉപഭോക്താവ്/പ്രോജക്റ്റ് നിർദ്ദിഷ്ട നിരക്കുകൾ, വിപുലമായ തിരയൽ & ഫിൽട്ടറിംഗ്, പണവും സമയ ബജറ്റുകളും, വിപുലമായ റിപ്പോർട്ടിംഗ്, പ്ലഗിനുകൾക്കുള്ള പിന്തുണ തുടങ്ങി നിരവധി നൂതന സവിശേഷതകൾ ഉപയോഗിച്ച് നിങ്ങളുടെ പ്രോജക്റ്റ് സമയങ്ങൾ ട്രാക്ക് ചെയ്യുന്നതിനാണ് കിമൈ നിർമ്മിച്ചിരിക്കുന്നത്.
    nb_NO: 'En profesjonell tidssporingsapplikasjon, gratis og med åpen kildekode. Den håndterer bruksområder for frilansere så vel som selskaper med dusinvis eller hundrevis av brukere. Kimai ble bygget for å spore prosjekttiden din og leveres med mange avanserte funksjoner, inkludert, men ikke begrenset til: JSON API, fakturering, dataeksport, flertimers- og punch-in punch-out-modus, tagging, flerbruker - flere tidssoner - flerspråk (over 30 oversettelser finnes), autentisering via SAML/LDAP/database, tofaktorautentisering (2FA) med TOTP, tilpassbare rolle- og teamtillatelser, responsivt design, bruker-/kunde-/prosjektspesifikke priser, avansert søk og filtrering, penge- og tidsbudsjetter, avansert rapportering, støtte for plugins og mye mer.'
    nl_NL: 'Een professionele, gratis en open-source applicatie voor tijdregistratie. Geschikt voor zowel freelancers als bedrijven met tientallen of honderden gebruikers. Kimai is ontwikkeld om de tijd die je aan projecten besteedt te registreren en biedt vele geavanceerde functies, waaronder: JSON API, facturering, data-export, meerdere timers en in- en uitklokmodus, tagging, ondersteuning voor meerdere gebruikers, tijdzones en talen (meer dan 30 vertalingen beschikbaar), authenticatie via SAML/LDAP/database, tweefactorauthenticatie (2FA) met TOTP, aanpasbare rol- en teamrechten, responsief ontwerp, gebruikers-/klant-/projectspecifieke tarieven, geavanceerd zoeken en filteren, budgetten voor geld en tijd, geavanceerde rapportage, ondersteuning voor plug-ins en nog veel meer.'
    pl_PL: 'Profesjonalna aplikacja do śledzenia czasu pracy, darmowa i open source. Obsługuje zarówno freelancerów, jak i firmy zatrudniające dziesiątki, a nawet setki użytkowników. Kimai został stworzony z myślą o śledzeniu czasu pracy w projektach i oferuje wiele zaawansowanych funkcji, takich jak: API JSON, fakturowanie, eksport danych, tryby wielu timerów i odbitek, tagowanie, obsługa wielu użytkowników, wielu stref czasowych i wielu języków (ponad 30 dostępnych tłumaczeń), uwierzytelnianie przez SAML/LDAP/bazę danych, uwierzytelnianie dwuskładnikowe (2FA) z TOTP, konfigurowalne uprawnienia ról i zespołów, responsywny design, stawki dla poszczególnych użytkowników/klientów/projektów, zaawansowane wyszukiwanie i filtrowanie, budżety pieniężne i czasowe, zaawansowane raportowanie, obsługa wtyczek i wiele innych.'
    pt_BR: 'Um aplicativo profissional de controle de tempo, gratuito e de código aberto. Ele atende às necessidades de freelancers e também de empresas com dezenas ou centenas de usuários. O Kimai foi desenvolvido para controlar o tempo gasto em seus projetos e oferece diversos recursos avançados, incluindo, entre outros: API JSON, faturamento, exportação de dados, múltiplos cronômetros e modo de registro de entrada e saída, marcação, suporte a múltiplos usuários, múltiplos fusos horários e múltiplos idiomas (mais de 30 traduções disponíveis), autenticação via SAML/LDAP/Banco de Dados, autenticação de dois fatores (2FA) com TOTP, permissões personalizáveis para funções e equipes, design responsivo, tarifas específicas para usuários/clientes/projetos, busca e filtragem avançadas, orçamentos de tempo e dinheiro, relatórios avançados, suporte a plugins e muito mais.'
    ro_RO: 'O aplicație profesională de urmărire a timpului, gratuită și open-source. Se adresează atât freelancerilor, cât și companiilor cu zeci sau sute de utilizatori. Kimai a fost creată pentru a urmări timpii proiectelor și este dotată cu multe funcții avansate, inclusiv, dar fără a se limita la: API JSON, facturare, export de date, mod multi-timer și punch-in punch-out, etichetare, multi-utilizator - multi-fusuri orare - multi-limbă (există peste 30 de traduceri), autentificare prin SAML/LDAP/Bază de date, autentificare cu doi factori (2FA) cu TOTP, permisiuni personalizabile pentru roluri și echipe, design responsiv, tarife specifice utilizatorului/clientului/proiectului, căutare și filtrare avansate, bugete de timp și bani, raportare avansată, suport pentru plugin-uri și multe altele.'
    ru_RU: 'Профессиональное приложение для учета рабочего времени, бесплатное и с открытым исходным кодом. Оно подходит как для фрилансеров, так и для компаний с десятками или сотнями пользователей. Kimai создано для отслеживания времени выполнения проектов и включает в себя множество расширенных функций, в том числе: JSON API, выставление счетов, экспорт данных, многоканальный режим работы и режим регистрации начала и окончания рабочего дня, тегирование, многопользовательский режим, поддержка нескольких часовых поясов, многоязычность (более 30 существующих переводов), аутентификация через SAML/LDAP/базу данных, двухфакторная аутентификация (2FA) с TOTP, настраиваемые права доступа для ролей и команд, адаптивный дизайн, тарифы для пользователей/клиентов/проектов, расширенный поиск и фильтрация, бюджеты времени и денежных средств, расширенная отчетность, поддержка плагинов и многое другое.'
    sk_SK: 'Profesionálna aplikácia na sledovanie času, bezplatná a s otvoreným zdrojovým kódom. Zvláda prípady použitia freelancerov, ako aj spoločností s desiatkami alebo stovkami používateľov. Kimai bola vytvorená na sledovanie času vašich projektov a dodáva sa s mnohými pokročilými funkciami, vrátane, ale nie výlučne: JSON API, fakturácia, export údajov, režim viacerých časovačov a punch-in/punch-out, označovanie, viacero používateľov - viacero časových pásiem - viac jazykov (existuje viac ako 30 prekladov), autentifikácia cez SAML/LDAP/databázu, dvojfaktorová autentifikácia (2FA) s TOTP, prispôsobiteľné oprávnenia rolí a tímov, responzívny dizajn, sadzby špecifické pre používateľa/zákazníka/projekt, pokročilé vyhľadávanie a filtrovanie, rozpočty peňazí a času, pokročilé reportovanie, podpora pluginov a mnoho ďalšieho.'
    sv_SE: 'En professionell tidsspårningsapplikation, gratis och öppen källkod. Den hanterar användningsområden för frilansare såväl som företag med dussintals eller hundratals användare. Kimai byggdes för att spåra dina projekttider och levereras med många avancerade funktioner, inklusive men inte begränsat till: JSON API, fakturering, dataexport, multi-timer och punch-in punch-out-läge, taggning, flera användare - flera tidszoner - flera språk (över 30 översättningar finns), autentisering via SAML/LDAP/databas, tvåfaktorsautentisering (2FA) med TOTP, anpassningsbara roll- och teambehörigheter, responsiv design, användar-/kund-/projektspecifika priser, avancerad sökning och filtrering, budgetar för pengar och tid, avancerad rapportering, stöd för plugins och mycket mer.'
    tr_TR: 'Profesyonel düzeyde, ücretsiz ve açık kaynaklı bir zaman takip uygulaması. Hem serbest çalışanların hem de onlarca veya yüzlerce kullanıcısı olan şirketlerin kullanım durumlarını ele alıyor. Kimai, proje sürelerinizi takip etmek için geliştirildi ve aşağıdakiler de dahil olmak üzere birçok gelişmiş özellik sunuyor: JSON API, faturalama, veri dışa aktarma, çoklu zamanlayıcı ve giriş-çıkış modu, etiketleme, çoklu kullanıcı - çoklu saat dilimi - çoklu dil (30''dan fazla çeviri mevcut), SAML/LDAP/Veritabanı üzerinden kimlik doğrulama, TOTP ile iki faktörlü kimlik doğrulama (2FA), özelleştirilebilir rol ve ekip izinleri, duyarlı tasarım, kullanıcı/müşteri/proje özelinde ücretlendirme, gelişmiş arama ve filtreleme, para ve zaman bütçeleri, gelişmiş raporlama, eklenti desteği ve çok daha fazlası.'
    zh_CN: 适合自由职业者和企业的专业工时管理。
    zh_TW: 適合自由職業者和企業的專業工時管理。
