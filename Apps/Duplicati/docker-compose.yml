    ru_RU: Клиент резервного копирования, который безопасно хранит зашифрованные, инкрементальные, сжатые резервные копии на локальном хранилище, в облачных сервисах и на удаленных файловых серверах. Он работает со стандартными протоколами, такими как FTP, SSH, WebDAV, а также с популярными сервисами, такими как Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 и многими другими.
    sk_SK: Zálohovací klient, ktorý bezpečne ukladá šifrované, inkrementálne a komprimované zálohy na lokálne úložisko, cloudové úložiská a vzdialené súborové servery. Funguje so štandardnými protokolmi ako FTP, SSH, WebDAV, ako aj s populárnymi službami ako Microsoft OneDrive, Amazon S3, Google Drive, Box.com, Mega, B2 a mnohými ďalšími.
    sv_SE: En säkerhetskopieringsklient som säkert lagrar krypterade, stegvisa och komprimerade säkerhetskopior på lokal lagring, molnlagringstjänster och fjärrfilservrar. Den fungerar med standardprotokoll som FTP, SSH, WebDAV samt populära tjänster som Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 och många andra.
    tr_TR: Yerel depolama alanında, bulut depolama hizmetlerinde ve uzak dosya sunucularında şifrelenmiş, artımlı ve sıkıştırılmış yedeklemeleri güvenli bir şekilde saklayan bir yedekleme istemcisidir. FTP, SSH, WebDAV gibi standart protokollerin yanı sıra Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 ve daha birçok popüler hizmetle çalışır.
    zh_CN: 将加密、增量和压缩备份保存到本地或云端。
    zh_TW: 將加密、增量和壓縮備份儲存到本地或雲端。
