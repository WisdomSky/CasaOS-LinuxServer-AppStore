name: linuxserver-duplicati
services:
  app:
    image: linuxserver/duplicati:2.4.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SETTINGS_ENCRYPTION_KEY: ''
      CLI_ARGS: ''
      DUPLICATI__WEBSERVICE_PASSWORD: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: SETTINGS_ENCRYPTION_KEY
          description:
            en_US: Encryption key for settings database. Minimum 8 characters, alphanumeric.
        - container: CLI_ARGS
          description:
            en_US: Optionally specify any CLI variables you want to launch the app with [OPTIONAL]
        - container: DUPLICATI__WEBSERVICE_PASSWORD
          description:
            en_US: Password for the webui. If left unset will default to changeme and can be changed from the webui settings. [OPTIONAL]
    ports:
      - target: 8200
        published: 8200
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duplicati/config
        target: /config
      - type: bind
        source: /DATA/AppData/duplicati/backups
        target: /backups
      - type: bind
        source: /DATA/AppData/duplicati/source
        target: /source
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Duplicati is a backup client that securely stores encrypted, incremental, compressed backups on local storage, cloud storage services and remote file servers. It works with standard protocols like FTP, SSH, WebDAV as well as popular services like Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2, and many others.
    ca_ES: Duplicati és un client de còpies de seguretat que emmagatzema de manera segura còpies de seguretat xifrades, incrementals i comprimides en emmagatzematge local, serveis d'emmagatzematge al núvol i servidors de fitxers remots. Funciona amb protocols estàndard com FTP, SSH, WebDAV, així com amb serveis populars com Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 i molts altres.
    cs_CZ: Duplicati je zálohovací klient, který bezpečně ukládá šifrované, inkrementální a komprimované zálohy na lokální úložiště, cloudové úložné služby a vzdálené souborové servery. Funguje se standardními protokoly, jako jsou FTP, SSH, WebDAV, a také s oblíbenými službami, jako jsou Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 a mnoho dalších.
    da_DK: Duplicati er en backupklient, der sikkert gemmer krypterede, trinvise og komprimerede backups på lokal lagring, cloud-lagringstjenester og eksterne filservere. Den fungerer med standardprotokoller som FTP, SSH, WebDAV samt populære tjenester som Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 og mange andre.
    de_DE: Duplicati ist ein Backup-Client, der verschlüsselte, inkrementelle und komprimierte Backups sicher auf lokalen Speichern, in Cloud-Speichern und auf entfernten Dateiservern speichert. Er unterstützt Standardprotokolle wie FTP, SSH und WebDAV sowie gängige Dienste wie Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 und viele andere.
    el_GR: Το Duplicati είναι ένα πρόγραμμα-πελάτης δημιουργίας αντιγράφων ασφαλείας που αποθηκεύει με ασφάλεια κρυπτογραφημένα, σταδιακά, συμπιεσμένα αντίγραφα ασφαλείας σε τοπικό χώρο αποθήκευσης, υπηρεσίες αποθήκευσης cloud και απομακρυσμένους διακομιστές αρχείων. Λειτουργεί με τυπικά πρωτόκολλα όπως FTP, SSH, WebDAV, καθώς και με δημοφιλείς υπηρεσίες όπως Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 και πολλές άλλες.
    en_GB: Duplicati is a backup client that securely stores encrypted, incremental, compressed backups on local storage, cloud storage services and remote file servers. It works with standard protocols like Ftp, Ssh, Webdav as well as popular services like Microsoft Onedrive, Amazon S3, Google Drive, box.com, Mega, B2, and many others.
    es_ES: Duplicati es un cliente de copias de seguridad que almacena de forma segura copias de seguridad cifradas, incrementales y comprimidas en almacenamiento local, servicios de almacenamiento en la nube y servidores de archivos remotos. Funciona con protocolos estándar como FTP, SSH y WebDAV, así como con servicios populares como Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 y muchos otros.
    fr_FR: Duplicati est un client de sauvegarde qui stocke en toute sécurité des sauvegardes incrémentales, chiffrées et compressées sur le stockage local, les services de stockage cloud et les serveurs de fichiers distants. Il est compatible avec les protocoles standards tels que FTP, SSH et WebDAV, ainsi qu'avec des services populaires comme Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 et bien d'autres.
    ga_IE: Is cliant cúltaca é Duplicati a stórálann cúltacaí criptithe, incriminteacha, comhbhrúite go slán ar stóráil áitiúil, ar sheirbhísí stórála scamall agus ar fhreastalaithe comhad iargúlta. Oibríonn sé le prótacail chaighdeánacha ar nós FTP, SSH, WebDAV chomh maith le seirbhísí coitianta ar nós Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2, agus go leor eile.
    hr_HR: Duplicati je klijent za sigurnosno kopiranje koji sigurno pohranjuje šifrirane, inkrementalne, komprimirane sigurnosne kopije na lokalnu pohranu, usluge pohrane u oblaku i udaljene poslužitelje datoteka. Radi sa standardnim protokolima poput FTP-a, SSH-a, WebDAV-a, kao i s popularnim uslugama poput Microsoft OneDrivea, Amazon S3, Google Drivea, box.coma, Mege, B2 i mnogih drugih.
    hu_HU: A Duplicati egy biztonsági mentési kliens, amely biztonságosan tárolja a titkosított, inkrementális, tömörített biztonsági mentéseket helyi tárolón, felhőalapú tárhelyszolgáltatásokon és távoli fájlszervereken. Működik olyan szabványos protokollokkal, mint az FTP, SSH, WebDAV, valamint olyan népszerű szolgáltatásokkal, mint a Microsoft OneDrive, az Amazon S3, a Google Drive, a box.com, a Mega, a B2 és sok más.
    it_IT: Duplicati è un client di backup che archivia in modo sicuro backup incrementali, compressi e crittografati su storage locale, servizi di cloud storage e server di file remoti. Funziona con protocolli standard come FTP, SSH, WebDAV, nonché con servizi popolari come Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 e molti altri.
    ja_JP: Duplicatiは、暗号化された増分バックアップを圧縮してローカルストレージ、クラウドストレージサービス、リモートファイルサーバーに安全に保存するバックアップクライアントです。FTP、SSH、WebDAVなどの標準プロトコルに加え、Microsoft OneDrive、Amazon S3、Google Drive、box.com、Mega、B2など、多くの人気サービスにも対応しています。
    ko_KR: Duplicati는 암호화되고, 증분 방식으로 압축된 백업 파일을 로컬 저장소, 클라우드 스토리지 서비스 및 원격 파일 서버에 안전하게 저장하는 백업 클라이언트입니다. FTP, SSH, WebDAV와 같은 표준 프로토콜은 물론 Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 등 다양한 인기 서비스와도 호환됩니다.
    ml_IN: ലോക്കൽ സ്റ്റോറേജ്, ക്ലൗഡ് സ്റ്റോറേജ് സേവനങ്ങൾ, റിമോട്ട് ഫയൽ സെർവറുകൾ എന്നിവയിൽ എൻക്രിപ്റ്റ് ചെയ്ത, ഇൻക്രിമെന്റൽ, കംപ്രസ് ചെയ്ത ബാക്കപ്പുകൾ സുരക്ഷിതമായി സംഭരിക്കുന്ന ഒരു ബാക്കപ്പ് ക്ലയന്റാണ് ഡ്യൂപ്ലിക്കാറ്റി. ഇത് FTP, SSH, WebDAV പോലുള്ള സ്റ്റാൻഡേർഡ് പ്രോട്ടോക്കോളുകളിലും Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 തുടങ്ങിയ ജനപ്രിയ സേവനങ്ങളിലും പ്രവർത്തിക്കുന്നു.
    nb_NO: Duplicati er en sikkerhetskopieringsklient som sikkert lagrer krypterte, inkrementelle og komprimerte sikkerhetskopier på lokal lagring, i skylagringstjenester og eksterne filservere. Den fungerer med standardprotokoller som FTP, SSH og WebDAV, samt populære tjenester som Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 og mange andre.
    nl_NL: Duplicati is een back-upclient die versleutelde, incrementele en gecomprimeerde back-ups veilig opslaat op lokale opslagmedia, cloudopslagservices en externe bestandsservers. Het werkt met standaardprotocollen zoals FTP, SSH en WebDAV, maar ook met populaire services zoals Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 en vele andere.
    pl_PL: Duplicati to klient kopii zapasowych, który bezpiecznie przechowuje zaszyfrowane, przyrostowe i skompresowane kopie zapasowe na lokalnych serwerach pamięci masowej, w usługach przechowywania w chmurze i na zdalnych serwerach plików. Współpracuje ze standardowymi protokołami, takimi jak FTP, SSH, WebDAV, a także popularnymi usługami, takimi jak Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 i wieloma innymi.
    pt_BR: O Duplicati é um cliente de backup que armazena com segurança backups incrementais, criptografados e compactados em armazenamento local, serviços de armazenamento em nuvem e servidores de arquivos remotos. Ele funciona com protocolos padrão como FTP, SSH e WebDAV, além de serviços populares como Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 e muitos outros.
    ro_RO: Duplicati este un client de backup care stochează în siguranță copii de rezervă criptate, incrementale și comprimate pe spațiu de stocare local, servicii de stocare în cloud și servere de fișiere la distanță. Funcționează cu protocoale standard precum FTP, SSH, WebDAV, precum și cu servicii populare precum Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 și multe altele.
    ru_RU: Duplicati — это клиент для резервного копирования, который безопасно хранит зашифрованные, инкрементальные, сжатые резервные копии на локальном хранилище, в облачных сервисах и на удаленных файловых серверах. Он работает со стандартными протоколами, такими как FTP, SSH, WebDAV, а также с популярными сервисами, такими как Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 и многими другими.
    sk_SK: Duplicati je zálohovací klient, ktorý bezpečne ukladá šifrované, inkrementálne a komprimované zálohy na lokálne úložisko, cloudové úložiská a vzdialené súborové servery. Funguje so štandardnými protokolmi ako FTP, SSH, WebDAV, ako aj s populárnymi službami ako Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 a mnoho ďalších.
    sv_SE: Duplicati är en säkerhetskopieringsklient som säkert lagrar krypterade, stegvisa och komprimerade säkerhetskopior på lokal lagring, molnlagringstjänster och fjärrfilservrar. Den fungerar med standardprotokoll som FTP, SSH, WebDAV samt populära tjänster som Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 och många andra.
    tr_TR: Duplicati, şifrelenmiş, artımlı ve sıkıştırılmış yedeklemeleri yerel depolama alanına, bulut depolama hizmetlerine ve uzak dosya sunucularına güvenli bir şekilde depolayan bir yedekleme istemcisidir. FTP, SSH, WebDAV gibi standart protokollerin yanı sıra Microsoft OneDrive, Amazon S3, Google Drive, box.com, Mega, B2 ve daha birçok popüler hizmetle çalışır.
    zh_CN: Duplicati 是一款备份客户端，可将加密、增量、压缩的备份安全地保存到本地存储、云存储服务和远程文件服务器。它支持 FTP、SSH、WebDAV 等标准协议，以及 Microsoft OneDrive、Amazon S3、Google Drive、box.com、Mega、B2 等多种服务。
    zh_TW: Duplicati 是一款備份客戶端，可將加密、增量、壓縮的備份安全地儲存到本地儲存、雲端儲存服務和遠端檔案伺服器。它支援 FTP、SSH、WebDAV 等標準協議，以及 Microsoft OneDrive、Amazon S3、Google Drive、box.com、Mega、B2 等多種服務。
