name: linuxserver-habridge
services:
  app:
    image: linuxserver/habridge:5.4.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SEC_KEY: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: SEC_KEY
          description:
            en_US: Key used to secure communication.
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 50000
        published: 50000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/habridge/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Habridge emulates Philips Hue API to other home automation gateways such as an Amazon Echo/Dot Gen 1 (gen 2 has issues discovering ha-bridge) or other systems that support Philips Hue. The Bridge handles basic commands such as On, Off and brightness commands of the hue protocol. This bridge can control most devices that have a distinct API.
    ca_ES: Habridge emula l'API de Philips Hue amb altres passarel·les de domòtica com ara un Amazon Echo/Dot Gen 1 (la gen 2 té problemes per detectar ha-bridge) o altres sistemes compatibles amb Philips Hue. El Bridge gestiona ordres bàsiques com ara les ordres d'encesa, apagada i brillantor del protocol hue. Aquest pont pot controlar la majoria de dispositius que tenen una API diferent.
    cs_CZ: Habridge emuluje API Philips Hue do jiných bran domácí automatizace, jako je Amazon Echo/Dot Gen 1 (gen 2 má problémy s nalezením ha-bridge) nebo jiných systémů, které podporují Philips Hue. Bridge zvládá základní příkazy protokolu Hue, jako jsou Zapnutí, Vypnutí a jas. Tento bridge dokáže ovládat většinu zařízení, která mají samostatné API.
    da_DK: Habridge emulerer Philips Hue API til andre hjemmeautomationsgateways, såsom en Amazon Echo/Dot Gen 1 (gen 2 har problemer med at opdage ha-bridge) eller andre systemer, der understøtter Philips Hue. Bridgen håndterer grundlæggende kommandoer såsom tænd/sluk og lysstyrkekommandoer fra hue-protokollen. Denne bro kan styre de fleste enheder, der har en separat API.
    de_DE: Habridge emuliert die Philips Hue API für andere Smart-Home-Geräte wie Amazon Echo/Dot der 1. Generation (bei der 2. Generation treten Probleme mit der Erkennung von Habridge auf) oder andere Philips Hue-kompatible Systeme. Die Bridge verarbeitet grundlegende Befehle des Hue-Protokolls wie Ein-/Ausschalten und Helligkeitsregelung. Sie kann die meisten Geräte mit eigener API steuern.
    el_GR: Το Habridge μιμείται το Philips Hue API σε άλλες πύλες οικιακού αυτοματισμού, όπως ένα Amazon Echo/Dot Gen 1 (το gen 2 έχει προβλήματα με την ανακάλυψη του ha-bridge) ή άλλα συστήματα που υποστηρίζουν το Philips Hue. Το Bridge χειρίζεται βασικές εντολές όπως εντολές On, Off και φωτεινότητας του πρωτοκόλλου Hue. Αυτή η γέφυρα μπορεί να ελέγχει τις περισσότερες συσκευές που έχουν ξεχωριστό API.
    en_GB: Habridge emulates Philips Hue Api to other home automation gateways such as an Amazon Echo/Dot Gen 1 (gen 2 has issues discovering ha-bridge) or other systems that support Philips Hue. The Bridge handles basic commands such as On, Off and brightness commands of the hue protocol. This bridge can control most devices that have a distinct Api.
    es_ES: Habridge emula la API de Philips Hue para otras pasarelas de automatización del hogar, como Amazon Echo/Dot de primera generación (la segunda generación presenta problemas para detectar habridge) u otros sistemas compatibles con Philips Hue. El puente gestiona comandos básicos como encendido, apagado y ajuste de brillo del protocolo Hue. Este puente puede controlar la mayoría de los dispositivos con una API específica.
    fr_FR: Habridge émule l'API Philips Hue pour d'autres passerelles domotiques, comme l'Amazon Echo/Dot de première génération (la deuxième génération rencontre des problèmes de détection de ha-bridge), ou d'autres systèmes compatibles Philips Hue. Le pont gère les commandes de base du protocole Hue, telles que l'allumage, l'extinction et le réglage de la luminosité. Il peut contrôler la plupart des appareils dotés d'une API dédiée.
    ga_IE: Déanann Habridge aithris ar API Philips Hue chuig geataí uathoibrithe baile eile amhail Amazon Echo/Dot Gen 1 (tá fadhbanna ag glúin 2 ag aimsiú ha-bridge) nó córais eile a thacaíonn le Philips Hue. Láimhseálann an Droichead orduithe bunúsacha amhail orduithe Ar Siúl, As agus gile an phrótacail hue. Is féidir leis an droichead seo an chuid is mó de na gléasanna a bhfuil API ar leith acu a rialú.
    hr_HR: Habridge emulira Philips Hue API na druge sustave za automatizaciju doma kao što su Amazon Echo/Dot Gen 1 (gen 2 ima problema s otkrivanjem ha-bridgea) ili druge sustave koji podržavaju Philips Hue. Bridge obrađuje osnovne naredbe kao što su naredbe za uključivanje, isključivanje i svjetlinu hue protokola. Ovaj most može kontrolirati većinu uređaja koji imaju zaseban API.
    hu_HU: A Habridge emulálja a Philips Hue API-t más otthonautomatizálási átjárókhoz, például egy Amazon Echo/Dot Gen 1-hez (a 2. generációnak problémái vannak a ha-bridge felismerésével) vagy más, Philips Hue-t támogató rendszerekhez. A Bridge kezeli a Hue protokoll alapvető parancsait, például a be-, ki- és fényerő-parancsokat. Ez a híd a legtöbb olyan eszközt képes vezérelni, amely rendelkezik külön API-val.
    it_IT: Habridge emula l'API di Philips Hue per interagire con altri gateway di domotica come Amazon Echo/Dot di prima generazione (la seconda generazione presenta problemi di rilevamento di ha-bridge) o altri sistemi compatibili con Philips Hue. Il bridge gestisce i comandi di base del protocollo Hue, come accensione, spegnimento e regolazione della luminosità. Questo bridge è in grado di controllare la maggior parte dei dispositivi dotati di un'API specifica.
    ja_JP: Habridgeは、Amazon Echo/Dot Gen 1（Gen 2ではha-bridgeの検出に問題があります）などのホームオートメーションゲートウェイや、Philips Hueをサポートするその他のシステムに対して、Philips Hue APIをエミュレートします。このブリッジは、Hueプロトコルのオン/オフや明るさ調整などの基本コマンドを処理します。このブリッジは、独自のAPIを持つほとんどのデバイスを制御できます。
    ko_KR: Habridge는 Philips Hue API를 에뮬레이션하여 Amazon Echo/Dot 1세대(2세대는 ha-bridge 검색에 문제가 있음) 또는 Philips Hue를 지원하는 기타 홈 자동화 게이트웨이와 같은 장치에서 사용할 수 있도록 합니다. 이 브리지는 Hue 프로토콜의 켜기, 끄기, 밝기 조절과 같은 기본 명령을 처리합니다. Habridge는 고유한 API를 가진 대부분의 장치를 제어할 수 있습니다.
    ml_IN: ആമസോൺ എക്കോ/ഡോട്ട് ജെൻ 1 (ജെൻ 2-ന് ഹാ-ബ്രിഡ്ജ് കണ്ടെത്തുന്നതിൽ പ്രശ്‌നങ്ങളുണ്ട്) അല്ലെങ്കിൽ ഫിലിപ്സ് ഹ്യൂവിനെ പിന്തുണയ്ക്കുന്ന മറ്റ് സിസ്റ്റങ്ങൾ പോലുള്ള മറ്റ് ഹോം ഓട്ടോമേഷൻ ഗേറ്റ്‌വേകളിലേക്ക് ഹാബ്രിഡ്ജ് ഫിലിപ്സ് ഹ്യൂ API അനുകരിക്കുന്നു. ഹ്യൂ പ്രോട്ടോക്കോളിന്റെ ഓൺ, ഓഫ്, ബ്രൈറ്റ്‌നെസ് കമാൻഡുകൾ പോലുള്ള അടിസ്ഥാന കമാൻഡുകൾ ബ്രിഡ്ജ് കൈകാര്യം ചെയ്യുന്നു. വ്യത്യസ്തമായ API ഉള്ള മിക്ക ഉപകരണങ്ങളെയും ഈ ബ്രിഡ്ജിന് നിയന്ത്രിക്കാൻ കഴിയും.
    nb_NO: Habridge emulerer Philips Hue API til andre hjemmeautomatiseringsgatewayer, som for eksempel Amazon Echo/Dot Gen 1 (gen 2 har problemer med å oppdage ha-bridge) eller andre systemer som støtter Philips Hue. Bridge håndterer grunnleggende kommandoer som av, på og lysstyrkekommandoer fra Hue-protokollen. Denne broen kan kontrollere de fleste enheter som har et eget API.
    nl_NL: Habridge emuleert de Philips Hue API voor andere domotica-gateways, zoals een Amazon Echo/Dot Gen 1 (Gen 2 heeft problemen met het detecteren van ha-bridge) of andere systemen die Philips Hue ondersteunen. De bridge verwerkt basiscommando's zoals aan- en uitzetten en helderheidsregeling via het Hue-protocol. Deze bridge kan de meeste apparaten met een eigen API aansturen.
    pl_PL: Habridge emuluje API Philips Hue dla innych bramek automatyki domowej, takich jak Amazon Echo/Dot Gen 1 (generacja 2 ma problemy z wykrywaniem Ha-Bridge) lub innych systemów obsługujących Philips Hue. Most obsługuje podstawowe polecenia, takie jak włączanie, wyłączanie i regulacja jasności, w ramach protokołu Hue. Most ten może sterować większością urządzeń z odrębnym API.
    pt_BR: O Habridge emula a API do Philips Hue para outros gateways de automação residencial, como o Amazon Echo/Dot de 1ª geração (a 2ª geração apresenta problemas para detectar o ha-bridge) ou outros sistemas compatíveis com o Philips Hue. O Bridge processa comandos básicos, como ligar, desligar e ajustar o brilho, do protocolo Hue. Este bridge pode controlar a maioria dos dispositivos que possuem uma API própria.
    ro_RO: Habridge emulează API-ul Philips Hue cu alte gateway-uri de automatizare a locuinței, cum ar fi Amazon Echo/Dot Gen 1 (Gen 2 are probleme la detectarea ha-bridge-ului) sau alte sisteme care acceptă Philips Hue. Bridge-ul gestionează comenzi de bază, cum ar fi Pornire, Oprire și comenzile de luminozitate ale protocolului hue. Acest bridge poate controla majoritatea dispozitivelor care au un API distinct.
    ru_RU: Habridge эмулирует API Philips Hue для других шлюзов домашней автоматизации, таких как Amazon Echo/Dot первого поколения (у второго поколения возникают проблемы с обнаружением ha-bridge) или других систем, поддерживающих Philips Hue. Мост обрабатывает основные команды, такие как включение, выключение и регулировка яркости по протоколу Hue. Этот мост может управлять большинством устройств, имеющих собственный API.
    sk_SK: Habridge emuluje rozhranie API spoločnosti Philips Hue do iných brán domácej automatizácie, ako napríklad Amazon Echo/Dot Gen 1 (gen 2 má problémy s objavením rozhrania Habridge) alebo iných systémov, ktoré podporujú systém Philips Hue. Rozhranie Bridge spracováva základné príkazy protokolu Hue, ako sú zapnutie, vypnutie a príkazy jasu. Toto rozhranie Bridge dokáže ovládať väčšinu zariadení, ktoré majú samostatné rozhranie API.
    sv_SE: Habridge emulerar Philips Hue API till andra hemautomationsgateways, till exempel Amazon Echo/Dot Gen 1 (gen 2 har problem med att upptäcka ha-bridge) eller andra system som stöder Philips Hue. Bryggan hanterar grundläggande kommandon som på, av och ljusstyrkekommandon från Hue-protokollet. Denna brygga kan styra de flesta enheter som har ett separat API.
    tr_TR: Habridge, Amazon Echo/Dot 1. Nesil (2. nesilde ha-bridge'i keşfetmede sorunlar var) veya Philips Hue'yu destekleyen diğer sistemler gibi diğer ev otomasyon ağ geçitlerine Philips Hue API'sini taklit eder. Köprü, Hue protokolünün Açma, Kapatma ve parlaklık komutları gibi temel komutlarını işler. Bu köprü, ayrı bir API'ye sahip çoğu cihazı kontrol edebilir.
    zh_CN: HA Bridge 向其他家庭自动化网关模拟 Philips Hue API，例如第一代 Amazon Echo/Dot，或其他支持 Philips Hue 的系统；第二代设备在发现 HA Bridge 时存在问题。它支持 Hue 协议中的开启、关闭和亮度等基本命令，并可控制大多数提供独立 API 的设备。
    zh_TW: HA Bridge 向其他家庭自動化閘道器模擬 Philips Hue API，例如第一代 Amazon Echo/Dot，或其他支援 Philips Hue 的系統；第二代裝置在發現 HA Bridge 時存在問題。它支援 Hue 協議中的開啟、關閉和亮度等基本命令，並可控制大多數提供獨立 API 的裝置。
