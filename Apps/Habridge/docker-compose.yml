    nl_NL: Deze bridge emuleert de Philips Hue API voor andere domotica-gateways, zoals een Amazon Echo/Dot Gen 1 (Gen 2 heeft problemen met het detecteren van ha-bridge) of andere systemen die Philips Hue ondersteunen. De bridge verwerkt basiscommando's zoals aan- en uitzetten en helderheidsregeling via het Hue-protocol. Deze bridge kan de meeste apparaten met een eigen API aansturen.
    pl_PL: Emuluje interfejs API Philips Hue dla innych bramek automatyki domowej, takich jak Amazon Echo/Dot Gen 1 (generacja 2 ma problemy z wykrywaniem mostu Ha-Bridge) lub innych systemów obsługujących Philips Hue. Most obsługuje podstawowe polecenia, takie jak włączanie, wyłączanie i regulacja jasności, w ramach protokołu Hue. Most ten może sterować większością urządzeń z odrębnym interfejsem API.
    pt_BR: Emula a API do Philips Hue para outros gateways de automação residencial, como o Amazon Echo/Dot de 1ª geração (a 2ª geração apresenta problemas para detectar o ha-bridge) ou outros sistemas compatíveis com o Philips Hue. O Bridge processa comandos básicos, como ligar, desligar e ajustar o brilho, do protocolo Hue. Este Bridge pode controlar a maioria dos dispositivos que possuem uma API própria.
    ro_RO: Emulează API-ul Philips Hue către alte gateway-uri de automatizare a locuinței, cum ar fi Amazon Echo/Dot Gen 1 (Gen 2 are probleme la detectarea ha-bridge-ului) sau alte sisteme care acceptă Philips Hue. Bridge-ul gestionează comenzi de bază, cum ar fi Pornire, Oprire și comenzi de luminozitate ale protocolului Hue. Acest bridge poate controla majoritatea dispozitivelor care au un API distinct.
    ru_RU: Этот мост эмулирует API Philips Hue для других шлюзов домашней автоматизации, таких как Amazon Echo/Dot первого поколения (у второго поколения возникают проблемы с обнаружением ha-bridge) или других систем, поддерживающих Philips Hue. Мост обрабатывает основные команды, такие как включение, выключение и регулировка яркости по протоколу Hue. Этот мост может управлять большинством устройств, имеющих собственный API.
    sk_SK: Emuluje rozhranie API spoločnosti Philips Hue k iným bránam domácej automatizácie, ako napríklad Amazon Echo/Dot Gen 1 (gen 2 má problémy s objavením rozhrania ha-bridge) alebo k iným systémom, ktoré podporujú systém Philips Hue. Rozhranie Bridge spracováva základné príkazy protokolu Hue, ako sú zapnutie, vypnutie a príkazy jasu. Toto rozhranie Bridge dokáže ovládať väčšinu zariadení, ktoré majú samostatné rozhranie API.
    sv_SE: Emulerar Philips Hue API till andra hemautomationsgateways som Amazon Echo/Dot Gen 1 (gen 2 har problem med att upptäcka ha-bridge) eller andra system som stöder Philips Hue. Bryggan hanterar grundläggande kommandon som på, av och ljusstyrkekommandon från Hue-protokollet. Denna brygga kan styra de flesta enheter som har ett separat API.
    tr_TR: Philips Hue API'sini Amazon Echo/Dot 1. Nesil (2. nesilde ha-bridge'i keşfetmede sorunlar var) veya Philips Hue'yu destekleyen diğer sistemler gibi diğer ev otomasyon ağ geçitlerine taklit eder. Köprü, Hue protokolünün Açma, Kapatma ve parlaklık komutları gibi temel komutlarını işler. Bu köprü, ayrı bir API'ye sahip çoğu cihazı kontrol edebilir.
    zh_CN: 模拟 Philips Hue API，连接家庭自动化设备。
    zh_TW: 模擬 Philips Hue API，連線家庭自動化裝置。
