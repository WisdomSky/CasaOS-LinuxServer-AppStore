name: linuxserver-netbox
services:
  app:
    image: linuxserver/netbox:4.7.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SUPERUSER_EMAIL: ''
      SUPERUSER_PASSWORD: ''
      ALLOWED_HOST: ''
      DB_NAME: ''
      DB_USER: ''
      DB_PASSWORD: ''
      DB_HOST: ''
      DB_PORT: ''
      REDIS_HOST: ''
      REDIS_PORT: ''
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      REDIS_DB_TASK: ''
      REDIS_DB_CACHE: ''
      BASE_PATH: ''
      CSRF_TRUSTED_ORIGINS: ''
      REMOTE_AUTH_ENABLED: ''
      REMOTE_AUTH_BACKEND: ''
      REMOTE_AUTH_HEADER: ''
      REMOTE_AUTH_AUTO_CREATE_USER: ''
      REMOTE_AUTH_DEFAULT_GROUPS: ''
      REMOTE_AUTH_DEFAULT_PERMISSIONS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: SUPERUSER_EMAIL
          description:
            en_US: Email address for admin account
        - container: SUPERUSER_PASSWORD
          description:
            en_US: Password for admin account
        - container: ALLOWED_HOST
          description:
            en_US: The hostname you will use to access the app (e.g., netbox.example.com)
        - container: DB_NAME
          description:
            en_US: 'Database name (default: netbox)'
        - container: DB_USER
          description:
            en_US: Database user
        - container: DB_PASSWORD
          description:
            en_US: Database password
        - container: DB_HOST
          description:
            en_US: 'Database host (default: postgres)'
        - container: DB_PORT
          description:
            en_US: 'Database port (default: 5432)'
        - container: REDIS_HOST
          description:
            en_US: 'Redis host (default: redis)'
        - container: REDIS_PORT
          description:
            en_US: 'Redis port number (default: 6379)'
        - container: REDIS_USERNAME
          description:
            en_US: 'Redis username (default: none)'
        - container: REDIS_PASSWORD
          description:
            en_US: 'Redis password (default: none)'
        - container: REDIS_DB_TASK
          description:
            en_US: 'Redis database ID for tasks (default: 0)'
        - container: REDIS_DB_CACHE
          description:
            en_US: 'Redis database ID for caching (default: 1)'
        - container: BASE_PATH
          description:
            en_US: 'The path you will use to access the app (i.e., /netbox, default: none) [OPTIONAL]'
        - container: CSRF_TRUSTED_ORIGINS
          description:
            en_US: 'List of comma-separated, single quoted, trusted origins. Must include protocol, and port if applicable (default: []) [OPTIONAL]'
        - container: REMOTE_AUTH_ENABLED
          description:
            en_US: 'Enable remote authentication (default: False) [OPTIONAL]'
        - container: REMOTE_AUTH_BACKEND
          description:
            en_US: 'Python path to the custom Django authentication backend to use for external user authentication (default: netbox.authentication.RemoteUserBackend) [OPTIONAL]'
        - container: REMOTE_AUTH_HEADER
          description:
            en_US: 'Name of the HTTP header which informs NetBox of the currently authenticated user. (default: HTTP_REMOTE_USER) [OPTIONAL]'
        - container: REMOTE_AUTH_AUTO_CREATE_USER
          description:
            en_US: 'If true, NetBox will automatically create local accounts for users authenticated via a remote service (default: False) [OPTIONAL]'
        - container: REMOTE_AUTH_DEFAULT_GROUPS
          description:
            en_US: 'The list of groups to assign a new user account when created using remote authentication (default: []) [OPTIONAL]'
        - container: REMOTE_AUTH_DEFAULT_PERMISSIONS
          description:
            en_US: 'A mapping of permissions to assign a new user account when created using remote authentication (default: {}) [OPTIONAL]'
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/netbox/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Netbox is an IP address management (IPAM) and data center infrastructure management (DCIM) tool. Initially conceived by the network engineering team at DigitalOcean, NetBox was developed specifically to address the needs of network and infrastructure engineers. It is intended to function as a domain-specific source of truth for network operations.
    ca_ES: Netbox és una eina de gestió d'adreces IP (IPAM) i de gestió d'infraestructures de centres de dades (DCIM). Inicialment concebuda per l'equip d'enginyeria de xarxes de DigitalOcean, NetBox es va desenvolupar específicament per satisfer les necessitats dels enginyers de xarxes i infraestructures. Està pensada per funcionar com una font de dades específica del domini per a les operacions de xarxa.
    cs_CZ: Netbox je nástroj pro správu IP adres (IPAM) a správu infrastruktury datových center (DCIM). NetBox, původně navržený týmem síťových inženýrů ve společnosti DigitalOcean, byl vyvinut speciálně pro potřeby síťových a infrastrukturních inženýrů. Má fungovat jako doménově specifický zdroj informací o síťovém provozu.
    da_DK: Netbox er et værktøj til IP-adressehåndtering (IPAM) og datacenterinfrastrukturhåndtering (DCIM). NetBox, der oprindeligt blev udtænkt af netværksingeniørteamet hos DigitalOcean, blev udviklet specifikt til at imødekomme behovene hos netværks- og infrastrukturingeniører. Det er beregnet til at fungere som en domænespecifik kilde til sandhed for netværksdrift.
    de_DE: Netbox ist ein Tool für IP-Adressmanagement (IPAM) und Rechenzentrumsinfrastrukturmanagement (DCIM). Ursprünglich vom Netzwerktechnik-Team von DigitalOcean konzipiert, wurde Netbox speziell für die Bedürfnisse von Netzwerk- und Infrastrukturingenieuren entwickelt. Es dient als domänenspezifische Datenquelle für den Netzwerkbetrieb.
    el_GR: Το Netbox είναι ένα εργαλείο διαχείρισης διευθύνσεων IP (IPAM) και διαχείρισης υποδομών κέντρων δεδομένων (DCIM). Αρχικά σχεδιασμένο από την ομάδα μηχανικών δικτύων της DigitalOcean, το NetBox αναπτύχθηκε ειδικά για να καλύψει τις ανάγκες των μηχανικών δικτύων και υποδομών. Προορίζεται να λειτουργήσει ως πηγή αλήθειας για τις λειτουργίες δικτύου, ειδικά για κάθε τομέα.
    en_GB: Netbox is an Ip address management (Ipam) and data centre infrastructure management (Dcim) tool. Initially conceived by the network engineering team at Digitalocean, Netbox was developed specifically to address the needs of network and infrastructure engineers. It is intended to function as a domain-specific source of truth for network operations.
    es_ES: Netbox es una herramienta de gestión de direcciones IP (IPAM) y gestión de infraestructura de centros de datos (DCIM). Concebida inicialmente por el equipo de ingeniería de redes de DigitalOcean, Netbox se desarrolló específicamente para satisfacer las necesidades de los ingenieros de redes e infraestructura. Su objetivo es funcionar como una fuente de información fidedigna y específica para las operaciones de red.
    fr_FR: Netbox est un outil de gestion des adresses IP (IPAM) et de l'infrastructure des centres de données (DCIM). Initialement conçu par l'équipe d'ingénierie réseau de DigitalOcean, Netbox a été développé spécifiquement pour répondre aux besoins des ingénieurs réseau et infrastructure. Il est conçu pour servir de source de référence unique et fiable pour les opérations réseau.
    ga_IE: Is uirlis bainistíochta seoltaí IP (IPAM) agus bainistíochta bonneagair ionad sonraí (DCIM) é Netbox. Ceapadh NetBox ar dtús ag an bhfoireann innealtóireachta líonra ag DigitalOcean, agus forbraíodh é go sonrach chun freastal ar riachtanais innealtóirí líonra agus bonneagair. Tá sé beartaithe feidhmiú mar fhoinse fírinne atá sainiúil don réimse le haghaidh oibríochtaí líonra.
    hr_HR: Netbox je alat za upravljanje IP adresama (IPAM) i infrastrukturom podatkovnih centara (DCIM). Izvorno ga je osmislio tim mrežnih inženjera u DigitalOceanu, a NetBox je razvijen posebno za potrebe mrežnih i infrastrukturnih inženjera. Namijenjen je funkcioniranju kao izvor istine za mrežne operacije specifičan za domenu.
    hu_HU: A Netbox egy IP-címkezelő (IPAM) és adatközpont-infrastruktúra-kezelő (DCIM) eszköz. A DigitalOcean hálózati mérnöki csapata által eredetileg megálmodott NetBoxot kifejezetten a hálózati és infrastruktúra-mérnökök igényeinek kielégítésére fejlesztették ki. Célja, hogy domain-specifikus információforrásként működjön a hálózati műveletekhez.
    it_IT: Netbox è uno strumento per la gestione degli indirizzi IP (IPAM) e la gestione dell'infrastruttura del data center (DCIM). Inizialmente concepito dal team di ingegneri di rete di DigitalOcean, Netbox è stato sviluppato specificamente per soddisfare le esigenze degli ingegneri di rete e di infrastruttura. Il suo scopo è quello di fungere da fonte di riferimento affidabile e specifica per le operazioni di rete.
    ja_JP: Netboxは、IPアドレス管理（IPAM）およびデータセンターインフラストラクチャ管理（DCIM）ツールです。DigitalOceanのネットワークエンジニアリングチームによって考案されたNetboxは、ネットワークおよびインフラストラクチャエンジニアのニーズに応えるために開発されました。ネットワーク運用におけるドメイン固有の信頼できる情報源として機能することを目的としています。
    ko_KR: Netbox는 IP 주소 관리(IPAM) 및 데이터 센터 인프라 관리(DCIM) 도구입니다. DigitalOcean의 네트워크 엔지니어링 팀에서 처음 구상한 Netbox는 네트워크 및 인프라 엔지니어의 요구 사항을 충족하기 위해 특별히 개발되었습니다. 네트워크 운영을 위한 도메인별 핵심 정보 소스 역할을 하도록 설계되었습니다.
    ml_IN: നെറ്റ്‌ബോക്‌സ് ഒരു ഐപി അഡ്രസ് മാനേജ്‌മെന്റ് (ഐപിഎഎം), ഡാറ്റാ സെന്റർ ഇൻഫ്രാസ്ട്രക്ചർ മാനേജ്‌മെന്റ് (ഡിസിഐഎം) ടൂളാണ്. ഡിജിറ്റൽ ഓഷ്യനിലെ നെറ്റ്‌വർക്ക് എഞ്ചിനീയറിംഗ് ടീം ആദ്യം വിഭാവനം ചെയ്ത നെറ്റ്‌ബോക്‌സ്, നെറ്റ്‌വർക്ക്, ഇൻഫ്രാസ്ട്രക്ചർ എഞ്ചിനീയർമാരുടെ ആവശ്യങ്ങൾ നിറവേറ്റുന്നതിനായി പ്രത്യേകം വികസിപ്പിച്ചെടുത്തതാണ്. നെറ്റ്‌വർക്ക് പ്രവർത്തനങ്ങൾക്കായി ഒരു ഡൊമെയ്ൻ-നിർദ്ദിഷ്ട സത്യ സ്രോതസ്സായി പ്രവർത്തിക്കാനാണ് ഇത് ഉദ്ദേശിക്കുന്നത്.
    nb_NO: Netbox er et verktøy for IP-adressehåndtering (IPAM) og datasenterinfrastrukturhåndtering (DCIM). NetBox ble opprinnelig unnfanget av nettverksingeniørteamet hos DigitalOcean, og ble utviklet spesielt for å imøtekomme behovene til nettverks- og infrastrukturingeniører. Det er ment å fungere som en domenespesifikk sannhetskilde for nettverksdrift.
    nl_NL: Netbox is een tool voor IP-adresbeheer (IPAM) en datacenterinfrastructuurbeheer (DCIM). Netbox is oorspronkelijk ontwikkeld door het netwerkengineeringteam van DigitalOcean, specifiek om te voldoen aan de behoeften van netwerk- en infrastructuurengineers. Het is bedoeld als een domeinspecifieke bron van waarheid voor netwerkoperaties.
    pl_PL: Netbox to narzędzie do zarządzania adresami IP (IPAM) i infrastrukturą centrum danych (DCIM). Pierwotnie opracowane przez zespół inżynierów sieciowych w DigitalOcean, NetBox zostało opracowane specjalnie z myślą o potrzebach inżynierów sieci i infrastruktury. Ma służyć jako domenowe źródło informacji o operacjach sieciowych.
    pt_BR: O Netbox é uma ferramenta de gerenciamento de endereços IP (IPAM) e gerenciamento de infraestrutura de data center (DCIM). Inicialmente concebido pela equipe de engenharia de redes da DigitalOcean, o Netbox foi desenvolvido especificamente para atender às necessidades de engenheiros de rede e infraestrutura. Ele foi projetado para funcionar como uma fonte de verdade específica para operações de rede.
    ro_RO: Netbox este un instrument de gestionare a adreselor IP (IPAM) și de gestionare a infrastructurii centrelor de date (DCIM). Conceput inițial de echipa de inginerie de rețea de la DigitalOcean, NetBox a fost dezvoltat special pentru a răspunde nevoilor inginerilor de rețea și infrastructură. Este destinat să funcționeze ca o sursă de adevăr specifică domeniului pentru operațiunile de rețea.
    ru_RU: Netbox — это инструмент управления IP-адресами (IPAM) и управления инфраструктурой центров обработки данных (DCIM). Первоначально разработанный командой сетевых инженеров DigitalOcean, NetBox был создан специально для удовлетворения потребностей сетевых инженеров и инженеров по инфраструктуре. Он предназначен для функционирования в качестве специализированного источника достоверной информации о сетевых операциях.
    sk_SK: Netbox je nástroj na správu IP adries (IPAM) a infraštruktúry dátových centier (DCIM). NetBox, pôvodne navrhnutý tímom sieťových inžinierov v spoločnosti DigitalOcean, bol vyvinutý špeciálne na riešenie potrieb sieťových a infraštruktúrnych inžinierov. Je určený na to, aby fungoval ako doménovo špecifický zdroj informácií o sieťových operáciách.
    sv_SE: Netbox är ett verktyg för IP-adresshantering (IPAM) och datacenterinfrastrukturhantering (DCIM). Ursprungligen utformat av nätverksingenjörsteamet på DigitalOcean, utvecklades NetBox specifikt för att tillgodose behoven hos nätverks- och infrastrukturingenjörer. Det är avsett att fungera som en domänspecifik sanningskälla för nätverksdrift.
    tr_TR: Netbox, bir IP adresi yönetimi (IPAM) ve veri merkezi altyapı yönetimi (DCIM) aracıdır. Başlangıçta DigitalOcean'daki ağ mühendisliği ekibi tarafından tasarlanan NetBox, özellikle ağ ve altyapı mühendislerinin ihtiyaçlarını karşılamak üzere geliştirilmiştir. Ağ işlemleri için alana özgü bir doğruluk kaynağı olarak işlev görmesi amaçlanmıştır.
    zh_CN: NetBox 是一个 IP 地址管理（IPAM）和数据中心基础设施管理（DCIM）工具。它最初由 DigitalOcean 的网络工程团队构思，专为网络和基础设施工程师的需求开发，旨在成为网络运维领域的权威数据源。
    zh_TW: NetBox 是一個 IP 地址管理（IPAM）和資料中心基礎設施管理（DCIM）工具。它最初由 DigitalOcean 的網路工程團隊構思，專為網路和基礎設施工程師的需求開發，旨在成為網路運維領域的權威資料來源。
