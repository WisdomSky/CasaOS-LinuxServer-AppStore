    ja_JP: IPアドレス管理（IPAM）およびデータセンターインフラストラクチャ管理（DCIM）ツール。当初はDigitalOceanのネットワークエンジニアリングチームによって構想され、ネットワークおよびインフラストラクチャエンジニアのニーズに対応するために開発されました。ネットワーク運用におけるドメイン固有の信頼できる情報源として機能することを目的としています。
    ko_KR: NetBox는 IP 주소 관리(IPAM) 및 데이터 센터 인프라 관리(DCIM) 도구입니다. DigitalOcean의 네트워크 엔지니어링 팀에서 처음 구상한 NetBox는 네트워크 및 인프라 엔지니어의 요구 사항을 충족하기 위해 특별히 개발되었습니다. 네트워크 운영을 위한 도메인별 핵심 정보 소스 역할을 하도록 설계되었습니다.
    ml_IN: ഒരു IP അഡ്രസ് മാനേജ്‌മെന്റ് (IPAM), ഡാറ്റാ സെന്റർ ഇൻഫ്രാസ്ട്രക്ചർ മാനേജ്‌മെന്റ് (DCIM) ടൂൾ. ഡിജിറ്റൽ ഓഷ്യനിലെ നെറ്റ്‌വർക്ക് എഞ്ചിനീയറിംഗ് ടീം ആദ്യം വിഭാവനം ചെയ്ത നെറ്റ്‌ബോക്‌സ്, നെറ്റ്‌വർക്ക്, ഇൻഫ്രാസ്ട്രക്ചർ എഞ്ചിനീയർമാരുടെ ആവശ്യങ്ങൾ നിറവേറ്റുന്നതിനായി പ്രത്യേകം വികസിപ്പിച്ചെടുത്തതാണ്. നെറ്റ്‌വർക്ക് പ്രവർത്തനങ്ങൾക്കായി ഒരു ഡൊമെയ്ൻ-നിർദ്ദിഷ്ട സത്യ സ്രോതസ്സായി പ്രവർത്തിക്കാനാണ് ഇത് ഉദ്ദേശിക്കുന്നത്.
    nb_NO: Et verktøy for IP-adressehåndtering (IPAM) og datasenterinfrastrukturhåndtering (DCIM). NetBox ble opprinnelig unnfanget av nettverksingeniørteamet hos DigitalOcean, og ble utviklet spesielt for å imøtekomme behovene til nettverks- og infrastrukturingeniører. Det er ment å fungere som en domenespesifikk sannhetskilde for nettverksdrift.
    nl_NL: Een tool voor IP-adresbeheer (IPAM) en datacenterinfrastructuurbeheer (DCIM). NetBox is oorspronkelijk bedacht door het netwerkengineeringteam van DigitalOcean en is specifiek ontwikkeld om te voldoen aan de behoeften van netwerk- en infrastructuurengineers. Het is bedoeld als een domeinspecifieke bron van waarheid voor netwerkoperaties.
    pl_PL: Narzędzie do zarządzania adresami IP (IPAM) i infrastrukturą centrum danych (DCIM). Pierwotnie opracowane przez zespół inżynierów sieciowych w DigitalOcean, NetBox zostało opracowane specjalnie z myślą o potrzebach inżynierów sieci i infrastruktury. Ma pełnić funkcję domenowego źródła informacji dla operacji sieciowych.
    pt_BR: Uma ferramenta de gerenciamento de endereços IP (IPAM) e gerenciamento de infraestrutura de data center (DCIM). Inicialmente concebida pela equipe de engenharia de redes da DigitalOcean, a NetBox foi desenvolvida especificamente para atender às necessidades de engenheiros de rede e infraestrutura. Ela foi projetada para funcionar como uma fonte de verdade específica para operações de rede.
    ro_RO: Un instrument de gestionare a adreselor IP (IPAM) și de gestionare a infrastructurii centrelor de date (DCIM). Conceput inițial de echipa de inginerie de rețea de la DigitalOcean, NetBox a fost dezvoltat special pentru a răspunde nevoilor inginerilor de rețea și infrastructură. Este destinat să funcționeze ca o sursă de adevăr specifică domeniului pentru operațiunile de rețea.
    ru_RU: Инструмент управления IP-адресами (IPAM) и управления инфраструктурой центров обработки данных (DCIM). Первоначально разработанный командой сетевых инженеров DigitalOcean, NetBox был создан специально для удовлетворения потребностей сетевых инженеров и инженеров по инфраструктуре. Он предназначен для функционирования в качестве специализированного источника достоверной информации о сетевых операциях.
    sk_SK: Nástroj na správu IP adries (IPAM) a infraštruktúry dátových centier (DCIM). NetBox, pôvodne navrhnutý tímom sieťových inžinierov v spoločnosti DigitalOcean, bol vyvinutý špeciálne na riešenie potrieb sieťových a infraštruktúrnych inžinierov. Je určený na to, aby fungoval ako doménovo špecifický zdroj informácií o sieťových operáciách.
    sv_SE: Ett verktyg för IP-adresshantering (IPAM) och datacenterinfrastrukturhantering (DCIM). NetBox, som ursprungligen utformades av nätverksingenjörsteamet på DigitalOcean, utvecklades specifikt för att tillgodose behoven hos nätverks- och infrastrukturingenjörer. Det är avsett att fungera som en domänspecifik sanningskälla för nätverksdrift.
    tr_TR: IP adresi yönetimi (IPAM) ve veri merkezi altyapı yönetimi (DCIM) aracı. Başlangıçta DigitalOcean'daki ağ mühendisliği ekibi tarafından tasarlanan NetBox, özellikle ağ ve altyapı mühendislerinin ihtiyaçlarını karşılamak üzere geliştirilmiştir. Ağ işlemleri için alana özgü bir doğruluk kaynağı olarak işlev görmesi amaçlanmıştır.
    zh_CN: 管理 IP 地址和数据中心基础设施。
    zh_TW: 管理 IP 地址和資料中心基礎設施。
