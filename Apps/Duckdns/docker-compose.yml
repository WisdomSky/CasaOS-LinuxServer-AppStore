name: linuxserver-duckdns
services:
  app:
    image: linuxserver/duckdns:version-73f1bc7d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SUBDOMAINS: ''
      TOKEN: ''
      UPDATE_IP: ''
      LOG_FILE: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here. [OPTIONAL]
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here. [OPTIONAL]
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list. [OPTIONAL]
        - container: SUBDOMAINS
          description:
            en_US: multiple subdomains allowed, comma separated, no spaces, if your domain is user.duckdns.org you put user, not a sub-subdomain
        - container: TOKEN
          description:
            en_US: DuckDNS token
        - container: UPDATE_IP
          description:
            en_US: Set to ipv6 or ipv4 to update  only your public IPv4/6 address. Set to both to update IPv6 and IPv4 address. This variable makes use of a third-party service. Omitting this variable uses DuckDNS for detection and only supports IPv4. both and ipv6 modes needs host networking. [OPTIONAL]
        - container: LOG_FILE
          description:
            en_US: Set to true to log to file (also need to map /config). [OPTIONAL]
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duckdns/config
        target: /config
      - type: bind
        source: /DATA/AppData/duckdns/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Duckdns is a free service which will point a DNS (sub domains of duckdns.org) to an IP of your choice. The service is completely free, and doesn't require reactivation or forum posts to maintain its existence.
    ca_ES: Duckdns és un servei gratuït que apuntarà un DNS (subdominis de duckdns.org) a una IP de la vostra elecció. El servei és completament gratuït i no requereix reactivació ni publicacions al fòrum per mantenir la seva existència.
    cs_CZ: Duckdns je bezplatná služba, která nasměruje DNS (subdomény duckdns.org) na vámi zvolenou IP adresu. Služba je zcela zdarma a pro svou existenci nevyžaduje reaktivaci ani příspěvky na fóru.
    da_DK: Duckdns er en gratis tjeneste, der peger en DNS (underdomæner til duckdns.org) til en IP-adresse efter eget valg. Tjenesten er helt gratis og kræver ikke genaktivering eller forumindlæg for at opretholde sin eksistens.
    de_DE: DuckDNS ist ein kostenloser Dienst, der einen DNS-Eintrag (Subdomains von duckdns.org) auf eine IP-Adresse Ihrer Wahl umleitet. Der Dienst ist komplett kostenlos und erfordert weder eine Reaktivierung noch Forenbeiträge, um aufrechtzuerhalten.
    el_GR: Το Duckdns είναι μια δωρεάν υπηρεσία που θα κατευθύνει ένα DNS (υποτομείς του duckdns.org) σε μια IP της επιλογής σας. Η υπηρεσία είναι εντελώς δωρεάν και δεν απαιτεί επανενεργοποίηση ή δημοσιεύσεις σε φόρουμ για να διατηρηθεί η ύπαρξή της.
    en_GB: Duckdns is a free service which will point a Dns (sub domains of duckdns.org) to an Ip of your choice. The service is completely free, and doesn't require reactivation or forum posts to maintain its existence.
    es_ES: DuckDNS es un servicio gratuito que redirige un servidor DNS (subdominios de duckdns.org) a la dirección IP que elijas. El servicio es completamente gratuito y no requiere reactivación ni publicaciones en foros para mantenerse activo.
    fr_FR: DuckDNS est un service gratuit qui permet de faire pointer un nom de domaine (sous-domaines de duckdns.org) vers une adresse IP de votre choix. Ce service est entièrement gratuit et ne nécessite aucune réactivation ni participation à un forum pour rester actif.
    ga_IE: Is seirbhís saor in aisce í Duckdns a dhíreoidh DNS (fo-fhearainn de duckdns.org) chuig IP de do rogha féin. Tá an tseirbhís go hiomlán saor in aisce, agus ní gá athghníomhachtú ná poist fóram a dhéanamh chun í a choinneáil ann.
    hr_HR: Duckdns je besplatna usluga koja će usmjeriti DNS (poddomene duckdns.org) na IP adresu po vašem izboru. Usluga je potpuno besplatna i ne zahtijeva ponovnu aktivaciju ili objave na forumu za održavanje svog postojanja.
    hu_HU: A Duckdns egy ingyenes szolgáltatás, amely a DNS-t (a duckdns.org aldomainjeit) egy általad választott IP-címre irányítja. A szolgáltatás teljesen ingyenes, és nem igényel újraaktiválást vagy fórumbejegyzéseket a fennmaradásához.
    it_IT: DuckDNS è un servizio gratuito che permette di reindirizzare un DNS (sottodominio di duckdns.org) a un indirizzo IP a tua scelta. Il servizio è completamente gratuito e non richiede riattivazione né interventi sul forum per mantenerlo attivo.
    ja_JP: Duckdnsは、DNSサーバー（duckdns.orgのサブドメイン）を任意のIPアドレスにマッピングする無料サービスです。このサービスは完全に無料で、継続利用のために再アクティベーションやフォーラムへの投稿などは一切必要ありません。
    ko_KR: DuckDNS는 사용자가 선택한 IP 주소로 DNS(duckdns.org의 하위 도메인)를 연결해주는 무료 서비스입니다. 이 서비스는 완전히 무료이며, 유지 관리를 위해 재활성화나 포럼 게시글 작성이 필요하지 않습니다.
    ml_IN: Duckdns എന്നത് നിങ്ങൾക്ക് ഇഷ്ടമുള്ള ഒരു IP വിലാസത്തിലേക്ക് DNS (duckdns.org-ന്റെ ഉപ ഡൊമെയ്‌നുകൾ) പോയിന്റ് ചെയ്യുന്ന ഒരു സൗജന്യ സേവനമാണ്. ഈ സേവനം പൂർണ്ണമായും സൗജന്യമാണ്, കൂടാതെ അതിന്റെ നിലനിൽപ്പ് നിലനിർത്താൻ വീണ്ടും സജീവമാക്കലോ ഫോറം പോസ്റ്റുകളോ ആവശ്യമില്ല.
    nb_NO: Duckdns er en gratis tjeneste som peker en DNS (underdomener til duckdns.org) til en IP-adresse du velger. Tjenesten er helt gratis og krever ikke reaktivering eller foruminnlegg for å opprettholde sin eksistens.
    nl_NL: Duckdns is een gratis dienst waarmee je een DNS-server (subdomeinen van duckdns.org) kunt koppelen aan een IP-adres naar keuze. De dienst is volledig gratis en vereist geen heractivering of forumreacties om te blijven bestaan.
    pl_PL: Duckdns to darmowa usługa, która przekieruje DNS (subdomeny duckdns.org) na wybrany adres IP. Usługa jest całkowicie darmowa i nie wymaga ponownej aktywacji ani wpisów na forum, aby utrzymać się na rynku.
    pt_BR: DuckDNS é um serviço gratuito que direciona um DNS (subdomínios de duckdns.org) para um endereço IP de sua escolha. O serviço é totalmente gratuito e não requer reativação ou postagens em fóruns para se manter ativo.
    ro_RO: Duckdns este un serviciu gratuit care va direcționa un DNS (subdomenii ale duckdns.org) către o adresă IP la alegere. Serviciul este complet gratuit și nu necesită reactivare sau postări pe forum pentru a-și menține existența.
    ru_RU: Duckdns — это бесплатный сервис, который направляет DNS-сервер (поддомены duckdns.org) на выбранный вами IP-адрес. Сервис полностью бесплатный и не требует повторной активации или сообщений на форуме для поддержания своей работы.
    sk_SK: Duckdns je bezplatná služba, ktorá nasmeruje DNS (subdomény duckdns.org) na vami zvolenú IP adresu. Služba je úplne bezplatná a na jej udržanie nie je potrebná reaktivácia ani príspevky na fóre.
    sv_SE: Duckdns är en gratistjänst som pekar en DNS (underdomäner till duckdns.org) till en IP-adress du väljer. Tjänsten är helt gratis och kräver inte återaktivering eller foruminlägg för att fortsätta existera.
    tr_TR: Duckdns, bir DNS adresini (duckdns.org'un alt alan adları) seçtiğiniz bir IP adresine yönlendiren ücretsiz bir hizmettir. Hizmet tamamen ücretsizdir ve varlığını sürdürmesi için yeniden etkinleştirme veya forum gönderisi gerektirmez.
    zh_CN: DuckDNS 是一项免费服务，可将 duckdns.org 的子域名指向你选择的 IP 地址。服务完全免费，无需定期重新激活或通过论坛发帖来维持使用。
    zh_TW: DuckDNS 是一項免費服務，可將 duckdns.org 的子域名指向你選擇的 IP 地址。服務完全免費，無需定期重新啟用或透過論壇發帖來維持使用。
