name: linuxserver-keepassxc
services:
  app:
    image: linuxserver/keepassxc:2.7.12
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: KeePassXC is a free and open-source password manager. It started as a community fork of KeePassX (itself a cross-platform port of KeePass).
    zh_CN: KeePassXC 是一款免费的开源密码管理器，最初是 KeePassX 的社区分支，而 KeePassX 本身是 KeePass 的跨平台移植版。
  tagline:
    en_US: A free and open-source password manager. It started as a community fork of KeePassX (itself a cross-platform port of KeePass).
    zh_CN: 免费的开源跨平台密码管理器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/keepassxc-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/keepassxc-logo.png
  title:
    en_US: Keepassxc (LinuxServer.io)
    zh_CN: Keepassxc（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverkeepassxc
  port_map: '3000'
  version: 2.7.12
