    nb_NO: LM Studio kan kjøre lokale AI-modeller som gpt-oss, Llama, Gemma, Qwen og DeepSeek privat på datamaskinen din.
    nl_NL: Met LM Studio kunt u lokale AI-modellen zoals gpt-oss, Llama, Gemma, Qwen en DeepSeek privé op uw computer uitvoeren.
    pl_PL: LM Studio może uruchamiać lokalne modele sztucznej inteligencji, takie jak gpt-oss, Llama, Gemma, Qwen i DeepSeek, w trybie prywatnym na Twoim komputerze.
    pt_BR: O LM Studio pode executar modelos de IA locais, como gpt-oss, Llama, Gemma, Qwen e DeepSeek, de forma privada no seu computador.
    ro_RO: LM Studio poate rula modele locale de inteligență artificială precum gpt-oss, Llama, Gemma, Qwen și DeepSeek în mod privat pe computerul tău.
    ru_RU: LM Studio может запускать локальные модели искусственного интеллекта, такие как gpt-oss, Llama, Gemma, Qwen и DeepSeek, в приватном режиме на вашем компьютере.
    sk_SK: LM Studio dokáže súkromne spúšťať lokálne modely umelej inteligencie, ako napríklad gpt-oss, Llama, Gemma, Qwen a DeepSeek, na vašom počítači.
    sv_SE: LM Studio kan köra lokala AI-modeller som gpt-oss, Llama, Gemma, Qwen och DeepSeek privat på din dator.
    tr_TR: LM Studio, gpt-oss, Llama, Gemma, Qwen ve DeepSeek gibi yerel yapay zeka modellerini bilgisayarınızda özel olarak çalıştırabilir.
    zh_CN: LM Studio 可在你的电脑上私密运行 gpt-oss、Llama、Gemma、Qwen 和 DeepSeek 等本地 AI 模型。
    zh_TW: LM Studio 可在你的電腦上私密執行 gpt-oss、Llama、Gemma、Qwen 和 DeepSeek 等本地 AI 模型。
