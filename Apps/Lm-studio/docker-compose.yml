name: linuxserver-lm-studio
services:
  app:
    image: linuxserver/lm-studio:version-2026-09-12
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lm-studio/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: LM Studio can run local AI models like gpt-oss, Llama, Gemma, Qwen, and DeepSeek privately on your computer.
    ca_ES: LM Studio pot executar models d'IA locals com ara gpt-oss, Llama, Gemma, Qwen i DeepSeek de forma privada al vostre ordinador.
    cs_CZ: LM Studio dokáže soukromě na vašem počítači spouštět lokální modely umělé inteligence, jako jsou gpt-oss, Llama, Gemma, Qwen a DeepSeek.
    da_DK: LM Studio kan køre lokale AI-modeller som gpt-oss, Llama, Gemma, Qwen og DeepSeek privat på din computer.
    de_DE: LM Studio kann lokale KI-Modelle wie gpt-oss, Llama, Gemma, Qwen und DeepSeek privat auf Ihrem Computer ausführen.
    el_GR: Το LM Studio μπορεί να εκτελέσει τοπικά μοντέλα τεχνητής νοημοσύνης όπως gpt-oss, Llama, Gemma, Qwen και DeepSeek ιδιωτικά στον υπολογιστή σας.
    en_GB: Lm Studio can run local Ai models like gpt-oss, Llama, Gemma, Qwen, and Deepseek privately on your computer.
    es_ES: LM Studio puede ejecutar modelos de IA locales como gpt-oss, Llama, Gemma, Qwen y DeepSeek de forma privada en su ordenador.
    fr_FR: LM Studio peut exécuter des modèles d'IA locaux tels que gpt-oss, Llama, Gemma, Qwen et DeepSeek en toute confidentialité sur votre ordinateur.
    ga_IE: Is féidir le LM Studio samhlacha áitiúla AI ar nós gpt-oss, Llama, Gemma, Qwen, agus DeepSeek a rith go príobháideach ar do ríomhaire.
    hr_HR: LM Studio može privatno na vašem računalu pokretati lokalne AI modele poput gpt-oss, Llama, Gemma, Qwen i DeepSeek.
    hu_HU: Az LM Studio képes helyi MI-modelleket, például gpt-oss-t, Llama-t, Gemma-t, Qwen-t és DeepSeek-et privát módon futtatni a számítógépeden.
    it_IT: LM Studio consente di eseguire modelli di intelligenza artificiale locali come gpt-oss, Llama, Gemma, Qwen e DeepSeek in privato sul tuo computer.
    ja_JP: LM Studioは、gpt-oss、Llama、Gemma、Qwen、DeepSeekなどのローカルAIモデルを、お使いのコンピュータ上でプライベートに実行できます。
    ko_KR: LM Studio는 gpt-oss, Llama, Gemma, Qwen, DeepSeek과 같은 로컬 AI 모델을 사용자의 컴퓨터에서 비공개로 실행할 수 있습니다.
