name: linuxserver-chromium
services:
  app:
    image: linuxserver/chromium:version-7ac003b2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: CHROME_CLI
          description:
            en_US: Specify one or multiple Chromium CLI flags, this string will be passed to the application in full. [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/chromium/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Chromium is an open-source browser project that aims to build a safer, faster, and more stable way for all users to experience the web.
    zh_CN: Chromium 是一个开源浏览器项目，旨在为所有用户提供更安全、更快速、更稳定的网页浏览体验。
  tagline:
    en_US: An open-source browser project that aims to build a safer, faster, and more stable way for all users to experience the web.
    zh_CN: 致力于安全、快速和稳定上网体验的开源浏览器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/chromium-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/chromium-logo.png
  title:
    en_US: Chromium (LinuxServer.io)
    zh_CN: Chromium（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverchromium
  port_map: '3000'
  version: version-7ac003b2
