    pt_BR: Um ambiente de desenvolvimento integrado baseado na web, construído com Node.js como backend e com um frontend JavaScript/HTML5 superpotente, licenciado sob a GPL versão 3. Este projeto tem origem no projeto Cloud9 v2.
    ro_RO: Un mediu de dezvoltare integrat bazat pe web, construit cu Node.Js ca backend și cu un frontend JavaScript/HTML5 supraalimentat, licențiat sub GPL versiunea 3. Acest proiect își are originea în proiectul Cloud9 v2.
    ru_RU: Интегрированная среда разработки на основе веб-технологий, созданная с использованием Node.js в качестве бэкенда и мощного фронтенда на JavaScript/HTML5, распространяемая по лицензии GPL версии 3. Этот проект является частью проекта Cloud9 v2.
    sk_SK: Webové integrované vývojové prostredie vybudované s Node.Js ako backendom a s vylepšeným frontendom JavaScript/HTML5, licencované pod GPL verziou 3. Tento projekt vychádza z projektu Cloud9 v2.
    sv_SE: En webbaserad integrerad utvecklingsmiljö byggd med Node. Js som backend och med ett superladdat JavaScript/HTML5-gränssnitt, licensierad under GPL version 3. Detta projekt har sitt ursprung i Cloud9 v2-projektet.
    tr_TR: Node.js'nin arka uç olarak ve JavaScript/HTML5'in gelişmiş ön uç olarak kullanıldığı, GPL sürüm 3 lisansı altında geliştirilmiş web tabanlı entegre bir geliştirme ortamı. Bu proje Cloud9 v2 projesinden türemiştir.
