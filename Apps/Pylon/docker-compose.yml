name: linuxserver-pylon
services:
  app:
    image: linuxserver/pylon:2.10.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      GITURL: ''
      PYUSER: ''
      PYPASS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: GITURL
          description:
            en_US: Specify a git repo to checkout on first startup
        - container: PYUSER
          description:
            en_US: Specify a basic auth user.
        - container: PYPASS
          description:
            en_US: Specify a basic auth password.
      volumes:
        - container: /code
          description:
            en_US: if you want to mount up a local folder of code instead of checking out a Git URL specify its location here.  Find it at /code
      ports:
        - container: '3131'
          description:
            en_US: Webui - Default 3131
    ports:
      - target: 3131
        published: 3131
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pylon/config
        target: /config
      - type: bind
        source: /DATA/AppData/pylon/code
        target: /code
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
