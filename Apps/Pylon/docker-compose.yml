    hu_HU: Egy web alapú integrált fejlesztői környezet, amely Node.Js backenddel és felturbózott JavaScript/HTML5 frontenddel készült, GPL 3-as verziójú licenc alatt. Ez a projekt a Cloud9 v2 projektből származik.
    it_IT: Un ambiente di sviluppo integrato basato sul web, realizzato con Node.js come backend e un frontend JavaScript/HTML5 potenziato, con licenza GPL versione 3. Questo progetto deriva dal progetto Cloud9 v2.
    ja_JP: Node.jsをバックエンドに、JavaScript/HTML5をフロントエンドに採用した、ウェブベースの統合開発環境です。GPLバージョン3ライセンスで提供されています。このプロジェクトはCloud9 v2プロジェクトから派生したものです。
    ko_KR: Node.js를 백엔드로, 강력한 JavaScript/HTML5 프런트엔드를 갖춘 웹 기반 통합 개발 환경으로, GPL 버전 3 라이선스가 적용됩니다. 이 프로젝트는 Cloud9 v2 프로젝트에서 파생되었습니다.
    ml_IN: Node. Js ബാക്കെൻഡായും സൂപ്പർചാർജ്ഡ് JavaScript/HTML5 ഫ്രണ്ട്‌എൻഡുമായും നിർമ്മിച്ച ഒരു വെബ് അധിഷ്ഠിത സംയോജിത വികസന പരിസ്ഥിതി, GPL പതിപ്പ് 3 പ്രകാരം ലൈസൻസ് ചെയ്‌തിരിക്കുന്നു. ഈ പ്രോജക്റ്റ് Cloud9 v2 പ്രോജക്റ്റിൽ നിന്നാണ് ഉത്ഭവിക്കുന്നത്.
