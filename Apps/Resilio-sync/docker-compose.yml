    pt_BR: (Anteriormente BitTorrent Sync) usa o protocolo BitTorrent para sincronizar arquivos e pastas entre todos os seus dispositivos. Existem versões gratuitas e pagas, e este contêiner é compatível com ambas. Existe uma imagem de sincronização oficial, mas criamos esta porque ela oferece suporte ao mapeamento de usuários para simplificar as permissões de volumes.
    ro_RO: (anterior BitTorrent Sync) folosește protocolul BitTorrent pentru a sincroniza fișiere și foldere între toate dispozitivele tale. Există atât versiuni gratuite, cât și versiuni plătite, iar acest container le acceptă pe ambele. Există o imagine oficială de sincronizare, dar am creat-o pe aceasta deoarece acceptă maparea utilizatorilor pentru a simplifica permisiunile pentru volume.
    ru_RU: (ранее BitTorrent Sync) использует протокол BitTorrent для синхронизации файлов и папок между всеми вашими устройствами. Существуют как бесплатная, так и платная версии, и этот контейнер поддерживает обе. Существует официальный образ для синхронизации, но мы создали этот, поскольку он поддерживает сопоставление пользователей для упрощения разрешений для томов.
    sk_SK: (predtým BitTorrent Sync) používa protokol BitTorrent na synchronizáciu súborov a priečinkov medzi všetkými vašimi zariadeniami. Existujú bezplatné aj platené verzie, tento kontajner podporuje obe. Existuje oficiálny synchronizačný obraz, ale tento sme vytvorili, pretože podporuje mapovanie používateľov pre zjednodušenie oprávnení pre zväzky.
    sv_SE: (tidigare BitTorrent Sync) använder BitTorrent-protokollet för att synkronisera filer och mappar mellan alla dina enheter. Det finns både gratis- och betalversioner, och den här containern stöder båda. Det finns en officiell synkroniseringsavbildning, men vi skapade den här eftersom den stöder användarmappning för att förenkla behörigheter för volymer.
    tr_TR: (Eski adıyla BitTorrent Sync), tüm cihazlarınız arasında dosya ve klasörleri senkronize etmek için BitTorrent protokolünü kullanır. Hem ücretsiz hem de ücretli sürümleri mevcuttur ve bu konteyner her ikisini de destekler. Resmi bir senkronizasyon imajı olsa da, bu imajı oluşturduk çünkü kullanıcı eşlemesini destekleyerek birimler için izinleri basitleştiriyor.
    zh_CN: 使用 BitTorrent 协议同步设备间的文件。
    zh_TW: 使用 BitTorrent 協議同步裝置間的檔案。
