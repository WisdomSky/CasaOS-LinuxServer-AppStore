name: linuxserver-faster-whisper
services:
  app:
    image: linuxserver/faster-whisper:3.8.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DEBUG: ''
      LOCAL_ONLY: ''
      WHISPER_BEAM: ''
      WHISPER_LANG: ''
      WHISPER_MODEL: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: DEBUG
          description:
            en_US: If set to true, or any other value, the container will output debug logs. [OPTIONAL]
        - container: LOCAL_ONLY
          description:
            en_US: If set to true, or any other value, the container will not attempt to download models from HuggingFace and will only use locally-provided models. [OPTIONAL]
        - container: WHISPER_BEAM
          description:
            en_US: Number of candidates to consider simultaneously during transcription. [OPTIONAL]
        - container: WHISPER_LANG
          description:
            en_US: Two character code for the language that you will speak to the add-on. [OPTIONAL]
        - container: WHISPER_MODEL
          description:
            en_US: Whisper model that will be used for transcription. From here. [OPTIONAL]
    ports:
      - target: 10300
        published: 10300
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/faster-whisper/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Faster-whisper is a reimplementation of OpenAI's Whisper model using CTranslate2, which is a fast inference engine for Transformer models. This container provides a Wyoming protocol server for faster-whisper.
    ca_ES: Faster-whisper és una reimplementació del model Whisper d'OpenAI utilitzant CTranslate2, que és un motor d'inferència ràpid per a models de Transformer. Aquest contenidor proporciona un servidor de protocol Wyoming per a faster-whisper.
    cs_CZ: Faster-whisper je reimplementace modelu Whisper od OpenAI s využitím CTranslate2, což je rychlý inferenční engine pro modely Transformer. Tento kontejner poskytuje server protokolu Wyoming pro faster-whisper.
    da_DK: Faster-whisper er en genimplementering af OpenAIs Whisper-model ved hjælp af CTranslate2, som er en hurtig inferensmotor til Transformer-modeller. Denne container leverer en Wyoming-protokolserver til hurtigere hvisken.
    de_DE: Faster-Whisper ist eine Neuimplementierung des Whisper-Modells von OpenAI unter Verwendung von CTranslate2, einer schnellen Inferenz-Engine für Transformer-Modelle. Dieser Container stellt einen Wyoming-Protokollserver für Faster-Whisper bereit.
    el_GR: Το Faster-whisper είναι μια επανεφαρμογή του μοντέλου Whisper της OpenAI χρησιμοποιώντας το CTranslate2, το οποίο είναι μια μηχανή γρήγορης συμπερασματολογίας για μοντέλα Transformer. Αυτό το κοντέινερ παρέχει έναν διακομιστή πρωτοκόλλου Wyoming για το faster-whisper.
    en_GB: Faster-whisper is a reimplementation of Openai's Whisper model using CTranslate2, which is a fast inference engine for Transformer models. This container provides a Wyoming protocol server for faster-whisper.
    es_ES: Faster-whisper es una reimplementación del modelo Whisper de OpenAI que utiliza CTranslate2, un motor de inferencia rápido para modelos Transformer. Este contenedor proporciona un servidor con protocolo Wyoming para Faster-whisper.
    fr_FR: Faster-whisper est une réimplémentation du modèle Whisper d'OpenAI utilisant CTranslate2, un moteur d'inférence rapide pour les modèles Transformer. Ce conteneur fournit un serveur de protocole Wyoming pour Faster-whisper.
    ga_IE: Is athchur i bhfeidhm ar mhúnla Whisper OpenAI é Faster-whisper ag baint úsáide as CTranslate2, arb é inneall inference tapa é do mhúnlaí Transformer. Soláthraíonn an coimeádán seo freastalaí prótacail Wyoming le haghaidh cogarnaíochta níos tapúla.
    hr_HR: Faster-whisper je reimplementacija OpenAI-jevog Whisper modela korištenjem CTranslate2, koji je mehanizam za brzo zaključivanje za Transformer modele. Ovaj kontejner pruža Wyoming protokol poslužitelj za faster-whisper.
    hu_HU: A Faster-whisper az OpenAI Whisper modelljének egy újraimplementációja a CTranslate2 használatával, amely egy gyors következtetőmotor Transformer modellekhez. Ez a konténer egy Wyoming protokoll szervert biztosít a Faster-whisperhez.
    it_IT: Faster-whisper è una reimplementazione del modello Whisper di OpenAI che utilizza CTranslate2, un motore di inferenza veloce per i modelli Transformer. Questo container fornisce un server di protocollo Wyoming per Faster-whisper.
    ja_JP: Faster-whisperは、OpenAIのWhisperモデルをCTranslate2（Transformerモデル向けの高速推論エンジン）を使用して再実装したものです。このコンテナは、faster-whisper用のWyomingプロトコルサーバーを提供します。
    ko_KR: Faster-whisper는 CTranslate2를 사용하여 OpenAI의 Whisper 모델을 재구현한 것으로, CTranslate2는 Transformer 모델을 위한 빠른 추론 엔진입니다. 이 컨테이너는 Faster-whisper를 위한 Wyoming 프로토콜 서버를 제공합니다.
    ml_IN: ട്രാൻസ്‌ഫോർമർ മോഡലുകൾക്കായുള്ള ഒരു ഫാസ്റ്റ് ഇൻഫെറേഷൻ എഞ്ചിനായ CTranslate2 ഉപയോഗിച്ചുള്ള OpenAI യുടെ വിസ്പർ മോഡലിന്റെ പുനർനിർമ്മാണമാണ് ഫാസ്റ്റർ-വിസ്പർ. ഈ കണ്ടെയ്‌നർ ഫാസ്റ്റർ-വിസ്പറിനായി ഒരു വ്യോമിംഗ് പ്രോട്ടോക്കോൾ സെർവർ നൽകുന്നു.
    nb_NO: Faster-whisper er en ny implementering av OpenAIs Whisper-modell ved bruk av CTranslate2, som er en rask inferensmotor for Transformer-modeller. Denne containeren tilbyr en Wyoming-protokollserver for raskere hvisking.
    nl_NL: Faster-whisper is een herimplementatie van OpenAI's Whisper-model met behulp van CTranslate2, een snelle inferentie-engine voor Transformer-modellen. Deze container biedt een Wyoming-protocolserver voor Faster-whisper.
    pl_PL: Faster-Whisper to reimplementacja modelu Whisper firmy OpenAI z wykorzystaniem CTranslate2, szybkiego silnika inferencyjnego dla modeli Transformer. Ten kontener udostępnia serwer protokołu Wyoming dla Faster-Whisper.
    pt_BR: Faster-whisper é uma reimplementação do modelo Whisper da OpenAI usando o CTranslate2, um mecanismo de inferência rápido para modelos Transformer. Este contêiner fornece um servidor de protocolo Wyoming para o Faster-whisper.
    ro_RO: Faster-whisper este o reimplementare a modelului Whisper al OpenAI folosind CTranslate2, care este un motor de inferență rapid pentru modelele Transformer. Acest container oferă un server de protocol Wyoming pentru faster-whisper.
    ru_RU: Faster-whisper — это переработанная версия модели Whisper от OpenAI с использованием CTranslate2, быстрого механизма вывода для моделей Transformer. Этот контейнер предоставляет сервер протокола Wyoming для Faster-whisper.
    sk_SK: Faster-whisper je reimplementácia modelu Whisper od OpenAI pomocou CTranslate2, čo je rýchly inferenčný engine pre modely Transformer. Tento kontajner poskytuje server protokolu Wyoming pre faster-whisper.
    sv_SE: Faster-whisper är en omimplementering av OpenAI:s Whisper-modell med hjälp av CTranslate2, en snabb inferensmotor för Transformer-modeller. Denna container tillhandahåller en Wyoming-protokollserver för snabbare whisper.
    tr_TR: Faster-whisper, Transformer modelleri için hızlı bir çıkarım motoru olan CTranslate2 kullanılarak OpenAI'nin Whisper modelinin yeniden uygulanmış halidir. Bu konteyner, faster-whisper için bir Wyoming protokol sunucusu sağlar.
    zh_CN: Faster-whisper 使用 CTranslate2 重新实现 OpenAI 的 Whisper 模型；CTranslate2 是面向 Transformer 模型的快速推理引擎。此容器为 faster-whisper 提供 Wyoming 协议服务器。
