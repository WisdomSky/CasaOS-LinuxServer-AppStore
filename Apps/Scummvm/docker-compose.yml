    ja_JP: データファイルが既にあれば、特定の古典的なグラフィックアドベンチャーゲームやロールプレイングゲームを実行できるプログラムです。このプログラムの巧妙な点は、ScummVMがゲームに同梱されている実行ファイルを置き換えるだけで、本来想定されていなかったシステムでもゲームをプレイできるようにすることです。ScummVMはこれらのゲームの実行ファイルを完全に書き換えたものであり、エミュレータではありません。
    ko_KR: ScummVM은 데이터 파일만 있으면 특정 고전 그래픽 어드벤처 및 롤플레잉 게임을 실행할 수 있게 해주는 프로그램입니다. 이 프로그램의 핵심은 게임과 함께 제공되는 실행 파일을 완전히 새로 작성하여, 원래 게임 개발사에서 설계하지 않은 시스템에서도 플레이할 수 있도록 해준다는 점입니다. ScummVM은 에뮬레이터가 아니라 게임 실행 파일을 완전히 재작성한 것입니다.
    ml_IN: 'നിങ്ങളുടെ കൈവശം ഇതിനകം തന്നെ ചില ക്ലാസിക് ഗ്രാഫിക്കൽ അഡ്വഞ്ചർ, റോൾ-പ്ലേയിംഗ് ഗെയിമുകൾ പ്രവർത്തിപ്പിക്കാൻ നിങ്ങളെ അനുവദിക്കുന്ന ഒരു പ്രോഗ്രാം, അവയുടെ ഡാറ്റ ഫയലുകൾ ഇതിനകം തന്നെ ഉണ്ടെങ്കിൽ. ഇതിനെക്കുറിച്ചുള്ള ബുദ്ധിപരമായ ഭാഗം: ScummVM ഗെയിമുകൾക്കൊപ്പം വിതരണം ചെയ്ത എക്സിക്യൂട്ടബിളുകൾ മാറ്റിസ്ഥാപിക്കുന്നു, അവ ഒരിക്കലും രൂപകൽപ്പന ചെയ്തിട്ടില്ലാത്ത സിസ്റ്റങ്ങളിൽ അവ കളിക്കാൻ നിങ്ങളെ അനുവദിക്കുന്നു. ScummVM ഈ ഗെയിമുകളുടെ എക്സിക്യൂട്ടബിളുകളുടെ പൂർണ്ണമായ പുനരാലേഖനമാണ്, ഇത് ഒരു എമുലേറ്ററല്ല.'
    nb_NO: 'Et program som lar deg kjøre visse klassiske grafiske eventyr- og rollespill, forutsatt at du allerede har datafilene deres. Det smarte med dette: ScummVM erstatter bare de kjørbare filene som følger med spillene, slik at du kan spille dem på systemer de aldri ble designet for. ScummVM er en fullstendig omskriving av disse spillenes kjørbare filer og er ikke en emulator.'
    nl_NL: Een programma waarmee je bepaalde klassieke grafische avonturen- en rollenspellen kunt spelen, mits je de bijbehorende databestanden al hebt. Het slimme eraan is dat ScummVM simpelweg de uitvoerbare bestanden van de spellen vervangt, waardoor je ze kunt spelen op systemen waarvoor ze nooit ontworpen zijn. ScummVM is een volledig herschreven versie van de uitvoerbare bestanden van deze spellen en is geen emulator.
    pl_PL: Program umożliwiający uruchamianie niektórych klasycznych graficznych gier przygodowych i RPG, pod warunkiem posiadania plików danych. Sprytne w tym wszystkim jest to, że ScummVM po prostu zastępuje pliki wykonywalne dołączone do gier, umożliwiając grę na systemach, dla których nigdy nie zostały zaprojektowane. ScummVM to całkowicie przerobiony plik wykonywalny tych gier i nie jest emulatorem.
    pt_BR: Um programa que permite executar certos jogos clássicos de aventura gráfica e RPG, desde que você já possua os arquivos de dados. A genialidade do programa reside no fato de que o ScummVM simplesmente substitui os executáveis originais dos jogos, permitindo jogá-los em sistemas para os quais eles nunca foram projetados. O ScummVM é uma reescrita completa dos executáveis desses jogos e não um emulador.
    ro_RO: Un program care îți permite să rulezi anumite jocuri clasice de aventură grafică și jocuri de rol, cu condiția să ai deja fișierele lor de date. Partea ingenioasă este că ScummVM pur și simplu înlocuiește executabilele livrate împreună cu jocurile, permițându-ți să le joci pe sisteme pentru care nu au fost niciodată proiectate. ScummVM este o rescriere completă a executabilelor acestor jocuri și nu este un emulator.
    ru_RU: 'Программа, позволяющая запускать некоторые классические графические приключенческие и ролевые игры, при условии наличия у вас их файлов данных. Самое интересное: ScummVM просто заменяет исполняемые файлы, поставляемые с играми, позволяя играть в них на системах, для которых они изначально не были предназначены. ScummVM — это полная переработка исполняемых файлов этих игр, а не эмулятор.'
    sk_SK: 'Program, ktorý vám umožňuje spúšťať určité klasické grafické adventúry a hry na hrdinov, za predpokladu, že už máte ich dátové súbory. Dômyselná časť: ScummVM iba nahrádza spustiteľné súbory dodávané s hrami, čo vám umožňuje hrať ich na systémoch, pre ktoré nikdy neboli navrhnuté. ScummVM je kompletným prepísaním spustiteľných súborov týchto hier a nie je emulátorom.'
    sv_SE: 'Ett program som låter dig köra vissa klassiska grafiska äventyrs- och rollspel, förutsatt att du redan har deras datafiler. Det smarta med detta: ScummVM ersätter helt enkelt de körbara filer som medföljer spelen, vilket gör att du kan spela dem på system som de aldrig designades för. ScummVM är en fullständig omskrivning av dessa spels körbara filer och är inte en emulator.'
    tr_TR: 'ScummVM, oyun dosyalarına zaten sahip olmanız koşuluyla, bazı klasik grafiksel macera ve rol yapma oyunlarını çalıştırmanıza olanak tanıyan bir programdır. İşin zekice yanı şu: ScummVM, oyunlarla birlikte gelen yürütülebilir dosyaları değiştirerek, oyunların asla tasarlanmadığı sistemlerde oynamanıza olanak tanır. ScummVM, bu oyunların yürütülebilir dosyalarının tamamen yeniden yazılmış bir versiyonudur ve bir emülatör değildir.'
    zh_CN: 在现代系统上运行经典冒险和角色扮演游戏。
    zh_TW: 在現代系統上執行經典冒險和角色扮演遊戲。
