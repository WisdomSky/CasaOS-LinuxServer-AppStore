name: linuxserver-scummvm
services:
  app:
    image: linuxserver/scummvm:2026.3.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: 'ScummVM is a program which allows you to run certain classic graphical adventure and role-playing games, provided you already have their data files. The clever part about this: ScummVM just replaces the executables shipped with the games, allowing you to play them on systems for which they were never designed! ScummVM is a complete rewrite of these games'' executables and is not an emulator.'
    ca_ES: 'ScummVM és un programa que permet executar certs jocs clàssics d''aventura gràfica i de rol, sempre que ja tingueu els seus fitxers de dades. La part enginyosa d''això: ScummVM simplement substitueix els executables que s''inclouen amb els jocs, cosa que us permet jugar-hi en sistemes per als quals mai van ser dissenyats! ScummVM és una reescriptura completa dels executables d''aquests jocs i no és un emulador.'
    cs_CZ: 'ScummVM je program, který vám umožňuje spustit některé klasické grafické adventury a RPG hry, pokud již máte jejich datové soubory. Chytrá část: ScummVM pouze nahrazuje spustitelné soubory dodávané s hrami, což vám umožňuje hrát je na systémech, pro které nikdy nebyly navrženy! ScummVM je kompletní přepis spustitelných souborů těchto her a není emulátorem.'
    da_DK: 'ScummVM er et program, der giver dig mulighed for at køre visse klassiske grafiske eventyr- og rollespil, forudsat at du allerede har deres datafiler. Det smarte ved dette: ScummVM erstatter blot de eksekverbare filer, der følger med spillene, så du kan spille dem på systemer, som de aldrig blev designet til! ScummVM er en komplet omskrivning af disse spils eksekverbare filer og er ikke en emulator.'
    de_DE: 'ScummVM ist ein Programm, mit dem man bestimmte klassische Grafik-Adventures und Rollenspiele spielen kann, sofern man die Spieldateien besitzt. Der Clou dabei: ScummVM ersetzt einfach die mit den Spielen mitgelieferten ausführbaren Dateien und ermöglicht so das Spielen auf Systemen, für die sie nie entwickelt wurden! ScummVM ist eine komplette Neuentwicklung der ausführbaren Dateien dieser Spiele und kein Emulator.'
    el_GR: 'Το ScummVM είναι ένα πρόγραμμα που σας επιτρέπει να εκτελείτε ορισμένα κλασικά γραφικά παιχνίδια περιπέτειας και ρόλων, υπό την προϋπόθεση ότι έχετε ήδη τα αρχεία δεδομένων τους. Το έξυπνο μέρος σε αυτό: Το ScummVM απλώς αντικαθιστά τα εκτελέσιμα αρχεία που συνοδεύουν τα παιχνίδια, επιτρέποντάς σας να τα παίξετε σε συστήματα για τα οποία δεν σχεδιάστηκαν ποτέ! Το ScummVM είναι μια πλήρης επανεγγραφή των εκτελέσιμων αρχείων αυτών των παιχνιδιών και δεν είναι εξομοιωτής.'
    en_GB: 'Scummvm is a program which allows you to run certain classic graphical adventure and role-playing games, provided you already have their data files. The clever part about this: Scummvm just replaces the executables shipped with the games, allowing you to play them on systems for which they were never designed! Scummvm is a complete rewrite of these games'' executables and is not an emulator.'
    es_ES: ScummVM es un programa que te permite ejecutar ciertos juegos clásicos de aventuras gráficas y rol, siempre que ya tengas sus archivos de datos. Lo ingenioso es que ScummVM simplemente reemplaza los ejecutables que vienen con los juegos, ¡permitiéndote jugarlos en sistemas para los que nunca fueron diseñados! ScummVM es una reescritura completa de los ejecutables de estos juegos y no es un emulador.
    fr_FR: "ScummVM est un programme qui permet de lancer certains jeux d'aventure et de rôle graphiques classiques, à condition de posséder leurs fichiers de données. Son astuce\_? ScummVM remplace simplement les exécutables d'origine, permettant ainsi de jouer sur des systèmes pour lesquels ils n'ont jamais été conçus\_! ScummVM réécrit intégralement les exécutables de ces jeux et n'est pas un émulateur."
    ga_IE: 'Is clár é ScummVM a ligeann duit cluichí eachtraíochta grafacha clasaiceacha agus rólghlacadh áirithe a rith, ar choinníoll go bhfuil a gcomhaid sonraí agat cheana féin. An chuid chliste faoi seo: ní dhéanann ScummVM ach na comhaid inrite a sheoltar leis na cluichí a athsholáthar, rud a ligeann duit iad a imirt ar chórais nár dearadh iad dóibh riamh! Is athscríobh iomlán é ScummVM ar chomhaid inrite na gcluichí seo agus ní aithriseoir é.'
    hr_HR: ScummVM je program koji vam omogućuje pokretanje određenih klasičnih grafičkih avanturističkih i RPG igara, pod uvjetom da već imate njihove podatkovne datoteke. Pametno je to što ScummVM samo zamjenjuje izvršne datoteke koje dolaze s igrama, omogućujući vam da ih igrate na sustavima za koje nikada nisu bile dizajnirane! ScummVM je potpuno prepisivanje izvršnih datoteka ovih igara i nije emulator.
    hu_HU: 'A ScummVM egy olyan program, amely lehetővé teszi bizonyos klasszikus grafikus kaland- és szerepjátékok futtatását, feltéve, hogy már rendelkezel az adatfájljaikkal. Az ötletes rész az egészben: a ScummVM egyszerűen lecseréli a játékokkal együtt szállított futtatható fájlokat, lehetővé téve, hogy olyan rendszereken is játszhass velük, amelyekre soha nem tervezték őket! A ScummVM ezen játékok futtatható fájljainak teljes átírása, és nem emulátor.'
    it_IT: ScummVM è un programma che permette di eseguire alcuni classici giochi di avventura grafica e di ruolo, a patto di possedere già i relativi file di dati. La particolarità di ScummVM è che si limita a sostituire i file eseguibili forniti con i giochi, consentendo di giocarci su sistemi per i quali non erano stati originariamente progettati! ScummVM è una riscrittura completa degli eseguibili di questi giochi e non un emulatore.
    ja_JP: ScummVMは、データファイルが既に存在する場合、特定の古典的なグラフィカルアドベンチャーゲームやロールプレイングゲームを実行できるプログラムです。このプログラムの巧妙な点は、ScummVMがゲームに同梱されている実行ファイルを置き換えるだけで、本来想定されていなかったシステムでもゲームをプレイできるようにすることです。ScummVMはこれらのゲームの実行ファイルを完全に書き換えたものであり、エミュレータではありません。
    ko_KR: ScummVM은 데이터 파일만 있으면 특정 고전 그래픽 어드벤처 및 롤플레잉 게임을 실행할 수 있게 해주는 프로그램입니다. 이 프로그램의 핵심은 게임 실행 파일을 완전히 새로 작성하여, 원래 게임 개발사에서 설계하지 않은 시스템에서도 플레이할 수 있도록 해준다는 점입니다! ScummVM은 에뮬레이터가 아니라 게임 실행 파일을 완전히 재작성한 프로그램입니다.
    ml_IN: 'നിങ്ങളുടെ കൈവശം ഇതിനകം തന്നെ ചില ക്ലാസിക് ഗ്രാഫിക്കൽ അഡ്വഞ്ചർ, റോൾ-പ്ലേയിംഗ് ഗെയിമുകളുടെ ഡാറ്റ ഫയലുകൾ ഉണ്ടെങ്കിൽ, അവ പ്രവർത്തിപ്പിക്കാൻ നിങ്ങളെ അനുവദിക്കുന്ന ഒരു പ്രോഗ്രാമാണ് ScummVM. ഇതിനെക്കുറിച്ചുള്ള ബുദ്ധിപരമായ ഭാഗം: ഗെയിമുകൾക്കൊപ്പം വിതരണം ചെയ്ത എക്സിക്യൂട്ടബിളുകൾ ScummVM മാറ്റിസ്ഥാപിക്കുന്നു, അവ ഒരിക്കലും രൂപകൽപ്പന ചെയ്തിട്ടില്ലാത്ത സിസ്റ്റങ്ങളിൽ അവ പ്ലേ ചെയ്യാൻ നിങ്ങളെ അനുവദിക്കുന്നു! ScummVM ഈ ഗെയിമുകളുടെ എക്സിക്യൂട്ടബിളുകളുടെ പൂർണ്ണമായ പുനരാലേഖനമാണ്, ഇത് ഒരു എമുലേറ്ററല്ല.'
    nb_NO: 'ScummVM er et program som lar deg kjøre visse klassiske grafiske eventyr- og rollespill, forutsatt at du allerede har datafilene deres. Det smarte med dette: ScummVM erstatter bare de kjørbare filene som følger med spillene, slik at du kan spille dem på systemer de aldri ble designet for! ScummVM er en fullstendig omskriving av disse spillenes kjørbare filer og er ikke en emulator.'
    nl_NL: ScummVM is een programma waarmee je bepaalde klassieke grafische avonturen- en rollenspellen kunt spelen, mits je de bijbehorende databestanden al hebt. Het slimme eraan is dat ScummVM simpelweg de uitvoerbare bestanden van de spellen vervangt, waardoor je ze kunt spelen op systemen waarvoor ze nooit ontworpen zijn! ScummVM is een volledig herschreven versie van de uitvoerbare bestanden van deze spellen en is geen emulator.
    pl_PL: ScummVM to program, który pozwala na uruchamianie niektórych klasycznych graficznych gier przygodowych i RPG, pod warunkiem, że posiadasz już ich pliki danych. Najciekawsze w tym wszystkim jest to, że ScummVM po prostu zastępuje pliki wykonywalne dołączone do gier, umożliwiając grę na systemach, dla których nigdy nie zostały zaprojektowane! ScummVM to całkowicie przerobiony plik wykonywalny tych gier i nie jest emulatorem.
    pt_BR: ScummVM é um programa que permite executar certos jogos clássicos de aventura gráfica e RPG, desde que você já possua os arquivos de dados dos jogos. A genialidade do programa reside no fato de que o ScummVM simplesmente substitui os executáveis originais dos jogos, permitindo jogá-los em sistemas para os quais eles nunca foram projetados! O ScummVM é uma reescrita completa dos executáveis desses jogos e não um emulador.
    ro_RO: ScummVM este un program care vă permite să rulați anumite jocuri clasice de aventură grafică și jocuri de rol, cu condiția să aveți deja fișierele lor de date. Partea ingenioasă este că ScummVM pur și simplu înlocuiește executabilele livrate împreună cu jocurile, permițându-vă să le jucați pe sisteme pentru care nu au fost niciodată proiectate! ScummVM este o rescriere completă a executabilelor acestor jocuri și nu este un emulator.
    ru_RU: 'ScummVM — это программа, позволяющая запускать некоторые классические графические приключенческие и ролевые игры, при условии, что у вас уже есть их файлы данных. Самое интересное в этом: ScummVM просто заменяет исполняемые файлы, поставляемые с играми, позволяя играть в них на системах, для которых они никогда не предназначались! ScummVM — это полная переработка исполняемых файлов этих игр, а не эмулятор.'
    sk_SK: ScummVM je program, ktorý vám umožňuje spúšťať určité klasické grafické adventúry a hry na hrdinov, za predpokladu, že už máte ich dátové súbory. Dômyselné na tom je, že ScummVM iba nahrádza spustiteľné súbory dodávané s hrami, čo vám umožňuje hrať ich na systémoch, pre ktoré nikdy neboli navrhnuté! ScummVM je kompletným prepísaním spustiteľných súborov týchto hier a nie je emulátorom.
    sv_SE: 'ScummVM är ett program som låter dig köra vissa klassiska grafiska äventyrs- och rollspel, förutsatt att du redan har deras datafiler. Det smarta med detta: ScummVM ersätter helt enkelt de körbara filer som medföljer spelen, vilket gör att du kan spela dem på system som de aldrig designades för! ScummVM är en fullständig omskrivning av dessa spels körbara filer och är inte en emulator.'
    tr_TR: 'ScummVM, veri dosyalarına zaten sahip olmanız koşuluyla, bazı klasik grafiksel macera ve rol yapma oyunlarını çalıştırmanıza olanak tanıyan bir programdır. İşin zekice yanı şu: ScummVM, oyunlarla birlikte gelen yürütülebilir dosyaları değiştirerek, oyunların asla tasarlanmadığı sistemlerde oynamanıza olanak tanır! ScummVM, bu oyunların yürütülebilir dosyalarının tamamen yeniden yazılmış bir versiyonudur ve bir emülatör değildir.'
    zh_CN: ScummVM 可运行部分经典图形冒险和角色扮演游戏，前提是你已拥有相应的游戏数据文件。它替换游戏原本附带的可执行程序，让游戏能够在当初未设计支持的系统上运行。ScummVM 是对这些游戏可执行程序的完整重写，并不是模拟器。
    zh_TW: ScummVM 可執行部分經典圖形冒險和角色扮演遊戲，前提是你已擁有相應的遊戲資料檔案。它替換遊戲原本附帶的可執行程式，讓遊戲能夠在當初未設計支援的系統上執行。ScummVM 是對這些遊戲可執行程式的完整重寫，並不是模擬器。
