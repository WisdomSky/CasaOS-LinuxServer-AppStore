    fr_FR: DokuWiki est un logiciel wiki open source simple d'utilisation et extrêmement polyvalent, ne nécessitant aucune base de données. Apprécié pour sa syntaxe claire et lisible, il est plébiscité par les utilisateurs. Sa facilité de maintenance, de sauvegarde et d'intégration en fait un outil de prédilection pour les administrateurs. Grâce à ses contrôles d'accès intégrés et ses connecteurs d'authentification, DokuWiki est particulièrement utile en entreprise. De plus, le grand nombre d'extensions proposées par sa communauté dynamique permet une large gamme d'utilisations, bien au-delà d'un wiki traditionnel.
    ga_IE: Bogearraí vicí foinse oscailte atá simplí le húsáid agus thar a bheith ilúsáideach nach dteastaíonn bunachar sonraí uaidh. Is breá le húsáideoirí é mar gheall ar a chomhréir ghlan agus inléite. Mar gheall ar an éascaíocht cothabhála, cúltaca agus comhtháthaithe, is fearr le riarthóirí é. Déanann rialuithe rochtana agus nascóirí fíordheimhnithe ionsuite DokuWiki thar a bheith úsáideach i gcomhthéacs fiontraíochta agus cuireann an líon mór breiseán a chuireann a phobal bríomhar ar fáil raon leathan cásanna úsáide ar fáil thar vicí traidisiúnta.
    hr_HR: Jednostavan za korištenje i vrlo svestran softver otvorenog koda za wiki koji ne zahtijeva bazu podataka. Korisnici ga vole zbog njegove čiste i čitljive sintakse. Jednostavnost održavanja, izrade sigurnosnih kopija i integracije čini ga omiljenim među administratorima. Ugrađene kontrole pristupa i konektori za autentifikaciju čine DokuWiki posebno korisnim u poslovnom kontekstu, a veliki broj dodataka koje doprinosi njegova živahna zajednica omogućuje širok raspon slučajeva upotrebe izvan tradicionalnog wikija.
    hu_HU: Egy egyszerűen használható és rendkívül sokoldalú, nyílt forráskódú wiki szoftver, amely nem igényel adatbázist. A felhasználók szeretik a tiszta és olvasható szintaxisáért. A könnyű karbantartás, biztonsági mentés és integráció a rendszergazdák kedvencévé teszi. A beépített hozzáférés-vezérlés és hitelesítési csatlakozók különösen hasznossá teszik a DokuWikit vállalati környezetben, és a pezsgő közösség által biztosított nagyszámú bővítmény széles körű felhasználási lehetőségeket tesz lehetővé a hagyományos wikin túl.
    it_IT: Un software wiki open source semplice da usare e altamente versatile che non richiede un database. È apprezzato dagli utenti per la sua sintassi pulita e leggibile. La facilità di manutenzione, backup e integrazione lo rende uno dei preferiti dagli amministratori. I controlli di accesso e i connettori di autenticazione integrati rendono DokuWiki particolarmente utile in ambito aziendale, e l'ampio numero di plugin sviluppati dalla sua vivace community consente una vasta gamma di casi d'uso che vanno ben oltre un wiki tradizionale.
    ja_JP: 使いやすく汎用性の高いオープンソースのWikiソフトウェアで、データベースは不要です。簡潔で読みやすい構文がユーザーに高く評価されています。メンテナンス、バックアップ、統合が容易なため、管理者にも人気があります。組み込みのアクセス制御と認証コネクタにより、DokuWikiは特に企業環境で役立ちます。また、活発なコミュニティによって提供される多数のプラグインにより、従来のWikiの枠を超えた幅広い用途に対応できます。
    ko_KR: 데이터베이스가 필요 없는 사용하기 쉽고 활용도가 매우 높은 오픈 소스 위키 소프트웨어입니다. 깔끔하고 가독성 좋은 구문으로 사용자들에게 사랑받고 있으며, 손쉬운 유지 관리, 백업 및 통합 기능으로 관리자들에게도 인기가 높습니다. 내장된 접근 제어 및 인증 커넥터를 통해 기업 환경에서 특히 유용하며, 활발한 커뮤니티에서 제공하는 수많은 플러그인을 통해 기존 위키의 틀을 넘어 다양한 활용 사례를 구현할 수 있습니다.
    ml_IN: ഉപയോഗിക്കാൻ എളുപ്പവും വൈവിധ്യപൂർണ്ണവുമായ ഒരു ഓപ്പൺ സോഴ്‌സ് വിക്കി സോഫ്റ്റ്‌വെയറാണ് ഇതിന്, ഒരു ഡാറ്റാബേസ് ആവശ്യമില്ല. വൃത്തിയുള്ളതും വായിക്കാൻ കഴിയുന്നതുമായ വാക്യഘടന കാരണം ഉപയോക്താക്കൾ ഇത് ഇഷ്ടപ്പെടുന്നു. അറ്റകുറ്റപ്പണികളുടെയും ബാക്കപ്പിന്റെയും സംയോജനത്തിന്റെയും എളുപ്പം ഇതിനെ അഡ്മിനിസ്ട്രേറ്റർമാരുടെ പ്രിയങ്കരമാക്കുന്നു. അന്തർനിർമ്മിതമായ ആക്‌സസ് നിയന്ത്രണങ്ങളും പ്രാമാണീകരണ കണക്ടറുകളും ഡോകുവിക്കിയെ എന്റർപ്രൈസ് സന്ദർഭത്തിൽ പ്രത്യേകിച്ചും ഉപയോഗപ്രദമാക്കുന്നു, കൂടാതെ അതിന്റെ ഊർജ്ജസ്വലമായ കമ്മ്യൂണിറ്റി സംഭാവന ചെയ്യുന്ന ധാരാളം പ്ലഗിനുകൾ പരമ്പരാഗത വിക്കിയപ്പുറം വിശാലമായ ഉപയോഗ കേസുകൾ അനുവദിക്കുന്നു.
    nb_NO: En brukervennlig og svært allsidig wiki-programvare med åpen kildekode som ikke krever en database. Den er elsket av brukere for sin rene og lesbare syntaks. Enkel vedlikehold, sikkerhetskopiering og integrering gjør den til en administrators favoritt. Innebygde tilgangskontroller og autentiseringskoblinger gjør DokuWiki spesielt nyttig i bedriftssammenheng, og det store antallet plugins som bidras av det pulserende fellesskapet, gir mulighet for et bredt spekter av brukstilfeller utover en tradisjonell wiki.
    nl_NL: DokuWiki is een gebruiksvriendelijke en zeer veelzijdige open-source wiki-software die geen database vereist. Gebruikers waarderen de heldere en leesbare syntaxis. Het gemakkelijke onderhoud, de back-upmogelijkheden en de integratie maken het een favoriet bij beheerders. De ingebouwde toegangscontrollen en authenticatieconnectoren maken DokuWiki bijzonder nuttig in een bedrijfsomgeving, en het grote aantal plugins dat door de actieve community is ontwikkeld, maakt een breed scala aan toepassingen mogelijk, die verder gaan dan een traditionele wiki.
    pl_PL: Proste w obsłudze i niezwykle wszechstronne oprogramowanie wiki typu open source, które nie wymaga bazy danych. Użytkownicy cenią je za przejrzystą i czytelną składnię. Łatwość konserwacji, tworzenia kopii zapasowych i integracji sprawia, że jest ono ulubionym narzędziem administratorów. Wbudowane mechanizmy kontroli dostępu i łączniki uwierzytelniania sprawiają, że DokuWiki jest szczególnie przydatne w przedsiębiorstwach, a duża liczba wtyczek udostępnianych przez aktywną społeczność pozwala na szeroki zakres zastosowań wykraczających poza tradycyjne wiki.
    pt_BR: Um software wiki de código aberto, simples de usar e altamente versátil, que não requer um banco de dados. É adorado pelos usuários por sua sintaxe limpa e legível. A facilidade de manutenção, backup e integração o torna o favorito dos administradores. Os controles de acesso e conectores de autenticação integrados tornam o DokuWiki especialmente útil no contexto corporativo, e o grande número de plugins contribuídos por sua ativa comunidade permite uma ampla gama de casos de uso além de uma wiki tradicional.
    ro_RO: Un software wiki open source simplu de utilizat și extrem de versatil, care nu necesită o bază de date. Este îndrăgit de utilizatori pentru sintaxa sa curată și lizibilă. Ușurința cu care se pot întreține, face backup și integrează îl face preferatul administratorilor. Controalele de acces și conectorii de autentificare încorporați fac DokuWiki deosebit de util în contextul întreprinderilor, iar numărul mare de plugin-uri oferite de comunitatea sa vibrantă permite o gamă largă de cazuri de utilizare dincolo de un wiki tradițional.
    ru_RU: Простое в использовании и очень универсальное программное обеспечение для вики-систем с открытым исходным кодом, не требующее базы данных. Пользователи любят его за чистый и читаемый синтаксис. Простота обслуживания, резервного копирования и интеграции делает его фаворитом среди администраторов. Встроенные средства контроля доступа и коннекторы аутентификации делают DokuWiki особенно полезным в корпоративной среде, а большое количество плагинов, разработанных активным сообществом, позволяет использовать его в самых разных сценариях, выходящих за рамки традиционной вики.
    sk_SK: Jednoduchý a vysoko všestranný open source wiki softvér, ktorý nevyžaduje databázu. Používatelia ho milujú pre jeho čistú a čitateľnú syntax. Jednoduchá údržba, zálohovanie a integrácia z neho robia obľúbenca administrátorov. Vstavané kontroly prístupu a autentifikačné konektory robia DokuWiki obzvlášť užitočným v podnikovom kontexte a veľké množstvo pluginov, ktoré prináša jeho dynamická komunita, umožňuje širokú škálu prípadov použitia nad rámec tradičnej wiki.
    sv_SE: En lättanvänd och mycket mångsidig wiki-programvara med öppen källkod som inte kräver någon databas. Den är älskad av användarna för sin rena och läsbara syntax. Det enkla underhållet, säkerhetskopieringen och integrationen gör den till en favorit bland administratörer. Inbyggda åtkomstkontroller och autentiseringskopplingar gör DokuWiki särskilt användbar i företagssammanhang och det stora antalet plugins som bidrar med från dess livliga community möjliggör ett brett spektrum av användningsområden utöver en traditionell wiki.
    tr_TR: Veritabanı gerektirmeyen, kullanımı kolay ve son derece çok yönlü bir açık kaynak kodlu wiki yazılımıdır. Temiz ve okunabilir sözdizimi nedeniyle kullanıcılar tarafından sevilmektedir. Bakım, yedekleme ve entegrasyon kolaylığı, onu yöneticilerin favorisi yapmaktadır. Dahili erişim kontrolleri ve kimlik doğrulama bağlantıları, DokuWiki'yi özellikle kurumsal ortamda kullanışlı hale getirirken, canlı topluluğu tarafından katkıda bulunulan çok sayıda eklenti, geleneksel bir wiki'nin ötesinde geniş bir kullanım alanı yelpazesine olanak tanır.
    zh_CN: 无需数据库、易于维护的开源 Wiki。
    zh_TW: 無需資料庫、易於維護的開源 Wiki。
