name: linuxserver-sickchill
services:
  app:
    image: linuxserver/sickchill:2024.3.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
        - container: /downloads
          description:
            en_US: 'Container Path: /downloads'
        - container: /tv
          description:
            en_US: 'Container Path: /tv'
      ports:
        - container: '8081'
          description:
            en_US: 'Container Port: 8081'
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sickchill/config
        target: /config
      - type: bind
        source: /DATA/AppData/sickchill/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/sickchill/tv
        target: /tv
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
