name: linuxserver-lollypop
services:
  app:
    image: linuxserver/lollypop:1.4.45
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Lollypop is a lightweight modern music player designed to work excellently on the GNOME desktop environment.
    zh_CN: Lollypop 是一款轻量、现代的音乐播放器，专为在 GNOME 桌面环境中良好运行而设计。
  tagline:
    en_US: A lightweight modern music player designed to work excellently on the GNOME desktop environment.
    zh_CN: 为 GNOME 桌面设计的轻量音乐播放器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lollypop-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lollypop-icon.png
  title:
    en_US: Lollypop (LinuxServer.io)
    zh_CN: Lollypop（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverlollypop
  port_map: '3000'
  version: 1.4.45
