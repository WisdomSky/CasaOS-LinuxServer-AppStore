name: linuxserver-lollypop
services:
  app:
    image: linuxserver/lollypop:1.4.45
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Lollypop is a lightweight modern music player designed to work excellently on the GNOME desktop environment.
    ca_ES: Lollypop és un reproductor de música modern i lleuger dissenyat per funcionar excel·lentment a l'entorn d'escriptori GNOME.
    cs_CZ: Lollypop je lehký moderní hudební přehrávač navržený pro vynikající fungování v prostředí GNOME.
    da_DK: Lollypop er en let, moderne musikafspiller designet til at fungere fremragende på GNOME-skrivebordsmiljøet.
    de_DE: Lollypop ist ein schlanker, moderner Musikplayer, der speziell für die GNOME-Desktopumgebung entwickelt wurde.
    el_GR: Το Lollypop είναι ένα ελαφρύ, μοντέρνο πρόγραμμα αναπαραγωγής μουσικής σχεδιασμένο να λειτουργεί άψογα στο περιβάλλον εργασίας GNOME.
    en_GB: Lollypop is a lightweight modern music player designed to work excellently on the Gnome desktop environment.
    es_ES: Lollypop es un reproductor de música moderno y ligero diseñado para funcionar a la perfección en el entorno de escritorio GNOME.
    fr_FR: Lollypop est un lecteur de musique moderne et léger, conçu pour fonctionner parfaitement sous l'environnement de bureau GNOME.
    ga_IE: Is seinnteoir ceoil nua-aimseartha éadrom é Lollypop atá deartha chun oibriú go han-mhaith ar thimpeallacht deisce GNOME.
    hr_HR: Lollypop je lagani moderni glazbeni player dizajniran za izvrstan rad u GNOME desktop okruženju.
    hu_HU: A Lollypop egy könnyű, modern zenelejátszó, amelyet úgy terveztek, hogy kiválóan működjön a GNOME asztali környezetben.
    it_IT: Lollypop è un lettore musicale moderno e leggero, progettato per funzionare in modo eccellente nell'ambiente desktop GNOME.
    ja_JP: Lollypopは、GNOMEデスクトップ環境で優れた動作を発揮するように設計された、軽量でモダンな音楽プレーヤーです。
    ko_KR: Lollypop은 GNOME 데스크톱 환경에서 탁월하게 작동하도록 설계된 가볍고 현대적인 음악 플레이어입니다.
    ml_IN: ഗ്നോം ഡെസ്ക്ടോപ്പ് പരിതസ്ഥിതിയിൽ മികച്ച രീതിയിൽ പ്രവർത്തിക്കുന്നതിനായി രൂപകൽപ്പന ചെയ്ത ഒരു ഭാരം കുറഞ്ഞ ആധുനിക മ്യൂസിക് പ്ലെയറാണ് ലോലിപോപ്പ്.
    nb_NO: Lollypop er en lett, moderne musikkspiller designet for å fungere utmerket på GNOME-skrivebordsmiljøet.
    nl_NL: Lollypop is een lichtgewicht, moderne muziekspeler die uitstekend werkt in de GNOME-desktopomgeving.
    pl_PL: Lollypop to lekki, nowoczesny odtwarzacz muzyki zaprojektowany do doskonałej pracy w środowisku graficznym GNOME.
    pt_BR: Lollypop é um reprodutor de música moderno e leve, projetado para funcionar perfeitamente no ambiente de desktop GNOME.
    ro_RO: Lollypop este un player muzical modern și ușor, conceput să funcționeze excelent pe mediul desktop GNOME.
    ru_RU: Lollypop — это легковесный современный музыкальный плеер, разработанный для превосходной работы в среде рабочего стола GNOME.
    sk_SK: Lollypop je ľahký moderný hudobný prehrávač navrhnutý pre vynikajúci výkon v prostredí GNOME.
    sv_SE: Lollypop är en lätt och modern musikspelare designad för att fungera utmärkt i GNOME-skrivbordsmiljön.
    tr_TR: Lollypop, GNOME masaüstü ortamında mükemmel şekilde çalışmak üzere tasarlanmış, hafif ve modern bir müzik oynatıcısıdır.
    zh_CN: Lollypop 是一款轻量、现代的音乐播放器，专为在 GNOME 桌面环境中良好运行而设计。
    zh_TW: Lollypop 是一款輕量、現代的音樂播放器，專為在 GNOME 桌面環境中良好執行而設計。
