name: linuxserver-kali-linux
services:
  app:
    image: linuxserver/kali-linux:version-45f3494e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kali-linux/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Kali-linux - is an Advanced Penetration Testing Linux distribution used for Penetration Testing, Ethical Hacking and network security assessments. KALI LINUX ™ is a trademark of OffSec.
    zh_CN: Kali Linux 是用于渗透测试、道德黑客活动和网络安全评估的高级 Linux 发行版。KALI LINUX™ 是 OffSec 的商标。
  tagline:
    en_US: is an Advanced Penetration Testing Linux distribution used for Penetration Testing, Ethical Hacking and network security assessments. KALI LINUX ™ is a trademark of OffSec.
    zh_CN: 用于渗透测试和网络安全评估的 Linux 发行版。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kali-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kali-logo.png
  title:
    en_US: Kali linux (LinuxServer.io)
    zh_CN: Kali linux（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverkalilinux
  port_map: '3000'
  version: version-45f3494e
