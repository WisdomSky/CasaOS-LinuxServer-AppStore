name: linuxserver-dolphin
services:
  app:
    image: linuxserver/dolphin:version-2606a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dolphin/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Dolphin Emulator lets you play GameCube and Wii games with various graphical enhancements and other features are available to improve your game experience.
    ca_ES: L'emulador Dolphin et permet jugar a jocs de GameCube i Wii amb diverses millores gràfiques i altres funcions disponibles per millorar la teva experiència de joc.
    cs_CZ: Dolphin Emulator vám umožňuje hrát hry pro GameCube a Wii s různými grafickými vylepšeními a dalšími funkcemi, které vylepší váš herní zážitek.
    da_DK: Dolphin Emulator lader dig spille GameCube- og Wii-spil med forskellige grafiske forbedringer og andre funktioner, der er tilgængelige for at forbedre din spiloplevelse.
    de_DE: Mit dem Dolphin Emulator können Sie GameCube- und Wii-Spiele spielen. Verschiedene grafische Verbesserungen und andere Funktionen stehen Ihnen zur Verfügung, um Ihr Spielerlebnis zu optimieren.
    el_GR: Το Dolphin Emulator σάς επιτρέπει να παίζετε παιχνίδια GameCube και Wii με διάφορες γραφικές βελτιώσεις και άλλες λειτουργίες που είναι διαθέσιμες για να βελτιώσετε την εμπειρία παιχνιδιού σας.
    en_GB: Dolphin Emulator lets you play Gamecube and Wii games with various graphical enhancements and other features are available to improve your game experience.
    es_ES: El emulador Dolphin te permite jugar a juegos de GameCube y Wii con diversas mejoras gráficas y otras funciones disponibles para mejorar tu experiencia de juego.
    fr_FR: Dolphin Emulator vous permet de jouer à des jeux GameCube et Wii avec diverses améliorations graphiques et d'autres fonctionnalités sont disponibles pour améliorer votre expérience de jeu.
    ga_IE: Le Dolphin Emulator is féidir leat cluichí GameCube agus Wii a imirt le feabhsuithe grafacha éagsúla agus gnéithe eile atá ar fáil chun feabhas a chur ar do thaithí cluiche.
    hr_HR: Dolphin Emulator vam omogućuje igranje GameCube i Wii igara s raznim grafičkim poboljšanjima i drugim značajkama dostupnim za poboljšanje vašeg iskustva igranja.
    hu_HU: A Dolphin Emulator lehetővé teszi a GameCube és Wii játékok lejátszását különféle grafikai fejlesztésekkel és egyéb funkciókkal, amelyek javítják a játékélményt.
    it_IT: L'emulatore Dolphin permette di giocare ai titoli per GameCube e Wii con vari miglioramenti grafici e altre funzionalità disponibili per ottimizzare l'esperienza di gioco.
    ja_JP: Dolphin Emulatorを使えば、GameCubeやWiiのゲームをプレイでき、様々なグラフィック強化機能やその他の機能を利用してゲーム体験を向上させることができます。
    ko_KR: Dolphin 에뮬레이터를 사용하면 다양한 그래픽 향상 및 기타 기능을 통해 게임큐브와 Wii 게임을 플레이할 수 있으며, 이를 통해 게임 경험을 개선할 수 있습니다.
    ml_IN: ഡോൾഫിൻ എമുലേറ്റർ നിങ്ങളെ ഗെയിംക്യൂബ്, വൈ ഗെയിമുകൾ കളിക്കാൻ അനുവദിക്കുന്നു, വിവിധ ഗ്രാഫിക്കൽ മെച്ചപ്പെടുത്തലുകളും നിങ്ങളുടെ ഗെയിം അനുഭവം മെച്ചപ്പെടുത്തുന്നതിന് മറ്റ് സവിശേഷതകളും ലഭ്യമാണ്.
    nb_NO: Dolphin Emulator lar deg spille GameCube- og Wii-spill med diverse grafiske forbedringer og andre funksjoner som er tilgjengelige for å forbedre spillopplevelsen.
    nl_NL: Met Dolphin Emulator kun je GameCube- en Wii-spellen spelen met diverse grafische verbeteringen, en er zijn nog meer functies beschikbaar om je game-ervaring te verbeteren.
    pl_PL: Dzięki emulatorowi Dolphin możesz grać w gry na GameCube i Wii, korzystając z różnych udoskonaleń graficznych i innych funkcji, które ulepszą Twoje wrażenia z gry.
    pt_BR: O Dolphin Emulator permite que você jogue jogos de GameCube e Wii com diversas melhorias gráficas e outros recursos disponíveis para aprimorar sua experiência de jogo.
    ro_RO: Dolphin Emulator îți permite să joci jocuri GameCube și Wii cu diverse îmbunătățiri grafice și alte funcții disponibile pentru a-ți îmbunătăți experiența de joc.
    ru_RU: Эмулятор Dolphin позволяет играть в игры для GameCube и Wii с различными графическими улучшениями, а также другими функциями, которые улучшат ваш игровой опыт.
    sk_SK: Dolphin Emulator vám umožňuje hrať hry pre GameCube a Wii s rôznymi grafickými vylepšeniami a ďalšími funkciami, ktoré vám pomôžu zlepšiť herný zážitok.
    sv_SE: Med Dolphin Emulator kan du spela GameCube- och Wii-spel med olika grafiska förbättringar och andra funktioner som finns tillgängliga för att förbättra din spelupplevelse.
    tr_TR: Dolphin Emulator, GameCube ve Wii oyunlarını çeşitli grafiksel iyileştirmelerle oynamanıza olanak tanır ve oyun deneyiminizi geliştirmek için diğer özellikler de mevcuttur.
    zh_CN: Dolphin Emulator 可运行 GameCube 和 Wii 游戏，并提供多种图形增强和其他功能以改善游戏体验。
    zh_TW: Dolphin Emulator 可執行 GameCube 和 Wii 遊戲，並提供多種圖形增強和其他功能以改善遊戲體驗。
