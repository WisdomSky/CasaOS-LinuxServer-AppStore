name: linuxserver-nano
services:
  app:
    image: linuxserver/nano:21.2.20220522
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PEER_HOST: ''
      LIVE_GENESIS_PUB: ''
      LIVE_GENESIS_ACCOUNT: ''
      LIVE_GENESIS_WORK: ''
      LIVE_GENESIS_SIG: ''
      CLI_OPTIONS: ''
      LMDB_BOOTSTRAP_URL: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: PEER_HOST
          description:
            en_US: Default peer host (can be overidden with an array by command line options)
        - container: LIVE_GENESIS_PUB
          description:
            en_US: Genesis block public key
        - container: LIVE_GENESIS_ACCOUNT
          description:
            en_US: Genesis block account
        - container: LIVE_GENESIS_WORK
          description:
            en_US: Genesis block proof of work
        - container: LIVE_GENESIS_SIG
          description:
            en_US: Genesis block signature
        - container: CLI_OPTIONS
          description:
            en_US: Node run command cli args
        - container: LMDB_BOOTSTRAP_URL
          description:
            en_US: HTTP/HTTPS endpoint to download a 7z file with the data.ldb to bootstrap to this node
    ports:
      - target: 8075
        published: 8075
        protocol: tcp
      - target: 7076
        published: 3000
        protocol: tcp
      - target: 7077
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nano/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  main: app
  description:
    en_US: Nano is a digital payment protocol designed to be accessible and lightweight, with a focus on removing inefficiencies present in other cryptocurrencies. With ultrafast transactions and zero fees on a secure, green and decentralized network, this makes Nano ideal for everyday transactions.
    zh_CN: Nano 是一种易于使用的轻量数字支付协议，重点在于消除其他加密货币中的低效环节。它在安全、环保、去中心化的网络上提供极快且零手续费的交易，适合日常支付。
    ca_ES: Nano és un protocol de pagament digital dissenyat per ser accessible i lleuger, amb un enfocament en l'eliminació de les ineficiències presents en altres criptomonedes. Amb transaccions ultraràpides i zero comissions en una xarxa segura, verda i descentralitzada, això fa que Nano sigui ideal per a transaccions diàries.
    cs_CZ: Nano je digitální platební protokol navržený tak, aby byl přístupný a nenáročný, se zaměřením na odstranění neefektivity přítomné v jiných kryptoměnách. Díky ultrarychlým transakcím a nulovým poplatkům v bezpečné, zelené a decentralizované síti je Nano ideální pro každodenní transakce.
    da_DK: Nano er en digital betalingsprotokol designet til at være tilgængelig og let, med fokus på at fjerne ineffektiviteter, der findes i andre kryptovalutaer. Med ultrahurtige transaktioner og nul gebyrer på et sikkert, grønt og decentraliseret netværk gør dette Nano ideel til hverdagstransaktioner.
    de_DE: Nano ist ein digitales Zahlungsprotokoll, das auf einfache Zugänglichkeit und geringen Ressourcenverbrauch ausgelegt ist und Ineffizienzen anderer Kryptowährungen beseitigt. Dank ultraschneller Transaktionen und gebührenfreier Nutzung in einem sicheren, umweltfreundlichen und dezentralen Netzwerk eignet sich Nano ideal für alltägliche Zahlungen.
    el_GR: Το Nano είναι ένα πρωτόκολλο ψηφιακών πληρωμών σχεδιασμένο να είναι προσβάσιμο και ελαφρύ, με έμφαση στην εξάλειψη των ανεπαρκειών που υπάρχουν σε άλλα κρυπτονομίσματα. Με εξαιρετικά γρήγορες συναλλαγές και μηδενικές χρεώσεις σε ένα ασφαλές, πράσινο και αποκεντρωμένο δίκτυο, αυτό καθιστά το Nano ιδανικό για καθημερινές συναλλαγές.
    en_GB: Nano is a digital payment protocol designed to be accessible and lightweight, with a focus on removing inefficiencies present in other cryptocurrencies. With ultrafast transactions and zero fees on a secure, green and decentralised network, this makes Nano ideal for everyday transactions.
    es_ES: Nano es un protocolo de pago digital diseñado para ser accesible y ligero, centrado en eliminar las ineficiencias presentes en otras criptomonedas. Con transacciones ultrarrápidas y cero comisiones en una red segura, ecológica y descentralizada, Nano resulta ideal para las transacciones cotidianas.
    fr_FR: Nano est un protocole de paiement numérique conçu pour être accessible et léger, et qui vise à éliminer les inefficacités présentes dans d'autres cryptomonnaies. Grâce à des transactions ultrarapides et sans frais sur un réseau sécurisé, écologique et décentralisé, Nano est idéal pour les transactions quotidiennes.
    ga_IE: Is prótacal íocaíochta digiteach é Nano atá deartha le bheith inrochtana agus éadrom, le fócas ar neamhéifeachtúlachtaí atá i láthair i gcripteairgeadraí eile a bhaint. Le hidirbhearta thar a bheith gasta agus gan aon táillí ar líonra slán, glas agus díláraithe, déanann sé seo Nano oiriúnach d'idirbhearta laethúla.
    hr_HR: Nano je digitalni protokol za plaćanje osmišljen da bude pristupačan i lagan, s naglaskom na uklanjanju neučinkovitosti prisutnih u drugim kriptovalutama. S ultrabrzim transakcijama i nultom naknadom na sigurnoj, zelenoj i decentraliziranoj mreži, Nano je idealan za svakodnevne transakcije.
    hu_HU: A Nano egy könnyen hozzáférhető és könnyűsúlyú digitális fizetési protokoll, amelynek középpontjában a más kriptovalutákban jelen lévő hatékonysági problémák kiküszöbölése áll. A biztonságos, zöld és decentralizált hálózaton keresztüli ultragyors tranzakcióknak és a díjmentességnek köszönhetően a Nano ideális választás a mindennapi tranzakciókhoz.
    it_IT: Nano è un protocollo di pagamento digitale progettato per essere accessibile e leggero, con l'obiettivo di eliminare le inefficienze presenti in altre criptovalute. Grazie a transazioni ultraveloci e zero commissioni su una rete sicura, ecologica e decentralizzata, Nano è ideale per le transazioni quotidiane.
    ja_JP: Nanoは、他の暗号通貨に存在する非効率性を排除することに重点を置いて設計された、アクセスしやすく軽量なデジタル決済プロトコルです。超高速な取引と手数料無料、そして安全で環境に優しく分散型のネットワークにより、Nanoは日常的な取引に最適です。
    ko_KR: 나노는 접근성과 경량화를 목표로 설계된 디지털 결제 프로토콜로, 다른 암호화폐에 존재하는 비효율성을 제거하는 데 중점을 두고 있습니다. 초고속 거래 속도와 수수료 제로, 안전하고 친환경적인 탈중앙화 네트워크를 제공하는 나노는 일상적인 거래에 이상적입니다.
    ml_IN: മറ്റ് ക്രിപ്‌റ്റോകറൻസികളിലെ കാര്യക്ഷമതയില്ലായ്മ ഇല്ലാതാക്കുന്നതിൽ ശ്രദ്ധ കേന്ദ്രീകരിച്ച്, ആക്‌സസ് ചെയ്യാവുന്നതും ഭാരം കുറഞ്ഞതുമായ ഒരു ഡിജിറ്റൽ പേയ്‌മെന്റ് പ്രോട്ടോക്കോളാണ് നാനോ. സുരക്ഷിതവും ഹരിതവും വികേന്ദ്രീകൃതവുമായ നെറ്റ്‌വർക്കിലെ അതിവേഗ ഇടപാടുകളും പൂജ്യം ഫീസും ഉള്ളതിനാൽ, ഇത് നാനോയെ ദൈനംദിന ഇടപാടുകൾക്ക് അനുയോജ്യമാക്കുന്നു.
    nb_NO: Nano er en digital betalingsprotokoll som er utformet for å være tilgjengelig og lett, med fokus på å fjerne ineffektiviteten som finnes i andre kryptovalutaer. Med ultrasnelle transaksjoner og null gebyrer på et sikkert, grønt og desentralisert nettverk, gjør dette Nano ideell for hverdagstransaksjoner.
    nl_NL: Nano is een digitaal betalingsprotocol dat is ontworpen om toegankelijk en lichtgewicht te zijn, met de nadruk op het wegnemen van inefficiënties die in andere cryptovaluta voorkomen. Met ultrasnelle transacties en nul kosten op een veilig, groen en gedecentraliseerd netwerk is Nano ideaal voor dagelijkse transacties.
    pl_PL: Nano to cyfrowy protokół płatności zaprojektowany z myślą o łatwości i prostocie, z naciskiem na eliminację nieefektywności obecnych w innych kryptowalutach. Dzięki ultraszybkim transakcjom i zerowym opłatom w bezpiecznej, ekologicznej i zdecentralizowanej sieci, Nano idealnie nadaje się do codziennych transakcji.
    pt_BR: Nano é um protocolo de pagamento digital projetado para ser acessível e leve, com foco na eliminação das ineficiências presentes em outras criptomoedas. Com transações ultrarrápidas e taxas zero em uma rede segura, ecológica e descentralizada, o Nano se torna ideal para transações do dia a dia.
    ro_RO: Nano este un protocol de plată digitală conceput pentru a fi accesibil și ușor, cu accent pe eliminarea ineficiențelor prezente în alte criptomonede. Cu tranzacții ultrarapide și zero comisioane pe o rețea sigură, ecologică și descentralizată, Nano este ideal pentru tranzacțiile de zi cu zi.
    ru_RU: Nano — это протокол цифровых платежей, разработанный с учетом доступности и легкости, с упором на устранение недостатков, присущих другим криптовалютам. Благодаря сверхбыстрым транзакциям и отсутствию комиссий в безопасной, экологичной и децентрализованной сети, Nano идеально подходит для повседневных операций.
    sk_SK: Nano je digitálny platobný protokol navrhnutý tak, aby bol prístupný a ľahký, so zameraním na odstránenie neefektívnosti prítomnej v iných kryptomenách. Vďaka ultrarýchlym transakciám a nulovým poplatkom v bezpečnej, zelenej a decentralizovanej sieti je Nano ideálny pre každodenné transakcie.
    sv_SE: Nano är ett digitalt betalningsprotokoll utformat för att vara tillgängligt och lätt, med fokus på att eliminera ineffektiviteter som finns i andra kryptovalutor. Med ultrasnabba transaktioner och noll avgifter på ett säkert, grönt och decentraliserat nätverk gör detta Nano idealiskt för vardagliga transaktioner.
    tr_TR: Nano, diğer kripto para birimlerindeki verimsizlikleri ortadan kaldırmaya odaklanarak, erişilebilir ve hafif olacak şekilde tasarlanmış bir dijital ödeme protokolüdür. Ultra hızlı işlemler ve güvenli, çevre dostu ve merkeziyetsiz bir ağda sıfır işlem ücreti ile Nano, günlük işlemler için idealdir.
    zh_TW: Nano 是一種易於使用的輕量數字支付協議，重點在於消除其他加密貨幣中的低效環節。它在安全、環保、去中心化的網路上提供極快且零手續費的交易，適合日常支付。
