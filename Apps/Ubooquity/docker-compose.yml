name: linuxserver-ubooquity
services:
  app:
    image: linuxserver/ubooquity:3.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MAXMEM: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: MAXMEM
          description:
            en_US: 'To set the maximum memory. ( ex: set ''1024'' for 1GB ) [OPTIONAL]'
    ports:
      - target: 2202
        published: 2202
        protocol: tcp
      - target: 2203
        published: 2203
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ubooquity/config
        target: /config
      - type: bind
        source: /DATA/AppData/ubooquity/books
        target: /books
      - type: bind
        source: /DATA/AppData/ubooquity/comics
        target: /comics
      - type: bind
        source: /DATA/AppData/ubooquity/files
        target: /files
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Ubooquity is a free, lightweight and easy-to-use home server for your comics and ebooks. Use it to access your files from anywhere, with a tablet, an e-reader, a phone or a computer.
    ca_ES: Ubooquity és un servidor domèstic gratuït, lleuger i fàcil d'utilitzar per als teus còmics i llibres electrònics. Fes-lo servir per accedir als teus fitxers des de qualsevol lloc, amb una tauleta, un lector electrònic, un telèfon o un ordinador.
    cs_CZ: Ubooquity je bezplatný, lehký a snadno použitelný domácí server pro vaše komiksy a elektronické knihy. Použijte ho pro přístup k souborům odkudkoli, ať už pomocí tabletu, čtečky elektronických knih, telefonu nebo počítače.
    da_DK: Ubooquity er en gratis, let og brugervenlig hjemmeserver til dine tegneserier og e-bøger. Brug den til at få adgang til dine filer hvor som helst, med en tablet, en e-læser, en telefon eller en computer.
    de_DE: Ubooquity ist ein kostenloser, ressourcenschonender und benutzerfreundlicher Heimserver für Ihre Comics und E-Books. Greifen Sie damit von überall auf Ihre Dateien zu – mit Tablet, E-Reader, Smartphone oder Computer.
    el_GR: Το Ubooquity είναι ένας δωρεάν, ελαφρύς και εύχρηστος οικιακός διακομιστής για τα κόμικς και τα ηλεκτρονικά σας βιβλία. Χρησιμοποιήστε τον για να έχετε πρόσβαση στα αρχεία σας από οπουδήποτε, με ένα tablet, ένα ηλεκτρονικό αναγνώστη, ένα τηλέφωνο ή έναν υπολογιστή.
    en_GB: Ubooquity is a free, lightweight and easy-to-use home server for your comics and ebooks. Use it to access your files from anywhere, with a tablet, an e-reader, a phone or a computer.
    es_ES: 'Ubooquity es un servidor doméstico gratuito, ligero y fácil de usar para tus cómics y libros electrónicos. Úsalo para acceder a tus archivos desde cualquier lugar: tableta, lector electrónico, teléfono o computadora.'
    fr_FR: Ubooquity est un serveur domestique gratuit, léger et facile à utiliser pour vos bandes dessinées et vos livres numériques. Accédez à vos fichiers où que vous soyez, depuis une tablette, une liseuse, un téléphone ou un ordinateur.
    ga_IE: Is freastalaí baile saor in aisce, éadrom agus éasca le húsáid é Ubooquity do do ghreannáin agus do ríomhleabhair. Bain úsáid as chun rochtain a fháil ar do chuid comhad ó áit ar bith, le táibléad, léitheoir ríomhleabhair, fón nó ríomhaire.
    hr_HR: Ubooquity je besplatan, lagan i jednostavan za korištenje kućni poslužitelj za vaše stripove i e-knjige. Koristite ga za pristup datotekama s bilo kojeg mjesta, putem tableta, e-čitača, telefona ili računala.
    hu_HU: Az Ubooquity egy ingyenes, könnyű és könnyen használható otthoni szerver képregényeid és e-könyveid számára. Használd fájljaid eléréséhez bárhonnan, tabletről, e-könyv olvasóval, telefonról vagy számítógépről.
    it_IT: Ubooquity è un server domestico gratuito, leggero e facile da usare per i tuoi fumetti ed ebook. Usalo per accedere ai tuoi file ovunque ti trovi, con un tablet, un e-reader, uno smartphone o un computer.
    ja_JP: Ubooquityは、コミックや電子書籍のための、無料で軽量かつ使いやすいホームサーバーです。タブレット、電子書籍リーダー、スマートフォン、パソコンなど、あらゆるデバイスからファイルにアクセスできます。
    ko_KR: Ubooquity는 만화와 전자책을 위한 무료의 가볍고 사용하기 쉬운 홈 서버입니다. 태블릿, 전자책 리더기, 스마트폰 또는 컴퓨터를 사용하여 어디서든 파일에 액세스할 수 있습니다.
    ml_IN: നിങ്ങളുടെ കോമിക്‌സിനും ഇ-ബുക്കുകൾക്കും വേണ്ടിയുള്ള സൌജന്യവും ഭാരം കുറഞ്ഞതും ഉപയോഗിക്കാൻ എളുപ്പമുള്ളതുമായ ഒരു ഹോം സെർവറാണ് Ubooquity. ഒരു ടാബ്‌ലെറ്റ്, ഇ-റീഡർ, ഫോൺ അല്ലെങ്കിൽ കമ്പ്യൂട്ടർ എന്നിവ ഉപയോഗിച്ച് എവിടെ നിന്നും നിങ്ങളുടെ ഫയലുകൾ ആക്‌സസ് ചെയ്യാൻ ഇത് ഉപയോഗിക്കുക.
    nb_NO: Ubooquity er en gratis, lett og brukervennlig hjemmeserver for tegneserier og e-bøker. Bruk den til å få tilgang til filene dine hvor som helst, med et nettbrett, en e-leser, en telefon eller en datamaskin.
    nl_NL: Ubooquity is een gratis, lichtgewicht en gebruiksvriendelijke thuisserver voor je strips en e-books. Gebruik het om overal toegang te krijgen tot je bestanden, met een tablet, e-reader, telefoon of computer.
    pl_PL: Ubooquity to darmowy, lekki i łatwy w obsłudze serwer domowy dla Twoich komiksów i ebooków. Korzystaj z niego, aby uzyskać dostęp do swoich plików z dowolnego miejsca – za pomocą tabletu, czytnika e-booków, telefonu lub komputera.
    pt_BR: O Ubooquity é um servidor doméstico gratuito, leve e fácil de usar para seus quadrinhos e ebooks. Use-o para acessar seus arquivos de qualquer lugar, com um tablet, um e-reader, um celular ou um computador.
    ro_RO: Ubooquity este un server de acasă gratuit, ușor și ușor de utilizat pentru benzile desenate și cărțile tale electronice. Folosește-l pentru a accesa fișierele tale de oriunde, cu o tabletă, un cititor electronic, un telefon sau un computer.
    ru_RU: 'Ubooquity — это бесплатный, легкий и простой в использовании домашний сервер для ваших комиксов и электронных книг. Используйте его для доступа к своим файлам из любого места: с планшета, электронной книги, телефона или компьютера.'
    sk_SK: Ubooquity je bezplatný, ľahký a ľahko použiteľný domáci server pre vaše komiksy a elektronické knihy. Použite ho na prístup k súborom odkiaľkoľvek, pomocou tabletu, čítačky elektronických kníh, telefónu alebo počítača.
    sv_SE: Ubooquity är en gratis, lätt och lättanvänd hemmaserver för dina serier och e-böcker. Använd den för att komma åt dina filer var du än är, med en surfplatta, en e-läsare, en telefon eller en dator.
    tr_TR: Ubooquity, çizgi romanlarınız ve e-kitaplarınız için ücretsiz, hafif ve kullanımı kolay bir ev sunucusudur. Tablet, e-okuyucu, telefon veya bilgisayar kullanarak dosyalarınıza her yerden erişebilirsiniz.
    zh_CN: Ubooquity 是免费、轻量、易用的漫画和电子书家用服务器。你可以通过平板电脑、电子阅读器、手机或电脑，随时随地访问自己的文件。
    zh_TW: Ubooquity 是免費、輕量、易用的漫畫和電子書家用伺服器。你可以透過平板電腦、電子閱讀器、手機或電腦，隨時隨地訪問自己的檔案。
