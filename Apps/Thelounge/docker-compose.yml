name: linuxserver-thelounge
services:
  app:
    image: linuxserver/thelounge:4.5.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thelounge/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Thelounge (a fork of shoutIRC) is a web IRC client that you host on your own server.
    zh_CN: The Lounge 是 shoutIRC 的分支，是一个运行在你自己服务器上的网页 IRC 客户端。
  tagline:
    en_US: (a fork of shoutIRC) is a web IRC client that you host on your own server.
    zh_CN: 自行托管的网页 IRC 客户端。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/thelounge/thelounge/master/client/public/img/logo-vertical-transparent-bg.svg
  thumbnail: https://raw.githubusercontent.com/thelounge/thelounge/master/client/public/img/logo-vertical-transparent-bg.svg
  title:
    en_US: Thelounge (LinuxServer.io)
    zh_CN: Thelounge（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverthelounge
  port_map: '9000'
  version: 4.5.2
