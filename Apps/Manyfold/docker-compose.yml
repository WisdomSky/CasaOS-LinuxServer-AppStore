name: linuxserver-manyfold
services:
  app:
    image: linuxserver/manyfold:0.149.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DATABASE_URL: ''
      REDIS_URL: ''
      SECRET_KEY_BASE: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: DATABASE_URL
          description:
            en_US: Database connection URL. For sqlite use sqlite3:/config/manyfold.sqlite3. For postgres or mariadb use ://:@:/ where ` is postgresql or mysql2`. Special characters in username/password must be URL encoded.
        - container: REDIS_URL
          description:
            en_US: Redis/Valkey database URL in redis://:/ format.
        - container: SECRET_KEY_BASE
          description:
            en_US: Browser session and database encryption key. If unset a random one will be generated on init, the database is locked to this key.
    ports:
      - target: 3214
        published: 3214
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/manyfold/config
        target: /config
      - type: bind
        source: /DATA/AppData/manyfold/libraries
        target: /libraries
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Manyfold is an open source, self-hosted web application for managing a collection of 3D models, particularly focused on 3D printing.
    ca_ES: Manyfold és una aplicació web de codi obert i autoallotjada per gestionar una col·lecció de models 3D, especialment centrada en la impressió 3D.
    cs_CZ: Manyfold je open source, self-hostovaná webová aplikace pro správu kolekce 3D modelů, zaměřená zejména na 3D tisk.
    da_DK: Manyfold er en open source, selvhostet webapplikation til administration af en samling af 3D-modeller, især med fokus på 3D-printning.
    de_DE: Manyfold ist eine Open-Source-Webanwendung, die selbst gehostet wird und zur Verwaltung einer Sammlung von 3D-Modellen dient, mit besonderem Fokus auf den 3D-Druck.
    el_GR: Το Manyfold είναι μια αυτοφιλοξενούμενη διαδικτυακή εφαρμογή ανοιχτού κώδικα για τη διαχείριση μιας συλλογής τρισδιάστατων μοντέλων, με ιδιαίτερη έμφαση στην τρισδιάστατη εκτύπωση.
    en_GB: Manyfold is an open source, self-hosted web application for managing a collection of 3D models, particularly focused on 3D printing.
    es_ES: Manyfold es una aplicación web de código abierto y autoalojada para gestionar una colección de modelos 3D, especialmente enfocada en la impresión 3D.
    fr_FR: Manyfold est une application web open source auto-hébergée permettant de gérer une collection de modèles 3D, particulièrement axée sur l'impression 3D.
    ga_IE: Is feidhmchlár gréasáin foinse oscailte, féinóstáilte é Manyfold chun bailiúchán de mhúnlaí 3T a bhainistiú, go háirithe dírithe ar phriontáil 3T.
    hr_HR: Manyfold je web aplikacija otvorenog koda s vlastitim hostingom za upravljanje kolekcijom 3D modela, posebno usmjerena na 3D ispis.
    hu_HU: A Manyfold egy nyílt forráskódú, saját tárhelyen futó webes alkalmazás 3D modellek gyűjteményének kezelésére, különös tekintettel a 3D nyomtatásra.
    it_IT: Manyfold è un'applicazione web open source, autogestita, per la gestione di una collezione di modelli 3D, particolarmente focalizzata sulla stampa 3D.
    ja_JP: Manyfoldは、3Dモデルのコレクションを管理するためのオープンソースのセルフホスト型Webアプリケーションであり、特に3Dプリンティングに重点を置いています。
    ko_KR: Manyfold는 3D 모델 모음을 관리하기 위한 오픈 소스 자체 호스팅 웹 애플리케이션으로, 특히 3D 프린팅에 중점을 두고 있습니다.
    ml_IN: 3D മോഡലുകളുടെ ഒരു ശേഖരം കൈകാര്യം ചെയ്യുന്നതിനുള്ള ഒരു ഓപ്പൺ സോഴ്‌സ്, സ്വയം ഹോസ്റ്റുചെയ്‌ത വെബ് ആപ്ലിക്കേഷനാണ് മനിഫോൾഡ്, പ്രത്യേകിച്ച് 3D പ്രിന്റിംഗിൽ ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നു.
    nb_NO: Manyfold er en åpen kildekode, selvhostet webapplikasjon for å administrere en samling av 3D-modeller, spesielt fokusert på 3D-utskrift.
    nl_NL: Manyfold is een open source, zelfgehoste webapplicatie voor het beheren van een verzameling 3D-modellen, met name gericht op 3D-printen.
    pl_PL: Manyfold to oparta na otwartym kodzie źródłowym, hostowana na własnym serwerze aplikacja internetowa służąca do zarządzania zbiorem modeli 3D, ze szczególnym uwzględnieniem druku 3D.
    pt_BR: Manyfold é um aplicativo web de código aberto e auto-hospedado para gerenciar uma coleção de modelos 3D, com foco especial em impressão 3D.
    ro_RO: Manyfold este o aplicație web open source, auto-găzduită, pentru gestionarea unei colecții de modele 3D, axată în special pe imprimarea 3D.
    ru_RU: Manyfold — это веб-приложение с открытым исходным кодом, размещаемое на собственном сервере, для управления коллекцией 3D-моделей, ориентированное, в частности, на 3D-печать.
    sk_SK: Manyfold je open source, self-hostingová webová aplikácia na správu kolekcie 3D modelov, zameraná najmä na 3D tlač.
    sv_SE: Manyfold är en öppen källkod, självhostad webbapplikation för att hantera en samling 3D-modeller, särskilt inriktad på 3D-utskrift.
    tr_TR: Manyfold, özellikle 3D baskıya odaklanmış, 3D model koleksiyonunu yönetmek için kullanılan açık kaynaklı, kendi sunucunuzda barındırabileceğiniz bir web uygulamasıdır.
    zh_CN: Manyfold 是一款开源、可自行托管的网页应用，用于管理 3D 模型收藏，特别关注 3D 打印用途。
    zh_TW: Manyfold 是一款開源、可自行託管的網頁應用，用於管理 3D 模型收藏，特別關注 3D 列印用途。
