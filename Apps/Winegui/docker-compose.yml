name: linuxserver-winegui
services:
  app:
    image: linuxserver/winegui:4.4.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: WineGUI is a user-interface friendly Wine manager that provides a graphical frontend for creating and managing Wine bottles.
    ca_ES: WineGUI és un gestor de vins amb una interfície d'usuari fàcil d'utilitzar que proporciona una interface gràfica per crear i gestionar ampolles de vi.
    cs_CZ: WineGUI je uživatelsky přívětivý správce vína, který poskytuje grafické rozhraní pro vytváření a správu lahví vína.
    da_DK: WineGUI er en brugervenlig vinhåndteringssoftware, der tilbyder en grafisk brugerflade til at oprette og administrere vinflasker.
    de_DE: WineGUI ist ein benutzerfreundlicher Weinmanager, der eine grafische Benutzeroberfläche zum Erstellen und Verwalten von Weinflaschen bietet.
    el_GR: Το WineGUI είναι ένα φιλικό προς το χρήστη πρόγραμμα διαχείρισης κρασιού που παρέχει ένα γραφικό περιβάλλον για τη δημιουργία και τη διαχείριση μπουκαλιών κρασιού.
    en_GB: Winegui is a user-interface friendly Wine manager that provides a graphical frontend for creating and managing Wine bottles.
    es_ES: WineGUI es un gestor de vinos con una interfaz de usuario intuitiva que proporciona un frontend gráfico para crear y gestionar botellas de vino.
    fr_FR: WineGUI est un gestionnaire de vin convivial qui offre une interface graphique pour la création et la gestion de bouteilles de vin.
    ga_IE: Is bainisteoir fíona atá furasta le húsáid é WineGUI a sholáthraíonn comhéadan grafach chun buidéil fíona a chruthú agus a bhainistiú.
    hr_HR: WineGUI je korisnički prilagođeni program za upravljanje vinom koji pruža grafičko sučelje za stvaranje i upravljanje bocama vina.
    hu_HU: A WineGUI egy felhasználóbarát borkezelő, amely grafikus előlapot biztosít borosüvegek létrehozásához és kezeléséhez.
    it_IT: WineGUI è un gestore di Wine dall'interfaccia intuitiva che offre un'interfaccia grafica per la creazione e la gestione delle bottiglie di Wine.
    ja_JP: WineGUIは、ユーザーインターフェースに優れたワインマネージャーであり、ワインボトルの作成と管理のためのグラフィカルなフロントエンドを提供します。
    ko_KR: WineGUI는 사용자 친화적인 인터페이스의 와인 관리 프로그램으로, 와인 병을 생성하고 관리할 수 있는 그래픽 사용자 인터페이스를 제공합니다.
    ml_IN: വൈൻജിയുഐ എന്നത് ഉപയോക്തൃ-ഇന്റർഫേസ് സൗഹൃദ വൈൻ മാനേജരാണ്, ഇത് വൈൻ കുപ്പികൾ സൃഷ്ടിക്കുന്നതിനും കൈകാര്യം ചെയ്യുന്നതിനുമുള്ള ഒരു ഗ്രാഫിക്കൽ ഫ്രണ്ട്എൻഡ് നൽകുന്നു.
    nb_NO: WineGUI er en brukervennlig vinbehandler som tilbyr et grafisk grensesnitt for å lage og administrere vinflasker.
    nl_NL: WineGUI is een gebruiksvriendelijke wijnmanager die een grafische interface biedt voor het aanmaken en beheren van wijnflessen.
    pl_PL: WineGUI to przyjazny dla użytkownika menadżer wina, który zapewnia graficzny interfejs do tworzenia i zarządzania butelkami wina.
    pt_BR: WineGUI é um gerenciador de vinhos com interface amigável que oferece uma interface gráfica para criar e gerenciar garrafas de vinho.
    ro_RO: WineGUI este un manager de vinuri cu interfață ușor de utilizat, care oferă o interface grafică pentru crearea și gestionarea sticlelor de vin.
    ru_RU: WineGUI — это удобный в использовании менеджер винных бутылок, предоставляющий графический интерфейс для создания и управления винными бутылками.
    sk_SK: WineGUI je používateľsky prívetivý správca vína, ktorý poskytuje grafické rozhranie na vytváranie a správu fliaš vína.
    sv_SE: WineGUI är en användarvänlig vinhanterare som tillhandahåller ett grafiskt gränssnitt för att skapa och hantera vinflaskor.
    tr_TR: WineGUI, şarap şişeleri oluşturmak ve yönetmek için grafiksel bir arayüz sağlayan, kullanıcı dostu bir şarap yönetim aracıdır.
    zh_CN: WineGUI 是一款界面友好的 Wine 管理器，提供图形前端以创建和管理 Wine 容器环境（bottles）。
    zh_TW: WineGUI 是一款介面友好的 Wine 管理器，提供圖形前端以建立和管理 Wine 容器環境（bottles）。
