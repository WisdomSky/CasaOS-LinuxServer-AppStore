name: linuxserver-piper
services:
  app:
    image: linuxserver/piper:2.5.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PIPER_VOICE: ''
      LOCAL_ONLY: ''
      PIPER_LENGTH: ''
      PIPER_NOISE: ''
      PIPER_NOISEW: ''
      PIPER_SPEAKER: ''
      NO_STREAMING: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: PIPER_VOICE
          description:
            en_US: The Piper voice to use, in the format --
        - container: LOCAL_ONLY
          description:
            en_US: If set to true, or any other value, the container will not attempt to download models from HuggingFace and will only use locally-provided models. [OPTIONAL]
        - container: PIPER_LENGTH
          description:
            en_US: Voice speaking rate, 1.0 is default with  1.0 being slower. [OPTIONAL]
        - container: PIPER_NOISE
          description:
            en_US: Controls the variability of the voice by adding noise. Values above 1 will start to degrade audio. [OPTIONAL]
        - container: PIPER_NOISEW
          description:
            en_US: Controls the variability of speaking cadence. Values above 1 produce extreme stutters and pauses. [OPTIONAL]
        - container: PIPER_SPEAKER
          description:
            en_US: Speaker number to use if the voice supports multiple speakers. [OPTIONAL]
        - container: NO_STREAMING
          description:
            en_US: Setting to true, or any other value, will disable support for streaming audio on sentence boundaries. [OPTIONAL]
    ports:
      - target: 10200
        published: 10200
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/piper/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Piper is a fast, local neural text to speech system that sounds great and is optimized for the Raspberry Pi 4. This container provides a Wyoming protocol server for Piper.
    ca_ES: Piper és un sistema de text a veu neuronal local i ràpid que sona molt bé i està optimitzat per a la Raspberry Pi 4. Aquest contenidor proporciona un servidor de protocol Wyoming per a Piper.
    cs_CZ: Piper je rychlý, lokální neuronový systém pro převod textu na řeč, který zní skvěle a je optimalizován pro Raspberry Pi 4. Tento kontejner poskytuje server protokolu Wyoming pro Piper.
    da_DK: Piper er et hurtigt, lokalt neuralt tekst-til-tale-system, der lyder fantastisk og er optimeret til Raspberry Pi 4. Denne container leverer en Wyoming-protokolserver til Piper.
    de_DE: Piper ist ein schnelles, lokales neuronales Text-zu-Sprache-System mit hervorragender Klangqualität, das für den Raspberry Pi 4 optimiert ist. Dieser Container stellt einen Wyoming-Protokollserver für Piper bereit.
    el_GR: Το Piper είναι ένα γρήγορο, τοπικό νευρωνικό σύστημα μετατροπής κειμένου σε ομιλία που ακούγεται υπέροχα και είναι βελτιστοποιημένο για το Raspberry Pi 4. Αυτό το κοντέινερ παρέχει έναν διακομιστή πρωτοκόλλου Wyoming για το Piper.
    en_GB: Piper is a fast, local neural text to speech system that sounds great and is optimised for the Raspberry Pi 4. This container provides a Wyoming protocol server for Piper.
    es_ES: Piper es un sistema neuronal de conversión de texto a voz rápido y local que suena de maravilla y está optimizado para la Raspberry Pi 4. Este contenedor proporciona un servidor con protocolo Wyoming para Piper.
    fr_FR: Piper est un système de synthèse vocale neuronal local rapide, offrant une excellente qualité sonore et optimisé pour le Raspberry Pi 4. Ce conteneur fournit un serveur de protocole Wyoming pour Piper.
    ga_IE: Is córas téacs go hurlabhra néarach áitiúil tapa é Piper a bhfuil fuaim iontach air agus atá optamaithe don Raspberry Pi 4. Soláthraíonn an coimeádán seo freastalaí prótacail Wyoming do Piper.
    hr_HR: Piper je brzi, lokalni neuronski sustav za pretvaranje teksta u govor koji zvuči sjajno i optimiziran je za Raspberry Pi 4. Ovaj kontejner pruža Wyoming protokol poslužitelj za Piper.
    hu_HU: A Piper egy gyors, helyi neurális szövegfelolvasó rendszer, amely nagyszerűen hangzik és Raspberry Pi 4-re van optimalizálva. Ez a konténer egy Wyoming protokoll szervert biztosít a Piper számára.
    it_IT: Piper è un sistema di sintesi vocale neurale locale e veloce, con un'ottima qualità audio e ottimizzato per Raspberry Pi 4. Questo container fornisce un server di protocollo Wyoming per Piper.
    ja_JP: Piperは、高速でローカルなニューラルテキスト音声変換システムであり、優れた音質を実現し、Raspberry Pi 4向けに最適化されています。このコンテナは、Piper用のWyomingプロトコルサーバーを提供します。
    ko_KR: Piper는 빠르고 로컬 기반의 신경망 텍스트 음성 변환 시스템으로, 뛰어난 음질을 제공하며 Raspberry Pi 4에 최적화되어 있습니다. 이 컨테이너는 Piper용 Wyoming 프로토콜 서버를 제공합니다.
    ml_IN: പൈപ്പർ എന്നത് വേഗതയേറിയതും ലോക്കൽ ന്യൂറൽ ടെക്സ്റ്റ് ടു സ്പീച്ച് സിസ്റ്റവുമാണ്, അത് മികച്ചതായി തോന്നുകയും റാസ്പ്ബെറി പൈ 4-ന് വേണ്ടി ഒപ്റ്റിമൈസ് ചെയ്യുകയും ചെയ്യുന്നു. ഈ കണ്ടെയ്നർ പൈപ്പറിനായി ഒരു വ്യോമിംഗ് പ്രോട്ടോക്കോൾ സെർവർ നൽകുന്നു.
    nb_NO: Piper er et raskt, lokalt nevralt tekst-til-tale-system som høres bra ut og er optimalisert for Raspberry Pi 4. Denne containeren tilbyr en Wyoming-protokollserver for Piper.
    nl_NL: Piper is een snel, lokaal neuraal tekst-naar-spraaksysteem dat geweldig klinkt en geoptimaliseerd is voor de Raspberry Pi 4. Deze container biedt een Wyoming-protocolserver voor Piper.
    pl_PL: Piper to szybki, lokalny, neuronowy system zamiany tekstu na mowę, który brzmi świetnie i jest zoptymalizowany pod kątem Raspberry Pi 4. Ten kontener zapewnia serwer protokołu Wyoming dla Piper.
    pt_BR: Piper é um sistema neural de conversão de texto em fala rápido e local, com ótima qualidade de som e otimizado para o Raspberry Pi 4. Este contêiner fornece um servidor de protocolo Wyoming para o Piper.
    ro_RO: Piper este un sistem text-vorbire neuronal local, rapid, care sună excelent și este optimizat pentru Raspberry Pi 4. Acest container oferă un server de protocol Wyoming pentru Piper.
    ru_RU: Piper — это быстрая локальная нейронная система преобразования текста в речь, которая обеспечивает отличное качество звука и оптимизирована для Raspberry Pi 4. Этот контейнер предоставляет сервер протокола Wyoming для Piper.
    sk_SK: Piper je rýchly, lokálny neurónový systém prevodu textu na reč, ktorý znie skvele a je optimalizovaný pre Raspberry Pi 4. Tento kontajner poskytuje server protokolu Wyoming pre Piper.
    sv_SE: Piper är ett snabbt, lokalt neuralt text-till-tal-system som låter bra och är optimerat för Raspberry Pi 4. Denna container tillhandahåller en Wyoming-protokollserver för Piper.
    tr_TR: Piper, harika ses kalitesi sunan ve Raspberry Pi 4 için optimize edilmiş hızlı, yerel bir sinirsel metinden sese dönüştürme sistemidir. Bu konteyner, Piper için bir Wyoming protokol sunucusu sağlar.
    zh_CN: Piper 是一个快速、本地运行的神经网络文字转语音系统，声音效果出色，并针对树莓派 4 优化。此容器为 Piper 提供 Wyoming 协议服务器。
    zh_TW: Piper 是一個快速、本地執行的神經網路文字轉語音系統，聲音效果出色，並針對樹莓派 4 最佳化。此容器為 Piper 提供 Wyoming 協議伺服器。
