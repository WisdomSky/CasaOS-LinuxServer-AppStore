    zh_TW: |-
      Nntp2nntp 代理允許多個系統共享 NNTP 賬戶，各系統可使用獨立的使用者名稱和密碼。它完整支援 SSL，也可透過 SSL 證書限制代理訪問。該代理簡單且快速。警告：雖然未發現已知安全問題，但上游程式碼自上游註明的 06.08.15 以來未有更新，專案很可能已被永久棄置。因此強烈建議不要將其暴露到公網；如必須公開訪問，額外安全防護和 SSL 應作為最低要求。其主要用途是在區域網內，讓各個 NNTP 應用共享一組內部憑據，並集中管理上游賬戶，例如透過一次全域性配置變更切換服務商、伺服器或連線執行緒限制。

      訪問專案主頁：https://hub.docker.com/r/linuxserver/nntp2nntp/
  tagline:
    en_US: 'Proxy allow you to use your NNTP Account from multiple systems, each with own user name and password. It fully supports SSL and you can also limit the access to proxy with SSL certificates. Nntp2nntp proxy is very simple and pretty fast. ## Warning Whilst we know of no nntp2nntp security issues the upstream code for this project has received no changes since 06. 08. 15 and is likely abandoned permanently. For this reason we strongly recommend you do not make this application public facing and if you must do so other layers of security and SSL should be considered an absolute bare minimum requirement. We see this proxy being used primarily on a LAN so that all the users NNTP applications can share a common set of internal credentials allowing for central managment of the upstream account e. G change provider, server, thread limits for all applications with one global config change.'
    zh_CN: 让多个系统通过独立凭据共享 NNTP 账户。
    ca_ES: 'El proxy us permet utilitzar el vostre compte NNTP des de diversos sistemes, cadascun amb el seu propi nom d''usuari i contrasenya. És totalment compatible amb SSL i també podeu limitar l''accés al proxy amb certificats SSL. El proxy Nntp2nntp és molt senzill i força ràpid. ## Avís Tot i que no coneixem cap problema de seguretat amb nntp2nntp, el codi principal d''aquest projecte no ha rebut canvis des del 06/08/15 i probablement s''ha abandonat permanentment. Per aquest motiu, us recomanem fermament que no feu que aquesta aplicació sigui pública i, si ho heu de fer, altres capes de seguretat i SSL s''haurien de considerar un requisit mínim absolut. Veiem que aquest proxy s''utilitza principalment en una LAN perquè totes les aplicacions NNTP dels usuaris puguin compartir un conjunt comú de credencials internes que permeten la gestió central del compte principal, és a dir, canviar el proveïdor, el servidor i els límits de fils per a totes les aplicacions amb un únic canvi de configuració global.'
    cs_CZ: 'Proxy vám umožňuje používat váš NNTP účet z více systémů, každý s vlastním uživatelským jménem a heslem. Plně podporuje SSL a můžete také omezit přístup k proxy pomocí SSL certifikátů. Proxy Nntp2nntp je velmi jednoduchý a poměrně rychlý. ## Varování I když nevíme o žádných bezpečnostních problémech s nntp2nntp, upstream kód tohoto projektu se od 6. 8. 2015 nijak nezměnil a pravděpodobně bude trvale opuštěn. Z tohoto důvodu důrazně doporučujeme, abyste tuto aplikaci nezpřístupňovali veřejnosti, a pokud tak musíte učinit, měly by být další vrstvy zabezpečení a SSL považovány za absolutní minimum. Předpokládáme, že tento proxy se používá primárně v místní síti LAN, aby všichni uživatelé aplikací NNTP mohli sdílet společnou sadu interních přihlašovacích údajů, což umožňuje centrální správu upstreamového účtu, např. změnu poskytovatele, serveru a limitů vláken pro všechny aplikace jednou globální změnou konfigurace.'
    da_DK: 'En proxy giver dig mulighed for at bruge din NNTP-konto fra flere systemer, hvert med dit eget brugernavn og din adgangskode. Den understøtter fuldt ud SSL, og du kan også begrænse adgangen til proxy med SSL-certifikater. Nntp2nntp proxy er meget enkel og ret hurtig. ## Advarsel Selvom vi ikke kender til nntp2nntp-sikkerhedsproblemer, har upstream-koden til dette projekt ikke modtaget nogen ændringer siden 06.08.15 og er sandsynligvis permanent opgivet. Af denne grund anbefaler vi kraftigt, at du ikke gør denne applikation offentligt tilgængelig, og hvis du er nødt til at gøre det, bør andre sikkerhedslag, og SSL, betragtes som et absolut minimumskrav. Vi ser denne proxy primært blive brugt på et LAN, så alle brugernes NNTP-applikationer kan dele et fælles sæt interne legitimationsoplysninger, hvilket muliggør central administration af upstream-kontoen, f.eks. ændring af udbyder-, server- og trådgrænser for alle applikationer med én global konfigurationsændring.'
    de_DE: 'Mit dem Proxy können Sie Ihr NNTP-Konto von mehreren Systemen aus nutzen, jedes mit eigenem Benutzernamen und Passwort. Er unterstützt SSL vollständig und ermöglicht es Ihnen, den Zugriff auf den Proxy mithilfe von SSL-Zertifikaten einzuschränken. Der Nntp2nntp-Proxy ist sehr einfach und schnell. ## Warnung: Obwohl uns keine Sicherheitsprobleme im Zusammenhang mit nntp2nntp bekannt sind, wurde der Quellcode dieses Projekts seit dem 06.08.2015 nicht mehr geändert und wird wahrscheinlich nicht mehr weiterentwickelt. Aus diesem Grund raten wir dringend davon ab, diese Anwendung öffentlich zugänglich zu machen. Sollte dies dennoch unumgänglich sein, müssen zusätzliche Sicherheitsebenen und SSL als absolute Mindestvoraussetzung gelten. Wir gehen davon aus, dass dieser Proxy primär in einem LAN eingesetzt wird, sodass alle NNTP-Anwendungen der Benutzer gemeinsame interne Anmeldeinformationen nutzen können. Dies ermöglicht die zentrale Verwaltung des Quellkontos, z. B. die Änderung von Anbieter, Server und Thread-Limits für alle Anwendungen mit einer einzigen globalen Konfigurationsänderung.'
    el_GR: 'Ο διακομιστής μεσολάβησης σάς επιτρέπει να χρησιμοποιείτε τον λογαριασμό NNTP σας από πολλά συστήματα, το καθένα με το δικό του όνομα χρήστη και κωδικό πρόσβασης. Υποστηρίζει πλήρως SSL και μπορείτε επίσης να περιορίσετε την πρόσβαση στον διακομιστή μεσολάβησης με πιστοποιητικά SSL. Ο διακομιστής μεσολάβησης Nntp2nntp είναι πολύ απλός και αρκετά γρήγορος. ## Προειδοποίηση: Ενώ δεν γνωρίζουμε προβλήματα ασφαλείας για τον nntp2nntp, ο κώδικας upstream για αυτό το έργο δεν έχει αλλάξει από τις 06.08.15 και πιθανότατα έχει εγκαταλειφθεί οριστικά. Για αυτόν τον λόγο, σας συνιστούμε ανεπιφύλακτα να μην κάνετε αυτήν την εφαρμογή δημόσια και, εάν πρέπει να το κάνετε, άλλα επίπεδα ασφάλειας και το SSL θα πρέπει να θεωρούνται ως η ελάχιστη απαιτούμενη απαίτηση. Βλέπουμε αυτόν τον διακομιστή μεσολάβησης να χρησιμοποιείται κυρίως σε τοπικό δίκτυο (LAN), έτσι ώστε όλες οι εφαρμογές NNTP των χρηστών να μπορούν να μοιράζονται ένα κοινό σύνολο εσωτερικών διαπιστευτηρίων που επιτρέπουν την κεντρική διαχείριση του λογαριασμού upstream, π.χ. αλλαγή παρόχου, διακομιστή, ορίων νημάτων για όλες τις εφαρμογές με μία καθολική αλλαγή διαμόρφωσης.'
    en_GB: 'Proxy allow you to use your Nntp Account from multiple systems, each with own user name and password. It fully supports Ssl and you can also limit the access to proxy with Ssl certificates. Nntp2nntp proxy is very simple and pretty fast. ## Warning Whilst we know of no nntp2nntp security issues the upstream code for this project has received no changes since 06. 08. 15 and is likely abandoned permanently. For this reason we strongly recommend you do not make this application public facing and if you must do so other layers of security and Ssl should be considered an absolute bare minimum requirement. We see this proxy being used primarily on a Lan so that all the users Nntp applications can share a common set of internal credentials allowing for central managment of the upstream account e. G change provider, server, thread limits for all applications with one global config change.'
    es_ES: 'El proxy le permite usar su cuenta NNTP desde múltiples sistemas, cada uno con su propio nombre de usuario y contraseña. Es totalmente compatible con SSL y también puede limitar el acceso al proxy con certificados SSL. El proxy Nntp2nntp es muy simple y bastante rápido. ## Advertencia Si bien no conocemos problemas de seguridad de nntp2nntp, el código fuente de este proyecto no ha recibido cambios desde el 06/08/15 y es probable que esté abandonado permanentemente. Por esta razón, recomendamos encarecidamente que no haga que esta aplicación sea accesible al público y, si debe hacerlo, otras capas de seguridad y SSL deben considerarse un requisito mínimo absoluto. Vemos que este proxy se usa principalmente en una LAN para que todas las aplicaciones NNTP de los usuarios puedan compartir un conjunto común de credenciales internas que permitan la administración centralizada de la cuenta fuente, por ejemplo, cambiar el proveedor, el servidor, los límites de subprocesos para todas las aplicaciones con un cambio de configuración global.'
    fr_FR: 'Le proxy vous permet d''utiliser votre compte NNTP depuis plusieurs systèmes, chacun avec son propre nom d''utilisateur et mot de passe. Il prend entièrement en charge SSL et vous pouvez également limiter l''accès au proxy à l''aide de certificats SSL. Le proxy Nntp2nntp est très simple et rapide. ## Avertissement Bien que nous n''ayons connaissance d''aucun problème de sécurité concernant nntp2nntp, le code source de ce projet n''a subi aucune modification depuis le 06/08/2015 et est probablement abandonné définitivement. Pour cette raison, nous vous recommandons vivement de ne pas rendre cette application accessible publiquement. Si vous devez le faire, d''autres couches de sécurité et le protocole SSL doivent être considérés comme un minimum absolu. Nous constatons que ce proxy est principalement utilisé sur un réseau local (LAN) afin que toutes les applications NNTP des utilisateurs puissent partager un ensemble commun d''identifiants internes, permettant ainsi une gestion centralisée du compte source (par exemple, modifier le fournisseur, le serveur et les limites de threads pour toutes les applications) via une seule modification de configuration globale.'
    ga_IE: 'Ligeann seachfhreastalaí duit do Chuntas NNTP a úsáid ó ilchórais, agus ainm úsáideora agus pasfhocal féin ag gach ceann acu. Tacaíonn sé go hiomlán le SSL agus is féidir leat rochtain ar sheachfhreastalaí a theorannú freisin le teastais SSL. Tá seachfhreastalaí Nntp2nntp an-simplí agus sách gasta. ## Rabhadh Cé nach bhfuil a fhios againn faoi aon saincheisteanna slándála nntp2nntp, níor athraíodh aon chód uas-srutha an tionscadail seo ó 06.08.15 agus is dócha go tréigtear go buan é. Ar an gcúis seo, molaimid go láidir duit gan an feidhmchlár seo a dhéanamh os comhair an phobail agus, más gá duit é sin a dhéanamh, ba cheart sraitheanna eile slándála agus SSL a mheas mar an riachtanas íosta. Feicimid an seachfhreastalaí seo á úsáid go príomha ar LAN ionas gur féidir le gach feidhmchlár NNTP d''úsáideoirí sraith choiteann dintiúir inmheánacha a roinnt rud a ligeann do bhainistiú lárnach an chuntais uas-srutha m.sh. Athraigh teorainneacha soláthraí, freastalaí, snáithe do gach feidhmchlár le hathrú cumraíochta domhanda amháin.'
    hr_HR: 'Proxy vam omogućuje korištenje vašeg NNTP računa s više sustava, svaki s vlastitim korisničkim imenom i lozinkom. U potpunosti podržava SSL, a također možete ograničiti pristup proxyju pomoću SSL certifikata. Nntp2nntp proxy je vrlo jednostavan i prilično brz. ## Upozorenje Iako ne znamo nikakve sigurnosne probleme s nntp2nntp, uzvodni kod za ovaj projekt nije pretrpio nikakve promjene od 06.08.2015. i vjerojatno je trajno napušten. Iz tog razloga toplo preporučujemo da ovu aplikaciju ne učinite javno dostupnom, a ako to morate učiniti, drugi slojevi sigurnosti i SSL trebali bi se smatrati apsolutnim minimalnim zahtjevom. Vidimo da se ovaj proxy prvenstveno koristi na LAN-u kako bi svi korisnici NNTP aplikacija mogli dijeliti zajednički skup internih vjerodajnica što omogućuje centralno upravljanje uzvodnim računom, npr. promjena davatelja usluga, poslužitelja, ograničenja niti za sve aplikacije s jednom globalnom promjenom konfiguracije.'
    hu_HU: 'A proxy lehetővé teszi, hogy NNTP-fiókját több rendszerről is használja, mindegyiket saját felhasználónévvel és jelszóval. Teljes mértékben támogatja az SSL-t, és SSL-tanúsítványokkal korlátozhatja a proxyhoz való hozzáférést is. Az Nntp2nntp proxy nagyon egyszerű és meglehetősen gyors. ## Figyelmeztetés Bár nem tudunk nntp2nntp biztonsági problémákról, a projekt upstream kódja 2015.06.08. óta nem változott, és valószínűleg végleg elhagyják. Emiatt határozottan javasoljuk, hogy ne tegye ezt az alkalmazást nyilvánossá, és ha mégis meg kell tennie, a biztonsági rétegek és az SSL használata abszolút minimumkövetelménynek tekinthető. Úgy látjuk, hogy ezt a proxyt elsősorban helyi hálózaton használják, így az összes felhasználó és az NNTP-alkalmazás közös belső hitelesítő adatokat oszthat meg, lehetővé téve az upstream fiók központi kezelését, pl. G. Módosítsa a szolgáltatót, a szervert, a szálkorlátokat az összes alkalmazás számára egyetlen globális konfigurációs változtatással.'
    it_IT: 'Il proxy consente di utilizzare il proprio account NNTP da più sistemi, ognuno con nome utente e password propri. Supporta completamente SSL ed è possibile limitare l''accesso al proxy tramite certificati SSL. Il proxy Nntp2nntp è molto semplice e piuttosto veloce. ## Avvertenza Sebbene non siamo a conoscenza di problemi di sicurezza relativi a nntp2nntp, il codice sorgente di questo progetto non ha ricevuto modifiche dal 06/08/2015 ed è probabilmente stato abbandonato definitivamente. Per questo motivo, raccomandiamo vivamente di non rendere questa applicazione accessibile pubblicamente e, qualora fosse necessario farlo, ulteriori livelli di sicurezza e l''utilizzo di SSL dovrebbero essere considerati un requisito minimo assoluto. Prevediamo che questo proxy venga utilizzato principalmente su una LAN, in modo che tutte le applicazioni NNTP degli utenti possano condividere un set comune di credenziali interne, consentendo la gestione centralizzata dell''account sorgente, ad esempio la modifica del provider, del server e dei limiti di thread per tutte le applicazioni con una singola modifica della configurazione globale.'
    ja_JP: プロキシを使用すると、それぞれ独自のユーザー名とパスワードを持つ複数のシステムから NNTP アカウントを使用できます。SSL を完全にサポートしており、SSL 証明書を使用してプロキシへのアクセスを制限することもできます。Nntp2nntp プロキシは非常にシンプルで高速です。## 警告 nntp2nntp のセキュリティ上の問題は認識していませんが、このプロジェクトのアップストリーム コードは 06. 08. 15 以降変更されておらず、永久に放棄されている可能性があります。このため、このアプリケーションを公開しないことを強くお勧めします。公開する必要がある場合は、他のセキュリティ レイヤーと SSL を最低限の要件として考慮する必要があります。このプロキシは主に LAN で使用されることを想定しており、すべてのユーザーの NNTP アプリケーションが共通の内部認証情報を共有して、アップストリーム アカウントを一元管理できるようにします (たとえば、1 つのグローバル構成変更ですべてのアプリケーションのプロバイダー、サーバー、スレッド制限を変更できます)。
    ko_KR: '이 프록시를 사용하면 여러 시스템에서 각각 다른 사용자 이름과 비밀번호로 NNTP 계정을 사용할 수 있습니다. SSL을 완벽하게 지원하며 SSL 인증서를 사용하여 프록시 접근을 제한할 수도 있습니다. Nntp2nntp 프록시는 매우 간단하고 속도도 빠릅니다. ## 경고: Nntp2nntp 자체의 보안 문제는 아직 알려지지 않았지만, 이 프로젝트의 원본 코드는 2015년 8월 6일 이후로 변경되지 않았으며 영구적으로 개발이 중단되었을 가능성이 높습니다. 따라서 이 애플리케이션을 공개적으로 사용하지 않는 것이 좋으며, 부득이하게 공개해야 하는 경우 다른 보안 계층과 SSL을 최소 요구 사항으로 고려해야 합니다. 이 프록시는 주로 LAN 환경에서 사용되어 모든 NNTP 애플리케이션 사용자가 공통된 내부 자격 증명을 공유하고, 하나의 전역 설정 변경으로 모든 애플리케이션의 공급자, 서버, 스레드 제한 등을 중앙에서 관리할 수 있도록 하는 데 유용할 것으로 예상됩니다.'
    ml_IN: 'ഒന്നിലധികം സിസ്റ്റങ്ങളിൽ നിന്ന് നിങ്ങളുടെ NNTP അക്കൗണ്ട് ഉപയോഗിക്കാൻ പ്രോക്സി നിങ്ങളെ അനുവദിക്കുന്നു, ഓരോന്നിനും അതിന്റേതായ ഉപയോക്തൃനാമവും പാസ്‌വേഡും ഉണ്ട്. ഇത് SSL-നെ പൂർണ്ണമായും പിന്തുണയ്ക്കുന്നു, കൂടാതെ SSL സർട്ടിഫിക്കറ്റുകൾ ഉപയോഗിച്ച് നിങ്ങൾക്ക് പ്രോക്സിയിലേക്കുള്ള ആക്‌സസ് പരിമിതപ്പെടുത്താനും കഴിയും. Nntp2nntp പ്രോക്സി വളരെ ലളിതവും വളരെ വേഗതയുള്ളതുമാണ്. ## മുന്നറിയിപ്പ് nntp2nntp സുരക്ഷാ പ്രശ്‌നങ്ങളൊന്നും ഞങ്ങൾക്കറിയാമെങ്കിലും, ഈ പ്രോജക്റ്റിനായുള്ള അപ്‌സ്ട്രീം കോഡിന് 06. 08. 15 മുതൽ മാറ്റങ്ങളൊന്നും ലഭിച്ചിട്ടില്ല, അത് ശാശ്വതമായി ഉപേക്ഷിക്കപ്പെടാൻ സാധ്യതയുണ്ട്. ഇക്കാരണത്താൽ, ഈ ആപ്ലിക്കേഷൻ പബ്ലിക് ഫെയ്‌സിംഗ് ആക്കരുതെന്ന് ഞങ്ങൾ ശക്തമായി ശുപാർശ ചെയ്യുന്നു, നിങ്ങൾ അങ്ങനെ ചെയ്യേണ്ടിവന്നാൽ മറ്റ് സുരക്ഷാ പാളികളും SSL-ഉം ഒരു കേവല മിനിമം ആവശ്യകതയായി കണക്കാക്കണം. എല്ലാ ഉപയോക്താക്കൾക്കും NNTP ആപ്ലിക്കേഷനുകൾക്ക് അപ്‌സ്ട്രീം അക്കൗണ്ടിന്റെ കേന്ദ്ര മാനേജ്‌മെന്റ് അനുവദിക്കുന്ന ഒരു പൊതു ആന്തരിക ക്രെഡൻഷ്യലുകൾ പങ്കിടാൻ കഴിയുന്ന തരത്തിൽ ഈ പ്രോക്സി പ്രധാനമായും ഒരു LAN-ൽ ഉപയോഗിക്കുന്നതായി ഞങ്ങൾ കാണുന്നു. ഒരു ആഗോള കോൺഫിഗറേഷൻ മാറ്റത്തോടെ എല്ലാ ആപ്ലിക്കേഷനുകൾക്കും G മാറ്റുക ദാതാവ്, സെർവർ, ത്രെഡ് പരിധികൾ.'
    nb_NO: 'Med en proxy kan du bruke NNTP-kontoen din fra flere systemer, hvert med eget brukernavn og passord. Den støtter SSL fullt, og du kan også begrense tilgangen til proxy med SSL-sertifikater. Nntp2nntp proxy er veldig enkel og ganske rask. ## Advarsel Selv om vi ikke kjenner til noen nntp2nntp-sikkerhetsproblemer, har oppstrømskoden for dette prosjektet ikke blitt endret siden 06.08.15 og er sannsynligvis forlatt permanent. Av denne grunn anbefaler vi på det sterkeste at du ikke gjør denne applikasjonen offentlig rettet, og hvis du må gjøre det, bør andre sikkerhetslag og SSL betraktes som et absolutt minimumskrav. Vi ser at denne proxyen primært brukes på et LAN, slik at alle brukernes NNTP-applikasjoner kan dele et felles sett med interne legitimasjonsoplysninger, noe som gir sentral administrasjon av oppstrømskontoen, f.eks. endre leverandør-, server- og trådgrenser for alle applikasjoner med én global konfigurasjonsendring.'
    nl_NL: 'Met een proxy kunt u uw NNTP-account vanaf meerdere systemen gebruiken, elk met een eigen gebruikersnaam en wachtwoord. Het biedt volledige ondersteuning voor SSL en u kunt de toegang tot de proxy ook beperken met SSL-certificaten. De Nntp2nntp-proxy is erg eenvoudig en behoorlijk snel. ## Waarschuwing Hoewel we geen beveiligingsproblemen met nntp2nntp kennen, is de upstream-code voor dit project sinds 06-08-2015 niet meer gewijzigd en is deze waarschijnlijk permanent verlaten. Om deze reden raden we u ten zeerste af om deze applicatie openbaar toegankelijk te maken. Mocht u dit toch doen, dan dienen andere beveiligingslagen en SSL als absolute minimumvereiste te worden beschouwd. We verwachten dat deze proxy voornamelijk op een LAN zal worden gebruikt, zodat alle NNTP-applicaties van de gebruikers een gemeenschappelijke set interne inloggegevens kunnen delen. Dit maakt centraal beheer van het upstream-account mogelijk, bijvoorbeeld het wijzigen van provider, server en threadlimieten voor alle applicaties met één globale configuratiewijziging.'
    pl_PL: 'Serwer proxy pozwala na korzystanie z konta NNTP z wielu systemów, każdy z własną nazwą użytkownika i hasłem. W pełni obsługuje protokół SSL, a dostęp do serwera proxy można ograniczyć za pomocą certyfikatów SSL. Serwer proxy nntp2nntp jest bardzo prosty i dość szybki. ## Ostrzeżenie Chociaż nie znamy żadnych problemów z bezpieczeństwem nntp2nntp, kod źródłowy tego projektu nie został zmieniony od 06.08.15 i prawdopodobnie został porzucony na stałe. Z tego powodu zdecydowanie zalecamy, aby nie udostępniać tej aplikacji publicznie, a jeśli musisz to zrobić, inne warstwy zabezpieczeń i protokół SSL powinny być uznane za absolutne minimum. Widzimy, że ten serwer proxy jest używany głównie w sieci LAN, aby wszystkie aplikacje NNTP użytkowników mogły współdzielić wspólny zestaw wewnętrznych poświadczeń, umożliwiając centralne zarządzanie kontem źródłowym, np. Zmień dostawcę, serwer, limity wątków dla wszystkich aplikacji za pomocą jednej globalnej zmiany konfiguracji.'
    pt_BR: 'O proxy permite que você use sua conta NNTP em vários sistemas, cada um com seu próprio nome de usuário e senha. Ele oferece suporte completo a SSL e você também pode limitar o acesso ao proxy com certificados SSL. O proxy Nntp2nntp é muito simples e bastante rápido. ## Aviso Embora não tenhamos conhecimento de problemas de segurança no nntp2nntp, o código upstream deste projeto não recebeu alterações desde 06/08/2015 e provavelmente foi abandonado permanentemente. Por esse motivo, recomendamos fortemente que você não torne este aplicativo público e, se precisar fazê-lo, outras camadas de segurança e SSL devem ser consideradas um requisito mínimo absoluto. Vemos este proxy sendo usado principalmente em uma LAN para que todos os aplicativos NNTP dos usuários possam compartilhar um conjunto comum de credenciais internas, permitindo o gerenciamento centralizado da conta upstream, por exemplo, alterando o provedor, o servidor e os limites de threads para todos os aplicativos com uma única alteração de configuração global.'
    ro_RO: 'Proxy-ul vă permite să utilizați contul NNTP de pe mai multe sisteme, fiecare cu propriul nume de utilizator și parolă. Acceptă pe deplin SSL și puteți, de asemenea, limita accesul la proxy cu certificate SSL. Proxy-ul Nntp2nntp este foarte simplu și destul de rapid. ## Atenție Deși nu cunoaștem probleme de securitate nntp2nntp, codul upstream pentru acest proiect nu a suferit modificări din 06.08.2015 și probabil este abandonat definitiv. Din acest motiv, vă recomandăm insistent să nu faceți această aplicație publică și, dacă este necesar, alte niveluri de securitate, iar SSL ar trebui considerate o cerință minimă absolută. Vedem că acest proxy este utilizat în principal într-o rețea LAN, astfel încât toate aplicațiile NNTP ale utilizatorilor să poată partaja un set comun de acreditări interne, permițând gestionarea centralizată a contului upstream, de exemplu, schimbarea furnizorului, serverului, limitelor thread-urilor pentru toate aplicațiile cu o singură modificare globală de configurație.'
    ru_RU: 'Прокси позволяет использовать вашу учетную запись NNTP с нескольких систем, каждая со своим именем пользователя и паролем. Он полностью поддерживает SSL, и вы также можете ограничить доступ к прокси с помощью SSL-сертификатов. Прокси Nntp2nntp очень прост и достаточно быстр. ## Предупреждение. Хотя нам неизвестно о каких-либо проблемах безопасности nntp2nntp, исходный код этого проекта не претерпел изменений с 06.08.15 и, вероятно, навсегда заброшен. По этой причине мы настоятельно рекомендуем не делать это приложение общедоступным, и если вам это необходимо, другие уровни безопасности и SSL следует рассматривать как абсолютное минимальное требование. Мы видим, что этот прокси будет использоваться в основном в локальной сети, чтобы все приложения NNTP пользователей могли совместно использовать общий набор внутренних учетных данных, что позволит централизованно управлять учетной записью, например, изменять поставщика, сервер, ограничения потоков для всех приложений одним глобальным изменением конфигурации.'
    sk_SK: 'Proxy vám umožňuje používať váš NNTP účet z viacerých systémov, pričom každý má vlastné používateľské meno a heslo. Plne podporuje SSL a prístup k proxy môžete obmedziť pomocou SSL certifikátov. Proxy Nntp2nntp je veľmi jednoduchý a pomerne rýchly. ## Upozornenie: Hoci nepoznáme žiadne bezpečnostné problémy s nntp2nntp, upstream kód pre tento projekt sa od 6. 8. 2015 nezmenil a pravdepodobne bude natrvalo opustený. Z tohto dôvodu dôrazne odporúčame, aby ste túto aplikáciu nesprístupnili verejnosti, a ak to musíte urobiť, mali by ste považovať ďalšie vrstvy zabezpečenia a SSL za absolútne minimálne požiadavky. Tento proxy sa používa predovšetkým v lokálnej sieti LAN, aby všetci používatelia NNTP aplikácií mohli zdieľať spoločnú sadu interných prihlasovacích údajov, čo umožňuje centrálnu správu upstream účtu, napr. zmenu poskytovateľa, servera a limitov vlákien pre všetky aplikácie jednou globálnou zmenou konfigurácie.'
    sv_SE: 'Med en proxy kan du använda ditt NNTP-konto från flera system, vart och ett med eget användarnamn och lösenord. Den stöder SSL fullt ut och du kan också begränsa åtkomsten till proxy med SSL-certifikat. Nntp2nntp-proxy är mycket enkel och ganska snabb. ## Varning: Även om vi inte känner till några nntp2nntp-säkerhetsproblem har uppströmskoden för detta projekt inte ändrats sedan 06.08.15 och är troligen övergiven permanent. Av denna anledning rekommenderar vi starkt att du inte gör den här applikationen offentlig, och om du måste göra det bör andra säkerhetslager och SSL betraktas som ett absolut minimikrav. Vi ser att denna proxy främst används på ett LAN så att alla användares NNTP-applikationer kan dela en gemensam uppsättning interna autentiseringsuppgifter, vilket möjliggör central hantering av uppströmskontot, t.ex. ändra leverantör, server, trådgränser för alla applikationer med en global konfigurationsändring.'
    tr_TR: 'Proxy, NNTP hesabınızı her biri kendi kullanıcı adı ve şifresiyle birden fazla sistemden kullanmanıza olanak tanır. SSL''yi tamamen destekler ve proxy''ye erişimi SSL sertifikalarıyla da sınırlayabilirsiniz. Nntp2nntp proxy çok basit ve oldukça hızlıdır. ## Uyarı Herhangi bir nntp2nntp güvenlik sorunu bilmesek de, bu projenin ana kodunda 06.08.2015 tarihinden beri hiçbir değişiklik yapılmamıştır ve muhtemelen kalıcı olarak terk edilmiştir. Bu nedenle, bu uygulamayı herkese açık hale getirmemenizi şiddetle tavsiye ederiz ve eğer bunu yapmanız gerekiyorsa, diğer güvenlik katmanları ve SSL''nin mutlak asgari gereksinim olarak kabul edilmesi gerektiğini belirtiriz. Bu proxy''nin öncelikle bir LAN''da kullanılacağını düşünüyoruz, böylece tüm kullanıcıların NNTP uygulamaları, ana hesabın merkezi yönetimini sağlayan ortak bir iç kimlik bilgisi kümesini paylaşabilir; örneğin, tüm uygulamalar için sağlayıcı, sunucu, iş parçacığı sınırlarını tek bir genel yapılandırma değişikliğiyle değiştirebilirsiniz.'
