name: linuxserver-nntp2nntp
services:
  app:
    image: linuxserver/nntp2nntp:0.3.20230704
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: PUID
          description:
            en_US: specify your UID
        - container: PGID
          description:
            en_US: specify your GID
      volumes:
        - container: /config
          description:
            en_US: appdata
      ports:
        - container: '1563'
          description:
            en_US: Proxy Port
    ports:
      - target: 1563
        published: 1563
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nntp2nntp/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Visit homepage: https://hub.docker.com/r/linuxserver/nntp2nntp/'
    zh_CN: |-
      Nntp2nntp 代理允许多个系统共享 NNTP 账户，各系统可使用独立的用户名和密码。它完整支持 SSL，也可通过 SSL 证书限制代理访问。该代理简单且快速。警告：虽然未发现已知安全问题，但上游代码自上游注明的 06.08.15 以来未有更新，项目很可能已被永久弃置。因此强烈建议不要将其暴露到公网；如必须公开访问，额外安全防护和 SSL 应作为最低要求。其主要用途是在局域网内，让各个 NNTP 应用共享一组内部凭据，并集中管理上游账户，例如通过一次全局配置变更切换服务商、服务器或连接线程限制。

      访问项目主页：https://hub.docker.com/r/linuxserver/nntp2nntp/
