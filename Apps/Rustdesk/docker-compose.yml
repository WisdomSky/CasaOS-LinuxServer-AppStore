name: linuxserver-rustdesk
services:
  app:
    image: linuxserver/rustdesk:1.4.9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: RustDesk is a full-featured open source remote control alternative for self-hosting and security with minimal configuration.
    ca_ES: RustDesk és una alternativa de control remot de codi obert amb totes les funcions per a l'autoallotjament i la seguretat amb una configuració mínima.
    cs_CZ: RustDesk je plně vybavená open source alternativa pro vzdálené ovládání pro vlastní hosting a zabezpečení s minimální konfigurací.
    da_DK: RustDesk er et fuldt udstyret open source fjernbetjeningsalternativ til selvhosting og sikkerhed med minimal konfiguration.
    de_DE: RustDesk ist eine voll ausgestattete Open-Source-Fernsteuerungsalternative für Selbsthosting und Sicherheit mit minimalem Konfigurationsaufwand.
    el_GR: Το RustDesk είναι μια πλήρως λειτουργική εναλλακτική λύση τηλεχειρισμού ανοιχτού κώδικα για αυτο-φιλοξενία και ασφάλεια με ελάχιστη διαμόρφωση.
    en_GB: Rustdesk is a full-featured open source remote control alternative for self-hosting and security with minimal configuration.
