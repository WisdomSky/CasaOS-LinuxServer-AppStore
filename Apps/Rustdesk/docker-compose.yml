    ro_RO: RustDesk este o alternativă completă de control de la distanță open source pentru auto-găzduire și securitate cu o configurare minimă.
    ru_RU: RustDesk — это полнофункциональная альтернатива с открытым исходным кодом для удаленного управления, обеспечивающая самостоятельный хостинг и безопасность при минимальной настройке.
    sk_SK: RustDesk je plne funkčná alternatíva diaľkového ovládania s otvoreným zdrojovým kódom pre vlastný hosting a zabezpečenie s minimálnou konfiguráciou.
    sv_SE: RustDesk är ett fullfjädrat öppen källkodsalternativ för fjärrkontroll för självhosting och säkerhet med minimal konfiguration.
    tr_TR: RustDesk, minimum yapılandırmayla kendi sunucunuzda barındırma ve güvenlik için tam özellikli, açık kaynaklı bir uzaktan kontrol alternatifidir.
