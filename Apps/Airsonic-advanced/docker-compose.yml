    ru_RU: Бесплатный веб-сервис для потоковой передачи мультимедиа, обеспечивающий повсеместный доступ к вашей музыке. Используйте его, чтобы делиться музыкой с друзьями или слушать свою музыку на работе. Вы можете одновременно транслировать музыку на несколько плееров, например, на один плеер на кухне и на другой в гостиной.
    sk_SK: Bezplatný webový streamer médií, ktorý poskytuje všadeprítomný prístup k vašej hudbe. Použite ho na zdieľanie hudby s priateľmi alebo na počúvanie vlastnej hudby počas práce. Môžete streamovať do viacerých prehrávačov súčasne, napríklad do jedného prehrávača v kuchyni a do druhého v obývačke.
    sv_SE: En gratis, webbaserad mediaströmmare som ger dig obegränsad tillgång till din musik. Använd den för att dela din musik med vänner eller lyssna på din egen musik på jobbet. Du kan streama till flera spelare samtidigt, till exempel till en spelare i köket och en annan i vardagsrummet.
    tr_TR: Ücretsiz, web tabanlı bir medya oynatıcısı olan bu uygulama, müziğinize her yerden erişim sağlar. Müziğinizi arkadaşlarınızla paylaşmak veya işteyken kendi müziğinizi dinlemek için kullanabilirsiniz. Örneğin, mutfağınızdaki bir oynatıcıya ve oturma odanızdaki başka bir oynatıcıya aynı anda yayın yapabilirsiniz.
    zh_CN: 通过网页随时访问和分享音乐。
    zh_TW: 透過網頁隨時訪問和分享音樂。
