name: linuxserver-airsonic-advanced
services:
  app:
    image: linuxserver/airsonic-advanced:11.1.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
      JAVA_OPTS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: CONTEXT_PATH
          description:
            en_US: For setting url-base in reverse proxy setups. [OPTIONAL]
        - container: JAVA_OPTS
          description:
            en_US: For passing additional java options. [OPTIONAL]
    ports:
      - target: 4040
        published: 4040
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/airsonic-advanced/config
        target: /config
      - type: bind
        source: /DATA/AppData/airsonic-advanced/music
        target: /music
      - type: bind
        source: /DATA/AppData/airsonic-advanced/playlists
        target: /playlists
      - type: bind
        source: /DATA/AppData/airsonic-advanced/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/airsonic-advanced/media
        target: /media
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Airsonic-advanced is a free, web-based media streamer, providing ubiquitious access to your music. Use it to share your music with friends, or to listen to your own music while at work. You can stream to multiple players simultaneously, for instance to one player in your kitchen and another in your living room.
    ca_ES: Airsonic-advanced és un reproductor multimèdia gratuït basat en web que proporciona accés ubicu a la teva música. Fes-lo servir per compartir la teva música amb els amics o per escoltar la teva pròpia música mentre treballes. Pots reproduir en streaming a diversos reproductors simultàniament, per exemple, a un reproductor a la cuina i un altre a la sala d'estar.
    cs_CZ: Airsonic-advanced je bezplatný webový streamer médií, který poskytuje všudypřítomný přístup k vaší hudbě. Použijte ho ke sdílení hudby s přáteli nebo k poslechu vlastní hudby v práci. Můžete streamovat do více přehrávačů současně, například do jednoho přehrávače v kuchyni a do druhého v obývacím pokoji.
    da_DK: Airsonic-advanced er en gratis, webbaseret mediestreamer, der giver uhindret adgang til din musik. Brug den til at dele din musik med venner eller til at lytte til din egen musik, mens du er på arbejde. Du kan streame til flere afspillere samtidigt, for eksempel til én afspiller i dit køkken og en anden i din stue.
    de_DE: Airsonic-advanced ist ein kostenloser, webbasierter Media-Streamer, mit dem Sie überall auf Ihre Musik zugreifen können. Teilen Sie Ihre Musik mit Freunden oder hören Sie Ihre eigene Musik während der Arbeit. Sie können gleichzeitig auf mehrere Abspielgeräte streamen, beispielsweise auf eines in der Küche und ein weiteres im Wohnzimmer.
    el_GR: Το Airsonic-advanced είναι ένα δωρεάν, διαδικτυακό πρόγραμμα ροής πολυμέσων, που παρέχει πανταχού παρούσα πρόσβαση στη μουσική σας. Χρησιμοποιήστε το για να μοιραστείτε τη μουσική σας με φίλους ή για να ακούσετε τη δική σας μουσική ενώ εργάζεστε. Μπορείτε να κάνετε streaming σε πολλούς παίκτες ταυτόχρονα, για παράδειγμα σε έναν παίκτη στην κουζίνα σας και έναν άλλο στο σαλόνι σας.
    en_GB: Airsonic-advanced is a free, web-based media streamer, providing ubiquitious access to your music. Use it to share your music with friends, or to listen to your own music while at work. You can stream to multiple players simultaneously, for instance to one player in your kitchen and another in your living room.
    es_ES: Airsonic-advanced es un reproductor multimedia gratuito basado en la web que te brinda acceso ilimitado a tu música. Úsalo para compartir tu música con amigos o para escucharla mientras trabajas. Puedes transmitir a varios reproductores simultáneamente, por ejemplo, a uno en la cocina y a otro en la sala.
    fr_FR: Airsonic-advanced est un lecteur multimédia gratuit, accessible via le web, qui vous permet d'écouter votre musique où que vous soyez. Partagez-la avec vos amis ou écoutez-la au travail. Diffusez votre musique simultanément sur plusieurs appareils, par exemple un dans votre cuisine et un autre dans votre salon.
    ga_IE: Is sruthaitheoir meán saor in aisce, gréasánbhunaithe é Airsonic-advanced, a thugann rochtain uileláithreach ar do cheol. Bain úsáid as chun do cheol a roinnt le cairde, nó chun éisteacht le do cheol féin agus tú ag an obair. Is féidir leat sruthú chuig il-imreoirí ag an am céanna, mar shampla chuig imreoir amháin i do chistin agus ceann eile i do sheomra suí.
    hr_HR: Airsonic-advanced je besplatni web-bazirani program za streaming medija koji omogućuje sveprisutan pristup vašoj glazbi. Koristite ga za dijeljenje glazbe s prijateljima ili za slušanje vlastite glazbe dok ste na poslu. Možete istovremeno streamati na više playera, na primjer na jedan player u kuhinji i drugi u dnevnoj sobi.
    hu_HU: Az Airsonic-advanced egy ingyenes, webalapú média streamer, amely mindenütt hozzáférést biztosít zenéidhez. Használd arra, hogy megoszd zenéidet barátaiddal, vagy hogy meghallgasd saját zenéidet munka közben. Egyszerre több lejátszóra is streamelhetsz, például az egyikre a konyhádban és a másikra a nappalidban.
    it_IT: Airsonic-advanced è un lettore multimediale gratuito basato sul web che offre un accesso onnipresente alla tua musica. Usalo per condividere la tua musica con gli amici o per ascoltarla mentre sei al lavoro. Puoi riprodurre in streaming su più dispositivi contemporaneamente, ad esempio su un dispositivo in cucina e su un altro in soggiorno.
    ja_JP: Airsonic-advancedは、無料のウェブベースのメディアストリーミングサービスで、いつでもどこでも音楽にアクセスできます。友人との音楽共有や、仕事中に自分の音楽を聴くのに最適です。複数のプレーヤーに同時にストリーミング再生できるので、例えばキッチンとリビングルームでそれぞれ異なるプレーヤーに音楽を楽しむことができます。
    ko_KR: Airsonic-advanced는 무료 웹 기반 미디어 스트리밍 서비스로, 언제 어디서든 음악을 즐길 수 있도록 해줍니다. 친구들과 음악을 공유하거나 직장에서 음악을 감상하는 데 사용해 보세요. 주방과 거실에 있는 플레이어로 동시에 스트리밍하는 것도 가능합니다.
    ml_IN: എയർസോണിക്-അഡ്വാൻസ്ഡ് എന്നത് ഒരു സൗജന്യ വെബ് അധിഷ്ഠിത മീഡിയ സ്ട്രീമറാണ്, ഇത് നിങ്ങളുടെ സംഗീതത്തിലേക്ക് എല്ലായിടത്തും പ്രവേശനം നൽകുന്നു. സുഹൃത്തുക്കളുമായി നിങ്ങളുടെ സംഗീതം പങ്കിടാനോ ജോലിസ്ഥലത്ത് നിങ്ങളുടെ സ്വന്തം സംഗീതം കേൾക്കാനോ ഇത് ഉപയോഗിക്കുക. നിങ്ങൾക്ക് ഒരേസമയം ഒന്നിലധികം പ്ലെയറുകളിലേക്ക് സ്ട്രീം ചെയ്യാൻ കഴിയും, ഉദാഹരണത്തിന് നിങ്ങളുടെ അടുക്കളയിലെ ഒരു പ്ലെയറിലേക്കും നിങ്ങളുടെ സ്വീകരണമുറിയിലെ മറ്റൊരു പ്ലെയറിലേക്കും.
    nb_NO: Airsonic-advanced er en gratis, nettbasert mediestreamer som gir deg tilgang til musikken din overalt. Bruk den til å dele musikken din med venner, eller til å lytte til din egen musikk mens du er på jobb. Du kan strømme til flere spillere samtidig, for eksempel til én spiller på kjøkkenet og en annen i stuen.
    nl_NL: Airsonic-advanced is een gratis, webgebaseerde mediastreamer die overal toegang biedt tot je muziek. Gebruik het om je muziek met vrienden te delen of om naar je eigen muziek te luisteren tijdens je werk. Je kunt tegelijkertijd naar meerdere spelers streamen, bijvoorbeeld naar één speler in je keuken en een andere in je woonkamer.
    pl_PL: Airsonic-advanced to darmowy, internetowy streamer multimediów, zapewniający wszechobecny dostęp do Twojej muzyki. Użyj go, aby dzielić się muzyką ze znajomymi lub słuchać własnej muzyki w pracy. Możesz streamować do wielu odtwarzaczy jednocześnie, na przykład do jednego w kuchni i drugiego w salonie.
    pt_BR: O Airsonic-advanced é um reprodutor de mídia gratuito baseado na web, que oferece acesso universal à sua música. Use-o para compartilhar suas músicas com amigos ou para ouvi-las enquanto trabalha. Você pode reproduzir músicas em vários dispositivos simultaneamente, por exemplo, em um dispositivo na sua cozinha e outro na sua sala de estar.
    ro_RO: Airsonic-advanced este un streamer media gratuit, bazat pe web, care oferă acces omniprezent la muzica ta. Folosește-l pentru a partaja muzica cu prietenii sau pentru a asculta propria muzică în timp ce ești la serviciu. Poți transmite simultan pe mai multe playere, de exemplu, pe un player din bucătărie și pe altul din sufragerie.
    ru_RU: Airsonic-advanced — это бесплатный веб-сервис для потоковой передачи мультимедиа, обеспечивающий повсеместный доступ к вашей музыке. Используйте его, чтобы делиться музыкой с друзьями или слушать свою музыку на работе. Вы можете одновременно транслировать музыку на несколько плееров, например, на один плеер на кухне и на другой в гостиной.
    sk_SK: Airsonic-advanced je bezplatný webový streamer médií, ktorý poskytuje všadeprítomný prístup k vašej hudbe. Použite ho na zdieľanie hudby s priateľmi alebo na počúvanie vlastnej hudby počas práce. Môžete streamovať do viacerých prehrávačov súčasne, napríklad do jedného prehrávača v kuchyni a do druhého v obývačke.
    sv_SE: Airsonic-advanced är en gratis, webbaserad mediastreamer som ger dig tillgång till din musik överallt. Använd den för att dela din musik med vänner eller lyssna på din egen musik på jobbet. Du kan streama till flera spelare samtidigt, till exempel till en spelare i köket och en annan i vardagsrummet.
    tr_TR: Airsonic-advanced, müziğinize her yerden erişim sağlayan ücretsiz, web tabanlı bir medya oynatıcısıdır. Müziğinizi arkadaşlarınızla paylaşmak veya işteyken kendi müziğinizi dinlemek için kullanabilirsiniz. Örneğin, mutfağınızdaki bir oynatıcıya ve oturma odanızdaki başka bir oynatıcıya aynı anda yayın yapabilirsiniz.
    zh_CN: Airsonic-advanced 是一款免费的网页媒体流服务，让你随时随地访问自己的音乐。你可以与朋友分享音乐，也可以在工作时收听自己的曲库。它支持同时向多个播放器传输音乐，例如厨房和客厅各放置一台播放器。
    zh_TW: Airsonic-advanced 是一款免費的網頁媒體流服務，讓你隨時隨地訪問自己的音樂。你可以與朋友分享音樂，也可以在工作時收聽自己的曲庫。它支援同時向多個播放器傳輸音樂，例如廚房和客廳各放置一臺播放器。
