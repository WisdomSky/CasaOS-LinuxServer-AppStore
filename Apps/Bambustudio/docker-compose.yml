name: linuxserver-bambustudio
services:
  app:
    image: linuxserver/bambustudio:02.08.03
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: DARK_MODE
          description:
            en_US: Set this to true to enable dark mode for Bambu Studio. [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Bambu Studio is an open-source, cutting-edge, feature-rich slicing software. It contains project-based workflows, systematically optimized slicing algorithms, and an easy-to-use graphical interface, bringing users an incredibly smooth printing experience.
    ca_ES: Bambu Studio és un programari de tall de codi obert, innovador i ric en funcions. Conté fluxos de treball basats en projectes, algoritmes de tall de tall optimitzats sistemàticament i una interfície gràfica fàcil d'utilitzar, que ofereix als usuaris una experiència d'impressió increïblement fluida.
    cs_CZ: Bambu Studio je open-source, špičkový a funkčně bohatý software pro krájení. Obsahuje pracovní postupy založené na projektech, systematicky optimalizované algoritmy pro krájení a snadno použitelné grafické rozhraní, které uživatelům přináší neuvěřitelně plynulý tisk.
    da_DK: Bambu Studio er en open source, banebrydende og funktionsrig udskæringssoftware. Den indeholder projektbaserede arbejdsgange, systematisk optimerede udskæringsalgoritmer og en brugervenlig grafisk brugerflade, der giver brugerne en utrolig problemfri udskrivningsoplevelse.
    de_DE: Bambu Studio ist eine Open-Source-Software für das Slicing, die mit modernsten Funktionen ausgestattet ist. Sie bietet projektbasierte Arbeitsabläufe, systematisch optimierte Slicing-Algorithmen und eine benutzerfreundliche grafische Oberfläche für ein besonders reibungsloses Druckerlebnis.
    el_GR: Το Bambu Studio είναι ένα λογισμικό κοπής τυπογραφικών στοιχείων ανοιχτού κώδικα, πρωτοποριακό και πλούσιο σε λειτουργίες. Περιέχει ροές εργασίας βασισμένες σε έργα, συστηματικά βελτιστοποιημένους αλγόριθμους κοπής τυπογραφικών στοιχείων και ένα εύχρηστο γραφικό περιβάλλον εργασίας, προσφέροντας στους χρήστες μια απίστευτα ομαλή εμπειρία εκτύπωσης.
    en_GB: Bambu Studio is an open-source, cutting-edge, feature-rich slicing software. It contains project-based workflows, systematically optimised slicing algorithms, and an easy-to-use graphical interface, bringing users an incredibly smooth printing experience.
    es_ES: Bambu Studio es un software de laminado de código abierto, de vanguardia y con numerosas funciones. Incluye flujos de trabajo basados en proyectos, algoritmos de laminado optimizados sistemáticamente y una interfaz gráfica fácil de usar, lo que proporciona a los usuarios una experiencia de impresión increíblemente fluida.
    fr_FR: Bambu Studio est un logiciel de découpe open source, à la pointe de la technologie et riche en fonctionnalités. Il intègre des flux de travail par projet, des algorithmes de découpe systématiquement optimisés et une interface graphique intuitive, offrant ainsi aux utilisateurs une expérience d'impression d'une fluidité exceptionnelle.
    ga_IE: Is bogearraí slisnithe foinse oscailte, ceannródaíoch, saibhir i ngnéithe é Bambu Studio. Tá sreafaí oibre bunaithe ar thionscadail, halgartaim slisnithe atá optamaithe go córasach, agus comhéadan grafach atá éasca le húsáid ann, rud a thugann eispéireas priontála thar a bheith réidh d'úsáideoirí.
    hr_HR: Bambu Studio je vrhunski softver za rezanje otvorenog koda bogat značajkama. Sadrži tijekove rada temeljene na projektima, sustavno optimizirane algoritme za rezanje i jednostavno grafičko sučelje, pružajući korisnicima nevjerojatno glatko iskustvo ispisa.
    hu_HU: A Bambu Studio egy nyílt forráskódú, élvonalbeli, funkciókban gazdag szeletelő szoftver. Projekt alapú munkafolyamatokat, szisztematikusan optimalizált szeletelő algoritmusokat és könnyen használható grafikus felületet tartalmaz, hihetetlenül gördülékeny nyomtatási élményt nyújtva a felhasználóknak.
    it_IT: Bambu Studio è un software di slicing open-source, all'avanguardia e ricco di funzionalità. Include flussi di lavoro basati su progetti, algoritmi di slicing ottimizzati sistematicamente e un'interfaccia grafica intuitiva, offrendo agli utenti un'esperienza di stampa incredibilmente fluida.
    ja_JP: Bambu Studioは、オープンソースで最先端の機能豊富なスライスソフトウェアです。プロジェクトベースのワークフロー、体系的に最適化されたスライスアルゴリズム、使いやすいグラフィカルインターフェースを備え、ユーザーに驚くほどスムーズな印刷体験を提供します。
    ko_KR: Bambu Studio는 오픈 소스 기반의 최첨단 기능이 풍부한 슬라이싱 소프트웨어입니다. 프로젝트 기반 워크플로우, 체계적으로 최적화된 슬라이싱 알고리즘, 사용하기 쉬운 그래픽 인터페이스를 통해 사용자에게 놀랍도록 매끄러운 인쇄 경험을 제공합니다.
    ml_IN: ബാംബു സ്റ്റുഡിയോ ഒരു ഓപ്പൺ സോഴ്‌സ്, അത്യാധുനിക, സവിശേഷതകളാൽ സമ്പന്നമായ സ്ലൈസിംഗ് സോഫ്റ്റ്‌വെയറാണ്. ഇതിൽ പ്രോജക്റ്റ് അധിഷ്ഠിത വർക്ക്ഫ്ലോകൾ, വ്യവസ്ഥാപിതമായി ഒപ്റ്റിമൈസ് ചെയ്ത സ്ലൈസിംഗ് അൽഗോരിതങ്ങൾ, ഉപയോഗിക്കാൻ എളുപ്പമുള്ള ഗ്രാഫിക്കൽ ഇന്റർഫേസ് എന്നിവ അടങ്ങിയിരിക്കുന്നു, ഇത് ഉപയോക്താക്കൾക്ക് അവിശ്വസനീയമാംവിധം സുഗമമായ പ്രിന്റിംഗ് അനുഭവം നൽകുന്നു.
    nb_NO: Bambu Studio er en banebrytende og funksjonsrik programvare for utskjæring med åpen kildekode. Den inneholder prosjektbaserte arbeidsflyter, systematisk optimaliserte utskjæringsalgoritmer og et brukervennlig grafisk grensesnitt, noe som gir brukerne en utrolig smidig utskriftsopplevelse.
    nl_NL: Bambu Studio is open-source, geavanceerde en veelzijdige slicing-software. Het bevat projectgebaseerde workflows, systematisch geoptimaliseerde slicing-algoritmes en een gebruiksvriendelijke grafische interface, wat gebruikers een ongelooflijk soepele printervaring biedt.
    pl_PL: Bambu Studio to nowatorskie, bogate w funkcje oprogramowanie do cięcia na poziomie open source. Zawiera oparte na projektach przepływy pracy, systematycznie optymalizowane algorytmy cięcia oraz łatwy w obsłudze interfejs graficzny, zapewniając użytkownikom niezwykle płynne drukowanie.
    pt_BR: O Bambu Studio é um software de fatiamento de código aberto, de última geração e repleto de recursos. Ele inclui fluxos de trabalho baseados em projetos, algoritmos de fatiamento sistematicamente otimizados e uma interface gráfica fácil de usar, proporcionando aos usuários uma experiência de impressão incrivelmente fluida.
    ro_RO: Bambu Studio este un software de slicing open-source, de ultimă generație și bogat în funcții. Acesta conține fluxuri de lucru bazate pe proiecte, algoritmi de slicing optimizați sistematic și o interfață grafică ușor de utilizat, oferind utilizatorilor o experiență de imprimare incredibil de fluidă.
    ru_RU: Bambu Studio — это передовое, многофункциональное программное обеспечение для нарезки моделей с открытым исходным кодом. Оно включает в себя рабочие процессы, основанные на проектах, систематически оптимизированные алгоритмы нарезки и простой в использовании графический интерфейс, обеспечивая пользователям невероятно удобный процесс печати.
    sk_SK: Bambu Studio je open-source, špičkový a funkčne bohatý softvér na krájanie. Obsahuje pracovné postupy založené na projektoch, systematicky optimalizované algoritmy krájania a ľahko použiteľné grafické rozhranie, ktoré používateľom prináša neuveriteľne plynulý tlačový zážitok.
    sv_SE: Bambu Studio är en öppen källkod, banbrytande och funktionsrik slicing-programvara. Den innehåller projektbaserade arbetsflöden, systematiskt optimerade slicing-algoritmer och ett lättanvänt grafiskt gränssnitt, vilket ger användarna en otroligt smidig utskriftsupplevelse.
    tr_TR: Bambu Studio, açık kaynaklı, son teknoloji ürünü ve zengin özelliklere sahip bir dilimleme yazılımıdır. Proje tabanlı iş akışları, sistematik olarak optimize edilmiş dilimleme algoritmaları ve kullanımı kolay grafik arayüzü sayesinde kullanıcılara inanılmaz derecede sorunsuz bir baskı deneyimi sunar.
    zh_CN: Bambu Studio 是一款先进、开源且功能丰富的切片软件。它提供基于项目的工作流程、系统优化的切片算法和易于使用的图形界面，带来流畅的打印体验。
    zh_TW: Bambu Studio 是一款先進、開源且功能豐富的切片軟體。它提供基於專案的工作流程、系統最佳化的切片演算法和易於使用的圖形介面，帶來流暢的列印體驗。
