    pl_PL: Luanti (dawniej Minetest) to platforma open source do tworzenia gier w technologii voxel, która umożliwia łatwe modowanie i tworzenie gier
    pt_BR: Luanti (anteriormente Minetest) é uma plataforma de código aberto para criação de jogos voxel, com facilidade para criação e modificação de jogos.
