name: linuxserver-luanti
services:
  app:
    image: linuxserver/luanti:5.17.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: CLI_ARGS
          description:
            en_US: Optionally specify any CLI variables you want to launch the app with [OPTIONAL]
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Luanti (formerly Minetest) is an open source voxel game-creation platform with easy modding and game creation
    ca_ES: Luanti (anteriorment Minetest) és una plataforma de creació de jocs amb vòxel de codi obert amb modding i creació de jocs fàcils.
    cs_CZ: Luanti (dříve Minetest) je open source platforma pro tvorbu voxelových her s možností snadného modování a tvorby her.
    da_DK: Luanti (tidligere Minetest) er en open source voxel-spilplatform med nem modding og spiloprettelse.
    de_DE: Luanti (ehemals Minetest) ist eine Open-Source-Voxel-Spieleentwicklungsplattform mit einfacher Modding- und Spieleentwicklungsfunktion.
    el_GR: Το Luanti (πρώην Minetest) είναι μια πλατφόρμα δημιουργίας παιχνιδιών voxel ανοιχτού κώδικα με εύκολο modding και δημιουργία παιχνιδιών.
    en_GB: Luanti (formerly Minetest) is an open source voxel game-creation platform with easy modding and game creation
    es_ES: Luanti (anteriormente Minetest) es una plataforma de código abierto para la creación de juegos basados en vóxeles, con facilidad para modificar y crear juegos.
    fr_FR: Luanti (anciennement Minetest) est une plateforme open source de création de jeux voxel, offrant des fonctionnalités de modding et de création de jeux simplifiées.
    ga_IE: Is ardán cruthaithe cluichí voxel foinse oscailte é Luanti (Minetest roimhe seo) le modhnú agus cruthú cluichí éasca.
    hr_HR: Luanti (prije Minetest) je platforma otvorenog koda za izradu voksel igara s jednostavnim modiranjem i stvaranjem igara.
