    ru_RU: Luanti (ранее Minetest) — это платформа для создания воксельных игр с открытым исходным кодом, отличающаяся простотой в модификации и разработке игр.
    sk_SK: Luanti (predtým Minetest) je open source platforma na tvorbu voxelových hier s jednoduchým modovaním a tvorbou hier.
    sv_SE: Luanti (tidigare Minetest) är en öppen källkodsplattform för voxel-spelskapande med enkel modding och spelskapande
    tr_TR: Luanti (eski adıyla Minetest), kolay modlama ve oyun oluşturma imkanı sunan açık kaynaklı bir voksel oyun geliştirme platformudur.
