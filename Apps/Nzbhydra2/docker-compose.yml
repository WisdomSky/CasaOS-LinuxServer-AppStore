name: linuxserver-nzbhydra2
services:
  app:
    image: linuxserver/nzbhydra2:8.9.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 5076
        published: 5076
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nzbhydra2/config
        target: /config
      - type: bind
        source: /DATA/AppData/nzbhydra2/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Nzbhydra2 is a meta search application for NZB indexers, the spiritual successor to NZBmegasearcH, and an evolution of the original application NZBHydra. It provides easy access to a number of raw and newznab based indexers.
    zh_CN: NZBHydra2 是面向 NZB 索引器的聚合搜索应用，是 NZBmegasearcH 理念上的继任者，也是原版 NZBHydra 的演进版本。它可方便地访问多个原生或基于 newznab 的索引器。
  tagline:
    en_US: A meta search application for NZB indexers, the spiritual successor to NZBmegasearcH, and an evolution of the original application NZBHydra. It provides easy access to a number of raw and newznab based indexers.
    zh_CN: 集中搜索多个 NZB 索引服务。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/hydra-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/hydra-icon.png
  title:
    en_US: Nzbhydra2 (LinuxServer.io)
    zh_CN: Nzbhydra2（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservernzbhydra2
  port_map: '5076'
  version: 8.9.0
