    fr_FR: "BookStack est un wiki libre et open source conçu pour créer une documentation de qualité. Doté d'un éditeur WYSIWYG simple et puissant, il permet aux équipes de créer facilement une documentation détaillée et utile. Basé sur SQL et incluant un éditeur Markdown pour ceux qui le préfèrent, BookStack a pour objectif de rendre la documentation plus agréable que contraignante. Pour en savoir plus sur BookStack, rendez-vous sur leur site web\_: https://www.bookstackapp.com"
    ga_IE: 'Vicí foinse oscailte saor in aisce atá deartha chun doiciméadú álainn a chruthú. Le heagarthóir WYSIWYG simplí ach cumhachtach, tugann sé deis do fhoirne doiciméadú mionsonraithe agus úsáideach a chruthú go héasca. Cumhachtaithe ag SQL agus eagarthóir Markdown san áireamh dóibh siúd ar fearr leo é, tá BookStack dírithe ar dhoiciméadú a dhéanamh níos pléisiúir ná mar thasc. Le haghaidh tuilleadh eolais faoi BookStack, tabhair cuairt ar a suíomh Gréasáin agus féach air: https://www.Bookstackapp.com'
    hr_HR: 'Besplatni Wiki otvorenog koda dizajniran za izradu prekrasne dokumentacije. S jednostavnim, ali moćnim WYSIWYG uređivačem, omogućuje timovima jednostavno stvaranje detaljne i korisne dokumentacije. Pokretan SQL-om i uključujući Markdown uređivač za one koji ga preferiraju, BookStack je usmjeren na to da dokumentiranje učini više zadovoljstvom nego mukom. Za više informacija o BookStacku posjetite njihovu web stranicu: https://www.Bookstackapp.com'
    hu_HU: 'Egy ingyenes és nyílt forráskódú wiki, amelyet gyönyörű dokumentációk készítésére terveztek. Egy egyszerű, de hatékony WYSIWYG szerkesztővel a csapatok könnyedén készíthetnek részletes és hasznos dokumentációkat. Az SQL-alapú és Markdown szerkesztővel rendelkező BookStack célja, hogy a dokumentációt inkább élvezet, mint teher legyen. További információkért a BookStackről látogassa meg weboldalukat: https://www.Bookstackapp.Com'
    it_IT: 'Una wiki gratuita e open source progettata per creare documentazione di grande impatto visivo. Dotata di un editor WYSIWYG semplice ma potente, permette ai team di creare documentazione dettagliata e utile con facilità. Basata su SQL e con un editor Markdown incluso per chi lo preferisce, BookStack è pensata per rendere la creazione di documentazione un piacere anziché un compito gravoso. Per maggiori informazioni su BookStack, visita il sito web: https://www.Bookstackapp.com'
    ja_JP: BookStackは、美しいドキュメントを作成するために設計された、無料のオープンソースWikiです。シンプルながら強力なWYSIWYGエディタを搭載しており、チームが詳細で役立つドキュメントを簡単に作成できます。SQLを基盤とし、Markdownエディタも備えているため、ドキュメント作成を面倒な作業ではなく、楽しい作業にすることを目指しています。BookStackの詳細については、ウェブサイト（https://www.Bookstackapp.com）をご覧ください。
    ko_KR: BookStack은 아름다운 문서를 만들기 위해 설계된 무료 오픈 소스 위키입니다. 간단하지만 강력한 WYSIWYG 편집기를 통해 팀에서 상세하고 유용한 문서를 손쉽게 작성할 수 있습니다. SQL 기반으로 작동하며, 마크다운 편집기를 선호하는 사용자를 위해 Markdown 편집기도 제공하는 BookStack은 문서 작성을 단순한 작업이 아닌 즐거운 경험으로 만들어 줍니다. BookStack에 대한 자세한 정보는 웹사이트(https://www.Bookstackapp.com)에서 확인하세요.
    ml_IN: 'മനോഹരമായ ഡോക്യുമെന്റേഷൻ സൃഷ്ടിക്കുന്നതിനായി രൂപകൽപ്പന ചെയ്‌തിരിക്കുന്ന ഒരു സ്വതന്ത്രവും ഓപ്പൺ സോഴ്‌സ് വിക്കി. ലളിതവും എന്നാൽ ശക്തവുമായ WYSIWYG എഡിറ്റർ ഉള്ള ഇത് ടീമുകൾക്ക് വിശദവും ഉപയോഗപ്രദവുമായ ഡോക്യുമെന്റേഷൻ എളുപ്പത്തിൽ സൃഷ്ടിക്കാൻ അനുവദിക്കുന്നു. SQL നൽകുന്നതും അത് ഇഷ്ടപ്പെടുന്നവർക്ക് ഒരു മാർക്ക്ഡൗൺ എഡിറ്റർ ഉൾപ്പെടുത്തിയിരിക്കുന്നതുമായ ബുക്ക്‌സ്റ്റാക്ക്, ഡോക്യുമെന്റേഷനെ ഒരു ജോലിയേക്കാൾ കൂടുതൽ ആനന്ദകരമാക്കുന്നതിനാണ് ലക്ഷ്യമിടുന്നത്. ബുക്ക്‌സ്റ്റാക്കിനെക്കുറിച്ചുള്ള കൂടുതൽ വിവരങ്ങൾക്ക് അവരുടെ വെബ്‌സൈറ്റ് സന്ദർശിച്ച് ഇത് പരിശോധിക്കുക: https://www. Bookstackapp. Com'
    nb_NO: 'En gratis og åpen kildekode-wiki designet for å lage vakker dokumentasjon. Med en enkel, men kraftig WYSIWYG-editor kan team enkelt lage detaljert og nyttig dokumentasjon. BookStack er drevet av SQL og inkluderer en Markdown-editor for de som foretrekker det, og er rettet mot å gjøre dokumentasjon mer til en glede enn et ork. For mer informasjon om BookStack, besøk nettstedet deres og sjekk det ut: https://www.Bookstackapp.com'
    nl_NL: 'Een gratis en open source wiki, ontworpen voor het maken van prachtige documentatie. Met een eenvoudige maar krachtige WYSIWYG-editor kunnen teams gemakkelijk gedetailleerde en nuttige documentatie creëren. BookStack, aangedreven door SQL en inclusief een Markdown-editor voor wie daar de voorkeur aan geeft, is erop gericht om documentatie maken leuker te maken dan een vervelende klus. Ga voor meer informatie over BookStack naar hun website: https://www.Bookstackapp.com'
    pl_PL: 'Darmowa i otwarta wiki przeznaczona do tworzenia pięknej dokumentacji. Dzięki prostemu, ale potężnemu edytorowi WYSIWYG, BookStack pozwala zespołom z łatwością tworzyć szczegółową i użyteczną dokumentację. Oparty na SQL i wyposażony w edytor Markdown dla tych, którzy preferują ten język, BookStack ma na celu sprawić, by dokumentacja była przyjemnością, a nie przykrym obowiązkiem. Aby uzyskać więcej informacji o BookStack, odwiedź ich stronę internetową: https://www.Bookstackapp.com'
    pt_BR: 'Uma Wiki gratuita e de código aberto, projetada para criar documentação visualmente atraente. Com um editor WYSIWYG simples, porém poderoso, permite que equipes criem documentação detalhada e útil com facilidade. Baseada em SQL e incluindo um editor Markdown para quem preferir, a BookStack visa tornar a documentação mais prazerosa do que árdua. Para mais informações sobre a BookStack, visite o site: https://www.bookstackapp.com'
    ro_RO: 'Un Wiki gratuit și open source conceput pentru crearea de documentație frumoasă. Dispunând de un editor WYSIWYG simplu, dar puternic, permite echipelor să creeze cu ușurință documentație detaliată și utilă. Susținut de SQL și incluzând un editor Markdown pentru cei care îl preferă, BookStack este conceput pentru a face documentația mai mult o plăcere decât o corvoadă. Pentru mai multe informații despre BookStack, vizitați site-ul lor web și consultați-l: https://www.Bookstackapp.Com'
    ru_RU: 'Бесплатная вики-система с открытым исходным кодом, предназначенная для создания красивой документации. Благодаря простому, но мощному WYSIWYG-редактору, она позволяет командам с легкостью создавать подробную и полезную документацию. Работая на основе SQL и включая редактор Markdown для тех, кто предпочитает его, BookStack стремится сделать создание документации удовольствием, а не рутиной. Для получения дополнительной информации о BookStack посетите их веб-сайт: https://www.Bookstackapp.com'
    sk_SK: 'Bezplatná a open source Wiki stránka navrhnutá na vytváranie krásnej dokumentácie. Vďaka jednoduchému, ale výkonnému WYSIWYG editoru umožňuje tímom ľahko vytvárať podrobnú a užitočnú dokumentáciu. BookStack, ktorý je poháňaný jazykom SQL a obsahuje aj editor Markdown pre tých, ktorí ho uprednostňujú, je zameraný na to, aby bola dokumentácia skôr potešením ako povinnosťou. Viac informácií o BookStacku nájdete na ich webovej stránke: https://www.Bookstackapp.com'
    sv_SE: 'En gratis och öppen källkodswiki utformad för att skapa vacker dokumentation. Med en enkel men kraftfull WYSIWYG-editor kan team enkelt skapa detaljerad och användbar dokumentation. BookStack drivs av SQL och inkluderar en Markdown-editor för de som föredrar det, och är inriktad på att göra dokumentation mer till ett nöje än ett besvär. För mer information om BookStack, besök deras webbplats och kolla in den: https://www.Bookstackapp.com'
    tr_TR: 'Güzel dokümantasyon oluşturmak için tasarlanmış ücretsiz ve açık kaynaklı bir Wiki. Basit ama güçlü bir WYSIWYG editörüne sahip olan bu platform, ekiplerin detaylı ve kullanışlı dokümanları kolaylıkla oluşturmasına olanak tanır. SQL ile çalışan ve tercih edenler için Markdown editörü de içeren BookStack, dokümantasyonu bir angarya olmaktan ziyade bir zevk haline getirmeyi amaçlamaktadır. BookStack hakkında daha fazla bilgi için web sitelerini ziyaret edin ve inceleyin: https://www.Bookstackapp.com'
    zh_CN: 使用所见即所得或 Markdown 编辑器编写 Wiki 文档。
    zh_TW: 使用所見即所得或 Markdown 編輯器編寫 Wiki 文件。
