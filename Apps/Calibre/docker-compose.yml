    pt_BR: Um gerenciador de e-books poderoso e fácil de usar. Os usuários dizem que é excelente e indispensável. Ele permite fazer praticamente tudo e vai além dos softwares comuns de gerenciamento de e-books. Além disso, é totalmente gratuito e de código aberto, sendo ótimo tanto para usuários casuais quanto para especialistas em informática.
    ro_RO: Un manager de cărți electronice puternic și ușor de utilizat. Utilizatorii spun că este remarcabil și indispensabil. Îți permite să faci aproape orice și duce lucrurile cu un pas dincolo de software-ul obișnuit pentru cărți electronice. De asemenea, este complet gratuit și open source și excelent atât pentru utilizatorii ocazionali, cât și pentru experții în informatică.
    ru_RU: Мощный и простой в использовании менеджер электронных книг. Пользователи говорят, что он превосходен и незаменим. Он позволяет делать практически все и выходит за рамки обычного программного обеспечения для работы с электронными книгами. Кроме того, он полностью бесплатный, с открытым исходным кодом и отлично подходит как для обычных пользователей, так и для компьютерных экспертов.
    sk_SK: Výkonný a ľahko použiteľný správca elektronických kníh. Používatelia tvrdia, že je vynikajúci a nevyhnutný. Umožní vám robiť takmer všetko a posúva veci o krok ďalej ako bežný softvér na elektronické knihy. Je tiež úplne bezplatný a s otvoreným zdrojovým kódom a skvelý pre bežných používateľov aj počítačových expertov.
    sv_SE: En kraftfull och lättanvänd e-bokshanterare. Användare säger att den är enastående och ett måste. Den låter dig göra nästan allt och tar saker ett steg bortom vanlig e-boksprogramvara. Den är också helt gratis och öppen källkod och perfekt för både vanliga användare och dataexperter.
    tr_TR: Güçlü ve kullanımı kolay bir e-kitap yöneticisi. Kullanıcılar bunun olağanüstü ve mutlaka sahip olunması gereken bir program olduğunu söylüyor. Neredeyse her şeyi yapmanıza olanak tanıyor ve normal e-kitap yazılımlarının ötesine geçiyor. Ayrıca tamamen ücretsiz ve açık kaynaklı olup hem sıradan kullanıcılar hem de bilgisayar uzmanları için mükemmeldir.
    zh_CN: 功能强大、易于使用的开源电子书管理器。
    zh_TW: 功能強大、易於使用的開源電子書管理器。
