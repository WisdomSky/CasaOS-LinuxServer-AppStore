name: linuxserver-calibre
services:
  app:
    image: linuxserver/calibre:9.15.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CLI_ARGS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: PASSWORD
          description:
            en_US: Optionally set a password for the gui. [OPTIONAL]
        - container: CLI_ARGS
          description:
            en_US: Optionally pass cli start arguments to calibre. [OPTIONAL]
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 8181
        published: 8181
        protocol: tcp
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calibre/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Calibre is a powerful and easy to use e-book manager. Users say it's outstanding and a must-have. It'll allow you to do nearly everything and it takes things a step beyond normal e-book software. It's also completely free and open source and great for both casual users and computer experts.
    ca_ES: Calibre és un gestor de llibres electrònics potent i fàcil d'utilitzar. Els usuaris diuen que és excel·lent i imprescindible. Et permetrà fer gairebé tot i va un pas més enllà del programari normal de llibres electrònics. A més, és completament gratuït i de codi obert, i ideal tant per a usuaris ocasionals com per a experts en informàtica.
    cs_CZ: Calibre je výkonný a snadno použitelný správce elektronických knih. Uživatelé říkají, že je vynikající a nezbytný. Umožní vám dělat téměř cokoli a posouvá věci o krok dál než běžný software pro elektronické knihy. Je také zcela zdarma a s otevřeným zdrojovým kódem a je skvělý jak pro běžné uživatele, tak pro počítačové experty.
    da_DK: Calibre er en kraftfuld og brugervenlig e-bogshåndteringssoftware. Brugere siger, at den er fremragende og et must-have. Den giver dig mulighed for at gøre næsten alt, og den tager tingene et skridt videre end normal e-bogssoftware. Den er også helt gratis og open source og fantastisk til både almindelige brugere og computereksperter.
    de_DE: Calibre ist ein leistungsstarker und benutzerfreundlicher E-Book-Manager. Nutzer loben ihn als herausragend und unverzichtbar. Er bietet nahezu alle Funktionen und geht weit über herkömmliche E-Book-Software hinaus. Zudem ist er komplett kostenlos, Open Source und eignet sich hervorragend für Gelegenheitsnutzer und Computerprofis gleichermaßen.
    el_GR: Το Calibre είναι ένας ισχυρός και εύχρηστος διαχειριστής ηλεκτρονικών βιβλίων. Οι χρήστες λένε ότι είναι εξαιρετικός και απαραίτητος. Σας επιτρέπει να κάνετε σχεδόν τα πάντα και πηγαίνει τα πράγματα ένα βήμα παραπέρα από ένα συνηθισμένο λογισμικό ηλεκτρονικών βιβλίων. Είναι επίσης εντελώς δωρεάν και ανοιχτού κώδικα και ιδανικό τόσο για απλούς χρήστες όσο και για ειδικούς υπολογιστών.
    en_GB: Calibre is a powerful and easy to use e-book manager. Users say it's outstanding and a must-have. It'll allow you to do nearly everything and it takes things a step beyond normal e-book software. It's also completely free and open source and great for both casual users and computer experts.
    es_ES: Calibre es un gestor de libros electrónicos potente y fácil de usar. Los usuarios lo consideran excepcional e imprescindible. Permite realizar prácticamente cualquier tarea y va un paso más allá del software de gestión de libros electrónicos convencional. Además, es completamente gratuito y de código abierto, ideal tanto para usuarios ocasionales como para expertos en informática.
    fr_FR: Calibre est un gestionnaire de livres numériques puissant et intuitif. Ses utilisateurs le considèrent comme exceptionnel et indispensable. Il permet de réaliser la quasi-totalité des tâches et va bien au-delà des logiciels de gestion de livres numériques classiques. Entièrement gratuit et open source, il convient aussi bien aux utilisateurs occasionnels qu'aux experts.
    ga_IE: Is bainisteoir ríomhleabhar cumhachtach agus éasca le húsáid é Calibre. Deir úsáideoirí go bhfuil sé den scoth agus riachtanach. Ligfidh sé duit beagnach gach rud a dhéanamh agus tugann sé rudaí céim níos faide ná gnáthbhogearraí ríomhleabhar. Tá sé go hiomlán saor in aisce agus foinse oscailte freisin agus iontach d'úsáideoirí ócáideacha agus do shaineolaithe ríomhaireachta araon.
    hr_HR: Calibre je moćan i jednostavan za korištenje program za upravljanje e-knjigama. Korisnici kažu da je izvanredan i neophodan. Omogućit će vam gotovo sve i podiže stvari korak dalje od uobičajenog softvera za e-knjige. Također je potpuno besplatan i otvorenog koda te izvrstan i za povremene korisnike i za računalne stručnjake.
    hu_HU: A Calibre egy hatékony és könnyen használható e-könyv kezelő. A felhasználók szerint kiemelkedő és kötelező darab. Szinte mindent lehetővé tesz, és egy lépéssel túlmutat a hagyományos e-könyv szoftvereken. Emellett teljesen ingyenes és nyílt forráskódú, így nagyszerű mind a hétköznapi felhasználók, mind a számítógépes szakértők számára.
    it_IT: Calibre è un gestore di ebook potente e facile da usare. Gli utenti lo considerano eccezionale e indispensabile. Permette di fare praticamente di tutto e va ben oltre i normali software per ebook. È inoltre completamente gratuito e open source, ideale sia per gli utenti occasionali che per gli esperti di informatica.
    ja_JP: Calibreは、強力かつ使いやすい電子書籍管理ソフトです。ユーザーからは「傑出したソフトで、必須アイテム」と絶賛されています。ほぼすべての操作が可能で、一般的な電子書籍ソフトの枠を超えた機能を提供します。完全無料のオープンソースソフトウェアなので、初心者からコンピュータのエキスパートまで、あらゆるユーザーに最適です。
    ko_KR: Calibre는 강력하면서도 사용하기 쉬운 전자책 관리 프로그램입니다. 사용자들은 Calibre가 탁월하며 필수 프로그램이라고 입을 모아 칭찬합니다. 거의 모든 기능을 제공하며 일반적인 전자책 소프트웨어를 뛰어넘는 수준을 자랑합니다. 또한 완전 무료 오픈 소스 프로그램으로, 일반 사용자부터 전문가까지 모두에게 적합합니다.
    ml_IN: കാലിബർ ശക്തവും ഉപയോഗിക്കാൻ എളുപ്പമുള്ളതുമായ ഒരു ഇ-ബുക്ക് മാനേജരാണ്. ഉപയോക്താക്കൾ പറയുന്നത് ഇത് മികച്ചതാണെന്നും ഉണ്ടായിരിക്കേണ്ട ഒന്നാണെന്നും ആണ്. ഇത് മിക്കവാറും എല്ലാ കാര്യങ്ങളും ചെയ്യാൻ നിങ്ങളെ അനുവദിക്കുകയും സാധാരണ ഇ-ബുക്ക് സോഫ്റ്റ്‌വെയറിനപ്പുറം കാര്യങ്ങൾ ഒരു പടി മുന്നോട്ട് കൊണ്ടുപോകുകയും ചെയ്യുന്നു. ഇത് പൂർണ്ണമായും സൌജന്യവും ഓപ്പൺ സോഴ്‌സുമാണ്, കൂടാതെ സാധാരണ ഉപയോക്താക്കൾക്കും കമ്പ്യൂട്ടർ വിദഗ്ധർക്കും ഇത് മികച്ചതാണ്.
    nb_NO: Calibre er en kraftig og brukervennlig e-bokbehandler. Brukere sier at den er enestående og et must. Den lar deg gjøre nesten alt, og den tar ting et skritt utover vanlig e-bokprogramvare. Den er også helt gratis og åpen kildekode, og flott for både vanlige brukere og dataeksperter.
    nl_NL: Calibre is een krachtige en gebruiksvriendelijke e-bookmanager. Gebruikers vinden het een uitstekende en onmisbare tool. Je kunt er bijna alles mee doen en het gaat een stap verder dan standaard e-booksoftware. Bovendien is het volledig gratis en open source, waardoor het geschikt is voor zowel gewone gebruikers als computerdeskundigen.
    pl_PL: Calibre to potężny i łatwy w obsłudze menedżer e-booków. Użytkownicy twierdzą, że jest wyjątkowy i niezbędny. Umożliwia niemal wszystko i wykracza poza możliwości typowego oprogramowania do obsługi e-booków. Jest całkowicie darmowy i ma otwarte oprogramowanie, dzięki czemu świetnie sprawdzi się zarówno dla zwykłych użytkowników, jak i ekspertów komputerowych.
    pt_BR: O Calibre é um gerenciador de e-books poderoso e fácil de usar. Os usuários o consideram excepcional e indispensável. Ele permite fazer praticamente tudo e vai além dos softwares comuns para e-books. Além disso, é totalmente gratuito e de código aberto, sendo ótimo tanto para usuários casuais quanto para especialistas em informática.
    ro_RO: Calibre este un manager de cărți electronice puternic și ușor de utilizat. Utilizatorii spun că este remarcabil și indispensabil. Îți permite să faci aproape orice și duce lucrurile cu un pas dincolo de software-ul obișnuit pentru cărți electronice. De asemenea, este complet gratuit și open source și excelent atât pentru utilizatorii ocazionali, cât și pentru experții în informatică.
    ru_RU: Calibre — это мощный и простой в использовании менеджер электронных книг. Пользователи говорят, что он превосходен и незаменим. Он позволяет делать практически всё и выходит за рамки обычного программного обеспечения для работы с электронными книгами. Кроме того, он полностью бесплатен и имеет открытый исходный код, отлично подходит как для обычных пользователей, так и для компьютерных экспертов.
    sk_SK: Calibre je výkonný a ľahko použiteľný správca elektronických kníh. Používatelia hovoria, že je vynikajúci a nevyhnutný. Umožní vám robiť takmer všetko a posúva veci o krok ďalej ako bežný softvér na elektronické knihy. Je tiež úplne bezplatný a s otvoreným zdrojovým kódom a skvelý pre bežných používateľov aj počítačových expertov.
    sv_SE: Calibre är en kraftfull och lättanvänd e-bokshanterare. Användare säger att den är enastående och ett måste. Den låter dig göra nästan allt och tar saker ett steg bortom vanlig e-boksprogramvara. Den är också helt gratis och öppen källkod och perfekt för både vanliga användare och dataexperter.
    tr_TR: Calibre, güçlü ve kullanımı kolay bir e-kitap yöneticisidir. Kullanıcılar, olağanüstü ve mutlaka sahip olunması gereken bir yazılım olduğunu söylüyor. Neredeyse her şeyi yapmanıza olanak tanır ve normal e-kitap yazılımlarının ötesine geçer. Ayrıca tamamen ücretsiz ve açık kaynaklıdır ve hem sıradan kullanıcılar hem de bilgisayar uzmanları için mükemmeldir.
    zh_CN: Calibre 是一款功能强大、易于使用的电子书管理器，深受用户好评。它能够完成几乎所有常见的电子书管理工作，功能超越一般电子书软件。Calibre 完全免费且开源，适合普通用户和计算机专业人士。
    zh_TW: Calibre 是一款功能強大、易於使用的電子書管理器，深受使用者好評。它能夠完成幾乎所有常見的電子書管理工作，功能超越一般電子書軟體。Calibre 完全免費且開源，適合普通使用者和計算機專業人士。
