name: linuxserver-msedge
services:
  app:
    image: linuxserver/msedge:153.0.4234
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: EDGE_CLI
          description:
            en_US: Specify one or multiple Chromium CLI flags, this string will be passed to the application in full. [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Microsoft Edge is a cross-platform web browser developed by Microsoft and based on Chromium.
    zh_CN: Microsoft Edge 是由微软开发、基于 Chromium 的跨平台网页浏览器。
  tagline:
    en_US: A cross-platform web browser developed by Microsoft and based on Chromium.
    zh_CN: 微软开发的 Chromium 跨平台浏览器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/edge-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/edge-logo.png
  title:
    en_US: Msedge (LinuxServer.io)
    zh_CN: Msedge（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservermsedge
  port_map: '3000'
  version: 153.0.4234
