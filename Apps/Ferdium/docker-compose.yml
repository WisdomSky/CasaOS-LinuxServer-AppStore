name: linuxserver-ferdium
services:
  app:
    image: linuxserver/ferdium:7.2.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Ferdium is a desktop app that helps you organize how you use your favourite apps by combining them into one application.
    zh_CN: Ferdium 是一款桌面应用，通过将常用应用整合到一个应用中，帮助你更有条理地使用它们。
  tagline:
    en_US: A desktop app that helps you organize how you use your favourite apps by combining them into one application.
    zh_CN: 将常用应用整合到一个桌面客户端。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ferdium-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ferdium-logo.png
  title:
    en_US: Ferdium (LinuxServer.io)
    zh_CN: Ferdium（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverferdium
  port_map: '3000'
  version: 7.2.3
