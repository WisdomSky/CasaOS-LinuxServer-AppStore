  tagline:
    en_US: The Unifi-controller software is a powerful, enterprise wireless software engine ideal for high-density client deployments requiring low latency and high uptime performance.
    zh_CN: 面向高密度部署的企业无线网络管理软件。
    ca_ES: El programari Unifi-controller és un potent motor de programari sense fil empresarial ideal per a implementacions de clients d'alta densitat que requereixen baixa latència i un alt rendiment de funcionament.
    cs_CZ: Software Unifi-controller je výkonný podnikový bezdrátový softwarový engine, ideální pro klientské nasazení s vysokou hustotou vyžadující nízkou latenci a vysokou provozuschopnost.
    da_DK: Unifi-controller-softwaren er en kraftfuld trådløs softwaremotor til virksomheder, der er ideel til klientimplementeringer med høj tæthed, der kræver lav latenstid og høj oppetid.
    de_DE: Die Unifi-Controller-Software ist eine leistungsstarke, drahtlose Unternehmenssoftware, die sich ideal für den Einsatz in Umgebungen mit hoher Clientdichte eignet, welche geringe Latenz und hohe Verfügbarkeit erfordern.
    el_GR: Το λογισμικό Unifi-controller είναι μια ισχυρή, ασύρματη μηχανή λογισμικού για επιχειρήσεις, ιδανική για αναπτύξεις σε υπολογιστές-πελάτες υψηλής πυκνότητας που απαιτούν χαμηλή καθυστέρηση και υψηλή απόδοση χρόνου λειτουργίας.
    en_GB: The Unifi-controller software is a powerful, enterprise wireless software engine ideal for high-density client deployments requiring low latency and high uptime performance.
    es_ES: El software Unifi-controller es un potente motor de software inalámbrico empresarial, ideal para implementaciones de clientes de alta densidad que requieren baja latencia y un alto rendimiento en tiempo de actividad.
    fr_FR: Le logiciel Unifi-controller est un moteur logiciel sans fil puissant, destiné aux entreprises et idéal pour les déploiements clients à haute densité nécessitant une faible latence et une disponibilité élevée.
    ga_IE: Is inneall bogearraí gan sreang cumhachtach fiontraíochta é bogearraí Unifi-controller atá oiriúnach d’imscaradh cliant ard-dlúis a éilíonn latency íseal agus feidhmíocht ard-ama ar líne.
    hr_HR: Unifi-controller softver je moćan, bežični softverski mehanizam za poduzeća, idealan za implementacije klijenata visoke gustoće koji zahtijevaju nisku latenciju i visoku dostupnost.
    hu_HU: Az Unifi-vezérlő szoftver egy nagy teljesítményű, vállalati szintű vezeték nélküli szoftvermotor, amely ideális nagy sűrűségű klienstelepítésekhez, amelyek alacsony késleltetést és magas üzemidőt igényelnek.
    it_IT: Il software Unifi-controller è un potente motore software wireless di livello aziendale, ideale per implementazioni con un'elevata densità di client che richiedono bassa latenza e prestazioni con elevata disponibilità.
    ja_JP: Unifiコントローラーソフトウェアは、低遅延と高い稼働率が求められる高密度クライアント環境に最適な、強力なエンタープライズ向けワイヤレスソフトウェアエンジンです。
    ko_KR: Unifi 컨트롤러 소프트웨어는 높은 지연 시간과 높은 가동 시간이 요구되는 고밀도 클라이언트 구축 환경에 이상적인 강력한 엔터프라이즈급 무선 소프트웨어 엔진입니다.
    ml_IN: കുറഞ്ഞ ലേറ്റൻസിയും ഉയർന്ന അപ്‌ടൈം പ്രകടനവും ആവശ്യമുള്ള ഉയർന്ന സാന്ദ്രതയുള്ള ക്ലയന്റ് വിന്യാസങ്ങൾക്ക് അനുയോജ്യമായ ഒരു ശക്തമായ, എന്റർപ്രൈസ് വയർലെസ് സോഫ്റ്റ്‌വെയർ എഞ്ചിനാണ് യൂണിഫൈ-കൺട്രോളർ സോഫ്റ്റ്‌വെയർ.
    nb_NO: Unifi-controller-programvaren er en kraftig trådløs programvaremotor for bedrifter, ideell for klientdistribusjoner med høy tetthet som krever lav latens og høy oppetid.
    nl_NL: De Unifi-controller software is een krachtige, bedrijfsbrede draadloze software-engine, ideaal voor implementaties met een hoge clientdichtheid die lage latentie en hoge uptime vereisen.
    pl_PL: Oprogramowanie kontrolera Unifi to wydajny, korporacyjny moduł oprogramowania bezprzewodowego, idealny do wdrożeń klienckich o dużej gęstości, wymagających niskich opóźnień i wysokiej wydajności.
    pt_BR: O software Unifi-controller é um poderoso mecanismo de software sem fio empresarial, ideal para implantações de clientes de alta densidade que exigem baixa latência e alto desempenho de disponibilidade.
    ro_RO: Software-ul Unifi-controller este un motor software wireless puternic, pentru întreprinderi, ideal pentru implementări de clienți cu densitate mare care necesită latență redusă și performanță ridicată de funcționare.
    ru_RU: Программное обеспечение Unifi-controller — это мощный программный движок для корпоративных беспроводных сетей, идеально подходящий для развертывания сетей с высокой плотностью клиентов, требующих низкой задержки и высокой производительности.
    sk_SK: Softvér Unifi-controller je výkonný podnikový bezdrôtový softvérový engine, ideálny pre klientske nasadenia s vysokou hustotou, ktoré vyžadujú nízku latenciu a vysokú prevádzkyschopnosť.
    sv_SE: Unifi-controller-programvaran är en kraftfull trådlös företagsprogramvarumotor som är idealisk för klientdistributioner med hög densitet som kräver låg latens och hög drifttid.
    tr_TR: Unifi-controller yazılımı, düşük gecikme süresi ve yüksek çalışma süresi performansı gerektiren yüksek yoğunluklu istemci dağıtımları için ideal, güçlü bir kurumsal kablosuz yazılım motorudur.
