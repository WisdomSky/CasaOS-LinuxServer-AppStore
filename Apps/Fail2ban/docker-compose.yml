    nb_NO: Fail2ban er en daemon for å utestenge verter som forårsaker flere autentiseringsfeil.
    nl_NL: Fail2ban is een daemon die hosts blokkeert die meerdere authenticatiefouten veroorzaken.
    pl_PL: Fail2ban to demon służący do blokowania hostów powodujących wiele błędów uwierzytelniania.
    pt_BR: Fail2ban é um daemon para bloquear hosts que causam múltiplos erros de autenticação.
    ro_RO: Fail2ban este un daemon care interzice gazdele care cauzează erori multiple de autentificare.
    ru_RU: Fail2ban — это демон для блокировки хостов, вызывающих множественные ошибки аутентификации.
    sk_SK: Fail2ban je démon, ktorý zakazuje hostiteľské systémy, ktoré spôsobujú viacero chýb pri autentifikácii.
    sv_SE: Fail2ban är en daemon för att förbjuda värdar som orsakar flera autentiseringsfel.
    tr_TR: Fail2ban, birden fazla kimlik doğrulama hatasına neden olan sunucuları engellemek için kullanılan bir arka plan programıdır.
    zh_CN: Fail2ban 是一个守护进程，用于封禁多次触发身份验证错误的主机。
    zh_TW: Fail2ban 是一個守護程序，用於封禁多次觸發身份驗證錯誤的主機。
