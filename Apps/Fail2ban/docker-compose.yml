    es_ES: Fail2ban es un demonio que bloquea los hosts que provocan múltiples errores de autenticación.
    fr_FR: Fail2ban est un démon permettant de bannir les hôtes qui provoquent de multiples erreurs d'authentification.
    ga_IE: Is daemon é Fail2ban chun óstach a thoirmeasc a chruthaíonn il-earráidí fíordheimhnithe.
    hr_HR: Fail2ban je demon koji zabranjuje hostove koji uzrokuju višestruke pogreške u autentifikaciji.
    hu_HU: A Fail2ban egy démon, amely kitiltja a többszörös hitelesítési hibákat okozó hosztokat.
    it_IT: Fail2ban è un demone che blocca gli host che causano molteplici errori di autenticazione.
    ja_JP: Fail2banは、複数の認証エラーを引き起こすホストをブロックするデーモンです。
    ko_KR: Fail2ban은 인증 오류를 반복적으로 발생시키는 호스트를 차단하는 데몬입니다.
