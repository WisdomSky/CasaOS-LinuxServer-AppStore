    ja_JP: ユーザーが強力なコンテナ化されたデスクトップアプリケーションをWebブラウザに直接ストリーミングして実行できる、自己ホスト型のクライアント/サーバープラットフォームです。ブラウザ拡張機能を使用して、リンクのクリックやファイルのダウンロードなどのユーザー操作を傍受し、リモートサーバー上で動作する安全で隔離されたアプリケーション環境にリダイレクトします。
    ko_KR: 사용자가 강력한 컨테이너 기반 데스크톱 애플리케이션을 웹 브라우저로 직접 스트리밍하여 실행할 수 있도록 지원하는 자체 호스팅 클라이언트-서버 플랫폼입니다. 브라우저 확장 프로그램을 사용하여 링크 클릭이나 파일 다운로드와 같은 사용자 동작을 가로채고 원격 서버에서 실행되는 안전하고 격리된 애플리케이션 환경으로 리디렉션합니다.
    ml_IN: ഒരു വെബ് ബ്രൗസറിലേക്ക് നേരിട്ട് സ്ട്രീം ചെയ്യുന്ന ശക്തമായ, കണ്ടെയ്നറൈസ് ചെയ്ത ഡെസ്ക്ടോപ്പ് ആപ്ലിക്കേഷനുകൾ പ്രവർത്തിപ്പിക്കാൻ ഉപയോക്താക്കളെ പ്രാപ്തമാക്കുന്ന ഒരു സ്വയം-ഹോസ്റ്റഡ്, ക്ലയന്റ്-സെർവർ പ്ലാറ്റ്‌ഫോം. ഒരു ലിങ്കിൽ ക്ലിക്ക് ചെയ്യുന്നതോ ഒരു ഫയൽ ഡൗൺലോഡ് ചെയ്യുന്നതോ പോലുള്ള ഉപയോക്തൃ പ്രവർത്തനങ്ങളെ തടസ്സപ്പെടുത്താൻ ഇത് ഒരു ബ്രൗസർ എക്സ്റ്റൻഷൻ ഉപയോഗിക്കുന്നു, കൂടാതെ ഒരു വിദൂര സെർവറിൽ പ്രവർത്തിക്കുന്ന സുരക്ഷിതവും ഒറ്റപ്പെട്ടതുമായ ഒരു ആപ്ലിക്കേഷൻ പരിതസ്ഥിതിയിലേക്ക് അവയെ റീഡയറക്‌ട് ചെയ്യുന്നു.
    nb_NO: En selvhostet klient-server-plattform som lar brukere kjøre kraftige, containeriserte skrivebordsapplikasjoner som strømmes direkte til en nettleser. Den bruker en nettleserutvidelse for å fange opp brukerhandlinger – for eksempel å klikke på en lenke eller laste ned en fil – og omdirigerer dem til et sikkert, isolert applikasjonsmiljø som kjører på en ekstern server.
    nl_NL: Een zelfgehost client-serverplatform waarmee gebruikers krachtige, gecontaineriseerde desktopapplicaties rechtstreeks naar een webbrowser kunnen streamen. Het maakt gebruik van een browserextensie om gebruikersacties te onderscheppen, zoals het klikken op een link of het downloaden van een bestand, en stuurt deze door naar een veilige, geïsoleerde applicatieomgeving die op een externe server draait.
    pl_PL: Samodzielnie hostowana platforma klient-serwer, która umożliwia użytkownikom uruchamianie wydajnych, skonteneryzowanych aplikacji desktopowych przesyłanych strumieniowo bezpośrednio do przeglądarki internetowej. Wykorzystuje rozszerzenie przeglądarki do przechwytywania działań użytkownika, takich jak kliknięcie linku lub pobranie pliku, i przekierowuje je do bezpiecznego, odizolowanego środowiska aplikacji działającego na zdalnym serwerze.
    pt_BR: Uma plataforma cliente-servidor autohospedada que permite aos usuários executar aplicativos de desktop robustos e conteinerizados, transmitidos diretamente para um navegador web. Ela utiliza uma extensão do navegador para interceptar as ações do usuário — como clicar em um link ou baixar um arquivo — e redirecioná-lo para um ambiente de aplicativo seguro e isolado, executado em um servidor remoto.
    ro_RO: O platformă client-server auto-găzduită, care permite utilizatorilor să ruleze aplicații desktop puternice, containerizate, transmise direct către un browser web. Folosește o extensie de browser pentru a intercepta acțiunile utilizatorilor, cum ar fi clicul pe un link sau descărcarea unui fișier, și îi redirecționează către un mediu de aplicații securizat și izolat care rulează pe un server la distanță.
    ru_RU: Самостоятельно размещаемая клиент-серверная платформа, позволяющая пользователям запускать мощные контейнеризированные настольные приложения, транслируемые непосредственно в веб-браузер. Она использует расширение для браузера, чтобы перехватывать действия пользователя — например, клик по ссылке или загрузку файла — и перенаправлять его в безопасную, изолированную среду приложения, работающую на удаленном сервере.
    sk_SK: Samostatne hostovaná platforma typu klient-server, ktorá umožňuje používateľom spúšťať výkonné kontajnerové desktopové aplikácie streamované priamo do webového prehliadača. Používa rozšírenie prehliadača na zachytenie akcií používateľov – ako je kliknutie na odkaz alebo stiahnutie súboru – a presmeruje ich do zabezpečeného, izolovaného aplikačného prostredia spusteného na vzdialenom serveri.
    sv_SE: En självhostad klient-server-plattform som gör det möjligt för användare att köra kraftfulla, containeriserade skrivbordsapplikationer som streamas direkt till en webbläsare. Den använder ett webbläsartillägg för att fånga upp användaråtgärder – som att klicka på en länk eller ladda ner en fil – och omdirigerar dem till en säker, isolerad applikationsmiljö som körs på en fjärrserver.
    tr_TR: Kullanıcıların güçlü, kapsayıcılaştırılmış masaüstü uygulamalarını doğrudan bir web tarayıcısına aktararak çalıştırmalarını sağlayan, kendi kendine barındırılan, istemci-sunucu tabanlı bir platformdur. Kullanıcı eylemlerini (örneğin bir bağlantıya tıklama veya bir dosya indirme) yakalamak için bir tarayıcı uzantısı kullanır ve bunları uzak bir sunucuda çalışan güvenli, yalıtılmış bir uygulama ortamına yönlendirir.
    zh_CN: 通过浏览器使用远程容器化桌面应用。
    zh_TW: 透過瀏覽器使用遠端容器化桌面應用。
