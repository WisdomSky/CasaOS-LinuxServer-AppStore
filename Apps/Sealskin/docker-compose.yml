name: linuxserver-sealskin
services:
  app:
    image: linuxserver/sealskin:0.3.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: HOST_URL
          description:
            en_US: On initial setup this will be used to fill in the default admin configuration file in the /config directory, if unset the string HOST_URL will need to be replaced. [OPTIONAL]
    ports:
      - target: 8443
        published: 8443
        protocol: tcp
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sealskin/config
        target: /config
      - type: bind
        source: /DATA/AppData/sealskin/storage
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Sealskin is a self-hosted, client-server platform that enables users to run powerful, containerized desktop applications streamed directly to a web browser. It uses a browser extension to intercept user actions—such as clicking a link or downloading a file and redirects them to a secure, isolated application environment running on a remote server.
    ca_ES: Sealskin és una plataforma client-servidor autoallotjada que permet als usuaris executar aplicacions d'escriptori potents i en contenidors que es transmeten directament a un navegador web. Utilitza una extensió del navegador per interceptar les accions de l'usuari, com ara fer clic en un enllaç o descarregar un fitxer, i redirigeix els usuaris a un entorn d'aplicacions segur i aïllat que s'executa en un servidor remot.
    cs_CZ: Sealskin je samostatně hostovaná platforma typu klient-server, která umožňuje uživatelům spouštět výkonné kontejnerizované desktopové aplikace streamované přímo do webového prohlížeče. Používá rozšíření prohlížeče k zachycení akcí uživatelů – jako je kliknutí na odkaz nebo stahování souboru – a přesměrování do zabezpečeného, izolovaného aplikačního prostředí běžícího na vzdáleném serveru.
    da_DK: Sealskin er en selvhostet klient-server-platform, der gør det muligt for brugere at køre kraftfulde, containeriserede desktopapplikationer, der streames direkte til en webbrowser. Den bruger en browserudvidelse til at opfange brugerhandlinger – såsom at klikke på et link eller downloade en fil – og omdirigerer dem til et sikkert, isoleret applikationsmiljø, der kører på en fjernserver.
    de_DE: Sealskin ist eine selbstgehostete Client-Server-Plattform, die es Nutzern ermöglicht, leistungsstarke, containerisierte Desktop-Anwendungen direkt im Webbrowser auszuführen. Sie verwendet eine Browsererweiterung, um Nutzeraktionen – wie das Klicken auf einen Link oder das Herunterladen einer Datei – abzufangen und sie an eine sichere, isolierte Anwendungsumgebung auf einem Remote-Server weiterzuleiten.
    el_GR: Το Sealskin είναι μια αυτοφιλοξενούμενη πλατφόρμα πελάτη-διακομιστή που επιτρέπει στους χρήστες να εκτελούν ισχυρές, κοντέινερ εφαρμογές επιφάνειας εργασίας που μεταδίδονται απευθείας σε ένα πρόγραμμα περιήγησης ιστού. Χρησιμοποιεί μια επέκταση προγράμματος περιήγησης για να αναχαιτίζει τις ενέργειες των χρηστών, όπως το κλικ σε έναν σύνδεσμο ή τη λήψη ενός αρχείου, και τους ανακατευθύνει σε ένα ασφαλές, απομονωμένο περιβάλλον εφαρμογών που εκτελείται σε έναν απομακρυσμένο διακομιστή.
    en_GB: Sealskin is a self-hosted, client-server platform that enables users to run powerful, containerized desktop applications streamed directly to a web browser. It uses a browser extension to intercept user actions—such as clicking a link or downloading a file and redirects them to a secure, isolated application environment running on a remote server.
    es_ES: Sealskin es una plataforma cliente-servidor autoalojada que permite a los usuarios ejecutar potentes aplicaciones de escritorio en contenedores, transmitidas directamente a un navegador web. Utiliza una extensión del navegador para interceptar las acciones del usuario, como hacer clic en un enlace o descargar un archivo, y las redirige a un entorno de aplicación seguro y aislado que se ejecuta en un servidor remoto.
    fr_FR: Sealskin est une plateforme client-serveur auto-hébergée qui permet aux utilisateurs d'exécuter des applications de bureau conteneurisées et performantes, diffusées directement dans un navigateur web. Elle utilise une extension de navigateur pour intercepter les actions de l'utilisateur (cliquer sur un lien, télécharger un fichier, etc.) et les rediriger vers un environnement d'application sécurisé et isolé, exécuté sur un serveur distant.
    ga_IE: Is ardán féinóstáilte cliant-freastalaí é Sealskin a chuireann ar chumas úsáideoirí feidhmchláir deisce coimeádánaithe chumhachtacha a rith a shruthlaítear go díreach chuig brabhsálaí gréasáin. Úsáideann sé síneadh brabhsálaí chun gníomhartha úsáideoirí a thascradh—amhail cliceáil ar nasc nó comhad a íoslódáil—agus atreoraíonn sé iad chuig timpeallacht feidhmchláir slán, scoite atá ag rith ar fhreastalaí iargúlta.
    hr_HR: Sealskin je samostalno hostana, klijent-poslužitelj platforma koja korisnicima omogućuje pokretanje moćnih, kontejneriziranih desktop aplikacija koje se struje izravno u web preglednik. Koristi proširenje preglednika za presretanje korisničkih radnji - poput klika na poveznicu ili preuzimanja datoteke i preusmjerava ih na sigurno, izolirano okruženje aplikacije koje se izvodi na udaljenom poslužitelju.
    hu_HU: A Sealskin egy saját üzemeltetésű, kliens-szerver platform, amely lehetővé teszi a felhasználók számára, hogy nagy teljesítményű, konténerizált asztali alkalmazásokat futtassanak közvetlenül egy webböngészőbe. Egy böngészőbővítményt használ a felhasználói műveletek – például egy hivatkozásra kattintás vagy egy fájl letöltése – elfogására, és átirányítja őket egy biztonságos, elszigetelt, távoli szerveren futó alkalmazáskörnyezetbe.
    it_IT: Sealskin è una piattaforma client-server self-hosted che consente agli utenti di eseguire potenti applicazioni desktop containerizzate, trasmesse in streaming direttamente a un browser web. Utilizza un'estensione del browser per intercettare le azioni dell'utente, come il clic su un link o il download di un file, e reindirizzarle a un ambiente applicativo sicuro e isolato in esecuzione su un server remoto.
    ja_JP: Sealskinは、ユーザーが強力なコンテナ化されたデスクトップアプリケーションをWebブラウザに直接ストリーミングして実行できる、セルフホスト型のクライアント/サーバープラットフォームです。ブラウザ拡張機能を使用して、リンクのクリックやファイルのダウンロードといったユーザーの操作を傍受し、リモートサーバー上で動作する安全で隔離されたアプリケーション環境にリダイレクトします。
    ko_KR: Sealskin은 사용자가 강력한 컨테이너화된 데스크톱 애플리케이션을 웹 브라우저로 직접 스트리밍하여 실행할 수 있도록 지원하는 자체 호스팅 클라이언트-서버 플랫폼입니다. Sealskin은 브라우저 확장 프로그램을 사용하여 링크 클릭이나 파일 다운로드와 같은 사용자 동작을 가로채고, 원격 서버에서 실행되는 안전하고 격리된 애플리케이션 환경으로 리디렉션합니다.
    ml_IN: സീൽസ്കിൻ എന്നത് സ്വയം ഹോസ്റ്റ് ചെയ്ത, ക്ലയന്റ്-സെർവർ പ്ലാറ്റ്‌ഫോമാണ്, ഇത് ഉപയോക്താക്കളെ ശക്തമായ, കണ്ടെയ്‌നറൈസ്ഡ് ഡെസ്‌ക്‌ടോപ്പ് ആപ്ലിക്കേഷനുകൾ നേരിട്ട് വെബ് ബ്രൗസറിലേക്ക് സ്ട്രീം ചെയ്യാൻ പ്രാപ്തമാക്കുന്നു. ഒരു ലിങ്കിൽ ക്ലിക്ക് ചെയ്യുന്നതോ ഒരു ഫയൽ ഡൗൺലോഡ് ചെയ്യുന്നതോ പോലുള്ള ഉപയോക്തൃ പ്രവർത്തനങ്ങളെ തടസ്സപ്പെടുത്താൻ ഇത് ഒരു ബ്രൗസർ എക്സ്റ്റൻഷൻ ഉപയോഗിക്കുന്നു, കൂടാതെ അവയെ ഒരു വിദൂര സെർവറിൽ പ്രവർത്തിക്കുന്ന സുരക്ഷിതവും ഒറ്റപ്പെട്ടതുമായ ഒരു ആപ്ലിക്കേഷൻ പരിതസ്ഥിതിയിലേക്ക് റീഡയറക്‌ട് ചെയ്യുന്നു.
    nb_NO: Sealskin er en selvhostet klient-server-plattform som lar brukere kjøre kraftige, containeriserte skrivebordsapplikasjoner som strømmes direkte til en nettleser. Den bruker en nettleserutvidelse for å fange opp brukerhandlinger – som å klikke på en lenke eller laste ned en fil – og omdirigerer dem til et sikkert, isolert applikasjonsmiljø som kjører på en ekstern server.
    nl_NL: Sealskin is een zelfgehost client-serverplatform waarmee gebruikers krachtige, gecontaineriseerde desktopapplicaties rechtstreeks naar een webbrowser kunnen streamen. Het maakt gebruik van een browserextensie om gebruikersacties te onderscheppen, zoals het klikken op een link of het downloaden van een bestand, en stuurt deze door naar een veilige, geïsoleerde applicatieomgeving die op een externe server draait.
    pl_PL: Sealskin to samodzielnie hostowana platforma klient-serwer, która umożliwia użytkownikom uruchamianie wydajnych, skonteneryzowanych aplikacji desktopowych przesyłanych strumieniowo bezpośrednio do przeglądarki internetowej. Wykorzystuje rozszerzenie przeglądarki do przechwytywania działań użytkownika – takich jak kliknięcie linku lub pobranie pliku – i przekierowuje je do bezpiecznego, odizolowanego środowiska aplikacji działającego na zdalnym serwerze.
    pt_BR: O Sealskin é uma plataforma cliente-servidor autohospedada que permite aos usuários executar aplicativos de desktop poderosos e conteinerizados, transmitidos diretamente para um navegador da web. Ele usa uma extensão do navegador para interceptar as ações do usuário — como clicar em um link ou baixar um arquivo — e redirecioná-lo para um ambiente de aplicativo seguro e isolado, executado em um servidor remoto.
    ro_RO: Sealskin este o platformă client-server auto-găzduită, care permite utilizatorilor să ruleze aplicații desktop puternice, containerizate, transmise direct către un browser web. Folosește o extensie de browser pentru a intercepta acțiunile utilizatorilor - cum ar fi clicul pe un link sau descărcarea unui fișier - și îi redirecționează către un mediu de aplicații securizat și izolat care rulează pe un server la distanță.
    ru_RU: Sealskin — это саморазмещаемая клиент-серверная платформа, позволяющая пользователям запускать мощные контейнеризированные настольные приложения, передаваемые непосредственно в веб-браузер. Она использует расширение для браузера, чтобы перехватывать действия пользователя — например, клик по ссылке или загрузку файла — и перенаправлять его в безопасную, изолированную среду приложения, работающую на удаленном сервере.
    sk_SK: Sealskin je samostatne hostovaná platforma typu klient-server, ktorá umožňuje používateľom spúšťať výkonné, kontajnerové desktopové aplikácie streamované priamo do webového prehliadača. Používa rozšírenie prehliadača na zachytenie akcií používateľov – ako je kliknutie na odkaz alebo stiahnutie súboru – a presmeruje ich do zabezpečeného, izolovaného aplikačného prostredia spusteného na vzdialenom serveri.
    sv_SE: Sealskin är en självhostad klient-server-plattform som gör det möjligt för användare att köra kraftfulla, containerbaserade skrivbordsapplikationer som streamas direkt till en webbläsare. Den använder ett webbläsartillägg för att fånga upp användaråtgärder – som att klicka på en länk eller ladda ner en fil – och omdirigerar dem till en säker, isolerad applikationsmiljö som körs på en fjärrserver.
    tr_TR: Sealskin, kullanıcıların güçlü, kapsayıcılaştırılmış masaüstü uygulamalarını doğrudan bir web tarayıcısına aktararak çalıştırmalarını sağlayan, kendi kendine barındırılan, istemci-sunucu tabanlı bir platformdur. Kullanıcı eylemlerini (örneğin bir bağlantıya tıklama veya bir dosya indirme) yakalamak için bir tarayıcı uzantısı kullanır ve bunları uzak bir sunucuda çalışan güvenli, yalıtılmış bir uygulama ortamına yönlendirir.
    zh_CN: Sealskin 是可自行托管的客户端与服务器平台，让用户直接通过浏览器串流运行强大的容器化桌面应用。它利用浏览器扩展拦截点击链接、下载文件等操作，并将其重定向到远程服务器上安全、隔离的应用环境。
    zh_TW: Sealskin 是可自行託管的客戶端與伺服器平臺，讓使用者直接透過瀏覽器串流執行強大的容器化桌面應用。它利用瀏覽器擴充套件攔截點選連結、下載檔案等操作，並將其重定向到遠端伺服器上安全、隔離的應用環境。
