name: linuxserver-librewolf
services:
  app:
    image: linuxserver/librewolf:155.0.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: LIBREWOLF_CLI
          description:
            en_US: Specify one or multiple LibreWolf CLI flags, this string will be passed to the application in full. [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: LibreWolf is a custom and independent version of Firefox, with the primary goals of privacy, security and user freedom. LibreWolf also aims to remove all the telemetry, data collection and annoyances, as well as disabling anti-freedom features like DRM.
    ca_ES: LibreWolf és una versió personalitzada i independent del Firefox, amb els objectius principals de la privadesa, la seguretat i la llibertat de l'usuari. LibreWolf també pretén eliminar tota la telemetria, la recopilació de dades i les molèsties, així com desactivar les funcions anti-llibertat com ara la DRM.
    cs_CZ: LibreWolf je vlastní a nezávislá verze Firefoxu, jejímž primárním cílem je ochrana soukromí, bezpečnost a uživatelská svoboda. LibreWolf se také snaží odstranit veškerou telemetrii, sběr dat a obtěžující funkce a také deaktivovat funkce narušující svobodu, jako je DRM.
    da_DK: LibreWolf er en brugerdefineret og uafhængig version af Firefox med de primære mål om privatliv, sikkerhed og brugerfrihed. LibreWolf sigter også mod at fjerne al telemetri, dataindsamling og irritationsmomenter, samt deaktivere anti-frihedsfunktioner som DRM.
    de_DE: LibreWolf ist eine angepasste und unabhängige Version von Firefox mit dem Hauptziel, Datenschutz, Sicherheit und Benutzerfreiheit zu gewährleisten. LibreWolf zielt außerdem darauf ab, jegliche Telemetrie, Datenerfassung und sonstige Belästigungen zu entfernen sowie einschränkende Funktionen wie DRM zu deaktivieren.
    el_GR: Το LibreWolf είναι μια προσαρμοσμένη και ανεξάρτητη έκδοση του Firefox, με κύριους στόχους την προστασία της ιδιωτικής ζωής, την ασφάλεια και την ελευθερία των χρηστών. Το LibreWolf στοχεύει επίσης στην αφαίρεση όλων των τηλεμετρικών δεδομένων, της συλλογής δεδομένων και των ενοχλητικών στοιχείων, καθώς και στην απενεργοποίηση λειτουργιών που παραβιάζουν την ελευθερία, όπως το DRM.
    en_GB: Librewolf is a custom and independent version of Firefox, with the primary goals of privacy, security and user freedom. Librewolf also aims to remove all the telemetry, data collection and annoyances, as well as disabling anti-freedom features like Drm.
    es_ES: LibreWolf es una versión personalizada e independiente de Firefox, cuyos objetivos principales son la privacidad, la seguridad y la libertad del usuario. LibreWolf también busca eliminar la telemetría, la recopilación de datos y las molestias, además de desactivar funciones que restringen la libertad, como la gestión de derechos digitales (DRM).
    fr_FR: LibreWolf est une version personnalisée et indépendante de Firefox, axée sur la confidentialité, la sécurité et la liberté des utilisateurs. LibreWolf vise également à supprimer toute télémétrie, collecte de données et autres désagréments, ainsi qu'à désactiver les fonctionnalités liberticides telles que les DRM.
    ga_IE: Is leagan saincheaptha agus neamhspleách de Firefox é LibreWolf, agus is iad na príomhchuspóirí príobháideachta, slándála agus saoirse úsáideora. Tá sé mar aidhm ag LibreWolf freisin an teileamaitríocht, bailiú sonraí agus crá croí go léir a bhaint, chomh maith le gnéithe frith-shaoirse cosúil le DRM a dhíchumasú.
    hr_HR: LibreWolf je prilagođena i neovisna verzija Firefoxa, s primarnim ciljevima privatnosti, sigurnosti i korisničke slobode. LibreWolf također ima za cilj ukloniti svu telemetriju, prikupljanje podataka i smetnje, kao i onemogućiti značajke protiv slobode poput DRM-a.
    hu_HU: A LibreWolf a Firefox egy testreszabott és független verziója, amelynek elsődleges céljai az adatvédelem, a biztonság és a felhasználói szabadság. A LibreWolf célja továbbá az összes telemetriai, adatgyűjtési és bosszantó funkció eltávolítása, valamint a szabadságot korlátozó funkciók, például a DRM letiltása.
    it_IT: LibreWolf è una versione personalizzata e indipendente di Firefox, con l'obiettivo primario di tutelare la privacy, la sicurezza e la libertà dell'utente. LibreWolf si propone inoltre di eliminare la telemetria, la raccolta di dati e le relative frustrazioni, nonché di disabilitare funzionalità che limitano la libertà, come il DRM.
    ja_JP: LibreWolfは、プライバシー、セキュリティ、そしてユーザーの自由を最優先に考えた、Firefoxの独自バージョンです。LibreWolfは、テレメトリ、データ収集、その他の煩わしい機能をすべて排除し、DRMなどの自由を阻害する機能を無効にすることも目指しています。
    ko_KR: LibreWolf는 개인 정보 보호, 보안 및 사용자 자유를 최우선 목표로 하는 맞춤형 독립형 Firefox 버전입니다. LibreWolf는 또한 모든 원격 측정, 데이터 수집 및 불편한 요소들을 제거하고 DRM과 같은 자유를 제한하는 기능들을 비활성화하는 것을 목표로 합니다.
    ml_IN: സ്വകാര്യത, സുരക്ഷ, ഉപയോക്തൃ സ്വാതന്ത്ര്യം എന്നിവയാണ് പ്രധാന ലക്ഷ്യങ്ങൾ. എല്ലാ ടെലിമെട്രി, ഡാറ്റ ശേഖരണം, ശല്യപ്പെടുത്തലുകൾ എന്നിവ നീക്കം ചെയ്യുന്നതിനൊപ്പം DRM പോലുള്ള സ്വാതന്ത്ര്യ വിരുദ്ധ സവിശേഷതകൾ പ്രവർത്തനരഹിതമാക്കാനും ലിബ്രെവുൾഫ് ലക്ഷ്യമിടുന്നു.
    nb_NO: LibreWolf er en tilpasset og uavhengig versjon av Firefox, med hovedmål om personvern, sikkerhet og brukerfrihet. LibreWolf har også som mål å fjerne all telemetri, datainnsamling og irritasjonsmomenter, samt deaktivere frihetsfjernende funksjoner som DRM.
    nl_NL: LibreWolf is een aangepaste en onafhankelijke versie van Firefox, met als belangrijkste doelen privacy, beveiliging en gebruikersvrijheid. LibreWolf streeft er ook naar alle telemetrie, gegevensverzameling en irritaties te verwijderen, en vrijheidsbeperkende functies zoals DRM uit te schakelen.
    pl_PL: LibreWolf to niestandardowa i niezależna wersja przeglądarki Firefox, której głównymi celami są prywatność, bezpieczeństwo i wolność użytkownika. LibreWolf ma również na celu usunięcie wszelkich danych telemetrycznych, gromadzenie danych i uciążliwych elementów, a także wyłączenie funkcji ograniczających wolność, takich jak DRM.
    pt_BR: O LibreWolf é uma versão personalizada e independente do Firefox, com os objetivos principais de privacidade, segurança e liberdade do usuário. O LibreWolf também visa remover toda a telemetria, coleta de dados e incômodos, além de desativar recursos que restringem a liberdade, como o DRM.
    ro_RO: LibreWolf este o versiune personalizată și independentă a Firefox, cu obiective principale de confidențialitate, securitate și libertate a utilizatorului. LibreWolf își propune, de asemenea, să elimine toate telemetriile, colectarea de date și toate problemele, precum și să dezactiveze funcțiile anti-libertate, cum ar fi DRM.
    ru_RU: LibreWolf — это собственная, независимая версия Firefox, основными целями которой являются конфиденциальность, безопасность и свобода пользователей. LibreWolf также стремится удалить всю телеметрию, сбор данных и раздражающие факторы, а также отключить функции, ограничивающие свободу, такие как DRM.
    sk_SK: LibreWolf je vlastná a nezávislá verzia Firefoxu, ktorej hlavnými cieľmi súkromia, bezpečnosti a slobody používateľov. LibreWolf sa tiež zameriava na odstránenie všetkej telemetrie, zhromažďovania údajov a nepríjemností, ako aj na vypnutie funkcií narúšajúcich slobodu, ako je DRM.
    sv_SE: LibreWolf är en anpassad och oberoende version av Firefox, med de primära målen integritet, säkerhet och användarfrihet. LibreWolf strävar också efter att ta bort all telemetri, datainsamling och irritationsmoment, samt inaktivera frihetsfientliga funktioner som DRM.
    tr_TR: LibreWolf, gizlilik, güvenlik ve kullanıcı özgürlüğünü temel hedef olarak belirleyen, Firefox'un özel ve bağımsız bir sürümüdür. LibreWolf ayrıca tüm telemetri, veri toplama ve rahatsız edici unsurları ortadan kaldırmayı ve DRM gibi özgürlük karşıtı özellikleri devre dışı bırakmayı amaçlamaktadır.
    zh_CN: LibreWolf 是经过定制的 Firefox 独立版本，主要目标是保护隐私、安全和用户自由。它旨在移除遥测、数据收集和令人困扰的功能，并禁用 DRM 等限制用户自由的功能。
    zh_TW: LibreWolf 是經過定製的 Firefox 獨立版本，主要目標是保護隱私、安全和使用者自由。它旨在移除遙測、資料收集和令人困擾的功能，並禁用 DRM 等限制使用者自由的功能。
