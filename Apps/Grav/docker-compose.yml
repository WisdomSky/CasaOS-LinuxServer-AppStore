name: linuxserver-grav
services:
  app:
    image: linuxserver/grav:2.1.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Grav is a Fast, Simple, and Flexible, file-based Web-platform.
    zh_CN: Grav 是一个基于文件的网页平台，强调快速、简单和灵活。
  tagline:
    en_US: A Fast, Simple, and Flexible, file-based Web-platform.
    zh_CN: 快速、简单、灵活的文件式网站平台。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grav-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grav-logo.png
  title:
    en_US: Grav (LinuxServer.io)
    zh_CN: Grav（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservergrav
  port_map: '80'
  version: 2.1.6
