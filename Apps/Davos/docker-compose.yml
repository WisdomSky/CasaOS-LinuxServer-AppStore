    ko_KR: 지정된 호스트 위치를 주기적으로 스캔하여 새 파일을 감지하는 FTP 자동화 도구입니다. 특정 파일이 호스트 위치에 나타나면 자동으로 다운로드하고 필요한 경우 이동하는 등 다양한 용도로 설정할 수 있습니다. 또한 완료 알림 기능과 하위 API 호출을 지원하여 워크플로우를 효율적으로 관리할 수 있습니다.
    ml_IN: പുതിയ ഫയലുകൾക്കായി നൽകിയിരിക്കുന്ന ഹോസ്റ്റ് ലൊക്കേഷനുകൾ ഇടയ്ക്കിടെ സ്കാൻ ചെയ്യുന്ന ഒരു FTP ഓട്ടോമേഷൻ ഉപകരണം. ഹോസ്റ്റ് ലൊക്കേഷനിൽ നിർദ്ദിഷ്ട ഫയലുകൾ ദൃശ്യമാകുന്നത് കേൾക്കുന്നത്, ആവശ്യമെങ്കിൽ ഡൗൺലോഡ് ചെയ്യാനും തുടർന്ന് നീക്കാനും തയ്യാറായിരിക്കുന്നത് ഉൾപ്പെടെ വിവിധ ആവശ്യങ്ങൾക്കായി ഇത് കോൺഫിഗർ ചെയ്യാൻ കഴിയും. വർക്ക്ഫ്ലോ കൂടുതൽ മെച്ചപ്പെടുത്തുന്നതിന്, ഡൗൺസ്ട്രീം API കോളുകൾക്കൊപ്പം പൂർത്തീകരണ അറിയിപ്പുകളും ഇത് പിന്തുണയ്ക്കുന്നു.
    nb_NO: Et FTP-automatiseringsverktøy som regelmessig skanner gitte vertslokasjoner etter nye filer. Det kan konfigureres for ulike formål, inkludert å lytte etter bestemte filer som skal vises på vertslokasjonen, klare til nedlasting og deretter flytting, om nødvendig. Det støtter også fullføringsvarsler samt nedstrøms API-kall for å fremme arbeidsflyten.
    nl_NL: Een FTP-automatiseringstool die periodiek opgegeven hostlocaties scant op nieuwe bestanden. De tool kan voor diverse doeleinden worden geconfigureerd, waaronder het detecteren van specifieke bestanden op de hostlocatie, zodat deze gedownload en indien nodig verplaatst kunnen worden. Daarnaast ondersteunt de tool meldingen bij voltooiing en API-aanroepen om de workflow verder te optimaliseren.
    pl_PL: Narzędzie do automatyzacji FTP, które okresowo skanuje określone lokalizacje hostów w poszukiwaniu nowych plików. Można je skonfigurować do różnych celów, w tym do nasłuchiwania pojawiania się określonych plików w lokalizacji hosta, gotowych do pobrania, a następnie przeniesienia, jeśli zajdzie taka potrzeba. Obsługuje również powiadomienia o zakończeniu, a także wywołania API, co usprawnia przepływ pracy.
    pt_BR: Uma ferramenta de automação FTP que verifica periodicamente locais de hospedagem específicos em busca de novos arquivos. Ela pode ser configurada para diversas finalidades, incluindo a detecção de arquivos específicos no local de hospedagem, para que possa ser baixada e movida, se necessário. Também oferece suporte a notificações de conclusão e chamadas de API subsequentes para otimizar o fluxo de trabalho.
    ro_RO: Un instrument de automatizare FTP care scanează periodic locațiile gazdă date pentru fișiere noi. Poate fi configurat pentru diverse scopuri, inclusiv așteptarea apariției anumitor fișiere în locația gazdă, gata de descărcare și apoi mutare, dacă este necesar. De asemenea, acceptă notificări de finalizare, precum și apeluri API downstream, pentru a îmbunătăți fluxul de lucru.
    ru_RU: Инструмент автоматизации FTP, который периодически сканирует указанные расположения файлов на хосте на наличие новых файлов. Его можно настроить для различных целей, включая отслеживание появления определенных файлов в указанном расположении на хосте, готовых к загрузке и последующему перемещению при необходимости. Он также поддерживает уведомления о завершении процесса, а также вызовы API для дальнейшего оптимизации рабочего процесса.
    sk_SK: Nástroj na automatizáciu FTP, ktorý pravidelne prehľadáva dané hostiteľské umiestnenia a hľadá nové súbory. Dá sa nakonfigurovať na rôzne účely vrátane počúvania konkrétnych súborov, ktoré sa majú objaviť na hostiteľskom umiestnení, pripravené na stiahnutie a následné presunutie, ak je to potrebné. Podporuje tiež upozornenia na dokončenie, ako aj volania API pre následné spracovanie, čo podporuje pracovný postup.
    sv_SE: Ett FTP-automatiseringsverktyg som regelbundet skannar givna värdplatser efter nya filer. Det kan konfigureras för olika ändamål, inklusive att lyssna efter specifika filer som visas på värdplatsen, redo att laddas ner och sedan flyttas, om det behövs. Det stöder även aviseringar om slutförande samt nedströms API-anrop för att främja arbetsflödet.
    tr_TR: Belirtilen sunucu konumlarını periyodik olarak tarayarak yeni dosyaları tespit eden bir FTP otomasyon aracıdır. Çeşitli amaçlar için yapılandırılabilir; örneğin, sunucu konumunda belirli dosyaların görünmesini bekleyebilir, bunları indirip gerekirse taşıyabilir. Ayrıca, iş akışını daha da geliştirmek için tamamlanma bildirimlerini ve alt API çağrılarını da destekler.
    zh_CN: 自动扫描 FTP 服务器并下载新文件。
    zh_TW: 自動掃描 FTP 伺服器並下載新檔案。
