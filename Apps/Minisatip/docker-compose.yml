name: linuxserver-minisatip
services:
  app:
    image: linuxserver/minisatip:2.0.105
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: RUN_OPTS
          description:
            en_US: Specify specific run params for minisatip
    ports:
      - target: 8875
        published: 8875
        protocol: tcp
      - target: 554
        published: 554
        protocol: tcp
      - target: 1900
        published: 1900
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/minisatip/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Minisatip is a multi-threaded satip server version 1.2 that runs under Linux and it was tested with DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC and ISDB-T cards.
    ca_ES: Minisatip és un servidor satip multifil versió 1.2 que funciona sota Linux i s'ha provat amb targetes DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC i ISDB-T.
    cs_CZ: Minisatip je vícevláknový server Satip verze 1.2, který běží pod Linuxem a byl testován s kartami DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC a ISDB-T.
    da_DK: Minisatip er en multi-threaded satip-server version 1.2, der kører under Linux, og den er blevet testet med DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC og ISDB-T kort.
    de_DE: Minisatip ist ein Multithread-SATIP-Server Version 1.2, der unter Linux läuft und mit DVB-S-, DVB-S2-, DVB-T-, DVB-T2-, DVB-C-, DVB-C2-, ATSC- und ISDB-T-Karten getestet wurde.
    el_GR: Το Minisatip είναι ένας πολυνηματικός διακομιστής satip έκδοση 1.2 που λειτουργεί σε Linux και δοκιμάστηκε με κάρτες DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC και ISDB-T.
    en_GB: Minisatip is a multi-threaded satip server version 1.2 that runs under Linux and it was tested with Dvb-S, Dvb-S2, Dvb-T, Dvb-T2, Dvb-C, Dvb-C2, Atsc and Isdb-T cards.
    es_ES: Minisatip es un servidor satip multihilo versión 1.2 que se ejecuta en Linux y fue probado con tarjetas DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC e ISDB-T.
    fr_FR: Minisatip est un serveur satip multithread version 1.2 qui fonctionne sous Linux et a été testé avec des cartes DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC et ISDB-T.
    ga_IE: Is freastalaí satip il-shnáithe leagan 1.2 é Minisatip a ritheann faoi Linux agus rinneadh tástáil air le cártaí DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC agus ISDB-T.
    hr_HR: Minisatip je višenitni satip poslužitelj verzije 1.2 koji radi pod Linuxom i testiran je s DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC i ISDB-T karticama.
    hu_HU: A Minisatip egy többszálú satip szerver 1.2-es verziója, amely Linux alatt fut, és DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC és ISDB-T kártyákkal tesztelték.
    it_IT: Minisatip è un server satip multi-thread versione 1.2 che funziona su Linux ed è stato testato con schede DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC e ISDB-T.
    ja_JP: Minisatipは、Linux上で動作するマルチスレッド対応のsatipサーバーバージョン1.2で、DVB-S、DVB-S2、DVB-T、DVB-T2、DVB-C、DVB-C2、ATSC、ISDB-Tカードでテスト済みです。
    ko_KR: Minisatip은 Linux에서 실행되는 멀티스레드 방식의 위성방송(satip) 서버 버전 1.2이며, DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC 및 ISDB-T 카드와 함께 테스트되었습니다.
    ml_IN: ലിനക്സിൽ പ്രവർത്തിക്കുന്ന ഒരു മൾട്ടി-ത്രെഡഡ് സാറ്റിപ്പ് സെർവർ പതിപ്പ് 1.2 ആണ് മിനിസാറ്റിപ്പ്, ഇത് DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC, ISDB-T കാർഡുകൾ ഉപയോഗിച്ച് പരീക്ഷിച്ചു.
    nb_NO: Minisatip er en flertrådet satip-server versjon 1.2 som kjører under Linux, og den ble testet med DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC og ISDB-T-kort.
    nl_NL: Minisatip is een multithreaded SATIP-server versie 1.2 die onder Linux draait en is getest met DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC en ISDB-T kaarten.
    pl_PL: Minisatip to wielowątkowy serwer satip w wersji 1.2, który działa w systemie Linux i był testowany z kartami DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC i ISDB-T.
    pt_BR: Minisatip é um servidor satip multithread versão 1.2 que roda em Linux e foi testado com placas DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC e ISDB-T.
    ro_RO: Minisatip este un server satip multi-threaded versiunea 1.2 care rulează sub Linux și a fost testat cu plăci DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC și ISDB-T.
    ru_RU: Minisatip — это многопоточный сервер SatiPatip версии 1.2, работающий под управлением Linux. Он был протестирован с картами DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC и ISDB-T.
    sk_SK: Minisatip je viacvláknový server Satip verzie 1.2, ktorý beží pod Linuxom a bol testovaný s kartami DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC a ISDB-T.
    sv_SE: Minisatip är en flertrådad satip-server version 1.2 som körs under Linux och den testades med DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC och ISDB-T-kort.
    tr_TR: Minisatip, Linux altında çalışan ve DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC ve ISDB-T kartlarıyla test edilmiş, çoklu iş parçacıklı bir satip sunucu sürümü 1.2'dir.
    zh_CN: Minisatip 是在 Linux 上运行的多线程 SAT>IP 1.2 服务器，已使用 DVB-S、DVB-S2、DVB-T、DVB-T2、DVB-C、DVB-C2、ATSC 和 ISDB-T 接收卡进行测试。
