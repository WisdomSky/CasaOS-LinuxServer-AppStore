    nl_NL: VSCodium is een door de community ontwikkelde, vrij gelicentieerde binaire distributie van Microsofts editor VS Code.
    pl_PL: VSCodium to oparta na społeczności, udostępniana na wolnej licencji, binarna dystrybucja edytora VS Code firmy Microsoft.
    pt_BR: O VSCodium é uma distribuição binária do editor VS Code da Microsoft, licenciada gratuitamente e mantida pela comunidade.
    ro_RO: VSCodium este o distribuție binară, condusă de comunitate și licențiată liber, a editorului VS Code de la Microsoft.
    ru_RU: VSCodium — это разрабатываемая сообществом, свободно распространяемая бинарная версия редактора VS Code от Microsoft.
    sk_SK: VSCodium je komunitne riadená, voľne licencovaná binárna distribúcia editora VS Code od spoločnosti Microsoft.
    sv_SE: VSCodium är en community-driven, fritt licensierad binärdistribution av Microsofts editor VS Code.
    tr_TR: VSCodium, Microsoft'un VS Code editörünün topluluk tarafından geliştirilen, ücretsiz lisanslı bir ikili dağıtımıdır.
    zh_CN: VSCodium 是由社区推动、采用自由许可证的微软 VS Code 编辑器二进制发行版。
    zh_TW: VSCodium 是由社群推動、採用自由許可證的微軟 VS Code 編輯器二進位制發行版。
