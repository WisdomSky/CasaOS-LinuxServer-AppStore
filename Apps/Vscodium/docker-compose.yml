name: linuxserver-vscodium
services:
  app:
    image: linuxserver/vscodium:1.135.06055
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: VSCodium is a community-driven, freely-licensed binary distribution of Microsoft’s editor VS Code.
    zh_CN: VSCodium 是由社区推动、采用自由许可证的微软 VS Code 编辑器二进制发行版。
  tagline:
    en_US: A community-driven, freely-licensed binary distribution of Microsoft’s editor VS Code.
    zh_CN: 社区维护、采用自由许可证的 VS Code 二进制发行版。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscodium-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscodium-icon.png
  title:
    en_US: Vscodium (LinuxServer.io)
    zh_CN: Vscodium（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservervscodium
  port_map: '3000'
  version: 1.135.06055
