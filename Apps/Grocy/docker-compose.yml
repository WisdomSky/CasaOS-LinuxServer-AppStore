name: linuxserver-grocy
services:
  app:
    image: linuxserver/grocy:4.7.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 9283
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Grocy is an ERP system for your kitchen! Cut down on food waste, and manage your chores with this brilliant utility. Keep track of your purchases, how much food you are wasting, what chores need doing and what batteries need charging with this proudly Open Source tool For more information on grocy visit their website and check it out: https://grocy.info'
    ca_ES: 'Grocy és un sistema ERP per a la teva cuina! Redueix el malbaratament d''aliments i gestiona les teves tasques amb aquesta brillant utilitat. Fes un seguiment de les teves compres, de quant menjar estàs malgastant, de quines tasques cal fer i de quines bateries cal carregar amb aquesta eina orgullosament de codi obert. Per a més informació sobre grocy, visita el seu lloc web i consulta-ho: https://grocy.info'
    cs_CZ: 'Grocy je ERP systém pro vaši kuchyň! Snižte plýtvání potravinami a spravujte své domácí práce s tímto skvělým nástrojem. Sledujte své nákupy, kolik jídla plýtváte, jaké domácí práce je třeba udělat a jaké baterie je třeba nabít s tímto hrdě open source nástrojem. Pro více informací o Grocy navštivte jejich webové stránky: https://grocy.info'
    da_DK: 'Grocy er et ERP-system til dit køkken! Reducer madspild og administrer dine pligter med dette geniale værktøj. Hold styr på dine indkøb, hvor meget mad du spilder, hvilke pligter der skal udføres, og hvilke batterier der skal oplades med dette stolt open source-værktøj. For mere information om grocy, besøg deres hjemmeside og tjek det ud: https://grocy.info'
    de_DE: 'Grocy ist ein ERP-System für Ihre Küche! Reduzieren Sie Lebensmittelverschwendung und organisieren Sie Ihre Aufgaben mit diesem genialen Tool. Behalten Sie den Überblick über Ihre Einkäufe, Ihre Lebensmittelabfälle, anstehende Aufgaben und den Ladebedarf Ihrer Batterien – mit diesem Open-Source-Tool. Weitere Informationen zu Grocy finden Sie auf der Website: https://grocy.info'
    el_GR: 'Το Grocy είναι ένα σύστημα ERP για την κουζίνα σας! Μειώστε τη σπατάλη τροφίμων και διαχειριστείτε τις δουλειές του σπιτιού σας με αυτό το εξαιρετικό βοηθητικό πρόγραμμα. Παρακολουθήστε τις αγορές σας, πόσα τρόφιμα σπαταλάτε, ποιες δουλειές πρέπει να κάνετε και ποιες μπαταρίες χρειάζονται φόρτιση με αυτό το εργαλείο ανοιχτού κώδικα. Για περισσότερες πληροφορίες σχετικά με το grocy, επισκεφθείτε την ιστοσελίδα τους: https://grocy.info'
    en_GB: 'Grocy is an Erp system for your kitchen! Cut down on food waste, and manage your chores with this brilliant utility. Keep track of your purchases, how much food you are wasting, what chores need doing and what batteries need charging with this proudly Open Source tool For more information on grocy visit their website and check it out: https://grocy.info'
    es_ES: '¡Grocy es un sistema ERP para tu cocina! Reduce el desperdicio de alimentos y gestiona tus tareas con esta fantástica herramienta. Controla tus compras, la cantidad de comida que desperdicias, las tareas pendientes y la carga de tus baterías con esta herramienta de código abierto. Para más información sobre Grocy, visita su sitio web: https://grocy.info'
    fr_FR: "Grocy est un système ERP pour votre cuisine\_! Réduisez le gaspillage alimentaire et gérez vos tâches ménagères grâce à cet outil ingénieux. Suivez vos achats, le gaspillage alimentaire, les tâches à accomplir et le niveau de charge de vos appareils grâce à cet outil open source. Pour en savoir plus sur Grocy, rendez-vous sur leur site web\_: https://grocy.info"
    ga_IE: 'Is córas ERP é Grocy do do chistin! Laghdaigh dramhaíl bia, agus bainistigh do chuid tascanna leis an bhfóntas iontach seo. Coinnigh súil ar do cheannacháin, cé mhéad bia atá á chur amú agat, cad iad na tascanna atá le déanamh agus cad iad na cadhnraí atá le muirearú leis an uirlis Foinse Oscailte seo atá bródúil as. Chun tuilleadh eolais a fháil faoi grocy, tabhair cuairt ar a suíomh Gréasáin agus féach air: https://grocy.info'
    hr_HR: 'Grocy je ERP sustav za vašu kuhinju! Smanjite bacanje hrane i upravljajte svojim kućanskim poslovima uz ovaj sjajan alat. Pratite svoje kupnje, koliko hrane bacate, koje kućanske poslove treba obaviti i koje baterije treba napuniti uz ovaj alat otvorenog koda. Za više informacija o Grocyju posjetite njihovu web stranicu: https://grocy.info'
    hu_HU: 'A Grocy egy ERP rendszer a konyhád számára! Csökkentsd az élelmiszer-pazarlást, és kezeld a házimunkádat ezzel a zseniális segédprogrammal. Kövesd nyomon a vásárlásaidat, a kidobott élelmiszer mennyiségét, a szükséges házimunkákat és az akkumulátorok töltését ezzel a büszkén nyílt forráskódú eszközzel. További információkért a Grocy-ról látogass el a weboldalukra: https://grocy.info'
    it_IT: 'Grocy è un sistema ERP per la tua cucina! Riduci gli sprechi alimentari e gestisci le faccende domestiche con questa fantastica utility. Tieni traccia dei tuoi acquisti, di quanto cibo stai sprecando, delle faccende da svolgere e delle batterie da caricare con questo strumento orgogliosamente Open Source. Per maggiori informazioni su Grocy, visita il loro sito web e scoprilo: https://grocy.info'
    ja_JP: Grocyは、キッチン向けのERPシステムです！この優れたツールで食品ロスを削減し、家事を効率的に管理しましょう。購入品、食品ロス量、必要な家事、充電が必要なバッテリーなど、あらゆる情報をこのオープンソースツールで管理できます。Grocyの詳細については、ウェブサイト（https://grocy.info）をご覧ください。
    ko_KR: Grocy는 주방을 위한 ERP 시스템입니다! 음식물 쓰레기를 줄이고, 이 훌륭한 유틸리티로 집안일을 효율적으로 관리하세요. 구매 내역, 음식물 낭비량, 해야 할 집안일, 충전해야 할 배터리 등을 이 자랑스러운 오픈 소스 도구로 손쉽게 추적할 수 있습니다. Grocy에 대한 자세한 정보는 웹사이트(https://grocy.info)에서 확인하세요.
    ml_IN: 'ഗ്രോസി നിങ്ങളുടെ അടുക്കളയ്ക്കുള്ള ഒരു ERP സംവിധാനമാണ്! ഭക്ഷണ പാഴാക്കൽ കുറയ്ക്കുക, ഈ മികച്ച യൂട്ടിലിറ്റി ഉപയോഗിച്ച് നിങ്ങളുടെ ജോലികൾ കൈകാര്യം ചെയ്യുക. നിങ്ങളുടെ വാങ്ങലുകൾ, നിങ്ങൾ എത്ര ഭക്ഷണം പാഴാക്കുന്നു, എന്ത് ജോലികൾ ചെയ്യണം, ബാറ്ററികൾ ചാർജ് ചെയ്യേണ്ടത് എന്നിവ ഈ അഭിമാനകരമായ ഓപ്പൺ സോഴ്‌സ് ഉപകരണം ഉപയോഗിച്ച് ട്രാക്ക് ചെയ്യുക ഗ്രോസിയെക്കുറിച്ചുള്ള കൂടുതൽ വിവരങ്ങൾക്ക് അവരുടെ വെബ്‌സൈറ്റ് സന്ദർശിച്ച് പരിശോധിക്കുക: https://grocy.info'
    nb_NO: 'Grocy er et ERP-system for kjøkkenet ditt! Reduser matsvinn og administrer gjøremålene dine med dette geniale verktøyet. Hold oversikt over kjøpene dine, hvor mye mat du kaster, hvilke gjøremål som må gjøres og hvilke batterier som må lades med dette stolt åpen kildekode-verktøyet. For mer informasjon om grocy, besøk nettstedet deres og sjekk det ut: https://grocy.info'
    nl_NL: 'Grocy is een ERP-systeem voor je keuken! Verminder voedselverspilling en beheer je huishoudelijke taken met deze briljante tool. Houd bij wat je koopt, hoeveel voedsel je verspilt, welke klusjes er gedaan moeten worden en welke batterijen opgeladen moeten worden met deze open source tool. Ga voor meer informatie over Grocy naar hun website: https://grocy.info'
    pl_PL: 'Grocy to system ERP dla Twojej kuchni! Ogranicz marnowanie żywności i zarządzaj swoimi obowiązkami dzięki temu genialnemu narzędziu. Śledź swoje zakupy, ilość marnowanego jedzenia, obowiązki do wykonania i baterie do naładowania dzięki temu narzędziu, z dumą udostępnianemu jako Open Source. Aby dowiedzieć się więcej o Grocy, odwiedź ich stronę internetową: https://grocy.info'
    pt_BR: 'Grocy é um sistema ERP para a sua cozinha! Reduza o desperdício de alimentos e gerencie suas tarefas com esta ferramenta incrível. Acompanhe suas compras, a quantidade de comida que você está desperdiçando, as tarefas a serem feitas e até mesmo as baterias que precisam ser carregadas com esta ferramenta de código aberto. Para mais informações sobre o Grocy, visite o site: https://grocy.info'
    ro_RO: 'Grocy este un sistem ERP pentru bucătăria ta! Redu risipa alimentară și gestionează-ți treburile casnice cu acest utilitar genial. Urmărește-ți achizițiile, câtă mâncare irosești, ce treburi trebuie făcute și ce baterii trebuie încărcate cu acest instrument open source. Pentru mai multe informații despre grocy, vizitează site-ul lor web: https://grocy.info'
    ru_RU: 'Grocy — это ERP-система для вашей кухни! Сократите количество пищевых отходов и управляйте своими делами с помощью этого замечательного инструмента. Отслеживайте свои покупки, количество выбрасываемой еды, какие дела нужно сделать и какие батареи нужно зарядить — всё это с помощью этого инструмента с открытым исходным кодом. Для получения дополнительной информации о Grocy посетите их веб-сайт: https://grocy.info'
    sk_SK: 'Grocy je ERP systém pre vašu kuchyňu! Znížte plytvanie potravinami a spravujte si svoje domáce práce pomocou tohto skvelého nástroja. Sledujte svoje nákupy, koľko jedla vyhodíte, aké domáce práce treba urobiť a aké batérie treba nabiť pomocou tohto hrdo open source nástroja. Viac informácií o Grocy nájdete na ich webovej stránke: https://grocy.info'
    sv_SE: 'Grocy är ett ERP-system för ditt kök! Minska matsvinnet och hantera dina sysslor med detta briljanta verktyg. Håll koll på dina inköp, hur mycket mat du slösar, vilka sysslor som behöver göras och vilka batterier som behöver laddas med detta stolt öppna källkodsverktyg. För mer information om grocy, besök deras webbplats och kolla in den: https://grocy.info'
    tr_TR: 'Grocy, mutfağınız için bir ERP sistemidir! Bu harika araçla gıda israfını azaltın ve ev işlerinizi yönetin. Bu gururla açık kaynaklı araçla satın alımlarınızı, ne kadar gıda israf ettiğinizi, hangi ev işlerinin yapılması gerektiğini ve hangi pillerin şarj edilmesi gerektiğini takip edin. Grocy hakkında daha fazla bilgi için web sitelerini ziyaret edin ve inceleyin: https://grocy.info'
    zh_CN: Grocy 是面向厨房的 ERP 系统，可帮助减少食物浪费并管理家务。使用这个开源工具，你可以追踪采购、食物浪费、待办家务以及需要充电的电池。更多信息请访问：https://grocy.info
    zh_TW: Grocy 是面向廚房的 ERP 系統，可幫助減少食物浪費並管理家務。使用這個開源工具，你可以追蹤採購、食物浪費、待辦家務以及需要充電的電池。更多資訊請訪問：https://grocy.info
