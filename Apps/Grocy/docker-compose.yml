    ko_KR: 주방을 위한 ERP 시스템. 음식물 쓰레기를 줄이고, 이 훌륭한 유틸리티로 집안일을 효율적으로 관리하세요. 구매 내역, 음식물 쓰레기 양, 해야 할 집안일, 충전해야 할 배터리 등을 이 자랑스러운 오픈 소스 도구로 손쉽게 추적할 수 있습니다. grocy에 대한 자세한 정보는 웹사이트(https://grocy.info)를 방문하세요.
    ml_IN: 'നിങ്ങളുടെ അടുക്കളയ്ക്ക് ഒരു ERP സിസ്റ്റം. ഭക്ഷണ മാലിന്യം കുറയ്ക്കുക, ഈ മികച്ച യൂട്ടിലിറ്റി ഉപയോഗിച്ച് നിങ്ങളുടെ ജോലികൾ കൈകാര്യം ചെയ്യുക. നിങ്ങളുടെ വാങ്ങലുകൾ, നിങ്ങൾ എത്ര ഭക്ഷണം പാഴാക്കുന്നു, എന്ത് ജോലികൾ ചെയ്യണം, ബാറ്ററികൾ ചാർജ് ചെയ്യേണ്ടത് എന്നിവ ഈ അഭിമാനകരമായ ഓപ്പൺ സോഴ്‌സ് ഉപകരണം ഉപയോഗിച്ച് ട്രാക്ക് ചെയ്യുക ഗ്രോസിയെക്കുറിച്ചുള്ള കൂടുതൽ വിവരങ്ങൾക്ക് അവരുടെ വെബ്‌സൈറ്റ് സന്ദർശിച്ച് പരിശോധിക്കുക: https://grocy. വിവരങ്ങൾ'
    nb_NO: 'Et ERP-system for kjøkkenet ditt. Reduser matsvinn og administrer gjøremålene dine med dette geniale verktøyet. Hold oversikt over kjøpene dine, hvor mye mat du kaster, hvilke gjøremål som må gjøres og hvilke batterier som må lades med dette stolt åpen kildekode-verktøyet. For mer informasjon om grocy, besøk nettstedet deres og sjekk det ut: https://grocy.info'
    nl_NL: 'Een ERP-systeem voor je keuken. Verminder voedselverspilling en beheer je huishoudelijke taken met deze briljante tool. Houd bij wat je koopt, hoeveel voedsel je verspilt, welke klusjes er gedaan moeten worden en welke batterijen opgeladen moeten worden met deze open source tool. Ga voor meer informatie over Grocy naar hun website: https://grocy.info'
    pl_PL: 'System ERP dla Twojej kuchni. Ogranicz marnowanie żywności i zarządzaj swoimi obowiązkami dzięki temu genialnemu narzędziu. Śledź swoje zakupy, ilość marnowanego jedzenia, obowiązki do wykonania i baterie do naładowania dzięki temu narzędziu, które z dumą udostępniamy jako oprogramowanie Open Source. Aby uzyskać więcej informacji o Grocy, odwiedź ich stronę internetową: https://grocy. Informacje'
    pt_BR: 'Um sistema ERP para a sua cozinha. Reduza o desperdício de alimentos e gerencie suas tarefas com este utilitário incrível. Acompanhe suas compras, a quantidade de comida que você está desperdiçando, as tarefas a serem feitas e as baterias que precisam ser carregadas com esta ferramenta de código aberto. Para mais informações sobre o Grocy, visite o site: https://grocy.info'
    ro_RO: 'Un sistem ERP pentru bucătăria ta. Redu risipa alimentară și gestionează-ți treburile casnice cu acest utilitar genial. Urmărește-ți achizițiile, câtă mâncare irosești, ce treburi trebuie făcute și ce baterii trebuie încărcate cu acest instrument open source. Pentru mai multe informații despre grocy, vizitează site-ul lor web și verifică: https://grocy. Info'
    ru_RU: 'ERP-система для вашей кухни. Сократите количество пищевых отходов и управляйте своими делами с помощью этого замечательного инструмента. Отслеживайте свои покупки, количество выбрасываемой еды, какие дела нужно сделать и какие батареи нужно зарядить — этот инструмент с открытым исходным кодом создан с гордостью за свой продукт. Для получения дополнительной информации о Grocy посетите их веб-сайт: https://grocy.Info'
    sk_SK: 'ERP systém pre vašu kuchyňu. Znížte plytvanie potravinami a spravujte si svoje domáce práce s týmto skvelým nástrojom. Sledujte svoje nákupy, koľko jedla vyhodíte, aké domáce práce treba urobiť a aké batérie treba nabiť pomocou tohto hrdo open source nástroja. Viac informácií o Grocy nájdete na ich webovej stránke: https://grocy.info'
    sv_SE: 'Ett ERP-system för ditt kök. Minska matsvinnet och hantera dina sysslor med detta briljanta verktyg. Håll koll på dina inköp, hur mycket mat du slösar, vilka sysslor som behöver göras och vilka batterier som behöver laddas med detta stolta verktyg med öppen källkod. För mer information om grocy, besök deras webbplats och kolla in den: https://grocy.info'
    tr_TR: 'Mutfağınız için bir ERP sistemi. Bu harika araçla gıda israfını azaltın ve ev işlerinizi yönetin. Bu gururla açık kaynaklı araçla satın alımlarınızı, ne kadar gıda israf ettiğinizi, hangi ev işlerinin yapılması gerektiğini ve hangi pillerin şarj edilmesi gerektiğini takip edin. Grocy hakkında daha fazla bilgi için web sitelerini ziyaret edin ve inceleyin: https://grocy.info'
    zh_CN: 管理厨房库存、采购、家务和耗材。
    zh_TW: 管理廚房庫存、採購、家務和耗材。
