    it_IT: Il software serve ad autenticare gli utenti che richiedono risorse protette da server proxy gestiti da nginx. Include un demone (ldap-auth) che comunica con un server di autenticazione e un demone web server che genera un cookie di autenticazione basato sulle credenziali dell'utente. I demoni sono scritti in Python per l'utilizzo con un server di autenticazione LDAP (Lightweight Directory Access Protocol) (OpenLDAP o Microsoft Windows Active Directory 2003 e 2012).
    ja_JP: このソフトウェアは、nginxによってプロキシされたサーバーから保護されたリソースを要求するユーザーを認証するためのものです。認証サーバーと通信するデーモン（ldap-auth）と、ユーザーの認証情報に基づいて認証クッキーを生成するWebサーバーデーモンが含まれています。これらのデーモンは、軽量ディレクトリアクセスプロトコル（LDAP）認証サーバー（OpenLDAPまたはMicrosoft Windows Active Directory 2003および2012）で使用するためにPythonで記述されています。
    ko_KR: 이 소프트웨어는 Nginx를 통해 프록시된 서버에서 보호된 리소스를 요청하는 사용자를 인증하기 위한 것입니다. 여기에는 인증 서버와 통신하는 데몬(ldap-auth)과 사용자의 자격 증명을 기반으로 인증 쿠키를 생성하는 웹 서버 데몬이 포함됩니다. 이 데몬들은 LDAP(Lightweight Directory Access Protocol) 인증 서버(OpenLDAP 또는 Microsoft Windows Active Directory 2003 및 2012)와 함께 사용하도록 Python으로 작성되었습니다.
    ml_IN: nginx പ്രോക്സി ചെയ്ത സെർവറുകളിൽ നിന്ന് പരിരക്ഷിത ഉറവിടങ്ങൾ അഭ്യർത്ഥിക്കുന്ന ഉപയോക്താക്കളെ ആധികാരികമാക്കുന്നതിനാണ് സോഫ്റ്റ്‌വെയർ. ഒരു ആധികാരികത സെർവറുമായി ആശയവിനിമയം നടത്തുന്ന ഒരു ഡെമൺ (ldap-auth), ഉപയോക്താവിന്റെ ക്രെഡൻഷ്യലുകളെ അടിസ്ഥാനമാക്കി ഒരു ആധികാരികത കുക്കി സൃഷ്ടിക്കുന്ന ഒരു വെബ്‌സെർവർ ഡെമൺ എന്നിവ ഇതിൽ ഉൾപ്പെടുന്നു. ലൈറ്റ്‌വെയ്റ്റ് ഡയറക്‌ടറി ആക്‌സസ് പ്രോട്ടോക്കോൾ (LDAP) പ്രാമാണീകരണ സെർവറിൽ (OpenLDAP അല്ലെങ്കിൽ Microsoft Windows Active Directory 2003, 2012) ഉപയോഗിക്കുന്നതിനായി ഡെമണുകൾ പൈത്തണിൽ എഴുതിയിരിക്കുന്നു.
    nb_NO: Programvaren er for autentisering av brukere som ber om beskyttede ressurser fra servere som drives av nginx. Den inkluderer en daemon (ldap-auth) som kommuniserer med en autentiseringsserver, og en webserver-daemon som genererer en autentiseringsinformasjonskapsel basert på brukerens påloggingsinformasjonskapsler. Daemonene er skrevet i Python for bruk med en Lightweight Directory Access Protocol (LDAP)-autentiseringsserver (OpenLDAP eller Microsoft Windows Active Directory 2003 og 2012).
    nl_NL: De software is bedoeld voor het authenticeren van gebruikers die beveiligde resources opvragen van servers die via Nginx worden geproxyd. Het omvat een daemon (ldap-auth) die communiceert met een authenticatieserver en een webserverdaemon die een authenticatiecookie genereert op basis van de gebruikersgegevens. De daemons zijn geschreven in Python voor gebruik met een Lightweight Directory Access Protocol (LDAP) authenticatieserver (OpenLDAP of Microsoft Windows Active Directory 2003 en 2012).
    pl_PL: Oprogramowanie służy do uwierzytelniania użytkowników, którzy żądają chronionych zasobów z serwerów proxy nginx. Zawiera demona (ldap-auth), który komunikuje się z serwerem uwierzytelniania, oraz demona serwera WWW, który generuje plik cookie uwierzytelniania na podstawie danych uwierzytelniających użytkownika. Demony są napisane w Pythonie do użytku z serwerem uwierzytelniania LDAP (Lightweight Directory Access Protocol) (OpenLDAP lub Microsoft Windows Active Directory 2003 i 2012).
    pt_BR: O software serve para autenticar usuários que solicitam recursos protegidos de servidores proxyados pelo nginx. Ele inclui um daemon (ldap-auth) que se comunica com um servidor de autenticação e um daemon de servidor web que gera um cookie de autenticação com base nas credenciais do usuário. Os daemons são escritos em Python para uso com um servidor de autenticação LDAP (OpenLDAP ou Microsoft Windows Active Directory 2003 e 2012).
    ro_RO: Software-ul este destinat autentificării utilizatorilor care solicită resurse protejate de la servere proxyate de nginx. Acesta include un daemon (ldap-auth) care comunică cu un server de autentificare și un daemon de server web care generează un cookie de autentificare pe baza acreditărilor utilizatorului. Daemon-urile sunt scrise în Python pentru a fi utilizate cu un server de autentificare Lightweight Directory Access Protocol (LDAP) (OpenLDAP sau Microsoft Windows Active Directory 2003 și 2012).
    ru_RU: Программное обеспечение предназначено для аутентификации пользователей, запрашивающих защищенные ресурсы с серверов, работающих через прокси-сервер nginx. Оно включает в себя демон (ldap-auth), взаимодействующий с сервером аутентификации, и демон веб-сервера, генерирующий cookie-файл аутентификации на основе учетных данных пользователя. Демоны написаны на Python для использования с сервером аутентификации LDAP (OpenLDAP или Microsoft Windows Active Directory 2003 и 2012).
    sk_SK: Softvér slúži na autentifikáciu používateľov, ktorí požadujú chránené zdroje zo serverov proxyovaných nginx. Obsahuje démona (ldap-auth), ktorý komunikuje s autentifikačným serverom, a démona webového servera, ktorý generuje autentifikačný súbor cookie na základe prihlasovacích údajov používateľa. Démóny sú napísané v jazyku Python na použitie s autentifikačným serverom LDAP (Lightweight Directory Access Protocol) (OpenLDAP alebo Microsoft Windows Active Directory 2003 a 2012).
    sv_SE: Programvaran är avsedd för autentisering av användare som begär skyddade resurser från servrar som hanteras av nginx via proxy. Den inkluderar en daemon (ldap-auth) som kommunicerar med en autentiseringsserver och en webbserverdaemon som genererar en autentiseringscookie baserat på användarens inloggningsuppgifter. Daemonerna är skrivna i Python för användning med en LDAP-autentiseringsserver (Lightweight Directory Access Protocol) (OpenLDAP eller Microsoft Windows Active Directory 2003 och 2012).
    tr_TR: Bu yazılım, nginx tarafından proxy edilen sunuculardan korumalı kaynaklar talep eden kullanıcıların kimlik doğrulamasını yapmak için tasarlanmıştır. Bir kimlik doğrulama sunucusuyla iletişim kuran bir arka plan programı (ldap-auth) ve kullanıcının kimlik bilgilerine dayalı olarak bir kimlik doğrulama çerezi oluşturan bir web sunucusu arka plan programı içerir. Arka plan programları, Hafif Dizin Erişim Protokolü (LDAP) kimlik doğrulama sunucusu (OpenLDAP veya Microsoft Windows Active Directory 2003 ve 2012) ile kullanılmak üzere Python dilinde yazılmıştır.
    zh_CN: 为经 Nginx 代理的资源提供 LDAP 身份验证。
    zh_TW: 為經 Nginx 代理的資源提供 LDAP 身份驗證。
