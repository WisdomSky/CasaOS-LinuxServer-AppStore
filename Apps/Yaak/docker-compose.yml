name: linuxserver-yaak
services:
  app:
    image: linuxserver/yaak:2026.7.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Yaak is a desktop API client for organizing and executing REST, GraphQL, and gRPC requests. It's built using Tauri, Rust, and ReactJS.
    zh_CN: Yaak 是一款桌面 API 客户端，用于组织和执行 REST、GraphQL 和 gRPC 请求，使用 Tauri、Rust 和 ReactJS 构建。
  tagline:
    en_US: A desktop API client for organizing and executing REST, GraphQL, and gRPC requests. It's built using Tauri, Rust, and ReactJS.
    zh_CN: 用于 REST、GraphQL 和 gRPC 的桌面 API 客户端。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/yaak-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/yaak-logo.png
  title:
    en_US: Yaak (LinuxServer.io)
    zh_CN: Yaak（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserveryaak
  port_map: '3000'
  version: 2026.7.1
