    ml_IN: വലുതോ ചെറുതോ ആയ സ്‌ക്രീനുകൾക്ക് മുന്നിൽ ധാരാളം റിമോട്ട് കമ്പ്യൂട്ടറുകളിൽ പ്രവർത്തിക്കേണ്ടിവരുന്ന സിസ്റ്റം അഡ്മിനിസ്ട്രേറ്റർമാർക്കും യാത്രക്കാർക്കും ഉപയോഗപ്രദമാകുക എന്ന ലക്ഷ്യത്തോടെ GTK-യിൽ എഴുതിയ ഒരു റിമോട്ട് ഡെസ്‌ക്‌ടോപ്പ് ക്ലയന്റ്. സംയോജിതവും സ്ഥിരതയുള്ളതുമായ ഉപയോക്തൃ ഇന്റർഫേസിൽ റെമ്മിന ഒന്നിലധികം നെറ്റ്‌വർക്ക് പ്രോട്ടോക്കോളുകളെ പിന്തുണയ്ക്കുന്നു. നിലവിൽ RDP, VNC, SPICE, SSH, EXEC എന്നിവ പിന്തുണയ്ക്കുന്നു.
    nb_NO: En ekstern skrivebordsklient skrevet i GTK, med mål om å være nyttig for systemadministratorer og reisende som trenger å jobbe med mange eksterne datamaskiner foran enten store eller små skjermer. Remmina støtter flere nettverksprotokoller i et integrert og konsistent brukergrensesnitt. For øyeblikket støttes RDP, VNC, SPICE, SSH og EXEC.
    nl_NL: Een client voor toegang op afstand, geschreven in GTK, bedoeld voor systeembeheerders en reizigers die met veel computers op afstand moeten werken, ongeacht of het om grote of kleine schermen gaat. Remmina ondersteunt meerdere netwerkprotocollen in een geïntegreerde en consistente gebruikersinterface. Momenteel worden RDP, VNC, SPICE, SSH en EXEC ondersteund.
    pl_PL: Klient pulpitu zdalnego napisany w GTK, przeznaczony dla administratorów systemów i osób podróżujących, które muszą pracować z wieloma komputerami zdalnymi, zarówno na dużych, jak i małych ekranach. Remmina obsługuje wiele protokołów sieciowych w zintegrowanym i spójnym interfejsie użytkownika. Obecnie obsługiwane są protokoły RDP, VNC, SPICE, SSH i EXEC.
    pt_BR: Um cliente de área de trabalho remota escrito em GTK, projetado para ser útil a administradores de sistemas e viajantes que precisam trabalhar com vários computadores remotos em frente a telas grandes ou pequenas. O Remmina suporta múltiplos protocolos de rede em uma interface de usuário integrada e consistente. Atualmente, oferece suporte a RDP, VNC, SPICE, SSH e EXEC.
    ro_RO: Un client desktop la distanță scris în GTK, destinat administratorilor de sistem și călătorilor, care trebuie să lucreze cu numeroase computere la distanță, în fața unor ecrane mari sau mici. Remmina acceptă mai multe protocoale de rețea, într-o interfață utilizator integrată și consistentă. În prezent, sunt suportate RDP, VNC, SPICE, SSH și EXEC.
    ru_RU: Remmina — это клиент удалённого рабочего стола, написанный на GTK, предназначенный для системных администраторов и путешественников, которым необходимо работать с большим количеством удалённых компьютеров перед большими или маленькими экранами. Remmina поддерживает множество сетевых протоколов и имеет интегрированный и согласованный пользовательский интерфейс. В настоящее время поддерживаются RDP, VNC, SPICE, SSH и EXEC.
    sk_SK: Klient vzdialenej plochy napísaný v GTK, určený pre systémových administrátorov a cestovateľov, ktorí potrebujú pracovať s množstvom vzdialených počítačov pred veľkými alebo malými obrazovkami. Remmina podporuje viacero sieťových protokolov v integrovanom a konzistentnom používateľskom rozhraní. V súčasnosti sú podporované protokoly RDP, VNC, SPICE, SSH a EXEC.
    sv_SE: En fjärrskrivbordsklient skriven i GTK, avsedd att vara användbar för systemadministratörer och resenärer som behöver arbeta med många fjärrdatorer framför antingen stora eller små skärmar. Remmina stöder flera nätverksprotokoll i ett integrerat och konsekvent användargränssnitt. För närvarande stöds RDP, VNC, SPICE, SSH och EXEC.
    tr_TR: GTK ile yazılmış, sistem yöneticileri ve seyahat edenler için büyük veya küçük ekranlarda çok sayıda uzak bilgisayarla çalışmak isteyenlere faydalı olmayı amaçlayan bir uzak masaüstü istemcisidir. Remmina, entegre ve tutarlı bir kullanıcı arayüzünde birden fazla ağ protokolünü destekler. Şu anda RDP, VNC, SPICE, SSH ve EXEC desteklenmektedir.
    zh_CN: 支持 RDP、VNC、SPICE 和 SSH 的远程桌面客户端。
    zh_TW: 支援 RDP、VNC、SPICE 和 SSH 的遠端桌面客戶端。
