name: linuxserver-remmina
services:
  app:
    image: linuxserver/remmina:1.4.43
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Remmina is a remote desktop client written in GTK, aiming to be useful for system administrators and travellers, who need to work with lots of remote computers in front of either large or tiny screens. Remmina supports multiple network protocols, in an integrated and consistent user interface. Currently RDP, VNC, SPICE, SSH and EXEC are supported.
    ca_ES: Remmina és un client d'escriptori remot escrit en GTK, pensat per a administradors de sistemes i viatgers que necessiten treballar amb molts ordinadors remots davant de pantalles grans o petites. Remmina admet múltiples protocols de xarxa, en una interfície d'usuari integrada i coherent. Actualment s'admeten RDP, VNC, SPICE, SSH i EXEC.
    cs_CZ: Remmina je klient pro vzdálenou plochu napsaný v GTK, jehož cílem je být užitečný pro systémové administrátory a cestovatele, kteří potřebují pracovat s velkým množstvím vzdálených počítačů před velkými nebo malými obrazovkami. Remmina podporuje více síťových protokolů v integrovaném a konzistentním uživatelském rozhraní. Aktuálně jsou podporovány RDP, VNC, SPICE, SSH a EXEC.
    da_DK: Remmina er en fjernskrivebordsklient skrevet i GTK, der har til formål at være nyttig for systemadministratorer og rejsende, der har brug for at arbejde med mange fjerncomputere foran enten store eller små skærme. Remmina understøtter flere netværksprotokoller i en integreret og ensartet brugergrænseflade. I øjeblikket understøttes RDP, VNC, SPICE, SSH og EXEC.
    de_DE: Remmina ist ein in GTK geschriebener Remote-Desktop-Client, der sich an Systemadministratoren und Reisende richtet, die mit vielen entfernten Rechnern arbeiten müssen – egal ob vor großen oder kleinen Bildschirmen. Remmina unterstützt mehrere Netzwerkprotokolle in einer integrierten und einheitlichen Benutzeroberfläche. Aktuell werden RDP, VNC, SPICE, SSH und EXEC unterstützt.
    el_GR: Το Remmina είναι ένα πρόγραμμα-πελάτης απομακρυσμένης επιφάνειας εργασίας γραμμένο σε GTK, με στόχο να είναι χρήσιμο για διαχειριστές συστημάτων και ταξιδιώτες, οι οποίοι χρειάζεται να εργάζονται με πολλούς απομακρυσμένους υπολογιστές μπροστά σε μεγάλες ή μικροσκοπικές οθόνες. Το Remmina υποστηρίζει πολλαπλά πρωτόκολλα δικτύου, σε ένα ενσωματωμένο και συνεπές περιβάλλον εργασίας χρήστη. Προς το παρόν υποστηρίζονται τα RDP, VNC, SPICE, SSH και EXEC.
    en_GB: Remmina is a remote desktop client written in Gtk, aiming to be useful for system administrators and travellers, who need to work with lots of remote computers in front of either large or tiny screens. Remmina supports multiple network protocols, in an integrated and consistent user interface. Currently Rdp, Vnc, Spice, Ssh and Exec are supported.
    es_ES: Remmina es un cliente de escritorio remoto escrito en GTK, diseñado para administradores de sistemas y viajeros que necesitan trabajar con múltiples equipos remotos, ya sea en pantallas grandes o pequeñas. Remmina admite varios protocolos de red y ofrece una interfaz de usuario integrada y consistente. Actualmente, es compatible con RDP, VNC, SPICE, SSH y EXEC.
    fr_FR: Remmina est un client de bureau à distance écrit en GTK, conçu pour les administrateurs système et les personnes en déplacement qui doivent gérer de nombreux ordinateurs distants, quel que soit l'écran utilisé. Remmina prend en charge plusieurs protocoles réseau, au sein d'une interface utilisateur intégrée et cohérente. Actuellement, les protocoles RDP, VNC, SPICE, SSH et EXEC sont pris en charge.
    ga_IE: Is cliant deisce cianda é Remmina atá scríofa i GTK, agus é mar aidhm aige a bheith úsáideach do riarthóirí córais agus do thaistealaithe a gcaithfidh oibriú le go leor ríomhairí cianda os comhair scáileáin mhóra nó bheaga. Tacaíonn Remmina le prótacail líonra iolracha, i gcomhéadan úsáideora comhtháite agus comhsheasmhach. Faoi láthair, tacaítear le RDP, VNC, SPICE, SSH agus EXEC.
    hr_HR: Remmina je klijent za udaljenu radnu površinu napisan u GTK-u, s ciljem da bude koristan za administratore sustava i putnike koji trebaju raditi s mnogo udaljenih računala ispred velikih ili malih ekrana. Remmina podržava više mrežnih protokola u integriranom i konzistentnom korisničkom sučelju. Trenutno su podržani RDP, VNC, SPICE, SSH i EXEC.
    hu_HU: A Remmina egy GTK nyelven írt távoli asztali kliens, amelynek célja, hogy hasznos legyen a rendszergazdák és az utazók számára, akiknek sok távoli számítógéppel kell dolgozniuk nagy vagy apró képernyők előtt. A Remmina több hálózati protokollt támogat egy integrált és konzisztens felhasználói felületen. Jelenleg az RDP, VNC, SPICE, SSH és EXEC támogatott.
    it_IT: Remmina è un client di desktop remoto scritto in GTK, pensato per essere utile ad amministratori di sistema e viaggiatori che necessitano di lavorare con numerosi computer remoti su schermi di qualsiasi dimensione. Remmina supporta diversi protocolli di rete, attraverso un'interfaccia utente integrata e coerente. Attualmente sono supportati RDP, VNC, SPICE, SSH ed EXEC.
    ja_JP: RemminaはGTKで記述されたリモートデスクトップクライアントで、システム管理者や旅行者など、大小さまざまな画面で多数のリモートコンピュータを操作する必要があるユーザーにとって便利なツールとなることを目指しています。Remminaは、統合された一貫性のあるユーザーインターフェースで、複数のネットワークプロトコルをサポートしています。現在、RDP、VNC、SPICE、SSH、EXECがサポートされています。
    ko_KR: Remmina는 GTK로 작성된 원격 데스크톱 클라이언트로, 대형 또는 소형 화면 앞에서 여러 대의 원격 컴퓨터를 조작해야 하는 시스템 관리자 및 출장자에게 유용하도록 설계되었습니다. Remmina는 통합되고 일관된 사용자 인터페이스를 통해 다양한 네트워크 프로토콜을 지원합니다. 현재 RDP, VNC, SPICE, SSH 및 EXEC 프로토콜을 지원합니다.
    ml_IN: GTK-യിൽ എഴുതിയ ഒരു റിമോട്ട് ഡെസ്ക്ടോപ്പ് ക്ലയന്റാണ് റെമ്മിന. വലുതോ ചെറുതോ ആയ സ്‌ക്രീനുകൾക്ക് മുന്നിൽ ധാരാളം റിമോട്ട് കമ്പ്യൂട്ടറുകളിൽ പ്രവർത്തിക്കേണ്ടിവരുന്ന സിസ്റ്റം അഡ്മിനിസ്ട്രേറ്റർമാർക്കും യാത്രക്കാർക്കും ഇത് ഉപയോഗപ്രദമാകുമെന്ന് ഇത് ലക്ഷ്യമിടുന്നു. സംയോജിതവും സ്ഥിരതയുള്ളതുമായ ഉപയോക്തൃ ഇന്റർഫേസിൽ റെമ്മിന ഒന്നിലധികം നെറ്റ്‌വർക്ക് പ്രോട്ടോക്കോളുകളെ പിന്തുണയ്ക്കുന്നു. നിലവിൽ RDP, VNC, SPICE, SSH, EXEC എന്നിവ പിന്തുണയ്ക്കുന്നു.
    nb_NO: Remmina er en ekstern skrivebordsklient skrevet i GTK, som har som mål å være nyttig for systemadministratorer og reisende som trenger å jobbe med mange eksterne datamaskiner foran enten store eller små skjermer. Remmina støtter flere nettverksprotokoller i et integrert og konsistent brukergrensesnitt. For øyeblikket støttes RDP, VNC, SPICE, SSH og EXEC.
    nl_NL: Remmina is een client voor externe bureaubladtoegang, geschreven in GTK. De applicatie is bedoeld voor systeembeheerders en reizigers die met veel computers op afstand moeten werken, ongeacht of het scherm groot of klein is. Remmina ondersteunt meerdere netwerkprotocollen in een geïntegreerde en consistente gebruikersinterface. Momenteel worden RDP, VNC, SPICE, SSH en EXEC ondersteund.
    pl_PL: Remmina to klient pulpitu zdalnego napisany w GTK, przeznaczony dla administratorów systemów i osób podróżujących, które muszą pracować z wieloma komputerami zdalnymi, zarówno na dużych, jak i małych ekranach. Remmina obsługuje wiele protokołów sieciowych w zintegrowanym i spójnym interfejsie użytkownika. Obecnie obsługiwane są protokoły RDP, VNC, SPICE, SSH i EXEC.
    pt_BR: Remmina é um cliente de área de trabalho remota escrito em GTK, projetado para ser útil a administradores de sistemas e viajantes que precisam trabalhar com vários computadores remotos em frente a telas grandes ou pequenas. Remmina suporta múltiplos protocolos de rede, em uma interface de usuário integrada e consistente. Atualmente, os protocolos suportados são RDP, VNC, SPICE, SSH e EXEC.
    ro_RO: Remmina este un client desktop la distanță scris în GTK, menit să fie util pentru administratorii de sistem și călătorii, care trebuie să lucreze cu multe computere la distanță, în fața unor ecrane mari sau mici. Remmina acceptă mai multe protocoale de rețea, într-o interfață utilizator integrată și consistentă. În prezent, sunt suportate RDP, VNC, SPICE, SSH și EXEC.
    ru_RU: Remmina — это клиент удалённого рабочего стола, написанный на GTK, предназначенный для системных администраторов и путешественников, которым необходимо работать с большим количеством удалённых компьютеров перед большими или маленькими экранами. Remmina поддерживает множество сетевых протоколов, имея интегрированный и согласованный пользовательский интерфейс. В настоящее время поддерживаются RDP, VNC, SPICE, SSH и EXEC.
    sk_SK: Remmina je klient vzdialenej plochy napísaný v GTK, ktorého cieľom je byť užitočný pre systémových administrátorov a cestovateľov, ktorí potrebujú pracovať s množstvom vzdialených počítačov pred veľkými alebo malými obrazovkami. Remmina podporuje viacero sieťových protokolov v integrovanom a konzistentnom používateľskom rozhraní. V súčasnosti sú podporované protokoly RDP, VNC, SPICE, SSH a EXEC.
    sv_SE: Remmina är en fjärrskrivbordsklient skriven i GTK, som syftar till att vara användbar för systemadministratörer och resenärer som behöver arbeta med många fjärrdatorer framför antingen stora eller små skärmar. Remmina stöder flera nätverksprotokoll i ett integrerat och konsekvent användargränssnitt. För närvarande stöds RDP, VNC, SPICE, SSH och EXEC.
    tr_TR: Remmina, GTK ile yazılmış, sistem yöneticileri ve seyahat edenler için büyük veya küçük ekranlarda çok sayıda uzak bilgisayarla çalışmak isteyenlere faydalı olmayı amaçlayan bir uzak masaüstü istemcisidir. Remmina, entegre ve tutarlı bir kullanıcı arayüzünde birden fazla ağ protokolünü destekler. Şu anda RDP, VNC, SPICE, SSH ve EXEC desteklenmektedir.
    zh_CN: Remmina 是使用 GTK 编写的远程桌面客户端，面向需要在大屏或小屏设备上管理大量远程电脑的系统管理员和外出工作者。它在统一、一致的界面中支持多种网络协议，目前包括 RDP、VNC、SPICE、SSH 和 EXEC。
    zh_TW: Remmina 是使用 GTK 編寫的遠端桌面客戶端，面向需要在大屏或小屏裝置上管理大量遠端電腦的系統管理員和外出工作者。它在統一、一致的介面中支援多種網路協議，目前包括 RDP、VNC、SPICE、SSH 和 EXEC。
