name: linuxserver-vscodium-web
services:
  app:
    image: linuxserver/vscodium-web:1.135.06055
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: CONNECTION_TOKEN
          description:
            en_US: Optional security token for accessing the Web UI (ie. supersecrettoken). [OPTIONAL]
        - container: CONNECTION_TOKEN_FILE
          description:
            en_US: Optional path to a file inside the container that contains the security token for accessing the Web UI (ie. /path/to/file). Overrides CONNECTION_TOKEN. [OPTIONAL]
        - container: SUDO_PASSWORD
          description:
            en_US: If this optional variable is set, user will have sudo access in the vscodium-web terminal with the specified password. [OPTIONAL]
        - container: SUDO_PASSWORD_HASH
          description:
            en_US: Optionally set sudo password via hash (takes priority over SUDO_PASSWORD var). Format is $type$salt$hashed. [OPTIONAL]
        - container: CODE_ARGS
          description:
            en_US: Optionally add cli parameters to vscodium binary. [OPTIONAL]
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Vscodium-web is a community-driven, freely-licensed binary distribution of the remote host web component of Microsoft's editor VS Code.
    ca_ES: Vscodium-web és una distribució binària amb llicència lliure i impulsada per la comunitat del component web d'amfitrió remot de l'editor VS Code de Microsoft.
    cs_CZ: Vscodium-web je komunitní, volně licencovaná binární distribuce webové komponenty vzdáleného hostitele editoru VS Code od společnosti Microsoft.
    da_DK: Vscodium-web er en community-drevet, frit licenseret binær distribution af remote host web-komponenten i Microsofts editor VS Code.
    de_DE: Vscodium-web ist eine von der Community entwickelte, frei lizenzierte Binärdistribution der Remote-Host-Webkomponente des Editors VS Code von Microsoft.
    el_GR: Το Vscodium-web είναι μια δυαδική διανομή που καθοδηγείται από την κοινότητα και διαθέτει ελεύθερη άδεια χρήσης, του στοιχείου web απομακρυσμένου κεντρικού υπολογιστή του προγράμματος επεξεργασίας VS Code της Microsoft.
    en_GB: Vscodium-web is a community-driven, freely-licensed binary distribution of the remote host web component of Microsoft's editor Vs Code.
    es_ES: Vscodium-web es una distribución binaria, impulsada por la comunidad y con licencia libre, del componente web de host remoto del editor VS Code de Microsoft.
    fr_FR: Vscodium-web est une distribution binaire, gérée par la communauté et sous licence libre, du composant web hôte distant de l'éditeur VS Code de Microsoft.
    ga_IE: Is dáileadh dénártha faoi stiúir an phobail, ceadúnaithe go saor é Vscodium-web de chomhpháirt gréasáin óstach cianda eagarthóir VS Code Microsoft.
    hr_HR: Vscodium-web je binarna distribucija komponente udaljenog hosta za web u Microsoftovom editoru VS Code, koju pokreće zajednica i koja se distribuira besplatno.
    hu_HU: A Vscodium-web a Microsoft VS Code szerkesztőjének távoli host web komponensének közösség által vezérelt, szabadon licencelt bináris disztribúciója.
    it_IT: Vscodium-web è una distribuzione binaria, gestita dalla comunità e rilasciata con licenza libera, del componente web per l'hosting remoto dell'editor VS Code di Microsoft.
    ja_JP: Vscodium-webは、MicrosoftのエディタVS CodeのリモートホストWebコンポーネントを、コミュニティ主導で無償ライセンスで配布するバイナリディストリビューションです。
    ko_KR: Vscodium-web은 Microsoft의 웹 편집기 VS Code의 원격 호스트 구성 요소를 커뮤니티 주도로 개발하고 무료로 배포하는 바이너리 프로그램입니다.
    ml_IN: മൈക്രോസോഫ്റ്റിന്റെ എഡിറ്ററായ VS കോഡിന്റെ റിമോട്ട് ഹോസ്റ്റ് വെബ് ഘടകത്തിന്റെ ഒരു കമ്മ്യൂണിറ്റി-ഡ്രൈവൺ, ഫ്രീ-ലൈസൻസ്ഡ് ബൈനറി ഡിസ്ട്രിബ്യൂഷനാണ് Vscodium-web.
    nb_NO: Vscodium-web er en fellesskapsdrevet, fritt lisensiert binær distribusjon av den eksterne vertswebkomponenten i Microsofts editor VS Code.
    nl_NL: Vscodium-web is een door de community ontwikkelde, vrij gelicentieerde binaire distributie van de webcomponent voor externe hosttoepassingen van Microsofts editor VS Code.
    pl_PL: Vscodium-web to oparta na społeczności, udostępniana na wolnej licencji binarna dystrybucja zdalnego komponentu hosta internetowego edytora Microsoft VS Code.
    pt_BR: Vscodium-web é uma distribuição binária, de código aberto e mantida pela comunidade, do componente web de host remoto do editor VS Code da Microsoft.
    ro_RO: Vscodium-web este o distribuție binară, condusă de comunitate și licențiată gratuit, a componentei web gazdă la distanță a editorului VS Code de la Microsoft.
    ru_RU: Vscodium-web — это разрабатываемый сообществом, свободно распространяемый бинарный дистрибутив компонента удаленного веб-хостинга редактора Microsoft VS Code.
    sk_SK: Vscodium-web je komunitou riadená, voľne licencovaná binárna distribúcia webovej komponenty vzdialeného hostiteľa editora VS Code od spoločnosti Microsoft.
    sv_SE: Vscodium-web är en community-driven, fritt licensierad binärdistribution av fjärrvärdswebbkomponenten i Microsofts editor VS Code.
    tr_TR: Vscodium-web, Microsoft'un VS Code editörünün uzak sunucu web bileşeninin topluluk tarafından geliştirilen, ücretsiz lisanslı bir ikili dağıtımıdır.
    zh_CN: Vscodium-web 是由社区推动、采用自由许可证的微软 VS Code 远程主机网页组件二进制发行版。
    zh_TW: Vscodium-web 是由社群推動、採用自由許可證的微軟 VS Code 遠端主機網頁元件二進位制發行版。
