    it_IT: Un ambiente sandbox che consente l'accesso SSH senza dover fornire le chiavi di accesso all'intero server. Concedere l'accesso SSH tramite chiave privata spesso significa concedere l'accesso completo al server. Questo container crea un ambiente limitato e isolato a cui altri utenti possono accedere tramite SSH. Gli utenti hanno accesso solo alle cartelle mappate e ai processi in esecuzione all'interno di questo container.
    ja_JP: サーバー全体に鍵を渡すことなくSSHアクセスを可能にするサンドボックス環境。秘密鍵を介してSSHアクセスを許可すると、多くの場合、サーバーへの完全なアクセス権を与えることになります。このコンテナは、他のユーザーがSSH接続できる、制限されたサンドボックス環境を作成します。ユーザーは、マッピングされたフォルダと、このコンテナ内で実行されているプロセスにのみアクセスできます。
    ko_KR: 전체 서버에 개인 키를 제공하지 않고도 SSH 접속을 허용하는 샌드박스 환경입니다. 개인 키를 통해 SSH 접속 권한을 부여하는 것은 일반적으로 서버에 대한 모든 접근 권한을 부여하는 것과 같습니다. 이 컨테이너는 제한된 샌드박스 환경을 생성하여 다른 사용자가 SSH로 접속할 수 있도록 합니다. 사용자는 이 컨테이너 내부에 매핑된 폴더와 실행 중인 프로세스에만 접근할 수 있습니다.
    ml_IN: മുഴുവൻ സെർവറിനും കീകൾ നൽകാതെ ssh ആക്‌സസ് അനുവദിക്കുന്ന ഒരു സാൻഡ്‌ബോക്‌സ്ഡ് എൻവയോൺമെന്റ്. സ്വകാര്യ കീ വഴി ssh ആക്‌സസ് നൽകുന്നത് പലപ്പോഴും സെർവറിലേക്ക് പൂർണ്ണ ആക്‌സസ് നൽകുക എന്നതാണ്. മറ്റുള്ളവർക്ക് ssh ചെയ്യാൻ കഴിയുന്ന പരിമിതവും സാൻഡ്‌ബോക്‌സ്ഡ് എൻവയോൺമെന്റും ഈ കണ്ടെയ്‌നർ സൃഷ്ടിക്കുന്നു. മാപ്പ് ചെയ്‌ത ഫോൾഡറുകളിലേക്കും ഈ കണ്ടെയ്‌നറിനുള്ളിൽ പ്രവർത്തിക്കുന്ന പ്രക്രിയകളിലേക്കും മാത്രമേ ഉപയോക്താക്കൾക്ക് ആക്‌സസ് ഉണ്ടാകൂ.
    nb_NO: Et sandkassemiljø som tillater SSH-tilgang uten å gi nøkler til hele serveren. Å gi SSH-tilgang via privat nøkkel betyr ofte å gi full tilgang til serveren. Denne containeren oppretter et begrenset og sandkassemiljø som andre kan bruke SSH til. Brukerne har bare tilgang til mappene som er tilordnet og prosessene som kjører i denne containeren.
    nl_NL: Een afgeschermde omgeving die SSH-toegang mogelijk maakt zonder de sleutels van de hele server te hoeven delen. SSH-toegang via een privésleutel betekent vaak dat je volledige toegang tot de server krijgt. Deze container creëert een beperkte, afgeschermde omgeving waar anderen via SSH toegang toe kunnen krijgen. De gebruikers hebben alleen toegang tot de mappen die in deze container zijn gekoppeld en de processen die erin draaien.
    pl_PL: Środowisko sandboxowe, które umożliwia dostęp SSH bez konieczności podawania kluczy do całego serwera. Udzielenie dostępu SSH za pomocą klucza prywatnego często oznacza udzielenie pełnego dostępu do serwera. Ten kontener tworzy ograniczone i sandboxowe środowisko, do którego inni mogą się zalogować przez SSH. Użytkownicy mają dostęp tylko do mapowanych folderów i procesów uruchomionych w tym kontenerze.
    pt_BR: Um ambiente isolado (sandbox) que permite acesso SSH sem fornecer as chaves de acesso a todo o servidor. Conceder acesso SSH por meio de uma chave privada geralmente significa conceder acesso total ao servidor. Este contêiner cria um ambiente limitado e isolado ao qual outros usuários podem acessar via SSH. Os usuários têm acesso apenas às pastas mapeadas e aos processos em execução dentro deste contêiner.
    ro_RO: Un mediu sandbox care permite accesul SSH fără a oferi chei către întregul server. Acordarea accesului SSH prin cheie privată înseamnă adesea acordarea accesului complet la server. Acest container creează un mediu limitat și sandbox în care alții se pot conecta prin SSH. Utilizatorii au acces doar la folderele mapate și la procesele care rulează în interiorul acestui container.
    ru_RU: Изолированная среда, позволяющая получать доступ по SSH без предоставления ключей всему серверу. Предоставление доступа по SSH через закрытый ключ часто означает предоставление полного доступа к серверу. Этот контейнер создает ограниченную и изолированную среду, к которой другие могут подключаться по SSH. Пользователи имеют доступ только к сопоставленным папкам и процессам, запущенным внутри этого контейнера.
    sk_SK: Sandboxové prostredie, ktoré umožňuje prístup cez ssh bez poskytnutia kľúčov k celému serveru. Poskytnutie prístupu cez ssh prostredníctvom súkromného kľúča často znamená poskytnutie úplného prístupu k serveru. Tento kontajner vytvára obmedzené a sandboxové prostredie, do ktorého sa ostatní môžu pripojiť cez ssh. Používatelia majú prístup iba k namapovaným priečinkom a procesom spusteným v tomto kontajneri.
    sv_SE: En sandlådemiljö som tillåter SSH-åtkomst utan att ge nycklar till hela servern. Att ge SSH-åtkomst via privat nyckel innebär ofta att ge fullständig åtkomst till servern. Denna container skapar en begränsad och sandlådemiljö som andra kan använda SSH till. Användarna har bara åtkomst till de mappar som är mappade och de processer som körs inuti denna container.
    tr_TR: Sunucuya tam erişim izni vermeden SSH erişimine olanak sağlayan, izole edilmiş bir ortam. Özel anahtar aracılığıyla SSH erişimi vermek genellikle sunucuya tam erişim izni vermek anlamına gelir. Bu konteyner, başkalarının SSH ile bağlanabileceği sınırlı ve izole edilmiş bir ortam oluşturur. Kullanıcılar yalnızca eşlenmiş klasörlere ve bu konteyner içinde çalışan işlemlere erişebilir.
    zh_CN: 通过 SSH 访问受限的容器环境。
    zh_TW: 透過 SSH 訪問受限的容器環境。
