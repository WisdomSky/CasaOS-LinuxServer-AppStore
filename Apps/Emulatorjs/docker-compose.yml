name: linuxserver-emulatorjs
services:
  app:
    image: linuxserver/emulatorjs:1.9.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SUBFOLDER: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: SUBFOLDER
          description:
            en_US: Specify a subfolder for reverse proxies IE '/FOLDER/'
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
      - target: 4001
        published: 4001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/emulatorjs/config
        target: /config
      - type: bind
        source: /DATA/AppData/emulatorjs/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Emulatorjs - In browser web based emulation portable to nearly any device for many retro consoles. A mix of emulators is used between Libretro and EmulatorJS.
    zh_CN: EmulatorJS 提供基于浏览器的网页模拟功能，几乎可在任何设备上运行多种复古游戏主机。它混合使用 Libretro 和 EmulatorJS 的模拟器。
  tagline:
    en_US: 'In browser web based emulation portable to nearly any device for many retro consoles. A mix of emulators is used between Libretro and EmulatorJS. '
    zh_CN: 在浏览器中模拟多种复古游戏主机。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emulatorjs-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emulatorjs-logo.png
  title:
    en_US: Emulatorjs
    zh_CN: Emulatorjs
  category: Others
  port_map: '80'
  id: wisdomsky.linuxserver.linuxserveremulatorjs
  version: 1.9.2
