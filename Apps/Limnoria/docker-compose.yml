name: linuxserver-limnoria
services:
  app:
    image: linuxserver/limnoria:2026.5.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Limnoria A robust, full-featured, and user/programmer-friendly Python IRC bot, with many existing plugins. Successor of the well-known Supybot.
    ca_ES: Limnoria Un bot IRC Python robust, amb totes les funcions i fàcil d'usar/programar, amb molts complements existents. Successor del conegut Supybot.
    cs_CZ: Limnoria Robustní, plně funkční a uživatelsky/programátorsky přívětivý IRC bot v Pythonu s mnoha existujícími pluginy. Nástupce známého Supybotu.
    da_DK: Limnoria En robust, fuldt udstyret og bruger-/programmørvenlig Python IRC-bot med mange eksisterende plugins. Efterfølgeren til den velkendte Supybot.
    de_DE: Limnoria ist ein robuster, funktionsreicher und benutzerfreundlicher Python-IRC-Bot mit zahlreichen Plugins. Er ist der Nachfolger des bekannten Supybot.
    el_GR: Limnoria Ένα ισχυρό, πλήρως λειτουργικό και φιλικό προς τον χρήστη/προγραμματιστή Python IRC bot, με πολλά υπάρχοντα πρόσθετα. Διάδοχος του γνωστού Supybot.
    en_GB: Limnoria A robust, full-featured, and user/programmer-friendly Python Irc bot, with many existing plugins. Successor of the well-known Supybot.
    es_ES: Limnoria es un bot de IRC en Python robusto, completo y fácil de usar tanto para usuarios como para programadores, con numerosos complementos disponibles. Es el sucesor del conocido Supybot.
    fr_FR: Limnoria est un bot IRC Python robuste, complet et convivial pour les utilisateurs et les programmeurs, doté de nombreux plugins existants. Il succède au célèbre Supybot.
    ga_IE: Limnoria Bot IRC Python láidir, lán-ghnéitheach, agus atá furasta le húsáid/ríomhchlárú, le go leor breiseán atá ann cheana féin. Comharba an Supybot aitheanta.
    hr_HR: Limnoria Robustan, potpuno opremljen i korisniku/programeru prilagođen Python IRC bot, s mnogim postojećim dodacima. Nasljednik dobro poznatog Supybota.
    hu_HU: Limnoria Egy robusztus, teljes funkcionalitású és felhasználó-/programozóbarát Python IRC bot, számos meglévő bővítménnyel. A jól ismert Supybot utódja.
    it_IT: Limnoria è un bot IRC Python robusto, completo e facile da usare sia per gli utenti che per i programmatori, con numerosi plugin già disponibili. È il successore del noto Supybot.
    ja_JP: Limnoriaは、堅牢で多機能、かつユーザーとプログラマーにとって使いやすいPython製IRCボットで、多くの既存プラグインを備えています。有名なSupybotの後継です。
    ko_KR: Limnoria는 강력하고 다양한 기능을 갖춘 사용자/프로그래머 친화적인 Python IRC 봇으로, 다양한 플러그인이 이미 제공됩니다. 유명한 Supybot의 후속 제품입니다.
    ml_IN: ലിംനോറിയ നിലവിലുള്ള നിരവധി പ്ലഗിനുകളുള്ള, കരുത്തുറ്റതും, പൂർണ്ണ സവിശേഷതയുള്ളതും, ഉപയോക്തൃ/പ്രോഗ്രാമർ-സൗഹൃദവുമായ പൈത്തൺ ഐആർസി ബോട്ട്. അറിയപ്പെടുന്ന സൂപ്പർബോട്ടിന്റെ പിൻഗാമി.
    nb_NO: Limnoria En robust, funksjonsrik og bruker-/programmeringsvennlig Python IRC-bot med mange eksisterende programtillegg. Etterfølgeren til den velkjente Supybot.
    nl_NL: Limnoria is een robuuste, complete en gebruiksvriendelijke Python IRC-bot voor zowel gebruikers als programmeurs, met veel bestaande plugins. Het is de opvolger van de bekende Supybot.
    pl_PL: Limnoria – solidny, w pełni funkcjonalny i przyjazny dla użytkownika/programisty bot IRC w Pythonie, z wieloma istniejącymi wtyczkami. Następca znanego Supybota.
    pt_BR: Limnoria é um bot de IRC em Python robusto, completo e fácil de usar/programar, com muitos plugins já existentes. Sucessor do conhecido Supybot.
    ro_RO: Limnoria Un bot IRC Python robust, complet funcțional și ușor de utilizat/programat, cu multe plugin-uri existente. Succesorul cunoscutului Supybot.
    ru_RU: Limnoria — это надёжный, полнофункциональный и удобный для пользователя/программиста IRC-бот на Python с множеством существующих плагинов. Преемник известного Supybot.
    sk_SK: Limnoria Robustný, plne funkčný a užívateľsky/programátorsky prívetivý IRC bot v jazyku Python s mnohými existujúcimi pluginmi. Nástupca známeho Supybota.
    sv_SE: Limnoria En robust, fullfjädrad och användar-/programmeringsvänlig Python IRC-bot, med många befintliga plugins. Efterföljaren till den välkända Supybot.
