name: linuxserver-raneto
services:
  app:
    image: linuxserver/raneto:0.18.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Raneto - is an open source Knowledgebase platform that uses static Markdown files to power your Knowledgebase.
    zh_CN: Raneto 是一个开源知识库平台，使用静态 Markdown 文件驱动知识库。
  tagline:
    en_US: is an open source Knowledgebase platform that uses static Markdown files to power your Knowledgebase.
    zh_CN: 使用静态 Markdown 文件构建知识库。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/raneto-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/raneto-logo.png
  title:
    en_US: Raneto (LinuxServer.io)
    zh_CN: Raneto（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverraneto
  port_map: '3000'
  version: 0.18.1
