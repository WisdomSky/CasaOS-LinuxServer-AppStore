name: linuxserver-modrinth
services:
  app:
    image: linuxserver/modrinth:0.21.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Modrinth App is a unique, open source launcher that allows you to play your favorite mods, and keep them up to date, all in one neat little package.
    zh_CN: Modrinth App 是一款独特的开源启动器，让你在一个简洁的应用中游玩喜欢的模组，并保持模组更新。
  tagline:
    en_US: A unique, open source launcher that allows you to play your favorite mods, and keep them up to date, all in one neat little package.
    zh_CN: 集中启动、管理和更新游戏模组。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/modrinth-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/modrinth-logo.png
  title:
    en_US: Modrinth (LinuxServer.io)
    zh_CN: Modrinth（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservermodrinth
  port_map: '3000'
  version: 0.21.4
