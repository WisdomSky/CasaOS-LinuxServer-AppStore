name: linuxserver-booksonic-air
services:
  app:
    image: linuxserver/booksonic-air:2201.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: CONTEXT_PATH
          description:
            en_US: Base url for use with reverse proxies etc.
      volumes:
        - container: /config
          description:
            en_US: Appdata
      ports:
        - container: '4040'
          description:
            en_US: Webui Port
    ports:
      - target: 4040
        published: 4040
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/booksonic-air/config
        target: /config
      - type: bind
        source: /DATA/AppData/booksonic-air/audiobooks
        target: /audiobooks
      - type: bind
        source: /DATA/AppData/booksonic-air/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/booksonic-air/othermedia
        target: /othermedia
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
