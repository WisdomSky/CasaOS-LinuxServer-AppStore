name: linuxserver-bitcoin-knots
services:
  app:
    image: linuxserver/bitcoin-knots:version-29.4.knots20260508.1-noble1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
      - target: 8333
        published: 8333
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/bitcoin-knots/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Bitcoin Knots can be used as a desktop client for regular payments or as a full node server utility for merchants and other payment services.
    zh_CN: Bitcoin Knots 可作为桌面客户端用于日常支付，也可作为全节点服务器工具为商户和其他支付服务提供支持。
  tagline:
    en_US: Can be used as a desktop client for regular payments or as a full node server utility for merchants and other payment services.
    zh_CN: 用于日常支付或商户服务的比特币客户端。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bitcoin-knots-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bitcoin-knots-logo.png
  title:
    en_US: Bitcoin knots (LinuxServer.io)
    zh_CN: Bitcoin knots（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverbitcoinknots
  port_map: '3000'
  version: version-29.4.knots20260508.1-noble1
