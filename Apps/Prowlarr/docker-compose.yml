    ko_KR: 인기 있는 arr.net/reactjs 기반 스택으로 구축된 인덱서 관리자/프록시인 Prowlarr는 다양한 PVR 앱과 통합할 수 있습니다. Prowlarr는 토렌트 트래커와 유즈넷 인덱서를 모두 지원하며, Sonarr, Radarr, Lidarr, Readarr와 완벽하게 통합되어 앱별 인덱서 설정 없이 모든 인덱서를 관리할 수 있습니다 (모든 작업은 Prowlarr에서 처리합니다).
    ml_IN: ജനപ്രിയ ആർആർ അടിസ്ഥാനമാക്കി നിർമ്മിച്ച ഒരു ഇൻഡെക്‌സർ മാനേജർ/പ്രോക്സി. നിങ്ങളുടെ വിവിധ പിവിആർ ആപ്പുകളുമായി സംയോജിപ്പിക്കുന്നതിനുള്ള നെറ്റ്/റിയാക്റ്റ്ജെഎസ് ബേസ് സ്റ്റാക്ക്. ടോറന്റ് ട്രാക്കറുകളെയും യൂസ്‌നെറ്റ് ഇൻഡെക്‌സറുകളെയും പ്രോവ്‌ലാർ പിന്തുണയ്ക്കുന്നു. ഓരോ ആപ്പിനും ഇൻഡെക്‌സർ സജ്ജീകരണം ആവശ്യമില്ലാതെ നിങ്ങളുടെ ഇൻഡെക്‌സറുകളുടെ പൂർണ്ണമായ മാനേജ്‌മെന്റ് വാഗ്ദാനം ചെയ്യുന്ന സോണാർ, റഡാർ, ലിഡാർ, റീഡാർ എന്നിവയുമായി ഇത് പരിധിയില്ലാതെ സംയോജിപ്പിക്കുന്നു (ഞങ്ങൾ എല്ലാം ചെയ്യുന്നു).
    nb_NO: En indekseringsbehandler/proxy bygget på den populære arr. Net/reactjs-basisstakken for integrering med dine forskjellige PVR-apper. Prowlarr støtter både Torrent Trackers og Usenet-indeksere. Den integreres sømløst med Sonarr, Radarr, Lidarr og Readarr, og tilbyr fullstendig administrasjon av indekserne dine uten behov for indekseringsoppsett per app (vi gjør alt).
    nl_NL: Een indexeerbeheerder/proxy gebouwd op de populaire arr.net/reactjs basisstack voor integratie met uw verschillende PVR-apps. Prowlarr ondersteunt zowel torrenttrackers als Usenet-indexers. Het integreert naadloos met Sonarr, Radarr, Lidarr en Readarr en biedt volledig beheer van uw indexers zonder dat u per app een indexer hoeft in te stellen (wij doen alles).
    pl_PL: Menedżer indeksowania/serwer proxy oparty na popularnym stacku arr.Net/reactjs, który umożliwia integrację z różnymi aplikacjami PVR. Prowlarr obsługuje zarówno trackery torrentów, jak i indeksatory Usenetu. Bezproblemowo integruje się z Sonarr, Radarr, Lidarr i Readarr, oferując pełne zarządzanie indeksatorami bez konieczności konfiguracji indeksatora dla każdej aplikacji (zajmiemy się tym wszystkim).
    pt_BR: Um gerenciador/proxy de indexadores construído sobre a popular base arr.net/reactjs para integração com seus diversos aplicativos de PVR. O Prowlarr suporta tanto rastreadores de torrents quanto indexadores de Usenet. Ele se integra perfeitamente com Sonarr, Radarr, Lidarr e Readarr, oferecendo gerenciamento completo de seus indexadores sem a necessidade de configuração individual de cada aplicativo (nós cuidamos de tudo).
    ro_RO: Un manager/proxy de indexare construit pe popularul stack de bază arr.Net/reactjs pentru a se integra cu diversele aplicații PVR. Prowlarr acceptă atât Torrent Trackers, cât și indexoare Usenet. Se integrează perfect cu Sonarr, Radarr, Lidarr și Readarr, oferind o gestionare completă a indexoarelor, fără a fi necesară configurarea indexoarelor pentru fiecare aplicație (noi ne ocupăm de toate).
    ru_RU: Менеджер/прокси индексаторов, построенный на популярном стеке arr.net/reactjs, предназначен для интеграции с различными приложениями PVR. Prowlarr поддерживает как торрент-трекеры, так и индексаторы Usenet. Он легко интегрируется с Sonarr, Radarr, Lidarr и Readarr, обеспечивая полное управление индексаторами без необходимости настройки индексаторов для каждого приложения (мы делаем все сами).
    sk_SK: Správca/proxy indexátorov postavený na populárnom základnom balíku arr.Net/reactjs pre integráciu s rôznymi aplikáciami PVR. Prowlarr podporuje Torrent Trackery aj Usenet Indexery. Bezproblémovo sa integruje so Sonarr, Radarr, Lidarr a Readarr a ponúka kompletnú správu vašich indexátorov bez nutnosti nastavenia indexátora pre každú aplikáciu (všetko robíme my).
    sv_SE: En indexerarehanterare/proxy byggd på den populära arr. Net/reactjs-basstacken för att integrera med dina olika PVR-appar. Prowlarr stöder både Torrent Trackers och Usenet-indexerare. Den integreras sömlöst med Sonarr, Radarr, Lidarr och Readarr och erbjuder fullständig hantering av dina indexerare utan krav på indexerare per app (vi gör allt).
    tr_TR: Popüler arr.net/reactjs tabanlı bir yapı üzerine inşa edilmiş, çeşitli PVR uygulamalarınızla entegre olabilen bir indeksleme yöneticisi/proxy'si. Prowlarr, hem Torrent İzleyicilerini hem de Usenet İndeksleyicilerini destekler. Sonarr, Radarr, Lidarr ve Readarr ile sorunsuz bir şekilde entegre olarak, uygulama başına indeksleyici kurulumu gerektirmeden indeksleyicilerinizin tam yönetimini sunar (her şeyi biz yapıyoruz).
    zh_CN: 集中管理 Torrent 和 Usenet 索引器。
    zh_TW: 集中管理 Torrent 和 Usenet 索引器。
