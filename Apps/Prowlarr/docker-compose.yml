name: linuxserver-prowlarr
services:
  app:
    image: linuxserver/prowlarr:2.6.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 9696
        published: 9696
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/prowlarr/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Prowlarr is a indexer manager/proxy built on the popular arr .net/reactjs base stack to integrate with your various PVR apps. Prowlarr supports both Torrent Trackers and Usenet Indexers. It integrates seamlessly with Sonarr, Radarr, Lidarr, and Readarr offering complete management of your indexers with no per app Indexer setup required (we do it all).
    ca_ES: Prowlarr és un gestor/proxy d'indexadors basat en la popular pila base arr .net/reactjs per integrar-se amb les vostres diverses aplicacions PVR. Prowlarr admet tant rastrejadors de torrents com indexadors d'Usenet. S'integra perfectament amb Sonarr, Radarr, Lidarr i Readarr, oferint una gestió completa dels vostres indexadors sense necessitat de configurar l'indexador per aplicació (nosaltres ho fem tot).
    cs_CZ: Prowlarr je správce/proxy indexerů postavený na populárním základním stacku arr .net/reactjs pro integraci s vašimi různými PVR aplikacemi. Prowlarr podporuje jak Torrent Trackery, tak Usenet Indexery. Bezproblémově se integruje se Sonarr, Radarr, Lidarr a Readarr a nabízí kompletní správu vašich indexerů bez nutnosti nastavení indexeru pro každou aplikaci (všechno děláme my).
    da_DK: Prowlarr er en indekseringsmanager/proxy bygget på den populære arr .net/reactjs base stack til integration med dine forskellige PVR-apps. Prowlarr understøtter både Torrent Trackers og Usenet Indexers. Den integreres problemfrit med Sonarr, Radarr, Lidarr og Readarr, hvilket tilbyder komplet administration af dine indeksere uden behov for opsætning af indekser pr. app (vi klarer det hele).
    de_DE: Prowlarr ist ein Indexer-Manager/Proxy, der auf dem beliebten arr .NET/ReactJS-Stack basiert und sich nahtlos in Ihre verschiedenen PVR-Anwendungen integrieren lässt. Prowlarr unterstützt sowohl Torrent-Tracker als auch Usenet-Indexer. Die nahtlose Integration mit Sonarr, Radarr, Lidarr und Readarr ermöglicht die vollständige Verwaltung Ihrer Indexer, ohne dass eine separate Einrichtung pro Anwendung erforderlich ist (wir übernehmen das alles).
    el_GR: Το Prowlarr είναι ένας διαχειριστής/διαμεσολαβητής ευρετηρίου που βασίζεται στη δημοφιλή βάση δεδομένων arr .net/reactjs για ενσωμάτωση με τις διάφορες εφαρμογές PVR. Το Prowlarr υποστηρίζει τόσο Torrent Trackers όσο και Usenet Indexers. Ενσωματώνεται άψογα με τα Sonarr, Radarr, Lidarr και Readarr, προσφέροντας πλήρη διαχείριση των ευρετηρίων σας χωρίς να απαιτείται ρύθμιση ευρετηρίου ανά εφαρμογή (τα κάνουμε όλα εμείς).
    en_GB: Prowlarr is a indexer manager/proxy built on the popular arr .net/reactjs base stack to integrate with your various Pvr apps. Prowlarr supports both Torrent Trackers and Usenet Indexers. It integrates seamlessly with Sonarr, Radarr, Lidarr, and Readarr offering complete management of your indexers with no per app Indexer setup required (we do it all).
    es_ES: Prowlarr es un gestor/proxy de indexadores basado en la popular plataforma arr .NET/ReactJS para integrarse con tus diversas aplicaciones PVR. Prowlarr es compatible con rastreadores de torrents e indexadores de Usenet. Se integra a la perfección con Sonarr, Radarr, Lidarr y Readarr, ofreciendo una gestión completa de tus indexadores sin necesidad de configurarlos individualmente para cada aplicación (nosotros nos encargamos de todo).
    fr_FR: Prowlarr est un gestionnaire d'indexeurs/proxy basé sur la populaire architecture arr .net/reactjs, conçu pour s'intégrer à vos différentes applications PVR. Prowlarr prend en charge les trackers Torrent et les indexeurs Usenet. Il s'intègre parfaitement avec Sonarr, Radarr, Lidarr et Readarr, offrant une gestion complète de vos indexeurs sans configuration requise pour chaque application (nous nous occupons de tout).
    ga_IE: Is bainisteoir/seachfhreastalaí innéacsóirí é Prowlarr atá tógtha ar an gcruach bonn coitianta arr .net/reactjs chun comhtháthú le do chuid aipeanna PVR éagsúla. Tacaíonn Prowlarr le Rianaitheoirí Torrent agus Innéacsóirí Usenet araon. Comhtháthaíonn sé go gan uaim le Sonarr, Radarr, Lidarr, agus Readarr ag tairiscint bainistíocht iomlán ar do chuid innéacsóirí gan aon ghá le socrú Innéacsóra in aghaidh an aip (déanaimid gach rud).
    hr_HR: Prowlarr je upravitelj/proxy indeksera izgrađen na popularnom osnovnom paketu arr .net/reactjs za integraciju s vašim raznim PVR aplikacijama. Prowlarr podržava i Torrent Trackere i Usenet Indexere. Besprijekorno se integrira sa Sonarrom, Radarrom, Lidarrom i Readarrom, nudeći potpuno upravljanje vašim indekserima bez potrebe za postavljanjem indeksera za svaku aplikaciju (mi radimo sve).
    hu_HU: A Prowlarr egy indexelő kezelő/proxy, amely a népszerű arr .net/reactjs alapveremre épül, hogy integrálható legyen a különféle PVR-alkalmazásokkal. A Prowlarr támogatja mind a torrentkövetőket, mind a Usenet indexelőket. Zökkenőmentesen integrálható a Sonarr, Radarr, Lidarr és Readarr alkalmazásokkal, így az indexelők teljes körű kezelését kínálja, alkalmazásonkénti indexelő beállítás nélkül (mi mindent megcsinálunk).
    it_IT: Prowlarr è un gestore/proxy di indicizzatori basato sul popolare stack arr .NET/ReactJS per integrarsi con le tue varie app PVR. Prowlarr supporta sia i tracker Torrent che gli indicizzatori Usenet. Si integra perfettamente con Sonarr, Radarr, Lidarr e Readarr, offrendo una gestione completa dei tuoi indicizzatori senza necessità di configurazione specifica per ogni app (ci pensiamo noi).
    ja_JP: Prowlarrは、人気のarr.net/reactjsベーススタックをベースに構築されたインデクサーマネージャー/プロキシで、様々なPVRアプリとの連携を可能にします。Prowlarrは、TorrentトラッカーとUsenetインデクサーの両方をサポートしています。Sonarr、Radarr、Lidarr、Readarrとシームレスに統合し、アプリごとのインデクサー設定は不要で、インデクサーを完全に管理できます（すべてProwlarrが行います）。
    ko_KR: Prowlarr는 인기 있는 arr .net/Reactjs 기반 스택으로 구축된 인덱서 관리자/프록시로, 다양한 PVR 앱과 통합할 수 있습니다. Prowlarr는 토렌트 트래커와 유즈넷 인덱서를 모두 지원하며, Sonarr, Radarr, Lidarr, Readarr와 완벽하게 통합되어 앱별 인덱서 설정 없이 모든 인덱서를 관리할 수 있습니다 (모든 작업은 Prowlarr에서 처리합니다).
    ml_IN: നിങ്ങളുടെ വിവിധ PVR ആപ്പുകളുമായി സംയോജിപ്പിക്കുന്നതിനായി ജനപ്രിയ arr .net/reactjs ബേസ് സ്റ്റാക്കിൽ നിർമ്മിച്ച ഒരു ഇൻഡെക്‌സർ മാനേജർ/പ്രോക്സി ആണ് Prowlarr. ടോറന്റ് ട്രാക്കറുകളെയും യൂസ്‌നെറ്റ് ഇൻഡെക്‌സറുകളെയും Prowlarr പിന്തുണയ്ക്കുന്നു. ഓരോ ആപ്പിനും ഇൻഡെക്‌സർ സജ്ജീകരണം ആവശ്യമില്ലാതെ നിങ്ങളുടെ ഇൻഡെക്‌സറുകളുടെ പൂർണ്ണമായ മാനേജ്‌മെന്റ് വാഗ്ദാനം ചെയ്യുന്ന Sonarr, Radarr, Lidarr, Readarr എന്നിവയുമായി ഇത് തടസ്സമില്ലാതെ സംയോജിപ്പിക്കുന്നു (ഞങ്ങൾ എല്ലാം ചെയ്യുന്നു).
    nb_NO: Prowlarr er en indekseringsbehandler/proxy bygget på den populære arr .net/reactjs-basisstakken for å integreres med dine forskjellige PVR-apper. Prowlarr støtter både Torrent Trackers og Usenet-indeksere. Den integreres sømløst med Sonarr, Radarr, Lidarr og Readarr, og tilbyr fullstendig administrasjon av indekserne dine uten behov for indekseringsoppsett per app (vi gjør alt).
    nl_NL: Prowlarr is een indexeerbeheerder/proxy gebouwd op de populaire arr.net/reactjs basisstack om te integreren met uw verschillende PVR-apps. Prowlarr ondersteunt zowel torrenttrackers als Usenet-indexeerders. Het integreert naadloos met Sonarr, Radarr, Lidarr en Readarr en biedt volledig beheer van uw indexeerders zonder dat u per app een indexeerder hoeft in te stellen (wij doen dat allemaal).
    pl_PL: Prowlarr to menedżer indeksowania/serwer proxy zbudowany na popularnym stacku arr.net/reactjs, który umożliwia integrację z różnymi aplikacjami PVR. Prowlarr obsługuje zarówno trackery torrentów, jak i indeksatory Usenetu. Bezproblemowo integruje się z Sonarr, Radarr, Lidarr i Readarr, oferując pełne zarządzanie indeksatorami bez konieczności konfiguracji indeksatora dla każdej aplikacji (zajmiemy się wszystkim).
    pt_BR: O Prowlarr é um gerenciador/proxy de indexadores construído sobre a popular base arr .net/reactjs para integração com seus diversos aplicativos de PVR. O Prowlarr suporta tanto rastreadores de torrents quanto indexadores de Usenet. Ele se integra perfeitamente com Sonarr, Radarr, Lidarr e Readarr, oferecendo gerenciamento completo de seus indexadores sem a necessidade de configuração individual de cada aplicativo (nós cuidamos de tudo).
    ro_RO: Prowlarr este un manager/proxy de indexare construit pe popularul stiva de bază arr .net/reactjs pentru a se integra cu diversele aplicații PVR. Prowlarr este compatibil atât cu Torrent Trackers, cât și cu indexoare Usenet. Se integrează perfect cu Sonarr, Radarr, Lidarr și Readarr, oferind o gestionare completă a indexoarelor, fără a fi necesară configurarea indexoarelor pentru fiecare aplicație (noi ne ocupăm de toate).
    ru_RU: Prowlarr — это менеджер/прокси индексаторов, построенный на популярном стеке arr .NET/reactjs для интеграции с различными приложениями PVR. Prowlarr поддерживает как торрент-трекеры, так и индексаторы Usenet. Он легко интегрируется с Sonarr, Radarr, Lidarr и Readarr, обеспечивая полное управление индексаторами без необходимости настройки индексаторов для каждого приложения (мы делаем всё сами).
    sk_SK: Prowlarr je správca/proxy indexátorov postavený na populárnom základnom balíku arr .net/reactjs pre integráciu s rôznymi aplikáciami PVR. Prowlarr podporuje Torrent Trackery aj Usenet Indexery. Bezproblémovo sa integruje so Sonarr, Radarr, Lidarr a Readarr a ponúka kompletnú správu vašich indexátorov bez nutnosti nastavenia indexátora pre každú aplikáciu (všetko robíme my).
    sv_SE: Prowlarr är en indexerare/proxy byggd på den populära arr .net/reactjs-basstacken för att integreras med dina olika PVR-appar. Prowlarr stöder både Torrent Trackers och Usenet-indexerare. Den integreras sömlöst med Sonarr, Radarr, Lidarr och Readarr och erbjuder fullständig hantering av dina indexerare utan krav på indexerare per app (vi gör allt).
    tr_TR: Prowlarr, çeşitli PVR uygulamalarınızla entegre olmak üzere popüler arr .NET/ReactJS tabanlı bir yapı üzerine inşa edilmiş bir indeksleme yöneticisi/proxy'sidir. Prowlarr hem Torrent İzleyicilerini hem de Usenet İndeksleyicilerini destekler. Sonarr, Radarr, Lidarr ve Readarr ile sorunsuz bir şekilde entegre olarak, uygulama başına indeksleyici kurulumu gerektirmeden indeksleyicilerinizin tam yönetimini sunar (her şeyi biz yapıyoruz).
    zh_CN: Prowlarr 是基于常用 arr .NET/ReactJS 技术栈构建的索引器管理器和代理，可与多种 PVR 应用集成。它支持 Torrent Tracker 和 Usenet 索引器，并与 Sonarr、Radarr、Lidarr 和 Readarr 无缝集成，集中完成索引器管理，无需为每个应用单独配置。
    zh_TW: Prowlarr 是基於常用 arr .NET/ReactJS 技術棧構建的索引器管理器和代理，可與多種 PVR 應用整合。它支援 Torrent Tracker 和 Usenet 索引器，並與 Sonarr、Radarr、Lidarr 和 Readarr 無縫整合，集中完成索引器管理，無需為每個應用單獨配置。
