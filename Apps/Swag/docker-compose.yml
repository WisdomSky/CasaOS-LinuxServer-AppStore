name: linuxserver-swag
services:
  app:
    image: linuxserver/swag:5.8.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      URL: ''
      VALIDATION: ''
      SUBDOMAINS: ''
      CERTPROVIDER: ''
      CERT_PROFILE: ''
      DNSPLUGIN: ''
      PROPAGATION: ''
      EMAIL: ''
      ONLY_SUBDOMAINS: ''
      EXTRA_DOMAINS: ''
      STAGING: ''
      DISABLE_F2B: ''
      SWAG_AUTORELOAD: ''
      SWAG_AUTORELOAD_WATCHLIST: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: URL
          description:
            en_US: Top url you have control over (e.g. example.com if you own it, or customsubdomain.example.com if dynamic dns).
        - container: VALIDATION
          description:
            en_US: Certbot validation method to use, options are http or dns (dns method also requires DNSPLUGIN variable set).
        - container: SUBDOMAINS
          description:
            en_US: Subdomains you'd like the cert to cover (comma separated, no spaces) ie. www,ftp,cloud. For a wildcard cert, set this exactly to wildcard (wildcard cert is available via dns validation only) [OPTIONAL]
        - container: CERTPROVIDER
          description:
            en_US: Optionally define the cert provider. Set to zerossl for ZeroSSL certs (requires existing ZeroSSL account and the e-mail address entered in EMAIL env var). Otherwise defaults to Let's Encrypt. [OPTIONAL]
        - container: CERT_PROFILE
          description:
            en_US: Optionally define a cert profile to use for cert generation. This is useful if you want to use a custom cert profile instead of the default one. Currently only supported for Let's Encrypt. See https://letsencrypt.org/docs/profiles/  [OPTIONAL]
        - container: DNSPLUGIN
          description:
            en_US: Required if VALIDATION is set to dns. Options are acmedns, aliyun, azure, bunny, cloudflare, cpanel, desec, digitalocean, directadmin, dnsimple, dnsmadeeasy, dnspod, do, domeneshop, dreamhost, duckdns, dynu, freedns, gandi, gehirn, glesys, godaddy, google, he, hetzner, hetzner-cloud, infomaniak, inwx, ionos, linode, loopia, luadns, mijn-host, namecheap, netcup, njalla, nsone, ovh, porkbun, rfc2136, route53, sakuracloud, standalone, transip, and vultr. Also need to enter the credentials into the corresponding ini (or json for some plugins) file under /config/dns-conf. [OPTIONAL]
        - container: PROPAGATION
          description:
            en_US: Optionally override (in seconds) the default propagation time for the dns plugins. [OPTIONAL]
        - container: EMAIL
          description:
            en_US: Optional e-mail address used for cert expiration notifications (Required for ZeroSSL). [OPTIONAL]
        - container: ONLY_SUBDOMAINS
          description:
            en_US: If you wish to get certs only for certain subdomains, but not the main domain (main domain may be hosted on another machine and cannot be validated), set this to true [OPTIONAL]
        - container: EXTRA_DOMAINS
          description:
            en_US: Additional fully qualified domain names (comma separated, no spaces) ie. example.net,subdomain.example.net,*.example.org [OPTIONAL]
        - container: STAGING
          description:
            en_US: Set to true to retrieve certs in staging mode. Rate limits will be much higher, but the resulting cert will not pass the browser's security test. Only to be used for testing purposes. [OPTIONAL]
        - container: DISABLE_F2B
          description:
            en_US: Set to true to disable the Fail2ban service in the container, if you're already running it elsewhere or using a different IPS. [OPTIONAL]
        - container: SWAG_AUTORELOAD
          description:
            en_US: Set to true to enable automatic reloading of confs on change without stopping/restarting nginx. Your filesystem must support inotify. This functionality was previously offered via mod. [OPTIONAL]
        - container: SWAG_AUTORELOAD_WATCHLIST
          description:
            en_US: A pipe-separated list of additional folders for auto reload to watch in addition to /config/nginx [OPTIONAL]
    ports:
      - target: 443
        published: 443
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/swag/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: SWAG - Secure Web Application Gateway (formerly known as letsencrypt, no relation to Let's Encrypt™) sets up an Nginx webserver and reverse proxy with php support and a built-in certbot client that automates free SSL server certificate generation and renewal processes (Let's Encrypt and ZeroSSL). It also contains fail2ban for intrusion prevention.
    ca_ES: SWAG - Secure Web Application Gateway (anteriorment conegut com a letsencrypt, sense relació amb Let's Encrypt™) configura un servidor web Nginx i un proxy invers amb suport per a php i un client certbot integrat que automatitza els processos gratuïts de generació i renovació de certificats de servidor SSL (Let's Encrypt i ZeroSSL). També conté fail2ban per a la prevenció d'intrusions.
    cs_CZ: SWAG - Secure Web Application Gateway (dříve známý jako letsencrypt, bez vztahu k Let's Encrypt™) nastavuje webový server Nginx a reverzní proxy s podporou PHP a vestavěným klientem certbot, který automatizuje procesy generování a obnovy bezplatných SSL certifikátů serverů (Let's Encrypt a ZeroSSL). Obsahuje také fail2ban pro prevenci narušení.
    da_DK: SWAG - Secure Web Application Gateway (tidligere kendt som letsencrypt, ingen relation til Let's Encrypt™) opsætter en Nginx-webserver og reverse proxy med php-understøttelse og en indbygget certbot-klient, der automatiserer generering og fornyelse af gratis SSL-servercertifikater (Let's Encrypt og ZeroSSL). Den indeholder også fail2ban til forebyggelse af indtrængen.
    de_DE: SWAG – Secure Web Application Gateway (ehemals letsencrypt, nicht verwandt mit Let's Encrypt™) richtet einen Nginx-Webserver und einen Reverse-Proxy mit PHP-Unterstützung und einem integrierten Certbot-Client ein, der die Erstellung und Erneuerung kostenloser SSL-Serverzertifikate (Let's Encrypt und ZeroSSL) automatisiert. Zusätzlich ist fail2ban zum Schutz vor Eindringlingen enthalten.
    el_GR: Το SWAG - Secure Web Application Gateway (παλαιότερα γνωστό ως letsencrypt, δεν έχει σχέση με το Let's Encrypt™) ρυθμίζει έναν διακομιστή ιστού Nginx και έναν αντίστροφο διακομιστή μεσολάβησης με υποστήριξη php και έναν ενσωματωμένο πελάτη certbot που αυτοματοποιεί τις διαδικασίες δημιουργίας και ανανέωσης πιστοποιητικών διακομιστή SSL (Let's Encrypt και ZeroSSL). Περιέχει επίσης fail2ban για την πρόληψη εισβολών.
    en_GB: Swag - Secure Web Application Gateway (formerly known as letsencrypt, no relation to Let's Encrypt™) sets up an Nginx webserver and reverse proxy with php support and a built-in certbot client that automates free Ssl server certificate generation and renewal processes (Let's Encrypt and Zerossl). It also contains fail2ban for intrusion prevention.
    es_ES: SWAG - Secure Web Application Gateway (anteriormente conocido como letsencrypt, sin relación con Let's Encrypt™) configura un servidor web Nginx y un proxy inverso con soporte para PHP y un cliente certbot integrado que automatiza la generación y renovación de certificados SSL gratuitos (Let's Encrypt y ZeroSSL). También incluye fail2ban para la prevención de intrusiones.
    fr_FR: SWAG - Secure Web Application Gateway (anciennement letsencrypt, sans lien avec Let's Encrypt™) configure un serveur web Nginx et un proxy inverse avec prise en charge PHP et un client certbot intégré qui automatise la génération et le renouvellement gratuits des certificats SSL (Let's Encrypt et ZeroSSL). Il inclut également fail2ban pour la prévention des intrusions.
    ga_IE: Bunaíonn SWAG - Secure Web Application Gateway (ar a dtugtaí letsencrypt roimhe seo, gan aon ghaol le Let's Encrypt™) freastalaí gréasáin Nginx agus seachfhreastalaí droim ar ais le tacaíocht php agus cliant certbot ionsuite a uathoibríonn próisis giniúna agus athnuachana teastais freastalaí SSL saor in aisce (Let's Encrypt agus ZeroSSL). Tá fail2ban ann freisin chun ionraidh a chosc.
    hr_HR: SWAG - Secure Web Application Gateway (ranije poznat kao letsencrypt, nema veze s Let's Encrypt™) postavlja Nginx web poslužitelj i obrnuti proxy s php podrškom i ugrađenim certbot klijentom koji automatizira besplatne procese generiranja i obnavljanja SSL certifikata poslužitelja (Let's Encrypt i ZeroSSL). Također sadrži fail2ban za sprječavanje upada.
    hu_HU: A SWAG – Secure Web Application Gateway (korábban letsencrypt néven ismert, nincs kapcsolatban a Let's Encrypt™-tel) egy Nginx webszervert és fordított proxyt állít be php támogatással, valamint egy beépített certbot klienssel, amely automatizálja az ingyenes SSL szerver tanúsítványok generálását és megújítását (Let's Encrypt és ZeroSSL). Tartalmaz továbbá fail2ban-t a behatolásmegelőzéshez.
    it_IT: SWAG - Secure Web Application Gateway (precedentemente noto come letsencrypt, senza alcuna relazione con Let's Encrypt™) configura un server web Nginx e un proxy inverso con supporto PHP e un client Certbot integrato che automatizza i processi di generazione e rinnovo dei certificati SSL gratuiti (Let's Encrypt e ZeroSSL). Include anche fail2ban per la prevenzione delle intrusioni.
    ja_JP: SWAG - Secure Web Application Gateway（旧称letsencrypt、Let's Encrypt™とは無関係）は、PHPをサポートするNginxウェブサーバーとリバースプロキシをセットアップし、無料のSSLサーバー証明書の生成と更新プロセス（Let's EncryptおよびZeroSSL）を自動化するcertbotクライアントを内蔵しています。また、侵入防止のためのfail2banも含まれています。
    ko_KR: 'SWAG(Secure Web Application Gateway, 이전 명칭: letsencrypt, Let''s Encrypt™와는 무관)는 PHP를 지원하는 Nginx 웹 서버 및 리버스 프록시를 설정하고, 무료 SSL 서버 인증서(Let''s Encrypt 및 ZeroSSL) 생성 및 갱신 프로세스를 자동화하는 Certbot 클라이언트를 내장하고 있습니다. 또한 침입 방지를 위한 fail2ban도 포함되어 있습니다.'
    ml_IN: SWAG - സെക്യുർ വെബ് ആപ്ലിക്കേഷൻ ഗേറ്റ്‌വേ (മുമ്പ് ലെറ്റ്‌സെൻക്രിപ്റ്റ് എന്നറിയപ്പെട്ടിരുന്നു, ലെറ്റ്‌സ് എൻക്രിപ്റ്റ്™-മായി ബന്ധമില്ല) php പിന്തുണയുള്ള ഒരു Nginx വെബ്‌സെർവറും റിവേഴ്‌സ് പ്രോക്‌സിയും സജ്ജീകരിക്കുന്നു, കൂടാതെ സൗജന്യ SSL സെർവർ സർട്ടിഫിക്കറ്റ് ജനറേഷനും പുതുക്കൽ പ്രക്രിയകളും (ലെറ്റ്‌സ് എൻക്രിപ്റ്റ്, സീറോഎസ്എസ്എൽ) ഓട്ടോമേറ്റ് ചെയ്യുന്ന ഒരു ബിൽറ്റ്-ഇൻ സെർട്ട്ബോട്ട് ക്ലയന്റും ഇതിൽ സജ്ജമാക്കുന്നു. നുഴഞ്ഞുകയറ്റം തടയുന്നതിനുള്ള fail2ban ഉം ഇതിൽ അടങ്ങിയിരിക്കുന്നു.
    nb_NO: SWAG – Secure Web Application Gateway (tidligere kjent som letsencrypt, uten tilknytning til Let's Encrypt™) setter opp en Nginx-webserver og reverse proxy med PHP-støtte og en innebygd certbot-klient som automatiserer generering og fornyelse av gratis SSL-serversertifikater (Let's Encrypt og ZeroSSL). Den inneholder også fail2ban for å forhindre inntrenging.
    nl_NL: SWAG - Secure Web Application Gateway (voorheen bekend als letsencrypt, geen verband met Let's Encrypt™) configureert een Nginx-webserver en reverse proxy met PHP-ondersteuning en een ingebouwde certbot-client die het genereren en vernieuwen van gratis SSL-servercertificaten (Let's Encrypt en ZeroSSL) automatiseert. Het bevat ook fail2ban voor inbraakpreventie.
    pl_PL: SWAG – Secure Web Application Gateway (dawniej letsencrypt, bez związku z Let's Encrypt™) konfiguruje serwer WWW Nginx i odwrotny serwer proxy ze wsparciem PHP i wbudowanym klientem certbot, który automatyzuje procesy generowania i odnawiania bezpłatnych certyfikatów serwera SSL (Let's Encrypt i ZeroSSL). Zawiera również funkcję fail2ban zapobiegającą włamaniom.
    pt_BR: SWAG - Secure Web Application Gateway (anteriormente conhecido como letsencrypt, sem relação com Let's Encrypt™) configura um servidor web Nginx e um proxy reverso com suporte a PHP e um cliente Certbot integrado que automatiza os processos de geração e renovação de certificados SSL gratuitos (Let's Encrypt e ZeroSSL). Também inclui o fail2ban para prevenção de intrusões.
    ro_RO: SWAG - Secure Web Application Gateway (cunoscut anterior ca letsencrypt, fără legătură cu Let's Encrypt™) configurează un server web Nginx și un proxy invers cu suport PHP și un client certbot încorporat care automatizează procesele gratuite de generare și reînnoire a certificatelor de server SSL (Let's Encrypt și ZeroSSL). De asemenea, conține fail2ban pentru prevenirea intruziunilor.
    ru_RU: SWAG — Secure Web Application Gateway (ранее известный как letsencrypt, не имеющий отношения к Let's Encrypt™) настраивает веб-сервер Nginx и обратный прокси с поддержкой PHP и встроенным клиентом certbot, который автоматизирует процессы генерации и продления бесплатных SSL-сертификатов для серверов (Let's Encrypt и ZeroSSL). Он также включает fail2ban для предотвращения вторжений.
    sk_SK: SWAG – Secure Web Application Gateway (predtým známa ako letsencrypt, bez súvislosti s Let's Encrypt™) nastavuje webový server Nginx a reverznú proxy s podporou PHP a vstavaným klientom certbot, ktorý automatizuje procesy generovania a obnovy bezplatných certifikátov SSL servera (Let's Encrypt a ZeroSSL). Obsahuje tiež fail2ban na prevenciu vniknutia.
    sv_SE: SWAG - Secure Web Application Gateway (tidigare känt som letsencrypt, ingen relation till Let's Encrypt™) konfigurerar en Nginx-webbserver och omvänd proxy med PHP-stöd och en inbyggd certbot-klient som automatiserar generering och förnyelse av kostnadsfria SSL-servercertifikat (Let's Encrypt och ZeroSSL). Den innehåller också fail2ban för att förhindra intrång.
    tr_TR: SWAG - Güvenli Web Uygulama Ağ Geçidi (eskiden letsencrypt olarak biliniyordu, Let's Encrypt™ ile hiçbir ilgisi yoktur) PHP desteği ve ücretsiz SSL sunucu sertifikası oluşturma ve yenileme işlemlerini (Let's Encrypt ve ZeroSSL) otomatikleştiren yerleşik bir certbot istemcisi ile bir Nginx web sunucusu ve ters proxy kurar. Ayrıca, saldırı önleme için fail2ban içerir.
    zh_CN: SWAG（Secure Web Application Gateway，原名 letsencrypt，与 Let's Encrypt™ 无关联）提供支持 PHP 的 Nginx 网页服务器和反向代理，内置 Certbot 客户端，可通过 Let's Encrypt 和 ZeroSSL 自动生成及续期免费 SSL 服务器证书。它还包含用于入侵防护的 Fail2ban。
    zh_TW: SWAG（Secure Web Application Gateway，原名 letsencrypt，與 Let's Encrypt™ 無關聯）提供支援 PHP 的 Nginx 網頁伺服器和反向代理，內建 Certbot 客戶端，可透過 Let's Encrypt 和 ZeroSSL 自動生成及續期免費 SSL 伺服器證書。它還包含用於入侵防護的 Fail2ban。
  tagline:
