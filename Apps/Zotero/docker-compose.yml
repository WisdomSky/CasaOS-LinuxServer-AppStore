name: linuxserver-zotero
services:
  app:
    image: linuxserver/zotero:10.0.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zotero/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Zotero is a free, easy-to-use tool to help you collect, organize, annotate, cite, and share research.
    zh_CN: Zotero 是一款免费、易用的工具，帮助你收集、整理、批注、引用和分享研究资料。
  tagline:
    en_US: A free, easy-to-use tool to help you collect, organize, annotate, cite, and share research.
    zh_CN: 收集、整理、批注、引用和分享研究资料。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/zotero-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/zotero-icon.png
  title:
    en_US: Zotero (LinuxServer.io)
    zh_CN: Zotero（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverzotero
  port_map: '3000'
  version: 10.0.2
