name: linuxserver-piwigo
services:
  app:
    image: linuxserver/piwigo:16.4.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/piwigo/config
        target: /config
      - type: bind
        source: /DATA/AppData/piwigo/gallery
        target: /gallery
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Piwigo is a photo gallery software for the web that comes with powerful features to publish and manage your collection of pictures.
    zh_CN: Piwigo 是一款网页相册软件，提供强大的照片发布和管理功能。
  tagline:
    en_US: A photo gallery software for the web that comes with powerful features to publish and manage your collection of pictures.
    zh_CN: 通过网页发布和管理照片收藏。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/piwigo-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/piwigo-banner.png
  title:
    en_US: Piwigo (LinuxServer.io)
    zh_CN: Piwigo（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverpiwigo
  port_map: '80'
  version: 16.4.0
