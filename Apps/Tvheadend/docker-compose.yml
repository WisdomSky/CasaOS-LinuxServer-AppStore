    it_IT: 'Funziona come server proxy: è un server e registratore di streaming TV per Linux, FreeBSD e Android che supporta DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP e HDHomeRun come sorgenti di input. Tvheadend offre lo streaming tramite HTTP (VLC, MPlayer), HTSP (Kodi, Movian) e SAT>IP. Sono supportate diverse sorgenti EPG (DVB e ATSC via etere, incluse le estensioni OpenTV DVB, XMLTV, PyXML).'
    ja_JP: プロキシ サーバーとして機能します。Linux、FreeBSD、Android 用の TV ストリーミング サーバーおよびレコーダーで、入力ソースとして DVB-S、DVB-S2、DVB-C、DVB-T、ATSC、ISDB-T、IPTV、SAT>IP、HDHomeRun をサポートしています。Tvheadend は、HTTP (VLC、MPlayer)、HTSP (Kodi、Movian)、SAT>IP ストリーミングを提供します。複数の EPG ソース (OpenTV DVB 拡張機能、XMLTV、PyXML を含む、地上波 DVB および ATSC) をサポートしています。
    ko_KR: 프록시 서버 역할을 하는 Tvheadend는 Linux, FreeBSD 및 Android용 TV 스트리밍 서버 및 녹화 프로그램으로, DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP 및 HDHomeRun을 입력 소스로 지원합니다. Tvheadend는 HTTP(VLC, MPlayer), HTSP(Kodi, Movian) 및 SAT>IP 스트리밍을 제공합니다. 또한 다양한 EPG 소스(지상파 DVB 및 ATSC, OpenTV DVB 확장, XMLTV, PyXML 포함)를 지원합니다.
    ml_IN: 'ഒരു പ്രോക്സി സെർവറായി പ്രവർത്തിക്കുന്നു: ഇൻപുട്ട് സ്രോതസ്സുകളായി DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP, HDHomeRun എന്നിവയെ പിന്തുണയ്ക്കുന്ന Linux, FreeBSD, Android എന്നിവയ്‌ക്കായുള്ള ഒരു ടിവി സ്ട്രീമിംഗ് സെർവറും റെക്കോർഡറുമാണ്. Tvheadend HTTP (VLC, MPlayer), HTSP (Kodi, Movian), SAT>IP സ്ട്രീമിംഗ് എന്നിവ വാഗ്ദാനം ചെയ്യുന്നു. ഒന്നിലധികം EPG ഉറവിടങ്ങൾ പിന്തുണയ്ക്കുന്നു (OpenTV DVB എക്സ്റ്റൻഷനുകൾ, XMLTV, PyXML ഉൾപ്പെടെ ഓവർ-ദി-എയർ DVB, ATSC).'
    nb_NO: 'Fungerer som en proxy-server: er en TV-strømmeserver og opptaker for Linux, FreeBSD og Android som støtter DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP og HDHomeRun som inngangskilder. Tvheadend tilbyr HTTP (VLC, MPlayer), HTSP (Kodi, Movian) og SAT>IP-strømming. Flere EPG-kilder støttes (over-the-air DVB og ATSC inkludert OpenTV DVB-utvidelser, XMLTV, PyXML).'
    nl_NL: 'Werkt als proxyserver: is een tv-streamingserver en -recorder voor Linux, FreeBSD en Android met ondersteuning voor DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP en HDHomeRun als invoerbronnen. Tvheadend biedt streaming via HTTP (VLC, MPlayer), HTSP (Kodi, Movian) en SAT>IP. Meerdere EPG-bronnen worden ondersteund (over-the-air DVB en ATSC inclusief OpenTV DVB-extensies, XMLTV, PyXML).'
    pl_PL: 'Działa jako serwer proxy: to serwer streamingowy i nagrywarka TV dla systemów Linux, FreeBSD i Android, obsługująca źródła sygnału DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP oraz HDHomeRun. Tvheadend oferuje streaming HTTP (VLC, MPlayer), HTSP (Kodi, Movian) oraz SAT>IP. Obsługiwane są liczne źródła EPG (naziemne DVB i ATSC, w tym rozszerzenia OpenTV DVB, XMLTV, PyXML).'
    pt_BR: 'Funciona como um servidor proxy: é um servidor de streaming e gravador de TV para Linux, FreeBSD e Android, compatível com DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP e HDHomeRun como fontes de entrada. O Tvheadend oferece streaming via HTTP (VLC, MPlayer), HTSP (Kodi, Movian) e SAT>IP. Suporta múltiplas fontes de EPG (DVB e ATSC via antena, incluindo extensões OpenTV DVB, XMLTV e PyXML).'
    ro_RO: 'Funcționează ca server proxy: este un server de streaming TV și un înregistrator pentru Linux, FreeBSD și Android, suportând DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP și HDHomeRun ca surse de intrare. Tvheadend oferă streaming HTTP (VLC, MPlayer), HTSP (Kodi, Movian) și SAT>IP. Sunt acceptate mai multe surse EPG (DVB over-the-air și ATSC, inclusiv extensii OpenTV DVB, XMLTV, PyXML).'
    ru_RU: 'Работает как прокси-сервер: это сервер потокового вещания и записи ТВ для Linux, FreeBSD и Android, поддерживающий DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP и HDHomeRun в качестве источников входного сигнала. Tvheadend предлагает потоковую передачу по HTTP (VLC, MPlayer), HTSP (Kodi, Movian) и SAT>IP. Поддерживаются несколько источников EPG (эфирное вещание DVB и ATSC, включая расширения OpenTV DVB, XMLTV, PyXML).'
    sk_SK: 'Funguje ako proxy server: je streamovací server a rekordér TV pre Linux, FreeBSD a Android s podporou DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP a HDHomeRun ako vstupných zdrojov. Tvheadend ponúka streamovanie HTTP (VLC, MPlayer), HTSP (Kodi, Movian) a SAT>IP. Podporovaných je viacero zdrojov EPG (bezdrôtové DVB a ATSC vrátane rozšírení OpenTV DVB, XMLTV, PyXML).'
    sv_SE: 'Fungerar som en proxyserver: är en TV-streamingserver och inspelare för Linux, FreeBSD och Android som stöder DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP och HDHomeRun som ingångskällor. Tvheadend erbjuder HTTP (VLC, MPlayer), HTSP (Kodi, Movian) och SAT>IP-streaming. Flera EPG-källor stöds (over-the-air DVB och ATSC inklusive OpenTV DVB-tillägg, XMLTV, PyXML).'
    tr_TR: 'Proxy sunucusu olarak çalışır: Linux, FreeBSD ve Android için DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP ve HDHomeRun giriş kaynaklarını destekleyen bir TV yayın sunucusu ve kaydedicisidir. Tvheadend, HTTP (VLC, MPlayer), HTSP (Kodi, Movian) ve SAT>IP yayınını sunar. Birden fazla EPG kaynağı desteklenir (OpenTV DVB uzantıları dahil havadan DVB ve ATSC, XMLTV, PyXML).'
    zh_CN: 支持多种广播源和协议的电视串流与录制服务器。
    zh_TW: 支援多種廣播源和協議的電視串流與錄製伺服器。
