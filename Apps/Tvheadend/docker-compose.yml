name: linuxserver-tvheadend
services:
  app:
    image: linuxserver/tvheadend:version-5ce3ff63
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: RUN_OPTS
          description:
            en_US: Optionally specify additional arguments to be passed. See Additional runtime parameters. [OPTIONAL]
    ports:
      - target: 9981
        published: 9981
        protocol: tcp
      - target: 9982
        published: 9982
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/tvheadend/config
        target: /config
      - type: bind
        source: /DATA/AppData/tvheadend/recordings
        target: /recordings
    devices:
      - /dev/dri:/dev/dri
      - /dev/dvb:/dev/dvb
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Tvheadend works as a proxy server: is a TV streaming server and recorder for Linux, FreeBSD and Android supporting DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP and HDHomeRun as input sources. Tvheadend offers the HTTP (VLC, MPlayer), HTSP (Kodi, Movian) and SAT>IP streaming. Multiple EPG sources are supported (over-the-air DVB and ATSC including OpenTV DVB extensions, XMLTV, PyXML).'
    ca_ES: 'Tvheadend funciona com a servidor proxy: és un servidor i gravador de streaming de TV per a Linux, FreeBSD i Android que admet DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP i HDHomeRun com a fonts d''entrada. Tvheadend ofereix streaming HTTP (VLC, MPlayer), HTSP (Kodi, Movian) i SAT>IP. S''admeten múltiples fonts EPG (DVB per aire i ATSC, incloent-hi extensions DVB d''OpenTV, XMLTV, PyXML).'
    cs_CZ: 'Tvheadend funguje jako proxy server: je streamovací server a rekordér TV pro Linux, FreeBSD a Android s podporou DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP a HDHomeRun jako vstupních zdrojů. Tvheadend nabízí streamování HTTP (VLC, MPlayer), HTSP (Kodi, Movian) a SAT>IP. Podporuje více zdrojů EPG (over-the-air DVB a ATSC včetně rozšíření OpenTV DVB, XMLTV, PyXML).'
    da_DK: 'Tvheadend fungerer som en proxyserver: det er en TV-streamingserver og -optager til Linux, FreeBSD og Android, der understøtter DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP og HDHomeRun som inputkilder. Tvheadend tilbyder HTTP (VLC, MPlayer), HTSP (Kodi, Movian) og SAT>IP-streaming. Flere EPG-kilder understøttes (over-the-air DVB og ATSC inklusive OpenTV DVB-udvidelser, XMLTV, PyXML).'
    de_DE: 'Tvheadend fungiert als Proxy-Server: Es ist ein TV-Streaming-Server und -Recorder für Linux, FreeBSD und Android, der DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP und HDHomeRun als Eingangsquellen unterstützt. Tvheadend bietet HTTP-Streaming (VLC, MPlayer), HTSP-Streaming (Kodi, Movian) und SAT>IP-Streaming. Mehrere EPG-Quellen werden unterstützt (terrestrisches DVB und ATSC inklusive OpenTV-DVB-Erweiterungen, XMLTV und PyXML).'
    el_GR: 'Το Tvheadend λειτουργεί ως διακομιστής proxy: είναι ένας διακομιστής και συσκευή εγγραφής τηλεοπτικής ροής για Linux, FreeBSD και Android που υποστηρίζει DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP και HDHomeRun ως πηγές εισόδου. Το Tvheadend προσφέρει streaming HTTP (VLC, MPlayer), HTSP (Kodi, Movian) και SAT>IP. Υποστηρίζονται πολλαπλές πηγές EPG (over-the-air DVB και ATSC συμπεριλαμβανομένων των επεκτάσεων OpenTV DVB, XMLTV, PyXML).'
    en_GB: 'Tvheadend works as a proxy server: is a Tv streaming server and recorder for Linux, Freebsd and Android supporting Dvb-S, Dvb-S2, Dvb-C, Dvb-T, Atsc, Isdb-T, Iptv, Sat>Ip and Hdhomerun as input sources. Tvheadend offers the Http (Vlc, Mplayer), Htsp (Kodi, Movian) and Sat>Ip streaming. Multiple Epg sources are supported (over-the-air Dvb and Atsc including Opentv Dvb extensions, Xmltv, Pyxml).'
    es_ES: 'Tvheadend funciona como un servidor proxy: es un servidor de transmisión y grabador de TV para Linux, FreeBSD y Android que admite DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP y HDHomeRun como fuentes de entrada. Tvheadend ofrece transmisión HTTP (VLC, MPlayer), HTSP (Kodi, Movian) y SAT>IP. Admite múltiples fuentes de EPG (DVB y ATSC terrestres, incluyendo extensiones OpenTV DVB, XMLTV y PyXML).'
    fr_FR: "Tvheadend fonctionne comme un serveur proxy\_: c'est un serveur de streaming TV et un enregistreur pour Linux, FreeBSD et Android, compatible avec les sources d'entrée DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP et HDHomeRun. Tvheadend propose le streaming HTTP (VLC, MPlayer), HTSP (Kodi, Movian) et SAT>IP. Plusieurs sources EPG sont prises en charge (DVB et ATSC hertziens, y compris les extensions OpenTV DVB, XMLTV et PyXML)."
    ga_IE: 'Oibríonn Tvheadend mar fhreastalaí seachfhreastalaí: is freastalaí sruthú teilifíse agus taifeadán é do Linux, FreeBSD agus Android a thacaíonn le DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP agus HDHomeRun mar fhoinsí ionchuir. Cuireann Tvheadend sruthú HTTP (VLC, MPlayer), HTSP (Kodi, Movian) agus SAT>IP ar fáil. Tacaítear le foinsí EPG iolracha (DVB agus ATSC thar an aer lena n-áirítear síntí OpenTV DVB, XMLTV, PyXML).'
    hr_HR: 'Tvheadend radi kao proxy poslužitelj: je TV streaming poslužitelj i snimač za Linux, FreeBSD i Android koji podržava DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP i HDHomeRun kao ulazne izvore. Tvheadend nudi HTTP (VLC, MPlayer), HTSP (Kodi, Movian) i SAT>IP streaming. Podržani su višestruki EPG izvori (DVB i ATSC putem etera, uključujući OpenTV DVB ekstenzije, XMLTV, PyXML).'
    hu_HU: 'A Tvheadend proxy szerverként működik: egy TV streaming szerver és felvevő Linux, FreeBSD és Android rendszerekre, amely bemeneti forrásként támogatja a DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP és HDHomeRun szabványokat. A Tvheadend HTTP (VLC, MPlayer), HTSP (Kodi, Movian) és SAT>IP streamelést kínál. Több EPG forrást is támogat (földi DVB és ATSC, beleértve az OpenTV DVB kiterjesztéseket, XMLTV-t, PyXML-t).'
    it_IT: 'Tvheadend funziona come server proxy: è un server e registratore di streaming TV per Linux, FreeBSD e Android che supporta DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP e HDHomeRun come sorgenti di input. Tvheadend offre lo streaming tramite HTTP (VLC, MPlayer), HTSP (Kodi, Movian) e SAT>IP. Sono supportate diverse sorgenti EPG (DVB e ATSC via etere, incluse le estensioni OpenTV DVB, XMLTV, PyXML).'
    ja_JP: Tvheadendはプロキシサーバーとして機能します。Linux、FreeBSD、Android向けのTVストリーミングサーバーおよびレコーダーであり、入力ソースとしてDVB-S、DVB-S2、DVB-C、DVB-T、ATSC、ISDB-T、IPTV、SAT>IP、HDHomeRunをサポートしています。TvheadendはHTTP（VLC、MPlayer）、HTSP（Kodi、Movian）、SAT>IPストリーミングを提供します。複数のEPGソース（OpenTV DVB拡張機能、XMLTV、PyXMLを含む、地上波DVBおよびATSC）をサポートしています。
    ko_KR: Tvheadend는 프록시 서버 역할을 하는 TV 스트리밍 서버 및 녹화 프로그램으로, Linux, FreeBSD 및 Android에서 사용 가능하며 DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP 및 HDHomeRun을 입력 소스로 지원합니다. Tvheadend는 HTTP(VLC, MPlayer), HTSP(Kodi, Movian) 및 SAT>IP 스트리밍을 제공합니다. 또한 다양한 EPG 소스(지상파 DVB 및 ATSC, OpenTV DVB 확장, XMLTV, PyXML 포함)를 지원합니다.
    ml_IN: 'ഒരു പ്രോക്സി സെർവറായി പ്രവർത്തിക്കുന്നു: ഇത് DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP, HDHomeRun എന്നിവ ഇൻപുട്ട് സ്രോതസ്സുകളായി പിന്തുണയ്ക്കുന്ന Linux, FreeBSD, Android എന്നിവയ്‌ക്കായുള്ള ഒരു ടിവി സ്ട്രീമിംഗ് സെർവറും റെക്കോർഡറുമാണ്. Tvheadend HTTP (VLC, MPlayer), HTSP (Kodi, Movian), SAT>IP സ്ട്രീമിംഗ് എന്നിവ വാഗ്ദാനം ചെയ്യുന്നു. ഒന്നിലധികം EPG ഉറവിടങ്ങൾ പിന്തുണയ്ക്കുന്നു (OpenTV DVB എക്സ്റ്റൻഷനുകൾ, XMLTV, PyXML ഉൾപ്പെടെ ഓവർ-ദി-എയർ DVB, ATSC).'
    nb_NO: 'Tvheadend fungerer som en proxy-server: er en TV-strømmeserver og -opptaker for Linux, FreeBSD og Android som støtter DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP og HDHomeRun som inngangskilder. Tvheadend tilbyr HTTP (VLC, MPlayer), HTSP (Kodi, Movian) og SAT>IP-strømming. Flere EPG-kilder støttes (over-the-air DVB og ATSC inkludert OpenTV DVB-utvidelser, XMLTV, PyXML).'
    nl_NL: 'Tvheadend werkt als een proxyserver: het is een tv-streamingserver en -recorder voor Linux, FreeBSD en Android die DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP en HDHomeRun als invoerbronnen ondersteunt. Tvheadend biedt streaming via HTTP (VLC, MPlayer), HTSP (Kodi, Movian) en SAT>IP. Meerdere EPG-bronnen worden ondersteund (over-the-air DVB en ATSC, inclusief OpenTV DVB-extensies, XMLTV, PyXML).'
    pl_PL: 'Tvheadend działa jako serwer proxy: to serwer streamingu telewizyjnego i nagrywarka dla systemów Linux, FreeBSD i Android, obsługująca źródła sygnału DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP oraz HDHomeRun. Tvheadend oferuje streaming HTTP (VLC, MPlayer), HTSP (Kodi, Movian) oraz SAT>IP. Obsługiwanych jest wiele źródeł EPG (naziemne DVB i ATSC, w tym rozszerzenia OpenTV DVB, XMLTV, PyXML).'
    pt_BR: 'O Tvheadend funciona como um servidor proxy: é um servidor de streaming e gravador de TV para Linux, FreeBSD e Android, compatível com DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP e HDHomeRun como fontes de entrada. O Tvheadend oferece streaming via HTTP (VLC, MPlayer), HTSP (Kodi, Movian) e SAT>IP. Múltiplas fontes de EPG são suportadas (DVB e ATSC via antena, incluindo extensões OpenTV DVB, XMLTV e PyXML).'
    ro_RO: 'Tvheadend funcționează ca server proxy: este un server de streaming TV și un recorder pentru Linux, FreeBSD și Android, suportând DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP și HDHomeRun ca surse de intrare. Tvheadend oferă streaming HTTP (VLC, MPlayer), HTSP (Kodi, Movian) și SAT>IP. Sunt suportate mai multe surse EPG (DVB over-the-air și ATSC, inclusiv extensii OpenTV DVB, XMLTV, PyXML).'
    ru_RU: 'Tvheadend работает как прокси-сервер: это сервер потокового вещания и записи телепередач для Linux, FreeBSD и Android, поддерживающий DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP и HDHomeRun в качестве источников входного сигнала. Tvheadend предлагает потоковую передачу по HTTP (VLC, MPlayer), HTSP (Kodi, Movian) и SAT>IP. Поддерживаются различные источники EPG (эфирное вещание DVB и ATSC, включая расширения OpenTV DVB, XMLTV, PyXML).'
    sk_SK: 'Tvheadend funguje ako proxy server: je TV streamovací server a rekordér pre Linux, FreeBSD a Android s podporou DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP a HDHomeRun ako vstupných zdrojov. Tvheadend ponúka streamovanie cez HTTP (VLC, MPlayer), HTSP (Kodi, Movian) a SAT>IP. Podporovaných je viacero zdrojov EPG (bezdrôtové DVB a ATSC vrátane rozšírení OpenTV DVB, XMLTV, PyXML).'
    sv_SE: 'Tvheadend fungerar som en proxyserver: det är en TV-streamingserver och inspelare för Linux, FreeBSD och Android som stöder DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP och HDHomeRun som ingångskällor. Tvheadend erbjuder HTTP (VLC, MPlayer), HTSP (Kodi, Movian) och SAT>IP-streaming. Flera EPG-källor stöds (over-the-air DVB och ATSC inklusive OpenTV DVB-tillägg, XMLTV, PyXML).'
    tr_TR: 'Tvheadend bir proxy sunucusu olarak çalışır: Linux, FreeBSD ve Android için DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP ve HDHomeRun giriş kaynaklarını destekleyen bir TV yayın sunucusu ve kaydedicisidir. Tvheadend, HTTP (VLC, MPlayer), HTSP (Kodi, Movian) ve SAT>IP yayınını sunar. Birden fazla EPG kaynağı desteklenir (OpenTV DVB uzantıları dahil olmak üzere havadan DVB ve ATSC, XMLTV, PyXML).'
    zh_CN: Tvheadend 是适用于 Linux、FreeBSD 和 Android 的电视串流与录制服务器，也可充当代理。它支持 DVB-S、DVB-S2、DVB-C、DVB-T、ATSC、ISDB-T、IPTV、SAT>IP 和 HDHomeRun 输入源，并提供 HTTP（VLC、MPlayer）、HTSP（Kodi、Movian）及 SAT>IP 串流。它支持多种电子节目指南（EPG）来源，包括无线 DVB 和 ATSC（含 OpenTV DVB 扩展）、XMLTV 和 PyXML。
    zh_TW: Tvheadend 是適用於 Linux、FreeBSD 和 Android 的電視串流與錄製伺服器，也可充當代理。它支援 DVB-S、DVB-S2、DVB-C、DVB-T、ATSC、ISDB-T、IPTV、SAT>IP 和 HDHomeRun 輸入源，並提供 HTTP（VLC、MPlayer）、HTSP（Kodi、Movian）及 SAT>IP 串流。它支援多種電子節目指南（EPG）來源，包括無線 DVB 和 ATSC（含 OpenTV DVB 擴充套件）、XMLTV 和 PyXML。
