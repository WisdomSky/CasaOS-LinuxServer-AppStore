    ru_RU: Бесплатный, портативный и легковесный сервер интернет-чата Internet Relay Chat для небольших или частных сетей, разработанный под лицензией GNU General Public License (GPL). Он прост в настройке, может работать с динамическими IP-адресами и поддерживает IPv6, SSL-защищенные соединения, а также PAM для аутентификации. Он написан с нуля и не основан на оригинальном IRCd.
    sk_SK: Bezplatný, prenosný a ľahký server Internet Relay Chat pre malé alebo súkromné siete, vyvinutý pod licenciou GNU General Public License (GPL). Je ľahko konfigurovateľný, dokáže pracovať s dynamickými IP adresami a podporuje IPv6, pripojenia chránené SSL, ako aj PAM na autentifikáciu. Je napísaný od základov a nie je založený na pôvodnom IRCd.
    sv_SE: En gratis, portabel och lätt Internet Relay Chat-server för små eller privata nätverk, utvecklad under GNU General Public License (GPL). Den är enkel att konfigurera, kan hantera dynamiska IP-adresser och stöder IPv6, SSL-skyddade anslutningar samt PAM för autentisering. Den är skriven från grunden och inte baserad på den ursprungliga IRCd.
    tr_TR: GNU Genel Kamu Lisansı (GPL) altında geliştirilen, küçük veya özel ağlar için ücretsiz, taşınabilir ve hafif bir İnternet Röle Sohbeti (IRC) sunucusudur. Yapılandırması kolaydır, dinamik IP adresleriyle başa çıkabilir ve IPv6, SSL korumalı bağlantılar ve kimlik doğrulama için PAM'ı destekler. Sıfırdan yazılmıştır ve orijinal IRCd'ye dayanmaz.
    zh_CN: 适用于小型或私有网络的轻量 IRC 服务器。
    zh_TW: 適用於小型或私有網路的輕量 IRC 伺服器。
