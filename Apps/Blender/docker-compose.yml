    nl_NL: Een gratis en open-source 3D-computerprogramma voor grafische toepassingen, gebruikt voor het maken van animatiefilms, visuele effecten, kunst, 3D-geprinte modellen, motion graphics, interactieve 3D-applicaties, virtual reality en computerspellen. Deze afbeelding ondersteunt standaard geen GPU-rendering, alleen een versnelde werkruimte.
    pl_PL: Darmowy i otwarty zestaw narzędzi do grafiki komputerowej 3D, służący do tworzenia filmów animowanych, efektów wizualnych, grafiki, modeli drukowanych w 3D, grafiki ruchomej, interaktywnych aplikacji 3D, rzeczywistości wirtualnej i gier komputerowych. Ten obraz nie obsługuje renderowania GPU w trybie „out of the box” – obsługuje jedynie akcelerowany obszar roboczy.
    pt_BR: Um conjunto de ferramentas de software gráfico 3D gratuito e de código aberto usado para criar filmes de animação, efeitos visuais, arte, modelos impressos em 3D, motion graphics, aplicativos 3D interativos, realidade virtual e jogos de computador. Esta imagem não oferece suporte à renderização por GPU nativamente, apenas à experiência de espaço de trabalho acelerado.
    ro_RO: Un set de instrumente software de grafică 3D pe calculator, gratuit și open-source, utilizat pentru crearea de filme animate, efecte vizuale, artă, modele imprimate 3D, grafică animată, aplicații 3D interactive, realitate virtuală și jocuri pe calculator. Această imagine nu acceptă randarea GPU direct din cutie, ci oferă doar o experiență accelerată în spațiul de lucru.
    ru_RU: Бесплатный набор инструментов с открытым исходным кодом для 3D-компьютерной графики, используемый для создания анимационных фильмов, визуальных эффектов, произведений искусства, 3D-моделей для печати, моушн-графики, интерактивных 3D-приложений, виртуальной реальности и компьютерных игр. Данный образ не поддерживает рендеринг на графическом процессоре (GPU) по умолчанию, только ускоренное отображение в рабочей области.
    sk_SK: Bezplatná sada nástrojov pre 3D počítačovú grafiku s otvoreným zdrojovým kódom, ktorá sa používa na vytváranie animovaných filmov, vizuálnych efektov, umenia, 3D tlačených modelov, pohyblivej grafiky, interaktívnych 3D aplikácií, virtuálnej reality a počítačových hier. Tento obrázok nepodporuje vykresľovanie pomocou GPU, iba zrýchlené prostredie pracovného priestoru.
    sv_SE: En gratis och öppen källkodsbaserad 3D-datorgrafikprogramvara som används för att skapa animerade filmer, visuella effekter, konst, 3D-utskrivna modeller, rörlig grafik, interaktiva 3D-applikationer, virtuell verklighet och datorspel. Den här bilden stöder inte GPU-rendering direkt ur lådan, endast accelererad arbetsyta.
    tr_TR: Animasyon filmler, görsel efektler, sanat eserleri, 3 boyutlu yazdırılabilir modeller, hareketli grafikler, etkileşimli 3 boyutlu uygulamalar, sanal gerçeklik ve bilgisayar oyunları oluşturmak için kullanılan ücretsiz ve açık kaynaklı bir 3 boyutlu bilgisayar grafik yazılım araç seti. Bu görüntü, varsayılan olarak GPU işlemeyi desteklemez, yalnızca hızlandırılmış çalışma alanı deneyimini destekler.
    zh_CN: 免费的开源 3D 创作工具集。
    zh_TW: 免費的開源 3D 創作工具集。
