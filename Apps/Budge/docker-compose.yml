name: linuxserver-budge
services:
  app:
    image: linuxserver/budge:0.0.9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/budge/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Budge is an open source 'budgeting with envelopes' personal finance app.
    zh_CN: Budge 是一款采用“信封预算法”的开源个人财务应用。
  tagline:
    en_US: An open source 'budgeting with envelopes' personal finance app.
    zh_CN: 采用信封预算法的开源个人财务应用。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/WisdomSky/CasaOS-LinuxServer-AppStore/main/default-icon.svg
  thumbnail: ''
  title:
    en_US: Budge (LinuxServer.io)
    zh_CN: Budge（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverbudge
  port_map: '80'
  version: 0.0.9
