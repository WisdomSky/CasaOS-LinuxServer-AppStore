  tagline:
    en_US: 'Makes asset management easy. It was built by people solving real-world IT and asset management problems, and a solid UX has always been a top priority. Straightforward design and bulk actions mean getting things done faster. '
    zh_CN: 简化 IT 设备与资产管理。
    ca_ES: Facilita la gestió d'actius. Va ser creat per persones que resolien problemes reals de TI i gestió d'actius, i una experiència d'usuari sòlida sempre ha estat una prioritat màxima. Un disseny senzill i accions massives permeten fer les coses més ràpidament.
    cs_CZ: Usnadňuje správu aktiv. Byl vytvořen lidmi, kteří řeší reálné problémy v oblasti IT a správy aktiv, a solidní uživatelská zkušenost byla vždy nejvyšší prioritou. Jednoduchý design a hromadné akce znamenají rychlejší vyřízení úkolů.
    da_DK: Gør aktivstyring nemt. Det blev bygget af folk, der løste virkelige IT- og aktivstyringsproblemer, og en solid brugeroplevelse har altid været en topprioritet. Ligetil design og massehandlinger betyder, at tingene bliver gjort hurtigere.
    de_DE: Vereinfacht die Anlagenverwaltung. Entwickelt von Experten, die reale IT- und Anlagenverwaltungsprobleme lösen, stand eine intuitive Benutzerführung stets im Vordergrund. Dank des übersichtlichen Designs und der Möglichkeit, Aufgaben in großen Mengen zu erledigen, geht alles schneller.
    el_GR: Κάνει τη διαχείριση περιουσιακών στοιχείων εύκολη. Δημιουργήθηκε από άτομα που λύνουν πραγματικά προβλήματα πληροφορικής και διαχείρισης περιουσιακών στοιχείων, και ένα στιβαρό UX ήταν πάντα ύψιστη προτεραιότητα. Ο απλός σχεδιασμός και οι μαζικές ενέργειες σημαίνουν ότι τα πράγματα γίνονται πιο γρήγορα.
    en_GB: 'Makes asset management easy. It was built by people solving real-world It and asset management problems, and a solid Ux has always been a top priority. Straightforward design and bulk actions mean getting things done faster. '
    es_ES: Simplifica la gestión de activos. Fue creada por personas que resuelven problemas reales de TI y gestión de activos, y una sólida experiencia de usuario siempre ha sido una prioridad. Su diseño intuitivo y las acciones masivas permiten realizar tareas con mayor rapidez.
    fr_FR: Simplifie la gestion des actifs. Conçu par des experts confrontés à des problématiques concrètes de gestion informatique et d'actifs, ce logiciel accorde une importance primordiale à l'expérience utilisateur. Son design intuitif et ses actions groupées permettent une productivité accrue.
    ga_IE: Déanann sé bainistíocht sócmhainní éasca. Tógadh é ag daoine a bhí ag réiteach fadhbanna TF agus bainistíochta sócmhainní sa saol réadúil, agus bhí UX soladach ina thosaíocht i gcónaí. Ciallaíonn dearadh simplí agus gníomhartha mórchóir go ndéantar rudaí níos tapúla.
    hr_HR: Olakšava upravljanje imovinom. Izgradili su ga ljudi koji rješavaju stvarne IT probleme i probleme upravljanja imovinom, a solidno korisničko iskustvo oduvijek je bilo glavni prioritet. Jednostavan dizajn i skupne akcije znače brže obavljanje posla.
    hu_HU: Megkönnyíti az eszközkezelést. Valós informatikai és eszközkezelési problémákat megoldó emberek építették, és a stabil felhasználói élmény mindig is kiemelt fontosságú volt. Az egyszerű tervezés és a tömeges műveletek gyorsabbá teszik a dolgokat.
    it_IT: Semplifica la gestione degli asset. È stato creato da persone che risolvevano problemi reali di IT e gestione degli asset, e un'esperienza utente ottimale è sempre stata una priorità assoluta. Il design intuitivo e le azioni di massa consentono di completare le attività più velocemente.
    ja_JP: 資産管理を容易にします。実際のITおよび資産管理の問題を解決する人々によって開発され、優れたユーザーエクスペリエンスは常に最優先事項でした。シンプルなデザインと一括操作により、作業をより迅速に完了できます。
    ko_KR: 자산 관리를 간편하게 만들어줍니다. 실제 IT 및 자산 관리 문제를 해결해 온 사람들이 개발했으며, 뛰어난 사용자 경험(UX)을 최우선으로 고려했습니다. 직관적인 디자인과 일괄 처리 기능을 통해 작업을 더 빠르게 완료할 수 있습니다.
    ml_IN: അസറ്റ് മാനേജ്മെന്റ് എളുപ്പമാക്കുന്നു. യഥാർത്ഥ ലോകത്തിലെ ഐടി, അസറ്റ് മാനേജ്മെന്റ് പ്രശ്നങ്ങൾ പരിഹരിക്കുന്ന ആളുകളാണ് ഇത് നിർമ്മിച്ചത്, കൂടാതെ ഒരു മികച്ച UX എപ്പോഴും ഒരു മുൻ‌ഗണനയാണ്. നേരായ രൂപകൽപ്പനയും ബൾക്ക് പ്രവർത്തനങ്ങളും കാര്യങ്ങൾ വേഗത്തിൽ പൂർത്തിയാക്കാൻ സഹായിക്കുന്നു.
    nb_NO: Gjør ressursforvaltning enkelt. Det ble bygget av folk som løste reelle IT- og ressursforvaltningsproblemer, og en solid brukeropplevelse har alltid vært en topprioritet. Enkel design og massehandlinger betyr at ting blir gjort raskere.
    nl_NL: Maakt assetmanagement eenvoudig. Het is ontwikkeld door mensen die echte IT- en assetmanagementproblemen oplosten, en een solide gebruikerservaring (UX) is altijd een topprioriteit geweest. Dankzij het overzichtelijke ontwerp en de bulkacties kunt u dingen sneller voor elkaar krijgen.
    pl_PL: Ułatwia zarządzanie zasobami. Został stworzony przez osoby rozwiązujące rzeczywiste problemy IT i zarządzania zasobami, a solidny UX zawsze był priorytetem. Prosty design i zbiorcze działania oznaczają szybszą realizację zadań.
    pt_BR: Simplifica a gestão de ativos. Foi desenvolvido por pessoas que resolviam problemas reais de TI e gestão de ativos, e uma experiência de usuário sólida sempre foi uma prioridade. Design intuitivo e ações em lote significam realizar tarefas mais rapidamente.
    ro_RO: Simplifică gestionarea activelor. A fost creat de oameni care rezolvă probleme IT și de gestionare a activelor din lumea reală, iar o experiență de utilizare solidă a fost întotdeauna o prioritate absolută. Designul simplu și acțiunile în bloc înseamnă că lucrurile se finalizează mai rapid.
    ru_RU: Упрощает управление активами. Приложение создано людьми, решающими реальные задачи в сфере ИТ и управления активами, и качественный пользовательский интерфейс всегда был для них приоритетом. Простой дизайн и возможность выполнения групповых операций позволяют быстрее достигать поставленных целей.
    sk_SK: Zjednodušuje správu aktív. Bol vytvorený ľuďmi, ktorí riešia reálne problémy v oblasti IT a správy aktív, a solídne používateľské rozhranie bolo vždy najvyššou prioritou. Priamočiary dizajn a hromadné akcie znamenajú rýchlejšie vykonanie úloh.
    sv_SE: Gör tillgångshantering enkel. Den byggdes av människor som löser verkliga IT- och tillgångshanteringsproblem, och en gedigen användarupplevelse har alltid varit högsta prioritet. Enkel design och massåtgärder innebär att saker får gjorda snabbare.
    tr_TR: Varlık yönetimini kolaylaştırır. Gerçek dünyadaki BT ve varlık yönetimi sorunlarını çözen kişiler tarafından geliştirilmiştir ve sağlam bir kullanıcı deneyimi her zaman en büyük öncelik olmuştur. Basit tasarım ve toplu işlemler, işlerin daha hızlı halledilmesini sağlar.
    zh_TW: 簡化 IT 裝置與資產管理。
