name: linuxserver-brave
services:
  app:
    image: linuxserver/brave:1.95.102
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/brave/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: The Brave browser is a fast, private and secure web browser for PC, Mac and mobile.
    zh_CN: Brave 是一款适用于 PC、Mac 和移动设备的快速、安全且注重隐私的网页浏览器。
  tagline:
    en_US: A fast, private and secure web browser for PC, Mac and mobile.
    zh_CN: 快速、注重隐私的跨平台浏览器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
  title:
    en_US: Brave (LinuxServer.io)
    zh_CN: Brave（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverbrave
  port_map: '3000'
  version: 1.95.102
