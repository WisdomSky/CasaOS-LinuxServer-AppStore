name: linuxserver-radarr
services:
  app:
    image: linuxserver/radarr:6.4.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 7878
        published: 7878
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/radarr/config
        target: /config
      - type: bind
        source: /DATA/AppData/radarr/movies
        target: /movies
      - type: bind
        source: /DATA/AppData/radarr/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Radarr - A fork of Sonarr to work with movies à la Couchpotato.
    zh_CN: Radarr 是 Sonarr 的分支，将其功能用于电影管理，方式类似 CouchPotato。
  tagline:
    en_US: A fork of Sonarr to work with movies à la Couchpotato.
    zh_CN: 基于 Sonarr 的电影管理工具。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/radarr.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/radarr.png
  title:
    en_US: Radarr (LinuxServer.io)
    zh_CN: Radarr（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverradarr
  port_map: '7878'
  version: 6.4.4
