name: linuxserver-planka
services:
  app:
    image: linuxserver/planka:2.2.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      DATABASE_URL: ''
      DEFAULT_ADMIN_EMAIL: ''
      DEFAULT_ADMIN_USERNAME: ''
      DEFAULT_ADMIN_PASSWORD: ''
      DEFAULT_ADMIN_NAME: ''
      SECRET_KEY: ''
      TRUST_PROXY: ''
      DEFAULT_LANGUAGE: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: BASE_URL
          description:
            en_US: The URL you will use to access planka including protocol, and port if not 80/443.
        - container: DATABASE_URL
          description:
            en_US: Postgres database URL. Special characters must be url encoded.
        - container: DEFAULT_ADMIN_EMAIL
          description:
            en_US: Email address for default user.
        - container: DEFAULT_ADMIN_USERNAME
          description:
            en_US: Username for default user.
        - container: DEFAULT_ADMIN_PASSWORD
          description:
            en_US: Password for default user.
        - container: DEFAULT_ADMIN_NAME
          description:
            en_US: Display name for default user.
        - container: SECRET_KEY
          description:
            en_US: Session encryption key, recommended 32-64 character alphanumeric.
        - container: TRUST_PROXY
          description:
            en_US: Set to true to trust upstream proxies if reverse proxying.
        - container: DEFAULT_LANGUAGE
          description:
            en_US: This sets the default language for sending notifications per user (if a user hasn't selected a language) and per board. [OPTIONAL]
    ports:
      - target: 1337
        published: 1337
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/planka/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Planka is an elegant open source project tracking tool.
  tagline:
    en_US: An elegant open source project tracking tool.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/planka-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/planka-logo.png
  title:
    en_US: Planka (LinuxServer.io)
  category: Home
  id: wisdomsky.linuxserver.linuxserverplanka
  port_map: '1337'
  version: 2.2.1
