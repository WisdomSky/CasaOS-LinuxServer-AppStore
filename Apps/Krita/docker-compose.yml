name: linuxserver-krita
services:
  app:
    image: linuxserver/krita:5.3.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Krita is a professional FREE and open source painting program. It is made by artists that want to see affordable art tools for everyone.
    zh_CN: Krita 是一款专业、免费、开源的绘画软件，由希望让所有人都能获得价格可负担的艺术工具的艺术家开发。
  tagline:
    en_US: A professional FREE and open source painting program. It is made by artists that want to see affordable art tools for everyone.
    zh_CN: 为艺术家打造的免费开源绘画软件。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/krita-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/krita-logo.png
  title:
    en_US: Krita (LinuxServer.io)
    zh_CN: Krita（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverkrita
  port_map: '3000'
  version: 5.3.4
