name: linuxserver-digikam
services:
  app:
    image: linuxserver/digikam:9.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: 'digiKam: Professional Photo Management with the Power of Open Source'
    zh_CN: digiKam：由开源技术驱动的专业照片管理软件。
  tagline:
    en_US: 'digiKam: Professional Photo Management with the Power of Open Source'
    zh_CN: 开源的专业照片管理软件。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/digikam.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/digikam.png
  title:
    en_US: Digikam (LinuxServer.io)
    zh_CN: Digikam（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverdigikam
  port_map: '3000'
  version: 9.1.0
