name: linuxserver-xemu
services:
  app:
    image: linuxserver/xemu:0.8.134
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: xemu is a free and open-source application that emulates the original Microsoft Xbox game console, enabling people to play their original Xbox games on Windows, macOS, and Linux systems.
    zh_CN: xemu 是免费、开源的应用，可模拟初代 Microsoft Xbox 游戏主机，让用户在 Windows、macOS 和 Linux 系统上游玩初代 Xbox 游戏。
  tagline:
    en_US: A free and open-source application that emulates the original Microsoft Xbox game console, enabling people to play their original Xbox games on Windows, macOS, and Linux systems.
    zh_CN: 在桌面系统上模拟初代 Xbox。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/xemu-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/xemu-logo.png
  title:
    en_US: Xemu (LinuxServer.io)
    zh_CN: Xemu（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverxemu
  port_map: '3000'
  version: 0.8.134
