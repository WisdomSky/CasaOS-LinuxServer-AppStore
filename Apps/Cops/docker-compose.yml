name: linuxserver-cops
services:
  app:
    image: linuxserver/cops:4.5.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Cops by Sébastien Lucas, now maintained by MikesPub, stands for Calibre OPDS (and HTML) Php Server. COPS links to your Calibre library database and allows downloading and emailing of books directly from a web browser and provides a OPDS feed to connect to your devices. Changes in your Calibre library are reflected immediately in your COPS pages. See : COPS''s home for more details. Don''t forget to check the Wiki. ## Why? (taken from the author''s site) In my opinion Calibre is a marvelous tool but is too big and has too much dependencies to be used for its content server. That''s the main reason why I coded this OPDS server. I needed a simple tool to be installed on a small server (Seagate Dockstar in my case). I initially thought of Calibre2OPDS but as it generate static file no search was possible. Later I added an simple HTML catalog that should be usable on my Kobo. So COPS''s main advantages are : * No need for many dependencies. * No need for a lot of CPU or RAM. * Not much code. * Search is available. * With Dropbox / owncloud it''s very easy to have an up to date OPDS server. * It was fun to code. If you want to use the OPDS feed don''t forget to specify /feed at the end of your URL.'
    ca_ES: 'Cops de Sébastien Lucas, ara mantingut per MikesPub, significa Calibre OPDS (i HTML) PHP Server. COPS enllaça a la base de dades de la vostra biblioteca de Calibre i permet descarregar i enviar llibres per correu electrònic directament des d''un navegador web i proporciona un canal OPDS per connectar-se als vostres dispositius. Els canvis a la vostra biblioteca de Calibre es reflecteixen immediatament a les vostres pàgines COPS. Vegeu: La pàgina d''inici de COPS per a més detalls. No us oblideu de consultar el Wiki. ## Per què? (extret del lloc web de l''autor) Al meu entendre, Calibre és una eina meravellosa, però és massa gran i té massa dependències per ser utilitzada per al seu servidor de contingut. Aquesta és la raó principal per la qual vaig codificar aquest servidor OPDS. Necessitava una eina senzilla per instal·lar en un servidor petit (Seagate Dockstar en el meu cas). Inicialment vaig pensar en Calibre2OPDS, però com que generava fitxers estàtics, no era possible fer cap cerca. Més tard vaig afegir un catàleg HTML senzill que es podria utilitzar al meu Kobo. Així doncs, els principals avantatges de COPS són: * No calen moltes dependències. * No calen moltes CPU o RAM. * No hi ha gaire codi. * La cerca està disponible. * Amb Dropbox / owncloud és molt fàcil tenir un servidor OPDS actualitzat. * Va ser divertit programar. Si voleu utilitzar el canal OPDS, no us oblideu d''especificar /feed al final de l''URL.'
    cs_CZ: 'Cops od Sébastiena Lucase, nyní spravovaný MikesPub, je zkratka pro Calibre OPDS (and HTML) Php Server. COPS se propojuje s databází vaší knihovny Calibre a umožňuje stahování a odesílání knih e-mailem přímo z webového prohlížeče a poskytuje OPDS kanál pro připojení k vašim zařízením. Změny ve vaší knihovně Calibre se okamžitě projeví na vašich stránkách COPS. Více informací naleznete na: Domovská stránka COPS. Nezapomeňte se podívat na Wiki. ## Proč? (převzato z autorových stránek) Podle mého názoru je Calibre skvělý nástroj, ale je příliš velký a má příliš mnoho závislostí na to, aby se dal použít pro svůj obsahový server. To je hlavní důvod, proč jsem kódoval tento OPDS server. Potřeboval jsem jednoduchý nástroj, který by se nainstaloval na malý server (v mém případě Seagate Dockstar). Původně jsem uvažoval o Calibre2OPDS, ale protože generoval statický soubor, nebylo možné žádné vyhledávání. Později jsem přidal jednoduchý HTML katalog, který by měl být použitelný na mém Kobo. Hlavní výhody COPS jsou tedy: * Není potřeba mnoho závislostí. * Není potřeba velkého množství CPU nebo RAM. * Moc kódu. * Vyhledávání je k dispozici. * S Dropboxem / owncloudem je velmi snadné mít aktuální OPDS server. * Kódování byla zábava. Pokud chcete použít OPDS feed, nezapomeňte na konec URL adresy uvést /feed.'
    da_DK: 'Cops af Sébastien Lucas, nu vedligeholdt af MikesPub, står for Calibre OPDS (og HTML) Php Server. COPS linker til din Calibre-biblioteksdatabase og tillader download og e-mailing af bøger direkte fra en webbrowser og leverer et OPDS-feed til at oprette forbindelse til dine enheder. Ændringer i dit Calibre-bibliotek afspejles straks på dine COPS-sider. Se: COPS'' hjemmeside for flere detaljer. Glem ikke at tjekke Wiki''en. ## Hvorfor? (taget fra forfatterens hjemmeside) Efter min mening er Calibre et fantastisk værktøj, men det er for stort og har for mange afhængigheder til at blive brugt til dets indholdsserver. Det er hovedårsagen til, at jeg kodede denne OPDS-server. Jeg havde brug for et simpelt værktøj, der skulle installeres på en lille server (Seagate Dockstar i mit tilfælde). Jeg tænkte oprindeligt på Calibre2OPDS, men da det genererer statiske filer, var det ikke muligt at søge. Senere tilføjede jeg et simpelt HTML-katalog, der skulle kunne bruges på min Kobo. Så COPS'' vigtigste fordele er: * Intet behov for mange afhængigheder. * Intet behov for en masse CPU eller RAM. * Ikke meget kode. * Søgning er tilgængelig. * Med Dropbox / owncloud er det meget nemt at have en opdateret OPDS-server. * Det var sjovt at kode. Hvis du vil bruge OPDS-feedet, skal du ikke glemme at angive /feed i slutningen af din URL.'
    de_DE: 'COPS von Sébastien Lucas, jetzt betreut von MikesPub, steht für Calibre OPDS (und HTML) PHP-Server. COPS verbindet sich mit Ihrer Calibre-Bibliotheksdatenbank und ermöglicht das Herunterladen und Versenden von Büchern per E-Mail direkt über einen Webbrowser. Außerdem bietet es einen OPDS-Feed zur Anbindung Ihrer Geräte. Änderungen in Ihrer Calibre-Bibliothek werden sofort auf Ihren COPS-Seiten angezeigt. Weitere Informationen finden Sie auf der COPS-Homepage. Vergessen Sie nicht, das Wiki zu besuchen. ## Warum? (von der Website des Autors) Meiner Meinung nach ist Calibre ein großartiges Tool, aber zu umfangreich und hat zu viele Abhängigkeiten, um als Content-Server verwendet zu werden. Das ist der Hauptgrund, warum ich diesen OPDS-Server entwickelt habe. Ich brauchte ein einfaches Tool für einen kleinen Server (in meinem Fall Seagate Dockstar). Zuerst dachte ich an Calibre2OPDS, aber da es statische Dateien erzeugt, war keine Suche möglich. Später fügte ich einen einfachen HTML-Katalog hinzu, der auf meinem Kobo nutzbar sein sollte. Die Hauptvorteile von COPS sind also: * Wenig Abhängigkeiten erforderlich. * Geringer Bedarf an CPU oder RAM. * Wenig Code. * Suchfunktion vorhanden. * Mit Dropbox/owncloud ist es sehr einfach, einen aktuellen OPDS-Server zu haben. * Die Programmierung hat Spaß gemacht. Wenn Sie den OPDS-Feed nutzen möchten, vergessen Sie nicht, /feed am Ende Ihrer URL anzugeben.'
    el_GR: 'Το Cops του Sébastien Lucas, που τώρα συντηρείται από την MikesPub, σημαίνει Calibre OPDS (και HTML) Php Server. Το COPS συνδέεται με τη βάση δεδομένων της βιβλιοθήκης Calibre και επιτρέπει τη λήψη και την αποστολή βιβλίων μέσω email απευθείας από ένα πρόγραμμα περιήγησης ιστού και παρέχει μια ροή OPDS για σύνδεση με τις συσκευές σας. Οι αλλαγές στη βιβλιοθήκη Calibre αντικατοπτρίζονται αμέσως στις σελίδες COPS σας. Δείτε: την αρχική σελίδα του COPS για περισσότερες λεπτομέρειες. Μην ξεχάσετε να ελέγξετε το Wiki. ## Γιατί; (από την ιστοσελίδα του συγγραφέα) Κατά τη γνώμη μου, το Calibre είναι ένα θαυμάσιο εργαλείο, αλλά είναι πολύ μεγάλο και έχει πάρα πολλές εξαρτήσεις για να χρησιμοποιηθεί για τον διακομιστή περιεχομένου του. Αυτός είναι ο κύριος λόγος για τον οποίο δημιούργησα τον κώδικα αυτού του διακομιστή OPDS. Χρειαζόμουν ένα απλό εργαλείο για εγκατάσταση σε έναν μικρό διακομιστή (Seagate Dockstar στην περίπτωσή μου). Αρχικά σκέφτηκα το Calibre2OPDS, αλλά καθώς δημιουργούσε στατικά αρχεία, δεν ήταν δυνατή η αναζήτηση. Αργότερα πρόσθεσα έναν απλό κατάλογο HTML που θα πρέπει να είναι χρησιμοποιήσιμος στο Kobo μου. Έτσι, τα κύρια πλεονεκτήματα του COPS είναι: * Δεν χρειάζονται πολλές εξαρτήσεις. * Δεν χρειάζεται πολλή CPU ή RAM. * Δεν χρειάζεται πολύς κώδικας. * Διατίθεται αναζήτηση. * Με το Dropbox / owncloud είναι πολύ εύκολο να έχετε έναν ενημερωμένο διακομιστή OPDS. * Ήταν διασκεδαστικό να γράφετε κώδικα. Αν θέλετε να χρησιμοποιήσετε την ροή OPDS, μην ξεχάσετε να ορίσετε /feed στο τέλος της διεύθυνσης URL σας.'
    en_GB: 'Cops by Sébastien Lucas, now maintained by Mikespub, stands for Calibre Opds (and Html) Php Server. Cops links to your Calibre library database and allows downloading and emailing of books directly from a web browser and provides a Opds feed to connect to your devices. Changes in your Calibre library are reflected immediately in your Cops pages. See : Cops''s home for more details. Don''t forget to check the Wiki. ## Why? (taken from the author''s site) In my opinion Calibre is a marvelous tool but is too big and has too much dependencies to be used for its content server. That''s the main reason why I coded this Opds server. I needed a simple tool to be installed on a small server (Seagate Dockstar in my case). I initially thought of Calibre2OPDS but as it generate static file no search was possible. Later I added an simple Html catalog that should be usable on my Kobo. So Cops''s main advantages are : * No need for many dependencies. * No need for a lot of Cpu or Ram. * Not much code. * Search is available. * With Dropbox / owncloud it''s very easy to have an up to date Opds server. * It was fun to code. If you want to use the Opds feed don''t forget to specify /feed at the end of your Url.'
    es_ES: 'Cops de Sébastien Lucas, ahora mantenido por MikesPub, significa Calibre OPDS (y HTML) Php Server. COPS se conecta a la base de datos de tu biblioteca Calibre y permite descargar y enviar libros por correo electrónico directamente desde un navegador web y proporciona un feed OPDS para conectarse a tus dispositivos. Los cambios en tu biblioteca Calibre se reflejan inmediatamente en tus páginas de COPS. Consulta: la página principal de COPS para obtener más detalles. No olvides consultar la Wiki. ## ¿Por qué? (tomado del sitio del autor) En mi opinión, Calibre es una herramienta maravillosa, pero es demasiado grande y tiene demasiadas dependencias para ser utilizada como servidor de contenido. Esa es la razón principal por la que programé este servidor OPDS. Necesitaba una herramienta simple para instalar en un servidor pequeño (Seagate Dockstar en mi caso). Inicialmente pensé en Calibre2OPDS, pero como genera un archivo estático, no era posible realizar búsquedas. Más tarde agregué un catálogo HTML simple que debería ser utilizable en mi Kobo. Entonces, las principales ventajas de COPS son: * No necesita muchas dependencias. * No requiere mucha CPU ni RAM. * Poco código. * Función de búsqueda disponible. * Con Dropbox/owncloud es muy fácil tener un servidor OPDS actualizado. * Fue divertido programarlo. Si quieres usar la fuente OPDS, no olvides especificar /feed al final de tu URL.'
    fr_FR: 'COPS, créé par Sébastien Lucas et désormais maintenu par MikesPub, est l''acronyme de Calibre OPDS (et serveur PHP HTML). COPS se connecte à votre base de données de bibliothèque Calibre et permet de télécharger et d''envoyer des livres par e-mail directement depuis un navigateur web. Il fournit également un flux OPDS pour la connexion à vos appareils. Les modifications apportées à votre bibliothèque Calibre sont immédiatement visibles sur vos pages COPS. Pour plus de détails, consultez la page d''accueil de COPS. N''oubliez pas de consulter le Wiki. ## Pourquoi ? (extrait du site de l''auteur) À mon avis, Calibre est un outil formidable, mais trop volumineux et avec trop de dépendances pour être utilisé comme serveur de contenu. C''est la principale raison pour laquelle j''ai développé ce serveur OPDS. J''avais besoin d''un outil simple à installer sur un petit serveur (un Seagate Dockstar dans mon cas). J''avais d''abord pensé à Calibre2OPDS, mais comme il génère des fichiers statiques, la recherche était impossible. J''ai ensuite ajouté un simple catalogue HTML compatible avec ma liseuse Kobo. Les principaux avantages de COPS sont donc : * Peu de dépendances. * Peu de ressources CPU ou RAM requises. * Code minimal. * Fonction de recherche disponible. * Avec Dropbox/ownCloud, il est très facile de disposer d''un serveur OPDS à jour. * Le développement était agréable. Pour utiliser le flux OPDS, n''oubliez pas d''ajouter `/feed` à la fin de votre URL.'
    ga_IE: 'Seasann Cops le Sébastien Lucas, atá á chothabháil anois ag MikesPub, do Calibre OPDS (agus HTML) Php Server. Nascann COPS le do bhunachar sonraí leabharlainne Calibre agus tugann sé deis duit leabhair a íoslódáil agus a sheoladh trí ríomhphost go díreach ó bhrabhsálaí gréasáin agus soláthraíonn sé beatha OPDS chun ceangal le do ghléasanna. Léirítear athruithe i do leabharlann Calibre láithreach i do leathanaigh COPS. Féach: baile COPS le haghaidh tuilleadh sonraí. Ná déan dearmad an Vicí a sheiceáil. ## Cén fáth? (tógtha ó shuíomh an údair) Is uirlis iontach é Calibre i mo thuairimse ach tá sé ró-mhór agus tá an iomarca spleáchais ann le húsáid dá fhreastalaí ábhair. Sin an phríomhchúis gur chódaigh mé an freastalaí OPDS seo. Bhí uirlis shimplí ag teastáil uaim le suiteáil ar fhreastalaí beag (Seagate Dockstar i mo chás). Smaoinigh mé ar Calibre2OPDS ar dtús ach toisc go ngineann sé comhad statach ní raibh aon chuardach indéanta. Níos déanaí chuir mé catalóg HTML simplí leis ba chóir a bheith inúsáidte ar mo Kobo. Mar sin is iad príomhbhuntáistí COPS: * Níl gá le go leor spleáchais. * Níl gá le go leor LAP ná RAM. * Níl mórán cóid ann. * Tá cuardach ar fáil. * Le Dropbox / owncloud tá sé an-éasca freastalaí OPDS cothrom le dáta a bheith agat. * Bhí sé spraíúil an cód a scríobh. Más mian leat an fotha OPDS a úsáid ná déan dearmad /feed a shonrú ag deireadh do URL.'
    hr_HR: 'Cops autora Sébastiena Lucasa, kojeg sada održava MikesPub, kratica je za Calibre OPDS (and HTML) Php Server. COPS se povezuje s vašom Calibre bazom podataka knjižnice i omogućuje preuzimanje i slanje knjiga e-poštom izravno iz web preglednika te pruža OPDS feed za povezivanje s vašim uređajima. Promjene u vašoj Calibre knjižnici odmah se odražavaju na vašim COPS stranicama. Pogledajte: COPS-ova početna stranica za više detalja. Ne zaboravite provjeriti Wiki. ## Zašto? (preuzeto s autorove stranice) Po mom mišljenju, Calibre je izvrstan alat, ali je prevelik i ima previše ovisnosti da bi se koristio za svoj poslužitelj sadržaja. To je glavni razlog zašto sam kodirao ovaj OPDS poslužitelj. Trebao mi je jednostavan alat za instalaciju na malom poslužitelju (u mom slučaju Seagate Dockstar). U početku sam razmišljao o Calibre2OPDS, ali budući da generira statičku datoteku, pretraživanje nije bilo moguće. Kasnije sam dodao jednostavan HTML katalog koji bi trebao biti upotrebljiv na mom Kobo-u. Dakle, glavne prednosti COPS-a su: * Nema potrebe za mnogo ovisnosti. * Nema potrebe za puno CPU-a ili RAM-a. * Nema puno koda. * Dostupno je pretraživanje. * S Dropboxom / owncloudom vrlo je jednostavno imati ažurirani OPDS poslužitelj. * Bilo je zabavno kodirati. Ako želite koristiti OPDS feed, ne zaboravite navesti /feed na kraju URL-a.'
    hu_HU: 'A Sébastien Lucas által készített Cops, melyet most a MikesPub tart karban, a Calibre OPDS (és HTML) Php Server rövidítése. A COPS a Calibre könyvtáradatbázisodhoz kapcsolódik, és lehetővé teszi a könyvek letöltését és e-mailben küldését közvetlenül egy webböngészőből, valamint OPDS-hírcsatornát biztosít az eszközeidhez való csatlakozáshoz. A Calibre könyvtáradban bekövetkezett változások azonnal megjelennek a COPS oldalain. További részletekért lásd: COPS honlapja. Ne felejtsd el megnézni a Wikit. ## Miért? (a szerző oldaláról idézve) Véleményem szerint a Calibre egy csodálatos eszköz, de túl nagy és túl sok függősége van ahhoz, hogy a tartalomkiszolgálóján használhassuk. Ez a fő oka annak, hogy miért kódoltam ezt az OPDS-kiszolgálót. Szükségem volt egy egyszerű eszközre, amelyet egy kis szerverre lehet telepíteni (az én esetemben a Seagate Dockstar). Eredetileg a Calibre2OPDS-re gondoltam, de mivel statikus fájlokat generál, nem volt lehetséges a keresés. Később hozzáadtam egy egyszerű HTML-katalógust, amelynek használhatónak kell lennie a Kobo-mon. Tehát a COPS fő előnyei: * Nincs szükség sok függőségre. * Nincs szükség sok CPU-ra vagy RAM-ra. * Nincs sok kód. * Van keresés. * A Dropbox / owncloud segítségével nagyon könnyű naprakész OPDS szervert üzemeltetni. * Élvezetes volt kódolni. Ha használni szeretnéd az OPDS hírcsatornát, ne felejtsd el megadni a /feed kapcsolót az URL végén.'
    it_IT: 'COPS di Sébastien Lucas, ora gestito da MikesPub, è l''acronimo di Calibre OPDS (e HTML) Php Server. COPS si collega al database della tua libreria Calibre e consente di scaricare e inviare via email libri direttamente da un browser web, oltre a fornire un feed OPDS per connettersi ai tuoi dispositivi. Le modifiche apportate alla tua libreria Calibre si riflettono immediatamente nelle tue pagine COPS. Vedi: la home di COPS per maggiori dettagli. Non dimenticare di consultare la Wiki. ## Perché? (tratto dal sito dell''autore) A mio parere Calibre è uno strumento meraviglioso, ma è troppo grande e ha troppe dipendenze per essere utilizzato come server di contenuti. Questo è il motivo principale per cui ho programmato questo server OPDS. Avevo bisogno di uno strumento semplice da installare su un piccolo server (Seagate Dockstar nel mio caso). Inizialmente avevo pensato a Calibre2OPDS, ma poiché genera un file statico non era possibile effettuare ricerche. In seguito ho aggiunto un semplice catalogo HTML che dovrebbe essere utilizzabile sul mio Kobo. Quindi i principali vantaggi di COPS sono: * Non necessita di molte dipendenze. * Non richiede molta CPU o RAM. * Poco codice. * La funzione di ricerca è disponibile. * Con Dropbox/OwnCloud è molto facile avere un server OPDS aggiornato. * È stato divertente programmarlo. Se vuoi usare il feed OPDS, non dimenticare di specificare /feed alla fine del tuo URL.'
    ja_JP: Sébastien Lucas による Cops は、現在 MikesPub によって管理されており、Calibre OPDS (and HTML) Php Server の略です。COPS は、Calibre ライブラリ データベースにリンクし、Web ブラウザから直接書籍をダウンロードおよびメール送信できるようにし、デバイスに接続するための OPDS フィードを提供します。Calibre ライブラリの変更は、COPS ページに即座に反映されます。詳細については、COPS のホームページを参照してください。Wiki も忘れずに確認してください。## なぜ? (著者のサイトから引用) 私の意見では、Calibre は素晴らしいツールですが、コンテンツ サーバーとして使用するには大きすぎ、依存関係が多すぎます。これが、私がこの OPDS サーバーをコーディングした主な理由です。私は、小さなサーバー (私の場合は Seagate Dockstar) にインストールできるシンプルなツールが必要でした。最初は Calibre2OPDS を考えましたが、静的ファイルを生成するため検索はできませんでした。その後、Kobo で使用できるシンプルな HTML カタログを追加しました。 COPSの主な利点は次のとおりです。* 多くの依存関係が不要。* 多くのCPUやRAMが不要。* コード量が少ない。* 検索機能が利用可能。* Dropbox/ownCloudを使用すると、最新のOPDSサーバーを簡単に維持できます。* コーディングが楽しかった。OPDSフィードを使用する場合は、URLの末尾に/feedを指定することを忘れないでください。
    ko_KR: 'Sébastien Lucas가 개발하고 현재 MikesPub에서 관리하는 COPS는 Calibre OPDS(및 HTML) PHP 서버의 약자입니다. COPS는 Calibre 라이브러리 데이터베이스와 연동하여 웹 브라우저에서 직접 책을 다운로드하고 이메일로 전송할 수 있도록 하며, 기기에 연결할 수 있는 OPDS 피드를 제공합니다. Calibre 라이브러리의 변경 사항은 COPS 페이지에 즉시 반영됩니다. 자세한 내용은 COPS 홈페이지를 참조하세요. 위키도 확인해 보세요. ## 왜 만들었을까? (개발자 사이트에서 발췌) 제 생각에 Calibre는 훌륭한 도구이지만 콘텐츠 서버로 사용하기에는 너무 크고 의존성이 너무 높습니다. 이것이 제가 이 OPDS 서버를 개발하게 된 주된 이유입니다. 저는 작은 서버(제 경우에는 Seagate Dockstar)에 설치할 수 있는 간단한 도구가 필요했습니다. 처음에는 Calibre2OPDS를 생각했지만 정적 파일을 생성하기 때문에 검색이 불가능했습니다. 나중에는 Kobo에서 사용할 수 있는 간단한 HTML 카탈로그를 추가했습니다. 따라서 COPS의 주요 장점은 다음과 같습니다. * 많은 의존성이 필요하지 않습니다. * CPU나 RAM 용량이 많이 필요하지 않습니다. * 코드도 많지 않습니다. * 검색 기능이 있습니다. * Dropbox/OwnCloud를 사용하면 OPDS 서버를 최신 상태로 유지하기가 매우 쉽습니다. * 코딩하는 과정이 재미있었습니다. OPDS 피드를 사용하려면 URL 끝에 /feed를 추가하는 것을 잊지 마세요.'
    ml_IN: 'സെബാസ്റ്റ്യൻ ലൂക്കാസിന്റെ Cops, ഇപ്പോൾ MikesPub പരിപാലിക്കുന്നു, കാലിബർ OPDS (and HTML) Php സെർവറിനെ സൂചിപ്പിക്കുന്നു. COPS നിങ്ങളുടെ കാലിബർ ലൈബ്രറി ഡാറ്റാബേസിലേക്ക് ലിങ്ക് ചെയ്യുകയും ഒരു വെബ് ബ്രൗസറിൽ നിന്ന് നേരിട്ട് പുസ്തകങ്ങൾ ഡൗൺലോഡ് ചെയ്യാനും ഇമെയിൽ ചെയ്യാനും അനുവദിക്കുകയും നിങ്ങളുടെ ഉപകരണങ്ങളിലേക്ക് കണക്റ്റുചെയ്യുന്നതിന് ഒരു OPDS ഫീഡ് നൽകുകയും ചെയ്യുന്നു. നിങ്ങളുടെ കാലിബർ ലൈബ്രറിയിലെ മാറ്റങ്ങൾ നിങ്ങളുടെ COPS പേജുകളിൽ ഉടനടി പ്രതിഫലിക്കും. കാണുക: കൂടുതൽ വിശദാംശങ്ങൾക്ക് COPS-ന്റെ ഹോം. വിക്കി പരിശോധിക്കാൻ മറക്കരുത്. ## എന്തുകൊണ്ട്? (രചയിതാവിന്റെ സൈറ്റിൽ നിന്ന് എടുത്തത്) എന്റെ അഭിപ്രായത്തിൽ കാലിബർ ഒരു അത്ഭുതകരമായ ഉപകരണമാണ്, പക്ഷേ അത് വളരെ വലുതാണ്, അതിന്റെ ഉള്ളടക്ക സെർവറിന് ഉപയോഗിക്കാൻ വളരെയധികം ഡിപൻഡൻസികളുണ്ട്. അതുകൊണ്ടാണ് ഞാൻ ഈ OPDS സെർവർ കോഡ് ചെയ്തതിന്റെ പ്രധാന കാരണം. ഒരു ചെറിയ സെർവറിൽ ഇൻസ്റ്റാൾ ചെയ്യാൻ എനിക്ക് ഒരു ലളിതമായ ഉപകരണം ആവശ്യമായിരുന്നു (എന്റെ കാര്യത്തിൽ സീഗേറ്റ് ഡോക്ക്സ്റ്റാർ). ഞാൻ ആദ്യം Calibre2OPDS നെക്കുറിച്ചാണ് ചിന്തിച്ചത്, പക്ഷേ അത് സ്റ്റാറ്റിക് ഫയൽ സൃഷ്ടിക്കുന്നതിനാൽ തിരയൽ സാധ്യമായിരുന്നില്ല. പിന്നീട് എന്റെ Kobo-യിൽ ഉപയോഗിക്കാൻ കഴിയുന്ന ഒരു ലളിതമായ HTML കാറ്റലോഗ് ഞാൻ ചേർത്തു. അതിനാൽ COPS-ന്റെ പ്രധാന ഗുണങ്ങൾ ഇവയാണ്: * നിരവധി ഡിപൻഡൻസികൾ ആവശ്യമില്ല. * അധികം സിപിയു അല്ലെങ്കിൽ റാമിന്റെ ആവശ്യമില്ല. * അധികം കോഡ് ഇല്ല. * തിരയൽ ലഭ്യമാണ്. * ഡ്രോപ്പ്ബോക്സ് / സ്വന്തം ക്ലൗഡിൽ കാലികമായ ഒരു OPDS സെർവർ ഉണ്ടായിരിക്കുന്നത് വളരെ എളുപ്പമാണ്. * കോഡ് ചെയ്യുന്നത് രസകരമായിരുന്നു. OPDS ഫീഡ് ഉപയോഗിക്കണമെങ്കിൽ നിങ്ങളുടെ URL-ന്റെ അവസാനം /feed എന്ന് വ്യക്തമാക്കാൻ മറക്കരുത്.'
    nb_NO: 'Cops av Sébastien Lucas, nå vedlikeholdt av MikesPub, står for Calibre OPDS (og HTML) Php Server. COPS lenker til Calibre-bibliotekdatabasen din og tillater nedlasting og e-posting av bøker direkte fra en nettleser, og gir en OPDS-feed for å koble til enhetene dine. Endringer i Calibre-biblioteket ditt gjenspeiles umiddelbart på COPS-sidene dine. Se: COPS sin hjemmeside for mer informasjon. Ikke glem å sjekke wikien. ## Hvorfor? (hentet fra forfatterens nettsted) Etter min mening er Calibre et fantastisk verktøy, men det er for stort og har for mange avhengigheter til å kunne brukes for innholdsserveren. Det er hovedgrunnen til at jeg kodet denne OPDS-serveren. Jeg trengte et enkelt verktøy som skulle installeres på en liten server (Seagate Dockstar i mitt tilfelle). Jeg tenkte først på Calibre2OPDS, men siden det genererer statiske filer, var det ikke mulig å søke. Senere la jeg til en enkel HTML-katalog som skulle kunne brukes på Kobo-en min. Så COPS sine viktigste fordeler er: * Ikke behov for mange avhengigheter. * Ikke behov for mye CPU eller RAM. * Ikke mye kode. * Søk er tilgjengelig. * Med Dropbox / owncloud er det veldig enkelt å ha en oppdatert OPDS-server. * Det var gøy å kode. Hvis du vil bruke OPDS-feeden, ikke glem å spesifisere /feed på slutten av URL-en din.'
    nl_NL: 'COPS van Sébastien Lucas, nu onderhouden door MikesPub, staat voor Calibre OPDS (en HTML) PHP-server. COPS koppelt aan uw Calibre-bibliotheekdatabase en maakt het mogelijk om boeken rechtstreeks vanuit een webbrowser te downloaden en te e-mailen. Het biedt ook een OPDS-feed om verbinding te maken met uw apparaten. Wijzigingen in uw Calibre-bibliotheek worden direct weergegeven op uw COPS-pagina''s. Zie de COPS-homepage voor meer informatie. Vergeet niet de wiki te raadplegen. ## Waarom? (overgenomen van de website van de auteur) Naar mijn mening is Calibre een fantastische tool, maar te groot en heeft te veel afhankelijkheden om als contentserver te gebruiken. Dat is de belangrijkste reden waarom ik deze OPDS-server heb gecodeerd. Ik had een eenvoudige tool nodig die op een kleine server (in mijn geval een Seagate Dockstar) geïnstalleerd kon worden. Ik dacht aanvankelijk aan Calibre2OPDS, maar omdat dit statische bestanden genereert, was zoeken niet mogelijk. Later heb ik een eenvoudige HTML-catalogus toegevoegd die bruikbaar zou moeten zijn op mijn Kobo. De belangrijkste voordelen van COPS zijn dus: * Geen behoefte aan veel afhankelijkheden. * Vereist weinig CPU of RAM. * Weinig code. * Zoeken is mogelijk. * Met Dropbox/Owncloud is het heel eenvoudig om een actuele OPDS-server te hebben. * Het was leuk om te programmeren. Als je de OPDS-feed wilt gebruiken, vergeet dan niet om /feed aan het einde van je URL toe te voegen.'
    pl_PL: 'Cops autorstwa Sébastiena Lucasa, obecnie utrzymywany przez MikesPub, to skrót od Calibre OPDS (i HTML) Php Server. COPS łączy się z bazą danych biblioteki Calibre i umożliwia pobieranie i wysyłanie książek e-mailem bezpośrednio z przeglądarki internetowej oraz zapewnia kanał OPDS do łączenia się z urządzeniami. Zmiany w bibliotece Calibre są natychmiast widoczne na stronach COPS. Zobacz: stronę główną COPS, aby uzyskać więcej informacji. Nie zapomnij sprawdzić Wiki. ## Dlaczego? (z witryny autora) Moim zdaniem Calibre to wspaniałe narzędzie, ale jest za duże i ma zbyt wiele zależności, aby można było go używać na serwerze treści. To główny powód, dla którego zakodowałem ten serwer OPDS. Potrzebowałem prostego narzędzia do zainstalowania na małym serwerze (w moim przypadku Seagate Dockstar). Początkowo pomyślałem o Calibre2OPDS, ale ponieważ generuje on statyczny plik, wyszukiwanie nie było możliwe. Później dodałem prosty katalog HTML, który powinien nadawać się do użytku na moim Kobo. Główne zalety COPS to: * Brak konieczności stosowania wielu zależności. * Brak konieczności stosowania dużej mocy obliczeniowej procesora i pamięci RAM. * Niewielka ilość kodu. * Dostępność wyszukiwania. * Dzięki Dropboxowi/OwnCloud łatwo jest mieć aktualny serwer OPDS. * Kodowanie było przyjemnością. Jeśli chcesz korzystać z kanału OPDS, nie zapomnij dodać /feed na końcu adresu URL.'
    pt_BR: 'O COPS, criado por Sébastien Lucas e agora mantido pela MikesPub, significa Calibre OPDS (e HTML) PHP Server. O COPS se conecta ao banco de dados da sua biblioteca Calibre e permite o download e envio de livros por e-mail diretamente de um navegador web, além de fornecer um feed OPDS para conexão com seus dispositivos. As alterações na sua biblioteca Calibre são refletidas imediatamente nas suas páginas do COPS. Veja a página inicial do COPS para mais detalhes. Não se esqueça de consultar o Wiki. ## Por quê? (retirado do site do autor) Na minha opinião, o Calibre é uma ferramenta maravilhosa, mas é muito grande e tem muitas dependências para ser usado como servidor de conteúdo. Essa é a principal razão pela qual desenvolvi este servidor OPDS. Eu precisava de uma ferramenta simples para ser instalada em um servidor pequeno (Seagate Dockstar, no meu caso). Inicialmente, pensei no Calibre2OPDS, mas como ele gera arquivos estáticos, não era possível realizar buscas. Posteriormente, adicionei um catálogo HTML simples que pudesse ser usado no meu Kobo. Portanto, as principais vantagens do COPS são: * Não requer muitas dependências. * Não requer muita CPU ou RAM. * Pouco código. * Busca disponível. * Com Dropbox/OwnCloud, é muito fácil ter um servidor OPDS atualizado. * Foi divertido programar. Se você quiser usar o feed OPDS, não se esqueça de especificar /feed no final da sua URL.'
    ro_RO: '„Cops de Sébastien Lucas, acum întreținut de MikesPub, înseamnă Calibre OPDS (și HTML) PHP Server.” COPS se conectează la baza de date a bibliotecii Calibre și permite descărcarea și trimiterea prin e-mail a cărților direct dintr-un browser web și oferă un flux OPDS pentru conectarea la dispozitivele dvs. Modificările din biblioteca dvs. Calibre se reflectă imediat în paginile COPS. Vedeți: pagina principală a COPS pentru mai multe detalii. Nu uitați să verificați Wiki. ## De ce? (preluat de pe site-ul autorului) În opinia mea, Calibre este un instrument minunat, dar este prea mare și are prea multe dependențe pentru a fi utilizat pentru serverul său de conținut. Acesta este principalul motiv pentru care am codat acest server OPDS. Aveam nevoie de un instrument simplu care să fie instalat pe un server mic (Seagate Dockstar în cazul meu). Inițial m-am gândit la Calibre2OPDS, dar deoarece genera fișiere statice, nu era posibilă căutarea. Mai târziu, am adăugat un catalog HTML simplu care ar trebui să poată fi utilizat pe Kobo-ul meu. Deci, principalele avantaje ale COPS sunt: * Nu este nevoie de multe dependențe. * Nu este nevoie de mult CPU sau RAM. * Nu prea mult cod. * Căutarea este disponibilă. * Cu Dropbox / owncloud este foarte ușor să ai un server OPDS actualizat. * A fost distractiv să programez. Dacă vrei să folosești fluxul OPDS, nu uita să specifici /feed la sfârșitul adresei URL.'
    ru_RU: 'COPS, разработанный Себастьяном Лукасом и теперь поддерживаемый MikesPub, расшифровывается как Calibre OPDS (and HTML) Php Server (Сервер Calibre OPDS (and HTML)). COPS подключается к базе данных вашей библиотеки Calibre и позволяет загружать и отправлять книги по электронной почте непосредственно из веб-браузера, а также предоставляет OPDS-канал для подключения к вашим устройствам. Изменения в вашей библиотеке Calibre немедленно отображаются на страницах COPS. Подробнее см.: домашняя страница COPS. Не забудьте проверить Wiki. ## Почему? (взято с сайта автора) На мой взгляд, Calibre — замечательный инструмент, но он слишком большой и имеет слишком много зависимостей для использования в качестве сервера контента. Это главная причина, по которой я написал этот OPDS-сервер. Мне нужен был простой инструмент для установки на небольшой сервер (в моем случае Seagate Dockstar). Изначально я думал о Calibre2OPDS, но поскольку он генерирует статические файлы, поиск был невозможен. Позже я добавил простой HTML-каталог, который должен быть пригоден для использования на моем Kobo. Итак, главные преимущества COPS: * Отсутствие необходимости во множестве зависимостей. * Не требует больших ресурсов процессора или оперативной памяти. * Небольшой объем кода. * Доступен поиск. * С Dropbox/OwnCloud очень легко поддерживать актуальность OPDS-сервера. * Было интересно программировать. Если вы хотите использовать OPDS-ленту, не забудьте указать /feed в конце вашего URL-адреса.'
    sk_SK: 'Cops od Sébastiena Lucasa, teraz spravovaný MikesPub, je skratka pre Calibre OPDS (and HTML) Php Server. COPS sa pripája k vašej databáze knižnice Calibre a umožňuje sťahovanie a odosielanie kníh e-mailom priamo z webového prehliadača a poskytuje OPDS kanál na pripojenie k vašim zariadeniam. Zmeny vo vašej knižnici Calibre sa okamžite prejavia na vašich stránkach COPS. Viac informácií nájdete na: Domovská stránka COPS. Nezabudnite si pozrieť Wiki. ## Prečo? (prevzaté zo stránky autora) Podľa môjho názoru je Calibre skvelý nástroj, ale je príliš veľký a má príliš veľa závislostí na to, aby sa dal použiť pre svoj obsahový server. To je hlavný dôvod, prečo som naprogramoval tento OPDS server. Potreboval som jednoduchý nástroj na inštaláciu na malý server (v mojom prípade Seagate Dockstar). Spočiatku som uvažoval o Calibre2OPDS, ale keďže generoval statický súbor, nebolo možné vyhľadávanie. Neskôr som pridal jednoduchý HTML katalóg, ktorý by mal byť použiteľný na mojom Kobo. Hlavné výhody COPS sú teda: * Nie je potrebné veľa závislostí. * Nie je potrebné veľa CPU alebo RAM. * Nie veľa kódu. * Vyhľadávanie je k dispozícii. * S Dropboxom / owncloudom je veľmi jednoduché mať aktuálny OPDS server. * Kódovanie bolo zábavné. Ak chcete použiť OPDS feed, nezabudnite na koniec URL adresy uviesť /feed.'
    sv_SE: 'Cops av Sébastien Lucas, numera underhållet av MikesPub, står för Calibre OPDS (och HTML) Php Server. COPS länkar till din Calibre-biblioteksdatabas och tillåter nedladdning och e-post av böcker direkt från en webbläsare och tillhandahåller ett OPDS-flöde för att ansluta till dina enheter. Ändringar i ditt Calibre-bibliotek återspeglas omedelbart på dina COPS-sidor. Se: COPS hemsida för mer information. Glöm inte att kolla wikin. ## Varför? (hämtat från författarens webbplats) Enligt min mening är Calibre ett fantastiskt verktyg men det är för stort och har för många beroenden för att kunna användas för sin innehållsserver. Det är den främsta anledningen till att jag kodade denna OPDS-server. Jag behövde ett enkelt verktyg som skulle installeras på en liten server (Seagate Dockstar i mitt fall). Jag tänkte först på Calibre2OPDS men eftersom det genererar statiska filer var ingen sökning möjlig. Senare lade jag till en enkel HTML-katalog som borde kunna användas på min Kobo. Så COPS främsta fördelar är: * Inget behov av många beroenden. * Inget behov av mycket CPU eller RAM. * Inte mycket kod. * Sökning är tillgänglig. * Med Dropbox / owncloud är det väldigt enkelt att ha en uppdaterad OPDS-server. * Det var kul att koda. Om du vill använda OPDS-flödet, glöm inte att ange /feed i slutet av din URL.'
    tr_TR: 'Sébastien Lucas tarafından geliştirilen ve şu anda MikesPub tarafından sürdürülen COPS, Calibre OPDS (ve HTML) Php Sunucusu anlamına gelir. COPS, Calibre kütüphane veritabanınıza bağlanır ve kitapları doğrudan bir web tarayıcısından indirmenize ve e-posta ile göndermenize olanak tanır ve cihazlarınıza bağlanmak için bir OPDS akışı sağlar. Calibre kütüphanenizdeki değişiklikler COPS sayfalarınıza anında yansır. Daha fazla ayrıntı için COPS''un ana sayfasına bakın. Wiki''yi kontrol etmeyi unutmayın. ## Neden? (yazarın sitesinden alınmıştır) Bence Calibre harika bir araç, ancak içerik sunucusu olarak kullanılmak için çok büyük ve çok fazla bağımlılığı var. Bu, bu OPDS sunucusunu kodlamamın ana nedenidir. Küçük bir sunucuya (benim durumumda Seagate Dockstar) kurulacak basit bir araca ihtiyacım vardı. Başlangıçta Calibre2OPDS''yi düşündüm, ancak statik dosya ürettiği için arama mümkün değildi. Daha sonra Kobo''mda kullanılabilir olması gereken basit bir HTML kataloğu ekledim. Bu nedenle COPS''un ana avantajları şunlardır: * Birçok bağımlılığa gerek yok. * Çok fazla CPU veya RAM''e ihtiyaç duymaz. * Çok az kod gerektirir. * Arama özelliği mevcuttur. * Dropbox / Owncloud ile güncel bir OPDS sunucusuna sahip olmak çok kolaydır. * Kodlaması eğlenceliydi. OPDS akışını kullanmak istiyorsanız, URL''nizin sonuna /feed eklemeyi unutmayın.'
    zh_CN: COPS 全称为 Calibre OPDS（和 HTML）PHP Server，由 Sébastien Lucas 创建，现由 MikesPub 维护。它连接 Calibre 书库数据库，支持直接通过浏览器下载和邮件发送书籍，并提供可连接阅读设备的 OPDS 订阅源。Calibre 书库的变化会立即反映到 COPS 页面中。更多信息请参阅项目主页和 Wiki。作者认为 Calibre 虽然出色，但作为内容服务器体积过大、依赖过多，因此开发了可在 Seagate Dockstar 等小型服务器上运行的工具。最初考虑的 Calibre2OPDS 只生成静态文件，无法搜索；后来又加入可在 Kobo 上使用的简单 HTML 目录。COPS 的优势包括依赖少、CPU 和内存占用低、代码量小、支持搜索，以及容易借助 Dropbox 或 ownCloud 保持 OPDS 服务器更新；开发过程本身也很有趣。使用 OPDS 订阅源时，请在 URL 末尾加上 /feed。
    zh_TW: COPS 全稱為 Calibre OPDS（和 HTML）PHP Server，由 Sébastien Lucas 建立，現由 MikesPub 維護。它連線 Calibre 書庫資料庫，支援直接透過瀏覽器下載和郵件傳送書籍，並提供可連線閱讀裝置的 OPDS 訂閱源。Calibre 書庫的變化會立即反映到 COPS 頁面中。更多資訊請參閱專案主頁和 Wiki。作者認為 Calibre 雖然出色，但作為內容伺服器體積過大、依賴過多，因此開發了可在 Seagate Dockstar 等小型伺服器上執行的工具。最初考慮的 Calibre2OPDS 只生成靜態檔案，無法搜尋；後來又加入可在 Kobo 上使用的簡單 HTML 目錄。COPS 的優勢包括依賴少、CPU 和記憶體佔用低、程式碼量小、支援搜尋，以及容易藉助 Dropbox 或 ownCloud 保持 OPDS 伺服器更新；開發過程本身也很有趣。使用 OPDS 訂閱源時，請在 URL 末尾加上 /feed。
  tagline:
    en_US: 'By Sébastien Lucas, now maintained by MikesPub, stands for Calibre OPDS (and HTML) Php Server. COPS links to your Calibre library database and allows downloading and emailing of books directly from a web browser and provides a OPDS feed to connect to your devices. Changes in your Calibre library are reflected immediately in your COPS pages. See : COPS''s home for more details. Don''t forget to check the Wiki. ## Why. (taken from the author''s site) In my opinion Calibre is a marvelous tool but is too big and has too much dependencies to be used for its content server. That''s the main reason why I coded this OPDS server. I needed a simple tool to be installed on a small server (Seagate Dockstar in my case). I initially thought of Calibre2OPDS but as it generate static file no search was possible. Later I added an simple HTML catalog that should be usable on my Kobo. So COPS''s main advantages are : * No need for many dependencies. * No need for a lot of CPU or RAM. * Not much code. * Search is available. * With Dropbox / owncloud it''s very easy to have an up to date OPDS server. * It was fun to code. If you want to use the OPDS feed don''t forget to specify /feed at the end of your URL.'
    ca_ES: 'De Sébastien Lucas, ara mantingut per MikesPub, significa Calibre OPDS (i HTML) PHP Server. COPS enllaça a la base de dades de la vostra biblioteca de Calibre i permet descarregar i enviar llibres per correu electrònic directament des d''un navegador web i proporciona un canal OPDS per connectar-se als vostres dispositius. Els canvis a la vostra biblioteca de Calibre es reflecteixen immediatament a les vostres pàgines de COPS. Vegeu: La pàgina principal de COPS per a més detalls. No us oblideu de consultar el Wiki. ## Per què. (extret del lloc web de l''autor) Al meu entendre, Calibre és una eina meravellosa però és massa gran i té massa dependències per ser utilitzada per al seu servidor de contingut. Aquesta és la raó principal per la qual vaig codificar aquest servidor OPDS. Necessitava una eina senzilla per instal·lar en un servidor petit (Seagate Dockstar en el meu cas). Inicialment vaig pensar en Calibre2OPDS però com que generava fitxers estàtics no era possible la cerca. Més tard vaig afegir un catàleg HTML senzill que es podria utilitzar al meu Kobo. Així doncs, els principals avantatges de COPS són: * No calen moltes dependències. * No calen moltes CPU o RAM. * No hi ha gaire codi. * La cerca està disponible. * Amb Dropbox / owncloud és molt fàcil tenir un servidor OPDS actualitzat. * Va ser divertit programar. Si voleu utilitzar el canal OPDS, no us oblideu d''especificar /feed al final de l''URL.'
    cs_CZ: 'Od Sébastiena Lucase, nyní spravovaný MikesPub, je zkratka pro Calibre OPDS (and HTML) Php Server. COPS se propojuje s databází vaší knihovny Calibre a umožňuje stahování a odesílání knih e-mailem přímo z webového prohlížeče a poskytuje OPDS kanál pro připojení k vašim zařízením. Změny ve vaší knihovně Calibre se okamžitě projeví na vašich stránkách COPS. Více informací naleznete na: Domovská stránka COPS. Nezapomeňte se podívat na Wiki. ## Proč. (převzato z autorových stránek) Podle mého názoru je Calibre skvělý nástroj, ale je příliš velký a má příliš mnoho závislostí na to, aby se dal použít pro svůj obsahový server. To je hlavní důvod, proč jsem kódoval tento OPDS server. Potřeboval jsem jednoduchý nástroj, který by se nainstaloval na malý server (v mém případě Seagate Dockstar). Původně jsem uvažoval o Calibre2OPDS, ale protože generoval statický soubor, nebylo možné žádné vyhledávání. Později jsem přidal jednoduchý HTML katalog, který by měl být použitelný na mém Kobo. Hlavní výhody COPS jsou tedy: * Není potřeba mnoho závislostí. * Není potřeba mnoho CPU nebo RAM. * Málo kódu. * Vyhledávání je k dispozici. * S Dropboxem / owncloudem je velmi snadné mít aktuální OPDS server. * Kódování byla zábava. Pokud chcete použít OPDS feed, nezapomeňte na konec URL adresy uvést /feed.'
    da_DK: 'Af Sébastien Lucas, nu vedligeholdt af MikesPub, står for Calibre OPDS (og HTML) Php Server. COPS linker til din Calibre-biblioteksdatabase og tillader download og e-mailing af bøger direkte fra en webbrowser og leverer et OPDS-feed til at oprette forbindelse til dine enheder. Ændringer i dit Calibre-bibliotek afspejles straks på dine COPS-sider. Se: COPS'' hjemmeside for flere detaljer. Glem ikke at tjekke Wiki''en. ## Hvorfor. (taget fra forfatterens websted) Efter min mening er Calibre et fantastisk værktøj, men det er for stort og har for mange afhængigheder til at blive brugt til dets indholdsserver. Det er hovedårsagen til, at jeg kodede denne OPDS-server. Jeg havde brug for et simpelt værktøj, der skulle installeres på en lille server (Seagate Dockstar i mit tilfælde). Jeg tænkte oprindeligt på Calibre2OPDS, men da det genererer statiske filer, var det ikke muligt at søge. Senere tilføjede jeg et simpelt HTML-katalog, der skulle kunne bruges på min Kobo. Så COPS'' vigtigste fordele er: * Intet behov for mange afhængigheder. * Intet behov for en masse CPU eller RAM. * Ikke meget kode. * Søgning er tilgængelig. * Med Dropbox / owncloud er det meget nemt at have en opdateret OPDS-server. * Det var sjovt at kode. Hvis du vil bruge OPDS-feedet, skal du ikke glemme at angive /feed i slutningen af din URL.'
    de_DE: 'COPS, entwickelt von Sébastien Lucas und jetzt von MikesPub betreut, steht für Calibre OPDS (und HTML) PHP-Server. COPS verbindet sich mit Ihrer Calibre-Bibliotheksdatenbank und ermöglicht das Herunterladen und Versenden von Büchern per E-Mail direkt über einen Webbrowser. Außerdem stellt es einen OPDS-Feed zur Verbindung mit Ihren Geräten bereit. Änderungen in Ihrer Calibre-Bibliothek werden sofort auf Ihren COPS-Seiten angezeigt. Weitere Informationen finden Sie auf der COPS-Homepage. Vergessen Sie nicht, das Wiki zu besuchen. ## Warum? (Auszug von der Website des Autors) Meiner Meinung nach ist Calibre ein großartiges Tool, aber zu umfangreich und hat zu viele Abhängigkeiten, um als Content-Server verwendet zu werden. Das ist der Hauptgrund, warum ich diesen OPDS-Server programmiert habe. Ich brauchte ein einfaches Tool für einen kleinen Server (in meinem Fall Seagate Dockstar). Zuerst dachte ich an Calibre2OPDS, aber da es statische Dateien erzeugt, war keine Suche möglich. Später fügte ich einen einfachen HTML-Katalog hinzu, der auf meinem Kobo nutzbar sein sollte. Die Hauptvorteile von COPS sind also: * Wenig Abhängigkeiten erforderlich. * Geringer Bedarf an CPU oder RAM. * Wenig Code. * Suchfunktion vorhanden. * Mit Dropbox/owncloud ist es sehr einfach, einen aktuellen OPDS-Server zu haben. * Die Programmierung hat Spaß gemacht. Wenn Sie den OPDS-Feed nutzen möchten, vergessen Sie nicht, /feed am Ende Ihrer URL anzugeben.'
    el_GR: 'Από τον Sébastien Lucas, που τώρα συντηρείται από την MikesPub, σημαίνει Calibre OPDS (και HTML) Php Server. Το COPS συνδέεται με τη βάση δεδομένων της βιβλιοθήκης Calibre και επιτρέπει τη λήψη και την αποστολή βιβλίων μέσω email απευθείας από ένα πρόγραμμα περιήγησης ιστού και παρέχει μια ροή OPDS για σύνδεση με τις συσκευές σας. Οι αλλαγές στη βιβλιοθήκη Calibre αντικατοπτρίζονται αμέσως στις σελίδες COPS σας. Δείτε: Αρχική σελίδα του COPS για περισσότερες λεπτομέρειες. Μην ξεχάσετε να ελέγξετε το Wiki. ## Γιατί. (από την ιστοσελίδα του συγγραφέα) Κατά τη γνώμη μου, το Calibre είναι ένα θαυμάσιο εργαλείο, αλλά είναι πολύ μεγάλο και έχει πάρα πολλές εξαρτήσεις για να χρησιμοποιηθεί για τον διακομιστή περιεχομένου του. Αυτός είναι ο κύριος λόγος για τον οποίο δημιούργησα τον κώδικα αυτού του διακομιστή OPDS. Χρειαζόμουν ένα απλό εργαλείο για εγκατάσταση σε έναν μικρό διακομιστή (Seagate Dockstar στην περίπτωσή μου). Αρχικά σκέφτηκα το Calibre2OPDS, αλλά καθώς δημιουργούσε στατικά αρχεία, δεν ήταν δυνατή η αναζήτηση. Αργότερα πρόσθεσα έναν απλό κατάλογο HTML που θα πρέπει να είναι χρησιμοποιήσιμος στο Kobo μου. Έτσι, τα κύρια πλεονεκτήματα του COPS είναι: * Δεν χρειάζονται πολλές εξαρτήσεις. * Δεν χρειάζονται πολλή CPU ή RAM. * Δεν υπάρχει πολύς κώδικας. * Διατίθεται αναζήτηση. * Με το Dropbox / owncloud είναι πολύ εύκολο να έχετε έναν ενημερωμένο διακομιστή OPDS. * Ήταν διασκεδαστικό να γράψετε κώδικα. Αν θέλετε να χρησιμοποιήσετε την ροή OPDS, μην ξεχάσετε να ορίσετε /feed στο τέλος της διεύθυνσης URL σας.'
    en_GB: 'By Sébastien Lucas, now maintained by Mikespub, stands for Calibre Opds (and Html) Php Server. Cops links to your Calibre library database and allows downloading and emailing of books directly from a web browser and provides a Opds feed to connect to your devices. Changes in your Calibre library are reflected immediately in your Cops pages. See : Cops''s home for more details. Don''t forget to check the Wiki. ## Why. (taken from the author''s site) In my opinion Calibre is a marvelous tool but is too big and has too much dependencies to be used for its content server. That''s the main reason why I coded this Opds server. I needed a simple tool to be installed on a small server (Seagate Dockstar in my case). I initially thought of Calibre2OPDS but as it generate static file no search was possible. Later I added an simple Html catalog that should be usable on my Kobo. So Cops''s main advantages are : * No need for many dependencies. * No need for a lot of Cpu or Ram. * Not much code. * Search is available. * With Dropbox / owncloud it''s very easy to have an up to date Opds server. * It was fun to code. If you want to use the Opds feed don''t forget to specify /feed at the end of your Url.'
    es_ES: 'Por Sébastien Lucas, ahora mantenido por MikesPub, significa Calibre OPDS (y HTML) Php Server. COPS se conecta a la base de datos de tu biblioteca Calibre y permite descargar y enviar libros por correo electrónico directamente desde un navegador web y proporciona un feed OPDS para conectarse a tus dispositivos. Los cambios en tu biblioteca Calibre se reflejan inmediatamente en tus páginas de COPS. Consulta: la página principal de COPS para obtener más detalles. No olvides consultar la Wiki. ## Por qué. (tomado del sitio del autor) En mi opinión, Calibre es una herramienta maravillosa, pero es demasiado grande y tiene demasiadas dependencias para ser utilizada como servidor de contenido. Esa es la razón principal por la que programé este servidor OPDS. Necesitaba una herramienta simple para instalar en un servidor pequeño (Seagate Dockstar en mi caso). Inicialmente pensé en Calibre2OPDS, pero como genera un archivo estático, no era posible realizar búsquedas. Más tarde agregué un catálogo HTML simple que debería ser utilizable en mi Kobo. Entonces, las principales ventajas de COPS son: * No necesita muchas dependencias. * No necesita mucha CPU o RAM. * Poco código. * Función de búsqueda disponible. * Con Dropbox/owncloud es muy fácil tener un servidor OPDS actualizado. * Fue divertido programarlo. Si quieres usar la fuente OPDS, no olvides especificar /feed al final de tu URL.'
    fr_FR: 'Développé par Sébastien Lucas et désormais maintenu par MikesPub, COPS (Calibre OPDS et HTML) est un serveur PHP. COPS se connecte à votre base de données Calibre et permet de télécharger et d''envoyer des livres par e-mail directement depuis un navigateur web. Il fournit également un flux OPDS pour la connexion à vos appareils. Les modifications apportées à votre bibliothèque Calibre sont immédiatement visibles sur vos pages COPS. Pour plus d''informations, consultez la page d''accueil de COPS. N''oubliez pas de consulter le Wiki. ## Pourquoi ? (Extrait du site de l''auteur) À mon avis, Calibre est un outil formidable, mais trop volumineux et avec trop de dépendances pour être utilisé comme serveur de contenu. C''est la principale raison pour laquelle j''ai développé ce serveur OPDS. J''avais besoin d''un outil simple à installer sur un petit serveur (un Seagate Dockstar dans mon cas). J''avais d''abord pensé à Calibre2OPDS, mais comme il génère des fichiers statiques, la recherche était impossible. J''ai ensuite ajouté un catalogue HTML simple, compatible avec ma liseuse Kobo. Les principaux avantages de COPS sont donc : * Peu de dépendances. * Faible consommation de ressources CPU et RAM. * Peu de code. * Fonction de recherche disponible. * Avec Dropbox/ownCloud, il est très facile d''avoir un serveur OPDS à jour. * C''était amusant à coder. Si vous souhaitez utiliser le flux OPDS, n''oubliez pas d''ajouter `/feed` à la fin de votre URL.'
    ga_IE: 'Le Sébastien Lucas, atá á chothabháil anois ag MikesPub, seasann sé do Calibre OPDS (agus HTML) Php Server. Nascann COPS le do bhunachar sonraí leabharlainne Calibre agus tugann sé deis duit leabhair a íoslódáil agus a sheoladh trí ríomhphost go díreach ó bhrabhsálaí gréasáin agus soláthraíonn sé beatha OPDS chun ceangal le do ghléasanna. Léirítear athruithe i do leabharlann Calibre láithreach i do leathanaigh COPS. Féach: baile COPS le haghaidh tuilleadh sonraí. Ná déan dearmad an Vicí a sheiceáil. ## Cén fáth. (tógtha ó shuíomh an údair) Is uirlis iontach é Calibre i mo thuairimse ach tá sé ró-mhór agus tá an iomarca spleáchais ann le húsáid dá fhreastalaí ábhair. Sin an phríomhchúis gur chódaigh mé an freastalaí OPDS seo. Bhí uirlis shimplí ag teastáil uaim le suiteáil ar fhreastalaí beag (Seagate Dockstar i mo chás). Smaoinigh mé ar dtús ar Calibre2OPDS ach toisc go ngineann sé comhad statach ní raibh aon chuardach indéanta. Níos déanaí chuir mé catalóg HTML simplí leis ba chóir a bheith inúsáidte ar mo Kobo. Mar sin is iad príomhbhuntáistí COPS: * Níl gá le go leor spleáchais. * Níl gá le go leor LAP nó RAM. * Níl mórán cóid ann. * Tá cuardach ar fáil. * Le Dropbox / owncloud tá sé an-éasca freastalaí OPDS cothrom le dáta a bheith agat. * Bhí sé spraíúil an cód a scríobh. Más mian leat an fotha OPDS a úsáid ná déan dearmad /feed a shonrú ag deireadh do URL.'
    hr_HR: 'Autor Sébastien Lucas, sada ga održava MikesPub, kratica je za Calibre OPDS (and HTML) Php Server. COPS se povezuje s vašom Calibre bazom podataka knjižnice i omogućuje preuzimanje i slanje knjiga e-poštom izravno iz web preglednika te pruža OPDS feed za povezivanje s vašim uređajima. Promjene u vašoj Calibre knjižnici odmah se odražavaju na vašim COPS stranicama. Pogledajte: COPS-ova početna stranica za više detalja. Ne zaboravite provjeriti Wiki. ## Zašto. (preuzeto s autorove stranice) Po mom mišljenju, Calibre je izvrstan alat, ali je prevelik i ima previše ovisnosti da bi se koristio za svoj poslužitelj sadržaja. To je glavni razlog zašto sam kodirao ovaj OPDS poslužitelj. Trebao mi je jednostavan alat za instalaciju na malom poslužitelju (u mom slučaju Seagate Dockstar). U početku sam razmišljao o Calibre2OPDS, ali budući da generira statičku datoteku, pretraživanje nije bilo moguće. Kasnije sam dodao jednostavan HTML katalog koji bi trebao biti upotrebljiv na mom Kobo-u. Dakle, glavne prednosti COPS-a su: * Nema potrebe za mnogo ovisnosti. * Nema potrebe za puno CPU-a ili RAM-a. * Nema puno koda. * Dostupno je pretraživanje. * S Dropboxom / owncloudom vrlo je jednostavno imati ažurirani OPDS poslužitelj. * Bilo je zabavno programirati. Ako želite koristiti OPDS feed, ne zaboravite navesti /feed na kraju URL-a.'
    hu_HU: 'Sébastien Lucas tollából, jelenleg a MikesPub tartja karban, a Calibre OPDS (és HTML) Php Server rövidítése. A COPS a Calibre könyvtáradatbázisodhoz kapcsolódik, és lehetővé teszi a könyvek letöltését és e-mailben küldését közvetlenül egy webböngészőből, valamint OPDS-hírcsatornát biztosít az eszközeidhez való csatlakozáshoz. A Calibre könyvtáradban végrehajtott változtatások azonnal megjelennek a COPS oldalain. További részletekért lásd: COPS honlapja. Ne felejtsd el megnézni a Wikit. ## Miért. (a szerző oldaláról származik) Véleményem szerint a Calibre egy csodálatos eszköz, de túl nagy és túl sok függősége van ahhoz, hogy a tartalomkiszolgálójához használjuk. Ez a fő oka annak, hogy miért kódoltam ezt az OPDS-kiszolgálót. Szükségem volt egy egyszerű eszközre, amelyet egy kis szerverre lehet telepíteni (az én esetemben a Seagate Dockstar). Eredetileg a Calibre2OPDS-re gondoltam, de mivel statikus fájlokat generál, nem volt lehetséges a keresés. Később hozzáadtam egy egyszerű HTML-katalógust, amelynek használhatónak kell lennie a Kobo-mon. Tehát a COPS fő előnyei: * Nincs szükség sok függőségre. * Nincs szükség sok CPU-ra vagy RAM-ra. * Nincs sok kód. * Van keresés. * A Dropbox / owncloud segítségével nagyon könnyű naprakész OPDS szervert üzemeltetni. * Élvezetes volt kódolni. Ha használni szeretnéd az OPDS hírcsatornát, ne felejtsd el megadni a /feed kapcsolót az URL végén.'
    it_IT: 'COPS, creato da Sébastien Lucas e ora gestito da MikesPub, è l''acronimo di Calibre OPDS (and HTML) Php Server. COPS si collega al database della tua libreria Calibre e consente di scaricare e inviare via email libri direttamente da un browser web, oltre a fornire un feed OPDS per la connessione ai tuoi dispositivi. Le modifiche apportate alla tua libreria Calibre si riflettono immediatamente nelle pagine di COPS. Per maggiori dettagli, consulta la homepage di COPS. Non dimenticare di consultare la Wiki. ## Perché. (tratto dal sito dell''autore) A mio parere, Calibre è uno strumento meraviglioso, ma è troppo grande e ha troppe dipendenze per essere utilizzato come server di contenuti. Questo è il motivo principale per cui ho programmato questo server OPDS. Avevo bisogno di uno strumento semplice da installare su un piccolo server (nel mio caso un Seagate Dockstar). Inizialmente avevo pensato a Calibre2OPDS, ma poiché generava un file statico, non era possibile effettuare ricerche. Successivamente ho aggiunto un semplice catalogo HTML utilizzabile sul mio Kobo. Quindi i principali vantaggi di COPS sono: * Non necessita di molte dipendenze. * Non richiede molta CPU o RAM. * Poco codice. * La funzione di ricerca è disponibile. * Con Dropbox/OwnCloud è molto facile avere un server OPDS aggiornato. * È stato divertente programmarlo. Se vuoi usare il feed OPDS, non dimenticare di specificare /feed alla fine del tuo URL.'
    ja_JP: 'Sébastien Lucas によって作成され、現在は MikesPub によって管理されている、Calibre OPDS (and HTML) Php Server の略です。 COPS は Calibre ライブラリ データベースにリンクし、Web ブラウザから直接書籍をダウンロードおよびメール送信できるようにし、デバイスに接続するための OPDS フィードを提供します。Calibre ライブラリの変更は、COPS ページに即座に反映されます。詳細については、COPS のホームページを参照してください。Wiki も忘れずに確認してください。 ## 理由。(著者のサイトから引用) 私の意見では、Calibre は素晴らしいツールですが、コンテンツ サーバーとして使用するには大きすぎ、依存関係が多すぎます。これが、私がこの OPDS サーバーをコーディングした主な理由です。私は、小さなサーバー (私の場合は Seagate Dockstar) にインストールできるシンプルなツールが必要でした。最初は Calibre2OPDS を考えましたが、静的ファイルを生成するため検索はできませんでした。その後、Kobo で使用できるシンプルな HTML カタログを追加しました。 COPSの主な利点は次のとおりです。* 多くの依存関係が不要。* 多くのCPUやRAMが不要。* コード量が少ない。* 検索機能が利用可能。* Dropbox/ownCloudを使用すると、最新のOPDSサーバーを簡単に維持できます。* コーディングが楽しかった。OPDSフィードを使用する場合は、URLの末尾に/feedを指定することを忘れないでください。'
    ko_KR: 'Sébastien Lucas가 개발하고 현재 MikesPub에서 관리하는 COPS는 Calibre OPDS(및 HTML) PHP 서버입니다. COPS는 Calibre 라이브러리 데이터베이스에 연결되어 웹 브라우저에서 직접 책을 다운로드하고 이메일로 전송할 수 있으며, 기기에 연결할 수 있는 OPDS 피드를 제공합니다. Calibre 라이브러리의 변경 사항은 COPS 페이지에 즉시 반영됩니다. 자세한 내용은 COPS 홈페이지를 참조하세요. 위키도 확인해 보세요. ## 개발 이유 (개발자 사이트에서 발췌) 제 생각에 Calibre는 훌륭한 도구이지만 콘텐츠 서버로 사용하기에는 너무 크고 의존성이 너무 높습니다. 이것이 제가 이 OPDS 서버를 개발하게 된 주된 이유입니다. 저는 작은 서버(제 경우에는 Seagate Dockstar)에 설치할 수 있는 간단한 도구가 필요했습니다. 처음에는 Calibre2OPDS를 생각했지만 정적 파일을 생성하기 때문에 검색이 불가능했습니다. 나중에 Kobo에서 사용할 수 있는 간단한 HTML 카탈로그를 추가했습니다. 따라서 COPS의 주요 장점은 다음과 같습니다. * 많은 의존성이 필요하지 않습니다. * CPU나 RAM 용량이 많이 필요하지 않습니다. * 코드도 많지 않습니다. * 검색 기능이 있습니다. * Dropbox/OwnCloud를 사용하면 OPDS 서버를 최신 상태로 유지하기가 매우 쉽습니다. * 코딩하는 과정이 재미있었습니다. OPDS 피드를 사용하려면 URL 끝에 /feed를 추가하는 것을 잊지 마세요.'
    ml_IN: 'സെബാസ്റ്റ്യൻ ലൂക്കാസ്, ഇപ്പോൾ മൈക്സ്പബ് പരിപാലിക്കുന്നു, കാലിബർ OPDS (കൂടാതെ HTML) Php സെർവറിനെ സൂചിപ്പിക്കുന്നു. COPS നിങ്ങളുടെ കാലിബർ ലൈബ്രറി ഡാറ്റാബേസിലേക്ക് ലിങ്ക് ചെയ്യുകയും ഒരു വെബ് ബ്രൗസറിൽ നിന്ന് നേരിട്ട് പുസ്തകങ്ങൾ ഡൗൺലോഡ് ചെയ്യാനും ഇമെയിൽ ചെയ്യാനും അനുവദിക്കുകയും നിങ്ങളുടെ ഉപകരണങ്ങളിലേക്ക് കണക്റ്റുചെയ്യുന്നതിന് ഒരു OPDS ഫീഡ് നൽകുകയും ചെയ്യുന്നു. നിങ്ങളുടെ കാലിബർ ലൈബ്രറിയിലെ മാറ്റങ്ങൾ നിങ്ങളുടെ COPS പേജുകളിൽ ഉടനടി പ്രതിഫലിക്കും. കാണുക: കൂടുതൽ വിശദാംശങ്ങൾക്ക് COPS-ന്റെ ഹോം. വിക്കി പരിശോധിക്കാൻ മറക്കരുത്. ## എന്തുകൊണ്ട്. (രചയിതാവിന്റെ സൈറ്റിൽ നിന്ന് എടുത്തത്) എന്റെ അഭിപ്രായത്തിൽ കാലിബർ ഒരു അത്ഭുതകരമായ ഉപകരണമാണ്, പക്ഷേ അത് വളരെ വലുതാണ്, അതിന്റെ ഉള്ളടക്ക സെർവറിന് ഉപയോഗിക്കാൻ വളരെയധികം ഡിപൻഡൻസികളുണ്ട്. അതുകൊണ്ടാണ് ഞാൻ ഈ OPDS സെർവർ കോഡ് ചെയ്തതിന്റെ പ്രധാന കാരണം. ഒരു ചെറിയ സെർവറിൽ ഇൻസ്റ്റാൾ ചെയ്യാൻ എനിക്ക് ഒരു ലളിതമായ ഉപകരണം ആവശ്യമായിരുന്നു (എന്റെ കാര്യത്തിൽ സീഗേറ്റ് ഡോക്ക്സ്റ്റാർ). ഞാൻ ആദ്യം Calibre2OPDS-നെക്കുറിച്ചാണ് ചിന്തിച്ചത്, പക്ഷേ അത് സ്റ്റാറ്റിക് ഫയൽ സൃഷ്ടിക്കുന്നതിനാൽ തിരയൽ സാധ്യമായിരുന്നില്ല. പിന്നീട് എന്റെ Kobo-യിൽ ഉപയോഗിക്കാൻ കഴിയുന്ന ഒരു ലളിതമായ HTML കാറ്റലോഗ് ഞാൻ ചേർത്തു. അതിനാൽ COPS-ന്റെ പ്രധാന ഗുണങ്ങൾ ഇവയാണ്: * നിരവധി ഡിപൻഡൻസികൾ ആവശ്യമില്ല. * അധികം സിപിയു അല്ലെങ്കിൽ റാമിന്റെ ആവശ്യമില്ല. * അധികം കോഡ് ഇല്ല. * തിരയൽ ലഭ്യമാണ്. * ഡ്രോപ്പ്ബോക്സ് / സ്വന്തം ക്ലൗഡിൽ കാലികമായ ഒരു OPDS സെർവർ ഉണ്ടായിരിക്കുന്നത് വളരെ എളുപ്പമാണ്. * കോഡ് ചെയ്യുന്നത് രസകരമായിരുന്നു. OPDS ഫീഡ് ഉപയോഗിക്കാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്നുവെങ്കിൽ, നിങ്ങളുടെ URL-ന്റെ അവസാനം /feed എന്ന് വ്യക്തമാക്കാൻ മറക്കരുത്.'
    nb_NO: 'Av Sébastien Lucas, nå vedlikeholdt av MikesPub, står for Calibre OPDS (og HTML) Php Server. COPS lenker til Calibre-bibliotekdatabasen din og lar deg laste ned og sende bøker via e-post direkte fra en nettleser, og gir en OPDS-feed for å koble til enhetene dine. Endringer i Calibre-biblioteket ditt gjenspeiles umiddelbart på COPS-sidene dine. Se: COPS sin hjemmeside for mer informasjon. Ikke glem å sjekke wikien. ## Hvorfor. (hentet fra forfatterens nettsted) Etter min mening er Calibre et fantastisk verktøy, men det er for stort og har for mange avhengigheter til å kunne brukes til innholdsserveren. Det er hovedgrunnen til at jeg kodet denne OPDS-serveren. Jeg trengte et enkelt verktøy som skulle installeres på en liten server (Seagate Dockstar i mitt tilfelle). Jeg tenkte først på Calibre2OPDS, men siden det genererer statiske filer, var det ikke mulig å søke. Senere la jeg til en enkel HTML-katalog som skulle kunne brukes på Kobo-en min. Så COPS sine viktigste fordeler er: * Ikke behov for mange avhengigheter. * Ikke behov for mye CPU eller RAM. * Ikke mye kode. * Søk er tilgjengelig. * Med Dropbox / owncloud er det veldig enkelt å ha en oppdatert OPDS-server. * Det var gøy å kode. Hvis du vil bruke OPDS-feeden, ikke glem å spesifisere /feed på slutten av URL-en din.'
    nl_NL: 'COPS, ontwikkeld door Sébastien Lucas en nu onderhouden door MikesPub, staat voor Calibre OPDS (en HTML) PHP-server. COPS koppelt aan uw Calibre-bibliotheekdatabase en maakt het mogelijk om boeken rechtstreeks vanuit een webbrowser te downloaden en te e-mailen. Het biedt ook een OPDS-feed om verbinding te maken met uw apparaten. Wijzigingen in uw Calibre-bibliotheek worden direct weergegeven op uw COPS-pagina''s. Zie de COPS-homepage voor meer informatie. Vergeet niet de wiki te raadplegen. ## Waarom (overgenomen van de website van de auteur) Naar mijn mening is Calibre een fantastische tool, maar te groot en heeft te veel afhankelijkheden om als contentserver te gebruiken. Dat is de belangrijkste reden waarom ik deze OPDS-server heb gecodeerd. Ik had een eenvoudige tool nodig die op een kleine server (in mijn geval een Seagate Dockstar) geïnstalleerd kon worden. Aanvankelijk dacht ik aan Calibre2OPDS, maar omdat dit statische bestanden genereert, was zoeken niet mogelijk. Later heb ik een eenvoudige HTML-catalogus toegevoegd die bruikbaar zou moeten zijn op mijn Kobo. De belangrijkste voordelen van COPS zijn: * Geen behoefte aan veel afhankelijkheden. * Geen behoefte aan veel CPU of RAM. * Weinig code. * Zoeken is mogelijk. * Met Dropbox/Owncloud is het heel eenvoudig om een actuele OPDS-server te hebben. * Het was leuk om te programmeren. Als je de OPDS-feed wilt gebruiken, vergeet dan niet om /feed aan het einde van je URL toe te voegen.'
    pl_PL: 'Autorstwa Sébastiena Lucasa, obecnie utrzymywanego przez MikesPub, oznacza Calibre OPDS (i HTML) Php Server. COPS łączy się z bazą danych biblioteki Calibre i umożliwia pobieranie i wysyłanie książek e-mailem bezpośrednio z przeglądarki internetowej oraz zapewnia kanał OPDS do łączenia się z urządzeniami. Zmiany w bibliotece Calibre są natychmiast odzwierciedlane na stronach COPS. Zobacz: stronę główną COPS, aby uzyskać więcej informacji. Nie zapomnij sprawdzić Wiki. ## Dlaczego. (z witryny autora) Moim zdaniem Calibre to wspaniałe narzędzie, ale jest za duże i ma zbyt wiele zależności, aby można było go używać na serwerze treści. To główny powód, dla którego zakodowałem ten serwer OPDS. Potrzebowałem prostego narzędzia do zainstalowania na małym serwerze (w moim przypadku Seagate Dockstar). Początkowo pomyślałem o Calibre2OPDS, ale ponieważ generuje on statyczny plik, wyszukiwanie nie było możliwe. Później dodałem prosty katalog HTML, który powinien nadawać się do użytku na moim Kobo. Główne zalety COPS to: * Brak konieczności stosowania wielu zależności. * Brak konieczności stosowania dużej mocy obliczeniowej procesora i pamięci RAM. * Niewielka ilość kodu. * Dostępność wyszukiwania. * Dzięki Dropboxowi/OwnCloud łatwo jest mieć aktualny serwer OPDS. * Kodowanie było przyjemnością. Jeśli chcesz korzystać z kanału OPDS, nie zapomnij dodać /feed na końcu adresu URL.'
    pt_BR: 'Criado por Sébastien Lucas e agora mantido por MikesPub, COPS significa Calibre OPDS (e HTML) PHP Server. O COPS se conecta ao banco de dados da sua biblioteca Calibre e permite o download e envio de livros por e-mail diretamente de um navegador web, além de fornecer um feed OPDS para conexão com seus dispositivos. As alterações na sua biblioteca Calibre são refletidas imediatamente nas suas páginas do COPS. Veja a página inicial do COPS para mais detalhes. Não se esqueça de consultar o Wiki. ## Por quê? (retirado do site do autor) Na minha opinião, o Calibre é uma ferramenta maravilhosa, mas é muito grande e tem muitas dependências para ser usado como servidor de conteúdo. Essa é a principal razão pela qual desenvolvi este servidor OPDS. Eu precisava de uma ferramenta simples para ser instalada em um servidor pequeno (Seagate Dockstar, no meu caso). Inicialmente, pensei no Calibre2OPDS, mas como ele gera arquivos estáticos, não era possível realizar buscas. Posteriormente, adicionei um catálogo HTML simples que pudesse ser usado no meu Kobo. Portanto, as principais vantagens do COPS são: * Não requer muitas dependências. * Não requer muita CPU ou RAM. * Pouco código. * Busca disponível. * Com Dropbox/OwnCloud, é muito fácil manter um servidor OPDS atualizado. * Foi divertido programar. Se você quiser usar o feed OPDS, não se esqueça de adicionar /feed ao final da sua URL.'
    ro_RO: 'De Sébastien Lucas, acum întreținut de MikesPub, înseamnă Calibre OPDS (și HTML) PHP Server. COPS se conectează la baza de date a bibliotecii Calibre și permite descărcarea și trimiterea prin e-mail a cărților direct dintr-un browser web și oferă un flux OPDS pentru conectarea la dispozitivele dvs. Modificările din biblioteca dvs. Calibre se reflectă imediat în paginile COPS. Vedeți: pagina principală a COPS pentru mai multe detalii. Nu uitați să verificați Wiki. ## De ce. (preluat de pe site-ul autorului) În opinia mea, Calibre este un instrument minunat, dar este prea mare și are prea multe dependențe pentru a fi utilizat pentru serverul său de conținut. Acesta este principalul motiv pentru care am codat acest server OPDS. Aveam nevoie de un instrument simplu care să fie instalat pe un server mic (Seagate Dockstar în cazul meu). Inițial m-am gândit la Calibre2OPDS, dar deoarece genera fișiere statice, nu era posibilă căutarea. Mai târziu, am adăugat un catalog HTML simplu care ar trebui să poată fi utilizat pe Kobo-ul meu. Deci, principalele avantaje ale COPS sunt: * Nu este nevoie de multe dependențe. * Nu este nevoie de mult CPU sau RAM. * Nu prea mult cod. * Căutarea este disponibilă. * Cu Dropbox / owncloud este foarte ușor să ai un server OPDS actualizat. * A fost distractiv să programez. Dacă vrei să folosești fluxul OPDS, nu uita să specifici /feed la sfârșitul adresei URL.'
    ru_RU: 'COPS, разработанный Себастьяном Лукасом и теперь поддерживаемый MikesPub, расшифровывается как Calibre OPDS (and HTML) Php Server. COPS подключается к базе данных вашей библиотеки Calibre и позволяет загружать и отправлять книги по электронной почте непосредственно из веб-браузера, а также предоставляет OPDS-канал для подключения к вашим устройствам. Изменения в вашей библиотеке Calibre немедленно отображаются на страницах COPS. Подробнее см.: домашняя страница COPS. Не забудьте проверить Wiki. ## Почему. (взято с сайта автора) На мой взгляд, Calibre — это замечательный инструмент, но он слишком большой и имеет слишком много зависимостей, чтобы использовать его в качестве сервера контента. Это главная причина, по которой я написал этот OPDS-сервер. Мне нужен был простой инструмент для установки на небольшой сервер (в моем случае Seagate Dockstar). Изначально я думал о Calibre2OPDS, но поскольку он генерирует статические файлы, поиск был невозможен. Позже я добавил простой HTML-каталог, который должен быть пригоден для использования на моем Kobo. Итак, главные преимущества COPS: * Отсутствие необходимости во множестве зависимостей. * Не требует больших ресурсов процессора или оперативной памяти. * Небольшой объем кода. * Доступен поиск. * С Dropbox/OwnCloud очень легко поддерживать актуальность OPDS-сервера. * Было интересно программировать. Если вы хотите использовать OPDS-ленту, не забудьте указать /feed в конце вашего URL-адреса.'
    sk_SK: 'Od Sébastiena Lucasa, teraz spravovaný MikesPub, je skratka pre Calibre OPDS (and HTML) Php Server. COPS sa pripája k vašej databáze knižnice Calibre a umožňuje sťahovanie a odosielanie kníh e-mailom priamo z webového prehliadača a poskytuje OPDS kanál na pripojenie k vašim zariadeniam. Zmeny vo vašej knižnici Calibre sa okamžite prejavia na vašich stránkach COPS. Viac informácií nájdete na: Domovská stránka COPS. Nezabudnite si pozrieť Wiki. ## Prečo. (prevzaté zo stránky autora) Podľa môjho názoru je Calibre úžasný nástroj, ale je príliš veľký a má príliš veľa závislostí na to, aby sa dal použiť pre svoj obsahový server. To je hlavný dôvod, prečo som naprogramoval tento OPDS server. Potreboval som jednoduchý nástroj na inštaláciu na malý server (v mojom prípade Seagate Dockstar). Spočiatku som uvažoval o Calibre2OPDS, ale keďže generoval statický súbor, nebolo možné vyhľadávanie. Neskôr som pridal jednoduchý HTML katalóg, ktorý by mal byť použiteľný na mojom Kobo. Hlavné výhody COPS sú teda: * Nie je potrebné veľa závislostí. * Nie je potrebné veľa CPU alebo RAM. * Nie je potrebné veľa kódu. * Vyhľadávanie je k dispozícii. * S Dropboxom / owncloudom je veľmi jednoduché mať aktuálny OPDS server. * Kódovanie bolo zábavné. Ak chcete použiť OPDS kanál, nezabudnite na koniec URL adresy uviesť /feed.'
    sv_SE: 'Av Sébastien Lucas, numera underhållen av MikesPub, står för Calibre OPDS (och HTML) Php Server. COPS länkar till din Calibre-biblioteksdatabas och tillåter nedladdning och e-post av böcker direkt från en webbläsare och tillhandahåller ett OPDS-flöde för att ansluta till dina enheter. Ändringar i ditt Calibre-bibliotek återspeglas omedelbart på dina COPS-sidor. Se: COPS hemsida för mer information. Glöm inte att kolla wikin. ## Varför. (hämtad från författarens webbplats) Enligt min mening är Calibre ett fantastiskt verktyg men det är för stort och har för många beroenden för att kunna användas för sin innehållsserver. Det är den främsta anledningen till att jag kodade denna OPDS-server. Jag behövde ett enkelt verktyg som skulle installeras på en liten server (Seagate Dockstar i mitt fall). Jag tänkte först på Calibre2OPDS men eftersom det genererar statiska filer var ingen sökning möjlig. Senare lade jag till en enkel HTML-katalog som borde kunna användas på min Kobo. Så COPS främsta fördelar är: * Inget behov av många beroenden. * Inget behov av mycket CPU eller RAM. * Inte mycket kod. * Sökning är tillgänglig. * Med Dropbox / owncloud är det väldigt enkelt att ha en uppdaterad OPDS-server. * Det var kul att koda. Om du vill använda OPDS-flödet, glöm inte att ange /feed i slutet av din URL.'
    tr_TR: 'Sébastien Lucas tarafından geliştirilen ve şu anda MikesPub tarafından sürdürülen COPS, Calibre OPDS (ve HTML) Php Sunucusu anlamına gelir. COPS, Calibre kütüphane veritabanınıza bağlanır ve kitapları doğrudan bir web tarayıcısından indirmenize ve e-posta ile göndermenize olanak tanır ve cihazlarınıza bağlanmak için bir OPDS akışı sağlar. Calibre kütüphanenizdeki değişiklikler COPS sayfalarınıza anında yansır. Daha fazla ayrıntı için COPS''un ana sayfasına bakın. Wiki''yi kontrol etmeyi unutmayın. ## Neden? (yazarın sitesinden alınmıştır) Bence Calibre harika bir araç, ancak içerik sunucusu için kullanılmak üzere çok büyük ve çok fazla bağımlılığı var. Bu, bu OPDS sunucusunu kodlamamın ana nedenidir. Küçük bir sunucuya (benim durumumda Seagate Dockstar) kurulacak basit bir araca ihtiyacım vardı. Başlangıçta Calibre2OPDS''yi düşündüm, ancak statik dosya ürettiği için arama mümkün değildi. Daha sonra Kobo''mda kullanılabilir olması gereken basit bir HTML kataloğu ekledim. Bu nedenle COPS''un ana avantajları şunlardır: * Birçok bağımlılığa gerek yok. * Çok fazla CPU veya RAM''e ihtiyaç duymaz. * Çok az kod gerektirir. * Arama özelliği mevcuttur. * Dropbox / Owncloud ile güncel bir OPDS sunucusuna sahip olmak çok kolaydır. * Kodlaması eğlenceliydi. OPDS akışını kullanmak istiyorsanız, URL''nizin sonuna /feed eklemeyi unutmayın.'
