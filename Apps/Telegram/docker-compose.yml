name: linuxserver-telegram
services:
  app:
    image: linuxserver/telegram:7.2.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Telegram is a cloud-based mobile and desktop messaging app.
    zh_CN: Telegram 是一款基于云的移动端和桌面端消息应用。
  tagline:
    en_US: A cloud-based mobile and desktop messaging app.
    zh_CN: 基于云的移动与桌面消息应用。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/telegram-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/telegram-logo.png
  title:
    en_US: Telegram (LinuxServer.io)
    zh_CN: Telegram（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservertelegram
  port_map: '3000'
  version: 7.2.8
