name: linuxserver-vivaldi
services:
  app:
    image: linuxserver/vivaldi:8.2.4133
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: VIVALDI_CLI
          description:
            en_US: Specify one or multiple Vivaldi CLI flags, this string will be passed to the application in full. [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Vivaldi is a Norwegian freeware, cross-platform web browser with a built-in email client developed by Vivaldi Technologies.
    ca_ES: Vivaldi és un navegador web noruec gratuït i multiplataforma amb un client de correu electrònic integrat desenvolupat per Vivaldi Technologies.
    cs_CZ: Vivaldi je norský freewarový multiplatformní webový prohlížeč s vestavěným e-mailovým klientem vyvinutý společností Vivaldi Technologies.
    da_DK: Vivaldi er en norsk freeware webbrowser til flere platforme med en indbygget e-mailklient udviklet af Vivaldi Technologies.
    de_DE: Vivaldi ist ein norwegischer Freeware-Webbrowser für verschiedene Plattformen mit integriertem E-Mail-Client, entwickelt von Vivaldi Technologies.
