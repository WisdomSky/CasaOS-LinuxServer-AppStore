    pl_PL: Vivaldi to norweska, darmowa, wieloplatformowa przeglądarka internetowa z wbudowanym klientem poczty e-mail, opracowana przez Vivaldi Technologies.
    pt_BR: O Vivaldi é um navegador web norueguês gratuito e multiplataforma com um cliente de e-mail integrado, desenvolvido pela Vivaldi Technologies.
