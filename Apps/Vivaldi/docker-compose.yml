    ru_RU: Vivaldi — это норвежский бесплатный кроссплатформенный веб-браузер со встроенным почтовым клиентом, разработанный компанией Vivaldi Technologies.
    sk_SK: Vivaldi je nórsky freeware, multiplatformový webový prehliadač so vstavaným e-mailovým klientom, ktorý vyvinula spoločnosť Vivaldi Technologies.
    sv_SE: Vivaldi är en norsk gratis, plattformsoberoende webbläsare med en inbyggd e-postklient utvecklad av Vivaldi Technologies.
