name: linuxserver-domoticz
services:
  app:
    image: linuxserver/domoticz:2023.2.20231129
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBROOT: ''
      DBASE: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: WEBROOT
          description:
            en_US: Sets webroot to domoticz for usage with subfolder reverse proxy. Not needed unless reverse proxying.
        - container: DBASE
          description:
            en_US: Sets path to database. Do not set unless you know what this does.
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 6144
        published: 6144
        protocol: tcp
      - target: 1443
        published: 1443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/domoticz/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
