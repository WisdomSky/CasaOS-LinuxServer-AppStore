    nl_NL: Het kan worden samengevat als een pakket met verbeteringen op het gebied van beveiliging en privacy, herimplementaties van Discord-functies, oplossingen voor bugs in Electron/Chromium/Discord, stylesheets, interne pagina's en een aangepaste https://discord.com-pagina, ontworpen om zoveel mogelijk te voldoen aan de gebruiksvoorwaarden (of om wijzigingen die deze mogelijk schenden, te verbergen voor Discord).
    pl_PL: Można to podsumować jako pakiet wzmocnień bezpieczeństwa i prywatności, ponownych implementacji funkcji Discorda, obejść błędów Electron/Chromium/Discord, arkuszy stylów, stron wewnętrznych i opakowanej strony https://discord.com, zaprojektowanej tak, aby w jak największym stopniu była zgodna z Warunkami korzystania z usługi (lub ukryć przed Discordem zmiany, które mogłyby je naruszać).
    pt_BR: Em resumo, trata-se de um pacote de melhorias de segurança e privacidade, reimplementações de recursos do Discord, correções de bugs do Electron/Chromium/Discord, folhas de estilo, páginas internas e uma página https://discord.com encapsulada, projetada para estar em conformidade com os Termos de Serviço o máximo possível (ou ocultar dos olhos do Discord as alterações que possam violá-los).
    ro_RO: Poate fi rezumat ca un pachet de îmbunătățiri ale securității și confidențialității, reimplementări ale caracteristicilor Discord, soluții alternative pentru erorile Electron / Chromium / Discord, foi de stil, pagini interne și o pagină https://discord.com încapsulată, concepută pentru a se conforma cât mai mult posibil cu Termenii și condițiile de utilizare (sau pentru a ascunde modificările care ar putea să le încalce de ochii Discord).
    ru_RU: 'Вкратце, это набор мер по повышению безопасности и конфиденциальности: переработанные версии интерфейса Discord, обходные пути для исправления ошибок в Electron/Chromium/Discord, таблицы стилей, внутренние страницы и обернутая страница https://discord.com, разработанные таким образом, чтобы максимально соответствовать условиям использования (или скрывать от Discord изменения, которые могут их нарушать).'
    sk_SK: Dá sa to zhrnúť ako balík vylepšení zabezpečenia a ochrany súkromia, Discord obsahuje reimplementácie funkcií, riešenia chýb Electron / Chromium / Discord, štýly, interné stránky a obalenú stránku https://discord.com, ktoré sú navrhnuté tak, aby čo najviac vyhovovali podmienkam používania (alebo skryli zmeny, ktoré by ich mohli porušovať, pred očami Discordu).
    sv_SE: Discord kan sammanfattas som ett paket med säkerhets- och integritetshärdningar. Det har omimplementeringar, lösningar för buggar kring Electron/Chromium/Discord, stilmallar, interna sidor och en inlindad https://discord.com-sida, utformad för att följa användarvillkoren så mycket som möjligt (eller dölja ändringar som kan bryta mot dem för Discord).
    tr_TR: Özetle, güvenlik ve gizlilik iyileştirmeleri, Discord özelliklerinin yeniden uygulanması, Electron/Chromium/Discord hatalarına yönelik geçici çözümler, stil sayfaları, dahili sayfalar ve sarmalanmış https://discord.com sayfası içeren bir paket olarak tanımlanabilir; bu paket, Hizmet Şartlarına mümkün olduğunca uygun olacak şekilde (veya ihlal edebilecek değişiklikleri Discord'un gözünden gizleyecek şekilde) tasarlanmıştır.
    zh_CN: 为 Discord 网页提供安全和隐私增强的客户端。
    zh_TW: 為 Discord 網頁提供安全和隱私增強的客戶端。
