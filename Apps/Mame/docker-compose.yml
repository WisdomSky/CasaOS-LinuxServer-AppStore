name: linuxserver-mame
services:
  app:
    image: linuxserver/mame:version-0.289dfsg1-0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: MAME is a free and open-source emulator designed to emulate the hardware of arcade games, video game consoles, old computers and other systems in software on modern personal computers.
    ca_ES: MAME és un emulador gratuït i de codi obert dissenyat per emular el maquinari de jocs arcade, consoles de videojocs, ordinadors antics i altres sistemes de programari en ordinadors personals moderns.
    cs_CZ: MAME je bezplatný emulátor s otevřeným zdrojovým kódem určený k emulaci hardwaru arkádových her, herních konzolí, starých počítačů a dalších systémů v softwaru na moderních osobních počítačích.
    da_DK: MAME er en gratis og open source-emulator designet til at efterligne hardwaren fra arkadespil, spillekonsoller, gamle computere og andre systemer i software på moderne personlige computere.
    de_DE: MAME ist ein kostenloser Open-Source-Emulator, der die Hardware von Arcade-Spielen, Videospielkonsolen, alten Computern und anderen Systemen in Software auf modernen PCs emuliert.
    el_GR: Το MAME είναι ένας δωρεάν και ανοιχτού κώδικα εξομοιωτής που έχει σχεδιαστεί για να μιμείται το υλικό των arcade παιχνιδιών, των κονσολών βιντεοπαιχνιδιών, των παλιών υπολογιστών και άλλων συστημάτων σε λογισμικό σε σύγχρονους προσωπικούς υπολογιστές.
    en_GB: Mame is a free and open-source emulator designed to emulate the hardware of arcade games, video game consoles, old computers and other systems in software on modern personal computers.
    es_ES: MAME es un emulador gratuito y de código abierto diseñado para emular el hardware de juegos arcade, consolas de videojuegos, ordenadores antiguos y otros sistemas mediante software en ordenadores personales modernos.
    fr_FR: MAME est un émulateur gratuit et open source conçu pour émuler le matériel des jeux d'arcade, des consoles de jeux vidéo, des anciens ordinateurs et autres systèmes par logiciel sur les ordinateurs personnels modernes.
    ga_IE: Is aithriseoir foinse oscailte agus saor in aisce é MAME atá deartha chun crua-earraí cluichí stuara, consóil físchluichí, seanríomhairí agus córais eile a aithris i mbogearraí ar ríomhairí pearsanta nua-aimseartha.
    hr_HR: MAME je besplatni emulator otvorenog koda dizajniran za emulaciju hardvera arkadnih igara, konzola za videoigre, starih računala i drugih sustava u softveru na modernim osobnim računalima.
    hu_HU: A MAME egy ingyenes és nyílt forráskódú emulátor, amelyet arra terveztek, hogy emulálja az arcade játékok, videojáték-konzolok, régi számítógépek és más rendszerek hardverét szoftverekben a modern személyi számítógépeken.
    it_IT: MAME è un emulatore gratuito e open-source progettato per emulare l'hardware di giochi arcade, console per videogiochi, vecchi computer e altri sistemi tramite software su moderni personal computer.
    ja_JP: MAMEは、アーケードゲーム、ビデオゲーム機、古いコンピュータ、その他のシステムのハードウェアを、現代のパーソナルコンピュータ上でソフトウェアとしてエミュレートするために設計された、無料のオープンソースエミュレータです。
    ko_KR: MAME는 아케이드 게임, 비디오 게임 콘솔, 구형 컴퓨터 및 기타 시스템의 하드웨어를 최신 개인용 컴퓨터에서 소프트웨어로 에뮬레이션하도록 설계된 무료 오픈 소스 에뮬레이터입니다.
    ml_IN: ആർക്കേഡ് ഗെയിമുകൾ, വീഡിയോ ഗെയിം കൺസോളുകൾ, പഴയ കമ്പ്യൂട്ടറുകൾ, ആധുനിക പേഴ്സണൽ കമ്പ്യൂട്ടറുകളിലെ സോഫ്റ്റ്‌വെയറിലെ മറ്റ് സിസ്റ്റങ്ങൾ എന്നിവയുടെ ഹാർഡ്‌വെയർ അനുകരിക്കുന്നതിനായി രൂപകൽപ്പന ചെയ്‌തിരിക്കുന്ന ഒരു സ്വതന്ത്രവും ഓപ്പൺ സോഴ്‌സ് എമുലേറ്ററുമാണ് MAME.
    nb_NO: MAME er en gratis og åpen kildekode-emulator designet for å etterligne maskinvaren til arkadespill, spillkonsoller, gamle datamaskiner og andre systemer i programvare på moderne personlige datamaskiner.
    nl_NL: MAME is een gratis en open-source emulator die is ontworpen om de hardware van arcadekasten, videogameconsoles, oude computers en andere systemen in software te emuleren op moderne pc's.
    pl_PL: MAME to darmowy i otwarty emulator przeznaczony do emulowania sprzętu gier arcade, konsol do gier wideo, starych komputerów i innych systemów za pomocą oprogramowania na nowoczesnych komputerach osobistych.
    pt_BR: O MAME é um emulador gratuito e de código aberto projetado para emular o hardware de jogos de arcade, consoles de videogame, computadores antigos e outros sistemas em software em computadores pessoais modernos.
    ro_RO: MAME este un emulator gratuit și open-source conceput pentru a emula hardware-ul jocurilor arcade, consolelor de jocuri video, computerelor vechi și altor sisteme în software pe computerele personale moderne.
    ru_RU: MAME — это бесплатный эмулятор с открытым исходным кодом, предназначенный для программной эмуляции аппаратного обеспечения аркадных игр, игровых консолей, старых компьютеров и других систем на современных персональных компьютерах.
    sk_SK: MAME je bezplatný emulátor s otvoreným zdrojovým kódom určený na emuláciu hardvéru arkádových hier, herných konzol, starých počítačov a iných systémov v softvéri na moderných osobných počítačoch.
    sv_SE: MAME är en gratis emulator med öppen källkod utformad för att emulera hårdvaran i arkadspel, spelkonsoler, gamla datorer och andra system i programvara på moderna persondatorer.
    tr_TR: MAME, atari oyunlarının, video oyun konsollarının, eski bilgisayarların ve diğer sistemlerin donanımını modern kişisel bilgisayarlarda yazılım aracılığıyla taklit etmek üzere tasarlanmış ücretsiz ve açık kaynaklı bir emülatördür.
    zh_CN: MAME 是一款免费的开源模拟器，旨在通过现代个人电脑上的软件模拟街机、游戏主机、旧式计算机和其他系统的硬件。
    zh_TW: MAME 是一款免費的開源模擬器，旨在透過現代個人電腦上的軟體模擬街機、遊戲主機、舊式計算機和其他系統的硬體。
