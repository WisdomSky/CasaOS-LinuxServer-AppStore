name: linuxserver-mastodon
services:
  app:
    image: linuxserver/mastodon:4.7.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOCAL_DOMAIN: ''
      REDIS_HOST: ''
      REDIS_PORT: ''
      DB_HOST: ''
      DB_USER: ''
      DB_NAME: ''
      DB_PASS: ''
      DB_PORT: ''
      ES_ENABLED: ''
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ''
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ''
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ''
      SECRET_KEY_BASE: ''
      OTP_SECRET: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      SMTP_SERVER: ''
      SMTP_PORT: ''
      SMTP_LOGIN: ''
      SMTP_PASSWORD: ''
      SMTP_FROM_ADDRESS: ''
      S3_ENABLED: ''
      WEB_DOMAIN: ''
      ES_HOST: ''
      ES_PORT: ''
      ES_USER: ''
      ES_PASS: ''
      S3_BUCKET: ''
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      S3_ALIAS_HOST: ''
      SIDEKIQ_ONLY: ''
      SIDEKIQ_QUEUE: ''
      SIDEKIQ_DEFAULT: ''
      SIDEKIQ_THREADS: ''
      DB_POOL: ''
      NO_CHOWN: ''
      MASTODON_PROMETHEUS_EXPORTER_ENABLED: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: LOCAL_DOMAIN
          description:
            en_US: This is the unique identifier of your server in the network. It cannot be safely changed later.
        - container: REDIS_HOST
          description:
            en_US: Redis server hostname
        - container: REDIS_PORT
          description:
            en_US: Redis port
        - container: DB_HOST
          description:
            en_US: Postgres database hostname
        - container: DB_USER
          description:
            en_US: Postgres username
        - container: DB_NAME
          description:
            en_US: Postgres db name
        - container: DB_PASS
          description:
            en_US: Postgres password
        - container: DB_PORT
          description:
            en_US: Postgres port
        - container: ES_ENABLED
          description:
            en_US: Enable or disable Elasticsearch (requires a separate ES instance)
        - container: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
          description:
            en_US: Primary key for Active Record Encryption.
        - container: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
          description:
            en_US: Deterministic key for Active Record Encryption.
        - container: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
          description:
            en_US: Derivation salt for Active Record Encryption.
        - container: SECRET_KEY_BASE
          description:
            en_US: Browser session secret. Changing it will break all active browser sessions.
        - container: OTP_SECRET
          description:
            en_US: MFA secret. Changing it after initial setup will break two-factor authentication.
        - container: VAPID_PRIVATE_KEY
          description:
            en_US: Push notification private key. Changing it after initial setup will break push notifications.
        - container: VAPID_PUBLIC_KEY
          description:
            en_US: Push notification public key. Changing it after initial setup will break push notifications.
        - container: SMTP_SERVER
          description:
            en_US: SMTP server for email notifications
        - container: SMTP_PORT
          description:
            en_US: SMTP server port
        - container: SMTP_LOGIN
          description:
            en_US: SMTP username
        - container: SMTP_PASSWORD
          description:
            en_US: SMTP password
        - container: SMTP_FROM_ADDRESS
          description:
            en_US: From address for emails send from Mastodon
        - container: S3_ENABLED
          description:
            en_US: Enable or disable S3 storage of uploaded files
        - container: WEB_DOMAIN
          description:
            en_US: This can be set if you want your server identifier to be different to the subdomain hosting Mastodon. See https://docs.joinmastodon.org/admin/config/#basic [OPTIONAL]
        - container: ES_HOST
          description:
            en_US: Elasticsearch server hostname [OPTIONAL]
        - container: ES_PORT
          description:
            en_US: Elasticsearch port [OPTIONAL]
        - container: ES_USER
          description:
            en_US: Elasticsearch username [OPTIONAL]
        - container: ES_PASS
          description:
            en_US: Elasticsearch password [OPTIONAL]
        - container: S3_BUCKET
          description:
            en_US: S3 bucket hostname [OPTIONAL]
        - container: AWS_ACCESS_KEY_ID
          description:
            en_US: S3 bucket access key ID [OPTIONAL]
        - container: AWS_SECRET_ACCESS_KEY
          description:
            en_US: S3 bucket secret access key [OPTIONAL]
        - container: S3_ALIAS_HOST
          description:
            en_US: Alternate hostname for object fetching if you are front the S3 connections. [OPTIONAL]
        - container: SIDEKIQ_ONLY
          description:
            en_US: Only run the sidekiq service in this container instance. For large scale instances that need better queue handling. [OPTIONAL]
        - container: SIDEKIQ_QUEUE
          description:
            en_US: The name of the sidekiq queue to run in this container. See notes. [OPTIONAL]
        - container: SIDEKIQ_DEFAULT
          description:
            en_US: Set to true on the main container if you're running additional sidekiq instances. It will run the default queue. [OPTIONAL]
        - container: SIDEKIQ_THREADS
          description:
            en_US: The number of threads for sidekiq to use. See notes. [OPTIONAL]
        - container: DB_POOL
          description:
            en_US: The size of the DB connection pool, must be at least the same as SIDEKIQ_THREADS. See notes. [OPTIONAL]
        - container: NO_CHOWN
          description:
            en_US: Set to true to skip chown of /config on init. READ THE APPLICATION NOTES BEFORE SETTING THIS. [OPTIONAL]
        - container: MASTODON_PROMETHEUS_EXPORTER_ENABLED
          description:
            en_US: If set to true, Mastodon’s Ruby processes (web & Sidekiq) will enable the Prometheus instrumentation. [OPTIONAL]
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
      - target: 9394
        published: 9394
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mastodon/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Mastodon is a free, open-source social network server based on ActivityPub where users can follow friends and discover new ones..
    ca_ES: Mastodon és un servidor de xarxa social gratuït i de codi obert basat en ActivityPub on els usuaris poden seguir amics i descobrir-ne de nous.
    cs_CZ: Mastodon je bezplatný server sociální sítě s otevřeným zdrojovým kódem založený na platformě ActivityPub, kde mohou uživatelé sledovat své přátele a objevovat nové.
    da_DK: Mastodon er en gratis, open source social netværksserver baseret på ActivityPub, hvor brugerne kan følge venner og opdage nye.
    de_DE: Mastodon ist ein kostenloser Open-Source-Social-Network-Server, der auf ActivityPub basiert und auf dem Benutzer Freunden folgen und neue Freunde entdecken können.
    el_GR: Το Mastodon είναι ένας δωρεάν, ανοιχτού κώδικα διακομιστής κοινωνικής δικτύωσης που βασίζεται στο ActivityPub, όπου οι χρήστες μπορούν να ακολουθούν φίλους και να ανακαλύπτουν νέους.
    en_GB: Mastodon is a free, open-source social network server based on Activitypub where users can follow friends and discover new ones..
    es_ES: Mastodon es un servidor de red social gratuito y de código abierto basado en ActivityPub donde los usuarios pueden seguir a sus amigos y descubrir a otros nuevos.
    fr_FR: Mastodon est un serveur de réseau social gratuit et open source basé sur ActivityPub, où les utilisateurs peuvent suivre leurs amis et en découvrir de nouveaux.
    ga_IE: Is freastalaí líonra sóisialta foinse oscailte saor in aisce é Mastodon atá bunaithe ar ActivityPub inar féidir le húsáideoirí cairde a leanúint agus cinn nua a aimsiú.
    hr_HR: Mastodon je besplatna društvena mreža otvorenog koda temeljena na ActivityPubu gdje korisnici mogu pratiti prijatelje i otkrivati nove.
    hu_HU: A Mastodon egy ingyenes, nyílt forráskódú közösségi hálózati szerver, amely az ActivityPub-on alapul, ahol a felhasználók követhetik barátaikat és újakat fedezhetnek fel.
    it_IT: Mastodon è un server di social network gratuito e open-source basato su ActivityPub, dove gli utenti possono seguire i propri amici e scoprirne di nuovi.
    ja_JP: Mastodonは、ActivityPubをベースにした無料のオープンソースソーシャルネットワークサーバーで、ユーザーは友人をフォローしたり、新しい友人を見つけたりすることができます。
    ko_KR: 마스토돈은 ActivityPub을 기반으로 하는 무료 오픈 소스 소셜 네트워크 서버로, 사용자는 친구를 팔로우하고 새로운 친구를 찾을 수 있습니다.
    ml_IN: ആക്ടിവിറ്റിപബ് അടിസ്ഥാനമാക്കിയുള്ള ഒരു സൗജന്യ, ഓപ്പൺ സോഴ്‌സ് സോഷ്യൽ നെറ്റ്‌വർക്ക് സെർവറാണ് മാസ്റ്റോഡൺ, ഉപയോക്താക്കൾക്ക് സുഹൃത്തുക്കളെ പിന്തുടരാനും പുതിയവരെ കണ്ടെത്താനും ഇവിടെ കഴിയും.
    nb_NO: Mastodon er en gratis, åpen kildekode-basert sosial nettverksserver basert på ActivityPub hvor brukere kan følge venner og oppdage nye.
    nl_NL: Mastodon is een gratis, open-source sociaal netwerkserver gebaseerd op ActivityPub, waar gebruikers vrienden kunnen volgen en nieuwe vrienden kunnen ontdekken.
    pl_PL: Mastodon to darmowy, otwartoźródłowy serwer sieci społecznościowej oparty na ActivityPub, w którym użytkownicy mogą obserwować znajomych i odkrywać nowych.
    pt_BR: Mastodon é um servidor de rede social gratuito e de código aberto baseado no ActivityPub, onde os usuários podem seguir amigos e descobrir novos.
    ro_RO: Mastodon este un server de rețea socială gratuit, open-source, bazat pe ActivityPub, unde utilizatorii își pot urmări prietenii și pot descoperi alții noi.
    ru_RU: Mastodon — это бесплатный сервер социальной сети с открытым исходным кодом, основанный на ActivityPub, где пользователи могут следить за друзьями и находить новых.
    sk_SK: Mastodon je bezplatný server sociálnej siete s otvoreným zdrojovým kódom založený na platforme ActivityPub, kde môžu používatelia sledovať priateľov a objavovať nových.
    sv_SE: Mastodon är ett gratis, öppen källkodsbaserat socialt nätverk baserat på ActivityPub där användare kan följa vänner och upptäcka nya.
    tr_TR: Mastodon, kullanıcıların arkadaşlarını takip edebilecekleri ve yeni arkadaşlar keşfedebilecekleri, ActivityPub tabanlı ücretsiz, açık kaynaklı bir sosyal ağ sunucusudur.
    zh_CN: Mastodon 是一款基于 ActivityPub 的免费开源社交网络服务器，用户可关注朋友并结识新朋友。
    zh_TW: Mastodon 是一款基於 ActivityPub 的免費開源社交網路伺服器，使用者可關注朋友並結識新朋友。
