name: linuxserver-mariadb
services:
  app:
    image: linuxserver/mariadb:11.8.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: ''
      MYSQL_USER: ''
      MYSQL_PASSWORD: ''
      REMOTE_SQL: ''
      CLI_OPTS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: MYSQL_ROOT_PASSWORD
          description:
            en_US: Set this to root password for installation (minimum 4 characters & non-alphanumeric passwords must be properly escaped). (valid only for first run)
        - container: MYSQL_DATABASE
          description:
            en_US: Specify the name of a database to be created. (valid only for first run) [OPTIONAL]
        - container: MYSQL_USER
          description:
            en_US: This user will have superuser access to the database specified by MYSQL_DATABASE (do not use root here). (valid only for first run) [OPTIONAL]
        - container: MYSQL_PASSWORD
          description:
            en_US: Set this to the password you want to use for you MYSQL_USER (minimum 4 characters & non-alphanumeric passwords must be properly escaped). (valid only for first run) [OPTIONAL]
        - container: REMOTE_SQL
          description:
            en_US: Set this to ingest sql files from an http/https endpoint (comma seperated array). [OPTIONAL]
        - container: CLI_OPTS
          description:
            en_US: Pass CLI options to mariadbd via mariadbd-safe. Use with caution as mariadbd option precedence is complex. [OPTIONAL]
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mariadb/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Mariadb is one of the most popular database servers. Made by the original developers of MySQL.
    ca_ES: Mariadb és un dels servidors de bases de dades més populars. Creat pels desenvolupadors originals de MySQL.
    cs_CZ: Mariadb je jeden z nejpopulárnějších databázových serverů. Vytvořili ho původní vývojáři MySQL.
    da_DK: Mariadb er en af de mest populære databaseservere. Lavet af de oprindelige udviklere af MySQL.
    de_DE: MariaDB ist einer der beliebtesten Datenbankserver. Entwickelt von den ursprünglichen Entwicklern von MySQL.
    el_GR: Το Mariadb είναι ένας από τους πιο δημοφιλείς διακομιστές βάσεων δεδομένων. Κατασκευασμένος από τους αρχικούς προγραμματιστές του MySQL.
