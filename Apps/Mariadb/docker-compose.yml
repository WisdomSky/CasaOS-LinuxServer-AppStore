    pt_BR: O MariaDB é um dos servidores de banco de dados mais populares. Foi criado pelos desenvolvedores originais do MySQL.
    ro_RO: Mariadb este unul dintre cele mai populare servere de baze de date. Creat de dezvoltatorii originali ai MySQL.
