name: linuxserver-vscode
services:
  app:
    image: linuxserver/vscode:1.137.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: VS Code is an integrated development environment developed by Microsoft. This container runs the full desktop application, for a web native version see Code Server.
    zh_CN: VS Code 是微软开发的集成开发环境。此容器运行完整的桌面应用；如需原生网页版本，请使用 Code Server。
  tagline:
    en_US: An integrated development environment developed by Microsoft. This container runs the full desktop application, for a web native version see Code Server.
    zh_CN: 运行完整桌面版 Visual Studio Code。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscode-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscode-logo.png
  title:
    en_US: Vscode (LinuxServer.io)
    zh_CN: Vscode（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservervscode
  port_map: '3000'
  version: 1.137.0
