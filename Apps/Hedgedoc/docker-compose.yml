    ja_JP: どこにいてもすべてのファイルにアクセスできます。HedgeDocは、リアルタイムでマルチプラットフォームに対応した共同編集型マークダウンノートエディタです。つまり、デスクトップ、タブレット、スマートフォンなど、あらゆるデバイスで他のユーザーと共同でノートを作成できます。ホームページでは、Facebook、Twitter、GitHubなど、複数の認証プロバイダーからサインインできます。
    ko_KR: 어디에 있든 모든 파일에 액세스할 수 있습니다. HedgeDoc은 실시간으로 여러 플랫폼에서 사용할 수 있는 공동 작업 마크다운 노트 편집기입니다. 데스크톱, 태블릿, 심지어 스마트폰에서도 다른 사람들과 함께 노트를 작성할 수 있습니다. 홈페이지에서 Facebook, Twitter, GitHub 등 다양한 인증 제공업체를 통해 로그인할 수 있습니다.
    ml_IN: നിങ്ങൾ എവിടെയായിരുന്നാലും നിങ്ങളുടെ എല്ലാ ഫയലുകളിലേക്കും ആക്‌സസ് നൽകുന്നു. ഹെഡ്ജ്ഡോക് ഒരു തത്സമയ, മൾട്ടി-പ്ലാറ്റ്‌ഫോം സഹകരണ മാർക്ക്ഡൗൺ നോട്ട് എഡിറ്ററാണ്. അതായത് നിങ്ങളുടെ ഡെസ്‌ക്‌ടോപ്പിലോ, ടാബ്‌ലെറ്റിലോ അല്ലെങ്കിൽ ഫോണിലോ പോലും മറ്റുള്ളവരുമായി കുറിപ്പുകൾ എഴുതാൻ കഴിയും. ഹോംപേജിലെ Facebook, Twitter, GitHub തുടങ്ങിയ ഒന്നിലധികം ഓത്ത് ദാതാക്കൾ വഴി നിങ്ങൾക്ക് സൈൻ-ഇൻ ചെയ്യാൻ കഴിയും.
    nb_NO: Gir deg tilgang til alle filene dine uansett hvor du er. HedgeDoc er en sanntids, samarbeidende redigeringsfunksjon for markdown-notater på flere plattformer. Dette betyr at du kan skrive notater med andre personer på datamaskinen, nettbrettet eller til og med på telefonen. Du kan logge på via flere autentiseringsleverandører som Facebook, Twitter, GitHub og mange flere på hjemmesiden.
    nl_NL: Met HedgeDoc heb je overal toegang tot al je bestanden. Het is een realtime, platformonafhankelijke, samenwerkingsgerichte Markdown-notitie-editor. Dit betekent dat je samen met anderen notities kunt schrijven op je desktop, tablet of zelfs op je telefoon. Je kunt inloggen via verschillende authenticatieproviders zoals Facebook, Twitter, GitHub en nog veel meer op de homepage.
    pl_PL: Zapewnia dostęp do wszystkich plików, gdziekolwiek jesteś. HedgeDoc to wieloplatformowy, współpracujący edytor notatek Markdown w czasie rzeczywistym. Oznacza to, że możesz tworzyć notatki z innymi osobami na komputerze stacjonarnym, tablecie, a nawet telefonie. Możesz zalogować się za pośrednictwem wielu dostawców uwierzytelniania, takich jak Facebook, Twitter, GitHub i wielu innych, na stronie głównej.
    pt_BR: Permite que você acesse todos os seus arquivos onde quer que esteja. O HedgeDoc é um editor de notas Markdown colaborativo, multiplataforma e em tempo real. Isso significa que você pode escrever notas com outras pessoas no seu computador, tablet ou até mesmo no celular. Você pode fazer login usando diversos provedores de autenticação, como Facebook, Twitter, GitHub e muitos outros, na página inicial.
    ro_RO: Îți oferă acces la toate fișierele tale oriunde te-ai afla. HedgeDoc este un editor de notițe markdown colaborativ, multi-platformă, în timp real. Aceasta înseamnă că poți scrie notițe împreună cu alte persoane pe desktop, tabletă sau chiar pe telefon. Te poți conecta prin intermediul mai multor furnizori de autentificare, cum ar fi Facebook, Twitter, GitHub și mulți alții, pe pagina principală.
    ru_RU: Предоставляет доступ ко всем вашим файлам, где бы вы ни находились. HedgeDoc — это редактор заметок Markdown для совместной работы в режиме реального времени на нескольких платформах. Это означает, что вы можете писать заметки с другими людьми на своем компьютере, планшете или даже телефоне. Вы можете войти в систему через различные системы аутентификации, такие как Facebook, Twitter, GitHub и многие другие, на главной странице.
    sk_SK: Poskytuje vám prístup ku všetkým vašim súborom, nech ste kdekoľvek. HedgeDoc je multiplatformový editor poznámok s možnosťou spolupráce v reálnom čase. To znamená, že si môžete písať poznámky s ostatnými ľuďmi na počítači, tablete alebo dokonca na telefóne. Na domovskej stránke sa môžete prihlásiť prostredníctvom viacerých poskytovateľov autorizácie, ako sú Facebook, Twitter, GitHub a mnoho ďalších.
    sv_SE: Ger dig tillgång till alla dina filer var du än är. HedgeDoc är en realtidsredigerare för flera plattformar och samarbetsinriktad anteckningshantering. Det betyder att du kan skriva anteckningar med andra personer på din dator, surfplatta eller till och med på telefonen. Du kan logga in via flera autentiseringsleverantörer som Facebook, Twitter, GitHub och många fler på startsidan.
    tr_TR: Nerede olursanız olun tüm dosyalarınıza erişmenizi sağlar. HedgeDoc, gerçek zamanlı, çok platformlu, işbirlikçi bir Markdown not düzenleyicisidir. Bu, masaüstünüzde, tabletinizde veya hatta telefonunuzda diğer kişilerle birlikte not yazabileceğiniz anlamına gelir. Ana sayfada Facebook, Twitter, GitHub ve daha birçok kimlik doğrulama sağlayıcısı aracılığıyla oturum açabilirsiniz.
    zh_CN: 跨设备实时协作编写 Markdown 笔记。
    zh_TW: 跨裝置實時協作編寫 Markdown 筆記。
