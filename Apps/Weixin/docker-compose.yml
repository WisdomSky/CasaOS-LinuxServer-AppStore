name: linuxserver-weixin
services:
  app:
    image: linuxserver/weixin:version-f1376de7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/weixin/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Weixin (WeChat) is an instant messaging, social media, and mobile payment app developed by Tencent.
    ca_ES: Weixin (WeChat) és una aplicació de missatgeria instantània, xarxes socials i pagament mòbil desenvolupada per Tencent.
    cs_CZ: Weixin (WeChat) je aplikace pro rychlé zasílání zpráv, sociální média a mobilní platby vyvinutá společností Tencent.
    da_DK: Weixin (WeChat) er en app til instant messaging, sociale medier og mobilbetalinger udviklet af Tencent.
    de_DE: Weixin (WeChat) ist eine Instant-Messaging-, Social-Media- und Mobile-Payment-App, die von Tencent entwickelt wurde.
    el_GR: Το Weixin (WeChat) είναι μια εφαρμογή άμεσων μηνυμάτων, μέσων κοινωνικής δικτύωσης και πληρωμών μέσω κινητού που αναπτύχθηκε από την Tencent.
    en_GB: Weixin (Wechat) is an instant messaging, social media, and mobile payment app developed by Tencent.
    es_ES: Weixin (WeChat) es una aplicación de mensajería instantánea, redes sociales y pagos móviles desarrollada por Tencent.
    fr_FR: Weixin (WeChat) est une application de messagerie instantanée, de médias sociaux et de paiement mobile développée par Tencent.
    ga_IE: Is aip teachtaireachtaí meandaracha, meán sóisialta agus íocaíochta soghluaiste í Weixin (WeChat) atá forbartha ag Tencent.
    hr_HR: Weixin (WeChat) je aplikacija za instant poruke, društvene mreže i mobilno plaćanje koju je razvio Tencent.
    hu_HU: A Weixin (WeChat) egy Tencent által fejlesztett azonnali üzenetküldő, közösségi média és mobilfizetési alkalmazás.
    it_IT: Weixin (WeChat) è un'app di messaggistica istantanea, social media e pagamenti mobili sviluppata da Tencent.
    ja_JP: Weixin（WeChat）は、テンセントが開発したインスタントメッセージング、ソーシャルメディア、モバイル決済アプリです。
    ko_KR: 위챗(Weixin)은 텐센트가 개발한 인스턴트 메시징, 소셜 미디어 및 모바일 결제 앱입니다.
    ml_IN: വെയ്‌ക്സിൻ (വീചാറ്റ്) ടെൻസെന്റ് വികസിപ്പിച്ചെടുത്ത ഒരു ഇൻസ്റ്റന്റ് മെസേജിംഗ്, സോഷ്യൽ മീഡിയ, മൊബൈൽ പേയ്‌മെന്റ് ആപ്പാണ്.
    nb_NO: Weixin (WeChat) er en app for direktemeldinger, sosiale medier og mobilbetalinger utviklet av Tencent.
    nl_NL: Weixin (WeChat) is een app voor instant messaging, sociale media en mobiele betalingen, ontwikkeld door Tencent.
    pl_PL: Weixin (WeChat) to aplikacja do przesyłania wiadomości błyskawicznych, obsługi mediów społecznościowych i płatności mobilnych opracowana przez Tencent.
    pt_BR: Weixin (WeChat) é um aplicativo de mensagens instantâneas, redes sociais e pagamentos móveis desenvolvido pela Tencent.
    ro_RO: Weixin (WeChat) este o aplicație de mesagerie instantanee, social media și plată mobilă dezvoltată de Tencent.
    ru_RU: Weixin (WeChat) — это приложение для обмена мгновенными сообщениями, социальных сетей и мобильных платежей, разработанное компанией Tencent.
    sk_SK: Weixin (WeChat) je aplikácia na okamžité zasielanie správ, sociálne médiá a mobilné platby vyvinutá spoločnosťou Tencent.
    sv_SE: Weixin (WeChat) är en app för snabbmeddelanden, sociala medier och mobila betalningar utvecklad av Tencent.
    tr_TR: Weixin (WeChat), Tencent tarafından geliştirilen bir anlık mesajlaşma, sosyal medya ve mobil ödeme uygulamasıdır.
    zh_CN: 微信（WeChat）是腾讯开发的即时通信、社交媒体和移动支付应用。
    zh_TW: 微信（WeChat）是騰訊開發的即時通訊、社交媒體和移動支付應用。
