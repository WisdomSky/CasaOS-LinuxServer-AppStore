name: linuxserver-heimdall
services:
  app:
    image: linuxserver/heimdall:2.8.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: ALLOW_INTERNAL_REQUESTS
          description:
            en_US: By default, Heimdall blocks lookup requests to private or reserved IP addresses, if your instance is not exposed to the internet, or is behind some level of authentication, you can set this to true to allow requests to private IP addresses. [OPTIONAL]
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Heimdall is a way to organise all those links to your most used web sites and web applications in a simple way. Simplicity is the key to Heimdall. Why not use it as your browser start page? It even has the ability to include a search bar using either Google, Bing or DuckDuckGo.
    ca_ES: Heimdall és una manera d'organitzar tots els enllaços als vostres llocs web i aplicacions web més utilitzats d'una manera senzilla. La simplicitat és la clau de Heimdall. Per què no utilitzar-lo com a pàgina d'inici del navegador? Fins i tot té la capacitat d'incloure una barra de cerca mitjançant Google, Bing o DuckDuckGo.
    cs_CZ: Heimdall nabízí jednoduchý způsob, jak uspořádat všechny odkazy na nejčastěji používané webové stránky a webové aplikace. Jednoduchost je klíčem k Heimdallu. Proč ho nepoužít jako úvodní stránku prohlížeče? Dokonce nabízí možnost přidat vyhledávací lištu pomocí Googlu, Bingu nebo DuckDuckGo.
    da_DK: Heimdall er en måde at organisere alle links til dine mest brugte websteder og webapplikationer på en enkel måde. Enkelhed er nøglen til Heimdall. Hvorfor ikke bruge det som din browsers startside? Det har endda muligheden for at inkludere en søgefelt ved hjælp af enten Google, Bing eller DuckDuckGo.
    de_DE: Heimdall ist eine einfache Möglichkeit, all Ihre Links zu Ihren meistgenutzten Websites und Webanwendungen zu organisieren. Einfachheit steht bei Heimdall im Vordergrund. Warum nutzen Sie es nicht als Startseite Ihres Browsers? Es bietet sogar die Möglichkeit, eine Suchleiste für Google, Bing oder DuckDuckGo einzubinden.
    el_GR: Το Heimdall είναι ένας τρόπος για να οργανώσετε όλους αυτούς τους συνδέσμους προς τους πιο χρησιμοποιούμενους ιστότοπους και τις εφαρμογές ιστού σας με απλό τρόπο. Η απλότητα είναι το κλειδί για το Heimdall. Γιατί να μην το χρησιμοποιήσετε ως αρχική σελίδα του προγράμματος περιήγησής σας; Έχει ακόμη και τη δυνατότητα να συμπεριλάβει μια γραμμή αναζήτησης χρησιμοποιώντας είτε την Google, την Bing είτε το DuckDuckGo.
    en_GB: Heimdall is a way to organise all those links to your most used web sites and web applications in a simple way. Simplicity is the key to Heimdall. Why not use it as your browser start page? It even has the ability to include a search bar using either Google, Bing or Duckduckgo.
    es_ES: Heimdall es una herramienta para organizar de forma sencilla todos los enlaces a tus sitios web y aplicaciones más utilizadas. La simplicidad es la clave de Heimdall. ¿Por qué no usarlo como página de inicio de tu navegador? Incluso permite incluir una barra de búsqueda con Google, Bing o DuckDuckGo.
    fr_FR: "Heimdall vous permet d'organiser facilement tous vos liens vers vos sites web et applications les plus utilisés. La simplicité est le maître-mot de Heimdall. Pourquoi ne pas l'utiliser comme page d'accueil de votre navigateur\_? Il offre même la possibilité d'intégrer une barre de recherche avec Google, Bing ou DuckDuckGo."
    ga_IE: Is bealach é Heimdall chun na naisc sin go léir chuig na suíomhanna gréasáin agus na feidhmchláir ghréasáin is mó a úsáideann tú a eagrú ar bhealach simplí. Is í an simplíocht eochair Heimdall. Cén fáth nach n-úsáidfeá é mar leathanach tosaigh do bhrabhsálaí? Tá an cumas ann fiú barra cuardaigh a chur san áireamh ag baint úsáide as Google, Bing nó DuckDuckGo.
    hr_HR: Heimdall je način za jednostavno organiziranje svih poveznica na vaše najčešće korištene web stranice i web aplikacije. Jednostavnost je ključ Heimdalla. Zašto ga ne biste koristili kao početnu stranicu preglednika? Čak ima mogućnost uključivanja trake za pretraživanje pomoću Googlea, Binga ili DuckDuckGoa.
    hu_HU: A Heimdall egy módja annak, hogy egyszerűen rendszerezd a leggyakrabban használt webhelyeidre és webes alkalmazásaidra mutató linkeket. Az egyszerűség a Heimdall kulcsa. Miért ne használnád böngésződ kezdőlapjaként? Még keresősávot is tartalmaz, amely a Google, a Bing vagy a DuckDuckGo keresőmotorjait használja.
    it_IT: Heimdall è un modo semplice per organizzare tutti i link ai siti web e alle applicazioni che utilizzi più frequentemente. La semplicità è la chiave di Heimdall. Perché non usarlo come pagina iniziale del tuo browser? Offre anche la possibilità di includere una barra di ricerca con Google, Bing o DuckDuckGo.
    ja_JP: Heimdallは、よく使うウェブサイトやウェブアプリケーションへのリンクをシンプルに整理できるツールです。シンプルさがHeimdallの最大の特長です。ブラウザのスタートページとして使ってみませんか？Google、Bing、DuckDuckGoのいずれかを使った検索バーも搭載されています。
    ko_KR: Heimdall은 자주 사용하는 웹사이트와 웹 애플리케이션 링크를 간단하게 정리할 수 있는 도구입니다. Heimdall의 핵심은 바로 간편함입니다. 브라우저 시작 페이지로 설정해 보는 건 어떨까요? Google, Bing, DuckDuckGo 등 다양한 검색 엔진을 사용하여 검색창을 추가할 수도 있습니다.
    ml_IN: നിങ്ങളുടെ ഏറ്റവും കൂടുതൽ ഉപയോഗിക്കുന്ന വെബ്‌സൈറ്റുകളിലേക്കും വെബ് ആപ്ലിക്കേഷനുകളിലേക്കുമുള്ള എല്ലാ ലിങ്കുകളും ലളിതമായ രീതിയിൽ ക്രമീകരിക്കാനുള്ള ഒരു മാർഗമാണ് ഹൈംഡാൾ. ലാളിത്യമാണ് ഹൈംഡാലിന്റെ താക്കോൽ. നിങ്ങളുടെ ബ്രൗസർ ആരംഭ പേജായി ഇത് എന്തുകൊണ്ട് ഉപയോഗിച്ചുകൂടാ? ഗൂഗിൾ, ബിംഗ് അല്ലെങ്കിൽ ഡക്ക്ഡക്ക്ഗോ എന്നിവ ഉപയോഗിച്ച് ഒരു തിരയൽ ബാർ ഉൾപ്പെടുത്താനുള്ള കഴിവ് പോലും ഇതിനുണ്ട്.
    nb_NO: Heimdall er en enkel måte å organisere alle lenkene til nettstedene og webapplikasjonene du bruker mest. Enkelhet er nøkkelen til Heimdall. Hvorfor ikke bruke den som startsiden i nettleseren din? Den har til og med muligheten til å inkludere en søkefelt ved hjelp av enten Google, Bing eller DuckDuckGo.
    nl_NL: Heimdall is een manier om al je links naar je meest gebruikte websites en webapplicaties overzichtelijk te organiseren. Eenvoud is de sleutel tot Heimdall. Waarom zou je het niet als startpagina van je browser gebruiken? Je kunt er zelfs een zoekbalk aan toevoegen met Google, Bing of DuckDuckGo.
    pl_PL: Heimdall to prosty sposób na uporządkowanie wszystkich linków do najczęściej używanych stron internetowych i aplikacji internetowych. Prostota jest kluczem do Heimdalla. Dlaczego nie użyć go jako strony startowej przeglądarki? Oferuje nawet możliwość dodania paska wyszukiwania Google, Bing lub DuckDuckGo.
    pt_BR: O Heimdall é uma forma simples de organizar todos os links para os seus sites e aplicativos web mais utilizados. Simplicidade é a chave do Heimdall. Que tal usá-lo como página inicial do seu navegador? Ele ainda oferece a possibilidade de incluir uma barra de pesquisa com o Google, Bing ou DuckDuckGo.
    ro_RO: Heimdall este o modalitate de a organiza toate linkurile către site-urile și aplicațiile web cele mai utilizate într-un mod simplu. Simplitatea este cheia lui Heimdall. De ce să nu îl folosești ca pagină de pornire a browserului tău? Are chiar și capacitatea de a include o bară de căutare folosind Google, Bing sau DuckDuckGo.
    ru_RU: Heimdall — это простой способ упорядочить все ссылки на наиболее часто используемые вами веб-сайты и веб-приложения. Простота — ключ к Heimdall. Почему бы не использовать его в качестве стартовой страницы браузера? Он даже позволяет добавить строку поиска, используя Google, Bing или DuckDuckGo.
    sk_SK: Heimdall je spôsob, ako jednoducho usporiadať všetky odkazy na vaše najpoužívanejšie webové stránky a webové aplikácie. Jednoduchosť je kľúčom k Heimdallu. Prečo ho nepoužívať ako úvodnú stránku prehliadača? Dokonca má možnosť zahrnúť vyhľadávací panel pomocou služieb Google, Bing alebo DuckDuckGo.
    sv_SE: Heimdall är ett sätt att organisera alla länkar till dina mest använda webbplatser och webbapplikationer på ett enkelt sätt. Enkelhet är nyckeln till Heimdall. Varför inte använda det som din webbläsares startsida? Det har till och med möjlighet att inkludera en sökfält med antingen Google, Bing eller DuckDuckGo.
    tr_TR: Heimdall, en çok kullandığınız web sitelerine ve web uygulamalarına ait tüm bağlantıları basit bir şekilde düzenlemenin bir yoludur. Sadeliği, Heimdall'ın anahtarıdır. Neden tarayıcınızın başlangıç sayfası olarak kullanmıyorsunuz? Hatta Google, Bing veya DuckDuckGo kullanarak bir arama çubuğu ekleme özelliği bile var.
    zh_CN: Heimdall 以简单的方式整理你最常使用的网站和网页应用链接。简洁是它的核心，你可以将其设为浏览器起始页。它还可添加使用 Google、Bing 或 DuckDuckGo 的搜索栏。
    zh_TW: Heimdall 以簡單的方式整理你最常使用的網站和網頁應用連結。簡潔是它的核心，你可以將其設為瀏覽器起始頁。它還可新增使用 Google、Bing 或 DuckDuckGo 的搜尋欄。
