name: linuxserver-pairdrop
services:
  app:
    image: linuxserver/pairdrop:1.11.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RATE_LIMIT: ''
      WS_FALLBACK: ''
      RTC_CONFIG: ''
      DEBUG_MODE: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: RATE_LIMIT
          description:
            en_US: Set to true to limit clients to 100 requests per 5 min [OPTIONAL]
        - container: WS_FALLBACK
          description:
            en_US: Set to true to enable websocket fallback if the peer to peer WebRTC connection is not available to the client (see App Setup notes). [OPTIONAL]
        - container: RTC_CONFIG
          description:
            en_US: Path to a json file containing custom STUN/TURN config (see App Setup notes) [OPTIONAL]
        - container: DEBUG_MODE
          description:
            en_US: Set to true to debug the http server configuration by logging clients IP addresses used by PairDrop to STDOUT. See here for more info. Do not use in production! [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pairdrop/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: PairDrop is a sublime alternative to AirDrop that works on all platforms. Send images, documents or text via peer to peer connection to devices in the same local network/Wi-Fi or to paired devices.
    ca_ES: PairDrop és una alternativa excel·lent a AirDrop que funciona en totes les plataformes. Envia imatges, documents o text mitjançant una connexió peer-to-peer a dispositius de la mateixa xarxa local/Wi-Fi o a dispositius emparellats.
    cs_CZ: PairDrop je skvělá alternativa k AirDropu, která funguje na všech platformách. Posílejte obrázky, dokumenty nebo text přes peer-to-peer připojení na zařízení ve stejné místní síti/Wi-Fi nebo na spárovaná zařízení.
    da_DK: PairDrop er et sublimt alternativ til AirDrop, der fungerer på alle platforme. Send billeder, dokumenter eller tekst via peer-to-peer-forbindelse til enheder i det samme lokale netværk/Wi-Fi eller til parrede enheder.
    de_DE: PairDrop ist eine hervorragende Alternative zu AirDrop und funktioniert auf allen Plattformen. Senden Sie Bilder, Dokumente oder Texte per Peer-to-Peer-Verbindung an Geräte im selben lokalen Netzwerk/WLAN oder an gekoppelte Geräte.
    el_GR: Το PairDrop είναι μια εξαιρετική εναλλακτική λύση στο AirDrop που λειτουργεί σε όλες τις πλατφόρμες. Στείλτε εικόνες, έγγραφα ή κείμενο μέσω σύνδεσης peer-to-peer σε συσκευές στο ίδιο τοπικό δίκτυο/Wi-Fi ή σε συζευγμένες συσκευές.
    en_GB: Pairdrop is a sublime alternative to Airdrop that works on all platforms. Send images, documents or text via peer to peer connection to devices in the same local network/Wi-Fi or to paired devices.
    es_ES: PairDrop es una excelente alternativa a AirDrop que funciona en todas las plataformas. Envía imágenes, documentos o texto mediante conexión punto a punto a dispositivos en la misma red local/Wi-Fi o a dispositivos emparejados.
    fr_FR: PairDrop est une excellente alternative à AirDrop, compatible avec toutes les plateformes. Envoyez des images, des documents ou du texte via une connexion peer-to-peer vers des appareils du même réseau local/Wi-Fi ou vers des appareils jumelés.
    ga_IE: Is rogha iontach seachas AirDrop é PairDrop a oibríonn ar gach ardán. Seol íomhánna, doiciméid nó téacs trí nasc piara go piara chuig gléasanna sa líonra áitiúil/Wi-Fi céanna nó chuig gléasanna péireáilte.
    hr_HR: PairDrop je izvrsna alternativa AirDropu koja radi na svim platformama. Šaljite slike, dokumente ili tekst putem peer-to-peer veze na uređaje u istoj lokalnoj mreži/Wi-Fi mreži ili na uparene uređaje.
    hu_HU: A PairDrop egy nagyszerű alternatívája az AirDropnak, amely minden platformon működik. Küldj képeket, dokumentumokat vagy szöveget peer-to-peer kapcsolaton keresztül ugyanazon a helyi hálózaton/Wi-Fi-n lévő eszközökre vagy párosított eszközökre.
    it_IT: PairDrop è un'ottima alternativa ad AirDrop, compatibile con tutte le piattaforme. Invia immagini, documenti o testo tramite connessione peer-to-peer a dispositivi presenti nella stessa rete locale/Wi-Fi o a dispositivi associati.
    ja_JP: PairDropは、あらゆるプラットフォームで動作する、AirDropに代わる優れたサービスです。同じローカルネットワーク/Wi-Fi内のデバイス、またはペアリング済みのデバイスに、ピアツーピア接続で画像、ドキュメント、テキストを送信できます。
    ko_KR: PairDrop은 모든 플랫폼에서 작동하는 AirDrop의 훌륭한 대안입니다. 동일한 로컬 네트워크/Wi-Fi에 있는 기기 또는 페어링된 기기 간에 P2P 연결을 통해 이미지, 문서 또는 텍스트를 전송할 수 있습니다.
    ml_IN: എല്ലാ പ്ലാറ്റ്‌ഫോമുകളിലും പ്രവർത്തിക്കുന്ന എയർഡ്രോപ്പിന് ഒരു മികച്ച ബദലാണ് പെയർഡ്രോപ്പ്. ഒരേ ലോക്കൽ നെറ്റ്‌വർക്കിലെ/വൈ-ഫൈയിലുള്ള ഉപകരണങ്ങളിലേക്കോ ജോടിയാക്കിയ ഉപകരണങ്ങളിലേക്കോ പിയർ ടു പിയർ കണക്ഷൻ വഴി ചിത്രങ്ങൾ, ഡോക്യുമെന്റുകൾ അല്ലെങ്കിൽ ടെക്സ്റ്റ് അയയ്ക്കുക.
    nb_NO: PairDrop er et utsøkt alternativ til AirDrop som fungerer på alle plattformer. Send bilder, dokumenter eller tekst via peer-to-peer-tilkobling til enheter i samme lokale nettverk/Wi-Fi eller til sammenkoblede enheter.
    nl_NL: PairDrop is een uitstekend alternatief voor AirDrop dat op alle platforms werkt. Verstuur afbeeldingen, documenten of tekst via een peer-to-peer-verbinding naar apparaten in hetzelfde lokale netwerk/wifi of naar gekoppelde apparaten.
    pl_PL: PairDrop to doskonała alternatywa dla AirDrop, która działa na wszystkich platformach. Wysyłaj obrazy, dokumenty lub tekst przez połączenie peer-to-peer do urządzeń w tej samej sieci lokalnej/Wi-Fi lub do urządzeń sparowanych.
    pt_BR: O PairDrop é uma excelente alternativa ao AirDrop que funciona em todas as plataformas. Envie imagens, documentos ou textos por meio de uma conexão ponto a ponto para dispositivos na mesma rede local/Wi-Fi ou para dispositivos emparelhados.
    ro_RO: PairDrop este o alternativă excelentă la AirDrop, care funcționează pe toate platformele. Trimiteți imagini, documente sau text prin conexiune peer-to-peer către dispozitive din aceeași rețea locală/Wi-Fi sau către dispozitive asociate.
    ru_RU: PairDrop — это превосходная альтернатива AirDrop, работающая на всех платформах. Отправляйте изображения, документы или текст по одноранговому соединению на устройства в той же локальной сети/Wi-Fi или на сопряженные устройства.
    sk_SK: PairDrop je skvelá alternatíva k AirDropu, ktorá funguje na všetkých platformách. Posielajte obrázky, dokumenty alebo text prostredníctvom peer-to-peer pripojenia na zariadenia v rovnakej lokálnej sieti/Wi-Fi alebo na spárované zariadenia.
    sv_SE: PairDrop är ett sublimt alternativ till AirDrop som fungerar på alla plattformar. Skicka bilder, dokument eller text via peer-to-peer-anslutning till enheter i samma lokala nätverk/Wi-Fi eller till parade enheter.
    tr_TR: PairDrop, tüm platformlarda çalışan, AirDrop'a mükemmel bir alternatiftir. Görüntüleri, belgeleri veya metinleri, aynı yerel ağ/Wi-Fi'deki cihazlara veya eşleştirilmiş cihazlara eşler arası bağlantı üzerinden gönderin.
    zh_CN: PairDrop 是适用于所有平台的 AirDrop 替代工具。它通过点对点连接，将图片、文档或文字发送到同一局域网或 Wi-Fi 下的设备，也可发送到已配对设备。
    zh_TW: PairDrop 是適用於所有平臺的 AirDrop 替代工具。它透過點對點連線，將圖片、文件或文字傳送到同一區域網或 Wi-Fi 下的裝置，也可傳送到已配對裝置。
