name: linuxserver-jackett
services:
  app:
    image: linuxserver/jackett:0.24.2605
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: AUTO_UPDATE
          description:
            en_US: Allow Jackett to update inside of the container. [OPTIONAL]
        - container: RUN_OPTS
          description:
            en_US: Optionally specify additional arguments to be passed. [OPTIONAL]
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/jackett/config
        target: /config
      - type: bind
        source: /DATA/AppData/jackett/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Jackett works as a proxy server: it translates queries from apps (Sonarr, SickRage, CouchPotato, Mylar, etc) into tracker-site-specific http queries, parses the html response, then sends results back to the requesting software. This allows for getting recent uploads (like RSS) and performing searches. Jackett is a single repository of maintained indexer scraping & translation logic - removing the burden from other apps.'
    ca_ES: 'Jackett funciona com a servidor intermediari: tradueix les consultes d''aplicacions (Sonarr, SickRage, CouchPotato, Mylar, etc.) en consultes http específiques del lloc de seguiment, analitza la resposta HTML i després envia els resultats al programari sol·licitant. Això permet obtenir càrregues recents (com ara RSS) i realitzar cerques. Jackett és un repositori únic de lògica de traducció i scraping d''indexadors mantinguda, eliminant la càrrega d''altres aplicacions.'
    cs_CZ: 'Jackett funguje jako proxy server: překládá dotazy z aplikací (Sonarr, SickRage, CouchPotato, Mylar atd.) do http dotazů specifických pro daný tracker, analyzuje HTML odpověď a poté odesílá výsledky zpět do softwaru, který je odeslal. To umožňuje získávání nedávných nahraných souborů (například RSS) a provádění vyhledávání. Jackett je jednotné úložiště udržované logiky pro scraping a překlad indexerů – čímž odstraňuje zátěž z ostatních aplikací.'
    da_DK: 'Jackett fungerer som en proxyserver: den oversætter forespørgsler fra apps (Sonarr, SickRage, CouchPotato, Mylar osv.) til tracker-site-specifikke http-forespørgsler, analyserer html-svaret og sender derefter resultaterne tilbage til den anmodende software. Dette giver mulighed for at hente de seneste uploads (som RSS) og udføre søgninger. Jackett er et enkelt arkiv af vedligeholdt indekserings-scraping og oversættelseslogik - hvilket fjerner byrden fra andre apps.'
    de_DE: 'Jackett fungiert als Proxy-Server: Es übersetzt Anfragen von Anwendungen (Sonarr, SickRage, CouchPotato, Mylar usw.) in Tracker-spezifische HTTP-Anfragen, analysiert die HTML-Antwort und sendet die Ergebnisse an die anfragende Software zurück. Dadurch können aktuelle Uploads (z. B. RSS-Feeds) abgerufen und Suchvorgänge durchgeführt werden. Jackett ist ein zentrales Repository für die Indexierungs- und Übersetzungslogik und entlastet so andere Anwendungen.'
    el_GR: 'Το Jackett λειτουργεί ως διακομιστής μεσολάβησης: μεταφράζει ερωτήματα από εφαρμογές (Sonarr, SickRage, CouchPotato, Mylar, κ.λπ.) σε ερωτήματα http ειδικά για ιστότοπους παρακολούθησης, αναλύει την απόκριση html και, στη συνέχεια, στέλνει τα αποτελέσματα πίσω στο λογισμικό που το ζήτησε. Αυτό επιτρέπει τη λήψη πρόσφατων μεταφορτώσεων (όπως RSS) και την εκτέλεση αναζητήσεων. Το Jackett είναι ένα ενιαίο αποθετήριο διατηρούμενης λογικής συλλογής και μετάφρασης ευρετηρίου - αφαιρώντας το βάρος από άλλες εφαρμογές.'
    en_GB: 'Jackett works as a proxy server: it translates queries from apps (Sonarr, Sickrage, Couchpotato, Mylar, etc) into tracker-site-specific http queries, parses the html response, then sends results back to the requesting software. This allows for getting recent uploads (like Rss) and performing searches. Jackett is a single repository of maintained indexer scraping & translation logic - removing the burden from other apps.'
    es_ES: 'Jackett funciona como un servidor proxy: traduce las consultas de aplicaciones (Sonarr, SickRage, CouchPotato, Mylar, etc.) a consultas HTTP específicas para cada sitio de seguimiento, analiza la respuesta HTML y envía los resultados al software solicitante. Esto permite obtener las últimas actualizaciones (como RSS) y realizar búsquedas. Jackett es un repositorio centralizado de la lógica de indexación, extracción y traducción de datos, lo que libera a otras aplicaciones de esta tarea.'
    fr_FR: "Jackett fonctionne comme un serveur proxy\_: il traduit les requêtes des applications (Sonarr, SickRage, CouchPotato, Mylar, etc.) en requêtes HTTP spécifiques au site du traqueur, analyse la réponse HTML, puis renvoie les résultats au logiciel demandeur. Cela permet de récupérer les dernières mises en ligne (comme les flux RSS) et d'effectuer des recherches. Jackett est un dépôt unique contenant la logique d'indexation et de traduction, maintenue à jour, ce qui allège la charge des autres applications."
    ga_IE: 'Oibríonn Jackett mar fhreastalaí seachfhreastalaí: aistríonn sé fiosrúcháin ó aipeanna (Sonarr, SickRage, CouchPotato, Mylar, srl.) ina bhfiosrúcháin http atá sainiúil don suíomh rianaithe, déanann sé an freagra html a pharsáil, agus ansin seolann sé torthaí ar ais chuig an mbogearra iarrthach. Ligeann sé seo duit uaslódálacha le déanaí (cosúil le RSS) a fháil agus cuardaigh a dhéanamh. Is stór aonair é Jackett de scríobadh innéacsóirí cothabháilte agus loighic aistriúcháin - rud a bhaineann an t-ualach ó aipeanna eile.'
    hr_HR: 'Jackett radi kao proxy poslužitelj: prevodi upite iz aplikacija (Sonarr, SickRage, CouchPotato, Mylar itd.) u http upite specifične za stranicu za praćenje, analizira HTML odgovor, a zatim šalje rezultate natrag softveru koji je poslao zahtjev. To omogućuje dobivanje nedavnih prijenosa (poput RSS-a) i pretraživanje. Jackett je jedinstveno spremište održavane logike indeksiranja, struganja i prevođenja - uklanjajući teret s drugih aplikacija.'
    hu_HU: 'A Jackett proxy szerverként működik: alkalmazásokból (Sonarr, SickRage, CouchPotato, Mylar stb.) érkező lekérdezéseket nyomkövető-webhely-specifikus http lekérdezésekké alakítja, elemzi a html választ, majd visszaküldi az eredményeket a kérő szoftvernek. Ez lehetővé teszi a legutóbbi feltöltések (például RSS) lekérését és keresések végrehajtását. A Jackett egyetlen, karbantartott indexelő adattár, amely adatgyűjtési és fordítási logikát tartalmaz – leveszi a terhet a többi alkalmazás válláról.'
    it_IT: 'Jackett funziona come un server proxy: traduce le query provenienti da app (Sonarr, SickRage, CouchPotato, Mylar, ecc.) in query HTTP specifiche per i siti di tracker, analizza la risposta HTML e invia i risultati al software richiedente. Questo permette di ottenere i caricamenti recenti (come i feed RSS) ed effettuare ricerche. Jackett è un unico repository di logica di scraping e traduzione per gli indicizzatori, che viene gestito in modo centralizzato, sollevando le altre app da questo onere.'
    ja_JP: Jackettはプロキシサーバーとして機能します。アプリ（Sonarr、SickRage、CouchPotato、Mylarなど）からのクエリをトラッカーサイト固有のHTTPクエリに変換し、HTMLレスポンスを解析して、結果をリクエスト元のソフトウェアに返送します。これにより、RSSなどの最新アップロードを取得したり、検索を実行したりすることが可能になります。Jackettは、メンテナンスされたインデクサーのスクレイピングおよび変換ロジックを単一のリポジトリに集約することで、他のアプリの負担を軽減します。
    ko_KR: Jackett은 프록시 서버 역할을 합니다. Sonarr, SickRage, CouchPotato, Mylar 등의 앱에서 들어오는 쿼리를 트래커 사이트별 HTTP 쿼리로 변환하고, HTML 응답을 파싱한 후 결과를 요청한 소프트웨어로 다시 전송합니다. 이를 통해 최근 업로드된 콘텐츠(RSS처럼)를 가져오거나 검색을 수행할 수 있습니다. Jackett은 인덱서 스크래핑 및 변환 로직을 관리하는 단일 저장소로서, 다른 앱들의 부담을 덜어줍니다.
    ml_IN: 'ജാക്കറ്റ് ഒരു പ്രോക്സി സെർവറായി പ്രവർത്തിക്കുന്നു: ഇത് ആപ്പുകളിൽ നിന്നുള്ള അന്വേഷണങ്ങളെ (Sonarr, SickRage, CouchPotato, Mylar, മുതലായവ) ട്രാക്കർ-സൈറ്റ്-നിർദ്ദിഷ്ട http അന്വേഷണങ്ങളിലേക്ക് വിവർത്തനം ചെയ്യുന്നു, html പ്രതികരണം പാഴ്‌സ് ചെയ്യുന്നു, തുടർന്ന് അഭ്യർത്ഥിക്കുന്ന സോഫ്റ്റ്‌വെയറിലേക്ക് ഫലങ്ങൾ തിരികെ അയയ്ക്കുന്നു. ഇത് സമീപകാല അപ്‌ലോഡുകൾ (RSS പോലുള്ളവ) നേടുന്നതിനും തിരയലുകൾ നടത്തുന്നതിനും അനുവദിക്കുന്നു. മറ്റ് ആപ്പുകളിൽ നിന്നുള്ള ഭാരം നീക്കം ചെയ്യുന്നതിലൂടെ ഇൻഡെക്‌സർ സ്‌ക്രാപ്പിംഗിന്റെയും വിവർത്തന ലോജിക്കിന്റെയും ഒരു ശേഖരമാണ് ജാക്കറ്റ്.'
    nb_NO: 'Jackett fungerer som en proxy-server: den oversetter spørringer fra apper (Sonarr, SickRage, CouchPotato, Mylar osv.) til nettstedsspesifikke http-spørringer for trackere, analyserer html-svaret og sender deretter resultatene tilbake til programvaren som ber om det. Dette gjør det mulig å hente nylige opplastinger (som RSS) og utføre søk. Jackett er et enkelt arkiv for vedlikeholdt indekseringsskraping og oversettelseslogikk – noe som fjerner byrden fra andre apper.'
    nl_NL: 'Jackett werkt als een proxyserver: het vertaalt query''s van apps (Sonarr, SickRage, CouchPotato, Mylar, enz.) naar HTTP-query''s die specifiek zijn voor de betreffende tracker-site, analyseert de HTML-respons en stuurt de resultaten vervolgens terug naar de aanvragende software. Dit maakt het mogelijk om recente uploads (zoals RSS) op te halen en zoekopdrachten uit te voeren. Jackett is een centrale opslagplaats voor onderhouden indexerings-, scraping- en vertaallogica, waardoor andere apps worden ontlast.'
    pl_PL: 'Jackett działa jako serwer proxy: tłumaczy zapytania z aplikacji (Sonarr, SickRage, CouchPotato, Mylar itp.) na zapytania HTTP specyficzne dla danej witryny śledzącej, analizuje odpowiedź HTML, a następnie odsyła wyniki do oprogramowania, które ją przesłało. Pozwala to na pobieranie ostatnio przesłanych plików (np. RSS) i przeprowadzanie wyszukiwań. Jackett to pojedyncze repozytorium zarządzanej logiki scrapowania i tłumaczenia indeksera, odciążając inne aplikacje.'
    pt_BR: 'O Jackett funciona como um servidor proxy: ele traduz consultas de aplicativos (Sonarr, SickRage, CouchPotato, Mylar, etc.) em consultas HTTP específicas para cada site de rastreamento, analisa a resposta HTML e envia os resultados de volta para o software solicitante. Isso permite obter uploads recentes (como RSS) e realizar buscas. O Jackett é um repositório único com lógica de indexação, raspagem e tradução mantida, aliviando a carga de outros aplicativos.'
    ro_RO: 'Jackett funcționează ca un server proxy: traduce interogările din aplicații (Sonarr, SickRage, CouchPotato, Mylar etc.) în interogări http specifice site-ului de tracker, analizează răspunsul HTML, apoi trimite rezultatele înapoi către software-ul solicitant. Acest lucru permite obținerea de încărcări recente (cum ar fi RSS) și efectuarea de căutări. Jackett este un depozit unic de logica de extragere și traducere a indexului - eliminând povara altor aplicații.'
    ru_RU: 'Jackett работает как прокси-сервер: он преобразует запросы от приложений (Sonarr, SickRage, CouchPotato, Mylar и т. д.) в HTTP-запросы, специфичные для сайтов-трекеров, анализирует HTML-ответ, а затем отправляет результаты обратно запрашивающему программному обеспечению. Это позволяет получать последние загрузки (например, RSS) и выполнять поиск. Jackett представляет собой единое хранилище поддерживаемой логики индексирования и преобразования, снимая нагрузку с других приложений.'
    sk_SK: 'Jackett funguje ako proxy server: prekladá dotazy z aplikácií (Sonarr, SickRage, CouchPotato, Mylar atď.) do http dotazov špecifických pre danú lokalitu sledovania, analyzuje HTML odpoveď a potom odosiela výsledky späť do softvéru, ktorý odoslal žiadosť. To umožňuje získavať najnovšie nahrané súbory (napríklad RSS) a vykonávať vyhľadávania. Jackett je jednotné úložisko udržiavanej logiky indexovania, zoškrabávania a prekladu – čím odstraňuje záťaž z iných aplikácií.'
    sv_SE: 'Jackett fungerar som en proxyserver: den översätter frågor från appar (Sonarr, SickRage, CouchPotato, Mylar, etc.) till webbplatsspecifika http-frågor för spårningssidan, analyserar html-svaret och skickar sedan tillbaka resultaten till den begärande programvaran. Detta möjliggör att hämta senaste uppladdningar (som RSS) och utföra sökningar. Jackett är en enda databaser för underhållen indexeringsskrapning och översättningslogik - vilket tar bort bördan från andra appar.'
    tr_TR: 'Jackett bir proxy sunucusu gibi çalışır: uygulamalardan (Sonarr, SickRage, CouchPotato, Mylar vb.) gelen sorguları izleme sitesine özgü HTTP sorgularına çevirir, HTML yanıtını ayrıştırır ve ardından sonuçları talep eden yazılıma geri gönderir. Bu, son yüklemeleri (RSS gibi) almayı ve arama yapmayı mümkün kılar. Jackett, diğer uygulamaların yükünü ortadan kaldırarak, bakımı yapılan indeksleme, kazıma ve çeviri mantığının tek bir deposudur.'
    zh_CN: Jackett 充当代理服务器，将 Sonarr、SickRage、CouchPotato、Mylar 等应用的查询转换为各个 Tracker 站点所需的 HTTP 查询，解析返回的 HTML，再将结果发送给请求应用。它支持获取最新上传内容（类似 RSS）和执行搜索。Jackett 集中维护索引站点的抓取与转换逻辑，减轻其他应用的维护负担。
    zh_TW: Jackett 充當代理伺服器，將 Sonarr、SickRage、CouchPotato、Mylar 等應用的查詢轉換為各個 Tracker 站點所需的 HTTP 查詢，解析返回的 HTML，再將結果傳送給請求應用。它支援獲取最新上傳內容（類似 RSS）和執行搜尋。Jackett 集中維護索引站點的抓取與轉換邏輯，減輕其他應用的維護負擔。
