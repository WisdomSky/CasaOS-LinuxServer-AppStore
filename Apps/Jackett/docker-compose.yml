    ga_IE: 'Oibríonn sé mar fhreastalaí seachfhreastalaí: aistríonn sé fiosrúcháin ó aipeanna (Sonarr, SickRage, CouchPotato, Mylar, srl.) ina bhfiosrúcháin http atá sainiúil don suíomh rianaithe, déanann sé an freagra html a pharsáil, agus ansin seolann sé torthaí ar ais chuig an mbogearra iarrthach. Ligeann sé seo duit uaslódálacha le déanaí (cosúil le RSS) a fháil agus cuardaigh a dhéanamh. Is stór aonair é Jackett de scríobadh innéacsóirí cothabháilte agus loighic aistriúcháin - rud a bhaineann an t-ualach ó aipeanna eile.'
    hr_HR: 'Radi kao proxy poslužitelj: prevodi upite iz aplikacija (Sonarr, SickRage, CouchPotato, Mylar, itd.) u http upite specifične za stranicu za praćenje, analizira HTML odgovor, a zatim šalje rezultate natrag softveru koji je poslao zahtjev. To omogućuje dobivanje nedavnih prijenosa (poput RSS-a) i pretraživanje. Jackett je jedinstveno spremište održavane logike indeksiranja, struganja i prevođenja - uklanjajući teret s drugih aplikacija.'
    hu_HU: 'Proxy szerverként működik: alkalmazásokból (Sonarr, SickRage, CouchPotato, Mylar stb.) érkező lekérdezéseket nyomkövető-webhely-specifikus http lekérdezésekké alakítja, elemzi a html választ, majd visszaküldi az eredményeket a kérő szoftvernek. Ez lehetővé teszi a legutóbbi feltöltések (például RSS) lekérését és keresések végrehajtását. A Jackett egyetlen adattár, amely karbantartott indexelő adatkaparási és fordítási logikát tartalmaz – leveszi a terhet a többi alkalmazás válláról.'
    it_IT: 'Funziona come un server proxy: traduce le query provenienti da app (Sonarr, SickRage, CouchPotato, Mylar, ecc.) in query HTTP specifiche per i siti di tracker, analizza la risposta HTML e invia i risultati al software richiedente. Ciò consente di ottenere i caricamenti recenti (come RSS) ed effettuare ricerche. Jackett è un repository unico di logiche di scraping e traduzione per gli indicizzatori, che viene gestito in modo centralizzato, sollevando le altre app da questo onere.'
    ja_JP: プロキシサーバーとして機能します。アプリ（Sonarr、SickRage、CouchPotato、Mylarなど）からのクエリをトラッカーサイト固有のHTTPクエリに変換し、HTMLレスポンスを解析して、結果をリクエスト元のソフトウェアに返送します。これにより、最新のアップロード（RSSなど）を取得したり、検索を実行したりできます。Jackettは、メンテナンスされたインデクサーのスクレイピングと変換ロジックを単一のリポジトリに集約することで、他のアプリの負担を軽減します。
    ko_KR: Jackett은 프록시 서버 역할을 합니다. Sonarr, SickRage, CouchPotato, Mylar 등의 앱에서 들어오는 쿼리를 트래커 사이트별 HTTP 쿼리로 변환하고, HTML 응답을 파싱한 후 결과를 요청한 소프트웨어로 다시 전송합니다. 이를 통해 최근 업로드된 콘텐츠(RSS처럼)를 가져오거나 검색을 수행할 수 있습니다. Jackett은 인덱서 스크래핑 및 변환 로직을 관리하는 단일 저장소로서, 다른 앱들의 부담을 덜어줍니다.
    ml_IN: 'ഒരു പ്രോക്സി സെർവറായി പ്രവർത്തിക്കുന്നു: ഇത് ആപ്പുകളിൽ നിന്നുള്ള അന്വേഷണങ്ങളെ (Sonarr, SickRage, CouchPotato, Mylar, മുതലായവ) ട്രാക്കർ-സൈറ്റ്-നിർദ്ദിഷ്ട http അന്വേഷണങ്ങളിലേക്ക് വിവർത്തനം ചെയ്യുന്നു, html പ്രതികരണം പാഴ്‌സ് ചെയ്യുന്നു, തുടർന്ന് അഭ്യർത്ഥിക്കുന്ന സോഫ്റ്റ്‌വെയറിലേക്ക് ഫലങ്ങൾ തിരികെ അയയ്ക്കുന്നു. ഇത് സമീപകാല അപ്‌ലോഡുകൾ (RSS പോലുള്ളവ) നേടുന്നതിനും തിരയലുകൾ നടത്തുന്നതിനും അനുവദിക്കുന്നു. മറ്റ് ആപ്പുകളിൽ നിന്നുള്ള ഭാരം നീക്കം ചെയ്യുന്നതിലൂടെ, ഇൻഡെക്‌സർ സ്‌ക്രാപ്പിംഗിന്റെയും വിവർത്തന ലോജിക്കിന്റെയും ഒരു ശേഖരമാണ് ജാക്കറ്റ്.'
    nb_NO: 'Fungerer som en proxy-server: den oversetter spørringer fra apper (Sonarr, SickRage, CouchPotato, Mylar osv.) til nettstedsspesifikke http-spørringer for trackere, analyserer html-svaret og sender deretter resultatene tilbake til programvaren som ber om det. Dette gjør det mulig å hente nylige opplastinger (som RSS) og utføre søk. Jackett er et enkelt arkiv for vedlikeholdt indekseringsskraping og oversettelseslogikk – noe som fjerner byrden fra andre apper.'
    nl_NL: 'Jackett werkt als een proxyserver: het vertaalt query''s van apps (Sonarr, SickRage, CouchPotato, Mylar, enz.) naar HTTP-query''s die specifiek zijn voor de betreffende tracker-site, analyseert de HTML-respons en stuurt de resultaten vervolgens terug naar de aanvragende software. Dit maakt het mogelijk om recente uploads (zoals RSS) op te halen en zoekopdrachten uit te voeren. Jackett is een centrale opslagplaats voor onderhouden indexerings-, scraping- en vertaallogica, waardoor andere apps worden ontlast.'
    pl_PL: 'Działa jako serwer proxy: tłumaczy zapytania z aplikacji (Sonarr, SickRage, CouchPotato, Mylar itp.) na zapytania HTTP specyficzne dla danej witryny śledzącej, analizuje odpowiedź HTML, a następnie odsyła wyniki do oprogramowania, które ją przesłało. Umożliwia to pobieranie ostatnio przesłanych plików (np. RSS) i przeprowadzanie wyszukiwań. Jackett to pojedyncze repozytorium zarządzanej logiki scrapowania i tłumaczenia indeksera, odciążające inne aplikacje.'
    pt_BR: 'Funciona como um servidor proxy: traduz consultas de aplicativos (Sonarr, SickRage, CouchPotato, Mylar, etc.) em consultas HTTP específicas para cada site de rastreamento, analisa a resposta HTML e envia os resultados de volta para o software solicitante. Isso permite obter uploads recentes (como RSS) e realizar buscas. O Jackett é um repositório único com lógica de indexação e tradução, que é mantida, aliviando a carga de outros aplicativos.'
    ro_RO: 'Funcționează ca server proxy: traduce interogările din aplicații (Sonarr, SickRage, CouchPotato, Mylar etc.) în interogări http specifice site-ului de tracker, analizează răspunsul HTML, apoi trimite rezultatele înapoi către software-ul solicitant. Acest lucru permite obținerea de încărcări recente (cum ar fi RSS) și efectuarea de căutări. Jackett este un depozit unic de logica de extragere și traducere a indexului - eliminând povara altor aplicații.'
    ru_RU: 'Работает как прокси-сервер: он преобразует запросы из приложений (Sonarr, SickRage, CouchPotato, Mylar и т. д.) в HTTP-запросы, специфичные для сайтов-трекеров, анализирует HTML-ответ, а затем отправляет результаты обратно запрашивающему программному обеспечению. Это позволяет получать последние загрузки (например, RSS) и выполнять поиск. Jackett — это единое хранилище поддерживаемой логики индексирования и преобразования, снимающее нагрузку с других приложений.'
    sk_SK: 'Funguje ako proxy server: prekladá dotazy z aplikácií (Sonarr, SickRage, CouchPotato, Mylar atď.) do http dotazov špecifických pre danú lokalitu sledovania, analyzuje HTML odpoveď a potom odosiela výsledky späť do softvéru, ktorý odoslal žiadosť. To umožňuje získavať najnovšie nahrané súbory (napríklad RSS) a vykonávať vyhľadávania. Jackett je jednotné úložisko udržiavanej logiky indexovania, zoškrabávania a prekladu – čím odstraňuje záťaž z iných aplikácií.'
    sv_SE: 'Fungerar som en proxyserver: den översätter frågor från appar (Sonarr, SickRage, CouchPotato, Mylar, etc.) till webbplatsspecifika http-frågor för spårningswebbplatsen, analyserar html-svaret och skickar sedan tillbaka resultaten till den begärande programvaran. Detta möjliggör att hämta senaste uppladdningar (som RSS) och utföra sökningar. Jackett är en enda databaser för underhållen indexeringsskrapning och översättningslogik - vilket tar bort bördan från andra appar.'
    tr_TR: 'Bir proxy sunucusu gibi çalışır: uygulamalardan (Sonarr, SickRage, CouchPotato, Mylar vb.) gelen sorguları izleme sitesine özgü HTTP sorgularına çevirir, HTML yanıtını ayrıştırır ve ardından sonuçları talep eden yazılıma geri gönderir. Bu, son yüklemeleri (RSS gibi) almayı ve arama yapmayı sağlar. Jackett, diğer uygulamaların yükünü ortadan kaldırarak, bakımı yapılan indeksleme, kazıma ve çeviri mantığının tek bir deposudur.'
    zh_CN: 将媒体应用的查询转换为各索引站点的请求。
    zh_TW: 將媒體應用的查詢轉換為各索引站點的請求。
