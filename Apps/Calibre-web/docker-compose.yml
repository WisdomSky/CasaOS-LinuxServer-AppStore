    pt_BR: Um aplicativo web que oferece uma interface limpa para navegar, ler e baixar eBooks usando um banco de dados Calibre existente. Também é possível integrar o Google Drive e editar metadados e sua biblioteca Calibre diretamente pelo aplicativo. Este software é um fork da biblioteca Calibre e licenciado sob a licença GPL v3.
    ro_RO: O aplicație web care oferă o interfață curată pentru navigarea, citirea și descărcarea cărților electronice folosind o bază de date Calibre existentă. De asemenea, este posibilă integrarea Google Drive și editarea metadatelor și a bibliotecii Calibre prin intermediul aplicației în sine. Acest software este o ramură a bibliotecii și este licențiat sub licența GPL v3.
    ru_RU: Веб-приложение, предоставляющее удобный интерфейс для просмотра, чтения и загрузки электронных книг с использованием существующей базы данных Calibre. Также возможна интеграция с Google Drive и редактирование метаданных и вашей библиотеки Calibre через само приложение. Это программное обеспечение является форком библиотеки и распространяется под лицензией GPL v3.
    sk_SK: Webová aplikácia poskytujúca prehľadné rozhranie na prehliadanie, čítanie a sťahovanie elektronických kníh pomocou existujúcej databázy Calibre. Je tiež možné integrovať Disk Google a upravovať metadáta a vašu knižnicu Calibre prostredníctvom samotnej aplikácie. Tento softvér je fork knižnice a je licencovaný pod licenciou GPL v3.
    sv_SE: En webbapp som erbjuder ett rent gränssnitt för att bläddra, läsa och ladda ner e-böcker med hjälp av en befintlig Calibre-databas. Det är också möjligt att integrera Google Drive och redigera metadata och ditt Calibre-bibliotek via själva appen. Denna programvara är en förgrening av bibliotek och licensierad under GPL v3-licensen.
    tr_TR: Mevcut bir Calibre veritabanını kullanarak e-kitaplara göz atma, okuma ve indirme işlemlerini kolaylaştıran, sade bir arayüze sahip bir web uygulaması. Ayrıca Google Drive entegrasyonu, meta verilerin düzenlenmesi ve Calibre kütüphanenizin doğrudan uygulama üzerinden yönetilmesi de mümkün. Bu yazılım, Library'nin bir türevidir ve GPL v3 Lisansı altında lisanslanmıştır.
    zh_CN: 通过网页浏览、阅读和下载 Calibre 书库中的电子书。
    zh_TW: 透過網頁瀏覽、閱讀和下載 Calibre 書庫中的電子書。
