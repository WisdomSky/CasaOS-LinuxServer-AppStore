name: linuxserver-qemu-static
services:
  app:
    image: linuxserver/qemu-static:10.0.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qemu-static/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: This container needs special attention. Please check https://hub.docker.com/r/linuxserver/qemu-static for details.
    zh_CN: 此容器需要特别注意。使用前请阅读相关说明：https://hub.docker.com/r/linuxserver/qemu-static
  tagline:
    en_US: This container needs special attention. Please check https://hub. Docker. Com/r/linuxserver/qemu-static for details.
    zh_CN: 此容器需要特殊配置，请先阅读使用说明。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/qemu-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/qemu-logo.png
  title:
    en_US: Qemu static (LinuxServer.io)
    zh_CN: Qemu static（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverqemustatic
  port_map: '80'
  version: 10.0.2
