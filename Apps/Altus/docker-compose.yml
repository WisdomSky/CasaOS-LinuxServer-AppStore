name: linuxserver-altus
services:
  app:
    image: linuxserver/altus:5.8.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Altus is an Electron-based WhatsApp client with themes and multiple account support.
    zh_CN: Altus 是基于 Electron 的 WhatsApp 客户端，支持主题和多个账户。
  tagline:
    en_US: An Electron-based WhatsApp client with themes and multiple account support.
    zh_CN: 支持主题和多账户的 WhatsApp 桌面客户端。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/altus-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/altus-logo.png
  title:
    en_US: Altus (LinuxServer.io)
    zh_CN: Altus（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserveraltus
  port_map: '3000'
  version: 5.8.1
