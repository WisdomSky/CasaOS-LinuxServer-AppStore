    en_GB: Gives you access to all your files wherever you are. Where are your photos and documents. With Nextcloud you pick a server of your choice, at home, in a data centre or at a provider. And that is where your files will be. Nextcloud runs on that server, protecting your data and giving you access from your desktop or mobile devices. Through Nextcloud you also access, sync and share your existing data on that Ftp drive at the office, a Dropbox or a Nas you have at home.
    es_ES: 'Te da acceso a todos tus archivos estés donde estés. ¿Dónde están tus fotos y documentos? Con Nextcloud, eliges el servidor que prefieras: en casa, en un centro de datos o con un proveedor. Ahí se almacenarán tus archivos. Nextcloud se ejecuta en ese servidor, protegiendo tus datos y permitiéndote acceder a ellos desde tu ordenador o dispositivos móviles. A través de Nextcloud, también puedes acceder, sincronizar y compartir tus datos existentes en esa unidad FTP de la oficina, en Dropbox o en un NAS que tengas en casa.'
    fr_FR: "Nextcloud vous donne accès à tous vos fichiers, où que vous soyez. Où sont vos photos et vos documents\_? Avec Nextcloud, vous choisissez le serveur de votre choix\_: à domicile, dans un centre de données ou chez un fournisseur. Vos fichiers y seront stockés. Nextcloud s'exécute sur ce serveur, protégeant vos données et vous permettant d'y accéder depuis votre ordinateur ou vos appareils mobiles. Grâce à Nextcloud, vous pouvez également accéder à vos données existantes, les synchroniser et les partager\_: disque FTP au bureau, compte Dropbox ou NAS à domicile."
    ga_IE: Tugann sé rochtain duit ar do chuid comhad go léir cibé áit a bhfuil tú. Cá bhfuil do ghrianghraif agus do dhoiciméid. Le Nextcloud roghnaíonn tú freastalaí de do rogha féin, sa bhaile, in ionad sonraí nó ag soláthraí. Agus sin an áit a mbeidh do chuid comhad. Ritheann Nextcloud ar an bhfreastalaí sin, ag cosaint do shonraí agus ag tabhairt rochtana duit ó do dheasc nó ó do ghléasanna soghluaiste. Trí Nextcloud is féidir leat rochtain a fháil ar do shonraí atá ann cheana féin ar an tiomántán FTP sin san oifig, ar Dropbox nó ar NAS atá agat sa bhaile, iad a shioncronú agus a roinnt freisin.
    hr_HR: Omogućuje vam pristup svim vašim datotekama gdje god se nalazili. Gdje su vaše fotografije i dokumenti. S Nextcloudom birate poslužitelj po svom izboru, kod kuće, u podatkovnom centru ili kod davatelja usluga. I tu će se nalaziti vaše datoteke. Nextcloud radi na tom poslužitelju, štiteći vaše podatke i dajući vam pristup s vašeg računala ili mobilnih uređaja. Putem Nextclouda također pristupate, sinkronizirate i dijelite svoje postojeće podatke na tom FTP disku u uredu, Dropboxu ili NAS-u koji imate kod kuće.
    hu_HU: 'Hozzáférést biztosít minden fájlodhoz, bárhol is vagy. Hol vannak a fotóid és a dokumentumaid? A Nextclouddal kiválaszthatod a kívánt szervert: otthon, egy adatközpontban vagy egy szolgáltatónál. És ott lesznek a fájljaid. A Nextcloud ezen a szerveren fut, védi az adataidat, és hozzáférést biztosít asztali számítógépedről vagy mobileszközeidről. A Nextcloudon keresztül elérheted, szinkronizálhatod és megoszthatod a meglévő adataidat az irodai FTP-meghajtón, egy Dropboxon vagy egy otthoni NAS-on.'
    it_IT: Ti dà accesso a tutti i tuoi file ovunque tu sia. Dove sono le tue foto e i tuoi documenti? Con Nextcloud scegli un server a tua scelta, a casa, in un data center o presso un provider. Ed è lì che saranno archiviati i tuoi file. Nextcloud viene eseguito su quel server, proteggendo i tuoi dati e consentendoti di accedervi dal tuo computer o dai tuoi dispositivi mobili. Tramite Nextcloud puoi anche accedere, sincronizzare e condividere i tuoi dati esistenti su un'unità FTP in ufficio, su Dropbox o su un NAS che hai a casa.
    ja_JP: どこにいてもすべてのファイルにアクセスできます。写真やドキュメントはどこに保存されていますか？ Nextcloud では、自宅、データセンター、プロバイダーなど、お好みのサーバーを選択できます。ファイルはそこに保存されます。Nextcloud はそのサーバー上で動作し、データを保護し、デスクトップやモバイルデバイスからアクセスできるようにします。Nextcloud を通じて、オフィスの FTP ドライブ、Dropbox、自宅の NAS などにある既存のデータにアクセス、同期、共有することもできます。
    ko_KR: 어디에 있든 모든 파일에 액세스할 수 있습니다. 사진과 문서가 어디에 있나요? Nextcloud를 사용하면 집, 데이터 센터 또는 제공업체의 서버 등 원하는 서버를 선택할 수 있습니다. 그러면 파일이 해당 서버에 저장됩니다. Nextcloud는 선택한 서버에서 실행되어 데이터를 보호하고 데스크톱이나 모바일 기기에서 액세스할 수 있도록 해줍니다. Nextcloud를 통해 사무실의 FTP 드라이브, Dropbox 또는 집의 NAS에 있는 기존 데이터에도 액세스하고 동기화하고 공유할 수 있습니다.
    ml_IN: നിങ്ങൾ എവിടെയായിരുന്നാലും നിങ്ങളുടെ എല്ലാ ഫയലുകളിലേക്കും ആക്‌സസ് നൽകുന്നു. നിങ്ങളുടെ ഫോട്ടോകളും ഡോക്യുമെന്റുകളും എവിടെയാണ്. നെക്സ്റ്റ്ക്ലൗഡ് ഉപയോഗിച്ച് നിങ്ങൾക്ക് ഇഷ്ടമുള്ള ഒരു സെർവർ വീട്ടിൽ, ഒരു ഡാറ്റാ സെന്ററിൽ അല്ലെങ്കിൽ ഒരു ദാതാവിൽ നിന്ന് തിരഞ്ഞെടുക്കാം. അവിടെയാണ് നിങ്ങളുടെ ഫയലുകൾ ഉണ്ടാകുക. നെക്സ്റ്റ്ക്ലൗഡ് ആ സെർവറിൽ പ്രവർത്തിക്കുന്നു, നിങ്ങളുടെ ഡാറ്റ സംരക്ഷിക്കുകയും നിങ്ങളുടെ ഡെസ്‌ക്‌ടോപ്പിൽ നിന്നോ മൊബൈൽ ഉപകരണങ്ങളിൽ നിന്നോ ആക്‌സസ് നൽകുകയും ചെയ്യുന്നു. നെക്സ്റ്റ്ക്ലൗഡ് വഴി ഓഫീസിലെ ആ FTP ഡ്രൈവിലോ, ഡ്രോപ്പ്‌ബോക്‌സിലോ, വീട്ടിലുള്ള ഒരു NAS-ലോ നിങ്ങളുടെ നിലവിലുള്ള ഡാറ്റ ആക്‌സസ് ചെയ്യുകയും സമന്വയിപ്പിക്കുകയും പങ്കിടുകയും ചെയ്യുന്നു.
    nb_NO: Gir deg tilgang til alle filene dine uansett hvor du er. Hvor er bildene og dokumentene dine? Med Nextcloud velger du en server du ønsker, hjemme, i et datasenter eller hos en leverandør. Og det er der filene dine vil være. Nextcloud kjører på den serveren, beskytter dataene dine og gir deg tilgang fra skrivebordet eller mobilenhetene dine. Gjennom Nextcloud får du også tilgang til, synkroniserer og deler eksisterende data på FTP-stasjonen på kontoret, en Dropbox eller en NAS du har hjemme.
    nl_NL: 'Nextcloud geeft je overal toegang tot al je bestanden. Waar je foto''s en documenten ook zijn. Met Nextcloud kies je een server naar keuze: thuis, in een datacenter of bij een provider. En daar worden je bestanden opgeslagen. Nextcloud draait op die server, beschermt je gegevens en geeft je toegang vanaf je desktop of mobiele apparaten. Via Nextcloud kun je ook je bestaande gegevens op die FTP-schijf op kantoor, een Dropbox of een NAS thuis openen, synchroniseren en delen.'
    pl_PL: Zapewnia dostęp do wszystkich plików, gdziekolwiek jesteś. Gdzie są Twoje zdjęcia i dokumenty? Z NextCloud wybierasz serwer – w domu, w centrum danych lub u dostawcy. I to właśnie tam będą Twoje pliki. NextCloud działa na tym serwerze, chroniąc Twoje dane i zapewniając dostęp z komputera stacjonarnego lub urządzeń mobilnych. Za pośrednictwem NextCloud możesz również uzyskać dostęp, synchronizować i udostępniać istniejące dane na dysku FTP w biurze, Dropboxie lub domowym serwerze NAS.
    pt_BR: 'Dá-lhe acesso a todos os seus ficheiros onde quer que esteja. Onde estão as suas fotos e documentos? Com o Nextcloud, escolhe o servidor que preferir: em casa, num centro de dados ou num fornecedor. E é aí que os seus ficheiros ficarão armazenados. O Nextcloud funciona nesse servidor, protegendo os seus dados e permitindo-lhe aceder a eles a partir do seu computador ou dispositivos móveis. Através do Nextcloud, também pode aceder, sincronizar e partilhar os seus dados existentes na sua unidade FTP do escritório, no Dropbox ou num NAS que tenha em casa.'
    ro_RO: Îți oferă acces la toate fișierele tale oriunde te-ai afla. Unde sunt fotografiile și documentele tale? Cu Nextcloud alegi un server la alegere, acasă, într-un centru de date sau la un furnizor. Și acolo vor fi fișierele tale. Nextcloud rulează pe acel server, protejându-ți datele și oferindu-ți acces de pe desktop sau de pe dispozitivele mobile. Prin intermediul Nextcloud, accesezi, sincronizezi și partajezi datele existente pe unitatea FTP de la birou, pe un Dropbox sau pe un NAS pe care îl ai acasă.
    ru_RU: 'Nextcloud предоставляет вам доступ ко всем вашим файлам, где бы вы ни находились. Где хранятся ваши фотографии и документы? С Nextcloud вы выбираете сервер по своему усмотрению: дома, в центре обработки данных или у провайдера. И именно там будут храниться ваши файлы. Nextcloud работает на этом сервере, защищая ваши данные и предоставляя вам доступ с вашего настольного компьютера или мобильных устройств. Через Nextcloud вы также получаете доступ, синхронизируете и обмениваетесь существующими данными на FTP-диске в офисе, Dropbox или NAS-сервере дома.'
    sk_SK: Poskytuje vám prístup ku všetkým vašim súborom, nech ste kdekoľvek. Kde sú vaše fotografie a dokumenty? S Nextcloudom si vyberiete server podľa vlastného výberu, či už doma, v dátovom centre alebo u poskytovateľa. A tam budú vaše súbory. Nextcloud beží na tomto serveri, chráni vaše dáta a poskytuje vám prístup z vášho počítača alebo mobilných zariadení. Prostredníctvom Nextcloudu tiež pristupujete, synchronizujete a zdieľate svoje existujúce dáta na danom FTP disku v kancelárii, Dropboxe alebo NAS, ktorý máte doma.
    sv_SE: Ger dig tillgång till alla dina filer var du än är. Var finns dina foton och dokument? Med Nextcloud väljer du en server du själv väljer, hemma, i ett datacenter eller hos en leverantör. Och det är där dina filer kommer att finnas. Nextcloud körs på den servern, skyddar dina data och ger dig åtkomst från din stationära eller mobila enhet. Genom Nextcloud får du även tillgång till, synkroniserar och delar dina befintliga data på FTP-enheten på kontoret, en Dropbox eller en NAS du har hemma.
    tr_TR: Nerede olursanız olun tüm dosyalarınıza erişmenizi sağlar. Fotoğraflarınız ve belgeleriniz nerede olursa olsun. Nextcloud ile evde, veri merkezinde veya bir sağlayıcıda istediğiniz bir sunucuyu seçersiniz. Dosyalarınız da orada bulunur. Nextcloud bu sunucuda çalışır, verilerinizi korur ve masaüstü veya mobil cihazlarınızdan erişim sağlar. Nextcloud aracılığıyla ayrıca ofisteki FTP sürücünüzde, Dropbox'ta veya evinizdeki NAS'ta bulunan mevcut verilerinize erişebilir, senkronize edebilir ve paylaşabilirsiniz.
    zh_CN: 在自己的服务器上访问、同步和分享文件。
    zh_TW: 在自己的伺服器上訪問、同步和分享檔案。
