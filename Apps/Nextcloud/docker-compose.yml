name: linuxserver-nextcloud
services:
  app:
    image: linuxserver/nextcloud:35.0.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 443
        published: 443
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nextcloud/config
        target: /config
      - type: bind
        source: /DATA/AppData/nextcloud/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Nextcloud gives you access to all your files wherever you are. Where are your photos and documents? With Nextcloud you pick a server of your choice, at home, in a data center or at a provider. And that is where your files will be. Nextcloud runs on that server, protecting your data and giving you access from your desktop or mobile devices. Through Nextcloud you also access, sync and share your existing data on that FTP drive at the office, a Dropbox or a NAS you have at home.
    ca_ES: Nextcloud et dóna accés a tots els teus fitxers allà on siguis. On són les teves fotos i documents? Amb Nextcloud tries un servidor al teu gust, a casa, en un centre de dades o en un proveïdor. I allà és on seran els teus fitxers. Nextcloud s'executa en aquest servidor, protegint les teves dades i donant-te accés des del teu ordinador o dispositius mòbils. A través de Nextcloud també accedeixes, sincronitzes i comparteixes les teves dades existents en aquesta unitat FTP de l'oficina, un Dropbox o un NAS que tens a casa.
    cs_CZ: Nextcloud vám poskytuje přístup ke všem vašim souborům, ať jste kdekoli. Kde máte své fotografie a dokumenty? S Nextcloudem si vyberete server dle vlastního výběru, ať už doma, v datovém centru nebo u poskytovatele. A tam budou vaše soubory. Nextcloud běží na tomto serveru, chrání vaše data a poskytuje vám přístup z vašeho stolního počítače nebo mobilních zařízení. Prostřednictvím Nextcloudu také přistupujete, synchronizujete a sdílíte svá stávající data na daném FTP disku v kanceláři, Dropboxu nebo NAS, který máte doma.
    da_DK: Nextcloud giver dig adgang til alle dine filer, uanset hvor du er. Hvor er dine fotos og dokumenter? Med Nextcloud vælger du en server efter eget valg, derhjemme, i et datacenter eller hos en udbyder. Og det er der, dine filer vil være. Nextcloud kører på den server, beskytter dine data og giver dig adgang fra din stationære eller mobile enheder. Gennem Nextcloud kan du også få adgang til, synkronisere og dele dine eksisterende data på det FTP-drev på kontoret, en Dropbox eller en NAS, du har derhjemme.
    de_DE: Mit Nextcloud haben Sie von überall Zugriff auf all Ihre Dateien. Wo befinden sich Ihre Fotos und Dokumente? Mit Nextcloud wählen Sie einen Server Ihrer Wahl – zu Hause, in einem Rechenzentrum oder bei einem Provider. Dort werden Ihre Dateien gespeichert. Nextcloud läuft auf diesem Server, schützt Ihre Daten und ermöglicht Ihnen den Zugriff von Ihrem Desktop oder Mobilgerät. Über Nextcloud können Sie außerdem auf Ihre vorhandenen Daten zugreifen, sie synchronisieren und teilen – beispielsweise auf Ihrem FTP-Laufwerk im Büro, in Ihrer Dropbox oder auf Ihrem NAS zu Hause.
    el_GR: Το Nextcloud σάς παρέχει πρόσβαση σε όλα τα αρχεία σας όπου κι αν βρίσκεστε. Πού βρίσκονται οι φωτογραφίες και τα έγγραφά σας; Με το Nextcloud επιλέγετε έναν διακομιστή της επιλογής σας, στο σπίτι, σε ένα κέντρο δεδομένων ή σε έναν πάροχο. Και εκεί θα βρίσκονται τα αρχεία σας. Το Nextcloud εκτελείται σε αυτόν τον διακομιστή, προστατεύοντας τα δεδομένα σας και παρέχοντάς σας πρόσβαση από τον επιτραπέζιο υπολογιστή ή τις κινητές συσκευές σας. Μέσω του Nextcloud, έχετε επίσης πρόσβαση, συγχρονισμό και κοινή χρήση των υπαρχόντων δεδομένων σας σε αυτήν τη μονάδα FTP στο γραφείο, σε ένα Dropbox ή σε ένα NAS που έχετε στο σπίτι.
    en_GB: Nextcloud gives you access to all your files wherever you are. Where are your photos and documents? With Nextcloud you pick a server of your choice, at home, in a data centre or at a provider. And that is where your files will be. Nextcloud runs on that server, protecting your data and giving you access from your desktop or mobile devices. Through Nextcloud you also access, sync and share your existing data on that Ftp drive at the office, a Dropbox or a Nas you have at home.
    es_ES: 'Nextcloud te da acceso a todos tus archivos estés donde estés. ¿Dónde están tus fotos y documentos? Con Nextcloud, eliges el servidor que prefieras: en casa, en un centro de datos o en el de un proveedor. Ahí se almacenarán tus archivos. Nextcloud se ejecuta en ese servidor, protegiendo tus datos y permitiéndote acceder a ellos desde tu ordenador o dispositivos móviles. A través de Nextcloud, también puedes acceder, sincronizar y compartir tus datos existentes en esa unidad FTP de la oficina, Dropbox o el NAS que tengas en casa.'
    fr_FR: "Nextcloud vous donne accès à tous vos fichiers, où que vous soyez. Où sont vos photos et vos documents\_? Avec Nextcloud, vous choisissez le serveur de votre choix\_: chez vous, dans un centre de données ou chez un fournisseur. Vos fichiers y seront stockés. Nextcloud s'exécute sur ce serveur, protégeant vos données et vous permettant d'y accéder depuis votre ordinateur ou vos appareils mobiles. Grâce à Nextcloud, vous pouvez également accéder à vos données existantes, les synchroniser et les partager, qu'elles soient stockées sur votre disque FTP au bureau, votre compte Dropbox ou votre NAS à domicile."
    ga_IE: Tugann Nextcloud rochtain duit ar do chuid comhad go léir cibé áit a bhfuil tú. Cá bhfuil do ghrianghraif agus do dhoiciméid? Le Nextcloud roghnaíonn tú freastalaí de do rogha féin, sa bhaile, in ionad sonraí nó ag soláthraí. Agus sin an áit a mbeidh do chuid comhad. Ritheann Nextcloud ar an bhfreastalaí sin, ag cosaint do shonraí agus ag tabhairt rochtana duit ó do dheasc nó ó do ghléasanna soghluaiste. Trí Nextcloud is féidir leat rochtain a fháil ar do shonraí atá ann cheana féin ar an tiomántán FTP sin san oifig, ar Dropbox nó ar NAS atá agat sa bhaile, iad a shioncronú agus a roinnt freisin.
    hr_HR: Nextcloud vam omogućuje pristup svim vašim datotekama gdje god se nalazili. Gdje su vaše fotografije i dokumenti? S Nextcloudom birate poslužitelj po svom izboru, kod kuće, u podatkovnom centru ili kod davatelja usluga. I tu će se nalaziti vaše datoteke. Nextcloud radi na tom poslužitelju, štiteći vaše podatke i dajući vam pristup s vašeg računala ili mobilnih uređaja. Putem Nextclouda također pristupate, sinkronizirate i dijelite svoje postojeće podatke na tom FTP disku u uredu, Dropboxu ili NAS-u koji imate kod kuće.
    hu_HU: A Nextcloud hozzáférést biztosít minden fájlodhoz, bárhol is vagy. Hol vannak a fotóid és a dokumentumaid? A Nextcloud segítségével kiválaszthatsz egy szervert otthon, egy adatközpontban vagy egy szolgáltatónál. És ott lesznek a fájljaid. A Nextcloud ezen a szerveren fut, védi az adataidat, és hozzáférést biztosít asztali számítógépedről vagy mobileszközeidről. A Nextcloudon keresztül elérheted, szinkronizálhatod és megoszthatod a meglévő adataidat az irodai FTP-meghajtón, egy Dropboxon vagy egy otthoni NAS-on.
    it_IT: Nextcloud ti dà accesso a tutti i tuoi file ovunque tu sia. Dove sono le tue foto e i tuoi documenti? Con Nextcloud scegli un server a tua scelta, a casa, in un data center o presso un provider. E lì saranno archiviati i tuoi file. Nextcloud viene eseguito su quel server, proteggendo i tuoi dati e consentendoti di accedervi dal tuo computer o dai tuoi dispositivi mobili. Tramite Nextcloud puoi anche accedere, sincronizzare e condividere i tuoi dati presenti sull'unità FTP in ufficio, su Dropbox o su un NAS che hai a casa.
    ja_JP: Nextcloudを使えば、どこにいてもすべてのファイルにアクセスできます。写真やドキュメントはどこに保存されていますか？Nextcloudでは、自宅、データセンター、プロバイダなど、お好みのサーバーを選択できます。ファイルはそこに保存されます。Nextcloudはそのサーバー上で動作し、データを保護しながら、デスクトップやモバイルデバイスからアクセスできるようにします。また、Nextcloudを使えば、オフィスのFTPドライブ、Dropbox、自宅のNASなどにある既存のデータにもアクセス、同期、共有できます。
    ko_KR: Nextcloud를 사용하면 어디에 있든 모든 파일에 액세스할 수 있습니다. 사진과 문서가 어디에 있나요? Nextcloud를 사용하면 집, 데이터 센터 또는 제공업체의 서버 등 원하는 서버를 선택할 수 있습니다. 그러면 파일이 해당 서버에 저장됩니다. Nextcloud는 해당 서버에서 실행되어 데이터를 보호하고 데스크톱이나 모바일 기기에서 액세스할 수 있도록 해줍니다. Nextcloud를 통해 사무실의 FTP 드라이브, Dropbox 또는 집의 NAS에 있는 기존 데이터에도 액세스하고 동기화하고 공유할 수 있습니다.
    ml_IN: നിങ്ങൾ എവിടെയായിരുന്നാലും നിങ്ങളുടെ എല്ലാ ഫയലുകളിലേക്കും Nextcloud നിങ്ങൾക്ക് ആക്‌സസ് നൽകുന്നു. നിങ്ങളുടെ ഫോട്ടോകളും ഡോക്യുമെന്റുകളും എവിടെയാണ്? Nextcloud ഉപയോഗിച്ച് നിങ്ങൾക്ക് ഇഷ്ടമുള്ള ഒരു സെർവർ വീട്ടിൽ, ഒരു ഡാറ്റാ സെന്ററിൽ അല്ലെങ്കിൽ ഒരു ദാതാവിൽ നിന്ന് തിരഞ്ഞെടുക്കാം. അവിടെയാണ് നിങ്ങളുടെ ഫയലുകൾ ഉണ്ടാകുക. Nextcloud ആ സെർവറിൽ പ്രവർത്തിക്കുന്നു, നിങ്ങളുടെ ഡാറ്റ സംരക്ഷിക്കുകയും നിങ്ങളുടെ ഡെസ്‌ക്‌ടോപ്പിൽ നിന്നോ മൊബൈൽ ഉപകരണങ്ങളിൽ നിന്നോ ആക്‌സസ് നൽകുകയും ചെയ്യുന്നു. Nextcloud വഴി ഓഫീസിലെ FTP ഡ്രൈവിലോ, ഡ്രോപ്പ്‌ബോക്‌സിലോ, വീട്ടിലുള്ള NAS-ലോ നിങ്ങളുടെ നിലവിലുള്ള ഡാറ്റ ആക്‌സസ് ചെയ്യുകയും സമന്വയിപ്പിക്കുകയും പങ്കിടുകയും ചെയ്യുന്നു.
    nb_NO: Nextcloud gir deg tilgang til alle filene dine uansett hvor du er. Hvor er bildene og dokumentene dine? Med Nextcloud velger du en server du ønsker, hjemme, i et datasenter eller hos en leverandør. Og det er der filene dine vil være. Nextcloud kjører på den serveren, beskytter dataene dine og gir deg tilgang fra datamaskinen eller mobilenhetene dine. Gjennom Nextcloud får du også tilgang til, synkroniserer og deler eksisterende data på FTP-stasjonen på kontoret, en Dropbox eller en NAS du har hjemme.
    nl_NL: 'Met Nextcloud heb je overal toegang tot al je bestanden. Waar staan je foto''s en documenten? Met Nextcloud kies je een server naar keuze: thuis, in een datacenter of bij een provider. En daar worden je bestanden opgeslagen. Nextcloud draait op die server, beschermt je gegevens en geeft je toegang vanaf je desktop of mobiele apparaten. Via Nextcloud kun je ook je bestaande gegevens op die FTP-schijf op kantoor, een Dropbox of een NAS thuis openen, synchroniseren en delen.'
    pl_PL: Nextcloud zapewnia dostęp do wszystkich plików, gdziekolwiek jesteś. Gdzie są Twoje zdjęcia i dokumenty? Z Nextcloud wybierasz serwer – w domu, w centrum danych lub u dostawcy. I to właśnie tam będą Twoje pliki. Nextcloud działa na tym serwerze, chroniąc Twoje dane i zapewniając dostęp do nich z komputera stacjonarnego lub urządzeń mobilnych. Za pośrednictwem Nextcloud możesz również uzyskać dostęp, synchronizować i udostępniać istniejące dane na dysku FTP w biurze, Dropboxie lub domowym serwerze NAS.
    pt_BR: 'O Nextcloud permite que você acesse todos os seus arquivos onde quer que esteja. Onde estão suas fotos e documentos? Com o Nextcloud, você escolhe o servidor de sua preferência: em casa, em um data center ou em um provedor. E é lá que seus arquivos ficarão armazenados. O Nextcloud é executado nesse servidor, protegendo seus dados e permitindo o acesso a partir do seu computador ou dispositivos móveis. Através do Nextcloud, você também acessa, sincroniza e compartilha seus dados existentes em um disco FTP no escritório, em um Dropbox ou em um NAS que você tenha em casa.'
    ro_RO: Nextcloud vă oferă acces la toate fișierele dvs. oriunde v-ați afla. Unde sunt fotografiile și documentele dvs.? Cu Nextcloud, alegeți un server la alegere, acasă, într-un centru de date sau la un furnizor. Și acolo vor fi fișierele dvs. Nextcloud rulează pe acel server, protejându-vă datele și oferindu-vă acces de pe desktop sau de pe dispozitivele mobile. Prin intermediul Nextcloud, accesați, sincronizați și partajați datele existente pe unitatea FTP de la birou, pe un Dropbox sau pe un NAS pe care îl aveți acasă.
    ru_RU: 'Nextcloud предоставляет вам доступ ко всем вашим файлам, где бы вы ни находились. Где хранятся ваши фотографии и документы? С Nextcloud вы выбираете сервер по своему усмотрению: дома, в центре обработки данных или у провайдера. И именно там будут храниться ваши файлы. Nextcloud работает на этом сервере, защищая ваши данные и предоставляя вам доступ с вашего настольного компьютера или мобильных устройств. Через Nextcloud вы также получаете доступ, синхронизируете и обмениваетесь существующими данными на FTP-диске в офисе, Dropbox или NAS-сервере дома.'
    sk_SK: Nextcloud vám poskytuje prístup ku všetkým vašim súborom, nech ste kdekoľvek. Kde sú vaše fotografie a dokumenty? S Nextcloudom si vyberiete server podľa vlastného výberu, či už doma, v dátovom centre alebo u poskytovateľa. A tam budú vaše súbory. Nextcloud beží na tomto serveri, chráni vaše dáta a poskytuje vám prístup z vášho počítača alebo mobilných zariadení. Prostredníctvom Nextcloudu tiež pristupujete, synchronizujete a zdieľate svoje existujúce dáta na danom FTP disku v kancelárii, Dropboxe alebo NAS, ktorý máte doma.
    sv_SE: Nextcloud ger dig tillgång till alla dina filer var du än befinner dig. Var är dina foton och dokument? Med Nextcloud väljer du en server du själv väljer, hemma, i ett datacenter eller hos en leverantör. Och det är där dina filer kommer att finnas. Nextcloud körs på den servern, skyddar dina data och ger dig åtkomst från din stationära eller mobila enhet. Genom Nextcloud får du även tillgång till, synkroniserar och delar dina befintliga data på FTP-enheten på kontoret, en Dropbox eller en NAS du har hemma.
    tr_TR: Nextcloud, nerede olursanız olun tüm dosyalarınıza erişmenizi sağlar. Fotoğraflarınız ve belgeleriniz nerede? Nextcloud ile evde, veri merkezinde veya bir sağlayıcıda istediğiniz bir sunucuyu seçersiniz. Dosyalarınız da orada olur. Nextcloud bu sunucuda çalışır, verilerinizi korur ve masaüstü veya mobil cihazlarınızdan erişim sağlar. Nextcloud aracılığıyla ayrıca ofisteki FTP sürücünüzde, Dropbox'ta veya evinizdeki NAS'ta bulunan mevcut verilerinize erişebilir, bunları senkronize edebilir ve paylaşabilirsiniz.
    zh_CN: Nextcloud 让你随时随地访问所有文件。你可选择位于家中、数据中心或服务商的服务器来存储照片和文档。Nextcloud 在该服务器上运行，保护数据，并允许你通过桌面或移动设备访问。你还可以通过它访问、同步和分享办公室 FTP 存储、Dropbox 或家用 NAS 上的现有数据。
    zh_TW: Nextcloud 讓你隨時隨地訪問所有檔案。你可選擇位於家中、資料中心或服務商的伺服器來儲存照片和文件。Nextcloud 在該伺服器上執行，保護資料，並允許你透過桌面或移動裝置訪問。你還可以透過它訪問、同步和分享辦公室 FTP 儲存、Dropbox 或家用 NAS 上的現有資料。
