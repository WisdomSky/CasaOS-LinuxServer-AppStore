name: linuxserver-sqlitebrowser
services:
  app:
    image: linuxserver/sqlitebrowser:3.13.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sqlitebrowser/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: DB Browser for SQLite is a high quality, visual, open source tool to create, design, and edit database files compatible with SQLite.
    zh_CN: DB Browser for SQLite 是一款高质量、开源的可视化工具，用于创建、设计和编辑与 SQLite 兼容的数据库文件。
  tagline:
    en_US: A high quality, visual, open source tool to create, design, and edit database files compatible with SQLite.
    zh_CN: 以可视化方式创建和编辑 SQLite 数据库。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sqlitebrowser-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sqlitebrowser-banner.png
  title:
    en_US: Sqlitebrowser (LinuxServer.io)
    zh_CN: Sqlitebrowser（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserversqlitebrowser
  port_map: '3000'
  version: 3.13.1
