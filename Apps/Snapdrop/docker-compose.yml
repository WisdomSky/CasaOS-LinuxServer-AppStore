name: linuxserver-snapdrop
services:
  app:
    image: linuxserver/snapdrop:version-f88d46ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
      volumes:
        - container: /config
          description:
            en_US: Appdata
      ports:
        - container: '80'
          description:
            en_US: 'Container Port: 80'
        - container: '443'
          description:
            en_US: 'Container Port: 443'
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/snapdrop/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'Visit homepage: https://hub.docker.com/r/linuxserver/snapdrop/'
    zh_CN: |-
      Snapdrop 可在浏览器中分享局域网文件，灵感来自 Apple AirDrop。

      访问项目主页：https://hub.docker.com/r/linuxserver/snapdrop/
  tagline:
    en_US: 'A local file sharing in your browser. Inspired by Apple''s Airdrop. '
    zh_CN: 在浏览器中进行局域网文件分享。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/snapdrop-icon.png
  thumbnail: https://raw.githubusercontent.com/snapdrop/snapdrop/master/client/images/logo_transparent_512x512.png
  title:
    en_US: Snapdrop
    zh_CN: Snapdrop
  category: Others
  project_url: https://github.com/RobinLinus/snapdrop
  port_map: '80'
  id: wisdomsky.linuxserver.linuxserversnapdrop
  version: version-f88d46ed
  website: https://github.com/RobinLinus/snapdrop
