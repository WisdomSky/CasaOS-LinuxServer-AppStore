name: linuxserver-cura
services:
  app:
    image: linuxserver/cura:5.13.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cura/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: UltiMaker Cura is free, easy-to-use 3D printing software trusted by millions of users. Fine-tune your 3D model with 400+ settings for the best slicing and printing results.
    zh_CN: UltiMaker Cura 是一款免费、易用的 3D 打印软件，受到数百万用户信赖。你可以使用 400 多项设置精细调整 3D 模型，获得更好的切片和打印效果。
  tagline:
    en_US: Free, easy-to-use 3D printing software trusted by millions of users. Fine-tune your 3D model with 400+ settings for the best slicing and printing results.
    zh_CN: 提供 400 多项设置的易用 3D 打印切片软件。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/cura-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/cura-logo.png
  title:
    en_US: Cura (LinuxServer.io)
    zh_CN: Cura（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxservercura
  port_map: '3000'
  version: 5.13.0
