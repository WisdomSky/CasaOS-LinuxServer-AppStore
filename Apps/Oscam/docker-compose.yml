name: linuxserver-oscam
services:
  app:
    image: linuxserver/oscam:version-11966
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/oscam/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Oscam is an Open Source Conditional Access Module software used for descrambling DVB transmissions using smart cards. It's both a server and a client.
    ca_ES: Oscam és un programari de mòdul d'accés condicional de codi obert que s'utilitza per descodificar transmissions DVB mitjançant targetes intel·ligents. És alhora un servidor i un client.
    cs_CZ: Oscam je open source software s podmíněným přístupem (Conditional Access Module), který se používá pro dekódování DVB vysílání pomocí čipových karet. Je to server i klient.
    da_DK: Oscam er et open source-softwareprogram til betinget adgangsmodul, der bruges til at dekode DVB-transmissioner ved hjælp af smartkort. Det er både en server og en klient.
    de_DE: Oscam ist eine Open-Source-Software für bedingten Zugriff, die zur Entschlüsselung von DVB-Übertragungen mithilfe von Smartcards verwendet wird. Sie fungiert sowohl als Server als auch als Client.
    el_GR: Το Oscam είναι ένα λογισμικό ανοιχτού κώδικα με δυνατότητα συνθήκης πρόσβασης που χρησιμοποιείται για την αποκωδικοποίηση μεταδόσεων DVB χρησιμοποιώντας έξυπνες κάρτες. Είναι ταυτόχρονα διακομιστής και πελάτης.
    en_GB: Oscam is an Open Source Conditional Access Module software used for descrambling Dvb transmissions using smart cards. It's both a server and a client.
    es_ES: Oscam es un software de módulo de acceso condicional de código abierto que se utiliza para descifrar transmisiones DVB mediante tarjetas inteligentes. Funciona tanto como servidor como cliente.
    fr_FR: Oscam est un logiciel open source de module d'accès conditionnel utilisé pour le décryptage des transmissions DVB à l'aide de cartes à puce. Il fait office à la fois de serveur et de client.
    ga_IE: Is bogearraí Modúl Rochtana Coinníollach Foinse Oscailte é Oscam a úsáidtear chun tarchuir DVB a dhí-scrambláil ag baint úsáide as cártaí cliste. Is freastalaí agus cliant araon é.
    hr_HR: Oscam je softver otvorenog koda za uvjetni pristup (Conditional Access Module) koji se koristi za dekodiranje DVB prijenosa pomoću pametnih kartica. To je i poslužitelj i klijent.
    hu_HU: Az Oscam egy nyílt forráskódú feltételes hozzáférési modul (CAM), amely DVB-adások dekódolására szolgál intelligens kártyák segítségével. Egyszerre szerver és kliens is.
    it_IT: Oscam è un software open source per la decodifica di moduli di accesso condizionato (CAM) utilizzato per decodificare le trasmissioni DVB tramite smart card. Funziona sia come server che come client.
    ja_JP: Oscamは、スマートカードを使用してDVB放送のスクランブルを解除するために使用されるオープンソースの条件付きアクセスモジュールソフトウェアです。サーバーとクライアントの両方の機能を備えています。
    ko_KR: Oscam은 스마트 카드를 사용하여 DVB 전송을 복호화하는 데 사용되는 오픈 소스 조건부 액세스 모듈 소프트웨어입니다. 서버와 클라이언트 역할을 모두 수행합니다.
    ml_IN: സ്മാർട്ട് കാർഡുകൾ ഉപയോഗിച്ച് ഡിവിബി ട്രാൻസ്മിഷനുകൾ ഡീസ്ക്രാമ്പ് ചെയ്യുന്നതിന് ഉപയോഗിക്കുന്ന ഒരു ഓപ്പൺ സോഴ്‌സ് കണ്ടീഷണൽ ആക്‌സസ് മൊഡ്യൂൾ സോഫ്റ്റ്‌വെയറാണ് ഓസ്‌കാം. ഇത് ഒരു സെർവറും ക്ലയന്റും ആണ്.
    nb_NO: Oscam er en programvare for åpen kildekode-tilgangsmoduler som brukes til å dekode DVB-sendinger ved hjelp av smartkort. Det er både en server og en klient.
    nl_NL: Oscam is open-source Conditional Access Module-software die wordt gebruikt voor het decoderen van DVB-uitzendingen met behulp van smartcards. Het is zowel een server als een client.
    pl_PL: Oscam to oprogramowanie typu Open Source, oparte na module dostępu warunkowego, służące do dekodowania transmisji DVB za pomocą kart inteligentnych. Jest zarówno serwerem, jak i klientem.
    pt_BR: O Oscam é um software de Módulo de Acesso Condicional de código aberto usado para decodificar transmissões DVB utilizando cartões inteligentes. Ele funciona tanto como servidor quanto como cliente.
    ro_RO: Oscam este un software open source de tip modul de acces condiționat, utilizat pentru decriptarea transmisiilor DVB folosind carduri inteligente. Este atât server, cât și client.
    ru_RU: Oscam — это программное обеспечение с открытым исходным кодом для модуля условного доступа, используемое для дескремблирования DVB-передач с помощью смарт-карт. Оно выполняет функции как сервера, так и клиента.
    sk_SK: Oscam je softvér s otvoreným zdrojovým kódom pre modul podmieneného prístupu (Conditional Access Module), ktorý sa používa na dekódovanie DVB prenosov pomocou inteligentných kariet. Je to server aj klient.
    sv_SE: Oscam är en programvara för öppen källkod för villkorlig åtkomstmodul som används för att avkoda DVB-sändningar med hjälp av smartkort. Det är både en server och en klient.
    tr_TR: Oscam, akıllı kartlar kullanarak DVB yayınlarının şifresini çözmek için kullanılan açık kaynaklı bir Koşullu Erişim Modülü yazılımıdır. Hem sunucu hem de istemci işlevi görür.
    zh_CN: OSCam 是开源条件访问模块软件，可使用智能卡对 DVB 传输进行解扰，同时具有服务器和客户端功能。
    zh_TW: OSCam 是開源條件訪問模組軟體，可使用智慧卡對 DVB 傳輸進行解擾，同時具有伺服器和客戶端功能。
