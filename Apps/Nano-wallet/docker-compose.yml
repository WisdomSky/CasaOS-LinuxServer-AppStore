name: linuxserver-nano-wallet
services:
  app:
    image: linuxserver/nano-wallet:1.3.2
    restart: unless-stopped
    environment: {}
    x-casaos:
      envs: []
    ports:
      - target: 80
        published: 80
        protocol: tcp
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  main: app
  description:
    en_US: Nano-wallet is a digital payment protocol designed to be accessible and lightweight, with a focus on removing inefficiencies present in other cryptocurrencies. With ultrafast transactions and zero fees on a secure, green and decentralized network, this makes Nano ideal for everyday transactions. This container is a simple nginx wrapper for the light wallet located here. You will need to pass a valid RPC host when accessing this container.
    zh_CN: Nano-wallet 使用 Nano 数字支付协议，该协议注重易用性和轻量化，旨在消除其他加密货币中的低效环节。它在安全、环保、去中心化的网络上提供极快且零手续费的交易，适合日常支付。此容器以 Nginx 简单封装轻钱包；访问容器时需要提供有效的 RPC 主机。
    ca_ES: Nano-wallet és un protocol de pagament digital dissenyat per ser accessible i lleuger, amb un enfocament en l'eliminació de les ineficiències presents en altres criptomonedes. Amb transaccions ultraràpides i zero comissions en una xarxa segura, verda i descentralitzada, això fa que Nano sigui ideal per a transaccions diàries. Aquest contenidor és un simple contenidor nginx per al moneder lleuger que es troba aquí. Haureu de passar un host RPC vàlid per accedir a aquest contenidor.
    cs_CZ: Nano-peněženka je digitální platební protokol navržený tak, aby byl přístupný a nenáročný, se zaměřením na odstranění neefektivity přítomné v jiných kryptoměnách. Díky ultrarychlým transakcím a nulovým poplatkům v bezpečné, zelené a decentralizované síti je Nano ideální pro každodenní transakce. Tento kontejner je jednoduchý obal nginx pro lehkou peněženku, která se nachází zde. Pro přístup k tomuto kontejneru budete muset předat platný RPC hostitel.
    da_DK: Nano-wallet er en digital betalingsprotokol, der er designet til at være tilgængelig og let, med fokus på at fjerne ineffektiviteter, der findes i andre kryptovalutaer. Med ultrahurtige transaktioner og nul gebyrer på et sikkert, grønt og decentraliseret netværk gør dette Nano ideel til hverdagstransaktioner. Denne container er en simpel nginx-wrapper til den lette wallet, der findes her. Du skal bruge en gyldig RPC-vært, når du tilgår denne container.
    de_DE: Nano-Wallet ist ein digitales Zahlungsprotokoll, das auf einfache Zugänglichkeit und geringen Ressourcenverbrauch ausgelegt ist und die Ineffizienzen anderer Kryptowährungen beseitigt. Dank ultraschneller Transaktionen und gebührenfreier Nutzung in einem sicheren, umweltfreundlichen und dezentralen Netzwerk eignet sich Nano ideal für alltägliche Zahlungen. Dieser Container ist ein einfacher Nginx-Wrapper für die hier verfügbare Light Wallet. Beim Zugriff auf diesen Container benötigen Sie einen gültigen RPC-Host.
    el_GR: Το Nano-wallet είναι ένα πρωτόκολλο ψηφιακών πληρωμών σχεδιασμένο να είναι προσβάσιμο και ελαφρύ, με έμφαση στην εξάλειψη των ανεπαρκειών που υπάρχουν σε άλλα κρυπτονομίσματα. Με εξαιρετικά γρήγορες συναλλαγές και μηδενικές χρεώσεις σε ένα ασφαλές, πράσινο και αποκεντρωμένο δίκτυο, αυτό καθιστά το Nano ιδανικό για καθημερινές συναλλαγές. Αυτό το κοντέινερ είναι ένα απλό περιτύλιγμα nginx για το ελαφρύ πορτοφόλι που βρίσκεται εδώ. Θα χρειαστεί να περάσετε έναν έγκυρο κεντρικό υπολογιστή RPC κατά την πρόσβαση σε αυτό το κοντέινερ.
    en_GB: Nano-wallet is a digital payment protocol designed to be accessible and lightweight, with a focus on removing inefficiencies present in other cryptocurrencies. With ultrafast transactions and zero fees on a secure, green and decentralised network, this makes Nano ideal for everyday transactions. This container is a simple nginx wrapper for the light wallet located here. You will need to pass a valid Rpc host when accessing this container.
    es_ES: Nano-wallet es un protocolo de pago digital diseñado para ser accesible y ligero, centrado en eliminar las ineficiencias presentes en otras criptomonedas. Con transacciones ultrarrápidas y cero comisiones en una red segura, ecológica y descentralizada, Nano es ideal para las transacciones cotidianas. Este contenedor es un simple envoltorio nginx para la billetera ligera que se encuentra aquí. Deberá proporcionar un host RPC válido para acceder a este contenedor.
    fr_FR: Nano-wallet est un protocole de paiement numérique conçu pour être accessible et léger, et qui vise à éliminer les inefficacités présentes dans d'autres cryptomonnaies. Grâce à des transactions ultrarapides et sans frais sur un réseau sécurisé, écologique et décentralisé, Nano est idéal pour les transactions quotidiennes. Ce conteneur est une simple interface nginx pour le portefeuille léger disponible ici. Vous devrez fournir un hôte RPC valide pour accéder à ce conteneur.
    ga_IE: Is prótacal íocaíochta digiteach é Nano-sparán atá deartha le bheith inrochtana agus éadrom, le fócas ar neamhéifeachtúlachtaí atá i láthair i gcripteairgeadraí eile a bhaint. Le hidirbhearta thar a bheith gasta agus gan aon táillí ar líonra slán, glas agus díláraithe, déanann sé seo Nano oiriúnach d'idirbhearta laethúla. Is fillteán nginx simplí é an coimeádán seo don sparán éadrom atá suite anseo. Beidh ort óstach RPC bailí a rith agus tú ag rochtain an choimeádáin seo.
    hr_HR: Nano-novčanik je digitalni protokol za plaćanje osmišljen da bude pristupačan i lagan, s naglaskom na uklanjanju nedostataka prisutnih u drugim kriptovalutama. S ultrabrzim transakcijama i nultom naknadom na sigurnoj, zelenoj i decentraliziranoj mreži, Nano je idealan za svakodnevne transakcije. Ovaj kontejner je jednostavna nginx omotač za lagani novčanik koji se nalazi ovdje. Morat ćete proslijediti valjani RPC host prilikom pristupa ovom kontejneru.
    hu_HU: A Nano-wallet egy digitális fizetési protokoll, amelyet úgy terveztek, hogy könnyen hozzáférhető és könnyű legyen, és a többi kriptovalutában jelen lévő hatékonysági problémák kiküszöbölésére összpontosítson. Az ultragyors tranzakcióknak és a biztonságos, zöld és decentralizált hálózaton keresztüli nulla díjnak köszönhetően a Nano ideális a mindennapi tranzakciókhoz. Ez a konténer egy egyszerű nginx wrapper az itt található light wallethez. A konténer elérésekor érvényes RPC-hosztot kell megadnia.
    it_IT: Nano-wallet è un protocollo di pagamento digitale progettato per essere accessibile e leggero, con l'obiettivo di eliminare le inefficienze presenti in altre criptovalute. Grazie a transazioni ultraveloci e zero commissioni su una rete sicura, ecologica e decentralizzata, Nano è ideale per le transazioni quotidiane. Questo container è un semplice wrapper Nginx per il wallet leggero che si trova qui. Per accedere a questo container è necessario specificare un host RPC valido.
    ja_JP: Nanoウォレットは、アクセスしやすく軽量なデジタル決済プロトコルであり、他の暗号通貨に存在する非効率性を排除することに重点を置いています。超高速トランザクションと手数料無料、そして安全で環境に優しく分散型のネットワークにより、Nanoは日常的な取引に最適です。このコンテナは、ここにある軽量ウォレット用のシンプルなnginxラッパーです。このコンテナにアクセスするには、有効なRPCホストを渡す必要があります。
    ko_KR: 나노월렛은 접근성과 경량성을 고려하여 설계된 디지털 결제 프로토콜로, 다른 암호화폐에 존재하는 비효율성을 제거하는 데 중점을 두고 있습니다. 안전하고 친환경적인 탈중앙화 네트워크에서 초고속 거래와 수수료 제로를 제공하는 나노는 일상적인 거래에 이상적입니다. 이 컨테이너는 여기에 있는 경량 월렛을 위한 간단한 Nginx 래퍼입니다. 이 컨테이너에 접근할 때는 유효한 RPC 호스트를 전달해야 합니다.
    ml_IN: മറ്റ് ക്രിപ്‌റ്റോകറൻസികളിലെ കാര്യക്ഷമതയില്ലായ്മ ഇല്ലാതാക്കുന്നതിൽ ശ്രദ്ധ കേന്ദ്രീകരിച്ച്, ആക്‌സസ് ചെയ്യാവുന്നതും ഭാരം കുറഞ്ഞതുമായ ഒരു ഡിജിറ്റൽ പേയ്‌മെന്റ് പ്രോട്ടോക്കോളാണ് നാനോ-വാലറ്റ്. സുരക്ഷിതവും പച്ചയും വികേന്ദ്രീകൃതവുമായ നെറ്റ്‌വർക്കിലെ അൾട്രാ ഫാസ്റ്റ് ഇടപാടുകളും പൂജ്യം ഫീസും ഉള്ളതിനാൽ, ഇത് നാനോയെ ദൈനംദിന ഇടപാടുകൾക്ക് അനുയോജ്യമാക്കുന്നു. ഇവിടെ സ്ഥിതിചെയ്യുന്ന ലൈറ്റ് വാലറ്റിനുള്ള ഒരു ലളിതമായ എൻ‌ജി‌എൻ‌എക്സ് റാപ്പറാണ് ഈ കണ്ടെയ്‌നർ. ഈ കണ്ടെയ്‌നർ ആക്‌സസ് ചെയ്യുമ്പോൾ നിങ്ങൾ സാധുവായ ഒരു ആർ‌പി‌സി ഹോസ്റ്റ് പാസാക്കേണ്ടതുണ്ട്.
    nb_NO: Nano-wallet er en digital betalingsprotokoll som er designet for å være tilgjengelig og lett, med fokus på å fjerne ineffektiviteten som finnes i andre kryptovalutaer. Med ultrasnelle transaksjoner og null gebyrer på et sikkert, grønt og desentralisert nettverk, gjør dette Nano ideelt for hverdagslige transaksjoner. Denne containeren er en enkel nginx-wrapper for den lette lommeboken som ligger her. Du må bruke en gyldig RPC-vert når du får tilgang til denne containeren.
    nl_NL: Nano-wallet is een digitaal betalingsprotocol dat is ontworpen om toegankelijk en lichtgewicht te zijn, met de nadruk op het wegnemen van inefficiënties die aanwezig zijn in andere cryptocurrencies. Met ultrasnelle transacties en nul transactiekosten op een veilig, groen en gedecentraliseerd netwerk is Nano ideaal voor dagelijkse transacties. Deze container is een eenvoudige Nginx-wrapper voor de lichte wallet die u hier kunt vinden. U moet een geldige RPC-host opgeven om toegang te krijgen tot deze container.
    pl_PL: Nano-wallet to cyfrowy protokół płatności zaprojektowany z myślą o łatwości i prostocie, z naciskiem na eliminację nieefektywności obecnych w innych kryptowalutach. Dzięki ultraszybkim transakcjom i zerowym opłatom w bezpiecznej, ekologicznej i zdecentralizowanej sieci, Nano idealnie nadaje się do codziennych transakcji. Ten kontener to prosty wrapper Nginx dla lekkiego portfela, który znajdziesz tutaj. Aby uzyskać dostęp do tego kontenera, musisz podać prawidłowy host RPC.
    pt_BR: A Nano-wallet é um protocolo de pagamento digital projetado para ser acessível e leve, com foco na eliminação das ineficiências presentes em outras criptomoedas. Com transações ultrarrápidas e taxas zero em uma rede segura, ecológica e descentralizada, a Nano se torna ideal para transações do dia a dia. Este contêiner é um wrapper nginx simples para a carteira leve localizada aqui. Você precisará fornecer um host RPC válido ao acessar este contêiner.
    ro_RO: Nano-wallet este un protocol de plată digitală conceput pentru a fi accesibil și ușor, cu accent pe eliminarea ineficiențelor prezente în alte criptomonede. Cu tranzacții ultrarapide și zero comisioane pe o rețea securizată, ecologică și descentralizată, Nano este ideal pentru tranzacțiile de zi cu zi. Acest container este un simplu wrapper nginx pentru portofelul ușor situat aici. Va trebui să transmiteți o gazdă RPC validă atunci când accesați acest container.
    ru_RU: Nano-wallet — это протокол цифровых платежей, разработанный для обеспечения доступности и легкости, с упором на устранение недостатков, присущих другим криптовалютам. Благодаря сверхбыстрым транзакциям и отсутствию комиссий в безопасной, экологичной и децентрализованной сети, Nano идеально подходит для повседневных операций. Этот контейнер представляет собой простую обертку nginx для легкого кошелька, расположенного здесь. При доступе к этому контейнеру вам потребуется передать действительный RPC-хост.
    sk_SK: Nano-peňaženka je digitálny platobný protokol navrhnutý tak, aby bol prístupný a ľahký, so zameraním na odstránenie neefektívnosti prítomnej v iných kryptomenách. Vďaka ultrarýchlym transakciám a nulovým poplatkom v bezpečnej, zelenej a decentralizovanej sieti je Nano ideálny pre každodenné transakcie. Tento kontajner je jednoduchý nginx obal pre ľahkú peňaženku, ktorá sa nachádza tu. Pri prístupe k tomuto kontajneru budete musieť zadať platný RPC hostiteľ.
    sv_SE: Nano-wallet är ett digitalt betalningsprotokoll utformat för att vara tillgängligt och lätt, med fokus på att eliminera ineffektiviteter som finns i andra kryptovalutor. Med ultrasnabba transaktioner och noll avgifter på ett säkert, grönt och decentraliserat nätverk gör detta Nano idealiskt för vardagliga transaktioner. Denna container är en enkel nginx-omslag för den lätta plånboken som finns här. Du måste ange en giltig RPC-värd när du öppnar denna container.
    tr_TR: Nano-cüzdan, diğer kripto para birimlerindeki verimsizlikleri ortadan kaldırmaya odaklanarak, erişilebilir ve hafif olacak şekilde tasarlanmış bir dijital ödeme protokolüdür. Ultra hızlı işlemler ve güvenli, çevre dostu ve merkeziyetsiz bir ağda sıfır işlem ücreti ile Nano, günlük işlemler için idealdir. Bu konteyner, burada bulunan hafif cüzdan için basit bir nginx sarmalayıcısıdır. Bu konteynere erişirken geçerli bir RPC ana bilgisayarı belirtmeniz gerekecektir.
    zh_TW: Nano-wallet 使用 Nano 數字支付協議，該協議注重易用性和輕量化，旨在消除其他加密貨幣中的低效環節。它在安全、環保、去中心化的網路上提供極快且零手續費的交易，適合日常支付。此容器以 Nginx 簡單封裝輕錢包；訪問容器時需要提供有效的 RPC 主機。
