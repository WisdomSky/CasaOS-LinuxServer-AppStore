    it_IT: Un protocollo di pagamento digitale progettato per essere accessibile e leggero, con l'obiettivo di eliminare le inefficienze presenti in altre criptovalute. Grazie a transazioni ultraveloci e zero commissioni su una rete sicura, ecologica e decentralizzata, Nano è ideale per le transazioni quotidiane. Questo container è un semplice wrapper nginx per il portafoglio leggero che si trova qui. Per accedere a questo container è necessario specificare un host RPC valido.
    ja_JP: 他の暗号通貨に存在する非効率性を排除することに重点を置いて、アクセスしやすく軽量なデジタル決済プロトコルとして設計されています。超高速トランザクションと手数料無料、安全で環境に優しく分散型のネットワークにより、Nanoは日常的な取引に最適です。このコンテナは、ここにある軽量ウォレットのシンプルなnginxラッパーです。このコンテナにアクセスするには、有効なRPCホストを渡す必要があります。
    ko_KR: 나노는 접근성과 경량성을 고려하여 설계된 디지털 결제 프로토콜로, 다른 암호화폐에 존재하는 비효율성을 제거하는 데 중점을 두었습니다. 초고속 거래와 수수료 제로, 안전하고 친환경적인 탈중앙화 네트워크를 제공하는 나노는 일상적인 거래에 이상적입니다. 이 컨테이너는 여기에 있는 라이트 월렛을 위한 간단한 Nginx 래퍼입니다. 이 컨테이너에 접근할 때는 유효한 RPC 호스트를 전달해야 합니다.
    ml_IN: മറ്റ് ക്രിപ്‌റ്റോകറൻസികളിലെ കാര്യക്ഷമതയില്ലായ്മകൾ ഇല്ലാതാക്കുന്നതിൽ ശ്രദ്ധ കേന്ദ്രീകരിച്ച്, ആക്‌സസ് ചെയ്യാവുന്നതും ഭാരം കുറഞ്ഞതുമായ ഒരു ഡിജിറ്റൽ പേയ്‌മെന്റ് പ്രോട്ടോക്കോൾ രൂപകൽപ്പന ചെയ്‌തിരിക്കുന്നു. സുരക്ഷിതവും, പച്ചപ്പുള്ളതും, വികേന്ദ്രീകൃതവുമായ നെറ്റ്‌വർക്കിലെ അൾട്രാ ഫാസ്റ്റ് ഇടപാടുകളും പൂജ്യം ഫീസും ഉള്ളതിനാൽ, ഇത് നാനോയെ ദൈനംദിന ഇടപാടുകൾക്ക് അനുയോജ്യമാക്കുന്നു. ഇവിടെ സ്ഥിതിചെയ്യുന്ന ലൈറ്റ് വാലറ്റിനുള്ള ഒരു ലളിതമായ nginx റാപ്പറാണ് ഈ കണ്ടെയ്‌നർ. ഈ കണ്ടെയ്‌നർ ആക്‌സസ് ചെയ്യുമ്പോൾ നിങ്ങൾ സാധുവായ ഒരു RPC ഹോസ്റ്റ് പാസാക്കേണ്ടതുണ്ട്.
    nb_NO: En digital betalingsprotokoll designet for å være tilgjengelig og lett, med fokus på å fjerne ineffektiviteten som finnes i andre kryptovalutaer. Med ultrasnelle transaksjoner og null gebyrer på et sikkert, grønt og desentralisert nettverk, gjør dette Nano ideell for hverdagstransaksjoner. Denne containeren er en enkel nginx-wrapper for den lette lommeboken som ligger her. Du må bruke en gyldig RPC-vert når du får tilgang til denne containeren.
    nl_NL: Een digitaal betalingsprotocol dat is ontworpen om toegankelijk en lichtgewicht te zijn, met de nadruk op het wegnemen van inefficiënties die aanwezig zijn in andere cryptocurrencies. Met ultrasnelle transacties en nul kosten op een veilig, groen en gedecentraliseerd netwerk is Nano ideaal voor dagelijkse transacties. Deze container is een eenvoudige Nginx-wrapper voor de lichte wallet die u hier kunt vinden. U moet een geldige RPC-host opgeven om toegang te krijgen tot deze container.
    pl_PL: Protokół płatności cyfrowych zaprojektowany z myślą o łatwości i prostocie, z naciskiem na eliminację nieefektywności obecnych w innych kryptowalutach. Dzięki ultraszybkim transakcjom i zerowym opłatom w bezpiecznej, ekologicznej i zdecentralizowanej sieci, Nano idealnie nadaje się do codziennych transakcji. Ten kontener to prosty wrapper Nginx dla lekkiego portfela, który znajdziesz tutaj. Aby uzyskać dostęp do tego kontenera, musisz podać prawidłowy host RPC.
    pt_BR: Um protocolo de pagamento digital projetado para ser acessível e leve, com foco na eliminação das ineficiências presentes em outras criptomoedas. Com transações ultrarrápidas e taxas zero em uma rede segura, ecológica e descentralizada, o Nano se torna ideal para transações do dia a dia. Este contêiner é um wrapper nginx simples para a carteira leve localizada aqui. Você precisará fornecer um host RPC válido ao acessar este contêiner.
    ro_RO: Un protocol de plată digitală conceput pentru a fi accesibil și ușor, cu accent pe eliminarea ineficiențelor prezente în alte criptomonede. Cu tranzacții ultrarapide și zero taxe pe o rețea securizată, ecologică și descentralizată, Nano este ideal pentru tranzacțiile de zi cu zi. Acest container este un simplu wrapper nginx pentru portofelul ușor situat aici. Va trebui să transmiteți o gazdă RPC validă atunci când accesați acest container.
    ru_RU: Протокол цифровых платежей, разработанный для обеспечения доступности и легкости, с упором на устранение недостатков, присущих другим криптовалютам. Благодаря сверхбыстрым транзакциям и отсутствию комиссий в безопасной, экологичной и децентрализованной сети, Nano идеально подходит для повседневных операций. Этот контейнер представляет собой простую обертку nginx для легкого кошелька, расположенного здесь. При доступе к этому контейнеру вам потребуется передать действительный RPC-хост.
    sk_SK: Digitálny platobný protokol navrhnutý tak, aby bol prístupný a ľahký, so zameraním na odstránenie neefektívnosti prítomnej v iných kryptomenách. Vďaka ultrarýchlym transakciám a nulovým poplatkom v bezpečnej, zelenej a decentralizovanej sieti je Nano ideálny pre každodenné transakcie. Tento kontajner je jednoduchý nginx obal pre ľahkú peňaženku, ktorá sa nachádza tu. Pri prístupe k tomuto kontajneru budete musieť zadať platný RPC hostiteľ.
    sv_SE: Ett digitalt betalningsprotokoll utformat för att vara tillgängligt och lätt, med fokus på att eliminera ineffektiviteter som finns i andra kryptovalutor. Med ultrasnabba transaktioner och noll avgifter på ett säkert, grönt och decentraliserat nätverk gör detta Nano idealiskt för vardagliga transaktioner. Denna container är ett enkelt nginx-omslag för den lätta plånboken som finns här. Du måste ange en giltig RPC-värd när du öppnar denna container.
    tr_TR: Diğer kripto para birimlerindeki verimsizlikleri ortadan kaldırmaya odaklanan, erişilebilir ve hafif bir dijital ödeme protokolü. Ultra hızlı işlemler ve güvenli, çevre dostu ve merkeziyetsiz bir ağda sıfır işlem ücreti ile Nano, günlük işlemler için idealdir. Bu konteyner, burada bulunan hafif cüzdan için basit bir nginx sarmalayıcısıdır. Bu konteynere erişirken geçerli bir RPC ana bilgisayarı belirtmeniz gerekecektir.
    zh_TW: 透過網頁使用 Nano 輕錢包。
