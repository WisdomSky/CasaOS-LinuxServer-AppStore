name: linuxserver-xbackbone
services:
  app:
    image: linuxserver/xbackbone:3.8.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Xbackbone is a simple, self-hosted, lightweight PHP file manager that support the instant sharing tool ShareX and *NIX systems. It supports uploading and displaying images, GIF, video, code, formatted text, and file downloading and uploading. Also have a web UI with multi user management, past uploads history and search support.
    zh_CN: XBackBone 是简单、轻量、可自行托管的 PHP 文件管理器，支持即时分享工具 ShareX 和类 Unix 系统。它可上传和显示图片、GIF、视频、代码和格式化文本，并支持文件上传下载。网页界面还提供多用户管理、上传历史和搜索功能。
  tagline:
    en_US: A simple, self-hosted, lightweight PHP file manager that support the instant sharing tool ShareX and *NIX systems. It supports uploading and displaying images, GIF, video, code, formatted text, and file downloading and uploading. Also have a web UI with multi user management, past uploads history and search support.
    zh_CN: 支持 ShareX 的轻量自托管文件管理器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/xbackbone-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/xbackbone-logo.png
  title:
    en_US: Xbackbone (LinuxServer.io)
    zh_CN: Xbackbone（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverxbackbone
  port_map: '80'
  version: 3.8.2
