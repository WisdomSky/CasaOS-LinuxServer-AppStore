    ml_IN: തൽക്ഷണ പങ്കിടൽ ഉപകരണമായ ShareX, *NIX സിസ്റ്റങ്ങളെ പിന്തുണയ്ക്കുന്ന ലളിതവും സ്വയം ഹോസ്റ്റ് ചെയ്തതും ഭാരം കുറഞ്ഞതുമായ PHP ഫയൽ മാനേജർ. ഇമേജുകൾ, GIF, വീഡിയോ, കോഡ്, ഫോർമാറ്റ് ചെയ്ത ടെക്സ്റ്റ്, ഫയൽ ഡൗൺലോഡ്, അപ്‌ലോഡിംഗ് എന്നിവ അപ്‌ലോഡ് ചെയ്യുന്നതിനും പ്രദർശിപ്പിക്കുന്നതിനും ഇത് പിന്തുണയ്ക്കുന്നു. മൾട്ടി യൂസർ മാനേജ്‌മെന്റ്, മുൻകാല അപ്‌ലോഡ് ചരിത്രം, തിരയൽ പിന്തുണ എന്നിവയുള്ള ഒരു വെബ് UI കൂടിയുണ്ട്.
    nb_NO: En enkel, selvhostet og lett PHP-filbehandler som støtter delingsverktøyene ShareX og *NIX. Den støtter opplasting og visning av bilder, GIF-er, videoer, kode, formatert tekst og nedlasting og opplasting av filer. Den har også et webgrensesnitt med flerbrukeradministrasjon, tidligere opplastingshistorikk og søkestøtte.
    nl_NL: Een eenvoudige, zelfgehoste, lichtgewicht PHP-bestandsbeheerder die de tool voor direct delen ShareX en *NIX-systemen ondersteunt. Het ondersteunt het uploaden en weergeven van afbeeldingen, GIF's, video's, code, opgemaakte tekst en het downloaden en uploaden van bestanden. Het beschikt ook over een webinterface met beheer voor meerdere gebruikers, een uploadgeschiedenis en zoekfunctionaliteit.
    pl_PL: Prosty, samodzielnie hostowany, lekki menedżer plików PHP, obsługujący narzędzie do natychmiastowego udostępniania ShareX i systemy *NIX. Obsługuje przesyłanie i wyświetlanie obrazów, plików GIF, wideo, kodu, tekstu sformatowanego oraz pobieranie i przesyłanie plików. Posiada również interfejs webowy z obsługą wielu użytkowników, historią przesyłania i wyszukiwaniem.
    pt_BR: Um gerenciador de arquivos PHP simples, auto-hospedado e leve, compatível com a ferramenta de compartilhamento instantâneo ShareX e sistemas *NIX. Ele permite o upload e a exibição de imagens, GIFs, vídeos, código, texto formatado, além de download e upload de arquivos. Possui também uma interface web com gerenciamento multiusuário, histórico de uploads e suporte a busca.
    ro_RO: Un manager de fișiere PHP simplu, auto-găzduit și ușor, compatibil cu instrumentul de partajare instantanee ShareX și sistemele *NIX. Acceptă încărcarea și afișarea de imagini, GIF-uri, videoclipuri, cod, text formatat, precum și descărcarea și încărcarea de fișiere. De asemenea, are o interfață web cu gestionare pentru mai mulți utilizatori, istoricul încărcărilor anterioare și suport pentru căutare.
    ru_RU: Простой, саморазмещаемый, легковесный PHP-файловый менеджер, поддерживающий инструмент мгновенного обмена файлами ShareX и системы *NIX. Он поддерживает загрузку и отображение изображений, GIF-файлов, видео, кода, форматированного текста, а также скачивание и выгрузку файлов. Также имеет веб-интерфейс с многопользовательским управлением, историей загрузок и поддержкой поиска.
    sk_SK: Jednoduchý, samostatne hostovaný a ľahký správca súborov PHP, ktorý podporuje nástroj na okamžité zdieľanie ShareX a systémy *NIX. Podporuje nahrávanie a zobrazovanie obrázkov, GIFov, videa, kódu, formátovaného textu a sťahovanie a nahrávanie súborov. Má tiež webové rozhranie so správou pre viacerých používateľov, históriou predchádzajúcich nahrávaní a podporou vyhľadávania.
    sv_SE: En enkel, självhostad och lätt PHP-filhanterare som stöder de direkta delningsverktygen ShareX och *NIX-systemen. Den stöder uppladdning och visning av bilder, GIF, video, kod, formaterad text samt nedladdning och uppladdning av filer. Har även ett webbgränssnitt med hantering av flera användare, tidigare uppladdningshistorik och sökstöd.
    tr_TR: ShareX anlık paylaşım aracını ve *NIX sistemlerini destekleyen, basit, kendi sunucunuzda barındırabileceğiniz, hafif bir PHP dosya yöneticisi. Görüntü, GIF, video, kod, biçimlendirilmiş metin yükleme ve görüntüleme, dosya indirme ve yükleme işlemlerini destekler. Ayrıca çoklu kullanıcı yönetimi, geçmiş yükleme geçmişi ve arama desteği sunan bir web arayüzüne de sahiptir.
    zh_CN: 支持 ShareX 的轻量自托管文件管理器。
    zh_TW: 支援 ShareX 的輕量自託管檔案管理器。
