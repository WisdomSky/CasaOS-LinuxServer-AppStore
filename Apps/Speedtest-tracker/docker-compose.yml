name: linuxserver-speedtest-tracker
services:
  app:
    image: linuxserver/speedtest-tracker:1.15.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_KEY: ''
      APP_URL: ''
      DB_CONNECTION: ''
      SPEEDTEST_SCHEDULE: ''
      SPEEDTEST_SERVERS: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_DATABASE: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DISPLAY_TIMEZONE: ''
      PRUNE_RESULTS_OLDER_THAN: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: APP_KEY
          description:
            en_US: App key used for encrypting stored data. You can generate a key as per https://speedtest-tracker.dev
        - container: APP_URL
          description:
            en_US: The IP:port or URL your application will be accessed on (ie. http://192.168.1.1:6875 or https://bookstack.mydomain.com
        - container: DB_CONNECTION
          description:
            en_US: Set the database type to use. sqlite, pgsql, or mysql
        - container: SPEEDTEST_SCHEDULE
          description:
            en_US: Set the test schedule in cron format. e.g. 0 */6 * * *
        - container: SPEEDTEST_SERVERS
          description:
            en_US: A comma-separated list of server IDs to test against. Run docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/speedtest-tracker:latest list-servers to get a list of nearby servers.
        - container: DB_HOST
          description:
            en_US: Database hostname (postgres/mysql). [OPTIONAL]
        - container: DB_PORT
          description:
            en_US: Database port (postgres/mysql). [OPTIONAL]
        - container: DB_DATABASE
          description:
            en_US: Database name (postgres/mysql). [OPTIONAL]
        - container: DB_USERNAME
          description:
            en_US: Database username (postgres/mysql). [OPTIONAL]
        - container: DB_PASSWORD
          description:
            en_US: Database password (postgres/mysql). [OPTIONAL]
        - container: DISPLAY_TIMEZONE
          description:
            en_US: Timezone for the UI. [OPTIONAL]
        - container: PRUNE_RESULTS_OLDER_THAN
          description:
            en_US: Days to keep test results. [OPTIONAL]
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/speedtest-tracker/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Speedtest-tracker is a self-hosted internet performance tracking application that runs speedtest checks against Ookla's Speedtest service.
    ca_ES: Speedtest-tracker és una aplicació de seguiment del rendiment d'Internet autoallotjada que executa comprovacions de velocitat amb el servei Speedtest d'Ookla.
    cs_CZ: Speedtest-tracker je aplikace pro sledování výkonu internetu s vlastním hostingem, která provádí testy rychlosti pomocí služby Speedtest od Ookla.
    da_DK: Speedtest-tracker er en selvhostet applikation til sporing af internetpræstation, der kører speedtest-tjek mod Ooklas Speedtest-tjeneste.
    de_DE: Speedtest-tracker ist eine selbstgehostete Anwendung zur Überwachung der Internetleistung, die Geschwindigkeitstests gegen den Speedtest-Dienst von Ookla durchführt.
    el_GR: Το Speedtest-tracker είναι μια αυτοφιλοξενούμενη εφαρμογή παρακολούθησης της απόδοσης του διαδικτύου που εκτελεί ελέγχους ταχύτητας σε σχέση με την υπηρεσία Speedtest της Ookla.
    en_GB: Speedtest-tracker is a self-hosted internet performance tracking application that runs speedtest checks against Ookla's Speedtest service.
    es_ES: Speedtest-tracker es una aplicación autoalojada para el seguimiento del rendimiento de Internet que realiza pruebas de velocidad utilizando el servicio Speedtest de Ookla.
    fr_FR: Speedtest-tracker est une application auto-hébergée de suivi des performances Internet qui effectue des tests de vitesse sur le service Speedtest d'Ookla.
    ga_IE: Is feidhmchlár féinóstáilte rianaithe feidhmíochta idirlín é Speedtest-tracker a ritheann seiceálacha tástála luais i gcoinne sheirbhís Speedtest Ookla.
    hr_HR: Speedtest-tracker je samostalno hostana aplikacija za praćenje performansi interneta koja provodi provjere brzine na Ooklinoj Speedtest usluzi.
    hu_HU: A Speedtest-tracker egy saját üzemeltetésű internetes teljesítménykövető alkalmazás, amely sebességteszteket futtat az Ookla Speedtest szolgáltatásával.
    it_IT: Speedtest-tracker è un'applicazione self-hosted per il monitoraggio delle prestazioni internet che esegue test di velocità utilizzando il servizio Speedtest di Ookla.
    ja_JP: Speedtest-trackerは、OoklaのSpeedtestサービスに対して速度テストを実行する、自己ホスト型のインターネットパフォーマンス追跡アプリケーションです。
    ko_KR: Speedtest-tracker는 Ookla의 Speedtest 서비스를 대상으로 속도 테스트를 실행하는 자체 호스팅 인터넷 성능 추적 애플리케이션입니다.
    ml_IN: സ്പീഡ് ടെസ്റ്റ്-ട്രാക്കർ എന്നത് ഒരു സ്വയം ഹോസ്റ്റ് ചെയ്ത ഇന്റർനെറ്റ് പ്രകടന ട്രാക്കിംഗ് ആപ്ലിക്കേഷനാണ്, ഇത് ഊക്ലയുടെ സ്പീഡ് ടെസ്റ്റ് സേവനവുമായി ബന്ധപ്പെട്ട് സ്പീഡ് ടെസ്റ്റ് പരിശോധനകൾ നടത്തുന്നു.
    nb_NO: Speedtest-tracker er et selvhostet program for sporing av internettytelse som kjører hastighetstester mot Ooklas Speedtest-tjeneste.
    nl_NL: Speedtest-tracker is een zelfgehoste applicatie voor het bijhouden van internetprestaties die snelheidstests uitvoert via de Speedtest-service van Ookla.
    pl_PL: Speedtest-tracker to samodzielnie hostowana aplikacja do śledzenia wydajności łącza internetowego, która wykonuje testy prędkości w usłudze Speedtest firmy Ookla.
    pt_BR: O Speedtest-tracker é um aplicativo de monitoramento de desempenho da internet hospedado localmente que executa testes de velocidade utilizando o serviço Speedtest da Ookla.
    ro_RO: Speedtest-tracker este o aplicație auto-găzduită de urmărire a performanței conexiunii la internet care execută verificări de viteză prin intermediul serviciului Speedtest de la Ookla.
    ru_RU: Speedtest-tracker — это приложение для отслеживания скорости интернета, которое размещается на собственном сервере и выполняет проверку скорости с помощью сервиса Speedtest от Ookla.
    sk_SK: Speedtest-tracker je aplikácia na sledovanie výkonu internetu s vlastným hostingom, ktorá vykonáva kontroly rýchlosti v službe Speedtest od spoločnosti Ookla.
    sv_SE: Speedtest-tracker är en självhostad applikation för spårning av internetprestanda som kör hastighetstester mot Ooklas Speedtest-tjänst.
    tr_TR: Speedtest-tracker, Ookla'nın Speedtest hizmetine karşı hız testi yapan, kendi sunucunuzda barındırdığınız bir internet performans takip uygulamasıdır.
    zh_CN: Speedtest Tracker 是可自行托管的互联网性能追踪应用，通过 Ookla 的 Speedtest 服务执行测速。
    zh_TW: Speedtest Tracker 是可自行託管的網際網路效能追蹤應用，透過 Ookla 的 Speedtest 服務執行測速。
