name: linuxserver-sickgear
services:
  app:
    image: linuxserver/sickgear:3.36.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sickgear/config
        target: /config
      - type: bind
        source: /DATA/AppData/sickgear/tv
        target: /tv
      - type: bind
        source: /DATA/AppData/sickgear/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'SickGear provides management of TV shows and/or Anime, it detects new episodes, links downloader apps, and more.. For more information on SickGear visit their website and check it out: https://github.com/SickGear/SickGear'
    ca_ES: 'SickGear proporciona gestió de programes de televisió i/o anime, detecta nous episodis, enllaça aplicacions de descàrrega i molt més. Per a més informació sobre SickGear, visiteu el seu lloc web i consulteu-lo: https://github.com/SickGear/SickGear'
    cs_CZ: 'SickGear umožňuje správu televizních pořadů a/nebo anime, detekuje nové epizody, odkazuje na aplikace pro stahování a další. Více informací o SickGear naleznete na jejich webových stránkách: https://github.com/SickGear/SickGear'
    da_DK: 'SickGear håndterer tv-serier og/eller anime, registrerer nye episoder, linker til download-apps og meget mere. For mere information om SickGear, besøg deres hjemmeside og tjek det ud: https://github.com/SickGear/SickGear'
    de_DE: 'SickGear dient der Verwaltung von Fernsehserien und/oder Anime, erkennt neue Folgen, verlinkt Download-Apps und vieles mehr. Weitere Informationen zu SickGear finden Sie auf der Website: https://github.com/SickGear/SickGear'
    el_GR: 'Το SickGear παρέχει διαχείριση τηλεοπτικών εκπομπών ή/και Anime, ανιχνεύει νέα επεισόδια, συνδέει εφαρμογές λήψης και πολλά άλλα. Για περισσότερες πληροφορίες σχετικά με το SickGear, επισκεφθείτε την ιστοσελίδα τους: https://github.com/SickGear/SickGear'
    en_GB: 'Sickgear provides management of Tv shows and/or Anime, it detects new episodes, links downloader apps, and more.. For more information on Sickgear visit their website and check it out: https://github.com/SickGear/SickGear'
    es_ES: 'SickGear ofrece gestión de series de televisión y/o anime, detecta nuevos episodios, enlaza aplicaciones de descarga y mucho más. Para obtener más información sobre SickGear, visita su sitio web: https://github.com/SickGear/SickGear'
    fr_FR: "SickGear permet de gérer les séries TV et/ou les animés, de détecter les nouveaux épisodes, de se connecter aux applications de téléchargement, et bien plus encore… Pour en savoir plus sur SickGear, rendez-vous sur leur site web\_: https://github.com/SickGear/SickGear"
    ga_IE: 'Cuireann SickGear bainistíocht ar fáil ar chláir teilifíse agus/nó Anime, braitheann sé eipeasóidí nua, nascann sé aipeanna íoslódála, agus níos mó. Chun tuilleadh eolais a fháil faoi SickGear, tabhair cuairt ar a suíomh Gréasáin agus féach air: https://github.com/SickGear/SickGear'
    hr_HR: 'SickGear omogućuje upravljanje TV emisijama i/ili animeima, otkriva nove epizode, povezuje aplikacije za preuzimanje i još mnogo toga. Za više informacija o SickGearu posjetite njihovu web stranicu: https://github.com/SickGear/SickGear'
    hu_HU: 'A SickGear biztosítja a tévéműsorok és/vagy animék kezelését, új epizódok észlelését, letöltőalkalmazások összekapcsolását és egyebeket. További információkért a SickGearről látogassa meg weboldalukat: https://github.com/SickGear/SickGear'
    it_IT: 'SickGear permette di gestire serie TV e/o anime, rileva i nuovi episodi, collega le app per il download e molto altro. Per maggiori informazioni su SickGear, visita il loro sito web: https://github.com/SickGear/SickGear'
    ja_JP: SickGearは、テレビ番組やアニメの管理機能を提供し、新しいエピソードを検出し、ダウンロードアプリと連携するなど、さまざまな機能を備えています。SickGearの詳細については、ウェブサイト（https://github.com/SickGear/SickGear）をご覧ください。
    ko_KR: SickGear는 TV 프로그램 및 애니메이션 관리 기능을 제공하며, 새 에피소드를 감지하고 다운로더 앱을 연동하는 등의 기능을 제공합니다. SickGear에 대한 자세한 정보는 웹사이트(https://github.com/SickGear/SickGear)에서 확인하세요.
    ml_IN: 'ടിവി ഷോകളുടെയും/അല്ലെങ്കിൽ ആനിമേഷന്റെയും മാനേജ്‌മെന്റ് സിക്ക്‌ഗിയർ നൽകുന്നു, പുതിയ എപ്പിസോഡുകൾ കണ്ടെത്തുന്നു, ഡൗൺലോഡർ ആപ്പുകളുടെ ലിങ്കുകൾ നൽകുന്നു, തുടങ്ങിയവ.. സിക്ക്‌ഗിയറിനെക്കുറിച്ചുള്ള കൂടുതൽ വിവരങ്ങൾക്ക് അവരുടെ വെബ്‌സൈറ്റ് സന്ദർശിച്ച് പരിശോധിക്കുക: https://github.com/SickGear/SickGear'
    nb_NO: 'SickGear tilbyr administrasjon av TV-serier og/eller anime, den oppdager nye episoder, lenker nedlastingsapper og mer. For mer informasjon om SickGear, besøk nettstedet deres og sjekk det ut: https://github.com/SickGear/SickGear'
    nl_NL: 'SickGear biedt een platform voor het beheren van tv-series en/of anime, detecteert nieuwe afleveringen, koppelt download-apps en nog veel meer. Ga voor meer informatie over SickGear naar hun website: https://github.com/SickGear/SickGear'
    pl_PL: 'SickGear umożliwia zarządzanie programami TV i/lub anime, wykrywa nowe odcinki, łączy aplikacje do pobierania i wiele więcej. Aby uzyskać więcej informacji na temat SickGear, odwiedź ich stronę internetową: https://github.com/SickGear/SickGear'
    pt_BR: 'O SickGear permite gerenciar séries de TV e/ou animes, detecta novos episódios, conecta aplicativos de download e muito mais. Para mais informações sobre o SickGear, visite o site deles: https://github.com/SickGear/SickGear'
    ro_RO: 'SickGear oferă servicii de gestionare a emisiunilor TV și/sau anime-urilor, detectează episoade noi, oferă linkuri către aplicații de descărcare și multe altele. Pentru mai multe informații despre SickGear, vizitați site-ul lor web: https://github.com/SickGear/SickGear'
    ru_RU: 'SickGear обеспечивает управление телешоу и/или аниме, распознает новые серии, связывает приложения для загрузки и многое другое. Для получения дополнительной информации о SickGear посетите их веб-сайт и ознакомьтесь с ним: https://github.com/SickGear/SickGear'
    sk_SK: 'SickGear poskytuje správu televíznych relácií a/alebo anime, detekuje nové epizódy, prepojuje aplikácie na sťahovanie a mnoho ďalšieho. Viac informácií o SickGear nájdete na ich webovej stránke: https://github.com/SickGear/SickGear'
    sv_SE: 'SickGear hanterar TV-program och/eller Anime, upptäcker nya avsnitt, länkar till nedladdningsappar och mer. För mer information om SickGear, besök deras webbplats och kolla in den: https://github.com/SickGear/SickGear'
    tr_TR: 'SickGear, TV şovlarının ve/veya animelerin yönetimini sağlar, yeni bölümleri tespit eder, indirme uygulamalarına bağlantı verir ve daha fazlasını yapar. SickGear hakkında daha fazla bilgi için web sitelerini ziyaret edin ve inceleyin: https://github.com/SickGear/SickGear'
    zh_CN: SickGear 提供电视剧和动画管理功能，可检测新集、连接下载应用等。更多信息请访问：https://github.com/SickGear/SickGear
    zh_TW: SickGear 提供電視劇和動畫管理功能，可檢測新集、連線下載應用等。更多資訊請訪問：https://github.com/SickGear/SickGear
