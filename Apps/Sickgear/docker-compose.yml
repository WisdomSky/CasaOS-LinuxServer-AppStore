name: linuxserver-sickgear
services:
  app:
    image: linuxserver/sickgear:3.36.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sickgear/config
        target: /config
      - type: bind
        source: /DATA/AppData/sickgear/tv
        target: /tv
      - type: bind
        source: /DATA/AppData/sickgear/downloads
        target: /downloads
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: 'SickGear provides management of TV shows and/or Anime, it detects new episodes, links downloader apps, and more.. For more information on SickGear visit their website and check it out: https://github.com/SickGear/SickGear'
    zh_CN: SickGear 提供电视剧和动画管理功能，可检测新集、连接下载应用等。更多信息请访问：https://github.com/SickGear/SickGear
  tagline:
    en_US: 'Provides management of TV shows and/or Anime, it detects new episodes, links downloader apps, and more. . For more information on SickGear visit their website and check it out: https://github. Com/SickGear/SickGear'
    zh_CN: 追踪电视剧与动画新集，并连接下载应用。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sickgear-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sickgear-logo.png
  title:
    en_US: Sickgear (LinuxServer.io)
    zh_CN: Sickgear（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserversickgear
  port_map: '8081'
  version: 3.36.6
