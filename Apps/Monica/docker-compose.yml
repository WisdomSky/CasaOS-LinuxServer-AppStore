name: linuxserver-monica
services:
  app:
    image: linuxserver/monica:4.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_HOST: ''
      DB_PORT: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      APP_URL: ''
      TRUSTED_PROXIES: ''
      APP_ENV: ''
      APP_DISABLE_SIGNUP: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: DB_HOST
          description:
            en_US: Mariadb DB server hostname.
        - container: DB_PORT
          description:
            en_US: Mariadb DB server port.
        - container: DB_USERNAME
          description:
            en_US: Mariadb DB user.
        - container: DB_PASSWORD
          description:
            en_US: Mariadb DB password.
        - container: DB_DATABASE
          description:
            en_US: Mariadb DB name.
        - container: APP_URL
          description:
            en_US: The URL you will use to access Monica including protocol, and port where appropriate. [OPTIONAL]
        - container: TRUSTED_PROXIES
          description:
            en_US: Set to the IP or netmask covering your reverse proxy, if running behind one. Set to ` to trust all IPs (do not* use * if exposed to the internet). [OPTIONAL]
        - container: APP_ENV
          description:
            en_US: Set to production when exposing the container to anyone else; this also makes https mandatory. [OPTIONAL]
        - container: APP_DISABLE_SIGNUP
          description:
            en_US: Set to false to enable new account sign-ups. [OPTIONAL]
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/monica/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Monica is an open source personal relationship management system, that lets you document your life.
    zh_CN: Monica 是一个开源个人关系管理系统，可帮助你记录生活。
    ca_ES: Monica és un sistema de gestió de relacions personals de codi obert que et permet documentar la teva vida.
    cs_CZ: Monica je open source systém pro správu osobních vztahů, který vám umožňuje dokumentovat váš život.
    da_DK: Monica er et open source-system til håndtering af personlige relationer, der giver dig mulighed for at dokumentere dit liv.
    de_DE: Monica ist ein Open-Source-System zur Verwaltung persönlicher Beziehungen, mit dem Sie Ihr Leben dokumentieren können.
    el_GR: Το Monica είναι ένα σύστημα διαχείρισης προσωπικών σχέσεων ανοιχτού κώδικα, που σας επιτρέπει να καταγράφετε τη ζωή σας.
