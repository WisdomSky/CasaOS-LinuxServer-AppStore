name: linuxserver-helium
services:
  app:
    image: linuxserver/helium:0.17.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: HELIUM_CLI
          description:
            en_US: Specify one or multiple Chromium CLI flags, this string will be passed to the application in full. [OPTIONAL]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Helium is a Chromium-based web browser made for people, with love. Privacy-first with unbiased ad-blocking.
    ca_ES: Helium és un navegador web basat en Chromium fet per a persones, amb amor. La privadesa és el primer amb bloqueig d'anuncis imparcial.
    cs_CZ: Helium je webový prohlížeč založený na Chromu, vytvořený pro lidi s láskou. Soukromí na prvním místě s objektivním blokováním reklam.
    da_DK: Helium er en Chromium-baseret webbrowser, der er skabt til mennesker med kærlighed. Privatliv først med upartisk annonceblokering.
    de_DE: Helium ist ein auf Chromium basierender Webbrowser, der mit viel Liebe und für Menschen entwickelt wurde. Datenschutz steht an erster Stelle, inklusive unvoreingenommener Werbeblockierung.
    el_GR: Το Helium είναι ένα πρόγραμμα περιήγησης ιστού που βασίζεται στο Chromium, φτιαγμένο για ανθρώπους, με αγάπη. Προτεραιότητα στην ιδιωτικότητα με αμερόληπτο αποκλεισμό διαφημίσεων.
    en_GB: Helium is a Chromium-based web browser made for people, with love. Privacy-first with unbiased ad-blocking.
    es_ES: Helium es un navegador web basado en Chromium, creado con cariño y pensando en las personas. Prioriza la privacidad con un bloqueo de anuncios imparcial.
    fr_FR: Helium est un navigateur web basé sur Chromium, conçu pour les utilisateurs, avec passion. Le respect de la vie privée est au cœur de sa conception, avec un blocage des publicités impartial.
    ga_IE: Is brabhsálaí gréasáin bunaithe ar Chromium é Helium atá déanta do dhaoine, le grá. Príobháideacht ar dtús le blocáil fógraí neamhchlaonta.
    hr_HR: Helium je web preglednik temeljen na Chromiumu, napravljen za ljude, s ljubavlju. Privatnost na prvom mjestu s nepristranim blokiranjem oglasa.
    hu_HU: A Helium egy Chromium alapú webböngésző, amelyet embereknek, szeretettel készítettek. Az adatvédelem az elsődleges, elfogulatlan hirdetésblokkolóval.
    it_IT: Helium è un browser web basato su Chromium, creato con amore e pensato per le persone. La privacy è al primo posto, con un blocco degli annunci imparziale.
    ja_JP: Heliumは、ユーザーのために愛情を込めて作られたChromiumベースのウェブブラウザです。プライバシーを最優先し、偏りのない広告ブロック機能を提供します。
    ko_KR: Helium은 사람들을 위해, 애정을 담아 만든 Chromium 기반 웹 브라우저입니다. 개인정보 보호를 최우선으로 하며, 편견 없는 광고 차단 기능을 제공합니다.
    ml_IN: ഹീലിയം എന്നത് ആളുകൾക്കായി, സ്നേഹത്തോടെ നിർമ്മിച്ച ഒരു ക്രോമിയം അധിഷ്ഠിത വെബ് ബ്രൗസറാണ്. നിഷ്പക്ഷമായ പരസ്യ ബ്ലോക്കിംഗിലൂടെ സ്വകാര്യതയ്ക്ക് പ്രഥമസ്ഥാനം.
    nb_NO: Helium er en Chromium-basert nettleser laget for mennesker, med kjærlighet. Personvern først med objektiv annonseblokkering.
    nl_NL: Helium is een op Chromium gebaseerde webbrowser, gemaakt voor mensen, met liefde. Privacy staat voorop, met een onpartijdige advertentieblokkering.
    pl_PL: Helium to przeglądarka internetowa oparta na Chromium, stworzona z miłością dla ludzi. Prywatność na pierwszym miejscu, z bezstronnym blokowaniem reklam.
    pt_BR: O Helium é um navegador web baseado no Chromium, feito para pessoas, com carinho. Prioriza a privacidade e oferece bloqueio de anúncios imparcial.
    ro_RO: Helium este un browser web bazat pe Chromium, creat pentru oameni, cu dragoste. Confidențialitatea pe primul loc, cu blocare imparțială a reclamelor.
    ru_RU: Helium — это веб-браузер на основе Chromium, созданный для людей с любовью. Конфиденциальность превыше всего, а блокировка рекламы — беспристрастная.
    sk_SK: Helium je webový prehliadač založený na prehliadači Chromium, vytvorený pre ľudí s láskou. Súkromie je na prvom mieste s nestranným blokovaním reklám.
    sv_SE: Helium är en webbläsare baserad på Chromium, skapad för människor, med kärlek. Integritet först med opartisk annonsblockering.
    tr_TR: Helium, insanlar için sevgiyle geliştirilmiş, Chromium tabanlı bir web tarayıcısıdır. Gizliliği ön planda tutar ve tarafsız reklam engelleme özelliğine sahiptir.
    zh_CN: Helium 是一款基于 Chromium、以用户为中心的网页浏览器。它将隐私放在首位，并提供不偏袒广告商的广告拦截功能。
    zh_TW: Helium 是一款基於 Chromium、以使用者為中心的網頁瀏覽器。它將隱私放在首位，並提供不偏袒廣告商的廣告攔截功能。
