name: linuxserver-minetest
services:
  app:
    image: linuxserver/minetest:5.10.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: for UserID
        - container: PGID
          description:
            en_US: for GroupID
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: CLI_ARGS
          description:
            en_US: Optionally specify any CLI variables you want to launch the app with
      volumes:
        - container: /config/.minetest
          description:
            en_US: 'Container Path: /config/.minetest'
      ports:
        - container: '30000'
          description:
            en_US: 'Container Port: 30000'
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/minetest/config/.minetest
        target: /config/.minetest
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
