    pt_BR: (server) é um jogo sandbox de blocos com um mundo quase infinito e um motor de jogo, inspirado em InfiniMiner, Minecraft e similares.
    ro_RO: (server) este un joc sandbox cu blocuri, cu o lume aproape infinită, și un motor de joc, inspirat de InfiniMiner, Minecraft și altele asemenea.
    ru_RU: (сервер) — это блочная песочница с почти бесконечным миром и игровой движок, вдохновлённый InfiniMiner, Minecraft и подобными играми.
