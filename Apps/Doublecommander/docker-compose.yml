name: linuxserver-doublecommander
services:
  app:
    image: linuxserver/doublecommander:version-8143f818
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/doublecommander/config
        target: /config
      - type: bind
        source: /DATA/AppData/doublecommander/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Double Commander is a free cross platform open source file manager with two panels side by side. It is inspired by Total Commander and features some new ideas.
    zh_CN: Double Commander 是一款免费的跨平台开源文件管理器，采用并排双面板布局。它受到 Total Commander 启发，并加入了一些新设计。
  tagline:
    en_US: A free cross platform open source file manager with two panels side by side. It is inspired by Total Commander and features some new ideas.
    zh_CN: 跨平台、开源的双面板文件管理器。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/doublecommander-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/doublecommander-icon.png
  title:
    en_US: Doublecommander (LinuxServer.io)
    zh_CN: Doublecommander（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverdoublecommander
  port_map: '3000'
  version: version-8143f818
