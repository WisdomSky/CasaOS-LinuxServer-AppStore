name: linuxserver-doublecommander
services:
  app:
    image: linuxserver/doublecommander:version-8143f818
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/doublecommander/config
        target: /config
      - type: bind
        source: /DATA/AppData/doublecommander/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Double Commander is a free cross platform open source file manager with two panels side by side. It is inspired by Total Commander and features some new ideas.
    ca_ES: Double Commander és un gestor de fitxers de codi obert i multiplataforma gratuït amb dos panells un al costat de l'altre. Està inspirat en Total Commander i presenta algunes idees noves.
    cs_CZ: Double Commander je bezplatný multiplatformní open source souborový správce se dvěma panely vedle sebe. Je inspirován Total Commanderu a nabízí několik nových nápadů.
    da_DK: Double Commander er en gratis, tværplatformsbaseret open source-filhåndtering med to paneler side om side. Den er inspireret af Total Commander og indeholder nogle nye ideer.
    de_DE: Double Commander ist ein kostenloser, plattformübergreifender Open-Source-Dateimanager mit zwei nebeneinanderliegenden Fenstern. Er ist von Total Commander inspiriert und bietet einige neue Funktionen.
    el_GR: Το Double Commander είναι ένας δωρεάν διαχειριστής αρχείων ανοιχτού κώδικα σε όλες τις πλατφόρμες με δύο πάνελ δίπλα-δίπλα. Είναι εμπνευσμένο από το Total Commander και διαθέτει μερικές νέες ιδέες.
    en_GB: Double Commander is a free cross platform open source file manager with two panels side by side. It is inspired by Total Commander and features some new ideas.
    es_ES: Double Commander es un gestor de archivos multiplataforma gratuito de código abierto con dos paneles uno al lado del otro. Está inspirado en Total Commander e incorpora algunas ideas nuevas.
    fr_FR: Double Commander est un gestionnaire de fichiers open source multiplateforme gratuit, doté de deux panneaux côte à côte. Inspiré de Total Commander, il propose également des nouveautés.
    ga_IE: Is bainisteoir comhad foinse oscailte tras-ardáin saor in aisce é Double Commander le dhá phainéal taobh le taobh. Tá sé spreagtha ag Total Commander agus tá roinnt smaointe nua ann.
    hr_HR: Double Commander je besplatni višeplatformski upravitelj datoteka otvorenog koda s dva panela jedan pored drugog. Inspiriran je Total Commanderom i sadrži neke nove ideje.
    hu_HU: A Double Commander egy ingyenes, többplatformos, nyílt forráskódú fájlkezelő, két egymás melletti panellel. A Total Commander ihlette, és néhány új ötletet is tartalmaz.
    it_IT: Double Commander è un file manager gratuito, multipiattaforma e open source, con due pannelli affiancati. Si ispira a Total Commander e presenta alcune nuove idee.
    ja_JP: Double Commanderは、2つのパネルを並べて表示する、無料のクロスプラットフォーム対応オープンソースファイルマネージャーです。Total Commanderにインスパイアされており、いくつかの新しいアイデアが盛り込まれています。
    ko_KR: Double Commander는 두 개의 패널이 나란히 표시되는 무료 크로스 플랫폼 오픈 소스 파일 관리자입니다. Total Commander에서 영감을 받았으며 몇 가지 새로운 아이디어를 특징으로 합니다.
    ml_IN: ഡബിൾ കമാൻഡർ എന്നത് രണ്ട് പാനലുകൾ അടുത്തടുത്തായി ഉള്ള ഒരു സൌജന്യ ക്രോസ് പ്ലാറ്റ്‌ഫോം ഓപ്പൺ സോഴ്‌സ് ഫയൽ മാനേജറാണ്. ടോട്ടൽ കമാൻഡറിൽ നിന്ന് പ്രചോദനം ഉൾക്കൊണ്ട് നിർമ്മിച്ച ഇത് ചില പുതിയ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു.
    nb_NO: Double Commander er en gratis, plattformuavhengig, åpen kildekode-filbehandler med to paneler side om side. Den er inspirert av Total Commander og har noen nye ideer.
    nl_NL: Double Commander is een gratis, platformonafhankelijke, open-source bestandsbeheerder met twee panelen naast elkaar. Het is geïnspireerd op Total Commander en bevat een aantal nieuwe ideeën.
    pl_PL: Double Commander to darmowy, wieloplatformowy menedżer plików o otwartym kodzie źródłowym, z dwoma panelami obok siebie. Jest inspirowany Total Commanderem i oferuje kilka nowych pomysłów.
    pt_BR: Double Commander é um gerenciador de arquivos gratuito, multiplataforma e de código aberto, com dois painéis lado a lado. Ele foi inspirado no Total Commander e apresenta algumas ideias novas.
    ro_RO: Double Commander este un manager de fișiere open source gratuit și multiplatformă, cu două panouri alăturate. Este inspirat de Total Commander și prezintă câteva idei noi.
    ru_RU: Double Commander — это бесплатный кроссплатформенный файловый менеджер с открытым исходным кодом, имеющий две панели, расположенные рядом. Он вдохновлён Total Commander и включает в себя ряд новых идей.
    sk_SK: Double Commander je bezplatný multiplatformový open source správca súborov s dvoma panelmi vedľa seba. Je inšpirovaný programom Total Commander a prináša niekoľko nových nápadov.
    sv_SE: Double Commander är en gratis plattformsoberoende filhanterare med öppen källkod och två paneler bredvid varandra. Den är inspirerad av Total Commander och innehåller några nya idéer.
    tr_TR: Double Commander, yan yana iki panelden oluşan, ücretsiz, platformlar arası ve açık kaynaklı bir dosya yöneticisidir. Total Commander'dan esinlenilmiştir ve bazı yeni fikirler içermektedir.
    zh_CN: Double Commander 是一款免费的跨平台开源文件管理器，采用并排双面板布局。它受到 Total Commander 启发，并加入了一些新设计。
    zh_TW: Double Commander 是一款免費的跨平臺開原始檔管理器，採用並排雙面板佈局。它受到 Total Commander 啟發，並加入了一些新設計。
