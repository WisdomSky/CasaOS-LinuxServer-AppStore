name: linuxserver-projectsend
services:
  app:
    image: linuxserver/projectsend:version-r2098
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/projectsend/config
        target: /config
      - type: bind
        source: /DATA/AppData/projectsend/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Projectsend is a self-hosted application that lets you upload files and assign them to specific clients that you create yourself. Secure, private and easy. No more depending on external services or e-mail to send those files.
    ca_ES: Projectsend és una aplicació autoallotjada que et permet carregar fitxers i assignar-los a clients específics que creïs tu mateix. Segur, privat i fàcil. Ja no hauràs de dependre de serveis externs ni del correu electrònic per enviar aquests fitxers.
    cs_CZ: Projectsend je samostatně hostovaná aplikace, která vám umožňuje nahrávat soubory a přiřazovat je konkrétním klientům, které si sami vytvoříte. Bezpečné, soukromé a snadné. Už žádné závislost na externích službách nebo e-mailu pro odesílání těchto souborů.
    da_DK: Projectsend er en selvhostet applikation, der giver dig mulighed for at uploade filer og tildele dem til specifikke klienter, som du selv opretter. Sikkert, privat og nemt. Du behøver ikke længere at være afhængig af eksterne tjenester eller e-mail for at sende disse filer.
    de_DE: Projectsend ist eine selbstgehostete Anwendung, mit der Sie Dateien hochladen und sie selbst erstellten Clients zuweisen können. Sicher, datenschutzfreundlich und einfach. Sie sind nicht mehr auf externe Dienste oder E-Mails angewiesen, um Ihre Dateien zu versenden.
    el_GR: Το Projectsend είναι μια εφαρμογή που φιλοξενείται αυτόματα και σας επιτρέπει να ανεβάζετε αρχεία και να τα αντιστοιχίζετε σε συγκεκριμένα προγράμματα-πελάτες που δημιουργείτε οι ίδιοι. Ασφαλές, ιδιωτικό και εύκολο. Τέλος στην εξάρτηση από εξωτερικές υπηρεσίες ή email για την αποστολή αυτών των αρχείων.
    en_GB: Projectsend is a self-hosted application that lets you upload files and assign them to specific clients that you create yourself. Secure, private and easy. No more depending on external services or e-mail to send those files.
    es_ES: Projectsend es una aplicación autoalojada que te permite subir archivos y asignarlos a clientes específicos que tú mismo creas. Segura, privada y fácil. Ya no tendrás que depender de servicios externos ni del correo electrónico para enviar esos archivos.
    fr_FR: Projectsend est une application auto-hébergée qui vous permet de téléverser des fichiers et de les attribuer à des clients que vous créez vous-même. Sécurisée, confidentielle et simple d'utilisation. Plus besoin de dépendre de services externes ou du courrier électronique pour envoyer vos fichiers.
    ga_IE: Is feidhmchlár féinóstáilte é Projectsend a ligeann duit comhaid a uaslódáil agus iad a shannadh do chliaint shonracha a chruthaíonn tú féin. Slán, príobháideach agus éasca. Ní gá a bheith ag brath ar sheirbhísí seachtracha ná ar ríomhphost a thuilleadh chun na comhaid sin a sheoladh.
    hr_HR: Projectsend je samostalno hostana aplikacija koja vam omogućuje prijenos datoteka i njihovo dodjeljivanje određenim klijentima koje sami kreirate. Sigurno, privatno i jednostavno. Nema više ovisnosti o vanjskim uslugama ili e-pošti za slanje tih datoteka.
    hu_HU: A Projectsend egy saját tárhelyen futó alkalmazás, amely lehetővé teszi fájlok feltöltését és hozzárendelését az Ön által létrehozott kliensekhez. Biztonságos, privát és egyszerű. Nincs többé szükség külső szolgáltatásokra vagy e-mailre a fájlok küldéséhez.
    it_IT: Projectsend è un'applicazione self-hosted che consente di caricare file e assegnarli a clienti specifici creati dall'utente. Sicura, privata e semplice. Non sarà più necessario dipendere da servizi esterni o dalla posta elettronica per inviare i file.
    ja_JP: Projectsendは、ファイルをアップロードして、自分で作成した特定のクライアントに割り当てることができる、セルフホスティング型のアプリケーションです。安全でプライベート、そして使いやすい。ファイルの送信に外部サービスやメールに頼る必要はもうありません。
    ko_KR: Projectsend는 자체 호스팅 애플리케이션으로, 파일을 업로드하고 직접 생성한 특정 클라이언트에게 파일을 할당할 수 있습니다. 안전하고 개인 정보가 보호되며 사용이 간편합니다. 더 이상 외부 서비스나 이메일에 의존하여 파일을 전송할 필요가 없습니다.
    ml_IN: പ്രൊജക്റ്റ്സെൻഡ് എന്നത് സ്വയം ഹോസ്റ്റ് ചെയ്ത ഒരു ആപ്ലിക്കേഷനാണ്, ഇത് ഫയലുകൾ അപ്‌ലോഡ് ചെയ്യാനും നിങ്ങൾ സ്വയം സൃഷ്ടിക്കുന്ന നിർദ്ദിഷ്ട ക്ലയന്റുകൾക്ക് അവ നൽകാനും നിങ്ങളെ അനുവദിക്കുന്നു. സുരക്ഷിതവും സ്വകാര്യവും എളുപ്പവുമാണ്. ആ ഫയലുകൾ അയയ്ക്കാൻ ഇനി ബാഹ്യ സേവനങ്ങളെയോ ഇ-മെയിലിനെയോ ആശ്രയിക്കേണ്ടതില്ല.
    nb_NO: Projectsend er et selvhostet program som lar deg laste opp filer og tilordne dem til bestemte klienter du oppretter selv. Sikkert, privat og enkelt. Du trenger ikke lenger å være avhengig av eksterne tjenester eller e-post for å sende disse filene.
    nl_NL: Projectsend is een zelfgehoste applicatie waarmee u bestanden kunt uploaden en toewijzen aan specifieke klanten die u zelf aanmaakt. Veilig, privé en eenvoudig. U bent niet langer afhankelijk van externe diensten of e-mail om die bestanden te versturen.
    pl_PL: Projectsend to aplikacja hostowana na własnym serwerze, która pozwala przesyłać pliki i przypisywać je do konkretnych klientów, których sam utworzysz. Bezpieczna, prywatna i prosta w obsłudze. Nie musisz już polegać na usługach zewnętrznych ani e-mailu, aby wysyłać te pliki.
    pt_BR: O Projectsend é um aplicativo auto-hospedado que permite o upload de arquivos e a atribuição deles a clientes específicos que você mesmo cria. Seguro, privado e fácil. Chega de depender de serviços externos ou e-mail para enviar arquivos.
    ro_RO: Projectsend este o aplicație auto-găzduită care vă permite să încărcați fișiere și să le atribuiți clienților specifici pe care îi creați singuri. Sigur, privat și ușor. Nu mai trebuie să depindeți de servicii externe sau de e-mail pentru a trimite acele fișiere.
    ru_RU: Projectsend — это приложение с самостоятельным размещением, позволяющее загружать файлы и назначать их конкретным клиентам, которых вы создаете самостоятельно. Безопасно, конфиденциально и просто. Больше не нужно зависеть от внешних сервисов или электронной почты для отправки файлов.
    sk_SK: Projectsend je samostatne hostovaná aplikácia, ktorá vám umožňuje nahrávať súbory a priraďovať ich konkrétnym klientom, ktorých si sami vytvoríte. Bezpečné, súkromné a jednoduché. Už žiadne spoliehanie sa na externé služby alebo e-mail pri odosielaní týchto súborov.
    sv_SE: Projectsend är en självhostad applikation som låter dig ladda upp filer och tilldela dem till specifika klienter som du själv skapar. Säkert, privat och enkelt. Du behöver inte längre vara beroende av externa tjänster eller e-post för att skicka dessa filer.
    tr_TR: Projectsend, dosyaları yüklemenize ve kendi oluşturduğunuz belirli istemcilere atamanıza olanak tanıyan, kendi sunucunuzda barındırdığınız bir uygulamadır. Güvenli, gizli ve kolay. Dosyaları göndermek için artık harici hizmetlere veya e-postaya bağımlı olmanıza gerek yok.
    zh_CN: ProjectSend 是一款可自行托管的应用，让你上传文件并分配给自己创建的指定客户。它安全、私密且易用，无需再依赖外部服务或电子邮件发送文件。
    zh_TW: ProjectSend 是一款可自行託管的應用，讓你上傳檔案並分配給自己建立的指定客戶。它安全、私密且易用，無需再依賴外部服務或電子郵件傳送檔案。
