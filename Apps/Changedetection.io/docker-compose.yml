name: linuxserver-changedetection.io
services:
  app:
    image: linuxserver/changedetection.io:0.60.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
        - container: BASE_URL
          description:
            en_US: Specify the full URL (including protocol) when running behind a reverse proxy [OPTIONAL]
        - container: PLAYWRIGHT_DRIVER_URL
          description:
            en_US: Specify the full URL to your chrome driver instance. See the wiki for details. [OPTIONAL]
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/changedetection.io/config
        target: /config
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Changedetection.io provides free, open-source web page monitoring, notification and change detection.
    ca_ES: Changedetection.io ofereix monitorització, notificació i detecció de canvis de pàgines web gratuïtes i de codi obert.
    cs_CZ: Changedetection.io poskytuje bezplatné, open-source monitorování webových stránek, upozorňování a detekci změn.
    da_DK: Changedetection.io tilbyder gratis open source-overvågning af websider, notifikationer og ændringsdetektion.
    de_DE: Changedetection.io bietet kostenlose Open-Source-Webseitenüberwachung, Benachrichtigung und Änderungserkennung.
    el_GR: Το Changedetection.io παρέχει δωρεάν, ανοιχτού κώδικα παρακολούθηση ιστοσελίδων, ειδοποιήσεις και ανίχνευση αλλαγών.
    en_GB: Changedetection.io provides free, open-source web page monitoring, notification and change detection.
    es_ES: Changedetection.io ofrece monitorización, notificación y detección de cambios en páginas web de forma gratuita y con código abierto.
    fr_FR: Changedetection.io propose un service gratuit et open source de surveillance, de notification et de détection des modifications de pages web.
    ga_IE: Cuireann Changedetection.io monatóireacht, fógra agus brath athruithe foinse oscailte ar fáil saor in aisce ar leathanaigh ghréasáin.
    hr_HR: Changedetection.io pruža besplatno, otvoreno kodno praćenje web stranica, obavještavanje i otkrivanje promjena.
    hu_HU: A Changedetection.io ingyenes, nyílt forráskódú weboldal-figyelést, értesítéseket és változásészlelést biztosít.
    it_IT: Changedetection.io offre un servizio gratuito e open-source di monitoraggio, notifica e rilevamento delle modifiche alle pagine web.
    ja_JP: Changedetection.ioは、無料のオープンソースのウェブページ監視、通知、および変更検出機能を提供します。
    ko_KR: Changedetection.io는 무료 오픈소스 웹 페이지 모니터링, 알림 및 변경 감지 기능을 제공합니다.
    ml_IN: Changedetection.io സൗജന്യവും ഓപ്പൺ സോഴ്‌സ് വെബ് പേജ് നിരീക്ഷണവും, അറിയിപ്പും, മാറ്റം കണ്ടെത്തലും നൽകുന്നു.
    nb_NO: Changedetection.io tilbyr gratis overvåking, varsling og endringsdeteksjon av nettsider med åpen kildekode.
    nl_NL: Changedetection.io biedt gratis, open-source monitoring, notificatie en wijzigingsdetectie van webpagina's.
    pl_PL: Changedetection.io to bezpłatne, oparte na otwartym kodzie źródłowym narzędzie do monitorowania stron internetowych, powiadamiania o nich i wykrywania zmian.
    pt_BR: Changedetection.io oferece monitoramento, notificação e detecção de alterações em páginas da web de forma gratuita e de código aberto.
    ro_RO: Changedetection.io oferă servicii gratuite, open-source, de monitorizare a paginilor web, de notificare și detectare a modificărilor.
    ru_RU: Changedetection.io предоставляет бесплатный сервис с открытым исходным кодом для мониторинга, оповещения и обнаружения изменений на веб-страницах.
    sk_SK: Changedetection.io poskytuje bezplatné monitorovanie webových stránok, upozornenia a detekciu zmien s otvoreným zdrojovým kódom.
    sv_SE: Changedetection.io tillhandahåller gratis övervakning, aviseringar och ändringsdetektering av webbsidor med öppen källkod.
    tr_TR: Changedetection.io, ücretsiz, açık kaynaklı web sayfası izleme, bildirim ve değişiklik tespiti hizmeti sunar.
    zh_CN: Changedetection.io 提供免费、开源的网页监控、通知和变更检测功能。
    zh_TW: Changedetection.io 提供免費、開源的網頁監控、通知和變更檢測功能。
