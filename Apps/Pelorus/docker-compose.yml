name: linuxserver-pelorus
services:
  app:
    image: linuxserver/pelorus:0.2.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Pelorus is an AI navigator for Selkies-powered Linux desktops. Pelorus runs a FastAPI server that gives an LLM agent (Ollama, OpenAI-compatible, or Gemini) control over mouse, keyboard, screenshot, and window management via the Pixelflux computer-use backend, a Linux accessibility tree (AT-SPI), and optional KWin D-Bus integration.
    zh_CN: Pelorus 是面向 Selkies Linux 桌面的 AI 导航工具。它运行一个 FastAPI 服务器，让使用 Ollama、OpenAI 兼容接口或 Gemini 的大语言模型代理，通过 Pixelflux 计算机操作后端、Linux 无障碍树（AT-SPI）和可选的 KWin D-Bus 集成，控制鼠标、键盘、截图和窗口管理。
  tagline:
    en_US: An AI navigator for Selkies-powered Linux desktops. Pelorus runs a FastAPI server that gives an LLM agent (Ollama, OpenAI-compatible, or Gemini) control over mouse, keyboard, screenshot, and window management via the Pixelflux computer-use backend, a Linux accessibility tree (AT-SPI), and optional KWin D-Bus integration.
    zh_CN: 让 AI 操作基于 Selkies 的 Linux 桌面。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pelorus-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pelorus-logo.png
  title:
    en_US: Pelorus (LinuxServer.io)
    zh_CN: Pelorus（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserverpelorus
  port_map: '3001'
  version: 0.2.3
