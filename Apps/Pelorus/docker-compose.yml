name: linuxserver-pelorus
services:
  app:
    image: linuxserver/pelorus:0.2.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Pelorus is an AI navigator for Selkies-powered Linux desktops. Pelorus runs a FastAPI server that gives an LLM agent (Ollama, OpenAI-compatible, or Gemini) control over mouse, keyboard, screenshot, and window management via the Pixelflux computer-use backend, a Linux accessibility tree (AT-SPI), and optional KWin D-Bus integration.
    ca_ES: Pelorus és un navegador d'IA per a escriptoris Linux basats en Selkies. Pelorus executa un servidor FastAPI que dóna a un agent LLM (Ollama, compatible amb OpenAI o Gemini) control sobre el ratolí, el teclat, les captures de pantalla i la gestió de finestres a través del backend d'ús de l'ordinador Pixelflux, un arbre d'accessibilitat de Linux (AT-SPI) i la integració opcional de KWin D-Bus.
    cs_CZ: Pelorus je navigátor s umělou inteligencí pro desktopy Linuxu s platformou Selkies. Pelorus provozuje server FastAPI, který poskytuje agentovi LLM (kompatibilnímu s Ollama, OpenAI nebo Gemini) kontrolu nad myší, klávesnicí, snímky obrazovky a správou oken prostřednictvím backendu Pixelflux pro použití na počítači, stromu přístupnosti Linuxu (AT-SPI) a volitelné integrace KWin D-Bus.
    da_DK: Pelorus er en AI-navigator til Selkies-drevne Linux-desktops. Pelorus kører en FastAPI-server, der giver en LLM-agent (Ollama, OpenAI-kompatibel eller Gemini) kontrol over mus, tastatur, skærmbillede og vindueshåndtering via Pixelflux computerbrugs-backend, et Linux-tilgængelighedstræ (AT-SPI) og valgfri KWin D-Bus-integration.
    de_DE: Pelorus ist ein KI-Navigator für Selkies-basierte Linux-Desktops. Pelorus betreibt einen FastAPI-Server, der einem LLM-Agenten (Ollama, OpenAI-kompatibel oder Gemini) die Kontrolle über Maus, Tastatur, Screenshot und Fensterverwaltung über das Pixelflux-Backend, einen Linux-Zugänglichkeitsbaum (AT-SPI) und optionale KWin-D-Bus-Integration ermöglicht.
    el_GR: Το Pelorus είναι ένα πρόγραμμα πλοήγησης με τεχνητή νοημοσύνη (AI) για επιτραπέζιους υπολογιστές Linux με Selkies. Το Pelorus εκτελεί έναν διακομιστή FastAPI που παρέχει σε έναν παράγοντα LLM (Ollama, συμβατό με OpenAI ή Gemini) τον έλεγχο του ποντικιού, του πληκτρολογίου, των στιγμιότυπων οθόνης και της διαχείρισης παραθύρων μέσω του backend χρήσης υπολογιστή Pixelflux, ενός δέντρου προσβασιμότητας Linux (AT-SPI) και προαιρετικής ενσωμάτωσης KWin D-Bus.
    en_GB: Pelorus is an Ai navigator for Selkies-powered Linux desktops. Pelorus runs a Fastapi server that gives an Llm agent (Ollama, Openai-compatible, or Gemini) control over mouse, keyboard, screenshot, and window management via the Pixelflux computer-use backend, a Linux accessibility tree (At-Spi), and optional Kwin D-Bus integration.
    es_ES: Pelorus es un navegador de IA para escritorios Linux con tecnología Selkies. Pelorus ejecuta un servidor FastAPI que proporciona a un agente LLM (Ollama, compatible con OpenAI o Gemini) control sobre el ratón, el teclado, las capturas de pantalla y la gestión de ventanas a través del backend de uso del ordenador Pixelflux, un árbol de accesibilidad de Linux (AT-SPI) y la integración opcional con KWin D-Bus.
    fr_FR: Pelorus est un navigateur IA pour les bureaux Linux équipés de Selkies. Pelorus exécute un serveur FastAPI qui permet à un agent LLM (Ollama, compatible OpenAI ou Gemini) de contrôler la souris, le clavier, les captures d'écran et la gestion des fenêtres via le backend d'utilisation de l'ordinateur Pixelflux, un arbre d'accessibilité Linux (AT-SPI) et une intégration optionnelle KWin D-Bus.
    ga_IE: Is loingseoir hintleachta saorga é Pelorus do dheasca Linux faoi thiomáint ag Selkies. Ritheann Pelorus freastalaí FastAPI a thugann smacht do ghníomhaire LLM (Ollama, comhoiriúnach le OpenAI, nó Gemini) ar luch, méarchlár, scáileáin, agus bainistíocht fuinneog tríd an gcúlra úsáide ríomhaire Pixelflux, crann inrochtaineachta Linux (AT-SPI), agus comhtháthú roghnach KWin D-Bus.
    hr_HR: Pelorus je AI navigator za Linux desktop računala pokretana Selkiesom. Pelorus pokreće FastAPI poslužitelj koji LLM agentu (Ollama, OpenAI-kompatibilan ili Gemini) daje kontrolu nad mišem, tipkovnicom, snimkama zaslona i upravljanjem prozorima putem Pixelflux računalnog backenda, Linux stabla pristupačnosti (AT-SPI) i opcionalne KWin D-Bus integracije.
    hu_HU: A Pelorus egy mesterséges intelligencián alapuló navigátor Selkies-alapú Linux asztali gépekhez. A Pelorus egy FastAPI szervert futtat, amely egy LLM ügynöknek (Ollama, OpenAI-kompatibilis vagy Gemini) vezérlést biztosít az egér, a billentyűzet, a képernyőképek és az ablakok felett a Pixelflux számítógép-használati háttérrendszeren, egy Linux akadálymentesítési fán (AT-SPI) és az opcionális KWin D-Bus integráción keresztül.
    it_IT: Pelorus è un navigatore AI per desktop Linux basati su Selkies. Pelorus esegue un server FastAPI che consente a un agente LLM (Ollama, compatibile con OpenAI o Gemini) di controllare mouse, tastiera, screenshot e gestione delle finestre tramite il backend di utilizzo del computer Pixelflux, un albero di accessibilità Linux (AT-SPI) e l'integrazione opzionale con KWin D-Bus.
    ja_JP: Pelorusは、Selkiesを搭載したLinuxデスクトップ向けのAIナビゲーターです。PelorusはFastAPIサーバーを実行し、Pixelfluxのコンピュータ使用バックエンド、Linuxアクセシビリティツリー（AT-SPI）、およびオプションのKWin D-Bus統合を介して、LLMエージェント（Ollama、OpenAI互換、またはGemini）がマウス、キーボード、スクリーンショット、およびウィンドウ管理を制御できるようにします。
    ko_KR: Pelorus는 Selkies 기반 Linux 데스크톱을 위한 AI 내비게이터입니다. Pelorus는 FastAPI 서버를 실행하여 LLM 에이전트(Ollama, OpenAI 호환 또는 Gemini)가 Pixelflux 컴퓨터 사용 백엔드, Linux 접근성 트리(AT-SPI) 및 선택적 KWin D-Bus 통합을 통해 마우스, 키보드, 스크린샷 및 창 관리를 제어할 수 있도록 합니다.
    ml_IN: സെൽക്കീസ് പവർ ചെയ്യുന്ന ലിനക്സ് ഡെസ്‌ക്‌ടോപ്പുകൾക്കായുള്ള ഒരു AI നാവിഗേറ്ററാണ് പെലോറസ്. പെലോറസ് ഒരു ഫാസ്റ്റ്എപിഐ സെർവർ പ്രവർത്തിപ്പിക്കുന്നു, ഇത് പിക്‌സൽഫ്ലക്സ് കമ്പ്യൂട്ടർ-ഉപയോഗ ബാക്കെൻഡ്, ഒരു ലിനക്സ് ആക്‌സസിബിലിറ്റി ട്രീ (AT-SPI), ഓപ്‌ഷണൽ കെവിൻ ഡി-ബസ് ഇന്റഗ്രേഷൻ എന്നിവ വഴി മൗസ്, കീബോർഡ്, സ്‌ക്രീൻഷോട്ട്, വിൻഡോ മാനേജ്‌മെന്റ് എന്നിവയിൽ ഒരു എൽഎൽഎം ഏജന്റിന് (ഒല്ലാമ, ഓപ്പൺഎഐ-അനുയോജ്യമായ, അല്ലെങ്കിൽ ജെമിനി) നിയന്ത്രണം നൽകുന്നു.
    nb_NO: Pelorus er en AI-navigator for Selkies-drevne Linux-skrivebord. Pelorus kjører en FastAPI-server som gir en LLM-agent (Ollama, OpenAI-kompatibel eller Gemini) kontroll over mus, tastatur, skjermbilde og vindushåndtering via Pixelflux-datamaskinbruksbackend, et Linux-tilgjengelighetstre (AT-SPI) og valgfri KWin D-Bus-integrasjon.
    nl_NL: Pelorus is een AI-navigator voor Linux-desktops die draaien op Selkies. Pelorus draait een FastAPI-server die een LLM-agent (Ollama, OpenAI-compatibel of Gemini) controle geeft over muis, toetsenbord, screenshots en vensterbeheer via de Pixelflux-backend voor computergebruik, een Linux-toegankelijkheidsstructuur (AT-SPI) en optionele KWin D-Bus-integratie.
    pl_PL: Pelorus to nawigator oparty na sztucznej inteligencji (AI) dla pulpitów Linux z systemem Selkies. Pelorus uruchamia serwer FastAPI, który zapewnia agentowi LLM (Ollama, zgodnym z OpenAI lub Gemini) kontrolę nad myszą, klawiaturą, zrzutami ekranu i zarządzaniem oknami za pośrednictwem zaplecza komputerowego Pixelflux, drzewa ułatwień dostępu Linux (AT-SPI) oraz opcjonalnej integracji z KWin D-Bus.
    pt_BR: Pelorus é um navegador de IA para desktops Linux com Selkies. Pelorus executa um servidor FastAPI que permite a um agente LLM (Ollama, compatível com OpenAI ou Gemini) controlar o mouse, o teclado, a captura de tela e o gerenciamento de janelas por meio do backend de uso do computador Pixelflux, uma árvore de acessibilidade do Linux (AT-SPI) e integração opcional com o KWin D-Bus.
    ro_RO: Pelorus este un navigator bazat pe inteligență artificială pentru desktop-uri Linux bazate pe Selkies. Pelorus rulează un server FastAPI care oferă unui agent LLM (Ollama, compatibil cu OpenAI sau Gemini) control asupra mouse-ului, tastaturii, capturilor de ecran și gestionării ferestrelor prin intermediul backend-ului de utilizare a computerului Pixelflux, un arbore de accesibilitate Linux (AT-SPI) și integrarea opțională KWin D-Bus.
    ru_RU: Pelorus — это навигатор на основе ИИ для настольных компьютеров под управлением Linux с процессором Selkies. Pelorus запускает сервер FastAPI, который предоставляет агенту LLM (Ollama, совместимому с OpenAI или Gemini) управление мышью, клавиатурой, создание скриншотов и управление окнами через бэкэнд Pixelflux для управления компьютером, дерево доступности Linux (AT-SPI) и опциональную интеграцию с KWin D-Bus.
    sk_SK: Pelorus je navigátor s umelou inteligenciou pre desktopy Linuxu s platformou Selkies. Pelorus prevádzkuje server FastAPI, ktorý poskytuje agentovi LLM (kompatibilnému s Ollama, OpenAI alebo Gemini) kontrolu nad správou myši, klávesnice, snímok obrazovky a okien prostredníctvom počítačového backendu Pixelflux, stromu prístupnosti Linuxu (AT-SPI) a voliteľnej integrácie KWin D-Bus.
    sv_SE: Pelorus är en AI-navigator för Selkies-drivna Linux-skrivbord. Pelorus kör en FastAPI-server som ger en LLM-agent (Ollama, OpenAI-kompatibel eller Gemini) kontroll över mus, tangentbord, skärmdump och fönsterhantering via Pixelflux datoranvändningsbackend, ett Linux-tillgänglighetsträd (AT-SPI) och valfri KWin D-Bus-integration.
    tr_TR: Pelorus, Selkies tabanlı Linux masaüstleri için bir yapay zeka navigasyon uygulamasıdır. Pelorus, Pixelflux bilgisayar kullanım arka ucu, bir Linux erişilebilirlik ağacı (AT-SPI) ve isteğe bağlı KWin D-Bus entegrasyonu aracılığıyla bir LLM ajanına (Ollama, OpenAI uyumlu veya Gemini) fare, klavye, ekran görüntüsü ve pencere yönetimi üzerinde kontrol sağlayan bir FastAPI sunucusu çalıştırır.
    zh_CN: Pelorus 是面向 Selkies Linux 桌面的 AI 导航工具。它运行一个 FastAPI 服务器，让使用 Ollama、OpenAI 兼容接口或 Gemini 的大语言模型代理，通过 Pixelflux 计算机操作后端、Linux 无障碍树（AT-SPI）和可选的 KWin D-Bus 集成，控制鼠标、键盘、截图和窗口管理。
    zh_TW: Pelorus 是面向 Selkies Linux 桌面的 AI 導航工具。它執行一個 FastAPI 伺服器，讓使用 Ollama、OpenAI 相容介面或 Gemini 的大語言模型代理，透過 Pixelflux 計算機操作後端、Linux 無障礙樹（AT-SPI）和可選的 KWin D-Bus 整合，控制滑鼠、鍵盤、截圖和視窗管理。
