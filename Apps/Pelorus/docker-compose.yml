    ro_RO: Un navigator AI pentru desktop-uri Linux bazate pe Selkies. Pelorus rulează un server FastAPI care oferă unui agent LLM (Ollama, compatibil cu OpenAI sau Gemini) control asupra mouse-ului, tastaturii, capturilor de ecran și gestionării ferestrelor prin intermediul backend-ului de utilizare a computerului Pixelflux, un arbore de accesibilitate Linux (AT-SPI) și integrarea opțională KWin D-Bus.
    ru_RU: Искусственный интеллект-навигатор для настольных компьютеров Linux на базе Selkies. Pelorus запускает сервер FastAPI, который предоставляет агенту LLM (Ollama, совместимому с OpenAI или Gemini) управление мышью, клавиатурой, создание скриншотов и управление окнами через бэкэнд Pixelflux для управления компьютером, дерево доступности Linux (AT-SPI) и опциональную интеграцию с KWin D-Bus.
    sk_SK: Navigátor s umelou inteligenciou pre desktopy Linuxu s platformou Selkies. Pelorus prevádzkuje server FastAPI, ktorý poskytuje agentovi LLM (kompatibilnému s Ollama, OpenAI alebo Gemini) kontrolu nad správou myši, klávesnice, snímok obrazovky a okien prostredníctvom počítačového backendu Pixelflux, stromu prístupnosti Linuxu (AT-SPI) a voliteľnej integrácie KWin D-Bus.
    sv_SE: En AI-navigator för Selkies-drivna Linux-skrivbord. Pelorus kör en FastAPI-server som ger en LLM-agent (Ollama, OpenAI-kompatibel eller Gemini) kontroll över mus, tangentbord, skärmdump och fönsterhantering via Pixelflux datoranvändningsbackend, ett Linux-tillgänglighetsträd (AT-SPI) och valfri KWin D-Bus-integration.
    tr_TR: Selkies tabanlı Linux masaüstleri için bir yapay zeka navigasyon uygulaması. Pelorus, Pixelflux bilgisayar kullanım arka ucu, bir Linux erişilebilirlik ağacı (AT-SPI) ve isteğe bağlı KWin D-Bus entegrasyonu aracılığıyla bir LLM ajanına (Ollama, OpenAI uyumlu veya Gemini) fare, klavye, ekran görüntüsü ve pencere yönetimi üzerinde kontrol sağlayan bir FastAPI sunucusu çalıştırır.
    zh_CN: 让 AI 操作基于 Selkies 的 Linux 桌面。
    zh_TW: 讓 AI 操作基於 Selkies 的 Linux 桌面。
