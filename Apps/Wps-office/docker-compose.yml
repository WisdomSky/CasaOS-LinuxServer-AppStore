name: linuxserver-wps-office
services:
  app:
    image: linuxserver/wps-office:11.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: WPS Office is a lightweight, feature-rich comprehensive office suite with high compatibility. As a handy and professional office software, WPS Office allows you to edit files in Writer, Presentation, Spreadsheet, and PDF to improve your work efficiency.
    ca_ES: WPS Office és un paquet ofimàtic complet, lleuger i ric en funcions amb una alta compatibilitat. Com a programari d'oficina pràctic i professional, WPS Office us permet editar fitxers a Writer, Presentation, Spreadsheet i PDF per millorar la vostra eficiència laboral.
    cs_CZ: WPS Office je lehký, funkčně bohatý a komplexní kancelářský balík s vysokou kompatibilitou. WPS Office je praktický a profesionální kancelářský software, který umožňuje upravovat soubory ve formátech Writer, Presentation, Spreadsheet a PDF a zlepšit tak efektivitu vaší práce.
    da_DK: WPS Office er en let, funktionsrig og omfattende kontorpakke med høj kompatibilitet. Som en praktisk og professionel kontorsoftware giver WPS Office dig mulighed for at redigere filer i Writer, præsentationer, regneark og PDF for at forbedre din arbejdseffektivitet.
    de_DE: WPS Office ist eine schlanke, funktionsreiche und umfassende Office-Suite mit hoher Kompatibilität. Als praktische und professionelle Bürosoftware ermöglicht WPS Office die Bearbeitung von Dateien in den Formaten Writer, Presentation, Spreadsheet und PDF und steigert so Ihre Arbeitseffizienz.
    el_GR: Το WPS Office είναι μια ελαφριά, πλούσια σε λειτουργίες ολοκληρωμένη σουίτα γραφείου με υψηλή συμβατότητα. Ως ένα εύχρηστο και επαγγελματικό λογισμικό γραφείου, το WPS Office σάς επιτρέπει να επεξεργάζεστε αρχεία σε Writer, Presentation, Spreadsheet και PDF για να βελτιώσετε την αποδοτικότητα της εργασίας σας.
    en_GB: Wps Office is a lightweight, feature-rich comprehensive office suite with high compatibility. As a handy and professional office software, Wps Office allows you to edit files in Writer, Presentation, Spreadsheet, and Pdf to improve your work efficiency.
    es_ES: WPS Office es una suite ofimática ligera, completa y con numerosas funciones, además de ser altamente compatible. Como software de oficina práctico y profesional, WPS Office le permite editar archivos en Writer, Presentation, Spreadsheet y PDF para mejorar su productividad.
    fr_FR: WPS Office est une suite bureautique complète, légère et riche en fonctionnalités, offrant une compatibilité élevée. Logiciel bureautique pratique et professionnel, WPS Office vous permet de modifier des fichiers (Writer, Presentation, Spreadsheet et PDF) pour optimiser votre productivité.
    ga_IE: Is sraith oifige chuimsitheach éadrom, saibhir i ngnéithe é WPS Office a bhfuil ard-chomhoiriúnacht aige. Mar bhogearraí oifige áisiúla agus gairmiúla, ligeann WPS Office duit comhaid a chur in eagar i Writer, Presentation, Scarbhileog, agus PDF chun d’éifeachtúlacht oibre a fheabhsú.
    hr_HR: WPS Office je lagan, bogat značajkama i sveobuhvatan uredski paket s visokom kompatibilnošću. Kao praktičan i profesionalan uredski softver, WPS Office vam omogućuje uređivanje datoteka u Writeru, Presentationu, Spreadsheetu i PDF-u kako biste poboljšali svoju radnu učinkovitost.
    hu_HU: A WPS Office egy könnyűsúlyú, funkciókban gazdag, átfogó irodai programcsomag, amely nagyfokú kompatibilitással rendelkezik. Praktikus és professzionális irodai szoftverként a WPS Office lehetővé teszi a fájlok szerkesztését Writerben, prezentációkészítésben, táblázatkezelésben és PDF-ben a munka hatékonyságának javítása érdekében.
    it_IT: WPS Office è una suite per ufficio completa, leggera e ricca di funzionalità, con un'elevata compatibilità. Come software per ufficio pratico e professionale, WPS Office consente di modificare file in formato Writer, Presentation, Spreadsheet e PDF, migliorando l'efficienza del lavoro.
    ja_JP: WPS Officeは、軽量で機能豊富な総合オフィススイートであり、高い互換性を誇ります。使いやすくプロフェッショナルなオフィスソフトウェアとして、WPS Officeを使えば、Writer、Presentation、Spreadsheet、PDFといった形式のファイルを編集でき、業務効率を向上させることができます。
    ko_KR: WPS Office는 가볍고 기능이 풍부하며 호환성이 뛰어난 종합 오피스 제품군입니다. 편리하고 전문적인 오피스 소프트웨어인 WPS Office를 사용하면 Writer, Presentation, Spreadsheet, PDF 파일을 편집하여 업무 효율성을 높일 수 있습니다.
    ml_IN: ഉയർന്ന പൊരുത്തക്കേടുള്ള, ഭാരം കുറഞ്ഞതും സവിശേഷതകളാൽ സമ്പന്നവുമായ ഒരു സമഗ്ര ഓഫീസ് സ്യൂട്ടാണ് WPS ഓഫീസ്. പ്രായോഗികവും പ്രൊഫഷണലുമായ ഒരു ഓഫീസ് സോഫ്റ്റ്‌വെയർ എന്ന നിലയിൽ, നിങ്ങളുടെ ജോലി കാര്യക്ഷമത മെച്ചപ്പെടുത്തുന്നതിന് റൈറ്റർ, പ്രസന്റേഷൻ, സ്പ്രെഡ്ഷീറ്റ്, PDF എന്നിവയിലെ ഫയലുകൾ എഡിറ്റ് ചെയ്യാൻ WPS ഓഫീസ് നിങ്ങളെ അനുവദിക്കുന്നു.
    nb_NO: WPS Office er en lett, funksjonsrik og omfattende kontorpakke med høy kompatibilitet. Som en praktisk og profesjonell kontorprogramvare lar WPS Office deg redigere filer i Writer, presentasjoner, regneark og PDF for å forbedre arbeidseffektiviteten din.
    nl_NL: WPS Office is een lichtgewicht, veelzijdige en complete kantoorsuite met hoge compatibiliteit. Als handige en professionele kantoorsoftware kunt u met WPS Office bestanden bewerken in Writer, Presentation, Spreadsheet en PDF, waardoor u efficiënter kunt werken.
    pl_PL: WPS Office to lekki, bogaty w funkcje, kompleksowy pakiet biurowy o wysokiej kompatybilności. Jako poręczne i profesjonalne oprogramowanie biurowe, WPS Office umożliwia edycję plików w programach Writer, Presentation, Spreadsheet i PDF, co pozwala zwiększyć efektywność pracy.
    pt_BR: O WPS Office é um pacote de escritório leve, completo e repleto de recursos, com alta compatibilidade. Como um software de escritório prático e profissional, o WPS Office permite editar arquivos nos formatos Writer, Presentation, Spreadsheet e PDF, melhorando sua eficiência no trabalho.
    ro_RO: WPS Office este o suită de birou ușoară, bogată în funcții, cu o compatibilitate ridicată. Fiind un software de birou practic și profesional, WPS Office vă permite să editați fișiere în Writer, Presentation, Spreadsheet și PDF pentru a vă îmbunătăți eficiența muncii.
    ru_RU: WPS Office — это легкий, многофункциональный и комплексный офисный пакет с высокой совместимостью. Как удобное и профессиональное офисное программное обеспечение, WPS Office позволяет редактировать файлы в Writer, Presentation, Spreadsheet и PDF, повышая эффективность вашей работы.
    sk_SK: WPS Office je ľahký, funkčne bohatý kancelársky balík s vysokou kompatibilitou. Ako praktický a profesionálny kancelársky softvér vám WPS Office umožňuje upravovať súbory vo formátoch Writer, Presentation, Spreadsheet a PDF, čím sa zvýši vaša pracovná efektivita.
    sv_SE: WPS Office är en lätt, funktionsrik och omfattande kontorssvit med hög kompatibilitet. Som en praktisk och professionell kontorsprogramvara låter WPS Office dig redigera filer i Writer, presentationer, kalkylblad och PDF för att förbättra din arbetseffektivitet.
    tr_TR: WPS Office, yüksek uyumluluğa sahip, hafif, özellik bakımından zengin ve kapsamlı bir ofis yazılım paketidir. Kullanışlı ve profesyonel bir ofis yazılımı olan WPS Office, iş verimliliğinizi artırmak için dosyaları Writer, Presentation, Spreadsheet ve PDF formatlarında düzenlemenize olanak tanır.
    zh_CN: WPS Office 是一款轻量、功能丰富、兼容性强的综合办公套件。作为便捷且专业的办公软件，它支持通过文字、演示、表格和 PDF 工具编辑文件，提高工作效率。
    zh_TW: WPS Office 是一款輕量、功能豐富、相容性強的綜合辦公套件。作為便捷且專業的辦公軟體，它支援透過文字、演示、表格和 PDF 工具編輯檔案，提高工作效率。
