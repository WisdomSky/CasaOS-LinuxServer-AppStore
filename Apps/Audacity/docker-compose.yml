name: linuxserver-audacity
services:
  app:
    image: linuxserver/audacity:4.0.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Audacity is an easy-to-use, multi-track audio editor and recorder. Developed by a group of volunteers as open source.
    zh_CN: Audacity 是一款易于使用的多轨音频编辑和录制软件，由志愿者团队以开源方式开发。
  tagline:
    en_US: An easy-to-use, multi-track audio editor and recorder. Developed by a group of volunteers as open source.
    zh_CN: 易用的开源多轨音频编辑与录制工具。
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/audacity-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/audacity-logo.png
  title:
    en_US: Audacity (LinuxServer.io)
    zh_CN: Audacity（LinuxServer.io）
  category: Home
  id: wisdomsky.linuxserver.linuxserveraudacity
  port_map: '3000'
  version: 4.0.0
