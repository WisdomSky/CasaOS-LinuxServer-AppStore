name: Release Store

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-store
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/build_appstore/image-size-cache.json
            .cache/build_appstore/image-digest-cache.json
          key: build-appstore-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-appstore-${{ runner.os }}-${{ github.ref_name }}-
            build-appstore-${{ runner.os }}-main-

      - name: Build v2 store
        uses: IceWhaleTech/build-appstore-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Release V2 Store Report

      - name: Prepare release bundle
        shell: bash
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          (cd dist && zip -r ../v2-dist.zip .)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            v2-dist.zip
            out/build-v2-report.json

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            v2-dist.zip
            out/build-v2-report.json
