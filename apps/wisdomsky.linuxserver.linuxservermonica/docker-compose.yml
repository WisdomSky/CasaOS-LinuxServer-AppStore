    ca_ES: Monica
    cs_CZ: Monica
    da_DK: Monica
    de_DE: Monica
    el_GR: Monica
    en_GB: Monica
    es_ES: Monica
    fr_FR: Monica
    ga_IE: Monica
    hr_HR: Monica
    hu_HU: Monica
