name: linuxserver-kavita
services:
  app:
    image: linuxserver/kavita:0.9.1@sha256:57602e4d39d8991739a3dafef737be1886e066acaaee335f6810f6d74f2f5fdf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kavita/config
        target: /config
      - type: bind
        source: /DATA/AppData/kavita/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverkavita/assets/icon.png
  title:
    en_US: Kavita (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverkavita
  port_map: '5000'
  version: 0.9.1
