name: linuxserver-kavita
services:
  app:
    image: linuxserver/kavita:0.9.1@sha256:57602e4d39d8991739a3dafef737be1886e066acaaee335f6810f6d74f2f5fdf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kavita/config
        target: /config
      - type: bind
        source: /DATA/AppData/kavita/data
        target: /data
