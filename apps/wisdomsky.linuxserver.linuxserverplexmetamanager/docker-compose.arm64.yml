name: linuxserver-plex-meta-manager
services:
  app:
    image: linuxserver/plex-meta-manager:1.21.1@sha256:6c5af3670b4cb210d10c6d953243214442c5ba0b9c5eab0a40f307fecff759ba
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PMM_CONFIG: ''
      PMM_TIME: ''
      PMM_RUN: ''
      PMM_TEST: ''
      PMM_NO_MISSING: ''
    volumes:
      - type: bind
        source: /DATA/AppData/plex-meta-manager/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverplexmetamanager/assets/icon.png
  title:
    en_US: Plex meta-manager
  id: wisdomsky.linuxserver.linuxserverplexmetamanager
  version: 1.21.1
