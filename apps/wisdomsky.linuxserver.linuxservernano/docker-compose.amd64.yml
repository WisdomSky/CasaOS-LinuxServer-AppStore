name: linuxserver-nano
services:
  app:
    image: linuxserver/nano:21.2.20220522@sha256:e08befd2d31a4005e2c4f12d3f22e6b7514a557679fbc3f7d1887aac4b41f55c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PEER_HOST: ''
      LIVE_GENESIS_PUB: ''
      LIVE_GENESIS_ACCOUNT: ''
      LIVE_GENESIS_WORK: ''
      LIVE_GENESIS_SIG: ''
      CLI_OPTIONS: ''
      LMDB_BOOTSTRAP_URL: ''
    ports:
      - target: 8075
        published: 8075
        protocol: tcp
      - target: 7076
        published: 3000
        protocol: tcp
      - target: 7077
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nano/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservernano/assets/icon.svg
