name: linuxserver-krita
services:
  app:
    image: linuxserver/krita:5.3.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverkrita/assets/icon.png
  title:
    en_US: Krita (LinuxServer.io)
    zh_CN: Krita（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverkrita
  port_map: '3000'
  version: 5.3.4
