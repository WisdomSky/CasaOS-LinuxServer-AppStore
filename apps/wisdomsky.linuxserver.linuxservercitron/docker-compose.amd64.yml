name: linuxserver-citron
services:
  app:
    image: linuxserver/citron:2026.02.1@sha256:64b9e2d49ef7df0f0af7371c481a831a47921605aa3e9ea3a1929a0252fe47b8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/lsio/citron/config
        target: /config
x-casaos:
