name: linuxserver-nextcloud
services:
  app:
    image: linuxserver/nextcloud:35.0.0@sha256:fde75710e38b234f5f51ff9726efabc98a66f78512d3f0283631618e762af96e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 443
        published: 443
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nextcloud/config
        target: /config
      - type: bind
        source: /DATA/AppData/nextcloud/data
        target: /data
