name: linuxserver-lm-studio
services:
  app:
    image: linuxserver/lm-studio:version-2026-09-12@sha256:61ac1451e00ae5f41d0af89b8e2df3e2555582e44ddad4e3170e76c481dbb913
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lm-studio/config
        target: /config
x-casaos:
