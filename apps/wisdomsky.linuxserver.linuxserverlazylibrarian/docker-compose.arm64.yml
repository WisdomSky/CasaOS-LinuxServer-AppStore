name: linuxserver-lazylibrarian
services:
  app:
    image: linuxserver/lazylibrarian:version-cbc0fe8c@sha256:7fa48cb68fc240f968cd0b3b236a7c4c69c6b8374e6c2c71f4d9f4b1d057f7b7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
    ports:
      - target: 5299
        published: 5299
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lazylibrarian/config
        target: /config
      - type: bind
        source: /DATA/AppData/lazylibrarian/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/lazylibrarian/books
        target: /books
