name: linuxserver-duckdns
services:
  app:
    image: linuxserver/duckdns:version-73f1bc7d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SUBDOMAINS: ''
      TOKEN: ''
      UPDATE_IP: ''
      LOG_FILE: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duckdns/config
        target: /config
      - type: bind
        source: /DATA/AppData/duckdns/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverduckdns/assets/icon.png
  title:
    en_US: Duckdns (LinuxServer.io)
    zh_CN: Duckdns（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverduckdns
  port_map: '80'
  version: version-73f1bc7d
