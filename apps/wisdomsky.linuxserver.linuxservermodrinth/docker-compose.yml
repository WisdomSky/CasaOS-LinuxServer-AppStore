name: linuxserver-modrinth
services:
  app:
    image: linuxserver/modrinth:0.21.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermodrinth/assets/icon.png
  title:
    en_US: Modrinth (LinuxServer.io)
    zh_CN: Modrinth（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxservermodrinth
  port_map: '3000'
  version: 0.21.4
