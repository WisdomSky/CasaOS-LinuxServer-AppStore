name: linuxserver-cops
services:
  app:
    image: linuxserver/cops:4.5.4@sha256:c46a6cf03567244e8d87f72e207d4037df5d33bff7b8c158bf64bc74c2f9b5cb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
