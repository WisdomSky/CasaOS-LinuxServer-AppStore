name: linuxserver-cops
services:
  app:
    image: linuxserver/cops:4.5.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercops/assets/icon.png
  title:
    en_US: Cops (LinuxServer.io)
    zh_CN: Cops（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxservercops
  port_map: '80'
  version: 4.5.2
