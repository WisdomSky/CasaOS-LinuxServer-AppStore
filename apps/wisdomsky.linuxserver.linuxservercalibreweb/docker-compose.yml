name: linuxserver-calibre-web
services:
  app:
    image: linuxserver/calibre-web:0.6.27
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
      OAUTHLIB_RELAX_TOKEN_SCOPE: ''
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calibre-web/config
        target: /config
      - type: bind
        source: /DATA/AppData/calibre-web/books
        target: /books
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercalibreweb/assets/icon.png
  title:
    en_US: Calibre web (LinuxServer.io)
    zh_CN: Calibre web（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxservercalibreweb
  port_map: '8083'
  version: 0.6.27
