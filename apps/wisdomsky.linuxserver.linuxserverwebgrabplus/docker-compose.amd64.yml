name: linuxserver-webgrabplus
services:
  app:
    image: linuxserver/webgrabplus:5.6.1@sha256:ac3fcb4c346a5c4a3f2b18452edc3ce7d060c94646d4349e220a884f32b053a2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverwebgrabplus/assets/icon.jpg
  title:
    en_US: Webgrabplus (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverwebgrabplus
  port_map: '80'
  version: 5.6.1
