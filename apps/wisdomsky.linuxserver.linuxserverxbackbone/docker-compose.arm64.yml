name: linuxserver-xbackbone
services:
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:edb47ff29750baee23bad383a637bd8866fd627f2ca4778215d6606eff1e3d95
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverxbackbone/assets/icon.png
  title:
    en_US: Xbackbone (LinuxServer.io)
    zh_CN: Xbackbone（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverxbackbone
  port_map: '80'
  version: 3.8.2
