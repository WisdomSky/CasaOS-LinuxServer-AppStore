name: linuxserver-ci
services:
  app:
    image: linuxserver/ci:b1ca9f98-ls65@sha256:6f85f4ab41a8c78ae5636a594281d3f97ae69fd269aac46017b47ac786a8f2fd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ci/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverci/assets/icon.svg
  title:
    en_US: Ci
  port_map: '80'
  id: wisdomsky.linuxserver.linuxserverci
  version: b1ca9f98-ls65
