name: linuxserver-nzbget
services:
  app:
    image: linuxserver/nzbget:26.3.20260911@sha256:d8fe16f1a6a927fff2474b193b37f687171fc76b70f36108924da7c9b8f3b34c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NZBGET_USER: ''
      NZBGET_PASS: ''
    ports:
      - target: 6789
        published: 6789
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nzbget/config
        target: /config
      - type: bind
        source: /DATA/AppData/nzbget/downloads
        target: /downloads
