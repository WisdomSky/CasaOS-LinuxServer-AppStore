name: linuxserver-vscode
services:
  app:
    image: linuxserver/vscode:1.137.0@sha256:82d8cfc80de9154921a0e358cb5b817cec8d55504f7e27794c1a2035febfbb1d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservervscode/assets/icon.png
  title:
    en_US: Vscode (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservervscode
  port_map: '3000'
  version: 1.137.0
