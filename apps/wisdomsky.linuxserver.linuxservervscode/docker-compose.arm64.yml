name: linuxserver-vscode
services:
  app:
    image: linuxserver/vscode:1.137.0@sha256:7092d5429d48f430862100f00c5d92ee8805ce41d3105aa48a5cbf7c52c8cad7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservervscode/assets/icon.png
  title:
    en_US: Vscode (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservervscode
  port_map: '3000'
  version: 1.137.0
