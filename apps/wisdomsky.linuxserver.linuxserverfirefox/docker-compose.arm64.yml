name: linuxserver-firefox
services:
  app:
    image: linuxserver/firefox:1155.0.1@sha256:96c19dfeb44a8c4778a9171bdb8936d915361152f5f5a9c1aee644a8e36860ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FIREFOX_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/firefox/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverfirefox/assets/icon.png
  title:
    en_US: Firefox (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverfirefox
  port_map: '3000'
  version: 1155.0.1
