name: linuxserver-eden
services:
  app:
    image: linuxserver/eden:0.2.1@sha256:de0be462e0a58c70efda7050c7d4e5627659f2e5fcd1db406ff7f41e05428e0e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservereden/assets/icon.png
  title:
    en_US: Eden (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservereden
  port_map: '3000'
  version: 0.2.1
