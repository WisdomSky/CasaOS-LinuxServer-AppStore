name: linuxserver-webtop
services:
  app:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:da08c127461269d148bf8191a85b8da735c8516969100dc3c63d7877b15302aa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webtop/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverwebtop/assets/icon.png
  title:
    en_US: Webtop (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverwebtop
  port_map: '3000'
  version: arch-kde-version-2025-07-12
