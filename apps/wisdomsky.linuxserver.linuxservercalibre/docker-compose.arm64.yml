name: linuxserver-calibre
services:
  app:
    image: linuxserver/calibre:9.14.0@sha256:4530d8be2d6cca65cddb6e8c8c31177ee8776533ab78a22bc2e5ca99a45c29da
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CLI_ARGS: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 8181
        published: 8181
        protocol: tcp
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calibre/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercalibre/assets/icon.png
  title:
    en_US: Calibre (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercalibre
  port_map: '8080'
  version: 9.14.0
