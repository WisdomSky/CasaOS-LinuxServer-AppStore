name: linuxserver-grav
services:
  app:
    image: linuxserver/grav:2.1.6@sha256:56aec33b87f53dde0ea261482e810dc8bc1dc93aed780fc992516e09c7aa73a8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservergrav/assets/icon.png
  title:
    en_US: Grav (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservergrav
  port_map: '80'
  version: 2.1.6
