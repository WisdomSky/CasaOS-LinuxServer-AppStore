name: linuxserver-handbrake
services:
  app:
    image: linuxserver/handbrake:1.11.2@sha256:7ce659fc8cc45b9125ea5b90582bd5a190d6baa23d02ed0c221f46827d0986e1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverhandbrake/assets/icon.png
  title:
    en_US: Handbrake (LinuxServer.io)
    zh_CN: Handbrake（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverhandbrake
  port_map: '3000'
  version: 1.11.2
