name: linuxserver-handbrake
services:
  app:
    image: linuxserver/handbrake:1.11.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverhandbrake/assets/icon.png
  title:
    en_US: Handbrake (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverhandbrake
  port_map: '3000'
  version: 1.11.2
