name: linuxserver-mylar3
services:
  app:
    image: linuxserver/mylar3:0.11.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8090
        published: 8090
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mylar3/config
        target: /config
      - type: bind
        source: /DATA/AppData/mylar3/comics
        target: /comics
      - type: bind
        source: /DATA/AppData/mylar3/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermylar3/assets/icon.png
  title:
    en_US: Mylar3 (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservermylar3
  port_map: '8090'
  version: 0.11.0
