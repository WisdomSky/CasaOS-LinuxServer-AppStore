name: linuxserver-embystat
services:
  app:
    image: linuxserver/embystat:0.2.0@sha256:59008e71ddec817566dc3642bb9cfdb22a9f87cc851bcd8ebc0d905b4caf6bce
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6555
        published: 6555
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/embystat/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverembystat/assets/icon.png
  title:
    en_US: Embystat
  port_map: '6555'
  id: wisdomsky.linuxserver.linuxserverembystat
  version: 0.2.0
