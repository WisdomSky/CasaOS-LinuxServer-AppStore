name: linuxserver-booksonic-air
services:
  app:
    image: linuxserver/booksonic-air:2201.1.0@sha256:f6c2ce4cbb040de8d09c4dbed7740e186e6e0e604e19f201685f7352d9a15bb6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
    ports:
      - target: 4040
        published: 4040
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/booksonic-air/config
        target: /config
      - type: bind
        source: /DATA/AppData/booksonic-air/audiobooks
        target: /audiobooks
      - type: bind
        source: /DATA/AppData/booksonic-air/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/booksonic-air/othermedia
        target: /othermedia
x-casaos:
