name: linuxserver-gimp
services:
  app:
    image: linuxserver/gimp:version-284e0208
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gimp/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservergimp/assets/icon.png
  title:
    en_US: Gimp (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservergimp
  port_map: '3000'
  version: version-284e0208
