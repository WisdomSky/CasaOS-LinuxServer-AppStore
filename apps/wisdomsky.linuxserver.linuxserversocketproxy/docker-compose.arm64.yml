name: linuxserver-socket-proxy
services:
  app:
    image: linuxserver/socket-proxy:3.4.4@sha256:f93b891db83753b255d2b4ea7a2b43552c1345a6549499928b789d11fd6506c7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/socket-proxy/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserversocketproxy/assets/icon.png
  title:
    en_US: Socket proxy (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserversocketproxy
  port_map: '80'
  version: 3.4.4
