name: linuxserver-d2-builder
services:
  app:
    image: linuxserver/d2-builder:0.6.8@sha256:ea8f88d0b1132234b87fec7a022b2f02b29d556576163639f7ee112044febf92
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
