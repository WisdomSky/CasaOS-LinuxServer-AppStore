name: linuxserver-tvheadend
services:
  app:
    image: linuxserver/tvheadend:version-5ce3ff63@sha256:230bfae75ada92b3765a19dba1b746344f34f1885d01d8e7d5192ee8f629533b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    ports:
      - target: 9981
        published: 9981
        protocol: tcp
      - target: 9982
        published: 9982
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/tvheadend/config
        target: /config
      - type: bind
        source: /DATA/AppData/tvheadend/recordings
        target: /recordings
    devices:
      - /dev/dri:/dev/dri
      - /dev/dvb:/dev/dvb
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservertvheadend/assets/icon.png
  title:
    en_US: Tvheadend (LinuxServer.io)
    zh_CN: Tvheadend（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxservertvheadend
  version: version-5ce3ff63
