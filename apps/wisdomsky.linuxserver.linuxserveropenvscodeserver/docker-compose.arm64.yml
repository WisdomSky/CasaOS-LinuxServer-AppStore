    ru_RU: Openvscode server
    sk_SK: Openvscode server
    sv_SE: Openvscode server
    tr_TR: Openvscode server
    zh_TW: Openvscode server
  port_map: '3000'
  id: wisdomsky.linuxserver.linuxserveropenvscodeserver
  version: 1.109.5
