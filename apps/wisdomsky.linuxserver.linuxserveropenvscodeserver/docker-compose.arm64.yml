    en_US: Openvscode server
    zh_CN: Openvscode server
    ca_ES: Openvscode server
    cs_CZ: Openvscode server
    da_DK: Openvscode server
    de_DE: Openvscode server
    el_GR: Openvscode server
    en_GB: Openvscode server
