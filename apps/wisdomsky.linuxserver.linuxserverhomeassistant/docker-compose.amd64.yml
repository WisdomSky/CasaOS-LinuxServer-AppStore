name: linuxserver-homeassistant
services:
  app:
    image: linuxserver/homeassistant:2026.9.2@sha256:4382c5dcf9cd7d5282cd3198dae6529abcfc8d03f244a5324c9dd8fb0bfac806
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homeassistant/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverhomeassistant/assets/icon.png
  title:
    en_US: Homeassistant (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverhomeassistant
  port_map: '8123'
  version: 2026.9.2
