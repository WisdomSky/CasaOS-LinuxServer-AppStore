name: linuxserver-chromium
services:
  app:
    image: linuxserver/chromium:version-7ac003b2@sha256:698dd7b17d245923d8737eb775703c61a50437e16a5709042f497481fbc760b2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/chromium/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverchromium/assets/icon.png
  title:
    en_US: Chromium (LinuxServer.io)
    zh_CN: Chromium（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverchromium
  port_map: '3000'
  version: version-7ac003b2
