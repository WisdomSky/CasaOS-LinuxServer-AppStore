name: linuxserver-pydio-cells
services:
  app:
    image: linuxserver/pydio-cells:5.0.2@sha256:ff05f66f751b068963c09317caa51a550fe9fd18f1e35b7040ab657a54e0e348
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EXTERNALURL: ''
      SERVER_IP: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverpydiocells/assets/icon.png
  title:
    en_US: Pydio cells (LinuxServer.io)
    zh_CN: Pydio cells（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverpydiocells
  port_map: '8080'
  version: 5.0.2
