name: linuxserver-vivaldi
services:
  app:
    image: linuxserver/vivaldi:8.2.4133@sha256:f31e7a92696be8f6e93080272714067a4e06b480812261c0debcf91c1cb5a271
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservervivaldi/assets/icon.png
  title:
    en_US: Vivaldi (LinuxServer.io)
    zh_CN: Vivaldi（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxservervivaldi
  port_map: '3000'
  version: 8.2.4133
