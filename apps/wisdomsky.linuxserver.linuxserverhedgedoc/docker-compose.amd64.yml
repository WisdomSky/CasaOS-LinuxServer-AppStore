name: linuxserver-hedgedoc
services:
  app:
    image: linuxserver/hedgedoc:1.12.0@sha256:b7e39aeb6b0a3e65c30674cc297d43b67e15cefd8fbb01a1ebad4f756e7bf7db
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_HOST: ''
      DB_PORT: ''
      DB_USER: ''
      DB_PASS: ''
      DB_NAME: ''
      CMD_DOMAIN: ''
      CMD_URL_ADDPORT: ''
      CMD_PROTOCOL_USESSL: ''
      CMD_PORT: ''
      CMD_ALLOW_ORIGIN: ''
      CMD_DB_DIALECT: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hedgedoc/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverhedgedoc/assets/icon.png
  title:
    en_US: Hedgedoc (LinuxServer.io)
    zh_CN: Hedgedoc（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverhedgedoc
  port_map: '3000'
  version: 1.12.0
