name: linuxserver-mstream
services:
  app:
    image: linuxserver/mstream:6.28.1@sha256:98c8397f50eeea9a1d640211ebae80c1c9abf386475353c11a6ac554b2b75d46
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/AppData/mstream/music
        target: /music
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermstream/assets/icon.png
  title:
    en_US: Mstream (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservermstream
  port_map: '3000'
  version: 6.28.1
