name: linuxserver-mastodon
services:
  app:
    image: linuxserver/mastodon:4.7.2@sha256:720f07ae6d0c9dd04fa42db9a5fc5fe16a1a3959823ee302d00bc2d22e25e76c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOCAL_DOMAIN: ''
      REDIS_HOST: ''
      REDIS_PORT: ''
      DB_HOST: ''
      DB_USER: ''
      DB_NAME: ''
      DB_PASS: ''
      DB_PORT: ''
      ES_ENABLED: ''
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ''
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ''
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ''
      SECRET_KEY_BASE: ''
      OTP_SECRET: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      SMTP_SERVER: ''
      SMTP_PORT: ''
      SMTP_LOGIN: ''
      SMTP_PASSWORD: ''
      SMTP_FROM_ADDRESS: ''
      S3_ENABLED: ''
      WEB_DOMAIN: ''
      ES_HOST: ''
      ES_PORT: ''
      ES_USER: ''
      ES_PASS: ''
      S3_BUCKET: ''
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      S3_ALIAS_HOST: ''
      SIDEKIQ_ONLY: ''
      SIDEKIQ_QUEUE: ''
      SIDEKIQ_DEFAULT: ''
      SIDEKIQ_THREADS: ''
      DB_POOL: ''
      NO_CHOWN: ''
      MASTODON_PROMETHEUS_EXPORTER_ENABLED: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
      - target: 9394
        published: 9394
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mastodon/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservermastodon/assets/icon.png
  title:
    en_US: Mastodon (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservermastodon
  port_map: '80'
  version: 4.7.2
