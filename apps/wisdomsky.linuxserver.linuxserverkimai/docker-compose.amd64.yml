name: linuxserver-kimai
services:
  app:
    image: linuxserver/kimai:2.67.0@sha256:f16e009891896ac1b6f2336016da35c2a92a10a2dff1ee4df368484ce9be0057
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverkimai/assets/icon.png
  title:
    en_US: Kimai (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverkimai
  port_map: '80'
  version: 2.67.0
