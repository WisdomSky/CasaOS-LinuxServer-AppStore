name: linuxserver-libreoffice
services:
  app:
    image: linuxserver/libreoffice:25.8.7@sha256:c9e0cc60b75b35b7ddd3e719c4c3f46f1ffc5e770c14bf120a5e85395a7790d5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverlibreoffice/assets/icon.png
  title:
    en_US: Libreoffice (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverlibreoffice
  port_map: '3000'
  version: 25.8.7
