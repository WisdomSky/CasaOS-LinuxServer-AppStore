name: linuxserver-nzbhydra2
services:
  app:
    image: linuxserver/nzbhydra2:8.9.0@sha256:861067cdad7d9b438d39bdf680bcad9b61fcc8eff52547a710b783d7552d2cdf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 5076
        published: 5076
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nzbhydra2/config
        target: /config
      - type: bind
        source: /DATA/AppData/nzbhydra2/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservernzbhydra2/assets/icon.png
  title:
    en_US: Nzbhydra2 (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservernzbhydra2
  port_map: '5076'
  version: 8.9.0
