name: linuxserver-lollypop
services:
  app:
    image: linuxserver/lollypop:1.4.45@sha256:ac0dfd8e3064b00e9a7b7dbef1687efe48ee2d72db87d99e6e78eb54bd2fd30a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
