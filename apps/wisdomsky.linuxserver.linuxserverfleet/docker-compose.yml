name: linuxserver-fleet
services:
  app:
    image: linuxserver/fleet:2.3.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      fleet_admin_authentication_type: ''
      fleet_database_url: ''
      fleet_database_username: ''
      fleet_database_password: ''
      fleet_admin_secret: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/fleet/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverfleet/assets/icon.svg
  title:
    en_US: Fleet
    zh_CN: Fleet
    ca_ES: Fleet
    cs_CZ: Fleet
    da_DK: Fleet
    de_DE: Fleet
    el_GR: Fleet
    en_GB: Fleet
    es_ES: Fleet
    fr_FR: Fleet
    ga_IE: Fleet
    hr_HR: Fleet
    hu_HU: Fleet
    it_IT: Fleet
    ja_JP: Fleet
    ko_KR: Fleet
    ml_IN: Fleet
    nb_NO: Fleet
    nl_NL: Fleet
    pl_PL: Fleet
    pt_BR: Fleet
    ro_RO: Fleet
