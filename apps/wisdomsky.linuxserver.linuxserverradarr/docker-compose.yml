name: linuxserver-radarr
services:
  app:
    image: linuxserver/radarr:6.4.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 7878
        published: 7878
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/radarr/config
        target: /config
      - type: bind
        source: /DATA/AppData/radarr/movies
        target: /movies
      - type: bind
        source: /DATA/AppData/radarr/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverradarr/assets/icon.png
  title:
    en_US: Radarr (LinuxServer.io)
    zh_CN: Radarr（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverradarr
  port_map: '7878'
  version: 6.4.4
