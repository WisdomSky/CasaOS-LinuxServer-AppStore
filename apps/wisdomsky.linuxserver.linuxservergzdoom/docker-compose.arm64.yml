name: linuxserver-gzdoom
services:
  app:
    image: linuxserver/gzdoom:4.14.2@sha256:2a9824be7a2cdb95ae22d6a617aded69688d0d94b32674af139dfad49572b775
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservergzdoom/assets/icon.png
  title:
    en_US: Gzdoom (LinuxServer.io)
    zh_CN: Gzdoom（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxservergzdoom
  port_map: '3000'
  version: 4.14.2
