name: linuxserver-ffmpeg
services:
  app:
    image: linuxserver/ffmpeg:8.1.2@sha256:9f7a9511290f8fc432a67bba93306938158f138d2da202445a1fca4103a693d2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
x-casaos:
