name: linuxserver-ffmpeg
services:
  app:
    image: linuxserver/ffmpeg:8.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverffmpeg/assets/icon.png
  title:
    en_US: Ffmpeg (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverffmpeg
  port_map: '80'
  version: 8.1.2
