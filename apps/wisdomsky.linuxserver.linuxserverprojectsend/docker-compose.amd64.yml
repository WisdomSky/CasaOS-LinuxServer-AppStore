name: linuxserver-projectsend
services:
  app:
    image: linuxserver/projectsend:version-r2098@sha256:9bc5ca136407fc999847a4e9c89fd95ff2d9182a2435a2b8e187115c7ad22a7a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/projectsend/config
        target: /config
      - type: bind
        source: /DATA/AppData/projectsend/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverprojectsend/assets/icon.png
  title:
    en_US: Projectsend (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverprojectsend
  port_map: '80'
  version: version-r2098
