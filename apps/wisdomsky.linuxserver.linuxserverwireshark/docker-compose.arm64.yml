name: linuxserver-wireshark
services:
  app:
    image: linuxserver/wireshark:4.6.6@sha256:fcab87af7358809b71d944553ee9a9ab8cb280f1058e382bd11038c6d01c70a0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverwireshark/assets/icon.png
  title:
    en_US: Wireshark (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverwireshark
  port_map: '80'
  version: 4.6.6
