name: linuxserver-lsio-api
services:
  app:
    image: linuxserver/lsio-api:version-9eda67ec@sha256:925092e5a2580cfcfb550f622771d000b27f2508406dac4f6e5cb4badebc8f42
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lsio-api/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverlsioapi/assets/icon.svg
  title:
    en_US: Lsio api
  port_map: '80'
  id: wisdomsky.linuxserver.linuxserverlsioapi
  version: version-9eda67ec
