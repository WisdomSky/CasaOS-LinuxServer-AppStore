name: linuxserver-apprise-api
services:
  app:
    image: linuxserver/apprise-api:1.5.4@sha256:bf2146dca24b0f1f4d1cf1ee8dd02f457e6ebfd22ba45e1d3b406ded8a0444f7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverappriseapi/assets/icon.png
  title:
    en_US: Apprise api (LinuxServer.io)
    zh_CN: Apprise api（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverappriseapi
  port_map: '8000'
  version: 1.5.4
