name: linuxserver-apprise-api
services:
  app:
    image: linuxserver/apprise-api:1.5.4@sha256:d639addc3ffb7d0020cd2aa992ac9d7042f263505fef0baa559d199cbb5526ff
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverappriseapi/assets/icon.png
  title:
    en_US: Apprise api (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverappriseapi
  port_map: '8000'
  version: 1.5.4
