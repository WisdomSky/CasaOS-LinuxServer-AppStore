name: linuxserver-tautulli
services:
  app:
    image: linuxserver/tautulli:2.18.1@sha256:aec09141568176b02cf5d4c1cf83377d7aac2f6bca35838bb6a70655a2ee9c22
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8181
        published: 8181
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/tautulli/config
        target: /config
