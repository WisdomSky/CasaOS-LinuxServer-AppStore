name: linuxserver-qdirstat
services:
  app:
    image: linuxserver/qdirstat:2.0.20260913@sha256:7e81d874d6b313b4d03fe136e3a12f4585ec502e75ce4f6e57442407dbeda947
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverqdirstat/assets/icon.png
  title:
    en_US: Qdirstat (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverqdirstat
  port_map: '3000'
  version: 2.0.20260913
