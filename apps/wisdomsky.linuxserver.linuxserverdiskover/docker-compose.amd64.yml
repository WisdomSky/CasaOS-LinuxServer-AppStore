name: linuxserver-diskover
services:
  app:
    image: linuxserver/diskover:2.3.5@sha256:9d19e97c59f2381028f3bb35549acb2b4301a9e1dc730c267b54403a4ad2a2a8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/diskover/config
        target: /config
      - type: bind
        source: /DATA/AppData/diskover/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverdiskover/assets/icon.png
  title:
    en_US: Diskover (LinuxServer.io)
    zh_CN: Diskover（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverdiskover
  port_map: '80'
  version: 2.3.5
