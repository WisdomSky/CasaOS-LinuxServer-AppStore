name: linuxserver-diskover
services:
  app:
    image: linuxserver/diskover:2.3.5@sha256:cbdde832a83821485c3756197f46a14f253e98741ef92e77303c4b9d95fd0c2d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/diskover/config
        target: /config
      - type: bind
        source: /DATA/AppData/diskover/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverdiskover/assets/icon.png
  title:
    en_US: Diskover (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverdiskover
  port_map: '80'
  version: 2.3.5
