name: linuxserver-sickgear
services:
  app:
    image: linuxserver/sickgear:3.36.6@sha256:4ad44535fdb20bb3ebabeb4f1a489a1aca5d2f695c65bdf1780f8a6668ae1c9b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sickgear/config
        target: /config
      - type: bind
        source: /DATA/AppData/sickgear/tv
        target: /tv
      - type: bind
        source: /DATA/AppData/sickgear/downloads
        target: /downloads
