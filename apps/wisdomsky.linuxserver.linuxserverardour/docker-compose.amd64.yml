name: linuxserver-ardour
services:
  app:
    image: linuxserver/ardour:version-2026-06-19@sha256:d482dc4ba93c0e8e71cd78e3beb6584fc5868496067e78e89ed07cb3f5cfdea4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ardour/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverardour/assets/icon.png
  title:
    en_US: Ardour (LinuxServer.io)
    zh_CN: Ardour（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverardour
  port_map: '3000'
  version: version-2026-06-19
