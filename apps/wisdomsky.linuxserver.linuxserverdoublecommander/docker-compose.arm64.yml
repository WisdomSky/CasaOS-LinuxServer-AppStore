name: linuxserver-doublecommander
services:
  app:
    image: linuxserver/doublecommander:version-8143f818@sha256:288b16063f452bd47d40d0a450fc4f300162d411f9f22f77c4bc5f094c81e53f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/doublecommander/config
        target: /config
      - type: bind
        source: /DATA/AppData/doublecommander/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverdoublecommander/assets/icon.png
  title:
    en_US: Doublecommander (LinuxServer.io)
    zh_CN: Doublecommander（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverdoublecommander
  port_map: '3000'
  version: version-8143f818
