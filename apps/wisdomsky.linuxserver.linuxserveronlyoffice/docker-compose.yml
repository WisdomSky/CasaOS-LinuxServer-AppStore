name: linuxserver-onlyoffice
services:
  app:
    image: linuxserver/onlyoffice:9.4.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/onlyoffice/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserveronlyoffice/assets/icon.png
  title:
    en_US: Onlyoffice (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserveronlyoffice
  port_map: '3000'
  version: 9.4.0
