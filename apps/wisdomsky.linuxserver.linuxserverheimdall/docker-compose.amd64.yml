name: linuxserver-heimdall
services:
  app:
    image: linuxserver/heimdall:2.8.3@sha256:6f1d5d7c03c81b2a78ee1fec3f82bd522ed9787ec11009ed58f85b3d15caea06
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverheimdall/assets/icon.png
  title:
    en_US: Heimdall (LinuxServer.io)
    zh_CN: Heimdall（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverheimdall
  port_map: '80'
  version: 2.8.3
