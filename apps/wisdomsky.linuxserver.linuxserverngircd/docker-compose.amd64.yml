name: linuxserver-ngircd
services:
  app:
    image: linuxserver/ngircd:version-27-r1@sha256:25983b264c52d4a8a8c1808c1f4ed5ee636e663051d9032f3b9945b2f4e945fc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6667
        published: 6667
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverngircd/assets/icon.png
  title:
    en_US: Ngircd (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverngircd
  port_map: '6667'
  version: version-27-r1
