name: linuxserver-raneto
services:
  app:
    image: linuxserver/raneto:0.18.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverraneto/assets/icon.png
  title:
    en_US: Raneto (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverraneto
  port_map: '3000'
  version: 0.18.1
