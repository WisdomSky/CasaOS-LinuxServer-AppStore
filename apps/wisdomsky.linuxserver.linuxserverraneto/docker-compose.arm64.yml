name: linuxserver-raneto
services:
  app:
    image: linuxserver/raneto:0.18.1@sha256:33db4b0b1b761d010aeda04e06795a8615bc3ae9773a746321bb6051acdb3c58
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverraneto/assets/icon.png
  title:
    en_US: Raneto (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverraneto
  port_map: '3000'
  version: 0.18.1
