name: linuxserver-beets
services:
  app:
    image: linuxserver/beets:2.14.1@sha256:3c3fce8fcb7371585ccbd0423106c8f1bd66b2bd5b49fd6d95ec9e3a25cd6be6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8337
        published: 8337
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/beets/config
        target: /config
      - type: bind
        source: /DATA/AppData/beets/music
        target: /music
      - type: bind
        source: /DATA/AppData/beets/downloads
        target: /downloads
