name: linuxserver-beets
services:
  app:
    image: linuxserver/beets:2.14.0@sha256:adaaf7823c4f0cbc8f1bd9d3f172c600f7c16da7c39812112588ee0b1d7b807b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8337
        published: 8337
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/beets/config
        target: /config
      - type: bind
        source: /DATA/AppData/beets/music
        target: /music
      - type: bind
        source: /DATA/AppData/beets/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverbeets/assets/icon.png
  title:
    en_US: Beets (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverbeets
  port_map: '8337'
  version: 2.14.0
