name: linuxserver-calligra
services:
  app:
    image: linuxserver/calligra:3.2.1@sha256:cd9bbaae5d26e1be4f763328d6aacb5ab0cce201c7ccb2fd496136c7ea6c115f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercalligra/assets/icon.png
  title:
    en_US: Calligra (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercalligra
  port_map: '3000'
  version: 3.2.1
