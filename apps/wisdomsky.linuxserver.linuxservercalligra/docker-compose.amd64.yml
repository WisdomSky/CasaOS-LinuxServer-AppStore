name: linuxserver-calligra
services:
  app:
    image: linuxserver/calligra:3.2.1@sha256:b7154cb3d874dd6492c1ba99703a93eecd56e69f660d6bdc0be196f9cd60c6ef
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercalligra/assets/icon.png
  title:
    en_US: Calligra (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercalligra
  port_map: '3000'
  version: 3.2.1
