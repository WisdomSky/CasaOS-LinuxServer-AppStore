name: linuxserver-calligra
services:
  app:
    image: linuxserver/calligra:3.2.1@sha256:8384640e92b504bfaa3b34c587b221bc57b4d94791ecf884dbb2c104cd844ab7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
x-casaos:
