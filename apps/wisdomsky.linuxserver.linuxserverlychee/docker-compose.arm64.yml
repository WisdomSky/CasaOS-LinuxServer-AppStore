name: linuxserver-lychee
services:
  app:
    image: linuxserver/lychee:7.8.3@sha256:f766a376b4645876afcc104273b3ad737e5f5aad2e51523b4e4b2c8fa76cf1f2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_CONNECTION: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      APP_NAME: ''
      APP_URL: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lychee/config
        target: /config
      - type: bind
        source: /DATA/AppData/lychee/pictures
        target: /pictures
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverlychee/assets/icon.png
  title:
    en_US: Lychee (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverlychee
  port_map: '80'
  version: 7.8.3
