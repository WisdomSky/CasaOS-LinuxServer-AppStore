name: linuxserver-piwigo
services:
  app:
    image: linuxserver/piwigo:16.4.0@sha256:28e47cce69c680c4245eccd559bf3bdda07712b531bef212aa9645107af978b2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/piwigo/config
        target: /config
      - type: bind
        source: /DATA/AppData/piwigo/gallery
        target: /gallery
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverpiwigo/assets/icon.png
  title:
    en_US: Piwigo (LinuxServer.io)
    zh_CN: Piwigo（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverpiwigo
  port_map: '80'
  version: 16.4.0
