name: linuxserver-filezilla
services:
  app:
    image: linuxserver/filezilla:3.69.6@sha256:7e8c336cdda0b26d02317f0d1322c29ef1bde8cf66de53eec26e5e242ab453a2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverfilezilla/assets/icon.png
  title:
    en_US: Filezilla (LinuxServer.io)
    zh_CN: Filezilla（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverfilezilla
  port_map: '3000'
  version: 3.69.6
