name: linuxserver-webstation
services:
  app:
    image: linuxserver/webstation:0.8.4-romm
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverwebstation/assets/icon.png
  title:
    en_US: Webstation (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverwebstation
  port_map: '3000'
  version: 0.8.4-romm
