    cs_CZ: Yq
    da_DK: Yq
    de_DE: Yq
    el_GR: Yq
    en_GB: Yq
    es_ES: Yq
    fr_FR: Yq
    ga_IE: Yq
    hr_HR: Yq
    hu_HU: Yq
    it_IT: Yq
    ja_JP: Yq
    ko_KR: Yq
    ml_IN: Yq
    nb_NO: Yq
    nl_NL: Yq
    pl_PL: Yq
