name: linuxserver-znc
services:
  app:
    image: linuxserver/znc:1.10.3@sha256:02604b3a0cb1f936158cf4392ee93272e1479ab8c1440b7a28ed01628583f0a5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6501
        published: 6501
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
