name: linuxserver-readme-sync
services:
  app:
    image: linuxserver/readme-sync:84f2d0c3-ls27
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/readme-sync/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverreadmesync/assets/icon.svg
  title:
    en_US: Readme sync
  port_map: '80'
  id: wisdomsky.linuxserver.linuxserverreadmesync
  version: 84f2d0c3-ls27
