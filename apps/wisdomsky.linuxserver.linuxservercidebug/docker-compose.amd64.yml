    image: linuxserver/ci-debug:933e2702-ls1@sha256:6dd54ec8e8269db38c9e5d90264b38322f87b79f6824236871d4e3a29f50e154
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
