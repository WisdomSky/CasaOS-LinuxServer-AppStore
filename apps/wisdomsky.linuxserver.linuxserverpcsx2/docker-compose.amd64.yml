name: linuxserver-pcsx2
services:
  app:
    image: linuxserver/pcsx2:2.8.2@sha256:4b147c6ba0df13f14526466b4f8ffe950cc3f4da1f50862a8dea3150907a48b9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
x-casaos:
