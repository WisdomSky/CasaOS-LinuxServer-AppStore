name: linuxserver-pcsx2
services:
  app:
    image: linuxserver/pcsx2:2.8.2@sha256:076e59198cf591748bef182b5fb7288c80b6cf077171e64e502d18c8c9144ed1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverpcsx2/assets/icon.png
  title:
    en_US: Pcsx2 (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverpcsx2
  port_map: '3000'
  version: 2.8.2
