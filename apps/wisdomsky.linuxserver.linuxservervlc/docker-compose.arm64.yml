name: linuxserver-vlc
services:
  app:
    image: linuxserver/vlc:3.0.23@sha256:48a411e840def383a81d832f923b20cdea1f55493737e4cde63c7b6bea572b28
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservervlc/assets/icon.png
  title:
    en_US: Vlc (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservervlc
  port_map: '3000'
  version: 3.0.23
