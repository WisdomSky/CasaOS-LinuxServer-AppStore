name: linuxserver-azahar
services:
  app:
    image: linuxserver/azahar:12125.1.3@sha256:b111e066d6b7bf7c78392a221e2cea50640febafd06b32ec02d90406de424a35
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/azahar/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverazahar/assets/icon.png
  title:
    en_US: Azahar (LinuxServer.io)
    zh_CN: Azahar（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserverazahar
  port_map: '3000'
  version: 12125.1.3
