name: linuxserver-sabnzbd
services:
  app:
    image: linuxserver/sabnzbd:5.1.3@sha256:233ff4920504ea316eb44b4e0b76e4f6df4db964ff0e30951a54939cda57e6ad
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sabnzbd/config
        target: /config
      - type: bind
        source: /DATA/AppData/sabnzbd/incomplete-downloads
        target: /incomplete-downloads
      - type: bind
        source: /DATA/AppData/sabnzbd/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserversabnzbd/assets/icon.png
  title:
    en_US: Sabnzbd (LinuxServer.io)
    zh_CN: Sabnzbd（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxserversabnzbd
  port_map: '8080'
  version: 5.1.3
