name: linuxserver-grocy
services:
  app:
    image: linuxserver/grocy:4.7.1@sha256:c54539a496ec3b53c88adb590311ee2104a2a509a1855ad95e4e27049d72c5af
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 9283
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservergrocy/assets/icon.png
  title:
    en_US: Grocy (LinuxServer.io)
    zh_CN: Grocy（LinuxServer.io）
  id: wisdomsky.linuxserver.linuxservergrocy
  port_map: '80'
  version: 4.7.1
