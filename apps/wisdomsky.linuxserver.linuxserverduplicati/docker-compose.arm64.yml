name: linuxserver-duplicati
services:
  app:
    image: linuxserver/duplicati:2.4.0@sha256:4796f65b9683c4a45660482584857085d107b7e8da549937d1f0d09defb5ef37
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SETTINGS_ENCRYPTION_KEY: ''
      CLI_ARGS: ''
      DUPLICATI__WEBSERVICE_PASSWORD: ''
    ports:
      - target: 8200
        published: 8200
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duplicati/config
        target: /config
      - type: bind
        source: /DATA/AppData/duplicati/backups
        target: /backups
      - type: bind
        source: /DATA/AppData/duplicati/source
        target: /source
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverduplicati/assets/icon.png
  title:
    en_US: Duplicati (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverduplicati
  port_map: '8200'
  version: 2.4.0
