name: linuxserver-domoticz
services:
  app:
    image: linuxserver/domoticz:2023.2.20231129@sha256:29eeac689439899f4d3521273a8bb7cf434de2f3b8300e2abfd368555a099a8f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBROOT: ''
      DBASE: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 6144
        published: 6144
        protocol: tcp
      - target: 1443
        published: 1443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/domoticz/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverdomoticz/assets/icon.png
  title:
    en_US: Domoticz
  port_map: '8080'
  id: wisdomsky.linuxserver.linuxserverdomoticz
  version: 2023.2.20231129
