name: linuxserver-inkscape
services:
  app:
    image: linuxserver/inkscape:1.4.2@sha256:c1cb3e7c6fbfc616dd3f4bcca5ce09d6213b870b461a83b1e87323d62ae5dfe2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverinkscape/assets/icon.png
  title:
    en_US: Inkscape (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverinkscape
  port_map: '3000'
  version: 1.4.2
