name: linuxserver-minetest
services:
  app:
    image: linuxserver/minetest:5.10.0@sha256:462b94bececc3788866d980953ee393e27afb06b1fc5a3eebfbb7498a3fa8f0c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/minetest/config/.minetest
        target: /config/.minetest
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverminetest/assets/icon.png
  title:
    en_US: Minetest
  id: wisdomsky.linuxserver.linuxserverminetest
  version: 5.10.0
