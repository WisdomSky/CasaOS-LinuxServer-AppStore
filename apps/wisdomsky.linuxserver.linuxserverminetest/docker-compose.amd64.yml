name: linuxserver-minetest
services:
  app:
    image: linuxserver/minetest:5.10.0@sha256:85bb5acc2b000b1a86fb7ec427e5ab8c221ec2d62f6c9c858d01bc886f1a9ab1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/minetest/config/.minetest
        target: /config/.minetest
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverminetest/assets/icon.png
  title:
    en_US: Minetest
    zh_CN: Minetest
  id: wisdomsky.linuxserver.linuxserverminetest
  version: 5.10.0
