name: linuxserver-orcaslicer
services:
  app:
    image: linuxserver/orcaslicer:2.4.2@sha256:ecb4d0b24aea830439864970ad62889e0e932d01527f653f1010ffdb20b875e5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverorcaslicer/assets/icon.png
  title:
    en_US: Orcaslicer (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverorcaslicer
  port_map: '3000'
  version: 2.4.2
