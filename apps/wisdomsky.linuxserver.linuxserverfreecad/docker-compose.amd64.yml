name: linuxserver-freecad
services:
  app:
    image: linuxserver/freecad:1.1.3@sha256:654047bdfc5259623f47c36e6ad0fe3683193851ec91a5f43d6acac3a18a2544
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserverfreecad/assets/icon.png
  title:
    en_US: Freecad (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserverfreecad
  port_map: '3000'
  version: 1.1.3
